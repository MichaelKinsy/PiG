# SPDX-License-Identifier: MIT
#
# The packages a release binary may link, read by test/perfgate TestReleaseBinaryLinksOnlyAllowedPackages from the symbol table of an unstripped build of each target.
# The size ceilings in ratchet.toml say that a binary grew; this file says which package made it grow. The linker removes code that nothing calls, so a package that is in the dependency graph costs nothing until a call reaches it, and then all of it comes into the binary (0.7.1: one call from the TypeBox check path made a vendored JSON Schema validator live, +766 KB).
#
# - A package that is not in the Go distribution and has at least heavy_bytes of symbols in a binary must be in that binary's allow list. A package that crosses the line fails the test with its name; `go run ./automation/ci/sizereport -why <package>` prints the chain of references that keeps it. Remove the call that reaches it. A third-party package joins the list only with the owner's approval; a package under `third_party/` counts as third-party. A package of PiG itself needs no approval, but it joins the list only in the commit that makes it that large, and that commit message gives the size report (AGENTS.md, Binary size and dependencies).
# - A package on the list that no target links as heavyweight any more fails the test too, so the list only shrinks.
# - A package in a forbid table must not be linked at all, whatever its size. The value says why.
# `go run ./automation/ci/sizereport -goos <os> -goarch <arch> -allowlist 32768` prints the packages of one target in this format.

heavy_bytes = 32768
targets = ["linux_amd64", "darwin_arm64", "windows_amd64"]

