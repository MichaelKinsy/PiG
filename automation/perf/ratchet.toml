# process: anonymous memory (smaps_rollup Anonymous: heap, stacks, written data) when RPC mode has answered its first command (TestRPCReadyMemoryGate; rpi's "RSS at ready"). The ceiling is the owner's choice of gated figure over RSS and PSS, which also count the binary's page-cache pages and so moved 42.5-47.4 MB between runs of one binary on one idle host (5 of 24 runs over the old 46 MB ceiling). Measured on the Linux lab host (linux/amd64, 4-CPU container, kernel THP policy "madvise", Go 1.27.3, PIG_TEST_FAUX, GOMAXPROCS=1): 40 idle runs 3,903,488-4,014,080 B and 40 runs beside 12 busy loops 3,883,008-4,026,368 B; the ceiling is the largest of them plus 12%, rounded up to 0.5 MB. The test process turns transparent huge pages off for the processes it starts (perfgate.DisableTransparentHugePages), because GitHub's ubuntu-24.04 runners (kernel 6.17 azure, AMD EPYC 7763, 4 vCPU) use THP "always", where the same binary held 6.3 MB of its anonymous memory in huge pages and measured 5.65-7.82 MB (the ceiling failure in CI: 7,770,112 B); with THP off there, 50 gate runs (20 idle, 20 beside 4 busy loops, 10 beside a module-wide go vet) measured 3,948,544-4,034,560 B, and the lab host measured 3,878,912-4,014,080 B (20 + 20 runs) with the setting too. The ceiling did not change: the difference was the host's page size policy, not the code. A measured process that still has AnonHugePages fails the gate instead of being compared. RSS, PSS and peak RSS are still logged and recorded (scoreboard-measured.json), not gated.
"process.rpc_ready.anon_bytes" = 4500000
