# Count ceilings for the performance gates (internal/perfgate), measured on linux/amd64 with the toolchain in go.mod; the gate tests build only on linux. Every ceiling is a count that does not depend on machine speed: allocations, bytes, GC cycles, goroutines, descriptors, child processes or file sizes.
# A ceiling only moves down. Lower it in the change that lowers the count; `python3 automation/perf/scoreboard.py --ratchet-base <ref>` rejects a raise. docs/performance/scoreboard.md lists each metric with its measured value, target and owner.

[ceilings]

