# gc_cycles lowered to 0 by D175 (print runs collect at GOGC 400 unless GOGC is set): 0 GC cycles and 107 goroutines created in every run at fb18cdb01b + F1b on the Linux lab host, against 2 GC cycles and 107 at GOGC=100. goroutines_created stays: with no GC cycle it rose to 191 until refresh signals shared one forwarder per caller (4f9ee731bd).
# goroutines_created raised 114 -> 118 with the owner's approval (2026-10-25): PIG_TEST_FAUX registers the harness's test-faux provider through the model registry, as Pi's parity harness registers it from an extension, so the run carries one more registered provider and its deferred registration refresh pass (the pass goroutine plus the new provider's refresh and auth-check operations). Measured on the Linux lab host, print_tools: 114 -> 118, allocs 47,225 and bytes 8,291,424 stay under their ceilings. Production runs (no PIG_TEST_FAUX) are unchanged. Profiles: alloc_objects diff of a warm print run, branch fix/faux-footer-prefix against main (xd670 ~/tern-v5/trees/faux-reg/tmp/prof1, ~/tern-v5/trees/faux-main/tmp/prof0).
# goroutines_created raised 118 -> 119 (2026-10-31, for a measured intended cost): Pi 31ade0e0 (#10947), carried by da12a5a16b (merged by 6cf713c20b), reads the saved project trust decision before auto-trusting a project without trust-requiring resources (`trustStore.get(cwd) ?? !hasTrustRequiringResources`), which the print run's folder is. The read takes the trust.json directory lock (codingagent.ProjectTrustStore.GetEntry -> pilock.AcquireSync), and a held lock runs one heartbeat goroutine (internal/pilock/lock.go `go lock.heartbeat`), as proper-lockfile arms one update timer for the same lock in Pi. Measured on the Linux amd64 CI host, print_tools: 118 -> 119 between a59abb7e5 and da12a5a16b with the commits before and after bisected one by one; allocs 56,741 and bytes 9,831,880 stay under their ceilings.
# goroutines_created raised 119 -> 120 (2026-11-10, owner-approved, for a measured intended cost): the D175 live-heap watcher. A print run's fallback to GOGC 100 past 64 MiB live now reads /gc/heap/live:bytes from one goroutine (internal/gcpolicy watchLiveHeap, started by gcpolicy.Apply) instead of a runtime.AddCleanup chain, because a cleanup runs at sweep and the collection that found a large heap could be skipped (TestPrintModeGCTargetFallsBackOnLargeHeap exited at GC percent 400 in CI run 42725996591, and in 6 of 80 runs under load at 2212c78d91). The cleanup chain added no goroutine of its own: the run already has the runtime's cleanup goroutine from other AddCleanup users. Measured on the Linux amd64 lab host, print_tools: 119 at cb96ec94dce and 120 with the watcher, 3 of 3 runs each (RevGogcFallback, test/perfgate TestPrintReadToolsProcessGate); allocs and bytes are unchanged and gc_cycles stays 0.
