[[plan]]
gap = "Streaming Markdown re-lexes the whole message on every token: 289 allocations per token averaged over a 200-token message, and the average grows by 135 for each further 100 tokens (tui.stream_frame), so one frame costs about 2.7 allocations per token already in the message: about 5,400 at token 2,000."
plan = "Cache the rendered lines of completed top-level blocks keyed by their source prefix and re-lex only from the last block boundary, falling back to a full render where a later line can change an earlier block (lazy continuation, setext headings, reference definitions). Prove identity against the full render on the Markdown corpus."
gain = "constant allocations per token (about 60) at any message length"
techniques = []
route = "go-native-perf"

[[plan]]
gap = "Each provider SSE record costs 60 to 120 allocations (ai.provider_frame.*), nearly half of them in the JavaScript continuation emulation (continuationPromise.onResolved, awaitContinuation, continuationEventIterator), then raw-JSON value decode and a clone per delivered event; a tool-call argument delta costs 36 allocations and 3.4 KB, and the frame reducer's catch-up path re-parses the whole argument text per delta (ai/assistant_message_frame.go:405)."
plan = "Reuse one continuation cell per stream consumer, keeping the exact microtask order; decode records with typed or jsontext codecs and rerun every golden with and without GOEXPERIMENT=nojsonv2 (-0, ints above 2^53, invalid UTF-8, lone surrogates, U+2028/2029 checked against Node); resumable argument parse on the catch-up path; copy-on-write snapshots."
gain = "about half the allocations per frame on every provider; tool-call deltas near the text-delta cost"
techniques = ["T3"]
route = "go-native-perf"

[[plan]]
gap = "Child processes have no tree containment and no adversarial gate: the exit-state gates see zero children on the faux paths, but nothing exercises a child that ignores SIGTERM, double-forks, holds stdout or re-execs; goroutine leak profiles run in one package only."
plan = "One spawn path: Setpgid and group kill on Unix, Job Object KILL_ON_JOB_CLOSE on Windows, a non-zero WaitDelay on every Cmd, a re-exec depth guard, Pdeathsig only with LockOSThread, stdin close then SIGTERM then SIGKILL to the group, always Wait; cgroup pids.max where available; adversarial fixtures with descendants and zombies 0 and descriptors at baseline; Go 1.27 goroutineleak in TestMain of the packages that start goroutines."
gain = "zero orphans and zombies under faults, measured by the adversarial fixtures"
techniques = ["T4", "T7"]
route = "spawn-containment (requested); go-native-perf for the goroutineleak TestMains"

