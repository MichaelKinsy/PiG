# SPDX-License-Identifier: MIT
#
# The performance scoreboard registry. `make perf-scoreboard` renders docs/performance/scoreboard.md from this file, automation/perf/ratchet.toml (gate ceilings) and automation/perf/scoreboard-measured.json (the counts `make perf-scoreboard-measure` collects from the gates).
#
# A gate is one of:
#   { ratchet = "<id>" }                      a count ceiling in ratchet.toml; the measured value comes from the gate's perfgate line
#   { test = "<pkg dir>:<TestName>" }         an existing gate with an inline ceiling or invariant; the generator verifies the function exists
#   { branch = "<lane>", path = "<file>" }    a gate that exists on another lane's branch and not in this tree
#   { missing = "<what>", route = "<lane>" }  a gate that does not exist yet
# Targets state what a hand-written Rust or C program doing the same observable work would plausibly reach, and the basis of that estimate. Time values are never measured on a shared host: they come only from the cluster with the exact-CV gate, and stay out of this file.

# Gate tests that print perfgate lines, run by `make perf-scoreboard-measure`.
[[measure]]
pkg = "./ai"
run = "^(TestStreamBuilderPerDeltaAllocationGate|TestProviderStreamPerFrameAllocationGate|TestToolSchemaMarshalAllocationGate|TestProviderResponseAllocationGate|TestProviderRequestHistoryAllocationGate|TestToolCallArgumentsPerDeltaAllocationGate|TestContextToolResultDetailsAllocationGate|TestGrammarToolInputPerDeltaAllocationGate)$"
[[measure]]
pkg = "./agent"
run = "^TestStreamProxyPerDeltaAllocationGate$"
[[measure]]
pkg = "./coding"
run = "^TestStreamWakesPerDelta$"
[[measure]]
pkg = "./tui"
run = "^(TestKeystrokeToFrameAllocationGate|TestStreamingMarkdownFrameAllocationGate|TestKeystrokeGCCyclesGate|TestTree.*ScalingGate)$"
[[measure]]
pkg = "./ai"
run = "^(TestToolEstimateScalingGate|TestProviderRequestToolsScalingGate)$"
[[measure]]
pkg = "./coding/extension/host/inproc"
run = "ScalingGate$"
[[measure]]
pkg = "./tui/internal/hljs"
run = "^TestGrammarLoadAllocationGate$"
[[measure]]
pkg = "./internal/codingagent"
run = "^(TestSessionLoadPerLineAllocationGate|TestSessionTurnAllocationGate|TestInteractiveToolArgumentsPerDeltaAllocationGate)$"
[[measure]]
pkg = "./internal/codingagent/compaction"
run = "^TestCompactionPreparePerEntryAllocationGate$"
[[measure]]
pkg = "./coding/extension/host/subprocess"
run = "^TestExtensionEventRoundTripAllocationGate$"
[[measure]]
pkg = "./test/perfgate"
run = "."
[[measure]]
pkg = "./test/integration"
run = "^TestInteractiveFirstFrameProcessGate$"
tags = "integration"

# ---------------------------------------------------------------- startup

[[metric]]
id = "startup.first_frame"
area = "startup"
title = "Interactive start to first ready frame, then exit"
impact = 5
owner = "go-native-perf"
target = "under 30,000 allocations and 4 MB allocated; under 15 ms cold to first frame"
basis = "A Rust TUI start reads settings, auth and the model catalog, then draws one frame: tens of thousands of small allocations at most, with the catalog in a static table. The -p path already does a whole turn in about 35,000 allocations, so most of the interactive path's extra 62,000 are avoidable. The cold time target is the 10 ms start of xlang.startup_endpoints plus one frame."
gates = [
  { ratchet = "process.interactive_first_frame.allocs" },
  { ratchet = "process.interactive_first_frame.bytes" },
  { ratchet = "process.interactive_first_frame.heap_live_bytes" },
  { ratchet = "process.interactive_first_frame.children_at_exit" },
  { ratchet = "tui.hljs_grammar_load.allocs" },
  { ratchet = "tui.hljs_grammar_load.bytes" },
  { ratchet = "tui.hljs_language_first_use.allocs" },
  { ratchet = "tui.hljs_language_first_use.bytes" },
  { ratchet = "tui.hljs_autodetect_load.allocs" },
  { ratchet = "tui.hljs_autodetect_load.bytes" },
  { missing = "start-to-first-frame time on the cluster with the exact-CV gate (no k8sbench profile for regular PiG)", route = "k8s-bench" },
]

