[[metric]]
id = "scale.turn"
area = "scale"
title = "A later Session turn at a history of N, 10N and 100N exchanges"
impact = 5
owner = "go-scale"
target = "allocations independent of the history (exponent 0); bytes linear with the copies of the context slice removed one by one"
basis = "The provider messages of the history are remembered between requests and the session projection extends on append, so a turn converts only what is new; the request still copies the history as a slice of headers."
gates = [
