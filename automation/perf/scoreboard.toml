[[plan]]
gap = "Tool declarations cost every turn: each message clone deep-copies the system message's tool declarations (ai.cloneTool from SystemMessage.cloneMessage, about 660 allocations per RPC faux turn) and the two token estimates encode every declared tool (about 600). The ordered declaration walk and the built-in parameter decode no longer do (12,200 to 4,330 allocations per turn, process.rpc_turn and ai.tool_schema_marshal)."
plan = "Share tool declarations between message copies (copy on write: a declaration is immutable once in the transcript), and keep each declaration's JSON.stringify length with it so an estimate sums cached lengths. Pi shares the same objects by reference, so neither changes what Pi observes."
