# ---------------------------------------------------------------- cross-language comparison method

[protocol]
competitors = ["pi_agent_rust v0.6.1 (a Rust port of Pi; run first)", "PiG (stock, default and PGO builds)", "rpi (Rust port of Pi; default and tuned release builds)", "Pi 1.3.0 (Node)", "Codex CLI"]
platforms = ["Linux, bare metal", "Windows 11"]
endpoints = [
  "--version: exec to exit",
  "spawn to the first answered RPC command",
  "first frame in a PTY",
  "first accepted input in a PTY",
  "RSS and PSS at ready (rpi's metric), beside peak RSS",
]
scenarios = [
  "startup (every endpoint above)",
  "harness-only overhead over 100 and 1,000 turns against a scripted mock",
  "long sessions at 1M, 2M and 3M tokens: resume and per-turn cost",
  "token forwarding latency, open loop, p50 to p99.9, no coordinated omission",
  "extension round trip per SDK (Go, Rust, Python, TypeScript)",
  "sessions per host, N = 1 to 1,000",
  "worker cold start (deployed startup_time_ms)",
  "reliability: seeded faults, kill-and-resume pass rate with a Wilson interval, orphans, leak slope, cancel latency",
  "24-hour scripted soak: goroutines (goroutineleak profile), descriptors and children sampled every minute, gated flat, published beside CPU",
  "render path: GC pause and mark-assist histograms over 10,000 keystrokes",
]
rules = [
  "One machine for every harness; never compare numbers from different machines or published self-reports as a ranking.",
  "Bare metal, CPU governor performance, turbo off, isolated cores, ASLR on, a fresh process per run.",
  "Twenty runs per harness, interleaved in an order fixed in advance; report the ratio of medians with a bootstrap interval at 95 percent confidence, an A/A noise floor, and an equivalence margin declared before the run.",
  "A scripted mock provider with a fixed chunk schedule runs outside the harness's cgroup; every harness gets an isolated HOME.",
  "Builds 2x2: Rust default and tuned, Go default and PGO; each competitor is built with its own release flags (Rust LTO and PGO, Go -s -w and PGO).",
  "Process timing with hyperfine 2.0 --shell=none (memory_peak_resident and instruction counters recorded, not ranked).",
  "Noise control from the LLVM benchmarking list: performance governor, shielded CPUs, SMT siblings off, turbo off, no swap (a swapped GC metadata page faults into a pause).",
  "On Kubernetes: CPU Manager static policy, Guaranteed QoS, full-pcpus-only, one benchmark pod per node.",
  "Reporting (Heiser's benchmarking crimes): every sub-benchmark including losses, geometric means over sub-benchmarks, absolute numbers beside every ratio.",
  "cgroup accounting for each run: memory.peak, memory.current split, pids.current, cpu.stat.",
  "Publish the raw samples; submit PiG to harness-perf-benchmark.",
  "Counts never rank across languages: instruction and allocation counts gate each implementation against itself only; cross-language claims use wall time, CPU time and memory with intervals. Count runs may disable ASLR; timing runs use fresh processes with ASLR on.",
  "On the shared lane hosts only counts are measured; time comes from this protocol or the cluster's exact-CV gate.",
]
route = "xlang-bench (requested): bare-metal host, competitor builds, harness scripts"

# ---------------------------------------------------------------- twelve techniques, placed in the ranked plan

[[technique]]
id = "T1"
name = "TinyGo boundary redesign: one crossing in and one out per turn over shared memory, binary protocol, no JSON across the boundary"
placement = "plan 10, limited by the standing ruling: crossings stay at Pi's observable hop count, so only cost per crossing and bytes per crossing move"
[[technique]]
id = "T2"
name = "Startup and RSS at ready: lazy package init, measure RSS and PSS at ready"
placement = "plan 3"
[[technique]]
id = "T3"
name = "JSON on Go 1.27: typed or jsontext codecs, rerun every golden with and without GOEXPERIMENT=nojsonv2, byte risks tested against a JS runtime"
placement = "plan 6"
[[technique]]
id = "T4"
name = "One spawn path with tree containment and adversarial child fixtures"
placement = "plan 7"
[[technique]]
id = "T5"
name = "Linear pointer-light transcript: allocations per delta at turn 3,500 equal those at turn 50"
placement = "plan 2"
[[technique]]
id = "T6"
name = "TinyGo collector, scheduler and init options; no fmt, reflect or encoding/json in the module"
placement = "plan 10"
[[technique]]
id = "T7"
name = "Leak gates on Go 1.27: goroutineleak empty after tests and soak, synctest stalled streams, idle timeouts on semantic progress"
placement = "plan 7"
[[technique]]
id = "T8"
name = "PGO from a scripted session at cmd/pig/default.pgo, paired A/B"
placement = "plan 3 (start and turn CPU); measured only on the cluster"
[[technique]]
id = "T9"
name = "GOGC policy per workload, no default GOMEMLIMIT"
placement = "plan 3 (RSS at ready and peak); measured only on the cluster"
[[technique]]
id = "T10"
name = "Extension JSON-RPC: allocation-free framing, bounded queues, deadlines, stderr drained"
placement = "plan 9"
[[technique]]
id = "T11"
name = "Width cache, with no library swap without a Pi width corpus"
placement = "plan 8"
[[technique]]
id = "T12"
name = "SQLite: WAL with a stated synchronous mode, journal_size_limit, startup integrity check"
placement = "plan 10 (Durable sqlhost)"

