[[finding]]
id = "GUARD-02"
owner = "next-div-ai-oauth"
summary = "OAuth HTTP deadlines with no upstream counterpart: Codex token post 30 s, xAI requests 30 s, Radius callback ReadHeaderTimeout 10 s, OpenRouter callback shutdown 2 s. Upstream passes only the caller signal."

[[finding]]
id = "GUARD-12"
owner = "div-modes-interactive"
summary = "Windows resize is polled every 120 ms; upstream reacts to the stdout resize event."

[[finding]]
id = "AGENT-01"
owner = "div-agent-core"
summary = "agent.emit drops events once the run context is cancelled: the event send races a Done case, so aborted message_end, turn_end and agent_end are lost."

[[finding]]
id = "AGENT-05"
owner = "div-agent-core"
summary = "Session persistence errors are swallowed: AppendMessage and AppendBashExecution failures only skip bookkeeping, so a full disk loses the transcript silently."

[[finding]]
id = "AGENT-15"
owner = "div-agent-core"
summary = "Session.Close does not abort the active run; the 64-event raw buffer then fills and Send hangs."

[[finding]]
id = "AGENT-16"
owner = "div-agent-core"
summary = "recover() calls in session event dispatch discard the panic value: the ordered-event paths swallow listener panics, and emitExtensionError drops a panic from the error listener itself."

[[finding]]
id = "AI-08"
owner = "next-div-ai-sse"
summary = "Stream chunks that are not valid JSON are skipped silently, so a turn ends as a success with content or the stop reason missing."

[[finding]]
id = "AI-23"
owner = "next-div-ai-sse"
summary = "SSE lines have a 32/64 MiB size cap that upstream does not have."

[[finding]]
id = "AI-28"
owner = "next-div-ai-anthropic"
summary = "Anthropic falls back to max_tokens 8192, a default upstream does not have."

[[finding]]
id = "AI-29"
owner = "next-div-ai-providers-misc"
summary = "Shared HTTP infrastructure limits (pool sizes, keep-alive, lock polling) that differ from upstream undici and proper-lockfile."

[[finding]]
id = "EXT-17"
owner = "div-ext-host"
summary = "A full outbound queue makes sends fail fast and drops call results silently."

[[finding]]
id = "EXT-20"
owner = "div-ext-host"
summary = "Crash restart keeps the old handler table, and some exits disappear silently (restart policy, reaper and wait deadlines)."

[[finding]]
id = "TUI-03"
owner = "next-div-tui-uiqueue"
summary = "postUITask drops UI tasks silently when the queue is full."

[[finding]]
id = "TUI-13"
owner = "next-div-tui-autocomplete"
summary = "Smaller TUI extras: a 500 ms synchronous fd timeout and a 20-row default window in FilterableList."

[[finding]]
id = "D18"
owner = "div-ext-host"
summary = "Piglet build tooling (pig setup) timeouts; add `pig additive (D18)` at the literal."

[[finding]]
id = "D19"
owner = "div-ext-host"
summary = "Subprocess protocol frame limits; add `pig additive (D19)` at the literal."

[[finding]]
id = "D20"
owner = "div-ext-host"
summary = "Runtime-cell cache retention and lock timings; add `pig additive (D20)` at the literal."

[[finding]]
id = "D28"
owner = "div-ext-host"
summary = "Extension validation deadline; add `pig additive (D28)` at the literal."

[[finding]]
id = "D39"
owner = "div-modes-headless"
