#
# Documents that keep the number of an earlier Pi release because they record
# what was done, measured or probed against that release. check-public-claims.py
# accepts the listed release in the listed files and nowhere else, so a new file
# is checked against the pin until someone reviews it into this list. An entry
# that excuses nothing fails the check: delete it when the text moves.
#
# A statement about how Pi behaves does not belong here. Verify it against the
# pinned release and state the pin, as docs/parity/DIVERGENCES.md does.

