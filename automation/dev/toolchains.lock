#
# sbcl rows pin the Steel Bank Common Lisp that builds and runs Lisp extension images (automation/ci/install-sbcl.sh). Pig's pinned SBCL is
# built from the release source with :sb-core-compression and zstd linked statically, so every platform runs one compiler and compressed
# images need no libzstd at run time. Bootstrap rows are the official binaries that build it: Linux amd64 uses 2.6.9 itself, macOS arm64 uses
# 2.4.0 (the newest arm64-darwin binary SBCL publishes). The source row is checked against the signed manifest sbcl-2.6.9-crhodes.asc (key D6839CA0
# A67F74D9 DFB70922 EBD595A9 100D63CD): it lists 14ea1b03... for the uncompressed tar, which is what this .bz2 decompresses to. A windows row is an
# official installer whose digest was recorded from SourceForge when it was pinned; SBCL's manifest does not cover installers.
