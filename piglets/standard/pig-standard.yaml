name: pig-standard
description: "Explicit PiG composition built from ordinary extension Resources."

release:
  version: 0.5.0-dev

build:
  extensionRealization: fused

extensions:
  - name: piglogin
    origins:
      - local:extensions/piglogin
  - name: pigrunner
    origins:
      - local:extensions/pigrunner
  - name: angrypigs
    origins:
      - local:extensions/angrypigs
  - name: bunruntime
    origins:
      - local:extensions/bunruntime

discovery:
  extensions: []
  skills: []

# piglogin owns /sprite and the login sprite, so the built-in pig-login that registers the same command does not load.
strip:
  extensions: [pig-login]
