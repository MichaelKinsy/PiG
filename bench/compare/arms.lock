#
# Permanent comparison arms. Every downloaded artifact is verified against the sha256 recorded here
# (and, where the project publishes one, the project's own SHA256SUMS) before it is unpacked into a
# fresh root; a mismatch is fatal. No curl|sh installers. Source arms record the commit they build.
# PROVISIONAL: lock entries change only with a new measured session.
# Resolve with: python3 bench/compare/arms.py install --root DIR
# repo = "self": a PiG commit built from this checkout's own repository, which must already hold the commit (fetch it first).

[suite]
# Pi-Bolt's published benchmark suite (MIT), run unmodified from this commit; not vendored.
repo = "https://github.com/opensec-git/Pi-Bolt"
commit = "6088a1fe9395b10c666f6e25ba67c44b5d6453b8" # == tag bolt-v0.7.4, bench/ identical at main on 2026-10-10
path = "bench"

