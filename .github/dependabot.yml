# One grouped pull request per ecosystem per month. Security updates are not
# affected: GitHub opens them as soon as an advisory applies. The cooldown
# waits for new releases to settle before proposing them.
#
# The parity oracle (extensions/sdk-ts, the ci-parity image, and the interface
# extractor) and test fixtures take security updates only: changing an oracle
# dependency changes what PiG is compared against and needs a parity rebaseline.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /extensions/sdk
      - /piglets/porter/extensions/pig-porter
      - /piglets/standard
      - /examples/extensions/go-factory
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      go:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directories:
      - /automation/images/npm-runtime
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /extensions/sdk-py
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directories:
      - /extensions/sdk-rs
      - /examples/extensions/rust-factory
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      rust:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # Security updates only (no version-update pull requests).
  - package-ecosystem: npm
    directories:
      - /extensions/sdk-ts
      - /automation/images/ci-parity
      - /parity/interface-extractor
      - /automation/ci/npm-toolchain
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: gomod
    directories:
      - /cmd/pig/testdata/login-preview
      - /coding/extension/host/subprocess/testdata/sdk-fixture
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directory: /tests/extension-conformance/testdata/rust-sdk-fixture
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
