# SPDX-License-Identifier: MIT

name: CI

# Pull requests carry the full verification; a squash merge lands exactly the
# tested tree, so pushes to main do not run it again. A weekly run keeps main's
# health and the CI badge current.
on:
  pull_request:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Go comes from .go-version, Node from .node-version, and Pi from
# .upstream/pin (a release tag or a pinned commit). make compliance checks every other copy
# of these pins.
env:
  NPM_VERSION: 12.1.0
  RUST_VERSION: 1.97.1
  # Wall-clock and speed-ratio gates only warn on shared runners (internal/testenv.TimingGate); count, size and allocation gates still block. make test-timing runs them blocking on quiet hardware before a release.
  PIG_PERF_TIMING_REPORT_ONLY: '1'
  # 0.5.0 release push only (owner decision 2026-10-16, handoffs/owner-signoff.md): test-fast leaves these sharded packages out; 0.5.1 gives them enough shards and removes this.
  PIG_CI_SKIP_SHARDED: './ai ./coding'

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      product: ${{ steps.classify.outputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # Only a pull request that changes nothing but project prose and
          # repository metadata skips the product suites; the docs job below
          # still checks those files.
          automation/ci/classify-changes.sh "$EVENT" "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

  docs:
    name: Project documents
    needs: [changes]
    if: needs.changes.outputs.product == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Check the README, changelog and repository settings
        run: |
          go test ./test/ci-images/ ./test/docs-drift/
          python3 automation/ci/check-public-claims.py

  dco:
    name: DCO
    # Dependabot commits carry no Signed-off-by trailer; the maintainer's
    # signed-off squash merge records the DCO for them.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./automation/ci/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Check test expectations edited with their code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: go run ./test/parity/cmd/testprune lint -base "$BASE_SHA" -head "$HEAD_SHA"

  linux:
    name: Linux / ${{ matrix.shard }}
    needs: [changes]
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [startup, build, test-fast, test-cli, test-subprocess, test-conformance, sdk, extensions, race, integration, parity-1, parity-2, drift, contracts, portmap, closure]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      # setup-go restores the build cache keyed on go.sum and never refreshes it on a hit.
      # This restores the newest cache a previous run saved, so a job recompiles only what changed.
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      # portmap-check runs each proven PORT_MAP row's evidence tests under coverage and keeps the green results in
      # build/portmap-coverage, keyed by the digest of the cited files and tests; restored here so contracts reruns only changed rows.
      - name: Restore the PORT_MAP coverage cache
        if: matrix.shard == 'portmap'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/portmap-coverage
          key: portmap-coverage-${{ github.sha }}
          restore-keys: |
            portmap-coverage-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            extensions/sdk-ts/package-lock.json
            test/parity/interface-extractor/package-lock.json
            automation/images/ci-parity/package-lock.json
            automation/images/npm-runtime/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.12'
      # make test-sdk-py keeps its hash-locked venv under $PIG_CACHE_HOME/pig-sdk-py (~/.cache here) and names it by
      # the lock and interpreter, so this key changes exactly when the script would build a new venv.
      - name: Restore the Python SDK venv
        if: matrix.shard == 'sdk'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-sdk-py
          key: sdk-py-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('extensions/sdk-py/requirements-dev.txt') }}
      # An unresponsive package mirror fails this step within its timeout instead of holding the job.
      - name: Install native test packages
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # The native clipboard fixtures compile C11 code and exercise a real X11 selection server.
          automation/ci/install-apt-packages.sh tmux fd-find ripgrep build-essential xvfb xclip pkg-config libxcb1-dev
      - name: Install parity toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Install pinned npm
        shell: bash
        run: |
          set -euo pipefail
          # npm ci installs the lockfile-pinned npm; later steps use it via PATH.
          automation/ci/install-npm-toolchain.sh
          bin="$PWD/automation/ci/npm-toolchain/node_modules/.bin"
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Prepare pinned Pi oracle
        run: make upstream-mirror
      - name: Verify toolchain identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go$(tr -d '\r\n' < .go-version)"
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(npm --version)" = "$NPM_VERSION"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_VERSION"
          python3 automation/pin/pin.py check-oracle
      # Rust SDK dependencies and Pi's env daemon build into persistent targets (internal/testenv.SharedCargoTargetDir) named for a hash of their lockfiles, so a lock change selects a new directory and a hit skips the compile.
      - name: Restore the Cargo registry and test targets
        if: startsWith(matrix.shard, 'test-') || matrix.shard == 'sdk' || matrix.shard == 'race'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pig-dev/cargo-target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('extensions/sdk-rs/Cargo.lock', 'extensions/sdk-rs/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - name: Warm the fixture caches
        if: startsWith(matrix.shard, 'test-')
        env:
          CI: '1'
        run: make test-warm
      - name: Run PiG verification shard
        env:
          CI: '1'
          SHARD: ${{ matrix.shard }}
        run: make "ci-$SHARD"
      - name: Save the PORT_MAP coverage cache
        if: always() && matrix.shard == 'portmap'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/portmap-coverage
          key: portmap-coverage-${{ github.sha }}
      - name: Save the Go build cache
        if: success() && matrix.shard == 'test-fast'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  node-runtime:
    name: Node extensions / ${{ matrix.node_version_file }}
    needs: [changes]
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Pi's engine floor, the qualified build runtime, and current Node.
        node_version_file: [automation/ci/node-minimum.version, .node-version, automation/ci/node-current.version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      # Install the oracle with the qualified npm runtime before selecting the
      # test runtime: pinned npm itself requires a newer Node than Pi's floor.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: extensions/sdk-ts/package-lock.json
      # An unresponsive package mirror fails this step within its timeout instead of holding the job.
      - name: Install native test packages
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # ci-node-runtime runs the native clipboard upstream tests on each Node version.
          automation/ci/install-apt-packages.sh tmux fd-find ripgrep build-essential xvfb xclip pkg-config libxcb1-dev
      - name: Prepare the Pi oracle
        run: |
          set -euo pipefail
          automation/ci/install-npm-toolchain.sh
          export PATH="$PWD/automation/ci/npm-toolchain/node_modules/.bin:$PATH"
          make upstream-mirror
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ matrix.node_version_file }}
      - name: Test Node extension runtime and TypeScript parity
        env:
          CI: '1'
        run: |
          set -euo pipefail
          node --version
          automation/ci/with-isolated-pig-home.sh make ci-node-runtime
  node-loader:
    name: Node loader / ${{ matrix.os }} / ${{ matrix.node_version_file }}
    needs: [changes]
    if: needs.changes.outputs.product == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
        # Exercise PiG's minimum and the current Node major, independently of
        # the qualified default toolchain used by the full suites.
        node_version_file: [automation/ci/node-loader-minimum.version, automation/ci/node-current.version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ matrix.node_version_file }}
      - name: Load TypeScript packages and check runtime preflight
        shell: bash
        run: |
          set -euo pipefail
          # Keep Go's module and build caches outside the throwaway HOME: the module
          # cache is read-only by design, and reusing it avoids a second download.
          export GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)"
          home=$(mktemp -d)
          trap 'rm -rf "$home"' EXIT
          export HOME="$home" PIG_HOME="$home/.pig"
          export PIG_CODING_AGENT_DIR="$home/pig-agent" PI_CODING_AGENT_DIR="$home/pi-agent"
          node --version
          go test ./coding/extension/host/subprocess -count=1 -run '^(TestNodeLoaderUsesSynchronousHooksWhenAvailable|TestNodeIssuePackageForms|TestNodeRuntimePreflight.*)$'

  verify:
    name: Linux verification
    needs: [changes, linux]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Linux shard
        env:
          CHANGES: ${{ needs.changes.result }}
          PRODUCT: ${{ needs.changes.outputs.product }}
          RESULT: ${{ needs.linux.result }}
        # Shards are skipped only when the change classifier succeeded and
        # found no product change.
        run: test "$RESULT" = success || { test "$CHANGES" = success && test "$PRODUCT" = false && test "$RESULT" = skipped; }

  windows:
    name: Windows ${{ matrix.shard }}
    needs: [changes]
    if: needs.changes.outputs.product == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # extension-host: the extension host packages (runtimecell and
        # subprocess). extension-conformance: every SDK against the in-process
        # reference. native-1 to native-3: the smoke run (native-1) and every other
        # package that carries Windows tests, in three parallel jobs
        # (automation/ci/windows-native-shard.sh). cli-1 to cli-8: one job for each of the eight
        # cmd/pig shards, run in parallel. The two extension
        # shards were one shard whose extension step took 49 of the job's 60
        # minutes, and native with cmd/pig reached the 60-minute limit.
        shard: [native-1, native-2, native-3, cli-1, cli-2, cli-3, cli-4, cli-5, cli-6, cli-7, cli-8, extension-host-1, extension-host-2, extension-host-3, extension-conformance-1, extension-conformance-2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      # setup-go restores the build cache keyed on go.sum and never refreshes it on a hit.
      # This restores the newest cache a previous run saved, so a job recompiles only what changed.
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            extensions/sdk-ts/package-lock.json
            test/parity/interface-extractor/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select the qualified Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain installation failed" }
          rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain selection failed" }
      # fd and ripgrep come from pinned GitHub release archives verified against
      # automation/ci/windows-tools.txt, not from a package feed whose outages
      # (504, missing lib paths) failed every Windows shard.
      - name: Restore the native test tool archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\native-tool-archives
          key: native-tools-${{ runner.os }}-${{ hashFiles('automation/ci/windows-tools.txt', 'automation/ci/install-windows-tools.ps1') }}
      - name: Install native test tools
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'native-tools'
          ./automation/ci/install-windows-tools.ps1 -Cache (Join-Path $env:RUNNER_TEMP 'native-tool-archives') -Bin $bin
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          $env:PATH = "$bin;$env:PATH"
          fd --version
          if ($LASTEXITCODE -ne 0) { throw "fd is not available" }
          rg --version
          if ($LASTEXITCODE -ne 0) { throw "ripgrep is not available" }
      - name: Install pinned Pi test oracle
        shell: bash
        run: |
          set -euo pipefail
          # npm ci installs the lockfile-pinned npm; later steps use it via PATH.
          automation/ci/install-npm-toolchain.sh
          bin="$PWD/automation/ci/npm-toolchain/node_modules/.bin"
          cygpath -w "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$NPM_VERSION"
          # Builds Pi from source at the pin and links it as the oracle (automation/pin/oracle.py); the published package is not the oracle.
          # setup-python on Windows provides python, not always python3.
          py="$(command -v python3 || command -v python)"
          "$py" automation/pin/pin.py install-oracle
          # The oracle tests' own locked npm trees, as make parity-deps installs them on Linux.
          "$py" automation/ci/npm-locked.py internal/typebox/testdata/npm
          "$py" automation/ci/npm-locked.py ai/testdata/sdk
      - name: Mirror the pinned Pi source
        # The extension host's parity tests read Pi's source from
        # .upstream/current, as on Linux (make upstream-mirror).
        shell: bash
        env:
          MSYS: winsymlinks:nativestrict
        run: ./automation/gen/mirror-upstream.sh
      - name: Build and smoke-test native Windows paths
        if: matrix.shard == 'native-1'
        shell: pwsh
        run: |
          $acceptanceRoot = Join-Path $env:RUNNER_TEMP 'pig native acceptance'
          New-Item -ItemType Directory -Force -Path $acceptanceRoot | Out-Null
          $env:PIG_HOME = Join-Path $acceptanceRoot 'config with spaces'
          $env:PIG_CODING_AGENT_DIR = Join-Path $env:PIG_HOME 'agent'
          go build -trimpath -o bin/pig.exe ./cmd/pig
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }
          & .\bin\pig.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pig.exe --help failed" }
          & .\bin\pig.exe --version
          if ($LASTEXITCODE -ne 0) { throw "pig.exe --version failed" }
          $env:PIG_TEST_FAUX = '1'
          $printOutput = & .\bin\pig.exe --model test-faux/faux-1 --no-session --no-extensions --print 'What is 20+22?'
          if ($LASTEXITCODE -ne 0 -or $printOutput -notmatch '42') { throw "Windows print smoke failed: $printOutput" }
          '{"id":"state","type":"get_state"}' | & .\bin\pig.exe --mode rpc --model test-faux/faux-1 --no-session --no-extensions | Out-File -Encoding utf8 (Join-Path $acceptanceRoot 'rpc.jsonl')
          if ($LASTEXITCODE -ne 0) { throw "Windows RPC smoke failed" }
          if ((Get-Content -Raw (Join-Path $acceptanceRoot 'rpc.jsonl')) -notmatch '"type":"response"') { throw "Windows RPC response missing" }
      - name: Test every package with Windows tests
        # The extension-host shard runs the extension host packages, and the
        # cli-N shards run cmd/pig in shards. The package
        # list comes from the toolchain, so a new Windows test file is run
        # without editing this workflow. The list holds packages with a
        # Windows-only test file; tests that branch on runtime.GOOS in a
        # file every platform builds are not selected by it.
        if: startsWith(matrix.shard, 'native-')
        shell: bash
        env:
          PI_TEST_NATIVE_CLIPBOARD: '1'
          NATIVE_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          acceptance="$RUNNER_TEMP/pig native acceptance"
          mkdir -p "$acceptance"
          export PIG_HOME="$acceptance/config with spaces"
          export PIG_CODING_AGENT_DIR="$PIG_HOME/agent"
          packages=$(automation/ci/windows-native-shard.sh "${NATIVE_SHARD#native-}")
          echo "$packages"
          go test -timeout 30m $packages
      - name: Test cmd/pig, shard ${{ matrix.shard }} of 8
        # Each cli-N shard is its own job running shard N of automation/ci/test-shard-pattern.sh, as make test-cli runs the shards on Linux: each in its own go test process and timeout.
        # go test hangs on GitHub's Windows runners before the test binary starts (golang/go#81368: go.exe spins, no test process runs; the listing here never returned), so the step builds the test binary with go test -c and lists and runs it directly from the package directory, as go test would. -test.v streams every test's start and end, and the 25-minute alarm and its stack dump land inside the 60-minute job after about 15 minutes of setup.
        if: startsWith(matrix.shard, 'cli-')
        shell: bash
        env:
          PI_TEST_NATIVE_CLIPBOARD: '1'
          CLI_SHARD: ${{ matrix.shard }}
          # TestMain dumps every goroutine if its setup has not reached m.Run by then; the go test alarm covers only m.Run.
          PIG_TEST_STALL_DUMP: 4m
        run: |
          set -euo pipefail
          acceptance="$RUNNER_TEMP/pig native acceptance"
          mkdir -p "$acceptance"
          export PIG_HOME="$acceptance/config with spaces"
          export PIG_CODING_AGENT_DIR="$PIG_HOME/agent"
          # Timestamps split module download and compile, the listing (which runs the test binary's TestMain), and the run.
          bin="$RUNNER_TEMP/cli-test.exe"
          echo "$(date -u +%T) building the ./coding/cli test binary"
          timeout 10m go test -c -o "$bin" ./coding/cli
          echo "$(date -u +%T) built; listing ./coding/cli"
          run=$(TEST_SHARD_BINARY="$bin" timeout 5m automation/ci/test-shard-pattern.sh "${CLI_SHARD#cli-}" 8 ./coding/cli)
          echo "$(date -u +%T) listed; running shard ${CLI_SHARD#cli-}"
          cd coding/cli
          "$bin" -test.paniconexit0 -test.v -test.timeout 25m -test.run "$run"
      - name: Select this job's extension tests
        # Each extension job runs its half of the package's tests, split by automation/ci/test-shard-pattern.sh so every test runs in exactly one job.
        if: startsWith(matrix.shard, 'extension-')
        shell: bash
        env:
          EXTENSION_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          case "$EXTENSION_SHARD" in
            extension-host-*) package=./coding/extension/host/subprocess shards=3 ;;
            extension-conformance-*) package=./test/extension-conformance shards=2 ;;
            *) echo "unexpected shard $EXTENSION_SHARD" >&2; exit 1 ;;
          esac
          run=$(automation/ci/test-shard-pattern.sh "${EXTENSION_SHARD##*-}" "$shards" "$package")
          echo "SHARD_RUN=$run" >> "$GITHUB_ENV"
      - name: Test Windows extension host packages
        if: startsWith(matrix.shard, 'extension-host-')
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: '2'
          PIG_REQUIRE_EXTENSION_TOOLCHAINS: '1'
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          $acceptanceRoot = Join-Path $env:RUNNER_TEMP 'pig extension acceptance'
          New-Item -ItemType Directory -Force -Path $acceptanceRoot | Out-Null
          $env:TEMP = $acceptanceRoot
          $env:TMP = $acceptanceRoot
          $env:TMPDIR = $acceptanceRoot
          $env:PIG_HOME = Join-Path $acceptanceRoot 'config with spaces'
          # runtimecell runs whole, in extension-host-1; the subprocess tests are split in three.
          if ($env:MATRIX_SHARD -eq 'extension-host-1') {
            go test -v -timeout 30m ./coding/extension/host/runtimecell
            if ($LASTEXITCODE -ne 0) { throw "Windows runtimecell tests failed" }
          }
          go test -v -timeout 30m -run $env:SHARD_RUN ./coding/extension/host/subprocess
          if ($LASTEXITCODE -ne 0) { throw "Windows extension host tests failed" }
      - name: Test Windows extension conformance for every SDK
        if: startsWith(matrix.shard, 'extension-conformance-')
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: '2'
          PIG_REQUIRE_EXTENSION_TOOLCHAINS: '1'
        run: |
          $acceptanceRoot = Join-Path $env:RUNNER_TEMP 'pig extension acceptance'
          New-Item -ItemType Directory -Force -Path $acceptanceRoot | Out-Null
          $env:TEMP = $acceptanceRoot
          $env:TMP = $acceptanceRoot
          $env:TMPDIR = $acceptanceRoot
          $env:PIG_HOME = Join-Path $acceptanceRoot 'config with spaces'
          go test -v -timeout 30m -run $env:SHARD_RUN ./test/extension-conformance
          if ($LASTEXITCODE -ne 0) { throw "Windows Go, Node, Rust, Python, or fused-Go extension conformance failed" }
      - name: Save the Go build cache
        if: success() && matrix.shard == 'native-1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  macos:
    name: macOS ${{ matrix.shard }}
    needs: [changes]
    if: needs.changes.outputs.product == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # native: the smoke run of the packages with macOS-specific code.
        # cli-1 to cli-8: one job for each of the eight cmd/pig shards that
        # make test-cli runs on Linux (automation/ci/test-shard-pattern.sh).
        # extension-host-1 to extension-host-3: the subprocess extension host
        # tests, split in three. packages: the remaining
        # packages whose tests bind Unix sockets, watch paths or resolve
        # symlinked temporary directories, which macOS spells differently from
        # Linux (104-byte socket paths, /var -> /private/var).
        shard: [native, cli-1, cli-2, cli-3, cli-4, cli-5, cli-6, cli-7, cli-8, extension-host-1, extension-host-2, extension-host-3, packages]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            extensions/sdk-ts/package-lock.json
            test/parity/interface-extractor/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select the qualified Rust toolchain
        # The cmd/pig and extension host tests build Rust extensions with the toolchain Linux and Windows pin.
        if: matrix.shard != 'native'
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_VERSION"
      - name: Install native test tools and pinned Pi oracle
        shell: bash
        run: |
          set -euo pipefail
          brew install fd ripgrep
          # npm ci installs the lockfile-pinned npm; later steps use it via PATH.
          automation/ci/install-npm-toolchain.sh
          bin="$PWD/automation/ci/npm-toolchain/node_modules/.bin"
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$NPM_VERSION"
          # Builds Pi from source at the pin and links it as the oracle (automation/pin/oracle.py); the published package is not the oracle.
          python3 automation/pin/pin.py install-oracle
          # The oracle tests' own locked npm trees, as make parity-deps installs them on Linux.
          python3 automation/ci/npm-locked.py internal/typebox/testdata/npm
          python3 automation/ci/npm-locked.py ai/testdata/sdk
      - name: Mirror the pinned Pi source
        # The ai package's upstream tests read Pi's source from
        # .upstream/current, as on Linux (make upstream-mirror) and Windows.
        run: ./automation/gen/mirror-upstream.sh
      - name: Install a current bash for the shard selection script
        # test-shard-pattern.sh needs bash 4; macOS ships 3.2 as /bin/bash.
        # Only the bash keg goes on PATH: the Homebrew bin directory also holds the image's default node and npm, which would shadow the pinned toolchain.
        if: startsWith(matrix.shard, 'cli-') || startsWith(matrix.shard, 'extension-host-')
        run: |
          set -euo pipefail
          brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain identities
        # The Pi oracle and the Node extensions run under the node on PATH, so every later step must see the pinned toolchain.
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go$(tr -d '\r\n' < .go-version)"
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(npm --version)" = "$NPM_VERSION"
          python3 automation/pin/pin.py check-oracle
      - name: Build and test native macOS paths
        if: matrix.shard == 'native'
        run: |
          set -euo pipefail
          go build -trimpath -o bin/pig ./cmd/pig
          ./bin/pig --version
          # The ai package has about 2700 top-level tests and needs more than go test's default 10 minutes here: Linux splits it in two processes (automation/ci/test-grouped.sh) and Windows runs it alone under this timeout.
          go test -timeout 30m ./ai ./internal/codingagent/tools ./internal/nativeplatform ./tui
      - name: Test cmd/pig, shard ${{ matrix.shard }} of 8
        # Each cli-N shard is its own job running shard N of automation/ci/test-shard-pattern.sh, as make test-cli runs the shards on Linux: each in its own go test process and timeout.
        if: startsWith(matrix.shard, 'cli-')
        env:
          CLI_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          acceptance="$RUNNER_TEMP/pig native acceptance"
          mkdir -p "$acceptance"
          export PIG_HOME="$acceptance/config with spaces"
          export PIG_CODING_AGENT_DIR="$PIG_HOME/agent"
          run=$(automation/ci/test-shard-pattern.sh "${CLI_SHARD#cli-}" 8 ./coding/cli)
          go test -timeout 30m -run "$run" ./coding/cli
      - name: Test the extension host, half ${{ matrix.shard }}
        # Each extension-host-N job runs its third of the package's tests, split by automation/ci/test-shard-pattern.sh so every test runs in exactly one of the three jobs.
        if: startsWith(matrix.shard, 'extension-host-')
        env:
          EXTENSION_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          acceptance="$RUNNER_TEMP/pig native acceptance"
          mkdir -p "$acceptance"
          export PIG_HOME="$acceptance/config with spaces"
          export PIG_CODING_AGENT_DIR="$PIG_HOME/agent"
          run=$(automation/ci/test-shard-pattern.sh "${EXTENSION_SHARD##*-}" 3 ./coding/extension/host/subprocess)
          go test -timeout 30m -run "$run" ./coding/extension/host/subprocess
      - name: Test env and coding/piglet
        if: matrix.shard == 'packages'
        run: |
          set -euo pipefail
          acceptance="$RUNNER_TEMP/pig native acceptance"
          mkdir -p "$acceptance"
          export PIG_HOME="$acceptance/config with spaces"
          export PIG_CODING_AGENT_DIR="$PIG_HOME/agent"
          go test -timeout 30m ./env ./coding/piglet

  android:
    name: Android build
    needs: [changes]
    if: needs.changes.outputs.product == 'true'
    # Termux runs this binary. The runner image provides the NDK; no hosted
    # runner executes the result, so this builds it with cgo and checks its ELF
    # headers (PIE, /system/bin/linker64, bionic libc) as the release does.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Build and check the Android binary
        shell: bash
        run: |
          set -euo pipefail
          automation/release/android-binary.sh build -trimpath -o "$RUNNER_TEMP/pig-android" ./cmd/pig
          automation/release/android-binary.sh check "$RUNNER_TEMP/pig-android"
      - name: Vet the Android packages
        run: CGO_ENABLED=0 GOOS=android GOARCH=arm64 go vet ./...

  result:
    name: CI result
    # The one required check for this workflow. It runs even when a job it
    # needs failed, because a skipped job would otherwise count as passing.
    # A job may be skipped only where its own condition skips it.
    needs: [changes, docs, dco, verify, node-runtime, windows, macos, android, node-loader]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job this change needs
        env:
          EVENT: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PRODUCT: ${{ needs.changes.outputs.product }}
          CHANGES: ${{ needs.changes.result }}
          DOCS: ${{ needs.docs.result }}
          DCO: ${{ needs.dco.result }}
          VERIFY: ${{ needs.verify.result }}
          NODE_RUNTIME: ${{ needs.node-runtime.result }}
          WINDOWS: ${{ needs.windows.result }}
          MACOS: ${{ needs.macos.result }}
          ANDROID: ${{ needs.android.result }}
          NODE_LOADER: ${{ needs.node-loader.result }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          expect() { # job result allowed-skip
            if [ "$2" = success ] || { [ "$2" = skipped ] && [ "$3" = true ]; }; then
              echo "$1: $2"
            else
              echo "::error::$1: $2"
              status=1
            fi
          }
          product_skip=false; docs_skip=false; dco_skip=false
          [ "$PRODUCT" = false ] && product_skip=true
          [ "$PRODUCT" = true ] && docs_skip=true
          { [ "$EVENT" != pull_request ] || [ "$PR_AUTHOR" = 'dependabot[bot]' ]; } && dco_skip=true
          expect "Changed paths" "$CHANGES" false
          expect "Project documents" "$DOCS" "$docs_skip"
          expect "DCO" "$DCO" "$dco_skip"
          expect "Linux verification" "$VERIFY" false
          expect "Node runtime matrix" "$NODE_RUNTIME" "$product_skip"
          expect "Windows" "$WINDOWS" "$product_skip"
          expect "macOS" "$MACOS" "$product_skip"
          expect "Android" "$ANDROID" "$product_skip"
          expect "Node loader" "$NODE_LOADER" "$product_skip"
          exit "$status"
