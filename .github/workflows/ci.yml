# SPDX-License-Identifier: MIT

name: CI

# Pull requests carry the full verification; a squash merge lands exactly the
# tested tree, so pushes to main do not run it again. A weekly run keeps main's
# health and the CI badge current.
on:
  pull_request:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Go comes from .go-version, Node from .node-version, and Pi from
# .upstream/pin (a release tag or a pinned commit). make compliance checks every other copy
# of these pins.
env:
  NPM_VERSION: 12.1.0
  RUST_VERSION: 1.97.1
  # Wall-clock and speed-ratio gates only warn on shared runners (internal/testenv.TimingGate); count, size and allocation gates still block. make test-timing runs them blocking on quiet hardware before a release.
  PIG_PERF_TIMING_REPORT_ONLY: '1'

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      product: ${{ steps.classify.outputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # Only a pull request that changes nothing but project prose and
          # repository metadata skips the product suites; the docs job below
          # still checks those files.
          automation/ci/classify-changes.sh "$EVENT" "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

  docs:
    name: Project documents
    needs: [changes]
    if: needs.changes.outputs.product == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog fragment check resolves the commits fragments name against the history of HEAD.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Check the README, changelog and repository settings
        run: |
          go test ./test/ci-images/ ./test/docs-drift/
          python3 automation/ci/check-public-claims.py

  dco:
    name: DCO
    # Dependabot commits carry no Signed-off-by trailer; the maintainer's
    # signed-off squash merge records the DCO for them.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./automation/ci/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Check test expectations edited with their code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: go run ./test/parity/cmd/testprune lint -base "$BASE_SHA" -head "$HEAD_SHA"

  preflight:
    name: Linux / preflight
    # The compile gate: every package builds, vets for each shipped platform, and needs no go fix. Windows, macOS and the Node
    # loader wait for it, so a change that cannot pass them does not spend their minutes; the Linux shards start at once.
    needs: [changes]
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          # The job restores its own Go build cache below; setup-go's copy would download a second, older one.
          cache: false
      - name: Restore the Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Build, vet and go fix every package
        env:
          CI: '1'
          MAKEFLAGS: -k
        run: make ci-preflight

  linux:
    name: Linux / ${{ matrix.shard }}
    needs: [changes]
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Longest first, so the jobs that bound the run's end start first when the account's job slots are full.
        shard: [portmap-1, portmap-2, portmap-3, test-fast-sharded, test-fast, test-conformance, build, test-cli-1, test-cli-2, test-subprocess, parity-2, parity-1, toolchains, checks, contracts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          # The job restores its own Go build cache below; setup-go's copy would download a second, older one.
          cache: false
      # Modules are immutable for a go.sum, so one entry serves every job until a dependency changes.
      - name: Restore the Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
      # This restores the newest cache a previous run saved, so a job recompiles only what changed.
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      # Go bumps an entry's mtime when a build reads it, at most once an hour (cmd/go/internal/cache mtimeInterval). Backdating
      # the restored entries by two hours lets the save step keep only what this job used, so the saved cache does not grow
      # with every commit.
      - name: Age the restored Go build cache
        id: age
        if: matrix.shard == 'test-fast'
        shell: bash
        run: automation/ci/gocache-trim.sh age
      # portmap-check runs each proven PORT_MAP row's evidence tests under coverage and keeps the green results in
      # build/portmap-coverage, keyed by the digest of the cited files and tests, so a later run reruns only changed rows. A shard
      # prefers its own previous cache and otherwise takes the newest of any shard: a record is valid for whichever shard holds its row.
      - name: Restore the PORT_MAP coverage cache
        if: startsWith(matrix.shard, 'portmap-')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/portmap-coverage
          key: portmap-coverage-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            portmap-coverage-${{ matrix.shard }}-
            portmap-coverage-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            extensions/sdk-ts/package-lock.json
            test/parity/interface-extractor/package-lock.json
            automation/images/ci-parity/package-lock.json
            automation/images/npm-runtime/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.12'
      # make test-sdk-py keeps its hash-locked venv under $PIG_CACHE_HOME/pig-sdk-py (~/.cache here) and names it by
      # the lock and interpreter, so this key changes exactly when the script would build a new venv.
      - name: Restore the Python SDK venv
        if: matrix.shard == 'toolchains'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-sdk-py
          key: sdk-py-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('extensions/sdk-py/requirements-dev.txt') }}
      # An unresponsive package mirror fails this step within its timeout instead of holding the job.
      - name: Install native test packages
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # The native clipboard fixtures compile C11 code and exercise a real X11 selection server.
          automation/ci/install-apt-packages.sh tmux fd-find ripgrep build-essential xvfb xclip pkg-config libxcb1-dev
      - name: Install parity toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Install pinned npm
        shell: bash
        run: |
          set -euo pipefail
          # npm ci installs the lockfile-pinned npm; later steps use it via PATH.
          automation/ci/install-npm-toolchain.sh
          bin="$PWD/automation/ci/npm-toolchain/node_modules/.bin"
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$NPM_VERSION"
      # The oracle build is the same for every job of a pin; oracle.py reuses a restored build whose stamp matches.
      - name: Restore the Pi oracle build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-dev/pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}
      - name: Prepare pinned Pi oracle
        run: make upstream-mirror
      - name: Verify toolchain identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go$(tr -d '\r\n' < .go-version)"
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(npm --version)" = "$NPM_VERSION"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_VERSION"
          python3 automation/pin/pin.py check-oracle
      # Rust SDK dependencies and Pi's env daemon build into persistent targets (internal/testenv.SharedCargoTargetDir) named for a hash of their lockfiles, so a lock change selects a new directory and a hit skips the compile.
      - name: Restore the Cargo registry and test targets
        if: startsWith(matrix.shard, 'test-') || matrix.shard == 'toolchains'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pig-dev/cargo-target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('extensions/sdk-rs/Cargo.lock', 'extensions/sdk-rs/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-
      # The PORT_MAP evidence tests of the extension, CLI and env packages build the Rust SDK cells and Pi's env daemon into the same
      # targets. A portmap shard only restores them: the test shards own saving the complete set, and a partial save here would pin
      # an incomplete cache to the key.
      - name: Restore the Cargo targets of the PORT_MAP evidence tests
        if: startsWith(matrix.shard, 'portmap-')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pig-dev/cargo-target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('extensions/sdk-rs/Cargo.lock', 'extensions/sdk-rs/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - name: Warm the fixture caches
        if: startsWith(matrix.shard, 'test-')
        env:
          CI: '1'
        run: make test-warm
      # golangci-lint keys its analysis cache on file content, so a restored cache serves only unchanged packages. The key rolls weekly.
      - name: Name the lint cache week
        id: lintweek
        if: matrix.shard == 'build'
        shell: bash
        run: echo "week=$(( $(date -u +%s) / 604800 ))" >> "$GITHUB_OUTPUT"
      - name: Restore the golangci-lint cache
        id: lintcache
        if: matrix.shard == 'build'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('.go-version', '.golangci.yml', 'go.mod') }}-${{ steps.lintweek.outputs.week }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ hashFiles('.go-version', '.golangci.yml', 'go.mod') }}-
      - name: Run PiG verification shard
        env:
          CI: '1'
          SHARD: ${{ matrix.shard }}
          # A shard that groups several gates runs every one of them and fails if any failed.
          MAKEFLAGS: -k
        run: make "ci-$SHARD"
      - name: Save the golangci-lint cache
        if: ${{ !cancelled() && matrix.shard == 'build' && steps.lintcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('.go-version', '.golangci.yml', 'go.mod') }}-${{ steps.lintweek.outputs.week }}
      - name: Save the PORT_MAP coverage cache
        if: always() && startsWith(matrix.shard, 'portmap-')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/portmap-coverage
          key: portmap-coverage-${{ matrix.shard }}-${{ github.sha }}
      # Go's build cache is content-addressed, so a failed run's compile output is as valid as a passing run's.
      - name: Keep only the Go build cache entries this job used
        if: ${{ !cancelled() && steps.age.outcome == 'success' }}
        shell: bash
        run: automation/ci/gocache-trim.sh trim
      - name: Save the Go build cache
        if: ${{ !cancelled() && steps.age.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  node-runtime:
    name: Node extensions
    needs: [changes]
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      # Install the oracle with the qualified npm runtime before selecting the
      # test runtime: pinned npm itself requires a newer Node than Pi's floor.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: extensions/sdk-ts/package-lock.json
      # An unresponsive package mirror fails this step within its timeout instead of holding the job.
      - name: Install native test packages
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # ci-node-runtime runs the native clipboard upstream tests on each Node version.
          automation/ci/install-apt-packages.sh tmux fd-find ripgrep build-essential xvfb xclip pkg-config libxcb1-dev
      - name: Prepare the Pi oracle
        id: oracle
        run: |
          set -euo pipefail
          automation/ci/install-npm-toolchain.sh
          export PATH="$PWD/automation/ci/npm-toolchain/node_modules/.bin:$PATH"
          make upstream-mirror
      # One job runs the suite under each Node version in turn: Pi's engine floor, the qualified build runtime, and current
      # Node. Each version's run starts even when an earlier one failed, so every version reports.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' }}
        with:
          node-version-file: automation/ci/node-minimum.version
      - name: Test Node extension runtime and TypeScript parity on Pi's engine floor
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' }}
        env:
          CI: '1'
        run: |
          set -euo pipefail
          node --version
          automation/ci/with-isolated-pig-home.sh make ci-node-runtime
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' }}
        with:
          node-version-file: .node-version
      - name: Test Node extension runtime and TypeScript parity on the qualified Node
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' }}
        env:
          CI: '1'
        run: |
          set -euo pipefail
          node --version
          automation/ci/with-isolated-pig-home.sh make ci-node-runtime
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' }}
        with:
          node-version-file: automation/ci/node-current.version
      - name: Test Node extension runtime and TypeScript parity on current Node
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' }}
        env:
          CI: '1'
        run: |
          set -euo pipefail
          node --version
          automation/ci/with-isolated-pig-home.sh make ci-node-runtime
  node-loader:
    name: Node loader / ${{ matrix.os }}
    needs: [changes, preflight]
    if: needs.changes.outputs.product == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: .go-version
          cache: true
      # Exercise PiG's minimum and the current Node major, independently of the qualified default toolchain used by the full
      # suites. One job runs both in turn; the second starts even when the first failed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: automation/ci/node-loader-minimum.version
      - name: Load TypeScript packages and check runtime preflight on PiG's minimum Node
        shell: bash
        run: automation/ci/node-loader-check.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        with:
          node-version-file: automation/ci/node-current.version
      - name: Load TypeScript packages and check runtime preflight on current Node
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        shell: bash
        run: automation/ci/node-loader-check.sh

  durable-cf-host:
    name: Durable Cloudflare host
    needs: [changes]
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install pinned npm
        shell: bash
        run: |
          set -euo pipefail
          automation/ci/install-npm-toolchain.sh
          bin="$PWD/automation/ci/npm-toolchain/node_modules/.bin"
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$NPM_VERSION"
      # TinyGo 0.42.0 (the tinygo row of automation/dev/toolchains.lock, digest-checked) builds the codemode module and the
      # TinyGo pass's core; the Pi reference the conformance tests read is the checkout durable/contract/PIN names.
      - name: Restore TinyGo and the Pi reference
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pig-dev/tinygo
            durable/contract/.cache
          key: durable-cf-host-${{ runner.os }}-${{ hashFiles('automation/dev/toolchains.lock', 'durable/contract/PIN') }}
      - name: Install the pinned TinyGo
        shell: bash
        run: echo "TINYGO=$(sh durable/core/budget/tinygo-install.sh)" >> "$GITHUB_ENV"
      # durable-core-host-check: durable-contract-setup, durable-core-host-deps (the locked npm tree), then check.sh: tsc and the
      # whole suite against the core built with Go and with TinyGo.
      - name: Typecheck and test the Cloudflare host
        shell: bash
        run: automation/ci/with-isolated-pig-home.sh make durable-core-host-check
      # durable-core-budget: the size budget of the core and the host bundle, the TinyGo heap policy, and the allocation-site
      # baseline (durable/core/budget/allocs.json). It needs the TinyGo installed above, and no other job runs it.
      - name: Check the Durable core budget
        shell: bash
        run: automation/ci/with-isolated-pig-home.sh make durable-core-budget

  verify:
    name: Linux verification
    needs: [changes, linux]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Linux shard
        env:
          CHANGES: ${{ needs.changes.result }}
          PRODUCT: ${{ needs.changes.outputs.product }}
          RESULT: ${{ needs.linux.result }}
        # Shards are skipped only when the change classifier succeeded and
        # found no product change.
        run: test "$RESULT" = success || { test "$CHANGES" = success && test "$PRODUCT" = false && test "$RESULT" = skipped; }

  windows:
    name: Windows ${{ matrix.shard }}
    needs: [changes, preflight]
    if: needs.changes.outputs.product == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # extension-host: the extension host packages (runtimecell and
        # subprocess). extension-conformance: every SDK against the in-process
        # reference. native-1 to native-4: the smoke run (native-1) and every other
        # package that carries Windows tests, in four parallel jobs
        # (automation/ci/windows-native-shard.sh). The eight cmd/pig shards share four
        # jobs, paired longest with shortest from measured run times, so each job builds
        # the test binary once. The two extension shards were one shard whose extension
        # step took 49 of the job's 60 minutes, and native with cmd/pig reached the
        # 60-minute limit. Longest jobs first.
        shard: [cli-2 cli-5, cli-1 cli-3, cli-4 cli-7, cli-6 cli-8, extension-conformance-2, native-3, native-2, native-1, extension-conformance-1, extension-host-1, native-4, extension-host-2, extension-host-3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub's hosted Windows images put RUNNER_TEMP on the D: drive, which handles many small files faster than C:; the
      # step prints the drives to show it. The Go build cache and the Pi oracle store live there. Go's temporary directories
      # stay on the system drive: tests run their binaries and temporary trees there, as a user's would.
      - name: Keep Go and oracle scratch under RUNNER_TEMP
        shell: pwsh
        run: |
          "GOCACHE=$(Join-Path $env:RUNNER_TEMP 'go-build')" >> $env:GITHUB_ENV
          "PIG_PI_BUILD_STORE=$(Join-Path $env:RUNNER_TEMP 'pi-builds')" >> $env:GITHUB_ENV
          Write-Output "RUNNER_TEMP=$env:RUNNER_TEMP"
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          # The job restores its own Go build cache below; setup-go's copy would download a second, older one.
          cache: false
      - name: Restore the Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
      # This restores the newest cache a previous run saved, so a job recompiles only what changed.
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - name: Age the restored Go build cache
        id: age
        if: matrix.shard == 'native-1'
        shell: bash
        run: automation/ci/gocache-trim.sh age
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            extensions/sdk-ts/package-lock.json
            test/parity/interface-extractor/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select the qualified Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain installation failed" }
          rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain selection failed" }
      # fd and ripgrep come from pinned GitHub release archives verified against
      # automation/ci/windows-tools.txt, not from a package feed whose outages
      # (504, missing lib paths) failed every Windows shard.
      - name: Restore the native test tool archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\native-tool-archives
          key: native-tools-${{ runner.os }}-${{ hashFiles('automation/ci/windows-tools.txt', 'automation/ci/install-windows-tools.ps1') }}
      - name: Install native test tools
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'native-tools'
          ./automation/ci/install-windows-tools.ps1 -Cache (Join-Path $env:RUNNER_TEMP 'native-tool-archives') -Bin $bin
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          $env:PATH = "$bin;$env:PATH"
          fd --version
          if ($LASTEXITCODE -ne 0) { throw "fd is not available" }
          rg --version
          if ($LASTEXITCODE -ne 0) { throw "ripgrep is not available" }
      # Without this every Windows job builds the oracle from source (5-12 minutes); oracle.py reuses a restored build whose stamp matches.
      - name: Restore the Pi oracle build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}
      - name: Install pinned Pi test oracle
        shell: bash
        run: |
          set -euo pipefail
          # npm ci installs the lockfile-pinned npm; later steps use it via PATH.
          automation/ci/install-npm-toolchain.sh
          bin="$PWD/automation/ci/npm-toolchain/node_modules/.bin"
          cygpath -w "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$NPM_VERSION"
          # Builds Pi from source at the pin and links it as the oracle (automation/pin/oracle.py); the published package is not the oracle.
          # setup-python on Windows provides python, not always python3.
          py="$(command -v python3 || command -v python)"
          "$py" automation/pin/pin.py install-oracle
          # The oracle tests' own locked npm trees, as make parity-deps installs them on Linux.
          "$py" automation/ci/npm-locked.py internal/typebox/testdata/npm
          "$py" automation/ci/npm-locked.py ai/testdata/sdk
      - name: Mirror the pinned Pi source
        # The extension host's parity tests read Pi's source from
        # .upstream/current, as on Linux (make upstream-mirror).
        shell: bash
        env:
          MSYS: winsymlinks:nativestrict
        run: ./automation/gen/mirror-upstream.sh
      - name: Build and smoke-test native Windows paths
        if: matrix.shard == 'native-1'
        shell: pwsh
        run: |
          $acceptanceRoot = Join-Path $env:RUNNER_TEMP 'pig native acceptance'
          New-Item -ItemType Directory -Force -Path $acceptanceRoot | Out-Null
          $env:PIG_HOME = Join-Path $acceptanceRoot 'config with spaces'
          $env:PIG_CODING_AGENT_DIR = Join-Path $env:PIG_HOME 'agent'
          go build -trimpath -o bin/pig.exe ./cmd/pig
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }
          & .\bin\pig.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pig.exe --help failed" }
          & .\bin\pig.exe --version
          if ($LASTEXITCODE -ne 0) { throw "pig.exe --version failed" }
          $env:PIG_TEST_FAUX = '1'
          $printOutput = & .\bin\pig.exe --model test-faux/faux-1 --no-session --no-extensions --print 'What is 20+22?'
          if ($LASTEXITCODE -ne 0 -or $printOutput -notmatch '42') { throw "Windows print smoke failed: $printOutput" }
          '{"id":"state","type":"get_state"}' | & .\bin\pig.exe --mode rpc --model test-faux/faux-1 --no-session --no-extensions | Out-File -Encoding utf8 (Join-Path $acceptanceRoot 'rpc.jsonl')
          if ($LASTEXITCODE -ne 0) { throw "Windows RPC smoke failed" }
          if ((Get-Content -Raw (Join-Path $acceptanceRoot 'rpc.jsonl')) -notmatch '"type":"response"') { throw "Windows RPC response missing" }
      - name: Test every package with Windows tests
        # The extension-host shard runs the extension host packages, and the
        # cli-N shards run cmd/pig in shards. The package
        # list comes from the toolchain, so a new Windows test file is run
        # without editing this workflow. The list holds packages with a
        # Windows-only test file; tests that branch on runtime.GOOS in a
        # file every platform builds are not selected by it.
        if: startsWith(matrix.shard, 'native-')
        shell: bash
        env:
          PI_TEST_NATIVE_CLIPBOARD: '1'
          NATIVE_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          acceptance="$RUNNER_TEMP/pig native acceptance"
          mkdir -p "$acceptance"
          export PIG_HOME="$acceptance/config with spaces"
          export PIG_CODING_AGENT_DIR="$PIG_HOME/agent"
          packages=$(automation/ci/windows-native-shard.sh "${NATIVE_SHARD#native-}")
          echo "$packages"
          go test -timeout 30m $packages
      - name: Test cmd/pig shards ${{ matrix.shard }} of 8
        # Each cli-N unit runs shard N of automation/ci/test-shard-pattern.sh, as make test-cli runs the shards on Linux: each in its own test process and timeout.
        if: startsWith(matrix.shard, 'cli-')
        shell: bash
        env:
          PI_TEST_NATIVE_CLIPBOARD: '1'
          UNITS: ${{ matrix.shard }}
          # TestMain dumps every goroutine if its setup has not reached m.Run by then; the test alarm covers only m.Run.
          PIG_TEST_STALL_DUMP: 4m
        run: automation/ci/windows-cli-units.sh
      - name: Select this job's extension tests
        # Each extension job runs its half of the package's tests, split by automation/ci/test-shard-pattern.sh so every test runs in exactly one job.
        if: startsWith(matrix.shard, 'extension-')
        shell: bash
        env:
          EXTENSION_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          case "$EXTENSION_SHARD" in
            extension-host-*) package=./coding/extension/host/subprocess shards=3 ;;
            extension-conformance-*) package=./test/extension-conformance shards=2 ;;
            *) echo "unexpected shard $EXTENSION_SHARD" >&2; exit 1 ;;
          esac
          run=$(automation/ci/test-shard-pattern.sh "${EXTENSION_SHARD##*-}" "$shards" "$package")
          echo "SHARD_RUN=$run" >> "$GITHUB_ENV"
      - name: Test Windows extension host packages
        if: startsWith(matrix.shard, 'extension-host-')
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: '2'
          PIG_REQUIRE_EXTENSION_TOOLCHAINS: '1'
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          $acceptanceRoot = Join-Path $env:RUNNER_TEMP 'pig extension acceptance'
          New-Item -ItemType Directory -Force -Path $acceptanceRoot | Out-Null
          $env:TEMP = $acceptanceRoot
          $env:TMP = $acceptanceRoot
          $env:TMPDIR = $acceptanceRoot
          $env:PIG_HOME = Join-Path $acceptanceRoot 'config with spaces'
          # runtimecell runs whole, in extension-host-1; the subprocess tests are split in three.
          if ($env:MATRIX_SHARD -eq 'extension-host-1') {
            go test -v -timeout 30m ./coding/extension/host/runtimecell
            if ($LASTEXITCODE -ne 0) { throw "Windows runtimecell tests failed" }
          }
          go test -v -timeout 30m -run $env:SHARD_RUN ./coding/extension/host/subprocess
          if ($LASTEXITCODE -ne 0) { throw "Windows extension host tests failed" }
      - name: Test Windows extension conformance for every SDK
        if: startsWith(matrix.shard, 'extension-conformance-')
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: '2'
          PIG_REQUIRE_EXTENSION_TOOLCHAINS: '1'
        run: |
          $acceptanceRoot = Join-Path $env:RUNNER_TEMP 'pig extension acceptance'
          New-Item -ItemType Directory -Force -Path $acceptanceRoot | Out-Null
          $env:TEMP = $acceptanceRoot
          $env:TMP = $acceptanceRoot
          $env:TMPDIR = $acceptanceRoot
          $env:PIG_HOME = Join-Path $acceptanceRoot 'config with spaces'
          go test -v -timeout 30m -run $env:SHARD_RUN ./test/extension-conformance
          if ($LASTEXITCODE -ne 0) { throw "Windows Go, Node, Rust, Python, or fused-Go extension conformance failed" }
      - name: Keep only the Go build cache entries this job used
        if: ${{ !cancelled() && steps.age.outcome == 'success' }}
        shell: bash
        run: automation/ci/gocache-trim.sh trim
      - name: Save the Go build cache
        if: ${{ !cancelled() && steps.age.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  macos:
    name: macOS ${{ matrix.shard }}
    needs: [changes, preflight]
    if: needs.changes.outputs.product == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # brew install would otherwise update every tap first and clean up afterwards.
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
    strategy:
      fail-fast: false
      matrix:
        # GitHub runs at most five macOS jobs at a time, so the units are packed into five jobs (longest first, from
        # measured run times) and run in one wave. Each unit still runs in its own go test process and timeout.
        # native: the smoke run of the packages with macOS-specific code.
        # cli-1 to cli-8: the eight cmd/pig shards that make test-cli runs on Linux (automation/ci/test-shard-pattern.sh).
        # extension-host-1 to extension-host-3: the subprocess extension host tests, split in three.
        # packages: the remaining packages whose tests bind Unix sockets, watch paths or resolve symlinked temporary
        # directories, which macOS spells differently from Linux (104-byte socket paths, /var -> /private/var).
        shard: [native, cli-1 extension-host-3 packages, cli-2 cli-8 extension-host-2, cli-4 cli-7 extension-host-1, cli-3 cli-5 cli-6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            extensions/sdk-ts/package-lock.json
            test/parity/interface-extractor/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select the qualified Rust toolchain
        # The cmd/pig and extension host tests build Rust extensions with the toolchain Linux and Windows pin.
        if: matrix.shard != 'native'
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_VERSION"
      - name: Restore the Pi oracle build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-dev/pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}
      - name: Install native test tools and pinned Pi oracle
        shell: bash
        run: |
          set -euo pipefail
          brew install fd ripgrep
          # npm ci installs the lockfile-pinned npm; later steps use it via PATH.
          automation/ci/install-npm-toolchain.sh
          bin="$PWD/automation/ci/npm-toolchain/node_modules/.bin"
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$NPM_VERSION"
          # Builds Pi from source at the pin and links it as the oracle (automation/pin/oracle.py); the published package is not the oracle.
          python3 automation/pin/pin.py install-oracle
          # The oracle tests' own locked npm trees, as make parity-deps installs them on Linux.
          python3 automation/ci/npm-locked.py internal/typebox/testdata/npm
          python3 automation/ci/npm-locked.py ai/testdata/sdk
      - name: Mirror the pinned Pi source
        # The ai package's upstream tests read Pi's source from
        # .upstream/current, as on Linux (make upstream-mirror) and Windows.
        run: ./automation/gen/mirror-upstream.sh
      - name: Install a current bash for the shard selection script
        # test-shard-pattern.sh needs bash 4; macOS ships 3.2 as /bin/bash.
        # Only the bash keg goes on PATH: the Homebrew bin directory also holds the image's default node and npm, which would shadow the pinned toolchain.
        if: contains(matrix.shard, 'cli-') || contains(matrix.shard, 'extension-host-')
        run: |
          set -euo pipefail
          brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain identities
        id: toolchain
        # The Pi oracle and the Node extensions run under the node on PATH, so every later step must see the pinned toolchain.
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go$(tr -d '\r\n' < .go-version)"
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(npm --version)" = "$NPM_VERSION"
          python3 automation/pin/pin.py check-oracle
      - name: Build and test native macOS paths
        if: matrix.shard == 'native'
        run: |
          set -euo pipefail
          go build -trimpath -o bin/pig ./cmd/pig
          ./bin/pig --version
          # The ai package has about 2700 top-level tests and needs more than go test's default 10 minutes here: Linux splits it in two processes (automation/ci/test-grouped.sh) and Windows runs it alone under this timeout.
          go test -timeout 30m ./ai ./internal/codingagent/tools ./internal/nativeplatform ./tui
      # A unit that fails does not stop the job: every unit of the job runs, and the step fails if any unit failed.
      - name: Test cmd/pig shards ${{ matrix.shard }}
        # Each cli-N unit runs shard N of automation/ci/test-shard-pattern.sh, as make test-cli runs the shards on Linux: each in its own go test process and timeout.
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && contains(matrix.shard, 'cli-') }}
        env:
          UNITS: ${{ matrix.shard }}
        run: automation/ci/macos-units.sh cli
      - name: Test the extension host units of ${{ matrix.shard }}
        # Each extension-host-N unit runs its third of the package's tests, split by automation/ci/test-shard-pattern.sh so every test runs in exactly one unit.
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && contains(matrix.shard, 'extension-host-') }}
        env:
          UNITS: ${{ matrix.shard }}
        run: automation/ci/macos-units.sh extension-host
      - name: Test env and coding/piglet
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && contains(matrix.shard, 'packages') }}
        env:
          UNITS: ${{ matrix.shard }}
        run: automation/ci/macos-units.sh packages

  android:
    name: Android build
    needs: [changes]
    if: needs.changes.outputs.product == 'true'
    # Termux runs this binary. The runner image provides the NDK; no hosted
    # runner executes the result, so this builds it with cgo and checks its ELF
    # headers (PIE, /system/bin/linker64, bionic libc) as the release does.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Build and check the Android binary
        shell: bash
        run: |
          set -euo pipefail
          automation/release/android-binary.sh build -trimpath -o "$RUNNER_TEMP/pig-android" ./cmd/pig
          automation/release/android-binary.sh check "$RUNNER_TEMP/pig-android"
      - name: Vet the Android packages
        run: CGO_ENABLED=0 GOOS=android GOARCH=arm64 go vet ./...

  cache-prune:
    name: Prune superseded caches
    # Each run saves a Go build cache and the PORT_MAP coverage under a new per-commit key, and the repository's cache limit
    # evicts by age once it is full. Keeping only the newest entry of each per-commit prefix leaves room for every OS's cache.
    # Caches are scoped to the ref that saved them (a pull request's merge ref, a branch), and a run falls back to its base
    # and default branch, so the newest entry is kept per ref: a newer pull request entry never removes the default branch's.
    needs: [linux, windows, macos]
    # A fork's pull request gets a read-only token, so only same-repository events prune.
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete all but the newest cache of each per-commit prefix and ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for prefix in gocache-Linux- gocache-Windows- portmap-coverage- golangci-lint-Linux- pi-oracle-Linux- pi-oracle-Windows- pi-oracle-macOS-; do
            gh cache list --repo "$REPO" --key "$prefix" --limit 100 --json id,ref,createdAt \
              --jq 'group_by(.ref)[] | sort_by(.createdAt) | reverse | .[1:][] | .id' |
              while read -r id; do
                # A concurrent run may have deleted the same superseded entry first.
                gh cache delete "$id" --repo "$REPO" || echo "::warning::cache $id could not be deleted"
              done
          done

  result:
    name: CI result
    # The one required check for this workflow. It runs even when a job it
    # needs failed, because a skipped job would otherwise count as passing.
    # A job may be skipped only where its own condition skips it.
    needs: [changes, docs, dco, preflight, verify, node-runtime, windows, macos, android, node-loader, durable-cf-host]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job this change needs
        env:
          EVENT: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PRODUCT: ${{ needs.changes.outputs.product }}
          CHANGES: ${{ needs.changes.result }}
          DOCS: ${{ needs.docs.result }}
          DCO: ${{ needs.dco.result }}
          VERIFY: ${{ needs.verify.result }}
          NODE_RUNTIME: ${{ needs.node-runtime.result }}
          WINDOWS: ${{ needs.windows.result }}
          MACOS: ${{ needs.macos.result }}
          ANDROID: ${{ needs.android.result }}
          NODE_LOADER: ${{ needs.node-loader.result }}
          DURABLE_CF_HOST: ${{ needs.durable-cf-host.result }}
          PREFLIGHT: ${{ needs.preflight.result }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          expect() { # job result allowed-skip
            if [ "$2" = success ] || { [ "$2" = skipped ] && [ "$3" = true ]; }; then
              echo "$1: $2"
            else
              echo "::error::$1: $2"
              status=1
            fi
          }
          product_skip=false; docs_skip=false; dco_skip=false
          [ "$PRODUCT" = false ] && product_skip=true
          [ "$PRODUCT" = true ] && docs_skip=true
          { [ "$EVENT" != pull_request ] || [ "$PR_AUTHOR" = 'dependabot[bot]' ]; } && dco_skip=true
          expect "Changed paths" "$CHANGES" false
          expect "Project documents" "$DOCS" "$docs_skip"
          expect "DCO" "$DCO" "$dco_skip"
          expect "Linux verification" "$VERIFY" false
          expect "Linux preflight" "$PREFLIGHT" "$product_skip"
          expect "Node extensions" "$NODE_RUNTIME" "$product_skip"
          expect "Windows" "$WINDOWS" "$product_skip"
          expect "macOS" "$MACOS" "$product_skip"
          expect "Android" "$ANDROID" "$product_skip"
          expect "Node loader" "$NODE_LOADER" "$product_skip"
          expect "Durable Cloudflare host" "$DURABLE_CF_HOST" "$product_skip"
          exit "$status"
