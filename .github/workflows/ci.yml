          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$NPM_VERSION"
      # The host's tests import Pi's chord, pi-ai and pi-durable from the build of the commit .upstream/pin names (a release pin: the
      # published release), as every other parity check does; make durable-core-host-deps links them. The oracle build is the same
      # for every job of a pin; oracle.py reuses a restored build whose stamp matches.
      - name: Restore the Pi oracle build
        id: cache-pi-oracle-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-dev/pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}
      # TinyGo (the tinygo row of automation/dev/toolchains.lock, digest-checked) builds the codemode module and the
      # TinyGo pass's core; the Pi reference the conformance tests read is the checkout durable/contract/PIN names.
      - name: Restore TinyGo and the Pi reference
        id: cache-tinygo-and-the-pi-reference
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pig-dev/tinygo
            durable/contract/.cache
          key: durable-cf-host-${{ runner.os }}-${{ hashFiles('automation/dev/toolchains.lock', 'durable/contract/PIN') }}
      # The assignment is its own command so a failed install fails this step: inside echo "TINYGO=$(...)" its status is lost, TINYGO is empty, and
      # the next step reports "tinygo not found" (Error 127) for what was a download failure.
      - name: Install the pinned TinyGo
        shell: bash
        run: tinygo=$(sh durable/core/budget/tinygo-install.sh) && echo "TINYGO=$tinygo" >> "$GITHUB_ENV"
      # durable-core-host-check: durable-contract-setup, durable-core-host-deps (the pinned Pi build, then the locked npm tree), upstream-mirror (the pin's source
      # mirror the examples type-check reads), then check.sh: tsc and the whole suite against the core built with Go and with TinyGo.
      - name: Typecheck and test the Cloudflare host
        shell: bash
        run: automation/ci/with-isolated-pig-home.sh make durable-core-host-check
      # durable-core-budget: the size budget of the core and the host bundle, the TinyGo heap policy, and the allocation-site
      # baseline (durable/core/budget/allocs.json). It needs the TinyGo installed above, and no other job runs it.
      - name: Check the Durable core budget
        shell: bash
        run: automation/ci/with-isolated-pig-home.sh make durable-core-budget
      - name: Save the Go module cache
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-gomod.outcome == 'success' && steps.cache-gomod.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
      - name: Save TinyGo and the Pi reference
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-tinygo-and-the-pi-reference.outcome == 'success' && steps.cache-tinygo-and-the-pi-reference.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pig-dev/tinygo
            durable/contract/.cache
          key: durable-cf-host-${{ runner.os }}-${{ hashFiles('automation/dev/toolchains.lock', 'durable/contract/PIN') }}
      - name: Save the Pi oracle build
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-pi-oracle-build.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-dev/pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}

  durable-contract:
    name: Durable contract / ${{ matrix.impl }}
    needs: [changes, bookkeeping]
    if: needs.changes.outputs.product == 'true' && needs.changes.outputs.run-durable-contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # make durable-contract runs every corpus row against Pi and one build of the core: pi is the control (the reference
        # against itself), wasm-tinygo the shipped Wasm build, native the same source natively. Three jobs keep each inside its
        # limit; each recomputes the reference captures it compares with.
        impl: [pi, wasm-tinygo, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore the Go module cache
        id: cache-gomod
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      # A pull request restores the newest build cache of main (cache-warm.yml and the weekly run save it) and saves none.
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pinned npm
        shell: bash
        run: |
          set -euo pipefail
          automation/ci/install-npm-toolchain.sh
          bin="$PWD/automation/ci/npm-toolchain/node_modules/.bin"
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$NPM_VERSION"
      # The same Pi oracle build, TinyGo and reference checkout as the Cloudflare host job; the cache keys are shared with it, so
      # whichever job runs first warms the other.
      - name: Restore the Pi oracle build
        id: cache-pi-oracle-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-dev/pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}
      - name: Restore TinyGo and the Pi reference
        id: cache-tinygo-and-the-pi-reference
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pig-dev/tinygo
            durable/contract/.cache
          key: durable-cf-host-${{ runner.os }}-${{ hashFiles('automation/dev/toolchains.lock', 'durable/contract/PIN') }}
      # The assignment is its own command so a failed install fails this step: inside echo "TINYGO=$(...)" its status is lost, TINYGO is empty, and
      # the next step reports "tinygo not found" (Error 127) for what was a download failure.
      - name: Install the pinned TinyGo
        shell: bash
        run: tinygo=$(sh durable/core/budget/tinygo-install.sh) && echo "TINYGO=$tinygo" >> "$GITHUB_ENV"
      # durable-contract: durable-contract-setup (the Pi reference and its npm tree), durable-core-host-deps for the host, then
      # cd durable/contract && node cli/contract.mjs all --impls <impl>: every row, per-lane table, exit 1 on a row that differs.
      - name: Run the Durable core conformance gate
        shell: bash
        env:
          DURABLE_CONTRACT_ARGS: --impls ${{ matrix.impl }} -j 4
        run: automation/ci/with-isolated-pig-home.sh make ci-durable-contract
      - name: Save the Go module cache
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-gomod.outcome == 'success' && steps.cache-gomod.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
      - name: Save TinyGo and the Pi reference
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-tinygo-and-the-pi-reference.outcome == 'success' && steps.cache-tinygo-and-the-pi-reference.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pig-dev/tinygo
            durable/contract/.cache
          key: durable-cf-host-${{ runner.os }}-${{ hashFiles('automation/dev/toolchains.lock', 'durable/contract/PIN') }}
      - name: Save the Pi oracle build
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-pi-oracle-build.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-dev/pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}

  verify:
    name: Linux verification
    needs: [changes, linux]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Linux shard
        env:
          CHANGES: ${{ needs.changes.result }}
          PRODUCT: ${{ needs.changes.outputs.product }}
          RESULT: ${{ needs.linux.result }}
        # Shards are skipped only when the change classifier succeeded and
        # found no product change.
        run: test "$RESULT" = success || { test "$CHANGES" = success && test "$PRODUCT" = false && test "$RESULT" = skipped; }

  windows:
    name: Windows ${{ matrix.shard }}
    needs: [changes, preflight]
    if: needs.changes.outputs.product == 'true' && needs.changes.outputs.windows != '[]'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # extension-host: the extension host packages (runtimecell and
        # subprocess). extension-conformance: every SDK against the in-process
        # reference. native-1 to native-4: the smoke run (native-1) and every other
        # package that carries Windows tests, in four parallel jobs
        # (automation/ci/windows-native-shard.sh). The eight cmd/pig shards share four
        # jobs, paired longest with shortest from measured run times, so each job builds
        # the test binary once. The two extension shards were one shard whose extension
        # step took 49 of the job's 60 minutes, and native with cmd/pig reached the
        # 60-minute limit. Longest jobs first. The shards come from automation/ci/ci-tiers.txt through the changes job:
        # the light pull-request run keeps native-1, the full run every shard, under the same check names.
        include: ${{ fromJSON(needs.changes.outputs.windows) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub's hosted Windows images put RUNNER_TEMP on the D: drive, which handles many small files faster than C:; the
      # step prints the drives to show it. The Go build cache and the Pi oracle store live there. Go's temporary directories
      # stay on the system drive: tests run their binaries and temporary trees there, as a user's would.
      - name: Keep Go and oracle scratch under RUNNER_TEMP
        shell: pwsh
        run: |
          "GOCACHE=$(Join-Path $env:RUNNER_TEMP 'go-build')" >> $env:GITHUB_ENV
          "PIG_PI_BUILD_STORE=$(Join-Path $env:RUNNER_TEMP 'pi-builds')" >> $env:GITHUB_ENV
          Write-Output "RUNNER_TEMP=$env:RUNNER_TEMP"
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          # The job restores its own Go build cache below; setup-go's copy would download a second, older one.
          cache: false
      - name: Restore the Go module cache
        id: cache-the-go-module-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      # This restores the newest cache a previous run saved, so a job recompiles only what changed.
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - name: Age the restored Go build cache
        id: age
        if: matrix.shard == 'native-1'
        shell: bash
        run: automation/ci/gocache-trim.sh age
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Restore the npm cache
        id: cache-npm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\npm-cache
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('extensions/sdk-ts/package-lock.json', 'test/parity/interface-extractor/package-lock.json') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ runner.arch }}-npm-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Select the qualified Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain installation failed" }
          rustup default $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain selection failed" }
      # fd and ripgrep come from pinned GitHub release archives verified against
      # automation/ci/windows-tools.txt, not from a package feed whose outages
      # (504, missing lib paths) failed every Windows shard.
      - name: Restore the native test tool archives
        id: cache-native-test-tool-archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\native-tool-archives
          key: native-tools-${{ runner.os }}-${{ hashFiles('automation/ci/windows-tools.txt', 'automation/ci/install-windows-tools.ps1') }}
      - name: Install native test tools
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'native-tools'
          ./automation/ci/install-windows-tools.ps1 -Cache (Join-Path $env:RUNNER_TEMP 'native-tool-archives') -Bin $bin
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          $env:PATH = "$bin;$env:PATH"
          fd --version
          if ($LASTEXITCODE -ne 0) { throw "fd is not available" }
          rg --version
          if ($LASTEXITCODE -ne 0) { throw "ripgrep is not available" }
      # Without this every Windows job builds the oracle from source (5-12 minutes); oracle.py reuses a restored build whose stamp matches.
      - name: Restore the Pi oracle build
        id: cache-pi-oracle-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}
      - name: Install pinned Pi test oracle
        shell: bash
        run: |
          set -euo pipefail
          # npm ci installs the lockfile-pinned npm; later steps use it via PATH.
          automation/ci/install-npm-toolchain.sh
          bin="$PWD/automation/ci/npm-toolchain/node_modules/.bin"
          cygpath -w "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$NPM_VERSION"
          # Builds Pi from source at the pin and links it as the oracle (automation/pin/oracle.py); the published package is not the oracle.
          # setup-python on Windows provides python, not always python3.
          py="$(command -v python3 || command -v python)"
          "$py" automation/pin/pin.py install-oracle
          # The oracle tests' own locked npm trees, as make parity-deps installs them on Linux.
          "$py" automation/ci/npm-locked.py internal/typebox/testdata/npm
          "$py" automation/ci/npm-locked.py ai/testdata/sdk
          # The ai package's oracle tests import Pi's source through durable/interop's node_modules (make durable-interop-deps on Linux): the locked release of a tag pin. Every native shard installs it: the shard split decides which shard runs ./ai.
          if [ "$("$py" automation/pin/pin.py get kind)" = tag ]; then "$py" automation/ci/npm-locked.py durable/interop; fi
      - name: Mirror the pinned Pi source
        # The extension host's parity tests read Pi's source from
        # .upstream/current, as on Linux (make upstream-mirror).
        shell: bash
        env:
          MSYS: winsymlinks:nativestrict
        run: ./automation/gen/mirror-upstream.sh
      - name: Build and smoke-test native Windows paths
        if: matrix.shard == 'native-1'
        shell: pwsh
        run: |
          $acceptanceRoot = Join-Path $env:RUNNER_TEMP 'pig native acceptance'
          New-Item -ItemType Directory -Force -Path $acceptanceRoot | Out-Null
          $env:PIG_HOME = Join-Path $acceptanceRoot 'config with spaces'
          $env:PIG_CODING_AGENT_DIR = Join-Path $env:PIG_HOME 'agent'
          go build -trimpath -o bin/pig.exe ./cmd/pig
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }
          & .\bin\pig.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pig.exe --help failed" }
          & .\bin\pig.exe --version
          if ($LASTEXITCODE -ne 0) { throw "pig.exe --version failed" }
          $env:PIG_TEST_FAUX = '1'
          $printOutput = & .\bin\pig.exe --model test-faux/faux-1 --no-session --no-extensions --print 'What is 20+22?'
          if ($LASTEXITCODE -ne 0 -or $printOutput -notmatch '42') { throw "Windows print smoke failed: $printOutput" }
          '{"id":"state","type":"get_state"}' | & .\bin\pig.exe --mode rpc --model test-faux/faux-1 --no-session --no-extensions | Out-File -Encoding utf8 (Join-Path $acceptanceRoot 'rpc.jsonl')
          if ($LASTEXITCODE -ne 0) { throw "Windows RPC smoke failed" }
          if ((Get-Content -Raw (Join-Path $acceptanceRoot 'rpc.jsonl')) -notmatch '"type":"response"') { throw "Windows RPC response missing" }
      - name: Install the pinned SBCL
        # The Lisp SDK rows run in the extension jobs and in cmd/pig's TestReplacedSession2860AcrossSDKs, which starts every SDK's realization and fails without sbcl; SBCL's official Windows installer is checked against the lock's SHA-256.
        if: startsWith(matrix.shard, 'extension-') || startsWith(matrix.shard, 'cli-')
        shell: pwsh
        run: ./automation/ci/install-sbcl.ps1 -GithubEnv
      - name: Test every package with Windows tests
        # The extension-host shard runs the extension host packages, and the
        # cli-N shards run cmd/pig in shards. The package
        # list comes from the toolchain, so a new Windows test file is run
        # without editing this workflow. The list holds packages with a
        # Windows-only test file; tests that branch on runtime.GOOS in a
        # file every platform builds are not selected by it.
        if: startsWith(matrix.shard, 'native-')
        shell: bash
        env:
          PI_TEST_NATIVE_CLIPBOARD: '1'
          NATIVE_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          acceptance="$RUNNER_TEMP/pig native acceptance"
          mkdir -p "$acceptance"
          export PIG_HOME="$acceptance/config with spaces"
          export PIG_CODING_AGENT_DIR="$PIG_HOME/agent"
          packages=$(automation/ci/windows-native-shard.sh "${NATIVE_SHARD#native-}")
          echo "$packages"
          go test -timeout 30m $packages
      - name: Test cmd/pig shards ${{ matrix.shard }} of 8
        # Each cli-N unit runs shard N of automation/ci/test-shard-pattern.sh, as make test-cli runs the shards on Linux: each in its own test process and timeout.
        if: startsWith(matrix.shard, 'cli-')
        shell: bash
        env:
          PI_TEST_NATIVE_CLIPBOARD: '1'
          UNITS: ${{ matrix.shard }}
          # TestMain dumps every goroutine if its setup has not reached m.Run by then; the test alarm covers only m.Run.
          PIG_TEST_STALL_DUMP: 4m
        run: automation/ci/windows-cli-units.sh
      - name: Select this job's extension tests
        # Each extension job runs its half of the package's tests, split by automation/ci/test-shard-pattern.sh so every test runs in exactly one job.
        if: startsWith(matrix.shard, 'extension-')
        shell: bash
        env:
          EXTENSION_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          case "$EXTENSION_SHARD" in
            extension-host-*) package=./coding/extension/host/subprocess shards=3 ;;
            extension-conformance-*) package=./test/extension-conformance shards=4 ;;
            *) echo "unexpected shard $EXTENSION_SHARD" >&2; exit 1 ;;
          esac
          run=$(automation/ci/test-shard-pattern.sh "${EXTENSION_SHARD##*-}" "$shards" "$package")
          echo "SHARD_RUN=$run" >> "$GITHUB_ENV"
      - name: Test Windows extension host packages
        if: startsWith(matrix.shard, 'extension-host-')
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: '2'
          PIG_REQUIRE_EXTENSION_TOOLCHAINS: '1'
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          $acceptanceRoot = Join-Path $env:RUNNER_TEMP 'pig extension acceptance'
          New-Item -ItemType Directory -Force -Path $acceptanceRoot | Out-Null
          $env:TEMP = $acceptanceRoot
          $env:TMP = $acceptanceRoot
          $env:TMPDIR = $acceptanceRoot
          $env:PIG_HOME = Join-Path $acceptanceRoot 'config with spaces'
          # runtimecell runs whole, in extension-host-1; the subprocess tests are split in three.
          if ($env:MATRIX_SHARD -eq 'extension-host-1') {
            go test -v -timeout 30m ./coding/extension/host/runtimecell
            if ($LASTEXITCODE -ne 0) { throw "Windows runtimecell tests failed" }
          }
          go test -v -timeout 30m -run $env:SHARD_RUN ./coding/extension/host/subprocess
          if ($LASTEXITCODE -ne 0) { throw "Windows extension host tests failed" }
      - name: Test Windows extension conformance for every SDK
        if: startsWith(matrix.shard, 'extension-conformance-')
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: '2'
          PIG_REQUIRE_EXTENSION_TOOLCHAINS: '1'
        run: |
          $acceptanceRoot = Join-Path $env:RUNNER_TEMP 'pig extension acceptance'
          New-Item -ItemType Directory -Force -Path $acceptanceRoot | Out-Null
          $env:TEMP = $acceptanceRoot
          $env:TMP = $acceptanceRoot
          $env:TMPDIR = $acceptanceRoot
          $env:PIG_HOME = Join-Path $acceptanceRoot 'config with spaces'
          go test -v -timeout 30m -run $env:SHARD_RUN ./test/extension-conformance
          if ($LASTEXITCODE -ne 0) { throw "Windows Go, Node, Rust, Python, or fused-Go extension conformance failed" }
      - name: Keep only the Go build cache entries this job used
        if: ${{ !cancelled() && steps.age.outcome == 'success' && env.CACHE_SAVE == 'true' }}
        shell: bash
        run: automation/ci/gocache-trim.sh trim
      - name: Save the Go build cache
        if: ${{ !cancelled() && steps.age.outcome == 'success' && env.CACHE_SAVE == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
      - name: Save the Go module cache
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-the-go-module-cache.outcome == 'success' && steps.cache-the-go-module-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
      - name: Save the npm cache
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-npm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\npm-cache
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('extensions/sdk-ts/package-lock.json', 'test/parity/interface-extractor/package-lock.json') }}
      - name: Save the native test tool archives
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-native-test-tool-archives.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\native-tool-archives
          key: native-tools-${{ runner.os }}-${{ hashFiles('automation/ci/windows-tools.txt', 'automation/ci/install-windows-tools.ps1') }}
      - name: Save the Pi oracle build
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-pi-oracle-build.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}

  macos:
    name: macOS ${{ matrix.shard }}
    needs: [changes, preflight]
    if: needs.changes.outputs.product == 'true' && needs.changes.outputs.macos != '[]'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      # brew install would otherwise update every tap first and clean up afterwards.
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
    strategy:
      fail-fast: false
      matrix:
        # GitHub runs at most five macOS jobs at a time, so the units are packed into five jobs (longest first, from
        # measured run times) and run in one wave. Each unit still runs in its own go test process and timeout.
        # The times are go test's own seconds in run 43302835411, where a job spent 4 to 5 more minutes on its setup and on
        # compiling: cli-1 559, cli-2 567, cli-3 506, cli-4 432 (each the first unit of its job), cli-5 239, cli-6 223,
        # cli-7 217, cli-8 174, extension-host-1 507, extension-host-2 407, extension-host-3 1323, packages 204.
        # extension-host-3 has a job to itself, 27 of the 40 minutes: after cli-1 and before packages it ran into the limit.
        # The other three jobs hold 1379, 1352 and 1304 s of tests, 26 to 28 minutes with the setup.
        # native: the smoke run of the packages with macOS-specific code.
        # cli-1 to cli-8: the eight cmd/pig shards that make test-cli runs on Linux (automation/ci/test-shard-pattern.sh).
        # extension-host-1 to extension-host-3: the subprocess extension host tests, split in three.
        # packages: the remaining packages whose tests bind Unix sockets, watch paths or resolve symlinked temporary
        # directories, which macOS spells differently from Linux (104-byte socket paths, /var -> /private/var).
        # The shards come from automation/ci/ci-tiers.txt through the changes job: the light pull-request run keeps native,
        # the full run every shard, under the same check names.
        include: ${{ fromJSON(needs.changes.outputs.macos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore the Go module cache
        id: cache-gomod
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Restore the npm cache
        id: cache-npm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('extensions/sdk-ts/package-lock.json', 'test/parity/interface-extractor/package-lock.json') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ runner.arch }}-npm-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Select the qualified Rust toolchain
        # The cmd/pig and extension host tests build Rust extensions with the toolchain Linux and Windows pin.
        if: matrix.shard != 'native'
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_VERSION"
      - name: Restore the pinned SBCL
        id: cache-pinned-sbcl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-sbcl
          key: sbcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('automation/dev/toolchains.lock', 'automation/ci/install-sbcl.sh') }}
      - name: Install the pinned SBCL
        # SBCL publishes no binary of the pinned release for arm64 macOS: the script builds the checksummed release source with the arm64 macOS binary row of automation/dev/toolchains.lock.
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(automation/ci/install-sbcl.sh)"
          echo "PIG_SBCL=$prefix/bin/sbcl" >> "$GITHUB_ENV"
          echo "SBCL_HOME=$prefix/lib/sbcl" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Restore the Pi oracle build
        id: cache-pi-oracle-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-dev/pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}
      - name: Install native test tools and pinned Pi oracle
        shell: bash
        run: |
          set -euo pipefail
          brew install fd ripgrep
          # npm ci installs the lockfile-pinned npm; later steps use it via PATH.
          automation/ci/install-npm-toolchain.sh
          bin="$PWD/automation/ci/npm-toolchain/node_modules/.bin"
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$NPM_VERSION"
          # Builds Pi from source at the pin and links it as the oracle (automation/pin/oracle.py); the published package is not the oracle.
          python3 automation/pin/pin.py install-oracle
          # The oracle tests' own locked npm trees, as make parity-deps installs them on Linux.
          python3 automation/ci/npm-locked.py internal/typebox/testdata/npm
          python3 automation/ci/npm-locked.py ai/testdata/sdk
          # The ai package's oracle tests import Pi's source through durable/interop's node_modules (make durable-interop-deps on Linux): the locked release of a tag pin.
          if [ "$(python3 automation/pin/pin.py get kind)" = tag ]; then python3 automation/ci/npm-locked.py durable/interop; fi
      - name: Mirror the pinned Pi source
        # The ai package's upstream tests read Pi's source from
        # .upstream/current, as on Linux (make upstream-mirror) and Windows.
        run: ./automation/gen/mirror-upstream.sh
      - name: Install a current bash for the shard selection script
        # test-shard-pattern.sh needs bash 4; macOS ships 3.2 as /bin/bash.
        # Only the bash keg goes on PATH: the Homebrew bin directory also holds the image's default node and npm, which would shadow the pinned toolchain.
        if: contains(matrix.shard, 'cli-') || contains(matrix.shard, 'extension-host-')
        run: |
          set -euo pipefail
          brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain identities
        id: toolchain
        # The Pi oracle and the Node extensions run under the node on PATH, so every later step must see the pinned toolchain.
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go$(tr -d '\r\n' < .go-version)"
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(npm --version)" = "$NPM_VERSION"
          python3 automation/pin/pin.py check-oracle
      - name: Build and test native macOS paths
        if: matrix.shard == 'native'
        run: |
          set -euo pipefail
          go build -trimpath -o bin/pig ./cmd/pig
          ./bin/pig --version
          # The ai package has about 2700 top-level tests and needs more than go test's default 10 minutes here: Linux splits it in two processes (automation/ci/test-grouped.sh) and Windows runs it alone under this timeout.
          go test -timeout 30m ./ai ./internal/codingagent/tools ./internal/nativeplatform ./tui
      - name: Test stop and continue on macOS
        # A stopped and continued process gets EINTR from the termios ioctl on macOS only (#397), so the real-pty tests of the foreground check and raw mode, the suspend and dead-terminal
        # tests of the interactive mode, and scenario 61 (Ctrl+Z, bg, fg against the pinned Pi in tmux) run here as well.
        if: matrix.shard == 'native'
        env:
          # The PiG binary under test is the one built above; the pinned Pi is the source-built oracle that install-oracle linked into extensions/sdk-ts.
          PIG_PARITY_PIG_BIN: ${{ github.workspace }}/bin/pig
          PIG_PARITY_PI_BIN: ${{ github.workspace }}/extensions/sdk-ts/node_modules/.bin/pi
        run: |
          set -euo pipefail
          # The scenario's job-control shell must be a current bash: macOS ships 3.2, whose interactive script shell leaves the job in a background process group, so the program stops at its first terminal call.
          # Only the bash keg goes on PATH (the Homebrew bin directory also holds the image's default node and npm).
          brew install tmux bash
          export PATH="$(brew --prefix bash)/bin:$PATH"
          go test -count=1 -v -timeout 20m -run 'TestStdinInForeground|TestRawModeEntryFromABackgroundGroupSurvivesTheStopAndFg|TestEnterRawModeRetriesAnInterruptedTermiosIoctl|TestRestoreTerminalFromSignalRetriesAnInterruptedIoctl' ./tui
          go test -count=1 -v -timeout 20m -run 'TestSuspend|TestWriteToAHungUpTerminalExits129|TestRemoteEditorTerminalWrite|TestForegroundCheckFailingWithEIOTakesTheDeadTerminalExit' ./internal/codingagent
          # A failed scenario leaves the pane and the streams of both programs in its artifacts directory: print them, they are the only evidence of a macOS-only failure.
          go test -tags=parity -count=1 -v -timeout 20m -run '^TestParity$/^61-suspend-background-resume$' ./test/parity/runner -args -pig-parity.results="$RUNNER_TEMP/parity-61.json" || {
            find test/parity/artifacts -type f | while read -r f; do echo "::group::$f"; head -c 6000 "$f"; echo; echo "::endgroup::"; done
            exit 1
          }
      # A unit that fails does not stop the job: every unit of the job runs, and the step fails if any unit failed.
      - name: Test cmd/pig shards ${{ matrix.shard }}
        # Each cli-N unit runs shard N of automation/ci/test-shard-pattern.sh, as make test-cli runs the shards on Linux: each in its own go test process and timeout.
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && contains(matrix.shard, 'cli-') }}
        env:
          UNITS: ${{ matrix.shard }}
        run: automation/ci/macos-units.sh cli
      - name: Test the extension host units of ${{ matrix.shard }}
        # Each extension-host-N unit runs its third of the package's tests, split by automation/ci/test-shard-pattern.sh so every test runs in exactly one unit.
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && contains(matrix.shard, 'extension-host-') }}
        env:
          UNITS: ${{ matrix.shard }}
        run: automation/ci/macos-units.sh extension-host
      - name: Test env and coding/piglet
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && contains(matrix.shard, 'packages') }}
        env:
          UNITS: ${{ matrix.shard }}
        run: automation/ci/macos-units.sh packages
      - name: Save the npm cache
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-npm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('extensions/sdk-ts/package-lock.json', 'test/parity/interface-extractor/package-lock.json') }}
      - name: Save the pinned SBCL
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-pinned-sbcl.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-sbcl
          key: sbcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('automation/dev/toolchains.lock', 'automation/ci/install-sbcl.sh') }}
      - name: Save the Pi oracle build
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-pi-oracle-build.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-dev/pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}
      - name: Save the Go module cache
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-gomod.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
      - name: Save the Go build cache
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  android:
    name: Android build
    needs: [changes, bookkeeping]
    if: needs.changes.outputs.product == 'true' && needs.changes.outputs.run-android == 'true'
    # Termux runs this binary. The runner image provides the NDK; no hosted
    # runner executes the result, so this builds it with cgo and checks its ELF
    # headers (PIE, /system/bin/linker64, bionic libc) as the release does.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore the Go module cache
        id: cache-gomod
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Build and check the Android binary
        shell: bash
        run: |
          set -euo pipefail
          automation/release/android-binary.sh build -trimpath -o "$RUNNER_TEMP/pig-android" ./cmd/pig
          automation/release/android-binary.sh check "$RUNNER_TEMP/pig-android"
      - name: Vet the Android packages
        run: CGO_ENABLED=0 GOOS=android GOARCH=arm64 go vet ./...
      - name: Save the Go module cache
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-gomod.outcome == 'success' && steps.cache-gomod.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}

  cache-prune:
    name: Prune superseded caches
    # Each run saves a Go build cache and the PORT_MAP coverage under a new per-commit key, and the repository's cache limit
    # evicts by age once it is full. Keeping only the newest entry of each per-commit prefix leaves room for every OS's cache.
    # Caches are scoped to the ref that saved them (a pull request's merge ref, a branch), and a run falls back to its base
    # and default branch, so the newest entry is kept per ref: a newer pull request entry never removes the default branch's.
    needs: [linux, windows, macos]
    # A fork's pull request gets a read-only token, so only same-repository events prune.
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete all but the newest cache of each per-commit prefix and ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for prefix in gocache-Linux- gocache-Windows- gocache-macOS- golangci-lint-Linux- pi-oracle-Linux- pi-oracle-Windows- pi-oracle-macOS-; do
            gh cache list --repo "$REPO" --key "$prefix" --limit 100 --json id,ref,createdAt \
              --jq 'group_by(.ref)[] | sort_by(.createdAt) | reverse | .[1:][] | .id' |
              while read -r id; do
                # A concurrent run may have deleted the same superseded entry first.
                gh cache delete "$id" --repo "$REPO" || echo "::warning::cache $id could not be deleted"
              done
          done
          # Each portmap shard keeps its own newest ledger: the eight shards' keys (portmap-coverage-portmap-N-<sha>) share one
          # prefix, and pruning by that prefix kept one shard's entry and deleted the other seven. Group by key without the sha.
          gh cache list --repo "$REPO" --key portmap-coverage- --limit 200 --json id,ref,key,createdAt \
            --jq 'group_by([.ref, (.key | sub("-[0-9a-f]{40}$"; ""))])[] | sort_by(.createdAt) | reverse | .[1:][] | .id' |
            while read -r id; do
              gh cache delete "$id" --repo "$REPO" || echo "::warning::cache $id could not be deleted"
            done

  result:
    name: CI result
    # The one required check for this workflow. It runs even when a job it
    # needs failed, because a skipped job would otherwise count as passing.
    # A job may be skipped only where its own condition skips it: a docs-only
    # change skips the product jobs, and the light pull-request run skips the
    # jobs automation/ci/ci-tiers.txt leaves to the full run. Every event but a
    # pull request must have planned the full run, so the merge queue never
    # reports success for a skipped job. Without a merge queue (PIG_PR_CI_LIGHT
    # is label) a pull request's result fails unless this run is the full run
    # on the pull request's current head, so a head that only the light run
    # tested can never satisfy the required check.
    needs: [changes, verdict, bookkeeping, docs, preflight, verify, node-runtime, windows, macos, android, node-loader, durable-cf-host, durable-contract]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require every job this change needs
        env:
          EVENT: ${{ github.event_name }}
          PRODUCT: ${{ needs.changes.outputs.product }}
          FULL: ${{ needs.changes.outputs.full }}
          FULL_REQUIRED: ${{ needs.changes.outputs.full-required }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_NODE_RUNTIME: ${{ needs.changes.outputs.run-node-runtime }}
          RUN_NODE_LOADER: ${{ needs.changes.outputs.run-node-loader }}
          RUN_ANDROID: ${{ needs.changes.outputs.run-android }}
          RUN_DURABLE_CF_HOST: ${{ needs.changes.outputs.run-durable-cf-host }}
          RUN_DURABLE_CONTRACT: ${{ needs.changes.outputs.run-durable-contract }}
          CHANGES: ${{ needs.changes.result }}
          VERDICT: ${{ needs.verdict.result }}
          WINDOWS_PLANNED: ${{ needs.changes.outputs.windows != '[]' }}
          MACOS_PLANNED: ${{ needs.changes.outputs.macos != '[]' }}
          DOCS: ${{ needs.docs.result }}
          BOOKKEEPING: ${{ needs.bookkeeping.result }}
          VERIFY: ${{ needs.verify.result }}
          NODE_RUNTIME: ${{ needs.node-runtime.result }}
          WINDOWS: ${{ needs.windows.result }}
          MACOS: ${{ needs.macos.result }}
          ANDROID: ${{ needs.android.result }}
          NODE_LOADER: ${{ needs.node-loader.result }}
          DURABLE_CF_HOST: ${{ needs.durable-cf-host.result }}
          DURABLE_CONTRACT: ${{ needs.durable-contract.result }}
          PREFLIGHT: ${{ needs.preflight.result }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          expect() { # job result allowed-skip
            if [ "$2" = success ] || { [ "$2" = skipped ] && [ "$3" = true ]; }; then
              echo "$1: $2"
            else
              echo "::error::$1: $2"
              status=1
            fi
          }
          # The pre-flight comes first: a pull request it rejected, or never judged, fails here and no later job ran.
          if [ "$EVENT" = pull_request ] && [ "$VERDICT" != success ]; then
            echo "::error::Pre-flight verdict: $VERDICT; see the pre-flight comment and the preflight status on the pull request"
            exit 1
          fi
          if [ "$EVENT" != pull_request ] && [ "$VERDICT" != skipped ]; then
            echo "::error::Pre-flight verdict: $VERDICT, want skipped outside a pull request"
            exit 1
          fi
          # Every job that spends real minutes waits for bookkeeping, so when it fails they were skipped, not run.
          if [ "$BOOKKEEPING" != success ]; then
            echo "::error::Bookkeeping: $BOOKKEEPING; the jobs that wait for it did not run (see the Bookkeeping job's log)"
            exit 1
          fi
          product_skip=false; docs_skip=false
          [ "$PRODUCT" = false ] && product_skip=true
          [ "$PRODUCT" = true ] && docs_skip=true
          skip_unless_planned() { # run-output of a job the light run may leave out
            if [ "$product_skip" = true ] || [ "$1" = false ]; then echo true; else echo false; fi
          }
          if [ "$EVENT" != pull_request ] && [ "$FULL" != true ]; then
            echo "::error::$EVENT must run the full plan, got full=$FULL"
            status=1
          fi
          if [ "$FULL_REQUIRED" = true ]; then
            # This run's plan was made for the head in its event payload. A newer push has its own run and check, but a
            # re-run or a late event must not report success for a head that is no longer the pull request's.
            live=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha) || live=
            if [ -z "$live" ] || [ "$live" != "$PR_HEAD_SHA" ]; then
              echo "::error::this run tested ${PR_HEAD_SHA:-no head}, the pull request head is ${live:-unknown}"
              status=1
            fi
            # A docs-only change runs the same jobs in the light and the full run.
            if [ "$FULL" != true ] && [ "$PRODUCT" != false ]; then
              echo "::error::full run required: add the ci:full label to this pull request (or mark it ready for review, or dispatch CI on its branch); the light run does not test enough to merge"
              status=1
            fi
          fi
          expect "Changed paths" "$CHANGES" false
          expect "Project documents" "$DOCS" "$docs_skip"
          expect "Bookkeeping" "$BOOKKEEPING" false
          expect "Linux verification" "$VERIFY" false
          expect "Linux preflight" "$PREFLIGHT" "$product_skip"
          expect "Node extensions" "$NODE_RUNTIME" "$(skip_unless_planned "$RUN_NODE_RUNTIME")"
          # The light run is one runner: all its Windows and macOS rows are queue rows, so it plans none.
          windows_skip=$product_skip; [ "$WINDOWS_PLANNED" = false ] && windows_skip=true
          macos_skip=$product_skip; [ "$MACOS_PLANNED" = false ] && macos_skip=true
          expect "Windows" "$WINDOWS" "$windows_skip"
          expect "macOS" "$MACOS" "$macos_skip"
          expect "Android" "$ANDROID" "$(skip_unless_planned "$RUN_ANDROID")"
          expect "Node loader" "$NODE_LOADER" "$(skip_unless_planned "$RUN_NODE_LOADER")"
          expect "Durable Cloudflare host" "$DURABLE_CF_HOST" "$(skip_unless_planned "$RUN_DURABLE_CF_HOST")"
          expect "Durable contract" "$DURABLE_CONTRACT" "$(skip_unless_planned "$RUN_DURABLE_CONTRACT")"
          exit "$status"
