# SPDX-License-Identifier: MIT

name: CI

# The full verification runs on the exact tree that lands on main, so a squash
# merge lands what was tested and pushes to main do not run it again.
# The repository variable PIG_PR_CI_LIGHT selects how a pull request gets there:
#   unset  every pull request push runs the full set.
#   label  no merge queue: a push runs the light subset, and CI result fails
#          ("full run required") until the full set has run on the pull request's
#          head, which the ci:full label, marking the pull request ready for
#          review, or dispatching CI on the branch each start.
#   queue  a merge queue is required: a push runs the light subset and CI result
#          can pass, and the queue's merge_group run is the full verification.
# automation/ci/ci-tiers.txt assigns every job to a tier and .github/AGENTS.md
# renders the table. The light run is one runner (Linux). A pull request that changes a path of
# automation/ci/os-specific-paths.txt runs the full set, as does the ci:full label.
# Pre-flight first: a pull request's heavy jobs wait for the Pre-flight verdict job, which waits for the "preflight" commit
# status that .github/workflows/preflight.yml records on the head (automation/ci/preflight, about two minutes).
# The full run is also the nightly run on main (the only run that saves caches, with a manual dispatch), a push to a
# release/** branch, and a dispatch; .github/workflows/nightly-bisect.yml bisects a red nightly.
on:
  pull_request:
    # labeled starts the run that the ci:full label asks for; ready_for_review starts the one a draft's owner asks for.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
  push:
    branches: ['release/**']
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Go comes from .go-version, Node from .node-version, and Pi from
# .upstream/pin (a release tag or a pinned commit). make compliance checks every other copy
# of these pins.
env:
  # The big caches (Go modules and build output, Cargo, npm, the Durable Cloudflare host's TinyGo) are saved only from main (the weekly run and a dispatch there, and cache-warm.yml)
  # and from a dispatch on a release branch. A pull request restores main's and saves none: its own copies are visible to that pull request alone, a handful of them filled
  # the repository's cache limit and evicted main's. Every save step tests this.
  CACHE_SAVE: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/')) }}
  NPM_VERSION: 12.1.0
  RUST_VERSION: 1.97.1
  # Wall-clock and speed-ratio gates only warn on shared runners (internal/testenv.TimingGate); count, size and allocation gates still block. make test-timing runs them blocking on quiet hardware before a release.
  PIG_PERF_TIMING_REPORT_ONLY: '1'

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      product: ${{ steps.classify.outputs.product }}
      os-specific: ${{ steps.classify.outputs.os-specific }}
      full: ${{ steps.plan.outputs.full }}
      full-required: ${{ steps.plan.outputs.full-required }}
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
      macos: ${{ steps.plan.outputs.macos }}
      run-node-runtime: ${{ steps.plan.outputs.run-node-runtime }}
      run-durable-cf-host: ${{ steps.plan.outputs.run-durable-cf-host }}
      run-durable-contract: ${{ steps.plan.outputs.run-durable-contract }}
      run-android: ${{ steps.plan.outputs.run-android }}
      run-node-loader: ${{ steps.plan.outputs.run-node-loader }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        shell: bash
        run: |
          # Only a pull request or merge group that changes nothing but project
          # prose and repository metadata skips the product suites; the docs job
          # below still checks those files.
          automation/ci/classify-changes.sh "$EVENT" "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
      - name: Plan the jobs this event runs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ vars.PIG_PR_CI_LIGHT }}
          # The label is read from the event's payload, so it is the pull request's labels at the push, label or review
          # event that started this run.
          FULL_REQUESTED: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') || github.event.action == 'ready_for_review' || steps.classify.outputs.os-specific == 'true' }}
        shell: bash
        # Every event but a pull request in a PIG_PR_CI_LIGHT mode runs every
        # job in automation/ci/ci-tiers.txt; the light pull-request run is the
        # table's pr rows, so a queue-only job's check name appears only where
        # it runs.
        run: automation/ci/ci-plan.sh "$EVENT" "$MODE" "$FULL_REQUESTED" | tee -a "$GITHUB_OUTPUT"

  docs:
    name: Project documents
    needs: [changes]
    if: needs.changes.outputs.product == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog fragment check resolves the commits fragments name against the history of HEAD.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore the Go module cache
        id: cache-gomod
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      # A pull request restores the newest build cache of main (cache-warm.yml and the weekly run save it) and saves none.
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - name: Check the README, changelog and repository settings
        run: |
          go test ./test/ci-images/ ./test/docs-drift/
          python3 automation/ci/check-public-claims.py
      - name: Save the Go module cache
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-gomod.outcome == 'success' && steps.cache-gomod.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}

  verdict:
    name: Pre-flight verdict
    # The pre-flight (.github/workflows/preflight.yml) judges the pull request from its API data and a sparse checkout, and
    # records the "preflight" commit status on the head. This job runs no code of the pull request: it reads the status and
    # fails when the pre-flight rejected the head or gave no verdict, so Bookkeeping and everything after it do not start.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: automation/ci/wait-preflight.sh
          persist-credentials: false
      - name: Wait for the pre-flight verdict of this head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # pull_request_target runs preflight.yml from the default branch, whatever the PR's base.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: automation/ci/wait-preflight.sh "$REPO" "$HEAD_SHA" "$DEFAULT_BRANCH"

  bookkeeping:
    name: Bookkeeping
    needs: [verdict]
    # Every other event skips the verdict job; a failed verdict skips this one and fails CI result.
    if: ${{ !cancelled() && needs.verdict.result != 'failure' }}
    # The fail-fast gate: every job that spends real minutes waits for it, so a stale generated file, a stale ledger, a missing
    # sign-off or a broken policy gate stops the run in minutes. It runs only what needs Go, Python and the Pi source mirror
    # (make ci-bookkeeping): no oracle build, no npm install, no test binaries. Gates that need those stay in their shards.
    # A failure whose only cause is a committed file that make generate rewrites feeds the autofix workflow (item below).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The bug ledger and the DCO check read the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          # The job restores its own Go build cache below; setup-go's copy would download a second, older one.
          cache: false
      - name: Restore the Go module cache
        id: cache-the-go-module-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      # Dependabot commits carry no Signed-off-by trailer; the maintainer's signed-off squash merge records the DCO for them.
      - name: Test the sign-off check
        run: python3 -B -m unittest automation/ci/test_check_dco.py
      - name: Check commit sign-offs
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./automation/ci/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Check test expectations edited with their code
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: go run ./test/parity/cmd/testprune lint -base "$BASE_SHA" -head "$HEAD_SHA"
      # port-map-drift, coverage-drift and divergence-guard read Pi's source mirror, and a commit pin's mirror takes its generated
      # provider data from the oracle build, so this prepares the oracle as the Linux shards do (the build is cached by pin).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Restore the npm cache
        id: cache-npm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('extensions/sdk-ts/package-lock.json', 'test/parity/interface-extractor/package-lock.json', 'automation/images/ci-parity/package-lock.json', 'automation/images/npm-runtime/package-lock.json') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ runner.arch }}-npm-
      - name: Install pinned npm
        shell: bash
        run: |
          set -euo pipefail
          automation/ci/install-npm-toolchain.sh
          bin="$PWD/automation/ci/npm-toolchain/node_modules/.bin"
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Restore the Pi oracle build
        id: cache-pi-oracle-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-dev/pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}
      - name: Prepare pinned Pi oracle
        run: make upstream-mirror
      - name: Run the bookkeeping gates
        id: gates
        # The step's failure is reported by the last step, after the autofix step has looked at the log.
        continue-on-error: true
        env:
          CI: '1'
        shell: bash
        run: |
          set -o pipefail
          make -k -j4 -O ci-bookkeeping 2>&1 | tee "$RUNNER_TEMP/bookkeeping.log"
      # When every failed gate is one whose remedy is regenerating committed files (automation/ci/autofix-gates.txt), regenerate
      # them here, check the failed gates pass on the result, and keep the changed files as an artifact. This job holds a read-only
      # token and runs the pull request's own code; the autofix workflow, which holds the write token, runs none of it. It reads
      # the artifact, checks every path against the default branch's allowlist, and creates the commit.
      - name: Regenerate stale derived files
        id: autofix
        if: steps.gates.outcome == 'failure' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch))
        env:
          LOG: ${{ runner.temp }}/bookkeeping.log
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ARTIFACT: ${{ runner.temp }}/autofix
        run: python3 automation/ci/autofix.py prepare --log "$LOG" --out "$ARTIFACT" --head-sha "$HEAD_SHA"
      - name: Keep the regenerated files for the autofix workflow
        if: steps.autofix.outputs.eligible == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autofix
          path: ${{ runner.temp }}/autofix/
          if-no-files-found: error
          retention-days: 3
      - name: Fail the job when a gate failed
        if: steps.gates.outcome == 'failure'
        run: |
          echo "::error::bookkeeping gates failed; see the Run the bookkeeping gates step"
          exit 1
      - name: Save the Go module cache
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-the-go-module-cache.outcome == 'success' && steps.cache-the-go-module-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
      - name: Save the npm cache
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-npm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('extensions/sdk-ts/package-lock.json', 'test/parity/interface-extractor/package-lock.json', 'automation/images/ci-parity/package-lock.json', 'automation/images/npm-runtime/package-lock.json') }}
      - name: Save the Pi oracle build
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-pi-oracle-build.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-dev/pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}

  preflight:
    name: Linux / preflight
    # The compile gate: every package builds, vets for each shipped platform, and needs no go fix. Windows, macOS and the Node
    # loader wait for it, so a change that cannot pass them does not spend their minutes; the Linux shards start at once.
    needs: [changes, bookkeeping]
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          # The job restores its own Go build cache below; setup-go's copy would download a second, older one.
          cache: false
      - name: Restore the Go module cache
        id: cache-the-go-module-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Build, vet and go fix every package
        env:
          CI: '1'
          MAKEFLAGS: -k
        run: make ci-preflight
      - name: Save the Go module cache
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-the-go-module-cache.outcome == 'success' && steps.cache-the-go-module-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}

  linux:
    name: Linux / ${{ matrix.shard }}
    needs: [changes, bookkeeping]
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The shards come from automation/ci/ci-tiers.txt through the changes job, longest first, so the jobs that bound
        # the run's end start first when the account's job slots are full. Each shard's check name is the same in the
        # light and the full run; target is the make target it runs (the light run's build and checks lint and gate the
        # changed files without the repository-wide lint and module-size).
        include: ${{ fromJSON(needs.changes.outputs.linux) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          # The job restores its own Go build cache below; setup-go's copy would download a second, older one.
          cache: false
      # Modules are immutable for a go.sum, so one entry serves every job until a dependency changes.
      - name: Restore the Go module cache
        id: cache-the-go-module-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      # This restores the newest cache a previous run saved, so a job recompiles only what changed.
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      # Go bumps an entry's mtime when a build reads it, at most once an hour (cmd/go/internal/cache mtimeInterval). Backdating
      # the restored entries by two hours lets the save step keep only what this job used, so the saved cache does not grow
      # with every commit.
      - name: Age the restored Go build cache
        id: age
        if: matrix.shard == 'test-fast'
        shell: bash
        run: automation/ci/gocache-trim.sh age
      # portmap-check runs each proven PORT_MAP row's evidence tests under coverage and keeps the green results in
      # build/portmap-coverage, keyed by the digest of the cited files and tests, so a later run reruns only changed rows. A shard
      # prefers its own previous cache and otherwise takes the newest of any shard: a record is valid for whichever shard holds its row.
      - name: Restore the PORT_MAP coverage cache
        if: startsWith(matrix.shard, 'portmap-')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/portmap-coverage
          key: portmap-coverage-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            portmap-coverage-${{ matrix.shard }}-
            portmap-coverage-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Restore the npm cache
        id: cache-npm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('extensions/sdk-ts/package-lock.json', 'test/parity/interface-extractor/package-lock.json', 'automation/images/ci-parity/package-lock.json', 'automation/images/npm-runtime/package-lock.json') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ runner.arch }}-npm-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.12'
      # make test-sdk-py keeps its hash-locked venv under $PIG_CACHE_HOME/pig-sdk-py (~/.cache here) and names it by
      # the lock and interpreter, so this key changes exactly when the script would build a new venv.
      - name: Restore the Python SDK venv
        if: matrix.shard == 'toolchains'
        id: cache-python-sdk-venv
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-sdk-py
          key: sdk-py-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('extensions/sdk-py/requirements-dev.txt') }}
      # make test-term-engines builds libvterm, the Rust engine runners and the pyte venv under $PIG_CACHE_HOME/pig-term-engines (~/.cache here), each
      # in a directory named for the lock or pin that produced it, so this key changes exactly when something there would be rebuilt.
      - name: Restore the terminal-engine builds
        if: matrix.shard == 'toolchains'
        id: cache-terminal-engine-builds
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-term-engines
          key: term-engines-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ env.RUST_VERSION }}-${{ hashFiles('test/term-engines/alacritty/Cargo.lock', 'test/term-engines/alacritty/Cargo.toml', 'test/term-engines/alacritty/src/**', 'test/term-engines/wezterm/Cargo.lock', 'test/term-engines/wezterm/Cargo.toml', 'test/term-engines/wezterm/src/**', 'test/term-engines/libvterm/run.c', 'test/term-engines/pyte/requirements.txt', 'automation/dev/toolchains.lock', 'automation/ci/test-term-engines.sh') }}
      # An unresponsive package mirror fails this step within its timeout instead of holding the job.
      - name: Install native test packages
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # The native clipboard fixtures compile C11 code and exercise a real X11 selection server.
          automation/ci/install-native-test-packages.sh
      - name: Install parity toolchains
        shell: bash
        run: |
          set -euo pipefail
          # rustfmt and clippy: make lint-rust (ci-sdk) checks every Rust crate with them.
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      # The pinned SBCL (automation/dev/toolchains.lock) builds and runs Lisp extension images; the conformance rows, make test-sdk-lisp and the portmap shards (portmap-check requires it through test-prereqs)
      # fail without it. install-sbcl.sh installs the checksummed official binary, and the cache keeps the prefix for the pin.
      - name: Restore the pinned SBCL
        if: startsWith(matrix.shard, 'test-') || startsWith(matrix.shard, 'portmap-') || matrix.shard == 'toolchains'
        id: cache-pinned-sbcl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-sbcl
          key: sbcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('automation/dev/toolchains.lock', 'automation/ci/install-sbcl.sh') }}
      - name: Install the pinned SBCL
        if: startsWith(matrix.shard, 'test-') || startsWith(matrix.shard, 'portmap-') || matrix.shard == 'toolchains'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(automation/ci/install-sbcl.sh)"
          echo "PIG_SBCL=$prefix/bin/sbcl" >> "$GITHUB_ENV"
          echo "SBCL_HOME=$prefix/lib/sbcl" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Install pinned npm
        shell: bash
        run: |
          set -euo pipefail
          # npm ci installs the lockfile-pinned npm; later steps use it via PATH.
          automation/ci/install-npm-toolchain.sh
          bin="$PWD/automation/ci/npm-toolchain/node_modules/.bin"
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$NPM_VERSION"
      # The oracle build is the same for every job of a pin; oracle.py reuses a restored build whose stamp matches.
      - name: Restore the Pi oracle build
        id: cache-pi-oracle-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-dev/pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}
      - name: Prepare pinned Pi oracle
        run: make upstream-mirror
      - name: Verify toolchain identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go$(tr -d '\r\n' < .go-version)"
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(npm --version)" = "$NPM_VERSION"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_VERSION"
          if [ -n "${PIG_SBCL:-}" ]; then test "$("$PIG_SBCL" --version)" = "SBCL $(awk -F'\t' '!/^#/ && $1=="sbcl-source" {print $2}' automation/dev/toolchains.lock)"; fi
          python3 automation/pin/pin.py check-oracle
      # Rust SDK dependencies and Pi's env daemon build into persistent targets (internal/testenv.SharedCargoTargetDir) named for a hash of their lockfiles, so a lock change selects a new directory and a hit skips the compile. The key also hashes automation/ci/test-warm.sh, the list of targets: actions/cache saves only on a key miss, so a target the script gains needs a new key to reach the cache.
      - name: Restore the Cargo registry and test targets
        id: cache-the-cargo-registry-and-test-targets
        if: startsWith(matrix.shard, 'test-') || matrix.shard == 'toolchains'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pig-dev/cargo-target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('extensions/sdk-rs/Cargo.lock', 'extensions/sdk-rs/Cargo.toml', 'automation/ci/test-warm.sh') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-
      # The PORT_MAP evidence tests of the extension, CLI and env packages build the Rust SDK cells and Pi's env daemon into the same
      # targets. A portmap shard only restores them: the test shards own saving the complete set, and a partial save here would pin
      # an incomplete cache to the key.
      - name: Restore the Cargo targets of the PORT_MAP evidence tests
        if: startsWith(matrix.shard, 'portmap-')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pig-dev/cargo-target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('extensions/sdk-rs/Cargo.lock', 'extensions/sdk-rs/Cargo.toml', 'automation/ci/test-warm.sh') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - name: Warm the fixture caches
        if: startsWith(matrix.shard, 'test-')
        env:
          CI: '1'
        run: make test-warm
      # golangci-lint keys its analysis cache on file content, so a restored cache serves only unchanged packages. The key rolls weekly.
      - name: Name the lint cache week
        id: lintweek
        if: matrix.shard == 'build'
        shell: bash
        run: echo "week=$(( $(date -u +%s) / 604800 ))" >> "$GITHUB_OUTPUT"
      - name: Restore the golangci-lint cache
        id: lintcache
        if: matrix.shard == 'build'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('.go-version', '.golangci.yml', 'go.mod') }}-${{ steps.lintweek.outputs.week }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ hashFiles('.go-version', '.golangci.yml', 'go.mod') }}-
      - name: Run PiG verification shard
        env:
          CI: '1'
          SHARD: ${{ matrix.shard }}
          TARGET: ${{ matrix.target }}
          # ci-build-pr lints the changed files against the base branch (a pull request run has the base as a remote ref only).
          LINT_BASE: origin/main
          # ci-test-changed (the light run's test-fast) selects the packages the pull request changed against its base branch.
          TEST_BASE: origin/${{ github.base_ref || 'main' }}
          # A shard that groups several gates runs every one of them and fails if any failed.
          MAKEFLAGS: -k
          # The fast group's package pool (automation/ci/test-grouped.sh, default 12) is 1.5 packages per CPU of a 4-CPU runner.
          # go test's 10-minute limit bounds a package's wall time, not its CPU time, and at 12 the slowest packages (imageprocessing,
          # codingagent/tools, photonimage, pigletbuild) reach 555-600 s; at 6 the pool takes the same total time and they finish in 333-387 s.
          TEST_FAST_PARALLEL: 6
        run: make "$TARGET"
      - name: Save the golangci-lint cache
        if: ${{ !cancelled() && matrix.shard == 'build' && steps.lintcache.outputs.cache-hit != 'true' && env.CACHE_SAVE == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('.go-version', '.golangci.yml', 'go.mod') }}-${{ steps.lintweek.outputs.week }}
      - name: Save the PORT_MAP coverage cache
        if: ${{ always() && startsWith(matrix.shard, 'portmap-') && env.CACHE_SAVE == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/portmap-coverage
          key: portmap-coverage-${{ matrix.shard }}-${{ github.sha }}
      # Go's build cache is content-addressed, so a failed run's compile output is as valid as a passing run's.
      - name: Keep only the Go build cache entries this job used
        if: ${{ !cancelled() && steps.age.outcome == 'success' && env.CACHE_SAVE == 'true' }}
        shell: bash
        run: automation/ci/gocache-trim.sh trim
      - name: Save the Go build cache
        if: ${{ !cancelled() && steps.age.outcome == 'success' && env.CACHE_SAVE == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
      - name: Save the Go module cache
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-the-go-module-cache.outcome == 'success' && steps.cache-the-go-module-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
      - name: Save the npm cache
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-npm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('extensions/sdk-ts/package-lock.json', 'test/parity/interface-extractor/package-lock.json', 'automation/images/ci-parity/package-lock.json', 'automation/images/npm-runtime/package-lock.json') }}
      - name: Save the Cargo registry and test targets
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-the-cargo-registry-and-test-targets.outcome == 'success' && steps.cache-the-cargo-registry-and-test-targets.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pig-dev/cargo-target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('extensions/sdk-rs/Cargo.lock', 'extensions/sdk-rs/Cargo.toml', 'automation/ci/test-warm.sh') }}
      - name: Save the Python SDK venv
        if: ${{ (matrix.shard == 'toolchains') && env.CACHE_SAVE == 'true' && steps.cache-python-sdk-venv.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-sdk-py
          key: sdk-py-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('extensions/sdk-py/requirements-dev.txt') }}
      - name: Save the terminal-engine builds
        if: ${{ (matrix.shard == 'toolchains') && env.CACHE_SAVE == 'true' && steps.cache-terminal-engine-builds.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-term-engines
          key: term-engines-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ env.RUST_VERSION }}-${{ hashFiles('test/term-engines/alacritty/Cargo.lock', 'test/term-engines/alacritty/Cargo.toml', 'test/term-engines/alacritty/src/**', 'test/term-engines/wezterm/Cargo.lock', 'test/term-engines/wezterm/Cargo.toml', 'test/term-engines/wezterm/src/**', 'test/term-engines/libvterm/run.c', 'test/term-engines/pyte/requirements.txt', 'automation/dev/toolchains.lock', 'automation/ci/test-term-engines.sh') }}
      - name: Save the pinned SBCL
        if: ${{ (startsWith(matrix.shard, 'test-') || startsWith(matrix.shard, 'portmap-') || matrix.shard == 'toolchains') && env.CACHE_SAVE == 'true' && steps.cache-pinned-sbcl.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-sbcl
          key: sbcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('automation/dev/toolchains.lock', 'automation/ci/install-sbcl.sh') }}
      - name: Save the Pi oracle build
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-pi-oracle-build.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-dev/pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}
  node-runtime:
    name: Node extensions
    needs: [changes, bookkeeping]
    if: needs.changes.outputs.product == 'true' && needs.changes.outputs.run-node-runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore the Go module cache
        id: cache-gomod
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      # A pull request restores the newest build cache of main (cache-warm.yml and the weekly run save it) and saves none.
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      # Install the oracle with the qualified npm runtime before selecting the
      # test runtime: pinned npm itself requires a newer Node than Pi's floor.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Restore the npm cache
        id: cache-npm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('extensions/sdk-ts/package-lock.json') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ runner.arch }}-npm-
      # An unresponsive package mirror fails this step within its timeout instead of holding the job.
      - name: Install native test packages
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # ci-node-runtime runs the native clipboard upstream tests on each Node version.
          automation/ci/install-native-test-packages.sh
      - name: Prepare the Pi oracle
        id: oracle
        run: |
          set -euo pipefail
          automation/ci/install-npm-toolchain.sh
          export PATH="$PWD/automation/ci/npm-toolchain/node_modules/.bin:$PATH"
          make upstream-mirror
      # One job runs the suite under each Node version in turn: Pi's engine floor, the qualified build runtime, and current
      # Node. Each version's run starts even when an earlier one failed, so every version reports.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' }}
        with:
          node-version-file: automation/ci/node-minimum.version
      - name: Test Node extension runtime and TypeScript parity on Pi's engine floor
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' }}
        env:
          CI: '1'
        run: |
          set -euo pipefail
          node --version
          automation/ci/with-isolated-pig-home.sh make ci-node-runtime
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' }}
        with:
          node-version-file: .node-version
      - name: Test Node extension runtime and TypeScript parity on the qualified Node
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' }}
        env:
          CI: '1'
        run: |
          set -euo pipefail
          node --version
          automation/ci/with-isolated-pig-home.sh make ci-node-runtime
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' }}
        with:
          node-version-file: automation/ci/node-current.version
      - name: Test Node extension runtime and TypeScript parity on current Node
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' }}
        env:
          CI: '1'
        run: |
          set -euo pipefail
          node --version
          automation/ci/with-isolated-pig-home.sh make ci-node-runtime
      - name: Save the Go module cache
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-gomod.outcome == 'success' && steps.cache-gomod.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
      - name: Save the npm cache
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-npm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('extensions/sdk-ts/package-lock.json') }}

