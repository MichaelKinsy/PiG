# SPDX-License-Identifier: MIT
name: Nightly race, fuzz and allocation ratchet

# Whole-package -race on the packages that own concurrency, on Linux and on macOS (darwin/arm64), and every Fuzz
# target for 30 seconds, and the full products of the oracle sweeps whose covering subsets the fast tier runs (make test-oracle-sweeps-nightly).
# Pull requests run only the narrow race regressions of make test-race; these runs are too long
# for every change. The allocation job runs every benchmark of the hot packages once and compares allocs/op with
# automation/ci/allocbase/baseline.toml (make alloc-baseline).
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  race:
    name: Race / ${{ matrix.os }} / ${{ matrix.group }}${{ matrix.shard && format(' / {0}', matrix.shard) || '' }}
    runs-on: ${{ matrix.os }}
    # automation/ci/race-packages.txt names the packages of each group. The cli group is one package whose whole -race run took 38 minutes on a 56-core slice, so it runs as four shards of its tests (PIG_RACE_SHARD).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        group: [ai, rest, host, coding, libs, hljs]
        include:
          - {os: ubuntu-24.04, group: cli, shard: 1/4}
          - {os: ubuntu-24.04, group: cli, shard: 2/4}
          - {os: ubuntu-24.04, group: cli, shard: 3/4}
          - {os: ubuntu-24.04, group: cli, shard: 4/4}
          - {os: macos-15, group: cli, shard: 1/4}
          - {os: macos-15, group: cli, shard: 2/4}
          - {os: macos-15, group: cli, shard: 3/4}
          - {os: macos-15, group: cli, shard: 4/4}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: extensions/sdk-ts/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install a current bash for the shard selection script
        # automation/ci/test-shard-pattern.sh needs bash 4 and macOS ships 3.2 as /bin/bash, so the cli shards (PIG_RACE_SHARD) died there with "declare: -A: invalid option". The same step as ci.yml's macOS job: only the bash keg goes on PATH, as the Homebrew bin directory also holds the image's default node and npm, which would shadow the pinned toolchain.
        if: runner.os == 'macOS' && matrix.shard
        run: |
          set -euo pipefail
          brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
      - name: Install native test tools, Rust and the pinned Pi oracle
        # The Rust and npm pins are read from ci.yml, their one source (make compliance).
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            automation/ci/install-native-test-packages.sh
          else
            brew install fd ripgrep
          fi
          rust="$(awk '/^  RUST_VERSION:/ { print $2; exit }' .github/workflows/ci.yml)"
          npm_version="$(awk '/^  NPM_VERSION:/ { print $2; exit }' .github/workflows/ci.yml)"
          rustup toolchain install "$rust" --profile minimal
          rustup default "$rust"
          automation/ci/install-npm-toolchain.sh
          bin="$PWD/automation/ci/npm-toolchain/node_modules/.bin"
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$npm_version"
          # The step ci.yml's Linux job runs ("Prepare pinned Pi oracle"): make upstream-mirror is parity-deps (the oracle from the pin, the locked npm trees of the oracle
          # tests in internal/typebox/testdata/npm and ai/testdata/sdk, durable/interop's, the TypeScript compiler of the interface extractor, then check-oracle) and the
          # mirror of the pin's source. The nightly once listed these by hand, left out the npm trees, and every Pi-oracle test that imports a package from them failed with
          # ERR_MODULE_NOT_FOUND (test/ci-images/nightly_oracle_install_test.go).
          make upstream-mirror
      # The Lisp SDK realization of cmd/pig's TestReplacedSession2860AcrossSDKs (cli shard 4/4) and the Lisp conformance rows fail without the pinned SBCL, as in ci.yml's Linux and macOS jobs: the same cache and install step.
      - name: Restore the pinned SBCL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-sbcl
          key: sbcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('automation/dev/toolchains.lock', 'automation/ci/install-sbcl.sh') }}
      - name: Install the pinned SBCL
        # SBCL publishes no binary of the pinned release for arm64 macOS: the script builds the checksummed release source with the arm64 macOS binary row of automation/dev/toolchains.lock.
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(automation/ci/install-sbcl.sh)"
          echo "PIG_SBCL=$prefix/bin/sbcl" >> "$GITHUB_ENV"
          echo "SBCL_HOME=$prefix/lib/sbcl" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Race and goroutine-leak gate
        env:
          CI: '1'
          PIG_RACE_GROUP: ${{ matrix.group }}
          PIG_RACE_SHARD: ${{ matrix.shard }}
        run: make test-race-nightly

  fuzz:
    name: Fuzz / every target 30s
    runs-on: ubuntu-24.04
    # The targets run one after the other, 30 s of fuzzing and about 11 s of build and corpus work each (41 s measured): 47 targets were 32 minutes, so a 30 minute limit cancelled
    # the run at the 41st on 11-05, 11-06 and 11-08; the Pi-pinned tree has 111 targets, 83 minutes with the setup, so the limit is 90. test/ci-images/nightly_fuzz_budget_test.go keeps the limit above the targets' sum as targets are added.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Fuzz every target
        env:
          CI: '1'
          PIG_FUZZ_TIME: 30s
        run: make fuzz-nightly
      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ github.sha }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  oracle-sweeps:
    name: Oracle sweeps / full products
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      # internal/pioracle runs Pi's vendored modules in Node, so the job needs the pinned Node and nothing else.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Run the full oracle sweeps
        env:
          CI: '1'
        run: make test-oracle-sweeps-nightly

  pig-bolt-compiler:
    name: Pi-Bolt compiler / build and start a compiled host
    # make test-pig-bolt-build downloads the Pi-Bolt release the pig-bolt Piglet pins (signature and digests checked by the Piglet's own installer),
    # builds a compiled TypeScript host from PiG's runtime tree with it and starts the host. It guards against a pin whose compiler crashes on that
    # tree (an earlier pin segfaulted in the ahead-of-time step). The toolchain is cached by pin.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-bolt-test
          key: pig-bolt-toolchain-${{ hashFiles('piglets/pig-bolt/extensions/boltruntime/lock.go') }}
      - name: Build and start a compiled host with the pinned compiler
        env:
          CI: '1'
        run: make test-pig-bolt-build

  allocations:
    name: Allocation ratchet / allocs per op
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      # The Node-cell, Node-host and clipboard benchmarks start node; Pi requires at least the Node floor in minimumNodeRuntimeVersion (coding/extension/host/subprocess/builder_node.go) and the runner image's Node is not pinned, so the job uses .node-version like the other Node jobs.
      # The subprocess host benchmarks start Node extension runtimes; their baseline entries were measured on the pinned Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # BenchmarkDecodeFileEntryPiFixture reads Pi's large-session.jsonl from .upstream/current. The mirror takes the pinned oracle's provider data (mirror-upstream.sh), so the steps are the race job's: the npm toolchain, the oracle, the mirror. The toolchain's bin directory stays off the later steps' PATH, which the measured benchmarks run under.
      - name: Install the pinned Pi oracle and mirror its source
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(awk '/^  NPM_VERSION:/ { print $2; exit }' .github/workflows/ci.yml)"
          automation/ci/install-npm-toolchain.sh
          export PATH="$PWD/automation/ci/npm-toolchain/node_modules/.bin:$PATH"
          test "$(npm --version)" = "$npm_version"
          make upstream-mirror
      - name: Compare allocs/op with the committed baseline
        env:
          CI: '1'
        run: make alloc-baseline
