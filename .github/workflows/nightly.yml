# SPDX-License-Identifier: MIT
name: Nightly race, fuzz, allocation ratchet and Piglet strip matrix

# Whole-package -race on the packages that own concurrency, on Linux and on macOS (darwin/arm64), and every Fuzz
# target for 30 seconds, and the full products of the oracle sweeps whose covering subsets the fast tier runs (make test-oracle-sweeps-nightly).
# Pull requests run only the narrow race regressions of make test-race; these runs are too long
# for every change. The allocation job runs every benchmark of the hot packages once and compares allocs/op with
# automation/ci/allocbase/baseline.toml (make alloc-baseline).
# The strip matrix job runs make piglet-strip-matrix in its default mode (automation/ci/stripmatrix): 2610 s at 8 CPUs, so pull requests
# run only its go vet of ./ai/... (make piglet-strip-guard, in ci-contracts).
# The strip tests jobs run make piglet-strip-tests, the tests of ./coding/... and ./internal/codingagent/... under each strip tag
# alone and under all tags, one job per set (the set list comes from the registry: stripmatrix -print-sets), so a test that needs a stripped
# built-in without a build constraint on its file fails the night it is added.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same cache-save policy as ci.yml: nightly on main and release dispatches save caches; canary/branch dispatches restore main's caches without saving or evicting them.
  CACHE_SAVE: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/')) }}
  # Wall-clock and speed-ratio gates only warn on shared runners (internal/testenv.TimingGate); count, size and allocation gates still block. make test-timing runs them blocking on quiet hardware before a release.
  PIG_PERF_TIMING_REPORT_ONLY: '1'

jobs:
  # On a scheduled run, check whether main's HEAD already has a green deterministic nightly run
  # (oracle-sweeps, pig-bolt-compiler, allocations, strip-matrix, strip-tests). If so, skip those
  # deterministic jobs while still running the stochastic/repetition jobs (race, fuzz,
  # windows-concurrency-stress). workflow_dispatch NEVER skips deterministic jobs.
  head-state:
    name: Check unchanged main state
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run-deterministic: ${{ steps.check.outputs.run-deterministic }}
      skip-reason: ${{ steps.check.outputs.skip-reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: automation/ci/check-unchanged-main.py
          fetch-depth: 1
          persist-credentials: false
      - name: Decide whether deterministic nightly jobs must run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/ci/check-unchanged-main.py nightly             --event "$EVENT"             --repo "$REPO"             --head-sha "$HEAD_SHA"             --current-run-id "$RUN_ID"

  race:
    name: Race / ${{ matrix.os }} / ${{ matrix.group }}${{ matrix.shard && format(' / {0}', matrix.shard) || '' }}
    runs-on: ${{ matrix.os }}
    # automation/ci/race-packages.txt names the packages of each group. The cli group is one package whose whole -race run took 38 minutes on a 56-core slice, so it runs as seven shards of its tests (PIG_RACE_SHARD): every shard's -run pattern must stay under automation/ci/test-shard-pattern.sh's 24,000-character limit with room for growth (at seven shards the longest pattern is 14,421 characters; recompute by measuring automation/ci/test-shard-pattern.sh k n ./coding/cli for each shard k of n). The tui and codingagent groups are single packages whose whole -race runs exceeded or approached Go's 60-minute per-package timeout on macOS (tui timed out at 1h0m0s; internal/codingagent took 3,274 s) and exceeded half an hour on Linux (tui 1,880 s, internal/codingagent 1,818 s), so both run sharded via PIG_RACE_SHARD on both Linux and macOS: tui in 8 shards (max pattern 17,081 chars, matching automation/ci/test-shard-weights.txt; recompute with automation/ci/test-shard-pattern.sh k 8 ./tui) and codingagent in 12 shards (max pattern 17,098 chars; recompute with automation/ci/test-shard-pattern.sh k 12 ./internal/codingagent). On macOS (5 concurrent runner cap), the 27 single-package shards (7 cli + 8 tui + 12 codingagent) are packed into 11 balanced multi-shard jobs (4 cli, 3 tui, 4 codingagent; 19 total macOS race jobs instead of 35, cutting 7 waves to 4 while keeping every shard in its own go test process and timeout). The parity and conformance groups run on Linux only (conformance is test/extension-conformance in four shards, PIG_RACE_SHARD): the parity group holds the long parity-tool test packages (closure 483 s and sdksurface 1406 s under -race on 8 CPUs). The shared group holds the packages that use sync, atomic, channels or context cancellation without starting a goroutine themselves (race-packages.txt) and runs on both Linux and macOS.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        group: [ai, rest, host, coding, libs, hljs, photonimage]
        include:
          - {os: ubuntu-24.04, group: parity}
          - {os: ubuntu-24.04, group: shared}
          - {os: macos-15, group: shared}
          - {os: ubuntu-24.04, group: conformance, shard: 1/4}
          - {os: ubuntu-24.04, group: conformance, shard: 2/4}
          - {os: ubuntu-24.04, group: conformance, shard: 3/4}
          - {os: ubuntu-24.04, group: conformance, shard: 4/4}
          - {os: ubuntu-24.04, group: cli, shard: 1/7}
          - {os: ubuntu-24.04, group: cli, shard: 2/7}
          - {os: ubuntu-24.04, group: cli, shard: 3/7}
          - {os: ubuntu-24.04, group: cli, shard: 4/7}
          - {os: ubuntu-24.04, group: cli, shard: 5/7}
          - {os: ubuntu-24.04, group: cli, shard: 6/7}
          - {os: ubuntu-24.04, group: cli, shard: 7/7}
          - {os: macos-15, group: cli, shard: "1/7 2/7"}
          - {os: macos-15, group: cli, shard: "3/7 4/7"}
          - {os: macos-15, group: cli, shard: "5/7 6/7"}
          - {os: macos-15, group: cli, shard: "7/7"}
          - {os: ubuntu-24.04, group: tui, shard: 1/8}
          - {os: ubuntu-24.04, group: tui, shard: 2/8}
          - {os: ubuntu-24.04, group: tui, shard: 3/8}
          - {os: ubuntu-24.04, group: tui, shard: 4/8}
          - {os: ubuntu-24.04, group: tui, shard: 5/8}
          - {os: ubuntu-24.04, group: tui, shard: 6/8}
          - {os: ubuntu-24.04, group: tui, shard: 7/8}
          - {os: ubuntu-24.04, group: tui, shard: 8/8}
          - {os: macos-15, group: tui, shard: "1/8 2/8 3/8"}
          - {os: macos-15, group: tui, shard: "4/8 5/8 6/8"}
          - {os: macos-15, group: tui, shard: "7/8 8/8"}
          - {os: ubuntu-24.04, group: codingagent, shard: 1/12}
          - {os: ubuntu-24.04, group: codingagent, shard: 2/12}
          - {os: ubuntu-24.04, group: codingagent, shard: 3/12}
          - {os: ubuntu-24.04, group: codingagent, shard: 4/12}
          - {os: ubuntu-24.04, group: codingagent, shard: 5/12}
          - {os: ubuntu-24.04, group: codingagent, shard: 6/12}
          - {os: ubuntu-24.04, group: codingagent, shard: 7/12}
          - {os: ubuntu-24.04, group: codingagent, shard: 8/12}
          - {os: ubuntu-24.04, group: codingagent, shard: 9/12}
          - {os: ubuntu-24.04, group: codingagent, shard: 10/12}
          - {os: ubuntu-24.04, group: codingagent, shard: 11/12}
          - {os: ubuntu-24.04, group: codingagent, shard: 12/12}
          - {os: macos-15, group: codingagent, shard: "1/12 2/12 3/12"}
          - {os: macos-15, group: codingagent, shard: "4/12 5/12 6/12"}
          - {os: macos-15, group: codingagent, shard: "7/12 8/12 9/12"}
          - {os: macos-15, group: codingagent, shard: "10/12 11/12 12/12"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore the Go module cache
        id: cache-gomod
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/go-build' || '~/.cache/go-build' }}
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Restore the npm cache
        id: cache-npm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('extensions/sdk-ts/package-lock.json', 'test/parity/interface-extractor/package-lock.json', 'automation/images/ci-parity/package-lock.json', 'automation/images/npm-runtime/package-lock.json') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ runner.arch }}-npm-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install a current bash for the shard selection script
        # automation/ci/test-shard-pattern.sh needs bash 4 and macOS ships 3.2 as /bin/bash, so the cli shards (PIG_RACE_SHARD) died there with "declare: -A: invalid option". The same step as ci.yml's macOS job: only the bash keg goes on PATH, as the Homebrew bin directory also holds the image's default node and npm, which would shadow the pinned toolchain.
        if: runner.os == 'macOS' && matrix.shard
        run: |
          set -euo pipefail
          brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
      - name: Restore the Pi oracle build
        id: cache-pi-oracle-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-dev/pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}
      - name: Install native test tools, Rust and the pinned Pi oracle
        # The Rust and npm pins are read from ci.yml, their one source (make compliance).
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            automation/ci/install-native-test-packages.sh
          else
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew install fd ripgrep tmux
          fi
          rust="$(awk '/^  RUST_VERSION:/ { print $2; exit }' .github/workflows/ci.yml)"
          npm_version="$(awk '/^  NPM_VERSION:/ { print $2; exit }' .github/workflows/ci.yml)"
          echo "RUST_VERSION=$rust" >> "$GITHUB_ENV"
          rustup toolchain install "$rust" --profile minimal
          rustup default "$rust"
          automation/ci/install-npm-toolchain.sh
          bin="$PWD/automation/ci/npm-toolchain/node_modules/.bin"
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$npm_version"
          # The step ci.yml's Linux job runs ("Prepare pinned Pi oracle"): make upstream-mirror is parity-deps (the oracle from the pin, the locked npm trees of the oracle
          # tests in internal/typebox/testdata/npm and ai/testdata/sdk, durable/interop's, the TypeScript compiler of the interface extractor, then check-oracle) and the
          # mirror of the pin's source. The nightly once listed these by hand, left out the npm trees, and every Pi-oracle test that imports a package from them failed with
          # ERR_MODULE_NOT_FOUND (test/ci-images/nightly_oracle_install_test.go).
          make upstream-mirror
      # The Lisp SDK realization of cmd/pig's TestReplacedSession2860AcrossSDKs (in the cli shards) and the Lisp conformance rows fail without the pinned SBCL, as in ci.yml's Linux and macOS jobs: the same cache and install step.
      - name: Restore the pinned SBCL
        id: cache-pinned-sbcl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-sbcl
          key: sbcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('automation/dev/toolchains.lock', 'automation/ci/install-sbcl.sh') }}
      - name: Install the pinned SBCL
        # SBCL publishes no binary of the pinned release for arm64 macOS: the script builds the checksummed release source with the arm64 macOS binary row of automation/dev/toolchains.lock.
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(automation/ci/install-sbcl.sh)"
          echo "PIG_SBCL=$prefix/bin/sbcl" >> "$GITHUB_ENV"
          echo "SBCL_HOME=$prefix/lib/sbcl" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      # Install the pinned zstd (internal/zstdblob.PinnedCLIVersion) into ~/.cache/pig-zstd and cache it by pin. Setting PIG_REQUIRE_ZSTD=1 makes the frame tests fail instead of skipping if the binary is missing.
      - name: Restore the pinned zstd
        id: cache-pinned-zstd
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-zstd
          key: zstd-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('automation/dev/toolchains.lock', 'automation/ci/install-zstd.sh') }}
      - name: Install the pinned zstd
        shell: bash
        run: |
          set -euo pipefail
          zstd="$(automation/ci/install-zstd.sh)"
          echo "PIG_ZSTD=$zstd" >> "$GITHUB_ENV"
          echo "PIG_REQUIRE_ZSTD=1" >> "$GITHUB_ENV"
      - name: Restore the Cargo registry and test targets
        id: cache-cargo
        if: matrix.group == 'cli' || matrix.group == 'rest' || matrix.group == 'host' || matrix.group == 'conformance' || matrix.group == 'libs'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.os == 'macOS' && '~/Library/Caches/pig-dev/cargo-target' || '~/.cache/pig-dev/cargo-target' }}
          key: cargo-${{ runner.os }}-${{ runner.os == 'macOS' && format('{0}-', runner.arch) || '' }}${{ env.RUST_VERSION }}-${{ hashFiles('extensions/sdk-rs/Cargo.lock', 'extensions/sdk-rs/Cargo.toml', 'automation/ci/test-warm.sh') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.os == 'macOS' && format('{0}-', runner.arch) || '' }}${{ env.RUST_VERSION }}-
      - name: Warm the Rust SDK Cargo targets
        # Builds pig-sdk and its dependencies (and Pi's env daemon for libs) into each group's SharedCargoTargetDir before go test starts, so no race test compiles the Rust SDK cold inside its 120 s wait budget.
        if: matrix.group == 'cli' || matrix.group == 'rest' || matrix.group == 'host' || matrix.group == 'conformance' || matrix.group == 'libs'
        shell: bash
        env:
          PIG_RACE_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          case "$PIG_RACE_GROUP" in
            cli) targets=(cli) ;;
            rest) targets=(subprocess) ;;
            host) targets=(runtimecell) ;;
            conformance) targets=(conformance) ;;
            libs) targets=(env-oracle) ;;
            *) echo "unexpected race group $PIG_RACE_GROUP" >&2; exit 1 ;;
          esac
          ./automation/ci/test-warm.sh --rust-only "${targets[@]}"
      - name: Race and goroutine-leak gate
        env:
          CI: '1'
          PIG_RACE_GROUP: ${{ matrix.group }}
          PIG_RACE_SHARD: ${{ matrix.shard }}
        run: make test-race-nightly
      - name: Save the pinned SBCL
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-pinned-sbcl.outcome == 'success' && steps.cache-pinned-sbcl.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-sbcl
          key: sbcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('automation/dev/toolchains.lock', 'automation/ci/install-sbcl.sh') }}
      - name: Save the pinned zstd
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-pinned-zstd.outcome == 'success' && steps.cache-pinned-zstd.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-zstd
          key: zstd-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('automation/dev/toolchains.lock', 'automation/ci/install-zstd.sh') }}

  fuzz:
    name: Fuzz / shard ${{ matrix.shard }} (30s)
    runs-on: ubuntu-24.04
    # Split across 3 parallel shards via PIG_FUZZ_SHARD so every target runs 30 s (~38 targets per shard, ~33 min with setup vs 90 min monolithic). test/ci-images/nightly_fuzz_budget_test.go keeps each shard's timeout above its targets' sum as targets are added.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore the Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - name: Fuzz every target
        env:
          CI: '1'
          PIG_FUZZ_TIME: 30s
          PIG_FUZZ_SHARD: ${{ matrix.shard }}
        run: make fuzz-nightly
      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ strategy.job-index }}-${{ github.sha }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  oracle-sweeps:
    name: Oracle sweeps / full products
    needs: [head-state]
    if: ${{ needs.head-state.outputs.run-deterministic == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore the Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      # internal/pioracle runs Pi's vendored modules in Node, so the job needs the pinned Node and nothing else.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Run the full oracle sweeps
        env:
          CI: '1'
        run: make test-oracle-sweeps-nightly

  pig-bolt-compiler:
    name: Pi-Bolt compiler / build and start a compiled host
    needs: [head-state]
    if: ${{ needs.head-state.outputs.run-deterministic == 'true' }}
    # make test-pig-bolt-build downloads the Pi-Bolt release the pig-bolt Piglet pins (signature and digests checked by the Piglet's own installer),
    # builds a compiled TypeScript host from PiG's runtime tree with it and starts the host. It guards against a pin whose compiler crashes on that
    # tree (an earlier pin segfaulted in the ahead-of-time step). The toolchain is cached by pin.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore the Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - name: Restore the Pi-Bolt toolchain
        id: cache-pig-bolt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-bolt-test
          key: pig-bolt-toolchain-${{ hashFiles('piglets/pig-bolt/extensions/boltruntime/lock.go') }}
      - name: Build and start a compiled host with the pinned compiler
        env:
          CI: '1'
        run: make test-pig-bolt-build
      - name: Save the Pi-Bolt toolchain
        if: ${{ env.CACHE_SAVE == 'true' && steps.cache-pig-bolt.outcome == 'success' && steps.cache-pig-bolt.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-bolt-test
          key: pig-bolt-toolchain-${{ hashFiles('piglets/pig-bolt/extensions/boltruntime/lock.go') }}

  allocations:
    name: Allocation ratchet / allocs per op
    needs: [head-state]
    if: ${{ needs.head-state.outputs.run-deterministic == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore the Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      # The Node-cell, Node-host and clipboard benchmarks start node; Pi requires at least the Node floor in minimumNodeRuntimeVersion (coding/extension/host/subprocess/builder_node.go) and the runner image's Node is not pinned, so the job uses .node-version like the other Node jobs.
      # The subprocess host benchmarks start Node extension runtimes; their baseline entries were measured on the pinned Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Restore the npm cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('extensions/sdk-ts/package-lock.json', 'test/parity/interface-extractor/package-lock.json', 'automation/images/ci-parity/package-lock.json', 'automation/images/npm-runtime/package-lock.json') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ runner.arch }}-npm-
      - name: Restore the Pi oracle build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-dev/pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}
      # BenchmarkDecodeFileEntryPiFixture reads Pi's large-session.jsonl from .upstream/current. The mirror takes the pinned oracle's provider data (mirror-upstream.sh), so the steps are the race job's: the npm toolchain, the oracle, the mirror. The toolchain's bin directory stays off the later steps' PATH, which the measured benchmarks run under.
      - name: Install the pinned Pi oracle and mirror its source
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(awk '/^  NPM_VERSION:/ { print $2; exit }' .github/workflows/ci.yml)"
          automation/ci/install-npm-toolchain.sh
          export PATH="$PWD/automation/ci/npm-toolchain/node_modules/.bin:$PATH"
          test "$(npm --version)" = "$npm_version"
          make upstream-mirror
      - name: Compare allocs/op with the committed baseline
        env:
          CI: '1'
        run: make alloc-baseline

  strip-matrix:
    name: Piglet strip matrix / API tags and all tags
    needs: [head-state]
    if: ${{ needs.head-state.outputs.run-deterministic == 'true' }}
    runs-on: ubuntu-24.04
    # The default mode took 2610 s at 8 CPUs (vet of every package, the ai tests and the stripped binary for four tag sets); the hosted runner has fewer.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore the Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      # The matrix runs the tests of ./ai/, whose Pi-oracle tests start node, and the stripped binary loads a TypeScript extension: the pinned Node, as in the race job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Restore the npm cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('extensions/sdk-ts/package-lock.json', 'test/parity/interface-extractor/package-lock.json', 'automation/images/ci-parity/package-lock.json', 'automation/images/npm-runtime/package-lock.json') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ runner.arch }}-npm-
      - name: Restore the Pi oracle build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-dev/pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}
      # The Pi-oracle tests of ./ai/ need the oracle and the locked npm trees of the oracle tests, and npm on PATH: the race job's steps for its ai group.
      - name: Install native test tools and the pinned Pi oracle
        shell: bash
        run: |
          set -euo pipefail
          automation/ci/install-native-test-packages.sh
          npm_version="$(awk '/^  NPM_VERSION:/ { print $2; exit }' .github/workflows/ci.yml)"
          automation/ci/install-npm-toolchain.sh
          bin="$PWD/automation/ci/npm-toolchain/node_modules/.bin"
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$npm_version"
          make upstream-mirror
      - name: Check cmd/pig under each API strip tag and under all strip tags
        env:
          CI: '1'
        run: make piglet-strip-matrix

  strip-tests-sets:
    name: Piglet strip tests / the sets
    needs: [head-state]
    if: ${{ needs.head-state.outputs.run-deterministic == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sets: ${{ steps.sets.outputs.sets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore the Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - name: List the strip tag sets
        id: sets
        run: echo "sets=$(go run ./automation/ci/stripmatrix -print-sets -sets all)" >> "$GITHUB_OUTPUT"

  strip-tests:
    name: Piglet strip tests / ${{ matrix.set }}
    needs: strip-tests-sets
    runs-on: ubuntu-24.04
    # The bound leaves room for the hosted runner, which has fewer CPUs than the host the Makefile comment of piglet-strip-tests measured.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(needs.strip-tests-sets.outputs.sets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore the Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      # The tests of ./coding/... start node (the Pi-oracle tests and the Node extension host), sbcl (the Lisp SDK rows) and the pinned zstd (the frame tests): the pinned Node and oracle, as in the strip-matrix job, and the pinned SBCL and zstd, as in the race job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Restore the npm cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('extensions/sdk-ts/package-lock.json', 'test/parity/interface-extractor/package-lock.json', 'automation/images/ci-parity/package-lock.json', 'automation/images/npm-runtime/package-lock.json') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ runner.arch }}-npm-
      - name: Restore the Pi oracle build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-dev/pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}
      - name: Install native test tools and the pinned Pi oracle
        shell: bash
        run: |
          set -euo pipefail
          automation/ci/install-native-test-packages.sh
          npm_version="$(awk '/^  NPM_VERSION:/ { print $2; exit }' .github/workflows/ci.yml)"
          automation/ci/install-npm-toolchain.sh
          bin="$PWD/automation/ci/npm-toolchain/node_modules/.bin"
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$npm_version"
          make upstream-mirror
      # The Lisp SDK rows under ./coding/... need the pinned SBCL, as in the race job: the same cache and install step.
      - name: Restore the pinned SBCL
        id: cache-pinned-sbcl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-sbcl
          key: sbcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('automation/dev/toolchains.lock', 'automation/ci/install-sbcl.sh') }}
      - name: Install the pinned SBCL
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(automation/ci/install-sbcl.sh)"
          echo "PIG_SBCL=$prefix/bin/sbcl" >> "$GITHUB_ENV"
          echo "SBCL_HOME=$prefix/lib/sbcl" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      # Install the pinned zstd (internal/zstdblob.PinnedCLIVersion) into ~/.cache/pig-zstd and cache it by pin. Setting PIG_REQUIRE_ZSTD=1 makes the frame tests fail instead of skipping if the binary is missing.
      - name: Restore the pinned zstd
        id: cache-pinned-zstd
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pig-zstd
          key: zstd-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('automation/dev/toolchains.lock', 'automation/ci/install-zstd.sh') }}
      - name: Install the pinned zstd
        shell: bash
        run: |
          set -euo pipefail
          zstd="$(automation/ci/install-zstd.sh)"
          echo "PIG_ZSTD=$zstd" >> "$GITHUB_ENV"
          echo "PIG_REQUIRE_ZSTD=1" >> "$GITHUB_ENV"
      - name: Test ./coding/... and ./internal/codingagent/... under the strip tag set
        env:
          CI: '1'
        run: make piglet-strip-tests STRIP_TESTS_SET='${{ matrix.set }}'

  windows-concurrency-stress:
    name: Windows concurrency stress / atomic writes, locks, pipes and cleanup
    # High-repetition (-count=20) Windows stress job for atomicfile, pilock, auth-storage locks,
    # childwait/winpipe overlapped pipes, subprocess extension-host cleanup, and CLI RPC pipe/socket races.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Keep Go and oracle scratch under RUNNER_TEMP
        shell: pwsh
        run: |
          "GOCACHE=$(Join-Path $env:RUNNER_TEMP 'go-build')" >> $env:GITHUB_ENV
          "PIG_PI_BUILD_STORE=$(Join-Path $env:RUNNER_TEMP 'pi-builds')" >> $env:GITHUB_ENV
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Restore the Go module cache
        id: cache-gomod
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\go-build
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      # pilock and auth-storage stress groups include cross-process lock interop tests against Pi's
      # pinned FileAuthStorageBackend and proper-lockfile (TestConcurrentStoreWritesWithPiBackend,
      # TestHeartbeatReadsLockBeingRemovedAsNodeStatDoesUpstream, TestAcquireWithOptionsRetriesEveryAttemptErrorUpstream,
      # TestAuthStorageLock*Upstream), so restore and link the cached Windows Pi oracle matching ci.yml.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Restore the npm cache
        id: cache-npm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\npm-cache
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('extensions/sdk-ts/package-lock.json', 'test/parity/interface-extractor/package-lock.json') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ runner.arch }}-npm-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Restore the Pi oracle build
        id: cache-pi-oracle-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\pi-builds
          key: pi-oracle-${{ runner.os }}-${{ hashFiles('.upstream/pin', 'automation/pin/frozen/**', 'automation/pin/*.py', '.node-version', 'automation/ci/npm-toolchain/package-lock.json') }}
      - name: Install the pinned Pi oracle
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(awk '/^  NPM_VERSION:/ { print $2; exit }' .github/workflows/ci.yml)"
          automation/ci/install-npm-toolchain.sh
          bin="$PWD/automation/ci/npm-toolchain/node_modules/.bin"
          cygpath -w "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          test "$(npm --version)" = "$npm_version"
          py="$(command -v python3 || command -v python)"
          "$py" automation/pin/pin.py install-oracle
      - name: Run Windows concurrency stress suite
        shell: bash
        env:
          CI: '1'
          PIG_WIN_STRESS_COUNT: '20'
          PIG_WIN_STRESS_TIMEOUT: '15m'
        run: automation/ci/windows-concurrency-stress.sh
