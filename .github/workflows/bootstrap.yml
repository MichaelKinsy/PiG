name: Repository bootstrap

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository structure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify repository checkout
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -s README.md
          test -s LICENSE
          test -s NOTICE
          test -s THIRD_PARTY_NOTICES.md
