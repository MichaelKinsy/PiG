name: fifo-probe
on:
  push:
    branches: [scratch/fifo-macos-probe]
permissions:
  contents: write
concurrency:
  group: fifo-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: f, burners: 0, signals: '', signame: WINCH, pattern: ''}
          - {id: g, burners: 0, signals: 200us, signame: WINCH, pattern: '^(TestPairFIFOOpensBothEndsOnOneGoroutine|TestReadFIFOReturnsAfterWriterClosesWhateverTheInterleaving|TestZZProbeReport)$'}
          - {id: h, burners: 0, signals: '', signame: WINCH, pattern: '^(TestPairFIFOOpensBothEndsOnOneGoroutine|TestReadFIFOReturnsAfterWriterClosesWhateverTheInterleaving|TestZZProbeReport)$'}
          - {id: i, burners: 0, signals: 1ms, signame: CHLD, pattern: '^(TestPairFIFOOpensBothEndsOnOneGoroutine|TestReadFIFOReturnsAfterWriterClosesWhateverTheInterleaving|TestZZProbeReport)$'}
          - {id: j, burners: 0, signals: 1ms, signame: CHLD, pattern: '^(TestProbeReadFIFO|TestZZProbeReport)$'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .go-version
          cache: false
      - name: probe
        shell: bash
        env:
          PROBE_SIGNALS: ${{ matrix.signals }}
          PROBE_SIGNAL_NAME: ${{ matrix.signame }}
          PATTERN: ${{ matrix.pattern }}
        run: |
          sw_vers; sysctl -n hw.ncpu; uname -a
          go test -c -o /tmp/env.test ./env
          cd env
          for i in $(seq 1 ${{ matrix.burners }}); do (while :; do :; done) & done
          mkdir -p /tmp/results; res=/tmp/results/${{ matrix.id }}.txt
          { sw_vers; sysctl -n hw.ncpu; } > $res 2>&1
          fails=0; runs=0
          end=$((SECONDS + 840))
          while [ $SECONDS -lt $end ]; do
            runs=$((runs+1))
            runargs=(); if [ -n "$PATTERN" ]; then runargs=(-test.run "$PATTERN"); fi
            if ! /tmp/env.test "${runargs[@]}" -test.v > /tmp/out.$runs 2>&1; then
              fails=$((fails+1)); echo "=== FAIL run $runs"; { echo "=== FAIL run $runs"; grep -E 'WINDOW|REPORT|--- FAIL|fifo_pairing|fifo_probe|^ +\+' /tmp/out.$runs | head -80; } >> $res
            else
              { echo "=== ok run $runs"; grep -E 'WINDOW|REPORT|rounds=' /tmp/out.$runs; } >> $res
            fi
          done
          echo "SUMMARY burners=${{ matrix.burners }} signals=${{ matrix.signals }} runs=$runs fails=$fails"

          echo "SUMMARY burners=${{ matrix.burners }} signals=${{ matrix.signals }} runs=$runs fails=$fails" >> $res
      - name: publish results
        if: always()
        shell: bash
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          git config user.name probe; git config user.email probe@example.invalid
          git checkout --orphan results-${{ matrix.id }}
          git rm -rf -q . 
          cp /tmp/results/${{ matrix.id }}.txt result.txt || echo none > result.txt
          git add result.txt
          git commit -q -m "probe result ${{ matrix.id }} run ${{ github.run_id }}"
          git push -f origin HEAD:refs/heads/scratch/fifo-probe-results-${{ matrix.id }}
