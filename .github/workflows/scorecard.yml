# OpenSSF Scorecard lives in its own workflow because publish_results: true
# requires a job that uses only allow-listed actions, no top-level env or
# defaults, and no workflow-level write permissions. Publishing is what makes
# https://api.scorecard.dev/projects/github.com/MichaelKinsy/PiG/badge work.
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '23 5 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-evidence
          path: scorecard.sarif
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: scorecard.sarif
