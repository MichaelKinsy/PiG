# SPDX-License-Identifier: MIT
name: Integration branch CI

# Schedules run only on the default branch, so this workflow (on main) dispatches the full ci.yml and security.yml on each
# long-lived integration branch every night. No long-lived branch goes without GitHub CI. The branches come from the
# repository variable PIG_INTEGRATION_BRANCHES (space-separated) when it is set, and otherwise from automation/ci/integration-branches.txt, the list ci.yml's job order reads and its push filter must match; a branch that does not exist is skipped.
on:
  schedule:
    - cron: '11 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch CI on integration branches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: automation/ci/integration-branches.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Dispatch ci.yml and security.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCHES: ${{ vars.PIG_INTEGRATION_BRANCHES }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          if [ -z "${BRANCHES// /}" ]; then
            BRANCHES=$(grep -vE '^[[:space:]]*(#|$)' automation/ci/integration-branches.txt | tr '\n' ' ')
          fi
          for branch in $BRANCHES; do
            # A missing branch is skipped; any other API error (403, 5xx, rate limit) fails the job so the nightly cannot go silent.
            if ! err=$(gh api "repos/$REPO/branches/${branch//\//%2F}" --silent 2>&1); then
              if grep -q 'HTTP 404' <<<"$err"; then
                echo "::notice::$branch does not exist; skipped"
                continue
              fi
              echo "::error::cannot look up $branch: $err"
              status=1
              continue
            fi
            for wf in ci.yml security.yml; do
              gh workflow run "$wf" --repo "$REPO" --ref "$branch"
              echo "dispatched $wf on $branch"
            done
          done
          exit "$status"
