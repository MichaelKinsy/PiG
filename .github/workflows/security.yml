# SPDX-License-Identifier: MIT

name: Security and supply chain

# Security result is a required check, so every event that can land a change
# reports it: a pull request, and the merge queue's merge_group run.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      product: ${{ steps.classify.outputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        shell: bash
        # Source analysis skips pull requests and merge groups that change only
        # project prose and repository metadata. Secret scanning always runs.
        run: automation/ci/classify-changes.sh "$EVENT" "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

  source-assurance:
    name: Source assurance
    needs: [changes]
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            test/parity/interface-extractor/package-lock.json
            automation/images/ci-parity/package-lock.json
            automation/images/npm-runtime/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install source-analysis tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r automation/ci/security-tools.txt
          automation/ci/install-apt-packages.sh shellcheck
      - name: Check compliance evidence (REUSE, govulncheck, pins, workflow hardening)
        run: make compliance
      - name: Run Go static analysis
        run: |
          go vet ./...
          # golangci-lint owns style and Pi-compatible naming checks. This pass
          # runs Staticcheck's correctness analyzers without conflicting rules.
          # Vendored upstream source under third_party keeps upstream's code
          # (see each FORK.md), as golangci-lint's exclusion does.
          go tool staticcheck -checks='SA*' $(go list ./... | grep -v '/third_party/')
      - name: Audit npm lock files
        shell: bash
        run: |
          set -u
          mkdir -p evidence
          status=0
          for directory in test/parity/interface-extractor automation/images/ci-parity automation/images/npm-runtime; do
            name=${directory//\//-}
            if ! npm audit --prefix "$directory" --omit=dev --json > "evidence/npm-audit-$name.json"; then
              echo "::warning file=$directory/package-lock.json::npm audit reported findings; review the uploaded evidence"
              status=1
            fi
          done
          echo "npmAuditFindings=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Analyze Python SDK
        run: |
          ruff check extensions/sdk-py
          bandit -q -r extensions/sdk-py/pig_sdk
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path('extensions/sdk-py/pyproject.toml').read_text())
          dependencies = data.get('project', {}).get('dependencies', [])
          if dependencies:
              raise SystemExit(f'run pip-audit for declared dependencies: {dependencies}')
          print('Python SDK declares no runtime dependencies')
          PY
        shell: bash
      - name: Analyze shell scripts
        run: find automation docs/site/public -type f -name '*.sh' -print0 | xargs -0 shellcheck
      - name: Generate source SBOMs
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: evidence/source.spdx.json
          upload-artifact: false
      - name: Generate source CycloneDX inventory
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: evidence/source.cyclonedx.json
          upload-artifact: false
      - name: Scan source inventory with Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: evidence/source.spdx.json
          fail-build: false
          output-format: sarif
          output-file: evidence/grype-report.sarif
          severity-cutoff: high
          only-fixed: false
      - name: Validate and summarize source inventory
        run: |
          python automation/release/validate-sbom.py \
            --spdx evidence/source.spdx.json \
            --cyclonedx evidence/source.cyclonedx.json \
            --licenses evidence/licenses.csv \
            --out evidence/inventory-validation.json
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-assurance-evidence
          path: evidence/
          retention-days: 30

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action supports only push, pull_request, workflow_dispatch and schedule; on merge_group it exits with an
      # error. The commits a merge group adds are the queued pull request's own, which the pull_request run scanned.
      - name: Gitleaks
        if: github.event_name != 'merge_group'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # base and head are empty outside a merge group, which keeps the action's per-event range there; in a merge group
      # they scan the commits the queue added to the base branch.
      - name: TruffleHog verified findings
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./
          base: ${{ github.event.merge_group.base_sha }}
          head: ${{ github.event.merge_group.head_sha }}
          extra_args: --only-verified

  dependency-review:
    name: Dependency review
    needs: [changes]
    if: github.event_name == 'pull_request' && github.event.repository.private == false && needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: true
          # GHSA-vxpw-j846-p89q and GHSA-rfgv-xxqx-mfg5 (undici) appear only in the lockfile of Pi's example
          # extension "gondolin" (with GHSA-86w9-cpqp-85rv for node-forge, which has no
          # patched release), and GHSA-w7jw-789q-3m8p and GHSA-395f-4hp3-45gv
          # (shell-quote) only in the lockfile of Pi's example extension "sandbox".
          # Both are vendored verbatim under runtime-node/shims/pi-dist; PiG neither
          # installs nor bundles those examples' dependencies.
          allow-ghsas: GHSA-vxpw-j846-p89q, GHSA-rfgv-xxqx-mfg5, GHSA-86w9-cpqp-85rv, GHSA-w7jw-789q-3m8p, GHSA-395f-4hp3-45gv

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: [changes]
    if: github.event.repository.private == false && needs.changes.outputs.product == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
            config: '{}'
          - language: javascript-typescript
            build-mode: none
            config: |
              paths:
                - extensions/sdk-ts
                - coding/extension/host/subprocess/runtime-node
              paths-ignore:
                # Vendored upstream copies (Pi's own dist, cross-spawn,
                # grok-mermaid): shipped byte-exact so extensions run Pi's
                # code; findings belong upstream, not in local patches.
                - coding/extension/host/subprocess/runtime-node/shims
          - language: python
            build-mode: none
            config: |
              paths:
                - extensions/sdk-py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: .go-version
          cache: true
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: ${{ matrix.config }}
      - if: matrix.build-mode == 'manual'
        run: go build ./...
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

  result:
    name: Security result
    # The one required check for this workflow; see CI result in ci.yml.
    needs: [changes, source-assurance, secret-scan, dependency-review, codeql]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every security job this event runs
        env:
          EVENT: ${{ github.event_name }}
          PRIVATE: ${{ github.event.repository.private }}
          PRODUCT: ${{ needs.changes.outputs.product }}
          CHANGES: ${{ needs.changes.result }}
          SOURCE: ${{ needs.source-assurance.result }}
          SECRETS: ${{ needs.secret-scan.result }}
          REVIEW: ${{ needs.dependency-review.result }}
          CODEQL: ${{ needs.codeql.result }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          expect() { # job result allowed-skip
            if [ "$2" = success ] || { [ "$2" = skipped ] && [ "$3" = true ]; }; then
              echo "$1: $2"
            else
              echo "::error::$1: $2"
              status=1
            fi
          }
          # Docs-only changes (the changes classifier) skip the product scans.
          product_skip=false; review_skip=false; codeql_skip=false
          [ "$PRODUCT" = false ] && product_skip=true
          { [ "$EVENT" != pull_request ] || [ "$PRIVATE" = true ] || [ "$product_skip" = true ]; } && review_skip=true
          { [ "$PRIVATE" = true ] || [ "$product_skip" = true ]; } && codeql_skip=true
          expect "Changed paths" "$CHANGES" false
          expect "Source assurance" "$SOURCE" "$product_skip"
          expect "Secret scanning" "$SECRETS" false
          expect "Dependency review" "$REVIEW" "$review_skip"
          expect "CodeQL" "$CODEQL" "$codeql_skip"
          exit "$status"
