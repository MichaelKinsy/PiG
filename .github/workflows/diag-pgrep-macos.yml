# SPDX-License-Identifier: MIT
# Diagnostic workflow for macos-15 pgrep -s exit status 2 in
# TestTypingEchoesWhileASessionNameHandlerSleeps.
# Runs only on pushes to diag/** and is never merged.
name: Diag pgrep on macos-15

on:
  push:
    branches:
      - "diag/**"

permissions:
  contents: read

jobs:
  diag-pgrep-macos:
    name: Diag pgrep / macos-15
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install a current bash for the shard selection script
        run: |
          set -euo pipefail
          brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
      - name: Install native test tools
        shell: bash
        run: |
          set -euo pipefail
          brew install fd ripgrep tmux
      - name: Probe pgrep and tmux session behavior
        shell: bash
        run: |
          set +e
          echo "+ command -v pgrep"
          command -v pgrep
          echo "+ which -a pgrep"
          which -a pgrep
          echo "+ type -a pgrep"
          type -a pgrep
          echo "+ pgrep -V"
          pgrep -V 2>&1
          echo "status=$?"
          echo "+ /usr/bin/pgrep -V"
          /usr/bin/pgrep -V 2>&1
          echo "usr_bin_status=$?"
          echo "+ sw_vers"
          sw_vers
          echo "+ PATH entries"
          echo "$PATH" | tr ":" "\n"

          echo "+ tmux new-session -d -P -F #{pane_pid} sleep 30"
          pid=$(tmux new-session -d -P -F "#{pane_pid}" "sleep 30")
          echo "pane_pid=$pid"
          echo "+ ps -o pid,ppid,pgid,sess,tty,command -p $pid"
          ps -o pid,ppid,pgid,sess,tty,command -p "$pid"
          echo "+ ps -o sess= -p $pid"
          ps -o sess= -p "$pid"

          echo "+ LIVE: pgrep -s $pid"
          pgrep -s "$pid" 2>&1
          echo "status=$?"
          echo "+ LIVE: /usr/bin/pgrep -s $pid"
          /usr/bin/pgrep -s "$pid" 2>&1
          echo "usr_bin_status=$?"

          echo "+ tmux kill-server"
          tmux kill-server

          echo "+ DEAD: polling pgrep -s $pid (up to 10 tries, 0.5s apart)"
          for i in $(seq 1 10); do
            echo "+ DEAD try $i: pgrep -s $pid"
            pgrep -s "$pid" 2>&1
            st=$?
            echo "try=$i status=$st"
            if [ "$st" -eq 1 ]; then
              break
            fi
            sleep 0.5
          done
          echo "+ DEAD: /usr/bin/pgrep -s $pid"
          /usr/bin/pgrep -s "$pid" 2>&1
          echo "usr_bin_status=$?"

          echo "+ ABSENT: pgrep -s 99999999"
          pgrep -s 99999999 2>&1
          echo "absent_status=$?"
      - name: Run TestTypingEchoesWhileASessionNameHandlerSleeps three times
        shell: bash
        env:
          CI: "1"
        run: |
          set +e
          for i in 1 2 3; do
            echo "=== go test run $i ==="
            go test -race -count=1 -v -timeout 10m -run "^TestTypingEchoesWhileASessionNameHandlerSleeps$" ./internal/codingagent || true
          done
