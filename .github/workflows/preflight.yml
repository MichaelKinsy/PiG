# SPDX-License-Identifier: MIT
name: Pre-flight

# The cheap checks every open PR must pass before heavy CI: once an hour, one runner, every open PR, a few at a time
# (`preflight run`; what it checks is declared in automation/ci/preflight/config.yaml). It always runs main's code and configuration, never a PR's: schedule and dispatch
# check out the default branch. Each PR gets a "preflight" commit status and one comment the next run updates. A PR
# whose head and base did not change since its last run costs one API call; its state is kept in the cache. A run
# fully checks at most 20 PRs, the longest waiting first, and starts none after 25 of its 30 minutes; the rest wait
# for the next run.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      prs:
        description: PR numbers, space-separated; empty runs every open PR
        required: false
        default: ''
        type: string
      dry-run:
        description: Read only; set no status and post no comment
        required: false
        default: false
        type: boolean

permissions: {}

# One run at a time, so two runs never write the same PR's comment or state; a run waits for the one before it.
concurrency:
  group: preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Pre-flight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Build the pre-flight and install its scanners
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/preflight/preflight" ./automation/ci/preflight
          "$RUNNER_TEMP/preflight/preflight" install --bin "$RUNNER_TEMP/preflight/bin"
      - name: Restore the PR states
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/preflight/states
          key: preflight-states-${{ github.run_id }}
          restore-keys: |
            preflight-states-
      - name: Run the pre-flight over the PRs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRS: ${{ inputs.prs }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          extra=()
          if [ "${DRY_RUN:-}" = true ]; then extra+=(--dry-run); fi
          "$RUNNER_TEMP/preflight/preflight" run --repo "$GITHUB_REPOSITORY" --root "$GITHUB_WORKSPACE" \
            --bin "$RUNNER_TEMP/preflight/bin" --states "$RUNNER_TEMP/preflight/states" --work "$RUNNER_TEMP/preflight/work" \
            --prs "${PRS:-}" --budget 20 --time-budget 25m "${extra[@]}"
      # Always, also after a failure or a timeout: the states of the PRs that were recorded must not be lost.
      - name: Save the PR states
        if: ${{ always() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/preflight/states
          key: preflight-states-${{ github.run_id }}
