# Provenance of every golden or snapshot data file.
#
# A golden is expected output stored as a file. Its value is evidence only when
# it comes from Pi. A golden whose bytes are PiG's own output pins PiG against
# itself: regenerating it silences a behavior change instead of catching one.
#
#   owner = "pi"   Produced by running Pi (or Node on Pi's code). `generator` is
#                  the tracked script that regenerates the file from Pi, and the
#                  test that reads the file compares PiG with it.
#   owner = "pig"  PiG's own output. Allowed only when a value snapshot is the
#                  one way to state the rule. `invariant` names the test that
#                  asserts the rule itself, and `why` says what the snapshot adds.
#
# `testprune lint` (make test-provenance) fails on a golden file that no entry
# matches. A PiG-owned golden needs the same review as new behavior.
#
# A Go file that rewrites its own expected files (UPDATE_GOLDEN or an -update flag)
# puts every non-code file of its testdata directory under the same rule. An
# [[input]] entry names the files there that are inputs, not expectations.

# Commits authored before this time are not checked by `make test-expectation-lint`
# (an expected value changed together with its code needs a Pi citation).
expectations_from = "2026-10-10T00:00:00Z"

