[[golden]]
paths = ["internal/yaml12/testdata/v3diff/differences.txt"]
owner = "pig"
invariant = "TestParseMatchesTheLibrary"
why = "The file lists where go.yaml.in/yaml/v3, which PiG links for Piglets and Compose files, reads a document differently from internal/yaml12, which is held to the yaml library Pi uses by TestParseMatchesTheLibrary. Pi has no second parser, so the list is PiG's own: it records the exact documents whose meaning moves if one parser replaces the other."

# The yaml12 differential test reads piglet-corpus.json as its input documents (the Piglet test YAML it harvested); it rewrites only differences.txt.
[[input]]
paths = ["internal/yaml12/testdata/v3diff/piglet-corpus.json"]

