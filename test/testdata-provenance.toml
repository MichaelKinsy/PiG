[[golden]]
paths = ["durable/core/probe/testdata/*.steps"]
owner = "pig"
invariant = "TestScripts"
why = "The durable ABI step bytes are PiG's own wire format (ABI section 12). The shim's Wasm conformance test replays the same scripts and compares the same bytes, so the golden is the byte contract between the native and Wasm hosts."

[[golden]]
paths = ["durable/core/contracttest/binding/testdata/*.steps"]
owner = "pig"
invariant = "TestBindingConformance"
why = "The durable ABI step bytes are PiG's own wire format (ABI section 12). Every Wasm build must replay the script to these bytes, so the golden is the byte contract between the native and Wasm hosts."

[[golden]]
paths = ["coding/piglet/testdata/lineage/lineage_source.golden"]
owner = "pig"
invariant = "TestLineageOfASourceChainsRootFirstWithEachLinksChanges"
why = "Pi has no Piglets, so the text of `pig piglet lineage` (D170) is PiG's own format. The invariant test asserts the chain order, versions, digests and per-link changes as values; the snapshot adds the exact rendered layout (indentation, labels, change lines) a user reads."

[[golden]]
paths = ["coding/piglet/testdata/lineage/tree.golden", "coding/piglet/testdata/lineage/tree_depth1.golden"]
owner = "pig"
invariant = "TestTreeDepthLimitAndJSON"
why = "Pi has no Piglets, so the text of `pig piglet tree` (D170) is PiG's own format. The invariant test asserts the depth limit and the JSON nodes as values; the snapshots add the exact box-drawing layout and markers (`*`, `[installed]`) a user reads."

