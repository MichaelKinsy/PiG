# Pi e67aa1a4e5 (2026-11-15): feat(durable): onAbort "keep" keeps a queued input through conversation aborts. It replaces f8a292842 (Conversation.abort() resolved with {withdrawn}), which Pi reverted three minutes after landing (684fddee0b); neither of those is ported, and abort() still resolves with no value.
# Left out of this range because other lines account for them: 8270d9af6 (chord admission with a typed value, slice 14), 7ce13c086 (the p2 half of this change: apps/p2 subagent and peer messages stay queued through Stop).

[[files]]
