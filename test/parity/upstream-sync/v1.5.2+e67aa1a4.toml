change = "modified"
disposition = "ported"
evidence = ["test:durable/harness/harness_input_entries_test.go#TestInputEntries", "test:durable/core/inbox/inbox_test.go#TestWithdrawQueuedKeepsInputsSubmittedWithOnAbortKeep", "test:durable/core/driver/harness_input_entries_core_test.go#TestCoreAKeepInputStaysQueuedThroughAConversationAbortAndTheNextInputPlacesIt", "test:durable/core/driver/harness_input_entries_core_test.go#TestCoreAnAbortInFlightWithdrawsWhatItsCommitFoundQueuedAndStoresOnAbortOnlyForKeep"]
rationale = "e67aa1a4e5: InboxItem gains the optional `onAbort: \"keep\"` after `entry`; withdrawAbortedInputs (Conversation.abort() and abort cascades) leaves the inputs that carry it queued, withdrawQueuedInputs(tx, id, reason) (a failed run under afterFailedRun withdraw) still withdraws every input, and an item stored with any other value withdraws. harness/inbox.go InboxItem.OnAbort, WithdrawAbortedInputs and WithdrawQueuedInputsFor do the same; the durable core does it in core/inbox (Draft.OnAbort, WithdrawAborted, WithdrawQueuedFor). Pi's tree printed the stored bytes and the order of an abort in flight; both are asserted for both engines."
oracle = "not carried: the oracle is Pi 1.5.2, which has no onAbort; the expected bytes and order are Pi e67aa1a4e5's own output for the same inputs (a scratch case run in Pi's tree), written into the ported tests"

