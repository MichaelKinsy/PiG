# Pi e5c01ca6cb9d (2026-11-19): fix(ai): send strict on GitHub Copilot Responses tools (#12329, closes #12286).
# Carried out of Pi's order: the commits between cead615b and e5c01ca6 are not taken by this line, so the file below is the only one of this commit's source changes.
