rationale = "e5c01ca6cb9d (#12329): the provider overlay declares compat.supportsStrictMode for api openai-responses next to the existing openai-completions entry, so every GitHub Copilot Responses model sends `strict` on its function tools (false for an ordinary tool, true for a json_schema constrained one) where a missing `strict` was read by Copilot as strict mode and made the model fill omitted optional arguments with empty strings or invented values. internal/modelgen/providers/github_copilot.go sets the same compat default; the golden hashes of the Copilot files and of the two lists of every model are what Pi's generator writes with the overlay over the pinned mirror (PI_CATALOG_OVERLAY of equivalence.sh). The oracle's catalog data and the built-in catalog take the 14 Copilot Responses records from the same file in automation/gen/catalog-source/pi-overlay."
oracle = "carried: e5c01ca6cb9d (the catalog overlay catalog/providers/github-copilot.ts)"
