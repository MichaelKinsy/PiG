[[files]]
path = "packages/coding-agent/src/utils/flush-stdout.ts"
change = "added"
disposition = "designed-out"
evidence = ["test:coding/cli/startup_picker_exit_bytes_linux_test.go#TestStartupResumePickerExitLeavesTheTerminalModesReset", "test:internal/codingagent/interactive_exit_hint_test.go#TestInteractiveQuitPrintsOneHintAfterTerminalRestore"]
rationale = "7c05885bc (#12133): flushStdout waits for the writes queued in process.stdout before process.exit(), which drops them. pig has no queue to flush: every terminal write is a synchronous out.Write (tui/terminal.go:823-831, no bufio on an exit path), every exit goes through releaseForExit (coding/cli/profiling.go:29-57), and a pipe on stdout never runs the TUI (probe of lane PiExitSignalCheck: 0 of 200 interactive exits lost their final bytes). Nothing in Go corresponds to the one-second timeout or the EPIPE listener."
oracle = "carried: 7c05885bc (flushStdout is added to utils/sleep.js; the callers below)."

