from = "1.5.2+efbcd5ad"
to = "1.5.2+ac78a606"

# The range efbcd5adb4bc..ac78a6068b38 (the packages and the apps/p3 documents: git diff --stat efbcd5adb4bc ac78a6068b38 lists 25 paths; 11 are accounted here). It starts where v1.5.2+efbcd5ad.toml
# (2145e3f6099c..efbcd5adb4bc) ends: no gap, no overlap. The product commit is ac78a6068b38 (2026-11-16, #12117, related to #11264): fix(coding-agent): remove two remaining direct terminal
# writes. The other commits of the range change Pi's private design documents (apps/p3/docs: fifteen docs(p3) commits) and apps/p2, Pi's own web application: the ledgers here
# list packages/ and the apps/p3 documents, as the earlier ones do, and none lists an apps/p2 path.
# What PiG did before this commit, for each of the two changes:
# 1. parseChangelog(path) printed `Warning: Could not parse changelog: <error>` with console.error when the file existed and could not be read. PiG never printed anything:
#    internal/codingagent/interactive_changelog.go parseChangelogFile (the one reader of an extension package's changelog; getExtensionChangelogUpdates calls it) returns nil at
#    the failed os.ReadFile, and ParseChangelog itself takes the content, not a path. A grep of the Go sources, the SDKs and the vendored runtime for "Could not parse changelog",
#    for "Restored model", "Could not restore model" and "Falling back to" finds no terminal write in PiG's own code (the matches are ordinary comments and tests).
#    Pi's own changelog is embedded in the binary (bundledChangelog), so it cannot be unreadable. This was a difference of Pi v1.5.2 that PiG did not have, not one this commit closes:
#    PiG's behaviour does not change; the Node extension runtime and the parity oracle did print, and now carry the commit (automation/gen/pi-post-release-backports.mjs, ac78a6068b38).
# 2. restoreModelFromSession had no PiG port (no caller upstream either), so there is nothing to delete; the interface inventories never listed it (the symbol is not exported from the
#    package's entry point), and the declaration in extensions/sdk-ts/pi-pin.d.ts is the pinned build's, regenerated from the installed oracle at the re-pin.

