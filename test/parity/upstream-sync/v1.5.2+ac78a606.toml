rationale = "ac78a6068b38: parseChangelog returns [] for a changelog it cannot read without console.error. PiG's parseChangelogFile (the only path reader) already returned nil at the failed read and printed nothing, so the ported test is a pin: it passes on the code before the commit (not a red). It passes the same input (a directory as the changelog path) and asserts no entries and nothing written to the process's real stdout and stderr; the caller test shows an extension package whose CHANGELOG.md is unreadable gives no startup note, records no version and prints nothing, and that /changelog's text for no entries is 'No changelog entries found.' as in Pi. The stale comment on ParseChangelog that said errors were logged is corrected."
oracle = "carried: ac78a6068b38 (pi-coding-agent/utils/changelog.js: the catch returns [] without console.error; the vendored runtime inherits it)."

