rationale = "ede360e4d (#12121, issue #12119): getLastAssistantText skips an assistant message without text whose turn did not end normally (`stopReason !== \"stop\" && !content.some((c) => c.type === \"text\" && c.text.trim())`: aborted, error, toolUse, length, or no stop reason), where it skipped only an aborted message with no content; a reply that ended with stop stays the last reply even without text. coding.Session.LastAssistantText is the one Go function (trim is internal/jsstring.Trim, String.prototype.trim); /copy and the copy key (internal/codingagent handleCopyCommand), RPC get_last_assistant_text (coding/cli/rpc_mode.go, which the evals harness reads), the slash command context of coding/session_ops.go and the child session's getLastAssistantText and state (coding/cli/child_session_ops.go, child_sessions.go) all call it. The Node runtime's vendored agent-session.js and the parity oracle carry the commit through the backport block ede360e4d of automation/gen/pi-post-release-backports.mjs."

