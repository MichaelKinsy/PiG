# The range c47ad0432bb8..beffcde92dea: one product commit, beffcde92dea (2026-11-16, #12230, issue #10470): fix(coding-agent): emit session_start once on RPC session replacement.
# It starts where v1.5.2+c47ad043.toml (ac78a6068b38..c47ad0432bb8) ends: no gap, no overlap. It changes three paths, all accounted here.
# What PiG did before this commit: PiG had BOTH faults, in every extension SDK, since v0.3.0 (the first tag with the handler-side rebind; v0.2.0 has neither).
# 1. PiG's RPC command handlers new_session, switch_session, fork and clone called rpcHost.rebindAgain after the Runtime's own rebind callback (SetRebindSession), as Pi's rpc-mode.ts did: session_start (and
#    resources_discover) ran twice for the new Session, with no session_shutdown between, and an entry appended in session_start was written twice. Measured on the code before the change (red run, out/red.log):
#    new_session ran session_start ["new:1" "new:2"], switch_session ["resume:3" "resume:4"], fork and clone ["fork:1" "fork:2"], for a Go-embedded extension and, in TestRPCWritesSessionStartEmissionsOnceInEverySDK,
#    two session_start calls for the Node, Go, Python, Rust and Lisp realizations alike.
# 2. PiG's RPC mode held the entry_appended writer and the name listener back until the first session_start returned (the `writing` flag rpcHost.bind set after the first announce), as Pi subscribed after
#    bindExtensions: the events a startup session_start handler emitted (entry_appended, session_info_changed, a message it sent) never reached the client, and a replacement's first bind wrote nothing.
#    Both are fixed together: rebindAgain is deleted, the flag is deleted, rpcHost.bind subscribes (forward and the name listener) before the first announce. Pi's change is the same two moves.
# Scenarios that moved with it, each to what Pi with the backport produces: rpc/70-rpc-session-start-writer-order (startup and first-bind events are written), rpc/73-rpc-session-start-message-after-response
# (the message a session_start listener sends at once is written ahead of the response); new: rpc/87-rpc-replacement-session-start-once, rpc/88-rpc-startup-session-start-events.

