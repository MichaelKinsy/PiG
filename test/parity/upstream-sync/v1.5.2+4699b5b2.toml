rationale = "4699b5b26 (#12136, fixes #12128) adds two entries to the transport section of RETRYABLE_PROVIDER_ERROR_PATTERN, after \"getaddrinfo\": (?<![a-z0-9_])(?:ECONNRESET|ECONNABORTED|ECONNREFUSED|ETIMEDOUT|EPIPE)(?![a-z0-9_]) and \"connection reset by peer\". A provider error whose text is only a Node socket error code (\"read ECONNRESET\", \"write EPIPE\", \"connect ETIMEDOUT 140.82.113.3:443\"; the confirmed case is Bedrock through the AWS SDK's Node HTTP handler) ended the turn with no retry. The match is over the error text only, case-insensitive, with a guard on both sides so a code inside a longer identifier does not match; a guarded code anywhere in the text matches (Pi's function answers true for a 400 body that holds the bare word, and the oracle test pins that). EHOSTUNREACH, ENETUNREACH and UND_ERR_SOCKET stay not retried. retryableProviderErrorPattern (ai/assistant_retry.go) takes both entries in Pi's position, the guard spelled without lookaround as for the status codes, and the copies of the list carry them: durable/core/turn/patterns.go (regenerated by oracle/gen_patterns.mjs from Pi 4699b5b26), extensions/sdk/pi_ai_models.go, and the Python, Rust and Lisp SDKs, each with Pi's nine cases in its own test; the vendored pi-ai/utils/retry.js and the oracle carry the commit through the backport block 4699b5b26. Go reports the same transport events as typed errors and already names them with Node's code before the classifier reads the text (internal/nodeerrno: the POSIX errno, and on Windows the WSAE* and system error numbers libuv maps to the code), so no typed match is added: TestSocketCodeTransportErrorsAreRetriedInTheirNodeForm has one row per code and per platform errno. Two Go assertions that held Pi's earlier answer are inverted with it: Go's text \"connection reset by peer\" and Bedrock's bare \"connect ECONNREFUSED <address>\" are now retried. No retry count, delay or cap changes."

