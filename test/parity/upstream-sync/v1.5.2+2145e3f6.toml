# The range f6600b58f347..2145e3f6099c (8 files; four commits: 2c2a77f9f3ab, 3cdddfa70bce, 359de834831 and 2145e3f6099c). The product commit is 2c2a77f9f3ab (#12148):
# Mistral tools are sent strict only when the model's compat.supportsStrictMode is set (absent is false), where buildChatPayload passed true; Pi's 2145e3f6099c regenerates the
# models configuration reference for the new compat member. 3cdddfa70bce and the merge 359de834831 change Pi's private design documents (apps/p3) only. Pi's own sources were read
# from the public upstream (https://github.com/earendil-works/pi, `git fetch` of main into a scratch clone): the origin of ~/pi-main on the build host was a bundle that no longer exists.

[[files]]
path = "packages/ai/src/api/mistral-conversations.ts"
change = "modified"
disposition = "ported"
evidence = ["test:ai/mistral_tool_schema_upstream_test.go#TestMistralToolsAreNonStrictUnlessTheModelEnablesStrictMode", "test:ai/mistral_test.go#TestMistralToolsWithoutStrictMode", "test:ai/mistral_strict_mode_oracle_test.go#TestMistralStrictToolsRequestBodyMatchesPi"]
rationale = "2c2a77f9f3ab (#12148): buildChatPayload passes model.compat?.supportsStrictMode ?? false to toFunctionTools, which hands it to resolveJsonSchemaStrictSampling where it passed true; a tool with json_schema constrained sampling goes out with strict false and its own schema unless the flag is set, and a 'require' tool fails with 'Tool \"<name>\" requires JSON-schema constrained sampling, but strict tools are unsupported.' before any request. mistralProvider.Stream (ai/mistral.go) reads the shared ModelCompat.SupportsStrictMode and passes it to convertTools; the error is returned as the resolver wrote it (the 'mistral: convert tools:' prefix PiG added is gone, as Pi reports error.message). A tool without constrained sampling is unchanged (strict false before and after). TestMistralStrictToolsRequestBodyMatchesPi compares the request bytes and the error with the oracle (pinned Pi plus the 2c2a77f9f3ab backport entries)."

