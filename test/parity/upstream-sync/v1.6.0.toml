rationale = "[v1.5.2+8d30e630] 8d30e6306 (events: fire-and-forget members): HostEvents (counter, list, one flush per turn as a Loop.Queue microtask: every entry to its node's taps, links' senders first, then listeners in entry then subscription order), EventNode/Tap (boundAt < n), Subscription (stop, context abort, a panicking listener is reported listener_error and ends only itself) and OwnEventSource (Emit returns released after the seal; Emit and On enter the loop as a section because the rest of a suspended handler runs off the section that admitted it). Pi's settled Promise from on() is a blocking (subscription, error). host_events.go; tests host_events_test.go with host_events_support_test.go (Pi's support.ts event helpers: Ticker, NamedTicker, TickerView, Match, ticking, recorder; Pi's single JS turn is hostTurn, one host section). Designed out: the vi.spyOn of HostEvents.counter in the cost test (a Go method cannot be spied: the test asserts the bindings of contracts without event members hold no event bookkeeping and the counter never moved) and the shared-empty-events-slice identity of variantNames (Go empty slices share no allocation by construction). Async contract (Pi 8d30e6306; the file is not in the v1.5.2 tree, so test/parity/async-contracts.toml has no row for it until the pin contains it; contracts microtask-ordering, cancellable): HostEvents.push `if (this.#list.length === 0) queueMicrotask(() => this.#flush())`: one flush per turn after the turn's published state, entries in emit order, what a listener emits goes to the next flush: hostEvents.push queues flush once per non-empty list with Loop.Queue, never a goroutine. | Subscription `signal.addEventListener(\"abort\", this.#abort, { once: true })`: `context.AfterFunc(ctx, ...)` entering the loop to stop the subscription, removed at Stop; a call due after the abort is skipped. | subscribe()/OwnEventSource.on(): Promise<EventSubscription>, settled when returned (`Promise.reject(signal.reason)` for an aborted context, `released` after the seal, else `Promise.resolve(subscription)`): a blocking (contracts.EventSubscription, error) with context.Cause(ctx) or the released error; a listener that throws is reported listener_error and ends only its subscription."

