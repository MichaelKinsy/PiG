rationale = "[v1.5.2+release-0.8.0] 935f0ac0ccfc (#12092, fixes #12062): a short line followed by one line longer than about 100KB made the bash tool return no output and a footer like \"[Showing lines 3-2 of 2 (50.0KB limit)]\", because the retained tail was only the end of that line and clipping its partial first line left an empty snapshot. snapshot() truncates the unclipped tail when clipping leaves nothing, so the last 50.0KB of the line show with the partial-line notice. OutputAccumulator.snapshotText does the same, and Pi's test is ported through the bash tool, with CRLF, a missing trailing newline, several over-long lines, multi-byte characters at the cut and a line at, under and over the rolling tail. Oracle: the vendored pi-dist and the parity oracle carry the change (pi-post-release-backports.mjs entry for core/tools/output-accumulator.js), TestOutputAccumulatorMatchesPi compares the accumulator with it on those inputs, and the \"bash over-long last line\" case of scenario 15-builtin-tool-wire-details compares the bash tool's complete result (content, details, structured content) through the SDK with the patched Pi, where only D153's notice size is replaced on both sides. The Pi CLI bundle (dist/bundle) is not patched by the oracle's backports, so a CLI-driven scenario would still see Pi 1.5.2's loss. D153 (the notice's line size) is unchanged: the scenario's normalization names it."

