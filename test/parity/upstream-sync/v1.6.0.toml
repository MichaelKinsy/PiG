evidence = ["test:coding/extension/exec_signal_code_unix_test.go#TestExecCommandReportsSIGTERMForATimeout", "test:coding/extension/exec_signal_code_unix_test.go#TestExecCommandReportsSIGTERMForAnAbort", "test:coding/extension/exec_signal_code_unix_test.go#TestExecCommandReportsTheSignalOfACommandKilledByAnother", "test:coding/extension/exec_oracle_test.go#TestExecCommandMatchesPi", "test:test/extension-conformance/exec_abort_test.go#TestExecAbortAcrossSDKs"]
rationale = "[v1.5.2+release-0.8.0] a83b75a07 (#12089, fixes #12088): execCommand mapped a missing exit code to 0 (`code ?? 0`), so a command that a signal ended, by a timeout, an abort, a crash or an outside kill, read as success. It reports 128 + the signal number as a shell does (143 for SIGTERM, 137 for SIGKILL), and 1 with neither a code nor a signal; killed and truncated are unchanged. ExecCommand (coding/extension/exec.go, exitCode in exec_unix.go and exec_windows.go) does the same: on Windows a child that terminate ended reports 143, the signal libuv records for it. The parity oracle and the vendored pi-dist carry the change (automation/gen/pi-post-release-backports.mjs): TestExecCommandMatchesPi compares the exit code of a command that kills itself with SIGKILL, SIGTERM or SIGHUP, a timeout, a pre-aborted signal and a child that ignores SIGTERM with Pi's; TestExecAbortAcrossSDKs runs the extension abort through every SDK, isolated and packed, and expects code 143."

