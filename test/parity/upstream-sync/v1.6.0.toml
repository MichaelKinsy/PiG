path = "packages/durable/src/harness/util.ts"
change = "modified"
disposition = "ported"
evidence = ["test:durable/harness/harness_wait_cancel_test.go#TestAWaitEndedBeforeItsResultIsDelivered", "test:durable/harness/wait_aborted_context_test.go#TestWaitCancelledBeforeItsResultIsDeliveredReturnsTheCauseOnThatWait"]
rationale = "[v1.5.2+d9d535b6] d9d535b6c (#12041, fixing #11963 and #11820) makes Waiters.add attach a no-op handler to every promise it returns, including the already-aborted one, so a wait cancelled or closed before the line delivered its job's result reports no unhandled rejection while the caller still gets the rejection. Go has no unhandled rejection: a Waiter is a done channel and a value the caller reads in Wait, and Waiters.Add already registers a waiter that settles once, gives the caller context.Cause (or the close error) once the job is delivered, removes a cancelled waiter from the set, and ends its goroutine. No Go change is needed, so this is already equivalent; harness_wait_cancel_test.go ports the Pi case (a held publication, then a Submission.Wait whose context ends, ended before, or whose Harness closes) and checks the registry and the goroutines Waiters.Add started. Harness.WaitForTask registers through the same Waiters.Add. [v1.5.2+release-0.8.0] Pi d9d535b6c9e4 (#11963, #11820) marks the promise Waiters.add returns as handled before it reaches the caller, so a wait cancelled or closed while the line still delivers earlier outcomes leaves no unhandledRejection; the caller still gets the rejection. Go has no unhandled rejection: Waiter.Wait returns the stored cancellation cause or closed error on the same call, so no Go source changed and the contract is the error on that operation. The ported Pi case (slow Publishing, earlier write, cancelled wait) is TestWaitCancelledBeforeItsResultIsDeliveredReturnsTheCauseOnThatWait; a mutant of Waiters.Add that drops the cause of an already-done context fails it."

