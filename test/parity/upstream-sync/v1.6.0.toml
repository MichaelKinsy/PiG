rationale = "[v1.5.2+22f456d7] f72f799a4 (#12103): the adapter no longer throws `Custom fetch is not supported by the Google Generative AI adapter` for a fetch other than globalThis.fetch; options.fetch reaches @google/genai through httpOptions.fetch, so every request of the adapter (generate, stream) goes through the caller's fetch. ai/google.go drops the guard at the top of googleProvider.Stream; providerHTTPClient(opts.Fetch) already carried the request. Pi always passes a fetch (globalThis.fetch by default) so the SDK adds no per-request dispatcher that disables undici's header and body timeouts: Go has no per-request dispatcher, the provider's own client keeps its idle timeouts when no Fetch is given (TestGoogleAdaptersWithoutFetchUseTheirOwnClientNotACallersFetch). `automaticContinuation: false` turns off the SDK's own continuation requests: Go has no SDK and never resumes a stream, so nothing changes. The commit also sets `automaticContinuation: false` in buildParams' config (google-generative-ai.ts:397), which this row did not account for until the oracle carried the commit: geminiRequest.parameters (ai/google.go) now carries the member, so an onPayload handler sees it as in Pi, and the request body does not (it is an option of the SDK): TestGoogleGenerativeAIPayloadMatchesPi, TestGoogleVertexPayloadMatchesPi and TestGoogleRequestBodyMatchesPi against the oracle that carries f72f799a4. [v1.5.2+fe8a6f5dc] fe8a6f5dc (#12371): pass model (not model.id) to supportsGoogleStrictToolSampling in buildParams. Ported in ai/google.go Stream; carried in automation/gen/pi-post-release-backports.mjs (fe8a6f5dc) as packageFile for the installed Pi oracle."

