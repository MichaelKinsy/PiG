rationale = "[v1.5.2+7cc21c24] 92e1db6ca: a reference exposes its object's named queries (ReferenceQuery per queries member), queryMember(member, name) and followInstance(moved), told when another instance is live. Ported (first part): chord/next/host/host_reference.go (ReferenceQuery, queryMember, followInstance). Second part (8270d9af6 (slice 14, second part)): a `denied` reference state keeps no value and its reads throw. Ported: the Pi cases that cover the source (admission, route admission, the denied dependency and reference source, example 69) run in the Go tests named in the evidence. [v1.5.2+8d30e630] 8d30e6306: Binding events (the host's events, the instance its members tap and the counter value of its binding to it, taken whenever it attaches to another instance shown live), subscribeEvents/forwardEvents/unforwardEvents, taps ended at release; Attachable.eventNode (remote replicas: remote_remote_object.go). host_reference.go; Reference.Events(name). [v1.5.2+90ed3e3b] 47e9d74f9: Binding gains #unseen (the members it has not seen since it joined a bound shared object, with their replicas' counts), bind -> #boundTo, joined(unseen), transfer(target) (a retry alone keeps the reference, its watches, calls and last values), #seen(member) (seen once the replica's count passes the recorded one), the member source told `unseen` when made; retry passes the binding. binding.unseen / boundTo / joined / transfer / seen. Target.call's order and generationOf are part B1's. 90ed3e3b1 changes only that order."

