rationale = "[v1.5.2+b513b64d] b513b64d8ac8 (#11264): PackageManagerOptions.commandOutput (`inherit` by default, `capture`) decides where the git and npm commands of an install, update or refresh write. Captured, runCommand pipes stdout and stderr, keeps the last 8000 UTF-16 code units, runs git and ssh with GIT_TERMINAL_PROMPT=0 and GIT_SSH_COMMAND defaulting to `ssh -o BatchMode=yes`, waits for the child with waitForChildProcess (the pipes close with the process, not with a background script that holds them), and fails with `<command> <args> failed with code N:` plus the tail, plus a credentials hint when a git failure reads as a refused prompt. installMissing wraps each install in withProgress, so `Installing <source>...` reaches the progress callback. PiG has no DefaultPackageManager class: the counterpart is internal/packagemanager (CommandOutput and process_capture.go over childwait.Pipes, threaded through manager, git, temporary, resolve and the update operations), and the tail counts UTF-16 code units as String.slice does (internal/jsstring). The hint names `pig install`, the product name (D2). The commit's own four tests run on the Go side as the captured-output tests."

