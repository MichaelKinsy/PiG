rationale = "[v1.5.2+75ca6e7d] be2744d95 (#12047): Kitty frees image data without placements on ED 2, so a full redraw that deleted placements and then cleared the screen broke placement-only reuse; with uploaded Kitty images the redraw now deletes the placements and skips the screen clear. TuiAltScreen.doRender does the same, and Pi's test is ported. Oracle-vs-next gap: the vendored alt-screen fixture is Pi 1.5.2, which predates #12047 and still clears the screen with ESC[2J, so checkAltScreenOracleIn (alt_screen_oracle_test.go) ends the byte comparison of a Kitty scenario at the first step that differs only by that clear, and skips the later Kitty scenarios, whose image registry no longer matches the fixture's; recordings for the term corpus still replay every scenario. The comparison returns in full when the oracle pin passes #12047. [v1.5.2+b7bb7ca9] b7bb7ca905b8: scrollBy, scrollToTop, scrollToBottom, scrollToPrompt, handleWheel, autoScrollSelection and the scrollbar drag callback of renderLayoutFrame request a view-only frame; PiG has the same seven sites (TuiAltScreen.ScrollBy, ScrollToTop, ScrollToBottom, scrollToPrompt, routeWheel, autoScrollSelection, requestRenderFromLayout). [v1.5.2+release-0.8.0] be2744d95 (#12047): Kitty frees image data without placements on ED 2, so a full redraw that deleted placements and then cleared the screen broke placement-only reuse; with uploaded Kitty images the redraw now deletes the placements and skips the screen clear. TuiAltScreen.doRender does the same, and Pi's test is ported. Oracle-vs-next gap: the vendored alt-screen fixture is Pi 1.5.2, which predates #12047 and still clears the screen with ESC[2J, so checkAltScreenOracleIn (alt_screen_oracle_test.go) ends the byte comparison of a Kitty scenario at the first step that differs only by that clear, and skips the later Kitty scenarios, whose image registry no longer matches the fixture's; recordings for the term corpus still replay every scenario. The comparison returns in full when the oracle pin passes #12047."

