evidence = ["test:coding/extension/factoryload/events_handler_errors_upstream_test.go#TestPiEventsReportsAThrowingHandlerToTheExtensionErrorListenerInsteadOfStderr", "test:test/extension-conformance/events_handler_errors_test.go#TestConformance_PiEventsHandlerErrorIsAnExtensionError", "test:test/extension-conformance/events_handler_errors_test.go#TestConformance_PiEventsFusedGoHandlerErrorIsAnExtensionError", "test:test/extension-conformance/events_handler_errors_test.go#TestConformance_PiEventsEveryFailingListenerOfOneConnectionIsReportedInOrderBeforeTheEmitReturns", "test:test/extension-conformance/events_handler_errors_test.go#TestConformance_PiEventsNodeAsyncHandlerRejectionIsReportedAfterTheEmitReturned", "test:coding/cli/docs_hero_pages_test.go#TestDocsEventBusPage", "scenario:test/parity/scenarios/extensions-runtime/111-events-handler-error.toml", "scenario:test/parity/scenarios/rpc/90-rpc-events-handler-error.toml"]
rationale = "[v1.5.2+18e99051] 18e99051be24 (#12233, issue #11264): createExtensionAPI's `events.on` wraps the extension's handler, awaits it and sends a throw to `runtime.reportError` with the extension's path, event `events:<channel>`, the message and the stack, and createExtensionRuntime installs a no-op `reportError` until a runner exists. The bus kept its own `console.error` (event-bus.ts) for subscribers that do not go through pi.events. PiG's counterparts: the Go in-process API wraps the handler in coding/extension/factoryload/api.go (a panic is the throw; the stack is the panicking goroutine's, after the message line) and reports through ExtensionRuntime.ReportRuntimeError (coding/extension/provider_runtime.go), which drops the error while no runner has set the action. A subprocess extension's handler runs in its own process: a native SDK's (Go, Python, Rust, Lisp) runs inside the host's per-listener events.dispatch request, so its failure is that response's error and the host reports it (coding/extension/host/subprocess/event_bus.go reportEventHandlerError, replacing the host's stderr line, which stays only for a failed dispatch request itself); the Node runtime wraps the handler as Pi's loader does and sends the new `report_error` notification (NotifyReportError), because one routed request holds several listeners and an awaited rejection comes after the dispatch response. PiG had the fault by design in every host: the bus's line `Event handler error (<channel>)` on the host's stderr over the TUI, since 0.7.0 (the first tag that holds the line). The fix is in the same change for every SDK and realm. Changed expectation: TestDocsEventBusPage (coding/cli/docs_hero_pages_test.go) wanted the text `Event handler error (geo:locate)` on pig's stderr for a failing listener in `--mode rpc` and none without one; it now wants that text on stderr in no row and, for the failing listener only, one `extension_error` event (extension path ending in failing.mjs, event `events:geo:locate`, error `failing listener`, no stack) written before the answering listener's reply notification, which is what Pi writes with the commit (rpc-mode.ts line 355, `onError: (err) => output({ type: \"extension_error\", extensionPath, event, error })`; probed on the oracle with the commit: that event, ahead of the reply and the command response, and an empty stderr; the oracle without the commit printed the old text with the stack on stderr and no event). The docs page already tells the reader where the error goes (event-bus.md, rule `A listener fails`). TestConformance_PiEventsFusedGoHandlerErrorIsAnExtensionError adds the one SDK form (a Go extension fused in the Host's process) that the per-realm rows did not reach."

