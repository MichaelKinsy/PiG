evidence = ["test:coding/extension/factoryload/events_handler_errors_upstream_test.go#TestPiEventsDropsAnErrorFromAHandlerThatFailsAfterItsSessionWasDisposed", "test:coding/extension/factoryload/events_handler_errors_upstream_test.go#TestPiEventsReportsOnceTheRunnerExistsAndDropsBefore", "test:test/extension-conformance/events_handler_errors_test.go#TestConformance_PiEventsHandlerErrorAfterTheRunnerWentStaleIsDropped", "test:test/extension-conformance/events_handler_errors_test.go#TestConformance_PiEventsHandlerErrorBeforeTheRunnerExistsIsDropped", "test:coding/extension/host/subprocess/report_error_wire_test.go#TestReportErrorNotifyFromAReplacedGenerationIsDropped", "test:coding/extension/host/subprocess/view_rejection_runner_state_test.go#TestRejectedViewOnARunnerStaleAfterAFailedReloadIsStillReportedOnce", "scenario:test/parity/scenarios/extensions-runtime/112-events-late-failure-after-failed-reload.toml"]
rationale = "[v1.5.2+18e99051] 18e99051be24: the Runner constructor sets `runtime.reportError` to call `emitError()` unless `staleMessage` is set (a handler still running when its session is replaced must not report into the replacement's UI). PiG's counterpart is NewRunner (coding/extension/host/inproc/runner.go), which calls ExtensionRuntime.SetRuntimeErrorReporter(r.reportRuntimeError); the guard is Runner.IsStale, which InvalidateForReload, Invalidate and InvalidateKeepingRuntime all set (so a runner a failed reload left stale drops the report too, as Pi's does: its staleMessage is set right after session_shutdown). It is a second action beside D107's diagnostic reporter (SetErrorReporter, bound in BindCore, no stale guard): a rejected extension view keeps reaching the runner in every state (coding/extension/host/subprocess/view_rejection_runner_state_test.go). The subprocess host drops a report of a generation a reload replaced (reportExtensionError), as it drops a failed dispatch response."

