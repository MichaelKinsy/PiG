rationale = "[v1.5.2+06a20368] 06a20368a7 (#12370, fixes #12279): Editor.addToHistory only skipped a consecutive duplicate, so re-rendering a session branch (populateHistory on /tree, /fork, /clone, /resume) or re-submitting a recalled older prompt appended duplicates and pushed older entries past the 100-entry cap. addToHistory now removes any existing occurrence of trimmed from history before prepending it at index 0. Editor.AddToHistory in tui/editor.go does the same. [v1.5.2+9a7cfba4] 9a7cfba47 (#12312, issue #12309): Enter on an open autocomplete menu submitted the prompt whenever the completion's prefix started with \"/\", so a Tab menu for an absolute path (look at /tmp/x/fi) or a command argument (/open /tm) completed the text and sent the unfinished prompt. Enter now submits only from the command-name menu: the prefix starts with \"/\" and the text before the cursor, read before the completion is applied, is a slash command with no space (isInSlashCommandNameContext, which the Tab dispatcher shares). Editor.AutocompleteAccept and Editor.inSlashCommandNameContext are the Go counterparts, and Pi's three cases are ported."

