rationale = "[v1.5.2+b513b64d] b513b64d8ac8: main captures the package commands in interactive mode (`inherit` in every other mode), announces each install on stderr in dim text (`Installing <source>...`) until the TUI starts, and stops announcing just before InteractiveMode is built. PiG's counterpart is coding/cli package_run.go (packageRun, set in buildResources) with stopAnnouncing called in main.go before interactive.Run. The reload and session-replacement installs the commit relies on are PiG's own prerequisite: Pi's createAgentSessionServices reloads the resource loader on every replacement and session.reload serves /reload, so each install there; PiG's /reload and its replacements now run the same installer (fix/reload-installs-missing-packages, changelog fragment reload-installs-missing-packages). [v1.5.2+bacd45b9] bacd45b9c (#11973, #11264): createRuntime calls resolveModelScopeWithDiagnostics and appends the model scope warnings to the runtime's diagnostics, after the settings and extension diagnostics and before buildSessionOptions' diagnostics, where resolveModelScope printed each one with console.warn on every run of the factory (startup and each session replacement). main reports the initial runtime's diagnostics once, deduplicated: stderr in print, JSON and RPC modes and for --help and --list-models, chat warnings in interactive mode. coding/cli/main.go appends selected.ScopeWarnings to startupDiagnostics at the same place and no longer prints them; PiG's builder never printed on a replacement, so the count on new_session was already one, and what changes is the order, the deduplication of a repeated pattern and the interactive startup (a chat warning instead of a stderr line before the TUI). The vendored main.js and the oracle carry the change through automation/gen/pi-post-release-backports.mjs. [v1.5.2+c47ad043] c47ad0432bb8: main.ts takes the startup diagnostics through takeUnreportedDiagnostics and reportDiagnostics moves to modes/diagnostics-stderr.ts. coding/cli/main.go takes StartupDiagnostics through Runtime.TakeUnreportedDiagnostics for the interactive mode and the print / JSON / RPC startup reports, so whoever reports a diagnostic takes it. [v1.5.2+c8c456c8] c8c456c85c6e (#12234): the runtime's diagnostics end with modelFallbackMessage as a warning when created.session.model is set (one function, cliBuild.runtimeDiagnostics in coding/cli/cli_runtime_build.go, which the startup build, every replacement's build, the startup error exit, --help and --list-models all read), so the reporting of c47ad0432bb8 shows it in every mode at startup and after each replacement; the InteractiveMode option is passed only when the session has no model (noModelFallbackMessage in coding/cli/main.go). Both tests are `session.model` truthiness, which PiG's Session.Model() mirrors including the agent's placeholder model (agent/agent.go). That placeholder makes the branch `appMode !== \"interactive\" && !session.model` (the no-model exit) unreachable in Pi, and the option's `session.model ? undefined : modelFallbackMessage` always undefined: with no models Pi (measured on Pi main) pushes the login guidance as a warning in every mode, once (print and JSON before the missing-key error, RPC once at startup and not again after switch_session or fork), contrary to the commit message's 'unchanged'; PiG has no counterpart of the dead branch and mirrors the measured behavior. The fallback model rule is the shared findInitialModel (defaultModelPerProvider order; no default: the provider's first model in models.json order), measured for an OpenAI-compatible provider with a custom base URL, an OAuth provider without login, no default model, and keys of two built-in providers. Two existing PiG tests changed their expected values, re-derived from Pi after this commit and measured on the oracle carrying it: coding/cli TestSessionFactoryCarriesDiagnosticsAndModelFallbackToTheRuntime (session_replacement_bench_test.go) expected one runtime diagnostic (the startup warning) and now expects two, the startup warning then the warning \"Could not restore model a/b. Using c/d\" (Pi main.ts:917-918 pushes created.modelFallbackMessage into the diagnostics when created.session.model is set); the runtime keeps the message too. coding/cli TestHeadlessNoModelOutputMatchesPi (startup_diagnostics_order_test.go) expected an empty stderr without a prompt and only the \"No API key found for the selected model\" error with one, and now expects first \"Warning: No models available. Use /login to log into a provider via OAuth or API key. See:\" with the two docs paths (once, then the key error with a prompt): with no model the agent keeps its placeholder model, session.model is set, and main.ts:917-918 adds the guidance as a warning, which the reporting prints on stderr in print, JSON and RPC modes (the interactive option is passed only when session.model is unset, main.ts:1024). The literals in the test, not the oracle at run time, held the old values. Scenario cli-utils/22 now expects the `Warning: No models available.` line and its two documentation paths after the `Error: --provider requires --model` line, because Pi pushes the session option error (main.ts:508-513) and then the warning (main.ts:917-918) and its error exit writes both (main.ts:948, 995); scenario startup/19 changes no expected text, it only replaces the documentation root of those two paths (D2/D22). Five existing process tests (TestCLIProviderRequiresModelUpstream, TestStartupDiagnosticOrderMatchesPi, TestHelpListsExtensionFlagsAfterSettingsDiagnostics, TestListModelsEndsWithTheAvailabilityFailure, TestPrintModeGivesTheProviderIDOllamaNoBaseURLOfItsOwn) now expect the no-models warning where no model is available, after the error diagnostics and before the Hint line, `--help` and `--list-models` output (main.ts:917-918 appends it to the diagnostics that main.ts:948, 957, 985 and 995 write), each row probed on the Pi oracle carrying the commit with only the documentation root cut."

