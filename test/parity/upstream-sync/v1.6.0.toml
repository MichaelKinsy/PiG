rationale = "[v1.5.2+75ca6e7d] 3345c2925 (#12054): a loadout change dropped the pending restored tools when it deactivated any active tool, so an extension hiding its own loader tool at session_start lost the MCP tools tool_search had loaded. Session.restoredToolNames (set by applyTranscriptTools and refreshTools after a reload) holds the restored loadout, and SetActiveToolsByName drops the pending tools only when a tool of it is deactivated. Pi's two dropLoader tests are ported. [v1.5.2+e03dca7a] e03dca7a3843 (#12231) makes reload() restart the extensions (session_start with reason reload, MCP reporting, resource discovery) when bindExtensions() set `_extensionsBound`, in place of the check that a UI context, command actions, a shutdown handler or an error listener were set, which a host that called bindExtensions({}) never satisfied. PiG's counterpart is coding.Session: BindExtensions sets `extensionsBound` (before the runner check, as Pi sets the flag unconditionally) and Reload tests it, replacing ExtensionBindings.hasBindings, which is deleted. The faulty host shape is every SDK's AgentSession.BindExtensions (coding/cli/child_sessions.go binds with ExtensionBindings{}) and examples/headless; the print, JSON, RPC and interactive modes do not call Session.BindExtensions (print and RPC emit session_start themselves after Session.Reload, interactive only stores the abort handler) so they are unchanged. PiG had the fault in v0.7.0. The oracle carries the commit through the e03dca7a3843 block of automation/gen/pi-post-release-backports.mjs (pi-coding-agent/core/agent-session.js). [v1.5.2+ede360e4] ede360e4d (#12121, issue #12119): getLastAssistantText skips an assistant message without text whose turn did not end normally (`stopReason !== \"stop\" && !content.some((c) => c.type === \"text\" && c.text.trim())`: aborted, error, toolUse, length, or no stop reason), where it skipped only an aborted message with no content; a reply that ended with stop stays the last reply even without text. coding.Session.LastAssistantText is the one Go function (trim is internal/jsstring.Trim, String.prototype.trim); /copy and the copy key (internal/codingagent handleCopyCommand), RPC get_last_assistant_text (coding/cli/rpc_mode.go, which the evals harness reads), the slash command context of coding/session_ops.go and the child session's getLastAssistantText and state (coding/cli/child_session_ops.go, child_sessions.go) all call it. The Node runtime's vendored agent-session.js and the parity oracle carry the commit through the backport block ede360e4d of automation/gen/pi-post-release-backports.mjs. [v1.5.2+release-0.8.0] 3345c2925 (#12054): a loadout change dropped the pending restored tools when it deactivated any active tool, so an extension hiding its own loader tool at session_start lost the MCP tools tool_search had loaded. Session.restoredToolNames (set by applyTranscriptTools and refreshTools after a reload) holds the restored loadout, and SetActiveToolsByName drops the pending tools only when a tool of it is deactivated. Pi's two dropLoader tests are ported."

