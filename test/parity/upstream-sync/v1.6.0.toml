[[files]]
path = "packages/chord/src/node/http/upgrades.ts"
change = "modified"
disposition = "ported"
evidence = ["test:chord/nextnode/http/upgrades_test.go#TestTheLinksEndpointGivesOpenedWhatTerminatesThatLinkAtOnceTheOthersStayOpen", "test:chord/nextnode/http/upgrades_test.go#TestTheLinksEndpointRunsWhatOpenedReturnedWhenItEndedTheLinkBeforeReturning", "test:chord/nextnode/http/upgrades_test.go#TestTheLinksEndpointsCloseAfterThePeerClosedTheLinkDoesNothingAndClosedRanOnce", "test:chord/nextnode/http/upgrades_test.go#TestTheLinksEndpointsCloseRacingThePeersCloseRunsClosedOnce"]
rationale = "[v1.5.2+5f89cc0a] 5f89cc0a7: link() keeps the upgraded record before accepting and gives opened `() => end(upgraded)`: the socket is terminated (no close handshake; the peer sees 1006) and the link sealed, as a revocation does; the link's other links stay; a second call, or one after the link is gone, does nothing. Upgrades.Link does the same with end(connection). Forced Go difference: Node emits a terminated socket's close on a later turn, so what the hook returns is always attached in time; a Go goroutine can emit it before the hook returned, so the close listener is attached before the hook runs and takes the hook's function when it is there, and the function runs after the hook returned when the close came first (once either way). Any goroutine may call close."

