rationale = "[v1.5.2+bb1a2b35] bb1a2b3542b5: SESSION_WEBSOCKET_MAX_AGE_MS is 45 minutes instead of 55 (codexWebSocketMaxAge in ai/openai_codex_websocket.go; the existing age test of TestCodexWebSocketUpstream now ages the cached socket by 46 minutes and fails with the old 55). The commit also relies on websocketStarted, which Pi sets at the first event the mapper yields, a leading codex.rate_limits event included: PiG skipped leading rate-limit frames and decided as if nothing had started, so it reconnected inside the provider for the connection limit and retried or fell back to SSE after a read error. startCodexWebSocketAttempt now has the one flag, set where Pi sets it and read where Pi reads it, and a started stream ends in an error message that the caller's retry handles. Changed expectation of an existing test: ai/provider_stream_event_order_test.go, the retry test no longer sends the leading `codex.rate_limits` event before the connection limit (the event moved out of it): after Pi bb1a2b3542b5 a connection limit that follows the leading rate limits ends the message in an error, because the event starts the WebSocket output (openai-codex-responses.ts:321-336, startWebSocketOutputOnFirstEvent) and the caller's retry opens the next connection; the new test TestCodexWebSocketLimitAfterLeadingRateLimitsEndsTheMessage holds that case (Pi's packages/ai/test/openai-codex-stream.test.ts, `retries a connection lifetime limit after $name on a fresh websocket`). [v1.5.2+edfe6b2e] edfe6b2ef322 (#12273): Codex now sends the system prompt as the leading developer input item through convertResponsesMessages and omits top-level instructions from the request body and wire struct. ai/openai_responses.go removes respRequest.Instructions and the Codex instructions builder, and passes convertAnchored without the includeSystemPrompt gate. [v1.5.2+fcc33744] fcc33744b072 (#12269): enables configuration_update effort items with fixed reasoning.effort medium on openai-codex-responses (including off -> none in StreamSimple and providerThinkingLevel on both SSE and WebSocket outputs), and forwards maxTokens as max_output_tokens (at least 16) unless compat.supportsMaxOutputTokens is false."

