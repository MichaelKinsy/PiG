rationale = "[v1.5.2+03de604b] 03de604b8: getDroppedReasoning and maybeShowThinkingDropNotice now report both Anthropic thinking_dropped and OpenAI reasoning removals with their deduplicated reasons, comparing against the previous response of the same diagnostic kind. Ported in internal/codingagent/interactive.go, interactive_events.go, and interactive_transcript.go. [v1.5.2+31b407dc] 31b407dc63 (#11889): interactive-mode.ts calls killTrackedDetachedChildren() right before process.exit on normal and signal quits and listens for SIGHUP on win32. PiG's ordinary interactive /quit and Ctrl+D path already cancels and joins user bash tasks in InteractiveMode.Stop; exitAtDrainedQuit (coding/cli/interactive_build.go) skipped Stop and now calls tools.KillTrackedDetachedChildren() after session.Dispose(), stopStartupExtensions(), and host.TerminateProcesses(), right before exitProcess(0). [v1.5.2+63dec262] 63dec2621 (#12237): the resume command printed on exit follows `To resume this session:` on its own line, so a triple-click selects it. PiG's counterpart is InteractiveMode.printResumeHint, which writes the label, a newline, the command and a newline under the same TTY and persistence gates as before. [v1.5.2+7c05885b] 7c05885bc: the crash exit and the two quit exits flush stdout before process.exit(). pig's exits write the stop sequence and the resume hint synchronously; the existing quit tests hold the terminal's bytes after the stop sequence (the resume hint and the exit sequences, nothing else). [v1.5.2+c47ad043] c47ad0432bb8: showRuntimeDiagnostics, shared by init and the setRebindSession callback, which shows the replacement's new diagnostics in the chat after the rebind and before the replacing command's own result. Ported as InteractiveMode.showRuntimeDiagnostics and rebindFromRuntime. [v1.5.2+e4f50d76] e4f50d76 (#12283): Pi wires ui.setSuspendSignalHandler(() => this.handleCtrlZ()) in init and switchTuiMode so an external kill -TSTP resets the terminal before stopping. PiG does not reset the terminal before an external stop (D661, awaiting owner approval); instead InteractiveMode.installContinueHandler runs before startTerminal and re-arms/redraws the terminal on foreground SIGCONT after fg (preserving screen in fullscreen, balancing Kitty keyboard pushes on frontend surfaces, covering fullscreen, regular, dash, startup terminal-arm window, and shells that restore raw termios on fg). Every cited test fails if the port is reverted; regression guards (TestCtrlZKeyKeepsItsModeSequences, TestExternalSIGTSTPKeepsARunGoing, TestSIGTSTPWhileAnExternalEditorOwnsTheTerminal) are kept in external_sigtstp_pty_linux_test.go and not cited here as port evidence."

