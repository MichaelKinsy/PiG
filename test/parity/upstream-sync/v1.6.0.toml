rationale = "[v1.5.2+7c05885b] 7c05885bc (#12133): flushStdout waits for the writes queued in process.stdout before process.exit(), which drops them. pig has no buffered stdout writer on any exit path: every terminal write is a direct synchronous write to the underlying *os.File (tui/terminal.go:823-834, 862-868, writeString calling os.File.WriteString; no bufio.Writer on stdout). Most CLI exits go through releaseForExit (coding/cli/profiling.go:29-57); the five direct os.Exit paths outside it are also safe because none leaves buffered stdout unwritten: interactive_crash.go:202 (uncaughtOffLoop: calls tui.RestoreTerminalOnExit and tui.RestoreTerminalFromSignal at 194-195, writes crash report to os.Stderr directly at 197), interactive_input.go:132 (emergencyTerminalExit: calls tui.RestoreTerminalOnExit synchronously at 131), interactive_tui.go:617 (exitAtSignal: calls tui.RestoreTerminalOnExit and tui.RestoreTerminalFromSignal synchronously at 605-606), coding/cli/guard.go:35 (guardBinaryIdentity: writes refusal to os.Stderr at 24 before any mode or TUI starts), and coding/cli/login_signals_unix.go:18 / login_signals_windows.go:13 (dieBySignal: called from exitProcessBySignal after releaseForExit or on a second signal in terminal auth commands, which write directly via fmt.Print* on os.Stdout with no TUI or buffered writer). A pipe on stdout never runs the TUI (probe of lane PiExitSignalCheck: 0 of 200 interactive exits lost their final bytes). Nothing in Go corresponds to the one-second timeout or the EPIPE listener."

