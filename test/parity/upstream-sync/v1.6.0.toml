change = "modified"
disposition = "ported"
evidence = ["test:ai/assistant_retry_socket_codes_upstream_test.go#TestIsRetryableAssistantErrorNodeSocketErrorCodes", "test:ai/assistant_retry_socket_codes_upstream_test.go#TestIsRetryableAssistantErrorOtherSocketCodesStayNonRetryable", "test:ai/assistant_retry_socket_codes_upstream_test.go#TestSocketCodeTransportErrorsAreRetriedInTheirNodeForm", "test:ai/assistant_retry_classifier_oracle_test.go#TestIsRetryableAssistantErrorMatchesPiOracle", "test:ai/assistant_retry_test.go#TestConnectionResetTextIsRetryable", "test:ai/providers/bedrock/bedrock_socket_code_retry_test.go#TestBedrockBareSocketCodeIsRetriedByTheAssistantRetryLoop", "test:ai/providers/bedrock/bedrock_error_metadata_upstream_test.go#TestBedrockRefusedConnectIsNodesErrorLikePi", "test:coding/session_socket_code_retry_test.go#TestSessionRetriesABareSocketCodeOnce", "test:coding/session_socket_code_retry_test.go#TestSessionSurfacesABareSocketCodeAfterTheConfiguredRetries", "test:coding/session_socket_code_retry_test.go#TestSessionDoesNotRetryASocketCodeInsideAnIdentifier", "test:durable/core/turn/classify_carried_test.go#TestNodeSocketErrorCodesAreRetryable", "test:extensions/sdk/pi_ai_helpers_test.go#TestNodeSocketErrorCodesAreRetryable", "test:ai/assistant_retry_websocket_limit_upstream_test.go#TestIsRetryableAssistantErrorCodexWebSocketConnectionLimit", "test:durable/core/turn/classify_carried_test.go#TestCodexWebSocketConnectionLimitIsRetryable", "test:extensions/sdk/pi_ai_helpers_test.go#TestCodexWebSocketConnectionLimitIsRetryable", "test:coding/session_websocket_limit_retry_upstream_test.go#TestIssue12124WebSocketConnectionLifetimeRetry", "test:ai/assistant_retry_test.go#TestIsRetryableAssistantErrorClassification", "test:ai/provider_closed_connection_test.go#TestProviderStreamErrorEventReadingConnectionClosedIsRetryable", "test:ai/provider_closed_connection_test.go#TestRetryAssistantCallOverAGatewayClosedConnection", "test:coding/session_connection_closed_retry_test.go#TestSessionRetriesAGatewayClosedConnectionOnce", "test:coding/session_connection_closed_retry_test.go#TestSessionSurfacesAGatewayClosedConnectionAfterTheConfiguredRetries", "test:durable/core/turn/classify_carried_test.go#TestConnectionClosedIsRetryable", "test:extensions/sdk/pi_ai_helpers_test.go#TestConnectionClosedIsRetryable"]
rationale = "[v1.5.2+4699b5b2] 4699b5b26 (#12136, fixes #12128) adds two entries to the transport section of RETRYABLE_PROVIDER_ERROR_PATTERN, after \"getaddrinfo\": (?<![a-z0-9_])(?:ECONNRESET|ECONNABORTED|ECONNREFUSED|ETIMEDOUT|EPIPE)(?![a-z0-9_]) and \"connection reset by peer\". A provider error whose text is only a Node socket error code (\"read ECONNRESET\", \"write EPIPE\", \"connect ETIMEDOUT 140.82.113.3:443\"; the confirmed case is Bedrock through the AWS SDK's Node HTTP handler) ended the turn with no retry. The match is over the error text only, case-insensitive, with a guard on both sides so a code inside a longer identifier does not match; a guarded code anywhere in the text matches (Pi's function answers true for a 400 body that holds the bare word, and the oracle test pins that). EHOSTUNREACH, ENETUNREACH and UND_ERR_SOCKET stay not retried. retryableProviderErrorPattern (ai/assistant_retry.go) takes both entries in Pi's position, the guard spelled without lookaround as for the status codes, and the copies of the list carry them: durable/core/turn/patterns.go (regenerated by oracle/gen_patterns.mjs from Pi 4699b5b26), extensions/sdk/pi_ai_models.go, and the Python, Rust and Lisp SDKs, each with Pi's nine cases in its own test; the vendored pi-ai/utils/retry.js and the oracle carry the commit through the backport block 4699b5b26. Go reports the same transport events as typed errors and already names them with Node's code before the classifier reads the text (internal/nodeerrno: the POSIX errno, and on Windows the WSAE* and system error numbers libuv maps to the code), so no typed match is added: TestSocketCodeTransportErrorsAreRetriedInTheirNodeForm has one row per code and per platform errno. Two Go assertions that held Pi's earlier answer are inverted with it: Go's text \"connection reset by peer\" and Bedrock's bare \"connect ECONNREFUSED <address>\" are now retried. No retry count, delay or cap changes. [v1.5.2+bb1a2b35] bb1a2b3542b5 (#12229, closes #12124) adds one entry to the WebSocket section of RETRYABLE_PROVIDER_ERROR_PATTERN, after \"websocket.?error\": websocket.?connection.?limit.?reached, which matches the Codex error code websocket_connection_limit_reached and the text \"Responses websocket connection limit reached (60 minutes)\" (case-insensitive, over the error text, after the non-retryable quota patterns). The turn that hit the limit after output had started ended with stopReason error and no agent-level retry. PiG's copies of the list are ai/assistant_retry.go, extensions/sdk/pi_ai_models.go (hand kept) and the Python, Rust and Lisp SDKs (hand kept), and durable/core/turn/patterns.go (generated from the vendored retry.js by make generate); each has the entry in Pi's position, and the SDK vectors (test/parity/sdk-vectors/pi-ai/isRetryableAssistantError.json, produced by Pi's own function with the backport) hold the rows for every copy. [v1.5.2+release-0.8.0] 9b88b94e2 (#12093, #12064) adds connection.?closed to RETRYABLE_PROVIDER_ERROR_PATTERN: a gateway that ends a stream with the Anthropic-style event {\"type\":\"error\",\"error\":{\"type\":\"api_error\",\"message\":\"Connection closed.\"}} stopped the turn with no retry, and the agent proxy's \"Connection closed by proxy server before the response completed\" now matches too; the quota and limit pattern is still checked first. retryableProviderErrorPattern (ai/assistant_retry.go) takes the line, and the copies of the classifier carry it as well: durable/core/turn/patterns.go (regenerated by oracle/gen_patterns.mjs from Pi main, which also adds the earlier cut-short entry the file lacked) and the Go, Python, Rust and Lisp SDKs' isRetryableAssistantError. The Node runtime's pi-ai/utils/retry.js (and the oracle Pi) carry it through the backport entry in automation/gen/pi-post-release-backports.mjs, which TestIsRetryableAssistantErrorMatchesPiOracle compares against. Pi's case is ported with its payload; the providers' texts for a gateway error event (anthropic JSON, openai-completions \"Connection closed.\", openai-responses \"Error Code api_error: Connection closed.\") and for a socket the server closes (\"Connection error.: other side closed (UND_ERR_SOCKET)\", \"terminated: ...\", \"fetch failed\") are pinned per API kind, with a session run that retries once and answers, one that surfaces the error after the configured retries, and an AbortRetry during the backoff."

