change = "modified"
disposition = "ported"
evidence = ["test:chord/next/surfaces/surfaces_client_test.go#TestASlowBaseAnswerAfterTheNextLinkOpenedThatLinkEndsBeforeOutdatedIsCalled", "test:chord/next/surfaces/surfaces_client_test.go#TestAsksTheServersBaseAtAReconnectAnotherOneStopsTheLoopThenCallsOutdated", "test:chord/nextnode/surfaces/client_manifest_test.go#TestClientVendoredFilesAreExactlyTheManifests", "test:chord/nextnode/plugins/plugins_node_test.go#TestNodeVendoredFilesAreExactlyTheManifests", "test:chord/next/surfaces/surfaces_client_test.go#TestAStaticClientAppliesNoNewSetAndIsNeverOutdatedByOne", "test:chord/next/surfaces/surfaces_client_test.go#TestAStaticClientReconnectsWithoutAskingTheServersBase", "test:chord/next/surfaces/surfaces_client_test.go#TestPartLimitsTakesPartsFromTheServerWithinTheLimitsItWasGivenAndNonePastThem", "test:chord/next/surfaces/surfaces_client_test.go#TestStartsWithItsInitialScriptsWhileTheServerDoesNotAnswer", "test:chord/next/surfaces/surfaces_client_test.go#TestAppliesTheSetTheServerShowsWhenItStartsFollowingThoughNoFrameBroughtIt"]
rationale = "[v1.5.2+21e4cb80] 21e4cb80d: connect() keeps the loop it made and its canRetry, on another base, calls loop.stop() and THEN options.outdated() (an attempt made meanwhile ends first; the state at outdated is `waiting`). chord/next/surfaces/surfaces_client.go: connect makes the loop before its first event (newConnection, start: a Go question runs on a goroutine and may not read a loop variable still being assigned) and calls stopNow, which returns once the stop has run, then Outdated. The doc comments say `at each reconnect, beside the next attempt`. Vendored byte for byte in both chord trees. [v1.5.2+22fe46c7] 22fe46c7b: ClientOptions.follow (default true; false for a static client built offline and served elsewhere): such a client neither follows the scripts object, nor applies a set, nor asks the server's base before a reconnect, so it is never outdated. surfaces_client.go has ClientOptions.Follow as a *bool (nil: follow) and StartClient does the same. The browser runs Pi's client.ts vendored byte-for-byte (see web/page.ts). [v1.5.2+34fb59f6] 34fb59f67: ClientOptions gains `limits?: PartLimits` (the limits per part of what arrives from the server: `part` on the wire and `decoded` after inflating, in bytes; default an untrusted link's, 16 MiB on the wire and 64 MiB decoded, from link.linkLimits), and connect() hands host.connect `{ principal, limits }` when it is given and `{ principal }` when it is not (undefined and {} are the same to the host). Go: chord/next/surfaces/surfaces_client.go ClientOptions.Limits *link.PartLimits (nil: Pi's undefined) read by connect into host.LinkOptions.Limits, which the host already takes; the part past the limit fails as every part past a link's limit does (the host's, unchanged). No wire change, no new default, no async change. The file is also vendored byte for byte in chord/nextnode/surfaces/client/pi and chord/nextnode/plugins/node/pi (manifest `carried` += 34fb59f67; both copies are Pi's blob at 34fb59f67). [v1.5.2+3c771bd1] 3c771bd18: startClient no longer awaits its watch of the scripts object (which waits for the server): it follows in the background and reports a failure as update_failed, so a client starts, and a page renders, offline; and the set shown when following begins is applied too (a watch's current value is no frame, so a set published while the client started was missed). surfaces_client.go StartClient runs follow on an owned goroutine that Stop ends and joins (Pi's `void updates.follow(...).catch(...)`), and follow takes the watch's Value as the newest set before the watch starts (`take`, shared with the listener). Both tests are red before: StartClient did not return offline, and the set shown at the start of following was not applied (the code's comment that the first set was applied held for a frame, not for the watch's current value). The browser runs Pi's client.ts vendored byte-for-byte (derived tree, manifest `carried`)."

