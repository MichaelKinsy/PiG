rationale = "[v1.5.2+7cc21c24] 92e1db6ca: HostError `query_failed` carries `query` (the table's name for self.query, the named query's label for liveQuery, count and list) in place of `table`; a closing host calls object.unbindSets() after tearing every object down. Ported (first part): chord/next/host/host_error.go and host_host.go (query_failed carries Query; a closing host unbinds the sets). Second part (8270d9af6 (slice 14, second part)): `RouteOptions.admit` reaches the route and `deleteHostData` takes `options.plugin` (ported, host_host_data_test.go). Ported: the Pi cases that cover the source (admission, route admission, the denied dependency and reference source, example 69) run in the Go tests named in the evidence. [v1.5.2+8d30e630] 8d30e6306: HostOptions callWindow (10,000) and eventWindow (32), the host's HostEvents, the event_mapping_failed HostError, bindings made with the host's events. host_host.go, host_error.go; the link side of the windows is the remote layer's. [v1.5.2+90ed3e3b] 47e9d74f9: bind places a remote reference through #bindRemote: the object this host holds for its sharing key (#sharingKey: type, version, fingerprint, params key, placed address, the caller's principal JSON and incarnation, each part escaped) is joined with no message (a join to a hold whose route failed to resolve is a new request, path.requested; a joining traced getter links to the open hold span), else a new object is stored and bound BEFORE it attaches; self.get references, a suspended path and a key whose object is failed waiting over a link hold on their own. chordHost.bindRemote / sharingKey. Forced difference: Pi's `#shared` is a WeakMap by path; Go has none, so the table is a field of its path (path.shared); entries are taken out by their object in both (the PiG-own table case: no entry and no holder after make / release rounds). [v1.5.2+f57cd948] f57cd9484: `routeLink(link, options, context, opened?)`: the optional `opened` callback is told the peer's incarnation once its `hello` arrived and reaches the link as its `opened` option. Ported: chord/next/host/host_route.go (ResolvedLink.Opened, handed to the link as its `opened` option); the Pi case of test/host/route.test.ts runs in host_route_opened_test.go (122555b4b..b08224f6c, 9a42105d3)."

