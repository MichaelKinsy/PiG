rationale = "[v1.5.2+release-0.8.0] 406e719a6bff (#12049): OpenAI strict mode rejects a schema node without a type (items: {}, Type.Unknown, Type.Any, a bare const), so makeJsonSchemaNodeStrict throws \"schemas without a type are unsupported\" for a node with no type, anyOf or enum: a \"prefer\" tool is then sent non-strict with its authored schema and a \"require\" tool fails locally; a node with only an enum stays strict. makeJSONSchemaNodeStrict (ai/constrained_sampling.go) does the same for every API that resolves strict sampling; Pi's three rows and the enum case are ported, and a request test reads the serialized tool of the openai-completions, openai-responses, azure, codex, anthropic, mistral, google, vertex and bedrock requests. The pi-ai constrained-sampling.js entry of automation/gen/pi-post-release-backports.mjs carries the change into the vendored pi-dist and the parity oracle, and TestConstrainedSamplingMatchesPi runs that oracle file (the source mirror stays the pinned release)."

