rationale = "[v1.5.2+473515f9] 473515f9c adds the park shape check and wrapComposite: wrappers never park, a composite's park its base did not return is invalid_park. durable/harness/parks.go keeps the park a pointer (ToolExecutionResult.Park, because a Go tool returns one struct where Pi returns a result or a park object) so identity tells a base's park from a wrapper's; the run's park set travels on the run's api and, for a wrapper that hands its base another api, on the call's context. Go forced shapes here, none observable against Pi: ToolExecutionResult.Park is a pointer on the one result struct because a Go return holds one type, where Pi tells a park from a result by its `sleep` or `wait` key; the park set rides on the api or the context because Go has no spread-and-pass api object or own symbol property; and a Park holding neither Sleep nor Wait, which Pi's types forbid and which Pi meets as a TypeError at `(sleep ?? wait)!.checkpoint`, is an invalid_park result with the text `a park has either sleep or wait, but this one has neither`, a text Pi has no counterpart for (the `both` and result-field texts are Pi's, verbatim). [v1.5.2+49fe0a23] 473515f9c adds the park shape check and wrapComposite: wrappers never park, a composite's park its base did not return is invalid_park. durable/harness/parks.go keeps the park a pointer (ToolExecutionResult.Park, because a Go tool returns one struct where Pi returns a result or a park object) so identity tells a base's park from a wrapper's; the run's park set travels on the run's api and, for a wrapper that hands its base another api, on the call's context. Go forced shapes here, none observable against Pi: ToolExecutionResult.Park is a pointer on the one result struct because a Go return holds one type, where Pi tells a park from a result by its `sleep` or `wait` key; the park set rides on the api or the context because Go has no spread-and-pass api object or own symbol property; and a Park holding neither Sleep nor Wai