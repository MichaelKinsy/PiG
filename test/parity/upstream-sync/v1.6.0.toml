lerSetWhileStoppedAddsNoListener", "test:tui/continue_signal_unix_test.go#TestContinueSignalStartStopDoesNotLeakGoroutines"]
rationale = "[v1.5.2+3107a58d] 3107a58d (#12339): Pi ties the SIGTSTP listener strictly to ownsTerminal (false before first start, true before beforeTerminalStart/terminal.start, cleared last in stop after terminal restore, no off/on removal gap while still needed, and dropping a second SIGTSTP mid-restore). Under D661 (awaiting owner approval), PiG applies the ownsTerminal lifecycle to tui.SetContinueSignalHandler on SIGCONT across ProcessTerminal.enterRawMode (beginning before MakeRaw and ending after RestoreCooked), TuiAltScreen.BeforeTerminalStart/Start/StopWithOptions, TuiMainScreen, and TuiSurface (including Suspend/Resume), excluding non-process and writer-backed renderers; a second SIGTSTP mid-restore is not dropped (D661 item 3), and public TUI.setSuspendSignalHandler remains absent from tui.TUI, all native SDKs, extensions/sdk-ts/pi-pin.d.ts, vendored pi-dist/pi-tui/tui.js, and Node factoryTui. [v1.5.2+787005a4] 787005a40 (#12109): while the overlays are composited back to front, hideImagesUnderOverlay removes from the frame's lines every image placement the overlay overlaps by row and by column (from getMaxKittyImageRows above the viewport on), so the renderers' change detection deletes the image and draws it again once the overlay no longer covers it; an image beside the overlay stays, and the overlay still skips the row that holds such an image's sequence. composeOverlaySnapshotWithStats (tui/overlay_compositor.go) calls the ported hideImagesUnderOverlay before each overlay. The frame oracles agree because automation/gen/pi-post-release-backports.mjs applies the same change to pi-tui's compiled tui.js and terminal-image.js; both fixtures are re-recorded from that oracle. [v1.5.2+b7bb7ca9] b7bb7ca905b8: requestViewRender (a frame that reuses the previous component output, contentChanged set by requestRender, immediate renders and focus changes), Container.render returning its cached array, and the mouse dispatch by cached child heights; PiG: tuiBase.requestViewRender (unexported, the Go counterpart of the protected method), requestRenderLocked, the Container cache and routeWheel. [v1.5.2+e4f50d76] e4f50d76 (#12283, issue #12272): Pi adds public TUI.setSuspendSignalHandler(handler) registering a SIGTSTP listener while the TUI runs. Under Go 1.27, sigdisable in runtime/signal_unix.go never restores SIG_DFL for SIGTSTP once signal.Notify has been called, so PiG does not catch SIGTSTP and instead implements tui.SetContinueSignalHandler on SIGCONT tied to process-terminal ownership (D661, awaiting owner approval). Expected-absent copies of TUI.setSuspendSignalHandler under D661: tui/renderer.go (TUI), extensions/sdk/tui_alt_screen.go, extensions/sdk-py/pig_sdk/tui_alt_screen.py, extensions/sdk-rs/src/tui_alt_screen.rs, extensions/sdk-lisp/src/tui-alt-screen.lisp, extensions/sdk-ts/pi-pin.d.ts, coding/extension/host/subprocess/runtime-node/shims/pi-dist/pi-tui/tui.js, and coding/extension/host/subprocess/runtime-node/runtime.mjs (factoryTui). Calling tui.setSuspendSignalHandler from a Node extension throws TypeError. None of those copies carry setSuspendSignalHandler on the tip (no drift against v1.5.2 pin; future pin bump past e4f50d76 will meet test-sdk-ts / vendor-pi-dist-drift / sdk-exports checks unless updated or recorded under D661)."

