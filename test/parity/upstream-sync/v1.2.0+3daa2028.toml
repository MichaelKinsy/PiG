rationale = "host.ts shrank to the worker-thread launcher and the CodemodeSandbox subclass of CodemodeSandboxBase. codemode/workerlauncher.go (launchWorker) is that launcher with the VM on its own goroutine in this process: a failing module load is the sandbox error `Failed to load QuickJS: <cause>`, and stop raises the interrupt flag, escalates to halting the instance and waits for the VM. Mutants that fail: renaming the load error prefix fails TestReportsAFailingWasmModuleAsASandboxError and TestCorruptWasmModuleIsASandboxError; not raising the interrupt flag fails TestExecuteReturnsOnlyAfterTheVMIsClosedForEveryTerminalKind; not waiting for the VM in stop fails it and TestCloseAbortsEveryRunningExecutionAndWaitsForTheirVMs. Designed out: the defaultWorkerUrl and workerUrl option (no worker file), the worker `error` and `exit` events (no worker thread; a VM that cannot start is `Failed to start the VM`), and the Node --watch message filter. Pi 3daa2028: workerLauncher stop requests shutdown without waiting for the VM to exit; the interrupt flag plus the halt guard bound exit to the 500 ms grace period; acquireWorker runs after the module load and is released on the VM goroutine's exit; onWorkerStarted receives the exited channel (codemode/workerlauncher.go)."

