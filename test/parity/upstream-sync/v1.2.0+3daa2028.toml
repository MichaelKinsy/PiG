rationale = "index.ts is a barrel. Go has none: the root export is split between package chord (json, state) and chord/host, with chord/context and chord/delta as the subpath exports. Exports mapped to Go: Cell is host.Cell (cell.go:274). AcceptOptions and LinkOptions are in connection.go (:27, :18). Context is context.Context and ContextKey is chordctx.Key[T]. Accepts, Adapter, bind, coverage, Description, Handle, local, method, opaque and remote are contract.go Accepts, Adapter, Bind, Coverage, Description, Handle, Local, Method, Opaque and Remote. AnyContract, LocalContract and RemoteContract all map to *host.Contract (contract.go:154). CellDecl, cell, DerivationDecl, derivation, ListenerDecl, listener, Resource, ResourceDecl, ResourceSpec, resource and Subscribable are declare.go CellDecl, DeclareCell, DerivationDecl, Derivation, ListenerDecl, Listener (and ListenerSelect for the selector form), Resource, ResourceDecl, ResourceSpec, DeclareResource and Subscribable. Draft is *delta.Object or *delta.Array (chord/delta/handles.go:15,19). ChordError, ChordErrorCode, forbidden, invalid and isChordError are errors.go ChordError, ChordErrorCode, Forbidden, Invalid and IsChordError. PrincipalMatch and Route are in host.go. createHost is CreateHost and returns *HostImpl, which is both Host and HostImpl (host.go:3, :231). defineFacet, Facet, FacetApi, FacetDefinition, FacetLoader, HostOptions, LoadOptions, PluginRef and RootOptions are in host.go. hostPrincipal is the HostPrincipal var (host.go:25). copyJson is CopyJSON, isJsonValue is IsJsonValue and JsonValue is chord.JsonValue. IpcChannel, Link, memoryLinkPair and WebSocketLike are in link.go, with ipcLink as NewIpcLink (:414) and webSocketLink as NewWebSocketLink (:475). Factory, Self and ServeOptions are in record.go. defineRegistry, Registry, RegistryTable and RegistryView are in registry.go. ReloadOptions and ReloadReport are in reload.go. The replicated-state types and replicatedState are chord/state.go (NewReplicatedState, AttachReplicatedStateSource). Ctx, GetOptions, HandleStatus, Principal, Readable, Shape and StateEvent are in types.go. acceptWebSockets, WebSocketAcceptOptions and WebSocketServerLike are in websocket.go, and Frame is wire.go:55. Exports with no Go form: JsonRepresentation (a compile-time mapped type), CopyJsonOptions (its only option, omitUndefinedProperties, has no counterpart without undefined), and BehaviorOf, InputOf and MembersOf (contract.go:3-4: static types; a Go behavior is a Behavior object and handles reach members by name). The removed 1.1.0 exports (defineService, createFacetHost, the remote-service helpers and the ./bundler loaders) have no Go symbol in chord/; the 1.1.0 runtime lives only in internal/chord for internal/experimental. Pi 018c87dd exports PackThreshold/inflateMessage and the WebSocketLink options; ported as PackThreshold, InflateMessage and WebSocketLinkOptions."

