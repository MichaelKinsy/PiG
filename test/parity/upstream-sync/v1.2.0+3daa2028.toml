[[files]]
path = "packages/coding-agent/src/extensions/codemode/tool.ts"
change = "modified"
disposition = "ported"
evidence = ["test:coding/extension/builtin/codemode/description_upstream_test.go#TestCodemodeDescriptionListsEverythingWithoutABudget", "test:coding/extension/builtin/codemode/description_namespace_test.go#TestCodemodeDescriptionDocumentsDescribeNamespaceAndAlwaysCarriesTheSearchGuidance", "test:coding/extension/builtin/codemode/reach_describe_test.go#TestDescribeOutputDescribesTheFieldsOfObjectFieldsOneLevelDeep", "test:coding/extension/builtin/codemode/reach_describe_test.go#TestScriptReachIsAllForDiscoveryGlobalsAndTheWordsOfTheSourceOtherwise", "test:coding/extension/builtin/codemode/options_override_test.go#TestExtensionOptionsOverrideTheCodemodeSettings", "test:coding/mcp_session_upstream_test.go#TestAgentSessionMCPExposesCodemodeOnlyMCPToolsThroughCodemodeAndHidesThemFromTheModel", "test:coding/mcp_session_upstream_test.go#TestAgentSessionMCPTellsScriptsWhatDirectlyExposedMCPToolsResolveTo"]
rationale = "1.0.4 to 1.1.0 (reviewed row carried): the description gains the multi-item output paragraph and names the lookup helpers with await (#10555); description_text.go carries both and the description tests assert them. 1.1.0 to 1.2.0: the description drops the Shared MCP Types section and the CallToolResult detection (coding/extension/builtin/codemode/tool.go has no MCP preamble; TestAgentSessionMCPExposesCodemodeOnlyMCPToolsThroughCodemodeAndHidesThemFromTheModel asserts the section is absent); describeOutput lists object fields one level deep (describeFields, TestDescribeOutputDescribesTheFieldsOfObjectFieldsOneLevelDeep); the tools.<name> line says a tool whose declaration returns an object also resolves with it on failure (description_text.go, asserted through descriptionIntro in description_namespace_test.go); the defaults come from SETTINGS_DEFAULTS.codemode (values unchanged, options_override_test.go); and the definition declares reachesTools (getScriptReach: every tool for a script that uses a discovery global, else the words of the source), which is tool.go scriptReach and TestScriptReachIsAllForDiscoveryGlobalsAndTheWordsOfTheSourceOtherwise. The exported isCodemodeTool is removed upstream; its Go counterpart, mcpext Options.IsCodemodeTool, is removed in 34c4d8e058 in favour of ToolInfo.ReachesTools. The resolve-to line of a directly exposed MCP tool now reads `{ content, structuredContent?: { hits }, isError? }`, which needed the mcp/tools.ts schema port (TestAgentSessionMCPTellsScriptsWhatDirectlyExposedMCPToolsResolveTo)."

