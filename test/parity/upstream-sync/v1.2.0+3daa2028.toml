evidence = ["test:coding/extension/host/inproc/upstream_dispatch_test.go#TestUpstreamRunnerBeforeAgentStart", "test:coding/extension/extension_event_test.go#TestBeforeAgentStartEventWireShape", "test:test/extension-conformance/before_agent_start_trigger_test.go#TestBeforeAgentStartTriggerAcrossSDKs", "test:coding/session_prompt_custom_run_upstream_test.go#TestUpstreamSessionPromptRunsStartedByACustomMessage"]
rationale = "1.0.4→1.1.0: no change. 1.1.0→1.2.0: emitBeforeAgentStart takes a BeforeAgentStartTrigger (messageType user with prompt/images, or custom with the starting message) and spreads it into each handler's event. coding/extension/host/inproc/runner.go EmitBeforeAgentStart keeps the (prompt, images, options) parameters and reads a custom trigger from the context (extension.WithCustomMessageTrigger, set by coding/session_preflight.go prepareRun), then builds the event with MessageType and Message; the Node, Python and Rust hosts receive the same wire event. TestUpstreamRunnerBeforeAgentStart ports the changed runner case, TestBeforeAgentStartTriggerAcrossSDKs checks the trigger in every SDK, and TestUpstreamSessionPromptRunsStartedByACustomMessage checks messageType [user, custom] end to end. The custom trigger path was ported early as D139 (Pi PR #10739), which 1.2.0 now contains."

