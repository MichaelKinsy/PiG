[[files]]
path = "packages/coding-agent/src/extensions/codemode/execute.ts"
change = "modified"
disposition = "ported"
evidence = ["test:coding/extension/builtin/codemode/format_output_test.go#TestFormatOutputSeparatesTextItemsAndGroupsConsoleLines", "test:coding/extension/builtin/codemode/format_output_test.go#TestJoinAdjacentTextStartsEachPartOnItsOwnLine", "test:coding/extension/builtin/codemode/execute_join_test.go#TestExecuteJoinsTheTextAndTheSavedImageLabel", "test:coding/extension/builtin/codemode/execute_join_test.go#TestExecuteJoinsTheScriptTextAndItsErrorIntoOneItem", "test:coding/extension/builtin/codemode/models_errors_test.go#TestModelsGlobalArgumentErrorsMatchPi", "test:coding/extension/builtin/codemode/join_adjacent_text_test.go#TestJoinAdjacentTextIsLinearInTheNumberOfItems", "test:coding/extension/builtin/codemode/join_adjacent_text_test.go#TestJoinAdjacentTextMatchesUpstreamOnMixedItems", "test:coding/extension/builtin/codemode/initial_update_test.go#TestExecuteSendsAnInitialUpdateBeforeTheFirstNestedCall", "test:coding/extension/builtin/codemode/run_test.go#TestNamespaceLookupUsesNamesAndAliasesNotTheSuffixAfterDoubleUnderscore", "test:coding/codemode_session_upstream_test.go#TestUpstreamCodemodeModels", "test:coding/codemode_session_upstream_test.go#TestUpstreamCodemodeOptionsAndStore", "test:coding/mcp_session_upstream_test.go#TestAgentSessionMCPWaitsForServersWhoseScriptIdentifiersDifferFromTheirNames", "test:coding/extension/builtin/codemode/worker_admission_test.go#TestCodemodeWorkerAdmissionBoundsSurvivingWorkers", "test:coding/extension/builtin/codemode/worker_admission_test.go#TestCodemodeWorkerHoldsItsSlotWhileRunning", "test:coding/extension/builtin/codemode/worker_admission_test.go#TestCodemodeWorkerAdmissionAdmitsOnlyTheLimitFromABurst"]
rationale = "1.0.4 to 1.1.0 (reviewed row carried): context.images is validated, text items get a ==> text N/M <== line when there is more than one, console lines go into one console_output block, and adjacent text items are joined before truncation and again after images are saved; the format_output, execute_join and models_errors tests pin each (the join before truncation is not observable). 1.1.0 to 1.2.0: (1) the isRecord helper is replaced by explicit object/array checks and a ScriptValue type in checkClassifierContext, checkImagesContext and runModelCall. The accepted inputs and the messages do not change; coding/extension/builtin/codemode/models_args.go (checkClassifierContext, checkImagesContext, describeValue) gives the same results, and the ten new Pi argument cases (arrayModel, arrayContext, arrayState, arrayQuestions, arrayQuestion, noInstructions, badBool, badKind, arrayImagesContext, badImageBlock) are in TestUpstreamCodemodeModels; letting isRecord accept arrays fails four of them. (2) joinAdjacentText checks the separator against the last non-empty part and joins once (#10678); execute.go joinAdjacentText writes into one strings.Builder, TestJoinAdjacentTextIsLinearInTheNumberOfItems and the new 'formats output at the item limit in linear time' subtest pin it (rebuilding the joined text per item takes 12.8 s and fails the 5 s bound). (3) executeCodemode publishes one update before the first nested call so the row's timer starts; execute.go:522, TestExecuteSendsAnInitialUpdateBeforeTheFirstNestedCall. (4) isNamespaceName matches the namespace name and its aliases (as written or as the same script identifier) instead of the suffix after the last `__`; run.go:125 and TestNamespaceLookupUsesNamesAndAliasesNotTheSuffixAfterDoubleUnderscore, with the Pi 1.2.0 session script (four spellings of the slow-docs namespace resolve to mcp__slow_docs) in TestAgentSessionMCPWaitsForServersWhoseScriptIdentifiersDifferFromTheirNames. Pi 3daa2028: at most 2 live codemode workers (maxConcurrentCodemodeWorkers, codemodeWorkers) passed as AcquireWorker, with Pi's limit message (coding/extension/builtin/codemode/execute.go)."

