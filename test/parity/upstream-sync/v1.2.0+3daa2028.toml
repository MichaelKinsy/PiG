rationale = "New in 1.2.0. chord/host/link.go ports the Link interface (link.ts:4-12) and baseLink, which is BaseLink (:15-76). baseLink keeps the receive queue until Receive, Send as a no-op once closed, close handlers as a set by function identity (funcID), and onClose firing at once with 'closed' on a closed link. Close sends a bye and ignores transmit errors; deliver turns a bye into ended(reason ?? 'peer closed'); ended clears the queue, shuts down and then notifies once. parseFrame is ported (:79-83). MemoryLink is ported (:87-122): sever, JSON round-trip transmit and 'peer closed' on shutdown, through the memoryDeliveries FIFO. IpcLink (:137-162) is ported as NewIpcLink: `{chord2: frame}` wrapping, 'ipc disconnected', and listeners detached on shutdown. WebSocketLink (:177-209) is ported as NewWebSocketLink: an outbox flushed on open, 'protocol error' on an unparsable message, 'socket closed', and close(1000) while readyState <= OPEN. Go additions with no Pi counterpart: a MalformedFrame value, so the connection, not the link, reports a non-frame (connection.ts:381-386); Send returns the encoding error that Pi's JSON.stringify would throw; and MemoryLink.flush, which HostImpl.Close uses. No Pi test targets link.ts alone. link.test.ts, links-review.test.ts and websocket.test.ts drive it through hosts and are ported; link_test.go and memory_queue_test.go add unit tests. Pi 018c87dd (deflate payloads over 64K; relays forward packed bytes unread) and db6497c3 (send returns the size sent; Window option) ported in chord/host/link.go."

