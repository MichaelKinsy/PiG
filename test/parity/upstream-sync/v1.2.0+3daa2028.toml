rationale = "The 1.1.0 change treats a llama.cpp model whose output_modalities include decisions as a native System One classifier (typesafe-system-one at the inference URL), lists decision-only models for classification but not chat, skips chat-template queries for them, and restores either classifier API from the store. internal/codingagent/llama/provider.go has each piece. Dropping the chat filter, the System One routing in classify, the inference base URL, the also-outputs-text rule or the stored typesafe-system-one restore fails the two cited tests (and TestModelsProviderListsDecisionModelsAsSystemOneClassifiersOnly for the chat filter)."

