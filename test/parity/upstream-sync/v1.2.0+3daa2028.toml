k reached twice as a cycle (the diamond). The core's oracle tests against Pi 97195ec3 (TestSchedulerMatchesPiDurable, TestScenariosMatchPiDurable) and its count and fuel tests pass unchanged. The contract corpus row U-harness-structured runs harness-structured.test.ts at PIN 97195ec3, which still asserts the old message at :465 and :492. The corpus's move to Pi 1.2.0 (dcontract-120) recaptures it with the 1.2.0 file."

