evidence = ["test:internal/pilock/eperm_retry_test.go#TestAuthLockWindowsEPERMUpstream", "test:internal/pilock/eperm_retry_test.go#TestSettingsAndTrustLockDoNotRetryWindowsEPERM", "test:internal/pilock/mkdir_classification_test.go#TestAcquireRetriesOnlyWindowsEPERMAmongNonEEXISTMkdirErrors", "test:internal/pilock/delete_pending_windows_test.go#TestAcquireRetriesLockBeingRemovedAtMkdirThenSurfacesIt", "test:internal/pilock/delete_pending_windows_test.go#TestAuthAcquireWaitsOutLockBeingRemovedAtMkdir"]
rationale = "1.0.4→1.1.0: no change. 1.1.0→1.2.0 (#10801): getRetryableLockErrorCode treats a lock attempt that fails with EPERM as retryable when process.platform is win32, for any fs call in the attempt. acquireLockSyncWithRetry retries it within its 10 attempts 20 ms apart. acquireLockAsync retries it at most MAX_EPERM_RETRIES = 5 times inside the 30 s deadline and shares the ELOCKED backoff. On other platforms EPERM still fails at once. internal/pilock retryableLockErrorCode applies the same rule: ErrLocked, or Node code EPERM (Windows ERROR_ACCESS_DENIED) while lockPlatform is windows. AcquireAuthSync (ai/auth.go sync path; coding/mcpext FileAuthStorageBackend, which Pi's MCP OAuth store backs with FileAuthStorageBackend.withLock) and Acquire (ai/auth.go async path; ai/models_store.go) use it. AcquireSync stays ELOCKED-only for settings-manager.ts and trust-manager.ts, which 1.2.0 leaves unchanged. TestAuthLockWindowsEPERMUpstream injects the platform, Math.random and the waits and runs Pi's four cases on every OS. The Windows delete-pending tests assert 10 sync and 6 async attempts on a real delete-pending directory; they compile under GOOS=windows but have not run on Windows."

