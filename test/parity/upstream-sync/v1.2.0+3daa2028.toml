rationale = "1.0.4→1.1.0: no change. 1.1.0→1.2.0 only adds the type exports BeforeAgentStartCustomEvent and BeforeAgentStartUserEvent to the barrel. TypeScript type re-exports have no runtime form; Go has no union types (language mechanic), so coding/extension.BeforeAgentStartEvent is one struct whose MessageType is BeforeAgentStartUser or BeforeAgentStartCustom with Prompt/Images or Message, and MarshalJSON writes the two Pi shapes. TestBeforeAgentStartEventWireShape checks both shapes and TestBeforeAgentStartTriggerAcrossSDKs the event each SDK receives."

