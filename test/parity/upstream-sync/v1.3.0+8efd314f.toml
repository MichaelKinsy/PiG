[[files]]
path = "packages/mcp/src/transports/streamable-http.ts"
change = "modified"
disposition = "ported"
evidence = ["test:mcp/streamable_http_test.go#TestStreamableHTTPTransportClosesTheSessionWithTheLastRequestsTokenWithoutAskingTheAuthProvider", "test:mcp/streamable_http_send_signal_test.go#TestStreamableHTTPTransportDoesNotRetryRequestsThatWereCancelledWhileAuthorizationWasRecovering"]
rationale = "1.0.4 → 1.1.0 (#10565), still holds: close() sends the session DELETE with the last request's token without asking the auth provider (mcp/streamable_http.go Close, lastToken). 1.1.0 → 1.2.0 (da0eadf0, #10598): send(message, { signal }) passes the signal to authorizedFetch, which throws McpAbortError when the signal is aborted after getting the headers and before each dispatch, without aborting the shared auth recovery. mcp/streamable_http.go Send passes its ctx to authorizedFetch as the signal, which returns NewMcpAbortError when the signal has ended after headers() and before each fetch. The second test ports Pi's streamable-http.test.ts case: the aborted and timed-out calls are never executed, the kept call is, and there is one refresh."

[[files]]
path = "packages/mcp/src/transports/transport.ts"
change = "modified"
disposition = "ported"
evidence = ["test:mcp/streamable_http_send_signal_test.go#TestStreamableHTTPTransportDoesNotRetryRequestsThatWereCancelledWhileAuthorizationWasRecovering", "test:mcp/streamable_http_send_signal_test.go#TestStreamableHTTPTransportSendDoesNotDispatchOnceItsContextEnds", "test:mcp/client_order_test.go#TestClientWritesRequestsInIDOrder"]
rationale = "1.0.4 → 1.1.0 left the file unchanged. 1.1.0 → 1.2.0 (da0eadf0): McpTransportSendOptions { signal?: AbortSignal } and send(message, options?). mcp/transport.go Transport.Send(ctx, message) and OrderedSender.SendOrdered(ctx, message, placed): the options bag's only member is the signal, which is the leading context.Context (rule S1); a caller that passes no signal in Pi passes a context that never ends. Stdio and in-memory ignore it, as Pi's transports do; TestStreamableHTTPTransportSendDoesNotDispatchOnceItsContextEnds shows the HTTP transport does not dispatch once ctx ends."

