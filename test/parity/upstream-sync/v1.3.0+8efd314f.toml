evidence = ["test:tui/stdin_buffer_terminal_reply_upstream_test.go#TestStdinBufferTerminalReplyStrings", "test:tui/terminal_colors_ghostty_upstream_test.go#TestUpstreamQueryTerminalColorsConsumesDelayedGhosttyColorFragments", "test:tui/stdin_buffer_oracle_test.go#TestStdinBufferMatchesPiOracle"]
rationale = "Unchanged from 1.0.4 to 1.1.0. The 1.2.0 change keeps terminal replies whole: TERMINAL_REPLY_HEADER_PATTERN (OSC 10/11, OSC 4;n;, OSC 7501;?, XTVERSION DCS >|, Kitty APC G replies) and isControlString; no flush timer is armed while the buffer holds a reply header; CAN/SUB drop a reply and a new ESC (not ST) aborts an unterminated one; on timeout, a control string longer than two units is emitted as its two-unit Alt key and the rest is processed again. tui/stdin_buffer.go terminalReplyHeaderRegex, isControlString, HasPendingFlush, extractCompleteSequences and FlushExpired do each; tui/terminal_input.go and the internal/experimental timer paths call FlushExpired, and public Flush still returns the remainder whole. TestStdinBufferTerminalReplyStrings ports the 23 'Terminal Reply Strings' cases and fails on the unfixed code (a split OSC 4 reply emits ctrl+g); reverting HasPendingFlush fails the Ghostty terminal-colors case; tui/testdata/stdin-buffer-oracle.json is regenerated from the 1.2.0 source with the generator that reproduces the 1.1.0 fixture byte for byte, and TestStdinBufferMatchesPiOracle passes 900/900 (65 failed before FlushExpired). Port: review-ca 9e1dc23127."

