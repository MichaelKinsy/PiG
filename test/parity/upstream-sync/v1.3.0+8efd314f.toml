evidence = ["test:env/conformance_test.go#TestLocalExecutionEnvConformance", "test:env/conformance_test.go#TestRemoteExecutionEnvOverAPipeConformance", "test:env/list_files_test.go#TestListFilesIsNotSupportedByDaemonsReleasedBeforeIt", "test:env/list_files_test.go#TestListFilesCancelsAListingInTheDaemon", "test:env/list_files_test.go#TestListFilesNamesTheFirstInvalidBoundInPisOrder", "test:env/list_files_oracle_test.go#TestListFilesIgnoreFilesMatchPisDaemon", "test:env/list_files_oracle_test.go#TestListFilesErrorsMatchPisDaemon"]
rationale = "Added in 1.2.0. env/list_files.go ports listFilesOver: it checks maxEntries, maxBytes and timeoutMs in Pi's order as non-negative safe integers, checks for abort, fails with not_supported when hello has no listFiles feature, sends only the options that are set, checks for abort again, and parses the kind-byte, path, NUL records (unknown kinds skipped, Truncated from the reply). LocalExecutionEnv is NodeExecutionEnv with ListFiles through the caller's connection after AbsolutePath. The conformance suites run Pi's listFiles cases, with ListFiles enabled, against both environments, and the oracle tests compare the listings and errors with Pi's Rust daemon."

