rationale = "The ea448f45 file is the host half of an execution, moved out of host.ts so that every place a VM can run shares it: CodemodeSandboxBase (the tool and global tables, execute, close), Execution (the deadline, the abort signal, call records, output, the decoding of what the VM reports) and the VmLauncher, VmChannel and VmEvents it drives. codemode/execution.go, vmlauncher.go and sandbox.go carry them. The seam tests drive a hand-made launcher through the sequence of Pi's lifecycle: the first terminal event wins, the channel is stopped once, replies produced before the channel arrives are flushed when it does, a launcher error or a broken message ends the run as a sandbox error. The tool-table tests assert a closed sandbox fails with 'Sandbox is closed'. The Worker host runs Pi's own execution.ts (ported verbatim) in the Pi sandbox.test.ts behaviors on the inline and remote backends. Pi 1.2.0 adds CodemodeSandboxBase.start() (0fb1aee7, 04566631): a deterministic run whose calls go to the caller's onCall and are answered with CodemodeRun.deliver(seq, now, id, outcome), with `finished` set before `result` settles and the refusals of start() and deliver() (startedAt, seed, unique tool and script names, a call that is not waiting, a reused seq, a clock that is not finite, properties that are not an object). codemode/run.go (Sandbox.Start, Run) and execution.go (forwardCall, deliver) carry it; the start tests assert the forwarded start data and calls, the posted answer with its seq and clock, the refusals of startedAt, tool and script names, globals, a call that is not waiting, a reused seq and a clock that is not finite (the call then still waits), the abort and Finished, and the deterministic test refuses properties that are null or an array on every backend. The seed refusal (`seed must be a 32-bit unsigned integer`) is held by the type: RunOptions.Seed is a uint32. Pi 3daa2028 changes comments only; the vmChannel.stop contract in codemode/vmlauncher.go says