[[files]]
path = "packages/mcp/src/client.ts"
change = "modified"
disposition = "ported"
evidence = ["test:mcp/client_test.go#TestClientAcceptsStructuredContentThatIsNotAnObject", "test:mcp/call_tool_result_lenient_test.go#TestCallToolResultKeepsBlocksWithMissingOrIllTypedMembers", "test:mcp/streamable_http_send_signal_test.go#TestStreamableHTTPTransportDoesNotRetryRequestsThatWereCancelledWhileAuthorizationWasRecovering", "test:mcp/client_order_test.go#TestClientWritesRequestsInIDOrder"]
rationale = "1.0.4 → 1.1.0 left the file unchanged. 1.1.0 → 1.2.0 has two changes. 67996ab7 (#10416): validateCallToolResult no longer rejects a structuredContent that is not an object; mcp/client.go validateCallToolResult keeps any JSON value (first test, the client.test.ts case, and the lenient-block test). da0eadf0 (#10598): every pending request gets a sendController whose signal goes to transport.send and is aborted when the request settles. mcp/client.go gives each pendingRequest a cancelSend context, passes it as the ctx of Send or SendOrdered, and cancels it in removePendingLocked and markClosed. The streamable-http test (Pi's \"does not retry requests that were cancelled while authorization was recovering\") drives the aborted and timed-out paths through the client."

