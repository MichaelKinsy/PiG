rationale = "New in 1.2.0: nodeLoader, a Node ESM facet loader (registerHooks resolve hook that carries the chord2-reload query into a facet module's directory, then await import(url?chord2-reload=N) per module, loader.ts:21-63; 7d75a0e3 registers every facet root before the first import). Owner decision C1(b): an isolated-Node loader over ForkDriver, as the 1.1.0 bundle loader ran. chord/host/loader.go NodeLoaderImpl.Load forks one Node child per call (HostManager over ForkDriver, loader_child.mjs) that imports the modules in module order, throws Pi's TypeError for a default export that is not a facet, installs the facets on a Chord host of its own and reports what they serve; each returned Facet serves the same contracts on the Go host, and every method forwards its call to the child's object (a resource opened with the record, released with it, replaced at a reload through its Rev). The registerHooks query, the root set and 7d75a0e3's ordering fix are replaced by process isolation: every Load is a fresh process, so the copies of a reload are fresh and the facets of one Load share one module graph whatever their order (the ordering half of loader.test.ts:8 holds by construction). loader.test.ts:8 is ported with Pi's fixture inputs (TestNodeLoaderLoadsFacetModulesAndReloadsThemWithFreshCopiesOfTheirRelativeImports); loader.test.ts:17 is TestNodeLoaderNeedsAConfiguredLoaderForModules. Differences to settle (numbered divergence draft with the lead): the facets run in another process, so a facet cannot reach the Go host (the contracts it serves, ctx, the principal a record is made for); a ChordError a method throws crosses with its code, reason and message only; and only contracts whose members are methods (local, or remote with one variant) are mirrored: state, opaque members, several variants, accepts adapters and state migrations are refused at Load with a TypeError."

