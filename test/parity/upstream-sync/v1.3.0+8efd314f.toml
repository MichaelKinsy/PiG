rationale = "The 1.2.0 change (da0eadf0) adds the McpTransportSendOptions type export. Its only member is the AbortSignal, so Go has no type for it: Transport.Send takes the signal as its leading context.Context (rule S1: an options bag whose only member is a signal is the context), in every Transport implementation (mcp/stdio.go, mcp/streamable_http.go, mcp/mcptest/inmemory.go); its behavior is under the transport.ts and streamable-http.ts rows."

