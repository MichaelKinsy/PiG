rationale = "The 1.1.0 change is durationMs: execute() is timed with a monotonic clock and rounded, the value rides the finalized outcome onto tool_execution_end and the tool-result message, and it is absent when the tool did not run. agent/tool_execution.go durationMs() and agent/run_tool_call.go carry it. Mutants: treating a tool that did not run as executed, and dropping DurationMs from the end event, fail both tests. The rounding mode (Math.round) is not pinned by a test."

