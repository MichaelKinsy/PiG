rationale = "7f021f0ee: the two event cases that waited for the web inflate by turns (`for (turn < 50 && seen.length === 0) await transported()`, `for (turn < 5 && seen.length === 0)`) wait for the listener's delivery (`delivered.promise`, resolved by the listener): libuv's thread pool runs the real inflate, so no number of turns is sure to cover it. The async contract: the test waits on the first delivery to the listener, then one more turn, then asserts. Go: both cases (`inflate nothing for a member nobody listens to…` and `keep the event window exhausted while an asynchronous inflate holds the message…`) in remote_consumer_events_test.go close a channel from the listener (sync.Once) and wait on it with waitDelivered (a 10 s bound, no sleep, no turn count) before the assertions. Go's ack is sent by the client's own goroutine after the delivery, so each case also waits for the ack event as before (rhWaitFor on the acks the peer saw, not a turn count). The base test already waited on that ack, not on turns: no red exists; 50 runs under -race passed on the base and after (counts in the commit message)."

