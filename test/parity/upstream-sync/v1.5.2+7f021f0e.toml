# The range c3cc91632d0a..7f021f0eebfa outside apps/p2 and apps/p3: 92e1db6ca (slice 14, first part: named live queries, column
# sets, exists and joins, lists), a merge, 0db9861ec (the app kit exports its start-data facets), and the two test-only commits 0a25dd15e (Together Kimi K3) and 7f021f0ee (consumer event tests). The Go chord
# implements Pi through c3cc91632d0a and does not implement slice 14. Every row below says so: `deferred` rows are work
# the port has not done (they lie behind PORT_MAP's 🟡 rows of the changed files), `designed-out` rows are documents.
# Interop for an app that declares no named query and uses no list: no fingerprint, wire frame or stored format changes
# (fingerprint.ts adds a node only for a `queries` member; link/ and remote/ frames, cursors and the catalog are
# untouched), so a Pi client at 0db9861ec works against this host and the reverse. The vendored Pi blobs under
# chord/nextnode/{surfaces/client,plugins/node}/pi stay at their carried commits (manifest `commit` and `carried`):
# they must run against the Go port they ship with, and the Go port does not have slice 14.

