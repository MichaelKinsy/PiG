[[files]]
path = "packages/durable/src/harness/scheduler.ts"
change = "modified"
disposition = "ported"
evidence = ["test:durable/harness/scheduler_notifications_test.go#TestFinalizePassKeepsAHolderCheckPublishedWhilePlanning", "test:durable/harness/scheduler_notifications_test.go#TestReservationPassKeepsAWaiterMadeACandidateWhilePlanning"]
rationale = "e50dc7af9 keeps scheduler notifications that arrive while a pass plans: Pi's bug is a yield between a decision region's result and applying it, so a publication observer queues a waiter or holder the pass then erases. In Go a pass decides and applies under one hold of TaskScheduler.mu (regionLocked returns with mu held; reserve and finalizeLocked apply before any unlock) and every observer that adds to runnable or finalizeChecks takes mu, so the Go scheduler is structurally immune and no Go source changed. The two ported #11892 cases (harness-tasks.test.ts) pass at the unmodified base and are mutation-checked by PortDurable (see handoffs/next/rows/PortDurable.md)."

