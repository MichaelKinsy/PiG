# The range ac78a6068b38..c47ad0432bb8: one commit, c47ad0432bb8 (2026-11-16, #12115, related to #11264 and #11973): fix(coding-agent): report diagnostics that appear on
# session replacement. It starts where v1.5.2+ac78a606.toml ends: no gap, no overlap. All ten changed paths are under packages/coding-agent and are listed here.
# What PiG did before this commit (measured on car24-head 297b8449d5 with the ported tests below: the RPC test finds the warning on stderr 0 times where one is wanted, and the runtime test does not build for want of the method):
# the Go runtime kept the diagnostics of the construction it was built from (Runtime.Diagnostics, from the factory result) and the CLI read them once, at startup:
# coding/cli/main.go passed them to the interactive mode's StartupDiagnostics and to the print and RPC startup reports. Nothing read them after a replacement: a
# diagnostic that first appeared on /new, /resume, /fork, import or an RPC new_session, switch_session or fork (an enabledModels pattern that matches nothing added
# between start and the replacement, a project extension that fails to load after /resume into another project, invalid settings of that project) was discarded in every
# mode: no chat line, no stderr line, no event. The same code is in every tag that has the runtime (Runtime.Diagnostics and the startup-only reading, v0.5.1 and later),
# so a fix of a fault of tagged releases: the changelog fragment says so.
# The change in PiG: Runtime.TakeUnreportedDiagnostics (coding/runtime.go, the reported set in coding/runtime_replacement.go), codingagent.WriteDiagnosticsToStderr
# (internal/codingagent/diagnostics_stderr.go, the one writer of main.ts's reportDiagnostics), InteractiveMode.showRuntimeDiagnostics (the one chat presentation, used at
# startup and in the rebind callback), and the rebind callbacks of print / JSON and RPC mode. The SDKs of the extension API have the method too (Go, Rust, Python, Lisp), as
# Pi's runtime class is part of Pi's SDK; no wire member: the factory and its diagnostics stay in the extension's process (docs/extension-api-parity.md).

