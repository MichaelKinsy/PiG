evidence = ["test:tui/continue_signal_unix_test.go#TestContinueSignalHandlerRunsOnlyWhileStarted", "test:tui/continue_signal_unix_test.go#TestContinueSignalListenerIsNotAddedTwice", "test:tui/continue_signal_unix_test.go#TestContinueSignalHandlerSetWhileStartedAppliesAtOnce", "test:tui/continue_signal_unix_test.go#TestContinueSignalHandlerSetWhileStoppedAddsNoListener", "test:tui/continue_signal_unix_test.go#TestContinueSignalStartStopDoesNotLeakGoroutines"]
oracle = "not carried: D661 diverges from Pi's SIGTSTP listener and omits TUI.setSuspendSignalHandler; no parity scenario exercises external SIGTSTP or TUI.setSuspendSignalHandler (the Ctrl+Z scenarios 40-suspend-resume-session and 43-suspend-signal-order are unchanged)."
rationale = "e4f50d76 (#12283, issue #12272): Pi adds public TUI.setSuspendSignalHandler(handler) registering a SIGTSTP listener while the TUI runs. Under Go 1.27, sigdisable in runtime/signal_unix.go never restores SIG_DFL for SIGTSTP once signal.Notify has been called, so PiG does not catch SIGTSTP and instead implements tui.SetContinueSignalHandler on SIGCONT tied to process-terminal ownership (D661, awaiting owner approval). Expected-absent copies of TUI.setSuspendSignalHandler under D661: tui/renderer.go (TUI), extensions/sdk/tui_alt_screen.go, extensions/sdk-py/pig_sdk/tui_alt_screen.py, extensions/sdk-rs/src/tui_alt_screen.rs, extensions/sdk-lisp/src/tui-alt-screen.lisp, extensions/sdk-ts/pi-pin.d.ts, coding/extension/host/subprocess/runtime-node/shims/pi-dist/pi-tui/tui.js, and coding/extension/host/subprocess/runtime-node/runtime.mjs (factoryTui). Calling tui.setSuspendSignalHandler from a Node extension throws TypeError. None of those copies carry setSuspendSignalHandler on the tip (no drift against v1.5.2 pin; future pin bump past e4f50d76 will meet test-sdk-ts / vendor-pi-dist-drift / sdk-exports checks unless updated or recorded under D661)."

