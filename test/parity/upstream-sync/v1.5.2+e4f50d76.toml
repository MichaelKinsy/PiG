oracle = "not carried: D661 keeps the kernel default SIGTSTP stop without pre-stop terminal reset and re-arms on SIGCONT; no parity scenario runs external kill -TSTP job control."
rationale = "e4f50d76 (#12283): Pi wires ui.setSuspendSignalHandler(() => this.handleCtrlZ()) in init and switchTuiMode so an external kill -TSTP resets the terminal before stopping. PiG does not reset the terminal before an external stop (D661, awaiting owner approval); instead InteractiveMode.installContinueHandler runs before startTerminal and re-arms/redraws the terminal on foreground SIGCONT after fg (preserving screen in fullscreen, balancing Kitty keyboard pushes on frontend surfaces, covering fullscreen, regular, dash, startup terminal-arm window, and shells that restore raw termios on fg). Every cited test fails if the port is reverted; regression guards (TestCtrlZKeyKeepsItsModeSequences, TestExternalSIGTSTPKeepsARunGoing, TestSIGTSTPWhileAnExternalEditorOwnsTheTerminal) are kept in external_sigtstp_pty_linux_test.go and not cited here as port evidence."

