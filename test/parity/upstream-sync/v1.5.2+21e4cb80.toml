rationale = "21e4cb80d: the loop no longer waits for canRetry before the next attempt. #closed schedules the next attempt first (at once when the close came within STALE_MS + WAKE_GRACE_MS of a wake, #wokenAt, used once), then #ask asks canRetry unless a question is open (#asking); a false answer stops the loop whenever it comes; stop() reports `waiting` for the attempt it ended; #deciding and #wokeWhileDeciding are gone. chord/next/surfaces/surfaces_connection.go ports it with Pi's names (closed, ask, schedule, wake, stop; woken/wokenAt, asking): the question runs on a goroutine started after the schedule, its answer an event of the loop's outbox. No timer literal changed (250 ms, 5 s, 10 s, 20 s, 25 s, 1 s). On the unchanged loop Pi's four cases were red (1 socket where 2 are wanted; 1 socket and 1 question where 9 and 1; the replacement at 36 250 ms where 36 000) and one wake with a 3 s check made its next attempt 3 250 ms after the wake (now 0 ms). The file is also vendored byte for byte in chord/nextnode/plugins/node/pi and chord/nextnode/surfaces/client/pi (manifest `carried` gains 21e4cb80d)."

