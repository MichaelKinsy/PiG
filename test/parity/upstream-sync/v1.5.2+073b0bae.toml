rationale = "073b0bae8 (#12366, closes #12311): createProvider previously re-merged baselineModels and dynamicModels with a linear findIndex per dynamic entry on every getModels()/getAllModels() call, making Models.getModel() quadratic in catalog size. The merge now runs once at construction and once per publish update callback (stored restore and network refresh) through a (type, id) index, caching both allModels and chatModels. ai/models_provider.go merges once per publish into an immutable atomic snapshot; public GetModels/GetAllModels return an owned shallow copy (1 alloc) so concurrent Go callers cannot race by mutating a shared slice, while package-private lookups (Models.GetModel, Models.GetModelOfType, Models.GetModels, Models.GetAllModels, compat builtin lookup) read the cached snapshot directly (0 allocs on GetModel). The Go, Rust, Python and Lisp SDK create_provider implementations merge once per publish the same way."
oracle = "carried: 073b0bae8 (pi-ai/models.js: setDynamicModels with Map index, cached allModels and chatModels, and the two publish update callbacks)"

