rationale = "4438c58ba (#9986): an abort in the middle of a tool batch left the calls the loop had not reached without a tool result. executeToolCallsSequential and executeToolCallsParallel no longer leave the batch at an aborted signal (three `if (signal?.aborted) break` removed), and prepareToolCall answers `Operation aborted` (isError true) first, before the tool lookup, prepareArguments, validation and beforeToolCall; the check after the hook block is removed and the one right after `await beforeToolCall` stays. So each remaining call gets tool_execution_start, tool_execution_end and a toolResult message, and the hooks are not asked about a call that will not run. runToolCall checks the signal first too. agent/tool_execution.go: the two `if ctx.Err() != nil { break }` are removed (executeToolCallsSequential, executeToolCallsParallel) and prepareToolCall returns the aborted outcome first; the check after the before hooks is removed, the one after each hook stays. A parallel call prepared before the abort still ends `Operation aborted` in runPreparedToolCall (Pi's thunk check, unchanged). One Go step keeps Pi's answer for a hook in another process: the host does not await an extension's tool_call handler past the abort, so that hook returns the context's error; prepareToolCall reads a hook error that is the cancelled context's own as the abort (`Operation aborted`, where the result read `event tool_call: context canceled`), and still reports an error the hook returned for its own reason, as Pi's catch does. agent/run_tool_call.go says the same of RunToolCall. Order, compared with Pi itself: TestAgentLoopMatchesPi and TestAgentClassMatchesPi (seeded programs with aborts from a tool, from a before hook and from the Agent's abort operation) now load the vendored compiled runtime (the pin plus the carried blocks, internal/pioracle.Root) instead of the mirror's TypeScript, which stays the pin; at the base both sources gave the same verdict, and the unchanged Go loop against the vendored runtime with this block fails both tests. For the re-pin lane: the two drivers stay on the vendored runtime after the pin moves; do not switch them back to the mirror. Released PiG 0.2.0, 0.3.0 and 0.7.0 have the defect (the same two breaks). A session an older build wrote keeps its orphaned calls on disk; the request still gives each one the synthetic `No result provided` result, and nothing is rewritten. Paired scenario: test/parity/scenarios/rpc/82-rpc-abort-mid-batch-answers-every-call.toml."

