rationale = "4be4cb4f5 (#12139): getNonVisionImageNote is removed, so the text of an image read no longer says that the selected model takes no images (the text is stored in the session and was replayed after a switch to a vision model); when the image was attached and ctx.model has no image input, details = { imageUnsupportedByModel: ctx.model.id }, else details stays undefined (none beside an image that could not be prepared, none for a vision model or without a model). internal/codingagent/tools/read.go readImage does the same from the tool environment (Model, SupportsImages); tools.ReadDetails.ImageUnsupportedByModel and coding/extension.ReadToolDetails.ImageUnsupportedByModel are *string with omitempty, so the member is absent unless set and present for an id of \"\" as in Pi, in the session file, the rpc and json events and an extension's tool result (ext_details.go passes it on). The conformance case reads a PNG under the harness's model without image input through every SDK and compares with Pi's vendored read.js: text \"Read image file [image/png]\", details {\"imageUnsupportedByModel\":\"current\"}. The parity oracle and the vendored Node runtime carry the commit as a post-release backport (pi-coding-agent/core/tools/read.js). sdk-ts ReadToolDetails gains the member when the pin reaches 4be4cb4f5e9c. pi-ai's downgradeUnsupportedImages is unchanged by the commit, and so is ai/transform_messages.go."

