rationale = "9a7cfba47 (#12312, issue #12309): Enter on an open autocomplete menu submitted the prompt whenever the completion's prefix started with \"/\", so a Tab menu for an absolute path (look at /tmp/x/fi) or a command argument (/open /tm) completed the text and sent the unfinished prompt. Enter now submits only from the command-name menu: the prefix starts with \"/\" and the text before the cursor, read before the completion is applied, is a slash command with no space (isInSlashCommandNameContext, which the Tab dispatcher shares). Editor.AutocompleteAccept and Editor.inSlashCommandNameContext are the Go counterparts, and Pi's three cases are ported."
