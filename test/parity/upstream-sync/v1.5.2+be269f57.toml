disposition = "ported"
evidence = ["test:ai/providers/bedrock/bedrock_proxy_scope_test.go#TestBedrockProxyIsTheBaseURLsAndOnlyTheRuntimeAndSTSUseIt"]
rationale = "be269f57b1 (#12365, fixes #12353): when a proxy is resolved for model.baseUrl, Bedrock now also routes AWS SSO (GetRoleCredentials) and SSO OIDC (CreateToken) credential requests through the runtime proxy handler, matching Pi's credentialDefaultProvider clientConfig.requestHandler. In loadBedrockConfig (ai/providers/bedrock/bedrock.go), awsconfig.WithSSOProviderOptions wraps the SSO client with bedrockProxiedSSO and awsconfig.WithSSOTokenProviderOptions attaches runtimeHTTPClient to ssooidc.Options, while IMDS, container credentials, credential_process, bearer tokens, AWS_BEDROCK_SKIP_AUTH, and static/env keys keep their direct/unproxied behavior."
oracle = "carried: be269f57b1: packageFile backport in automation/gen/pi-post-release-backports.mjs patches pi-ai/api/bedrock-converse-stream.js in the installed oracle."

