evidence = ["test:chord/next/surfaces/surfaces_client_test.go#TestAStaticClientAppliesNoNewSetAndIsNeverOutdatedByOne", "test:chord/next/surfaces/surfaces_client_test.go#TestAStaticClientReconnectsWithoutAskingTheServersBase"]
rationale = "22fe46c7b: ClientOptions.follow (default true; false for a static client built offline and served elsewhere): such a client neither follows the scripts object, nor applies a set, nor asks the server's base before a reconnect, so it is never outdated. surfaces_client.go has ClientOptions.Follow as a *bool (nil: follow) and StartClient does the same. The browser runs Pi's client.ts vendored byte-for-byte (see web/page.ts)."

