rationale = "22fe46c7b: webSurface(server, { routes: false }) contributes no Http routes and gives file(path), pageAssets() and base() for an app with an HTTP stack of its own; pageBootstrap is exported. surfaces_web.go does the same: WebSurfaceOptions.Routes is a *bool (nil: routes; Pi's union of the page options or `routes: false` is one struct whose Page, Paths and Public a false Routes ignores), WebSurface.File, PageAssets and Base take the request's context and wait for the build as the routes do (PageAssets is nil and Base empty when the build failed, 503 for File), and PageBootstrap is the exported bootstrap."

