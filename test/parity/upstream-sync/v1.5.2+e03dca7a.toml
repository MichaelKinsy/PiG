rationale = "e03dca7a3843 adds \"emits session_start after reload when extensions were bound without bindings\": a runtime whose extension records session_shutdown and session_start, bindExtensions({}), reload(): [session_shutdown reload, session_start reload]. The Go twin is the first test above (same events, same order; it fails before the change with only session_shutdown); TestSessionReloadRestartsTheExtensionsOnlyOfABoundSession adds the cases Pi's flag distinguishes (never bound: shutdown only; bound with members; bound again after a reload). The agent_session_runtime conformance row gains a reload step in every SDK (Node, Go, Python, Rust; isolated and packed): the report's `reload.events` is [shutdown|reload|-, start|reload|-], taken from Pi's own run in the Node row."

