rationale = "e03dca7a3843 (#12231) makes reload() restart the extensions (session_start with reason reload, MCP reporting, resource discovery) when bindExtensions() set `_extensionsBound`, in place of the check that a UI context, command actions, a shutdown handler or an error listener were set, which a host that called bindExtensions({}) never satisfied. PiG's counterpart is coding.Session: BindExtensions sets `extensionsBound` (before the runner check, as Pi sets the flag unconditionally) and Reload tests it, replacing ExtensionBindings.hasBindings, which is deleted. The faulty host shape is every SDK's AgentSession.BindExtensions (coding/cli/child_sessions.go binds with ExtensionBindings{}) and examples/headless; the print, JSON, RPC and interactive modes do not call Session.BindExtensions (print and RPC emit session_start themselves after Session.Reload, interactive only stores the abort handler) so they are unchanged. PiG had the fault in v0.7.0. The oracle carries the commit through the e03dca7a3843 block of automation/gen/pi-post-release-backports.mjs (pi-coding-agent/core/agent-session.js)."

