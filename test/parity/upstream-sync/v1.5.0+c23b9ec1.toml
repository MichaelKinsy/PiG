[[files]]
path = "packages/coding-agent/src/core/tools/edit-diff.ts"
change = "modified"
disposition = "ported"
evidence = ["test:internal/codingagent/tools/edit_window_test.go#TestGenerateEditDiffMatchesTheWholeFileDiffAndPatchWhenLinesAreDistinct", "test:internal/codingagent/tools/edit_window_test.go#TestGenerateEditDiffProducesAPatchThatAppliesWhenLinesRepeat", "test:internal/codingagent/tools/edit_window_test.go#TestGenerateEditDiffOfASmallChangeInA20MBFileAllocatesLittle"]
rationale = "Pi d448c51e2 (#11751) computes the diff and the patch in windows around the replacements. Ported as edit_diff_window.go; the cases compare the windowed diff and patch with the whole-file ones for distinct and repeated lines and bound the allocations of a small change in a 20 MB file."

[[files]]
path = "packages/coding-agent/src/core/tools/edit.ts"
change = "modified"
disposition = "ported"
evidence = ["test:internal/codingagent/tools/edit_window_test.go#TestEditToolComputesTheDiffBeforeWritingSoADiffFailureLeavesTheFileUnchanged", "test:internal/codingagent/tools/edit_window_test.go#TestEditToolWritesTheLineEndingOfTheLineAnEditStartsIn"]
rationale = "Pi d448c51e2 (#11751): the edit tool computes its diff before writing, so a diff failure leaves the file unchanged, and writes the replacements into the original text so the lines an edit does not touch keep their line endings. Ported in edit.go and edit_diff.go (applyReplacementsToOriginal); the tests drive the tool with a failing diff and with mixed CRLF, LF and lone CR files."

[[files]]
path = "packages/coding-agent/src/core/tools/find.ts"
change = "modified"
disposition = "ported"
evidence = ["test:internal/codingagent/tools/find_ls_limit_test.go#TestFindLimitEdgeCases7121"]
rationale = "Pi 676af1d77 (#7121): a find limit below 1 means 1 and the limit notice needs one more result (D253)."

[[files]]
path = "packages/coding-agent/src/core/tools/grep.ts"
change = "modified"
disposition = "ported"
evidence = ["test:internal/codingagent/tools/grep_ripgrep_context_test.go#TestGrepPrintsOverlappingContextOnceAndKeepsTheLastMatchsTrailingContext", "test:internal/codingagent/tools/grep_ripgrep_context_test.go#TestGrepKeepsCountingMatchesPastTheByteCap", "test:internal/codingagent/tools/grep_ripgrep_context_test.go#TestGrepReadsEventLinesLongerThanTheReadBuffer", "test:internal/codingagent/tools/grep_event_test.go#TestGrepEventParserMatchesEncodingJSON", "test:internal/codingagent/tools/grep_event_test.go#FuzzGrepEventParserMatchesEncodingJSON"]
rationale = "Pi 8da141c2a (#11705, #9276, #11423) takes the context lines from ripgrep's own context events, reports the match limit only on proof of one more match and keeps a lone CR in a line; 6bf2ab9bb (#11895, #11807) runs a directory search inside the search path so a glob is rooted there. Ported in grep.go; GrepOperations.ReadFile is gone, as Pi's. The event loop allocates nothing per event: grep_event.go scans rg's JSON lines in place (checked against encoding/json and fuzzed), rows are built in a reused buffer and rows past the 50KB cap are only measured, so TestScalingTools holds grep's allocations constant as the context grows."

[[files]]
path = "packages/coding-agent/src/core/tools/ls.ts"
change = "modified"
disposition = "ported"
evidence = ["test:internal/codingagent/tools/find_ls_limit_test.go#TestLsLimitEdgeCases7121"]
rationale = "Pi 676af1d77 (#7121): an ls limit of 0 means 1 (D253)."

[[files]]
path = "packages/coding-agent/src/core/tools/read.ts"
change = "modified"
disposition = "ported"
evidence = ["test:internal/codingagent/tools/read_streaming_test.go#TestReadStreamingGivesTheSameOutputAsTheWholeFileAlgorithm", "test:internal/codingagent/tools/read_streaming_test.go#TestReadStreamingKeepsMemoryBoundedForA200MBLine", "test:internal/codingagent/tools/read_streaming_fuzz_test.go#FuzzReadStreamingMatchesTheWholeFileAlgorithm"]
rationale = "Pi 3a7bb6f48 (#11750) reads a text file through ops.createReadStream and keeps only the lines head truncation can show. Ported as ReadOperations.CreateReadStream, readLocalFile (one open file: the access check, the image sniff and the stream) and readStreamedTextResult/selectLinesFromStream (read_stream.go), which count every line, store the lines that can show and measure the rest. The ported read-streaming cases run against the whole-file algorithm for chunk sizes 1 and 4096, a 200 MB line stays under a 64 MB heap, and a fuzz target compares arbitrary bytes, chunk sizes, offsets and limits with the whole-file reference. The selector decodes a chunk's selected lines in one pass, stores whole lines in one write and counts the lines past the caps without a pass per line, so a 140 KB read costs 24 allocations (BenchmarkReadToolExecute), as it did before the stream."

