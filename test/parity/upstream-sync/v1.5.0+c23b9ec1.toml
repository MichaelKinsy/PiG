evidence = ["test:ai/anthropic_missing_key_abort_pi_test.go#TestAnthropicMessagesAPIMissingKeyIsAbortAwareForStreamAndASetupFailureForStreamSimple", "test:ai/api_streams_aliases_pi_test.go#TestLegacyAPIAliasesKeepTheAuthenticationTimingOfTheirMethodUpstream", "test:ai/models_provider_setup_abort_pi_test.go#TestModelsProviderSetupFailureReasonFollowsTheRequestSignal", "test:ai/lazy_setup_error_order_test.go#TestLazySetupRejectionIsAbortedWhenTheRequestSignalIsAborted"]
rationale = "f3a64af07 (#8635) gives lazyStream a signal parameter: a setup that rejects ends as \"aborted\" when the signal is aborted, whatever the cause, and as \"error\" otherwise (lazy.ts:83). ai.LazyStream takes the request context and pushModelsSetupError (ai/models_runtime_stream.go) reads its cancellation for the reason; lazyApi passes options.signal, which the API streams in ai/api_streams.go pass as the call context. Dynamic module loading stays designed out (static linking)."

