rationale = "Pi aceb1bd1 (#8158) replaces grok-mermaid with lovely-mermaid 0.3.3: the theme maps through getFgAnsi and toAnsi, classDef styles apply over it, and a link opens only on node text on terminals with hyperlinks. internal/mermaid is ported from lovely-mermaid 0.3.3 and matches its render() and toAnsi() byte for byte over the corpus and 32k extra mutated sources; themedLines does the mermaid.ts mapping, and the transformer renders only on user, assistant and summary messages (eebd5d90c, #11756), so thinking, custom and changelog Markdown stays raw."

