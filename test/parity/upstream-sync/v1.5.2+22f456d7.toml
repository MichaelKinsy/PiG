rationale = "f72f799a4: `@google/genai` 2.21.0 to 2.32.0 (httpOptions.fetch). PiG has no @google/genai dependency, but ai/google_wire.go mirrors the SDK's converters (the member order of the request body), so the update is a port obligation; this row first classed it designed-out for the missing dependency, which hid the port. Ported: between the two versions the converters reachable from generateContentParametersToMldev and generateContentParametersToVertex change as follows, and the tables follow. Gemini API: inlineData and fileData are no longer rebuilt (the params' member order is sent), the config sends labels after toolConfig, then continuationToken and store, and a part sends speechMetadata. Vertex: a functionResponse is rebuilt as id, name, parts, response, scheduling with each part as fileData, inlineData, the config sends continuationToken and outputConfig (its generationOutputConfig), and a part sends speechMetadata. Not mirrored, as before: the members of speechConfig (voiceConfigToVertex gains voice) and of tools, which PiG copies as the params give them. geminiMirroredSDKVersion names the mirrored version; make pin-check and TestGoogleWireMirrorsTheInstalledSDK compare it with the version the oracle installs."
