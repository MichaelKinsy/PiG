# Pi 76c79d8bbe (2026-11-14): fix(p2): fit images to the model's limits before they enter the transcript. Its packages/durable half is ported here; its apps/p2 half is ported on the p2 line by lane P2FitImages.
# Left out of this range because they touch only apps/p2 / apps/p2-mac and are accounted on their own lines: 8cc6d4800 (p2: cross-fade light/dark theme changes), 8636e211e (p2-mac: cross-fade the native views), 17d6ca759 (p2: no unhandled rejection when the browser skips a theme fade), c1d4b0ac3 (p2: the Familiar as a sidebar row).

[[files]]
path = "packages/durable/src/images/fit.ts"
change = "added"
disposition = "ported"
evidence = ["test:durable/images/fit/fit_test.go#TestFitImage", "test:durable/images/fit/fit_test.go#TestFitImages", "test:durable/images/fit/fit_test.go#TestFitImagesExtension", "test:durable/examples/fit_images_example_test.go#TestExample47FitImages"]
rationale = "76c79d8bbe: fitImage, fitImages and createFitImagesExtension (FittedImage, FittedImages) are durable/images/fit/fit.go FitImage, FitImages, CreateFitImagesExtension; the differences are Go's: a context first, the unions as a Kind field with constants, and Prepare's error (whatever its kind) becomes the omitted image's note as the thrown error does in Pi. No image library is imported. Tests: the 11 cases of images-fit.test.ts (2 fitImage, 7 fitImages, 2 extension) with Pi's inputs and expected results, plus the hook run through a Harness for results without images and for a nested call; mutations of the prepare step, the note's error and MIME, the nested skip and the model limits each turn a test red."
oracle = "not carried: pi-durable is not an oracle backport package (the oracle is Pi 1.5.2, which has no images/fit); the comparison is by Pi's own literals, which the ported tests assert with Pi's inputs and expected results"

