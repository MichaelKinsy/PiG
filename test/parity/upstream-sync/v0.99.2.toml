rationale = "The 0.99.2 delta (#10188) wraps the injected or global fetch as (input, init) => fetch(input, init) so it never runs with the transport as receiver (Cloudflare Workers reject that), for transport requests and for UnauthorizedContext.fetch. A Go McpFetch is an interface value whose Do always runs on its own receiver, so the receiver assertion is designed out (test-mapping-v0.99.2.json). The observable part is ported: the injected fetch carries the initialize POST, the provider's GET through UnauthorizedContext.Fetch, the retried POST, the notification, tools/list and the closing DELETE, and an absent fetch falls back to http.DefaultClient; mutations that give the provider http.DefaultClient or build a fresh client for the default fail the test."
