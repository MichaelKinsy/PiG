change = "modified"
disposition = "ported"
evidence = ["test:chord/next/store/store_test.go#TestStore"]
rationale = "6268cc5cd (backup coordinator, Chord part): Store.onCommitted announces lastSeq after a commit, a group, a series or an applied batch is durable, in a microtask of its own, once for however many commits it covers; a listener that throws is removed and its error handed to onError. store.go OnCommitted/committed announces from a goroutine of its own outside the store's lock (deliveries serialized by a mutex, so listeners see increasing seqs one at a time), coalesced by the announcing flag; a panic is Pi's throw. Pi's three cases are ported (onCommitted subtests of TestStore); the exact once-per-microtask count cannot be observed in Go, so the test asserts the last seq, order, no call under the lock, no call for a series-less refusal and the removal."

