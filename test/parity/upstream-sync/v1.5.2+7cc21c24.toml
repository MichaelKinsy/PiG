# The range c3cc91632d0a..7cc21c24f6b5 outside apps/p2 and apps/p3: slice 14 (92e1db6ca, first part: named live queries,
# column sets, exists and joins, lists; 8270d9af6, second part: admission with a typed value, route admission, host-data
# delete by plugin), 0db9861ec (the app kit exports its start-data facets), and the test-only commits 0a25dd15e (Together
# Kimi K3) and 7f021f0ee (consumer event tests). The Go chord ports slice 14 on port/chord-slice-14-*; a row is
# `ported` only when every Pi test file that covers its source has a Go twin for every case. `deferred` rows are the
# sources that still wait on one named case, example or document (each names what it waits on); `designed-out` rows are
# documents, barrels and benchmarks the Go port has no counterpart of.
# Interop for an app that declares no named query, no list, no admission and no route admit: no fingerprint, wire frame
# or stored format changes, except the failure cause `denied` (binary byte 3, text letter d; the refused byte moves from
# 3 to 4): a Pi client at 0db9861ec decodes a `denied` cause only after it takes the same range. The vendored Pi blobs
# under chord/nextnode/{surfaces/client,plugins/node}/pi are re-vendored at 7cc21c24f6b5 (manifest `commit`).

