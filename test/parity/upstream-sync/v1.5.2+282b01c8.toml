[[files]]
path = "packages/coding-agent/src/core/tools/find.ts"
change = "modified"
disposition = "ported"
evidence = ["test:internal/codingagent/tools/find_ancestor_glob_upstream_test.go#TestFindPathGlobsDoNotMatchAboveTheSearchPath", "test:internal/codingagent/tools/find_ancestor_glob_windows_branch_test.go#TestFindWindowsPathPatternDoesNotMatchAboveTheSearchPath", "test:internal/codingagent/tools/find_pi151_test.go#TestFindFdInvocationFdGlobArguments", "test:internal/codingagent/tools/find_pi151_test.go#TestFindFdInvocationWindowsPathPattern", "test:coding/tool_definitions_pi_wire_test.go"]
rationale = "282b01c80 (#12116, #12066): a relative path pattern is anchored at the search path, like grep's glob, where a leading \"**/\" let it match through the folders above the search path (with the project in ~/src/app, src/**/*.ts returned every .ts file). On POSIX the pattern is prefixed with the search path without its trailing slashes and with \\ * ? [ ] { } escaped, and --ignore-case is passed when the user's pattern is all lowercase (fd's smart case would read the search path's letters); on Windows the minimatch matcher matches the path relative to the search path, and the absolute path for an absolute pattern. The pattern description is the shorter wording grep's glob shares. newFindFdInvocation and findPathFilter (internal/codingagent/tools/find.go) do the same with the platform injected, and the schema carries the description. The vendored find.js and the oracle carry the change through automation/gen/pi-post-release-backports.mjs."

