change = "modified"
disposition = "ported"
evidence = ["test:coding/cli/startup_diagnostics_order_test.go#TestStartupDiagnosticOrderMatchesPi", "test:coding/cli/model_scope_session_replacement_upstream_test.go#TestModelScopeWarningsOnSessionReplacement", "test:coding/cli/rpc_startup_extension_model_test.go#TestRPCStartupModelFromExtensionProvider"]
rationale = "bacd45b9c (#11973, #11264): createRuntime calls resolveModelScopeWithDiagnostics and appends the model scope warnings to the runtime's diagnostics, after the settings and extension diagnostics and before buildSessionOptions' diagnostics, where resolveModelScope printed each one with console.warn on every run of the factory (startup and each session replacement). main reports the initial runtime's diagnostics once, deduplicated: stderr in print, JSON and RPC modes and for --help and --list-models, chat warnings in interactive mode. coding/cli/main.go appends selected.ScopeWarnings to startupDiagnostics at the same place and no longer prints them; PiG's builder never printed on a replacement, so the count on new_session was already one, and what changes is the order, the deduplication of a repeated pattern and the interactive startup (a chat warning instead of a stderr line before the TUI). The vendored main.js and the oracle carry the change through automation/gen/pi-post-release-backports.mjs."

