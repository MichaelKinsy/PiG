rationale = "state.ts replaces 1.1.0 services/state.ts. Its 1.2.0 port is chord/state.go from chord2 S1 (852f029c26/03b4cc045d, landed via bcffbcf16b in int-120), and the 1.1.0 runtime stays in internal/chord for internal/experimental. Mapping: StateSubscriber is stateSubscriber (:171), with push and its 100-deep overflow window that keeps the unstarted hydration (:182, maxPendingDeliveries :37) and drain (:199). ReplicatedStatePublisher is statePublisher: subscribe (:301) hydrates with the background context at the current sequence, and publish/enqueue/deliver (:328-381) keep the #delivering loop and the hydratedSequence skip. MutableReplicatedStateImpl is MutableReplicatedState with Change/ChangeArray/Replace (:478-560): the reentrant change and replace errors carry Pi's messages, a failing callback aborts the draft, and deep-equal replacements are no-ops. AttachedReplicatedStateImpl is AttachedReplicatedState (:576-690), with receive's safe-integer and gap checks, fail with the AggregateError when dispose also fails, and idempotent Dispose. attachReplicatedStateSource/replicatedState(source) is AttachReplicatedStateSource (:700), returning AggregateError('Failed to attach replicated state source'). replicatedState(initial) is NewReplicatedState (:454). reportErrorAsync is the reporter set by SetUncaughtErrorReporter (:147). Go splits the subscribe overloads into Subscribe and SubscribeAsync (returns a Completion). Go extras with no Pi counterpart: InternalSnapshot, SubscribeSource and SubscribePublications, used by chord/host. One Pi case has no Go form: replicated-state.test.ts:46 (a PromiseLike change callback) cannot occur because Go's mutate returns an error. Its t.Run slot instead checks that a panicking callback rolls back and returns the panic. The other 15 replicated-state.test.ts cases and all replicated-state-delivery.test.ts cases are ported as subtests of the tests listed."

