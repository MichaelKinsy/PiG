[[files]]
path = "packages/durable/src/signals.ts"
change = "added"
disposition = "ported"
evidence = ["test:durable/harness/harness_signals_test.go#TestDefineSignal", "test:durable/harness/harness_signals_test.go#TestSignalDelivery", "test:durable/harness/harness_signals_test.go#TestSleepingOnSignals", "test:durable/harness/harness_submission_notify_test.go#TestSubmissionsThatNotifyATask"]
rationale = "473515f9c adds signals: typed JSON values delivered to a live task and kept in its memos `pi.signal.<name>/<key>` until a wake uses them. durable/signals.go ports defineSignal (panics where Pi throws a TypeError), deliverSignal (not_found, closed for a terminal, completing, or abort-marked task or an expired key, invalid for a value outside the schema, duplicate, a delivery after the deadline closing the key), readSignal (migration, newer-version and missing-migrate errors), checkSleep, sleepDue, sleepWake, and the built-in SubmissionSettled signal, named SubmissionSettledSignal because Go's SubmissionSettled is the settled result of Submission.Abort. A Go method cannot take a type parameter, so Tx.SignalErased, TaskRuntime.ReadSignalErased, HookApi.ReadSignalErased and Harness.SignalErased take an erased token and durable.Signal, durable.ReadSignal and harness.Signal are the typed calls."

[[files]]
