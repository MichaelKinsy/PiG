rationale = "473515f9c: pi.tool version 4 with the `parked` phase and the wake and checkpoint of `execute`; a tool's execute may park (sleep or wait) and runs again when woken with api.wake and api.checkpoint; cancel cleans up the external work of an aborted parked call in a context only the Harness close cancels; beforeTool gates may sleep (parkAtGate); executeTool with wait false returns a NestedToolCall; createTask takes a key; explicit keys after a wake; durationMs spans the call from its first run (startedAt) to its result. tool.go and tool_nested.go port each; Pi's overload `executeTool({ wait: false })` is ExecuteToolNoWait and `createTask({ key })` is CreateTaskErased with ToolTaskOptions, because a Go method has one result type and one options type."

