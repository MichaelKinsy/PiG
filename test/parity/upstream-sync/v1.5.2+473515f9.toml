disposition = "ported"
evidence = ["test:durable/harness/harness_tool_parks_test.go#TestToolParksInvalid", "test:durable/harness/harness_tool_parks_test.go#TestToolParksWrappers"]
rationale = "473515f9c adds the park shape check and wrapComposite: wrappers never park, a composite's park its base did not return is invalid_park. durable/harness/parks.go keeps the park a pointer (ToolExecutionResult.Park, because a Go tool returns one struct where Pi returns a result or a park object) so identity tells a base's park from a wrapper's; the run's park set travels on the run's api and, for a wrapper that hands its base another api, on the call's context."

