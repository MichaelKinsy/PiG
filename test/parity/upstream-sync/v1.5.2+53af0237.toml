evidence = ["test:chord/nextnode/surfaces/surfaces_bundle_test.go#TestConditionsResolvesThroughAGivenTsconfigsPathsAPackageExportingOnlyAnUnbuiltDistElseIgnoresTsconfigsPi53af02378"]
rationale = "53af02378: buildBase takes a BaseResolution ({ conditions, tsconfig }); with tsconfig esbuild resolves through that tsconfig's paths for every file (a package whose exports name only an unbuilt dist/), without it tsconfigRaw \"{}\" ignores every tsconfig.json. surfaces_bundle.go has BaseResolution{Conditions, Tsconfig} and BuildBase takes it. Pi's case (aiish exporting only ./dist/utils/*, paths to its source) is ported with the same project and expectations: the inputs are main.ts and the source, the script contains the paths value, and a build with conditions only fails with Could not resolve. The existing conditions cases pass their conditions as BaseResolution{Conditions}, as Pi's test does."

