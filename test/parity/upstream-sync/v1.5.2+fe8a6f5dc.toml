# Pi fe8a6f5dc741e9214a20f70f359c68c72b494d1e (#12371, closes #12321):
# Unanchor getGeminiMajorVersion so prefixed Gemini 3+ and 2.x IDs (such as
# randomprefix-gemini-4-argon, google/gemini-3-pro, models/gemini-3-flash,
# publishers/google/models/gemini-3.1-pro, vendor-gemini-2.5-flash) match like
# usesGoogleThinkingLevel; add compat.supportsStrictMode for google-generative-ai
# and google-vertex.

[[files]]
path = "packages/ai/src/api/google-shared.ts"
change = "modified"
disposition = "ported"
evidence = ["test:ai/google_prefixed_ids_test.go#TestGeminiPrefixedModelIDHelpers", "test:ai/google_model_ids_oracle_test.go#TestGoogleModelIDHelpersMatchPi"]
rationale = "fe8a6f5dc (#12371): unanchor getGeminiMajorVersion to /gemini(?:-live)?-(\\d+)/; rewrite usesGoogleThinkingLevel's Gemini 4+ arm as (getGeminiMajorVersion(id) ?? 0) >= 4; change supportsGoogleStrictToolSampling to accept model and honor model.compat?.supportsStrictMode ?? (majorVersion !== undefined && majorVersion >= 3). Ported in ai/google.go; carried in automation/gen/pi-post-release-backports.mjs (fe8a6f5dc) for both compiled pi-ai/api/google-shared.js and mirrorSource packages/ai/src/api/google-shared.ts."

