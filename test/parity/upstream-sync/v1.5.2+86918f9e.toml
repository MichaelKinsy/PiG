evidence = ["test:ai/openai_copilot_reasoning_upstream_test.go#TestOpenAICompletionsTopLevelReasoningTokensUpstream", "test:ai/openai_copilot_reasoning_upstream_test.go#TestParseChunkUsageTopLevelReasoningTokens", "test:ai/openai_completions_member_type_oracle_test.go#TestOpenAICompletionsMistypedMembersMatchPi", "test:ai/github_copilot_reasoning_oracle_test.go#TestGitHubCopilotCompletionsReasoningEffortMatchesPi"]
rationale = "86918f9eeb (#12110): parseChunkUsage reads `rawUsage.completion_tokens_details?.reasoning_tokens || rawUsage.reasoning_tokens || 0`: the top-level count, where GitHub Copilot reports it, when the nested one is missing or falsy; output, totalTokens and cost are unchanged (completion_tokens already includes reasoning). The fallback is the adapter's, so it holds for every openai-completions provider. ai/openai.go parseChunkUsage reads oaiUsage.ReasoningTokens when the nested count is 0, and ai/openai_chunk_jsread.go normalizeOpenAIUsageMember reads the top-level member only when the nested one is falsy (a nested truthy count leaves a mistyped top-level member unread, as `||` does). The request code is unchanged: the OpenAI-style branch sends reasoning_effort for the Copilot records that now say supportsReasoningEffort."

