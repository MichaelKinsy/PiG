rationale = "86918f9eeb (#12110): the models.dev map callback takes the source model, and a Copilot chat-completions model's compat.supportsReasoningEffort is `source.reasoningOptions?.some((option) => option.type === \"effort\") ?? false` in place of false, so catalog/build.ts (unchanged) also gives such a model the thinkingLevelMap of its effort list. internal/modelgen/providers/github_copilot.go sets the flag from source.HasEffortOption(); the golden hashes of the Copilot files and the two lists of every model are what Pi's generator writes with the commit's file over the pinned mirror (PI_CATALOG_OVERLAY of equivalence.sh). The built-in catalog takes the three records of the release's data (gemini-3.8-flash, gemini-4-argon, kimi-k3) from the provider-data block of automation/gen/pi-post-release-backports.mjs."
oracle = "carried: 86918f9eeb as the provider data pi-ai/providers/data/github-copilot.json (the generator source is not part of the installed package)"

