[[files]]
path = "packages/coding-agent/src/config.ts"
change = "modified"
disposition = "ported"
evidence = ["test:internal/installchange/installchange_test.go#TestDetectInstallChangeReportsARemovedInstallInsteadOfReadingAFileFurtherUp", "test:internal/installchange/installchange_test.go#TestDetectInstallChangeReportsAReplacedExecutable", "test:internal/installchange/installchange_test.go#TestTrackerFollowsASymlinkedExecutable"]
rationale = "1.0.3 (#10439) caches the QuickJS wasm path, spawns the codemode worker from an in-memory data: URL and adds detectInstallChange, so an update that removes the install cannot break a running pi. PiG embeds the QuickJS module in one native executable and runs codemode in process, so the wasm path cache and the data: URL worker are designed out. detectInstallChange is ported as the additive D95: PiG records its executable's identity at startup (path, device and inode or Windows file index, size, mtime) and the extension cell files it starts, and reports a replaced or removed executable or a pruned cell when an error is shown."

