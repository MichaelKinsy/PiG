rationale = "6aab551a79ba adds the one case: JSON print mode on a runtime whose extension appends an entry in session_start (data = the event's reason) and replaces the session with ctx.newSession() from /renew; the output starts with the session header and the entry_appended events of the startup and of the new session are both in it (`[\"startup\", \"new\"]`). Scenario json/16 is that case against the installed Pi with the commit backported (same extension and prompt, output compared byte for byte after masking ids and clocks, runs = 3). TestJSONModeWritesSessionStartEventsOfAReplacementInEverySDK runs it in every SDK through the writer-start fixture's /writer-renew command (Node, Go, Python, Rust, Lisp: each serves ctx.newSession) and asserts two session_start entry_appended and two session_info_changed. It fails on the code before the change (0 of each) and passes after."

