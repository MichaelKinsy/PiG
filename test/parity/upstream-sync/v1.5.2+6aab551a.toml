evidence = ["test:coding/cli/json_mode_writer_after_session_start_test.go#TestJSONModeWritesWhatSessionStartEmitsInEverySDK", "test:coding/cli/json_mode_writer_after_session_start_test.go#TestJSONModeWritesSessionStartEventsOfAReplacementInEverySDK", "test:coding/cli/writer_after_session_start_structure_test.go#TestSessionOriginWritersObeyTheWriterSubscribedGate", "scenario:test/parity/scenarios/json/13-json-session-start-writer-order.toml", "scenario:test/parity/scenarios/json/16-json-session-start-replacement.toml"]
rationale = "6aab551a79ba (#12232) moves rebindSession's subscription (the event writer and the stdout backpressure) before `session.bindExtensions()`, so the events session_start handlers emit (entry_appended, session_info_changed, a custom message's message_start and message_end) reach the --mode json output at startup and after an extension replaces the session; the session header is still written first. PiG's counterpart is the `bind` closure of coding/cli/print_mode.go: `subscribe(session)` now runs before `session.EmitSessionStartTransition`, and the `writing` flag that held back the entry_appended writer until session_start was dispatched is gone. Plain print mode (text) has no event subscription and is unchanged. PiG had the fault by design (its test and scenario json/13 pinned the dropped stream, in v0.7.0). The oracle carries the commit through the 6aab551a79ba block of automation/gen/pi-post-release-backports.mjs (pi-coding-agent/modes/print-mode.js)."

