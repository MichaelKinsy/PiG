evidence = ["test:chord/next/host/remote_provider_events_test.go#TestProviderEvents", "test:chord/next/host/remote_provider_test.go#TestProviderCallLimit", "test:chord/next/host/remote_provider_test.go#TestProviderOrigins", "test:chord/next/host/remote_relay_events_test.go#TestRelayEvents"]
rationale = "8d30e6306: the per-link, per-origin event window (the host's `eventWindow`, default 32): an entry meeting a full window is dropped before it is encoded and counted chord.events.dropped{window}; one `event` message per flush per origin takes a slot; a state ack and an event ack (`ack.events`) are separate credits; a value is encoded once per representation for every hold and link; a relayed event message is forwarded at once with its filtered entries and its sender as a ticket, returned in order by the downstream's event acks; a side retires only once its tickets drained. Calls count against the announced window only on an untrusted link. remote_provider.go queueEvent/sendEvents/eventAck/tickets, limit 0 = none."

