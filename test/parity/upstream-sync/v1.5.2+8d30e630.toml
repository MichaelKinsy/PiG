rationale = "8d30e6306 (events: fire-and-forget members): HostEvents (counter, list, one flush per turn as a Loop.Queue microtask: every entry to its node's taps, links' senders first, then listeners in entry then subscription order), EventNode/Tap (boundAt < n), Subscription (stop, context abort, a panicking listener is reported listener_error and ends only itself) and OwnEventSource (Emit returns released after the seal; Emit and On enter the loop as a section because the rest of a suspended handler runs off the section that admitted it). Pi's settled Promise from on() is a blocking (subscription, error). host_events.go; tests host_events_test.go with host_events_support_test.go (Pi's support.ts event helpers: Ticker, NamedTicker, TickerView, Match, ticking, recorder; Pi's single JS turn is hostTurn, one host section). Designed out: the vi.spyOn of HostEvents.counter in the cost test (a Go method cannot be spied: the test asserts the bindings of contracts without event members hold no event bookkeeping and the counter never moved) and the shared-empty-events-slice identity of variantNames (Go empty slices share no allocation by construction)."

