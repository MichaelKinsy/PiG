path = "packages/chord/src/remote/relay.ts"
change = "modified"
disposition = "ported"
evidence = ["test:chord/next/host/remote_relay_events_test.go#TestRelayedCallsInTheUpstreamWindow", "test:chord/next/host/remote_relay_events_test.go#TestRelayedCallsInARealWorkersFiniteWindowNeverExceedItWhenAHoldWithAForwardedCallIsReleased", "test:chord/next/host/remote_relay_events_test.go#TestRelayEvents"]
rationale = "8d30e6306: relayed calls wait per upstream window (the worker's announced one, also behind a trusted downstream link): a waiting call leaves the queue on abort, release or the downstream's close, forwarded ones free their slots (the release goes before the next call), loading rejects the waiting calls (unavailable, \"rebinding\"), a rebound one waits for the new bound's ack (\"rebound\"), failed and gone reject them with their cause, an upstream drop fails them. remote_relay.go relayedCall."

