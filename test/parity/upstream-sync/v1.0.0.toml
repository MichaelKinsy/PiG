[[files]]
path = "packages/coding-agent/src/experimental/session-worker.ts"
change = "modified"
disposition = "ported"
evidence = ["test:internal/experimental/session_worker_coding_harness_test.go#TestCreateCodingAgentHarnessRunsPiToolsAndPromptOverAProvider", "test:internal/experimental/session_worker_coding_harness_test.go#TestCreateCodingAgentHarnessDoesNotResolveTheInitialModelForAnExistingRoot", "test:internal/experimental/session_worker_coding_harness_test.go#TestCreateCodingAgentHarnessFailsStartupOnAnUnresolvableModel", "test:internal/experimental/remote_runtime_b_upstream_test.go"]
rationale = "The worker opens its Harness by storage path through CreateSessionWorkerHarness, subscribes to the task graph for activity, calls Resume, drops the fault hook, locks the Session directory and closes the Harness then the runtime cleanup. createCodingAgentHarness opens the pi-durable Harness over SQLite with the Model Runtime as its models, the coding registry, the Harness settings and the execution environments; the root conversation takes the initial model only when it is created and always the agent cwd; a startup failure closes the Harness, then the environments, and reports both failures together. The real-worker remote-runtime cases run this production function; there is no stand-in."

