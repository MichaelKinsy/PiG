[[files]]
path = "packages/coding-agent/src/experimental/client-tui-chat.ts"
change = "modified"
disposition = "ported"
evidence = ["test:internal/experimental/client_tui_component_test.go#TestClientChatViewReusesStreamingComponentAndRebasesDivergentPrefix", "test:internal/experimental/client_tui_upstream_test.go#TestExperimentalClientTuiUpstream"]
rationale = "The chat view renders the durable ConversationView (pi.user, pi.assistant, pi.tool-result, pi.compaction, pi.reset entries; pi.live generation, tools and compactions; pi.inbox), with the 1.0.0 status line, fresh cards for reused call IDs, 'Not run' cards for interrupted answers, and a rebuild when a partial disappears. The view type is harness.ConversationView."

[[files]]
path = "packages/coding-agent/src/experimental/client-tui.ts"
change = "modified"
disposition = "ported"
evidence = ["test:internal/experimental/client_tui_upstream_test.go#TestExperimentalClientTuiUpstream", "test:internal/experimental/client_tui_component_test.go#TestClientChatViewReusesStreamingComponentAndRebasesDivergentPrefix"]
rationale = "The client TUI reads the view: running is pi.live.run, the footer shows the pi.agent model, thinking level and entry count, abort calls AgentController.abort and clears 'Aborting…' when it settles, an accepted operation reports no failure, and the fullscreen wheel-scroll setting reaches the renderer. applyFromSettings is synchronous in Go already."

[[files]]
path = "packages/coding-agent/src/experimental/client.ts"
change = "modified"
disposition = "ported"
evidence = ["test:internal/experimental/client_run_test.go#TestPromptClientSessionWaitsForTheAnswer", "test:internal/experimental/remote_runtime_b_upstream_test.go#TestExperimentalDurableServerCompositionRemoteB"]
rationale = "client.ts:76-82: a one-shot prompt returns the text that AgentController.waitForPrompt settles with, an error for a rejected prompt, and 'Prompt was not answered: <reason>' for an unanswered one; the lane-event streaming, the BACKGROUND delivery tail and RunClientOptions.onEvent are gone."

[[files]]
