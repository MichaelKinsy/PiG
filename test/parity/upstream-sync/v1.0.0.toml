[[files]]
path = "packages/coding-agent/src/experimental/server.ts"
change = "modified"
disposition = "ported"
evidence = ["test:internal/experimental/session_catalog_test.go#TestListSessionsSkipsEntriesWithoutValidMetadata", "test:internal/experimental/server_runtime_test.go#TestRunningServerRoutesServicesAndJoinsClose", "test:internal/experimental/remote_runtime_a_upstream_test.go#TestExperimentalDurableServerCompositionA"]
rationale = "server.ts:383-397: the server lists, resolves, creates and deletes Sessions through the meta.json catalog; a tracked worker's Session overrides its listed entry and wins in resolve; the catalog has one directory per ID so there is no ambiguity error; JSONL repository and execution environment cleanup are gone. routing.SessionMetadata is an interface that the application asserts back to SessionCatalogMetadata in OpenSession."

[[files]]
