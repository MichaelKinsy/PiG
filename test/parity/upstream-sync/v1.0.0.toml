change = "modified"
disposition = "ported"
evidence = ["test:internal/experimental/services/agent_controller_upstream_cases_test.go#TestUpstreamAgentController"]
rationale = "The provider submits input with whenBusy reject, steer or followUp through consumer-owned Conversation and Harness boundaries; cancelQueued parses canonical positive safe-integer IDs and maps aborted, not_found and every other result; waitForPrompt reads the answer's first model message; ConversationBusy maps to code busy, other errors to operation_failed. durableadapter.Session implements the boundaries over durable/harness."

