[[files]]
path = "packages/coding-agent/src/experimental/durable/harness-setup.ts"
change = "added"
disposition = "ported"
evidence = ["test:internal/experimental/durableagent/harness_setup_test.go#TestCreateHarnessSettings", "test:internal/experimental/durableagent/harness_setup_test.go#TestExecutionEnvs", "test:internal/experimental/durableagent/harness_setup_test.go#TestConfigureHarnessHTTP", "test:internal/experimental/session_worker_factory_test.go#TestFindInitialAgentModelUsesNativeModelsAndSettings"]
rationale = "configureHarnessHttp applies the proxy setting and the idle timeout (ai.ApplyHTTPProxySettings, ai.ConfigureHTTPDispatcher) and rejects an unparseable idle timeout as getHttpIdleTimeoutMs throws; createHarnessSettings reads the stream, compaction, retry and queue-mode settings at every use (an explicit provider timeout, maxRetries and maxRetryDelayMs of 0 are kept as `??` keeps them; a disabled idle timeout becomes 2147483647; a value that does not parse panics as its getter throws); createCodingRegistry installs CodingTools then the pi prompt; ExecutionEnvs holds one NodeExecutionEnv per directory and cleans them in creation order; findInitialAgentModel resolves an explicit model or pi's default. The production caller is createCodingAgentHarness."

[[files]]
path = "packages/coding-agent/src/experimental/durable/main.ts"
change = "added"
disposition = "ported"
evidence = ["test:internal/experimental/durableagent/args_test.go#TestParseArgs", "test:internal/experimental/durableagent/main/main_test.go#TestRunRejectsAnUnknownArgument"]
rationale = "The program parses --continue and -c, rejects any other argument by name, opens the session, runs the TUI and closes the session, joining a close failure to the TUI's. It is a Go main package run with go run ./internal/experimental/durableagent/main; it is not in the pig binary, as the upstream source is excluded from the published package (tsconfig.build.json)."

[[files]]
path = "packages/coding-agent/src/experimental/durable/prompt.ts"
change = "added"
disposition = "ported"
evidence = ["test:internal/experimental/durableagent/prompt_test.go#TestCreatePiPromptSections", "test:internal/experimental/durableagent/prompt_test.go#TestCreatePiPromptDirectoryPrecedence", "test:internal/experimental/durableagent/prompt_test.go#TestCreatePiPromptLoadsResourcesOncePerDirectory", "test:internal/experimental/durableagent/prompt_test.go#TestCodingRegistrySystemPromptReachesTheProvider"]
rationale = "The pi-prompt extension has the seven untagged sections in pi's order, built from BuildSystemPromptSections with the snippets and guidelines of the four coding tools only, the conversation directory (environment, then agent, then fallback) and context files and skills loaded once per directory. The preamble is PiG's (operating inside pig). Upstream builds the sections once per request through a WeakMap on the input; the Go section callback has no input identity, so each key builds from the cached resources, which gives the same text."

[[files]]
path = "packages/coding-agent/src/experimental/durable/runtime.ts"
change = "added"
disposition = "ported"
evidence = ["test:internal/experimental/durableagent/runtime_test.go#TestOpenStartsANewSession", "test:internal/experimental/durableagent/runtime_test.go#TestCommandsRunInOrderAndFailuresBecomeNotices", "test:internal/experimental/durableagent/runtime_test.go#TestSubagentConversationsAppearAndCanBeSwitchedTo", "test:internal/experimental/durableagent/runtime_test.go#TestAnInterruptedTurnResumesAfterContinue", "test:internal/experimental/durableagent/runtime_test.go#TestCloseReleasesTheSessionAndContinueKeepsItsModel"]
rationale = "Open, the plain view, the controller and Close of the durable coding agent over the Harness, with the notices, the ordered command queue, the subagent summaries and titles, the task panel, the switch of conversation and the resume of an interrupted turn. The agent document that cycleThinking and setModel read is the committed one, not the view's, because Go deliveries run after the committing call returns (async-contracts.toml)."

[[files]]
path = "packages/coding-agent/src/experimental/durable/sessions.ts"
change = "added"
disposition = "ported"
evidence = ["test:internal/experimental/durableagent/sessions_test.go#TestSelectSessionCreatesALockedSessionForTheRealPathOfTheDirectory", "test:internal/experimental/durableagent/sessions_test.go#TestSelectSessionContinuesTheNewestSession", "test:internal/experimental/durableagent/sessions_test.go#TestSelectSessionRefusesASessionOpenElsewhere"]
rationale = "A new session is a directory named by the creation time and a UUID under the hash of the real path of the working directory, locked with proper-lockfile's protocol (10 s stale, twelve one-second retries); --continue opens the newest such directory."

[[files]]
path = "packages/coding-agent/src/experimental/durable/subagent.ts"
change = "added"
disposition = "ported"
evidence = ["test:internal/experimental/durableagent/subagent_test.go#TestSubagentRunsTheTaskInAChildConversation", "test:internal/experimental/durableagent/subagent_test.go#TestSubagentRerunFindsTheChildAndItsSubmission", "test:internal/experimental/durableagent/subagent_test.go#TestSubagentCallInterruptedByAClosedHarnessResumesAfterReopen"]
rationale = "The tool creates a child conversation owned by the call's task that cannot delegate, runs the task there with a request ID, returns the child's answer with its conversation ID in the details, and is safe to replay."

[[files]]
path = "packages/coding-agent/src/experimental/durable/tui.ts"
change = "added"
disposition = "ported"
evidence = ["test:internal/experimental/durable_tui_test.go#TestDurableTuiShowsTheTranscriptAndFollowsTheStreamingAnswer", "test:internal/experimental/durable_tui_test.go#TestDurableTuiTaskPanelNestsTasksUnderTheirOwners", "test:internal/experimental/durable_tui_test.go#TestDurableTuiFooter", "test:internal/experimental/durable_tui_test.go#TestDurableTuiKeys", "test:internal/experimental/durable_tui_test.go#TestDurableTuiModelSelector", "test:internal/experimental/durable_tui_run_unix_test.go#TestRunDurableTuiOnARealTerminal"]
rationale = "The TUI renders the view with pi's components: the transcript with the streaming answer, tool cards and compaction summaries, the task panel, the queue, the notices, the status in the editor's border and the footer; the slash commands, the model and conversation selectors and CustomEditor's key dispatch; and RunDurableTui on a real terminal. Pi's ListSelector rows are the FilterableList of the tui package, filtered fuzzily on the label and value."

