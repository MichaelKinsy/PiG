evidence = ["test:tui/overlay_terminal_image_upstream_test.go#TestGetImageLineExtentReadsTheCellsAnImageLineCovers", "test:tui/overlay_terminal_image_upstream_test.go#TestOverlayHidesAnITerm2ImageWhenItCoversRowsAboveItsImageLine", "test:tui/image_line_extent_oracle_test.go#TestImageLineExtentAndStripMatchPi"]
rationale = "787005a40 (#12109, issue #11584): getImageLineExtent reads the cells an image line draws over (a Kitty image starts at its line and extends down by its `r=` or registered rows, an iTerm2 image ends at its line and starts as many rows up as the cursor-up prefix says; the width is `c=`, the registered columns or iTerm2's plain `width=` cell count, else unbounded), and stripImageSequences removes the Kitty and iTerm2 sequences of a line with iTerm2's cursor-up prefix. tui/terminal_image.go ports both under Pi's names (unexported: Pi's index.ts does not export them); Pi's regular expressions are byte searches there, because the compositor reads every image line of the viewport each frame and an image line holds the payload, and the oracle test compares both functions with Pi's over random lines."

