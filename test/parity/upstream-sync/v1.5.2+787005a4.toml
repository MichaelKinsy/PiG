change = "modified"
disposition = "ported"
evidence = ["test:tui/overlay_terminal_image_upstream_test.go#TestOverlayOverAKittyImageDeletesTheImageAndRedrawsItAfterTheOverlayCloses", "test:tui/overlay_terminal_image_upstream_test.go#TestLaterOverlayHidesAnImageInsideAnEarlierOverlay", "test:tui/overlay_terminal_image_upstream_test.go#TestFullscreenOverlayRemovesKittyPlacementsWhileItCoversThem", "test:tui/main_screen_oracle_test.go#TestMainScreenFramesMatchPiOracle", "test:tui/alt_screen_oracle_test.go#TestAltScreenFramesMatchPiOracle"]
rationale = "787005a40 (#12109): while the overlays are composited back to front, hideImagesUnderOverlay removes from the frame's lines every image placement the overlay overlaps by row and by column (from getMaxKittyImageRows above the viewport on), so the renderers' change detection deletes the image and draws it again once the overlay no longer covers it; an image beside the overlay stays, and the overlay still skips the row that holds such an image's sequence. composeOverlaySnapshotWithStats (tui/overlay_compositor.go) calls the ported hideImagesUnderOverlay before each overlay. The frame oracles agree because automation/gen/pi-post-release-backports.mjs applies the same change to pi-tui's compiled tui.js and terminal-image.js; both fixtures are re-recorded from that oracle."

