change = "modified"
disposition = "designed-out"
evidence = []
rationale = "ef9361ab7 adds an 'error' listener to spawn(\"gh\", ...) so a failed spawn of the GitHub CLI is a failed command instead of an uncaught exception. PiG's /share does not run gh: it uploads through the PiG gateway (session_share.go, D64), so the child-process failure path does not exist; Pi has no test for it either."

