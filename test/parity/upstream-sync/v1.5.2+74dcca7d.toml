change = "modified"
disposition = "deferred"
evidence = ["test:durable/harness/harness_lifecycle_test.go#TestHarnessClose"]
rationale = "64c96d00d part ported (evidence); 64c96d00d: the scheduler owns the Harness's providerSessionIds and associates every task runtime it builds with that set. scheduler.go holds the set and attaches it to the context every invocation's Signal derives from. 473515f9c (feat(durable): suspendable work) also changes this file: ported on feat/durable-suspend (lane DurableSuspend), merged into next when relayed; this row stays deferred until then."

[[files]]
path = "packages/coding-agent/src/core/tools/read.ts"
change = "modified"
disposition = "unchanged-observable"
evidence = ["test:internal/codingagent/tools/read_streaming_test.go#TestReadStreamingRejectsWhenAbortedWhileOpeningTheFile", "test:internal/codingagent/tools/read_streaming_test.go#TestReadStreamingStopsReadingALocalFileWhenAbortedMidRead"]
rationale = "ef9361ab7 (#12025, #11956) stops giving the file stream the abort signal: a stream destroyed by an aborted signal emitted an unhandled 'error' that exited pi, and the read loop already checks the signal between chunks. That is a Node EventEmitter failure; ReadTool.Execute (read.go) already returns \"Operation aborted\" on ctx.Err(), reads no further chunk (selectLinesFromStream checks ctx before each Read) and closes the stream (deferred Close). Pi's two read-streaming cases (abort while the file is opened; abort mid-read of a 1 MB file, one chunk read) are ported with the same inputs and pass unchanged on next."

[[files]]
path = "packages/coding-agent/src/core/session-manager.ts"
change = "modified"
disposition = "unchanged-observable"
evidence = ["test:internal/codingagent/session_listing_test.go#TestSessionListingDoesNotFailWhenAbortedAfterAFileThatIsNotASessionWasSkipped"]
rationale = "ef9361ab7 (#11956): buildSessionInfo no longer hands the picker's signal to the file stream, checks it per line and after the loop, and destroys the stream in a finally (the old early return for a file whose first entry is not a session header left the stream open, leaking its descriptor, and a later abort crashed pi with an unhandled stream 'error'). summarizeSessionFileWith (session_resume.go) opens with a deferred Close, closes the file on abort through context.AfterFunc and returns ctx.Err(), so it neither leaks on the early return nor has an unhandled-error path. Pi's file-operations case (list a directory holding a 1 MB non-session .jsonl, then abort) is ported and passes unchanged on next."

[[files]]
