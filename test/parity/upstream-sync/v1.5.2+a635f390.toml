change = "modified"
disposition = "ported"
evidence = ["test:internal/codingagent/session_selector_progressive_reload_upstream_test.go#TestUpstreamSessionSelectorKeepsTheNextSessionSelectedWhenAProgressiveReloadAfterDeleteStartsWithAnotherSession", "test:internal/codingagent/session_selector_progressive_reload_upstream_test.go#TestUpstreamSessionSelectorKeepsTheRenamedSessionSelectedWhenTheReloadStartsWithAnotherSession", "test:internal/codingagent/session_selector_progressive_reload_upstream_test.go#TestResumePickerOverTheSessionListingKeepsTheNextSessionSelectedAcrossTheReloadAfterADelete", "test:internal/codingagent/session_selector_oracle_test.go#TestSessionSelectorInputMatchesPi", "test:internal/codingagent/session_selector_contract_test.go#TestSessionListHandleInputContractsMatchPi"]
rationale = "a635f3901 (#12111, issue #12106): SessionList.setSessions takes `partial`. A touched selection is kept by session path; when that path is missing from a partial list (more sessions are still loading) it stays the target (pendingSelectedPath) and is selected again once it arrives, instead of the selection becoming whichever session the clamped index points to. A complete list clears the target, and so does any key that reaches the list's selection or search handling. The progress callback passes partial = true, the scope toggle passes it while the new scope is loading or not yet loaded, and the delete, the settled load and the failed load pass a complete list. PiG's picker reloads progressively through the same SessionListProgress (SessionManager listings publish the file that finished first), so the same rule applies: refilterLoadedSessions (internal/codingagent/session_selector_load.go) is setSessions with the flag, and the third test runs it over the real listing the interactive /resume uses. automation/gen/pi-post-release-backports.mjs applies the same change to pi-coding-agent's compiled session-selector.js, so the vendored runtime and the selector oracles (session_selector_oracle_test.go, random key sequences against Pi's component; session_selector_contract_test.go) carry it. The contract case that pinned the old toggle (`tab/touched-selection-is-lost-while-the-other-scope-is-still-loading`, first row selected) is now `tab/touched-selection-follows-its-session-into-a-scope-that-is-still-loading`, as Pi's toggleScope behaves since this commit."

