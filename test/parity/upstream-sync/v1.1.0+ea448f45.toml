rationale = "The 1.1.0 change replaces the private ProxyMessageEventStream with createAssistantMessageEventStream. agent/proxy.go already returns ai.NewAssistantMessageEventStream; the swap has no observable difference and the proxy stream cases pass unchanged. No mutant: nothing behavioral changed."

