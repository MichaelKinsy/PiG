change = "modified"
disposition = "ported"
evidence = ["test:tui/input_oracle_test.go#TestInputHandleInputMatchesPi", "test:tui/fake_cursor_test.go#TestMainScreenDrawsTheFocusedFakeCursorAndOmitsItWhenTheHardwareCursorIsShown"]
rationale = "Input draws its cursor with the same fake-cursor markers (tui/text_input.go). The Input oracle was red on the marker diff before the port and is green against the 42a build."

