[[files]]
path = "packages/tui/src/terminal-image.ts"
change = "modified"
disposition = "ported"
evidence = ["test:tui/terminal_image_upstream_test.go#TestUpstreamTerminalImageCapabilities"]
rationale = "TERM_PROGRAM=herdr returns hyperlinks on and images off before outer-terminal detection (tui/terminal_image.go); PI_HYPERLINKS=0 still wins. D44's HERDR_ENV and HERDR_KITTY_GRAPHICS signal is kept ahead of it."

[[files]]
path = "packages/tui/src/terminal.ts"
change = "modified"
disposition = "ported"
evidence = ["test:tui/terminal_program_status_upstream_test.go#TestUpstreamTerminalProgramStatus", "test:tui/terminal_negotiation_upstream_test.go#TestUpstreamTerminalNegotiation"]
rationale = "The 1.1.0 change to terminal.ts is OSC 7501 program status: setProgramStatus, the support query that shares the DA sentinel (the Kitty query no longer carries DA itself), the PI_PROGRAM_STATUS override, and re-reporting after a restart. tui/terminal.go ports each; the five program-status cases of terminal.test.ts run in TestUpstreamTerminalProgramStatus. Mutants: dropping the PI_PROGRAM_STATUS=0 skip and leaving the query pending across a restart both fail it."

