evidence = ["test:ai/bedrock_openai_reasoning_upstream_test.go#TestBedrockClaudeHaiku5UsesAdaptiveThinkingWithNativeXhighAndBlockBinding", "test:ai/bedrock_openai_reasoning_upstream_test.go#TestSupportsBedrockPromptCachingForClaudeHaiku5", "test:ai/bedrock_openai_reasoning_upstream_test.go#TestBedrockSendsReasoningEffortForOpenAIGPTModels", "test:ai/bedrock_openai_reasoning_upstream_test.go#TestBedrockSendsFlatReasoningEffortForGPTOSSClampedToHigh"]
rationale = "The 1.1.0 change adds haiku-5 to the Claude 5 families (prompt caching, adaptive thinking, native xhigh, block binding) and sends reasoning.effort for GPT models and a flat reasoning_effort for gpt-oss on Bedrock. ai/bedrock.go has all four haiku-5 sites and bedrockOpenAIReasoningFields. Renaming each haiku-5 match fails TestSupportsBedrockPromptCachingForClaudeHaiku5 or TestBedrockClaudeHaiku5UsesAdaptiveThinkingWithNativeXhighAndBlockBinding, and letting gpt-oss send xhigh fails TestBedrockSendsFlatReasoningEffortForGPTOSSClampedToHigh."

