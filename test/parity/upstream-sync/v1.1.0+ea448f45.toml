change = "modified"
disposition = "ported"
evidence = ["test:tui/output_pad_upstream_test.go#TestBoxSetPaddingXMatchesPi"]
rationale = "Box.setPaddingX(paddingX) sets the horizontal padding and drops the render cache so the next render uses it (#10557). tui.Box.SetPaddingX does the same; the test renders before and after."

[[files]]
path = "packages/tui/src/components/editor.ts"
change = "modified"
disposition = "ported"
evidence = ["test:tui/editor_oracle_test.go#TestEditorMatchesPiOracle", "test:tui/fake_cursor_test.go#TestMainScreenDrawsTheFocusedFakeCursorAndOmitsItWhenTheHardwareCursorIsShown"]
rationale = "42a3497d draws the Editor cursor as FAKE_CURSOR_START/END APC markers while focused (emitCursorMarker = this.focused). tui/editor.go emits the markers; the editor oracle fixture was re-recorded from the 42a build and differs from the 1.1.0 fixture only by the markers. Red before the port: 23 tui oracle tests (editor, input, settings, login, oauth, model selector marker diffs)."

[[files]]
