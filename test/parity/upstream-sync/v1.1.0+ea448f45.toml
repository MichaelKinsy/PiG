change = "modified"
disposition = "ported"
evidence = ["test:tui/fake_cursor_test.go#TestResolveFakeCursorsTable"]
rationale = "42a3497d exports the fake-cursor markers and resolveFakeCursors from the package index; tui/widthx/cursor_marker.go carries FakeCursorStart/End, RenderFakeCursor and ResolveFakeCursors, exercised by the table test."

[[files]]
path = "packages/tui/src/keys.ts"
change = "modified"
disposition = "ported"
evidence = ["test:tui/keys_oracle_test.go#TestParseAndMatchKeyMatchPiOnSeededInput"]
rationale = "42a3497d reports a shifted symbol as Shift plus its physical key in Kitty and modifyOtherKeys, matches bindings by the logical symbol, accepts unmodified printable modifyOtherKeys input, and parseKeyId takes leading modifiers only and rejects repeats and unknown prefixes. tui/key_match.go and key_parse.go port it. The seeded comparator gained 21 shifted symbols x 11 modifiers in both encodings; it was red on ctrl+ctrl+a, ctrl+meta+c, '+' and modifyOtherKeys before the port."

[[files]]
