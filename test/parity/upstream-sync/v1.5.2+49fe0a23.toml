evidence = ["test:internal/codingagent/tools/read_streaming_test.go#TestReadStreamingRejectsWhenAbortedWhileOpeningTheFile", "test:internal/codingagent/tools/read_streaming_test.go#TestReadStreamingStopsReadingALocalFileWhenAbortedMidRead"]
rationale = "ef9361ab7 (#12025, #11956) stops giving the file stream the abort signal: a stream destroyed by an aborted signal emitted an unhandled 'error' that exited pi, and the read loop already checks the signal between chunks. That is a Node EventEmitter failure; ReadTool.Execute (read.go) already returns \"Operation aborted\" on ctx.Err(), reads no further chunk (selectLinesFromStream checks ctx before each Read) and closes the stream (deferred Close). Pi's two read-streaming cases (abort while the file is opened; abort mid-read of a 1 MB file, one chunk read) are ported with the same inputs and pass unchanged on next."

