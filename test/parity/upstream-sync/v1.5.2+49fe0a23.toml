[[files]]
path = "packages/durable/src/signals.ts"
change = "added"
disposition = "ported"
evidence = ["test:durable/harness/harness_signals_test.go#TestDefineSignal", "test:durable/harness/harness_signals_test.go#TestSignalDelivery", "test:durable/harness/harness_signals_test.go#TestSleepingOnSignals", "test:durable/harness/harness_submission_notify_test.go#TestSubmissionsThatNotifyATask"]
rationale = "473515f9c adds signals: typed JSON values delivered to a live task and kept in its memos `pi.signal.<name>/<key>` until a wake uses them. durable/signals.go ports defineSignal (panics where Pi throws a TypeError), deliverSignal (not_found, closed for a terminal, completing, or abort-marked task or an expired key, invalid for a value outside the schema, duplicate, a delivery after the deadline closing the key), readSignal (migration, newer-version and missing-migrate errors), checkSleep, sleepDue, sleepWake, and the built-in SubmissionSettled signal, named SubmissionSettledSignal because Go's SubmissionSettled is the settled result of Submission.Abort. A Go method cannot take a type parameter, so Tx.SignalErased, TaskRuntime.ReadSignalErased, HookApi.ReadSignalErased and Harness.SignalErased take an erased token and durable.Signal, durable.ReadSignal and harness.Signal are the typed calls. SubmissionSettledSignal is upstream's `SubmissionSettled` under a Go name, which the settled result of Submission.Abort already holds; its wire name `pi.submission-settled`, version 1, and schema are Pi's, so no stored record, delivered value, or error text differs."

[[files]]
path = "packages/durable/src/harness/parks.ts"
change = "added"
disposition = "ported"
evidence = ["test:durable/harness/harness_tool_parks_test.go#TestToolParksInvalid", "test:durable/harness/harness_tool_parks_test.go#TestToolParksWrappers"]
rationale = "473515f9c adds the park shape check and wrapComposite: wrappers never park, a composite's park its base did not return is invalid_park. durable/harness/parks.go keeps the park a pointer (ToolExecutionResult.Park, because a Go tool returns one struct where Pi returns a result or a park object) so identity tells a base's park from a wrapper's; the run's park set travels on the run's api and, for a wrapper that hands its base another api, on the call's context. Go forced shapes here, none observable against Pi: ToolExecutionResult.Park is a pointer on the one result struct because a Go return holds one type, where Pi tells a park from a result by its `sleep` or `wait` key; the park set rides on the api or the context because Go has no spread-and-pass api object or own symbol property; and a Park holding neither Sleep nor Wait, which Pi's types forbid and which Pi meets as a TypeError at `(sleep ?? wait)!.checkpoint`, is an invalid_park result with the text `a park has either sleep or wait, but this one has neither`, a text Pi has no counterpart for (the `both` and result-field texts are Pi's, verbatim)."

[[files]]
path = "packages/durable/src/harness/tool.ts"
change = "modified"
disposition = "ported"
evidence = ["test:durable/harness/harness_tool_parks_test.go#TestToolParksOnASignal", "test:durable/harness/harness_tool_parks_test.go#TestToolParksNestedCalls", "test:durable/harness/harness_tool_parks_test.go#TestToolParksOnTasks", "test:durable/harness/harness_tool_parks_test.go#TestToolParksCancel", "test:durable/harness/harness_tool_parks_test.go#TestToolParksWaking", "test:durable/harness/harness_tool_gates_test.go#TestToolGatesBeforeToolSleep", "test:durable/harness/harness_park_children_test.go#TestParkChildrenNestedCallsWithoutWaiting", "test:durable/harness/harness_park_children_test.go#TestParkChildrenTasksCreatedUnderAKey", "test:durable/harness/harness_park_children_test.go#TestParkChildrenAfterARestart"]
rationale = "473515f9c: pi.tool version 4 with the `parked` phase and the wake and checkpoint of `execute`; a tool's execute may park (sleep or wait) and runs again when woken with api.wake and api.checkpoint; cancel cleans up the external work of an aborted parked call in a context only the Harness close cancels; beforeTool gates may sleep (parkAtGate); executeTool with wait false returns a NestedToolCall; createTask takes a key; explicit keys after a wake; durationMs spans the call from its first run (startedAt) to its result. tool.go and tool_nested.go port each; Pi's overload `executeTool({ wait: false })` is ExecuteToolNoWait and `createTask({ key })` is CreateTaskErased with ToolTaskOptions, because a Go method has one result type and one options type. durationMs stays an *int64 as in every Go tool-result and message type; the span is rounded to whole milliseconds, where Pi stores `runtime.now() - startedAt` unrounded, so the values differ only under a Harness clock that returns fractional milliseconds (Date.now() and the Go default clock return whole ones)."

