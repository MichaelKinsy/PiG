rationale = "ef9361ab7 (#11956): buildSessionInfo no longer hands the picker's signal to the file stream, checks it per line and after the loop, and destroys the stream in a finally (the old early return for a file whose first entry is not a session header left the stream open, leaking its descriptor, and a later abort crashed pi with an unhandled stream 'error'). summarizeSessionFileWith (session_resume.go) opens with a deferred Close, closes the file on abort through context.AfterFunc and returns ctx.Err(), so it neither leaks on the early return nor has an unhandled-error path. Pi's file-operations case (list a directory holding a 1 MB non-session .jsonl, then abort) is ported and passes unchanged on next."

