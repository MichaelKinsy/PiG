rationale = "worker.ts is the worker thread's entry: it reads workerData, starts startVm with an Atomics interrupt flag, relays host messages to the session and posts a `crash` message when startVm rejects. PiG runs the VM in this process on a goroutine (workerChannel.run in codemode/workerlauncher.go) with an atomic flag, delivers results through a channel, and reports a VM that cannot start as a sandbox error. Only the text of that error differs (`Failed to start the VM: <cause>` against `<Name>: <message>` of QuickJS.create), because the cause is an engine error: wazero and quickjs-wasi word it differently. The 1.1.0 change is the move of the VM driver into vm.ts, which codemode/vmdriver.go carries."

