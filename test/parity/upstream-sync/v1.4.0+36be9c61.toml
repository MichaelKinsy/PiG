change = "added"
disposition = "ported"
evidence = ["test:codemode/remote_protocol_test.go#TestWireMessagesHaveUpstreamsJSONShape", "test:codemode/remote_protocol_test.go#TestWireRepliesAndRequestsHaveUpstreamsJSONShape", "test:codemode/remote_protocol_test.go#TestVMMessagesRoundTripThroughTheWire", "test:codemode/bridge_test.go#TestReportsABrokenBridgeAsASandboxError"]
rationale = "Read against Pi protocol.ts: codemode/remote_protocol.go declares VmStartData (code, tools, globals, memoryLimitBytes, store, deterministic{startedAt, seed}), WorkerToHostMessage (call, output, done ok/error with during, crash, started, idle) and HostToWorkerMessage (result with ok, payload, seq, now, properties) with the same fields and JSON shapes; the wire tests check those shapes and a round trip. isWorkerToHostMessage/isHostToWorkerMessage check only the type upstream; Go carries an unknown type or a message lacking a required field unchanged (messageFromWire, remote.go:213) and the host fails the run as a broken bridge, covered by TestReportsABrokenBridgeAsASandboxError. WorkerData (the compiled wasm module and the SharedArrayBuffer interrupt flag) is specific to Bun/Node worker threads and has no Go counterpart: the Go VM seam is the vmdriver interface."

[[files]]
path = "packages/codemode/src/runtime/remote.ts"
change = "added"
disposition = "ported"
evidence = ["test:codemode/remote_vm_test.go#TestRemoteSandboxRunsToolsInTheCallerAndTheScriptOnTheRemote", "test:codemode/remote_vm_test.go#TestRemoteSandboxBatchesOutputInsteadOfMakingOneExchangePerLine", "test:codemode/remote_vm_test.go#TestRemoteSandboxCapsTheInterruptBudgetAndMemoryAtTheRemotesLimits", "test:codemode/remote_vm_test.go#TestRemoteSandboxTellsTheRemoteToStopWhenTheCallerAborts", "test:codemode/remote_test.go#TestAFailingOrVanishingRemoteIsASandboxError", "test:codemode/remote_serve_test.go#TestServedOutputIsBatchedByItemCount", "test:codemode/remote_serve_test.go#TestServedOutputIsFlushedAtTheCharacterLimit", "test:codemode/remote_serve_test.go#TestARejectedExchangeEndsTheServer", "test:codemode/remote_serve_test.go#TestTheRequestIsCappedAtTheRemotesLimits", "test:durable/core/host/cf/test/codemode-portable.test.ts#RemoteCodemodeSandbox tells the remote to stop when the caller aborts", "test:codemode/deterministic_test.go#TestDeterministicRunsApplyResultsInSeqOrderWhenTheTransportReordersRepliesSentInOrder"]
rationale = "The ea448f45 file is the remote protocol: RemoteCodemodeSandbox (tools in the caller, the VM on a remote), remoteLauncher with its exchange, and serveCodemodeRemote (the VM on the remote, output batched at 1,000 items or 1 MiB, the interrupt budget and memory capped at the remote's limits, a stop reply or a rejected exchange ends the run). codemode/remote.go, remote_serve.go, remote_serve_blocking.go, remote_types.go and remote_protocol.go carry them, and serve_tinygo.go serves a host that cannot block on an exchange (the Worker module). The Go tests port Pi's portable.test.ts RemoteCodemodeSandbox cases and the serve-side cases; the Worker host runs the same cases through the TypeScript client (RemoteCodemodeSandbox ported verbatim) against the module. Difference: RemoteExchange is a callback taking the reply, where Pi's is a Promise, which keeps Pi's order of calls and the single reply. Pi 1.2.0's serveCodemodeRemote buffers `started` with the output and sends `idle` at once like a call (a host replaying a script waits for it), and the remote launcher forwards both; codemode/remote_serve.go and remote.go do the same, and the deterministic test runs a start() run over the remote with replies that arrive out of order."

[[files]]
path = "packages/codemode/src/runtime/vm.ts"
change = "added"
disposition = "ported"
evidence = ["test:codemode/job_poll_test.go#TestExecutePendingJobsPollsTheInterruptEveryFiftyJobs", "test:codemode/job_poll_test.go#TestAMicrotaskSpinEndsAtTheJobPollNotTheHardStop", "test:codemode/engine_exports_test.go#TestQJSExportsMatchTheWorkerHost", "test:codemode/remote_serve_test.go#TestTheStartDataReachesTheVM", "test:codemode/nested_error_output_test.go", "test:codemode/deterministic_internal_test.go#TestPrngIsMulberry32LikePis", "test:codemode/deterministic_internal_test.go#TestRandomGetFillsFourBytesPerDrawLikePis", "test:codemode/deterministic_internal_test.go#TestPreludeHashIsFNV1aOverUTF16UnitsLikePis", "test:codemode/deterministic_internal_test.go#TestTheVirtualClockReadsLikePis", "test:codemode/deterministic_test.go#TestDeterministicRunsMakeTheSameCallsAndOutputForTheSameStartSeedAndResults", "test:codemode/deterministic_test.go#TestDeterministicRunsRunInUTCWhateverTheHostsTimezoneAndWithoutWeakRef", "test:codemode/deterministic_test.go#TestDeterministicRunsApplyResultsInSeqOrderWhateverOrderTheyAreDeliveredIn"]
rationale = "The ea448f45 file is the QuickJS driver that worker.ts used to hold, now shared by the worker thread and the inline sandbox: startVm creates the VM with the memory limit, the stack guard and the interrupt handler, runs the prelude, evaluates the script, delivers replies, drains the job queue in batches of fifty between polls, and reports a failed job as a crash and a script error as a done message. codemode/vmdriver.go (startVm, VmSession) and engine.go carry it. The tests assert the fifty-job poll, that a microtask spin ends at the poll and not at the hard stop, the QuickJS export set the driver calls, that the start data reaches the VM, and the error reporting. Pi 1.2.0 adds the deterministic mode (0fb1aee7): the WASI clocks read virtual time (a seed-derived reading while the context is created), random_get draws from mulberry32 over the seed, the timezone is UTC, WeakRef and FinalizationRegistry are left out, results are applied strictly in seq order, and the VM reports `started` with its fingerprint and `idle` after each drain. codemode/deterministic.go, engine.go and vmdriver.go carry it; the internal tests pin the PRNG, random_get, the prelude hash and the clock against values computed with Pi's vm.ts, and Pi's deterministic.test.ts cases run on the worker and the remote backends."

