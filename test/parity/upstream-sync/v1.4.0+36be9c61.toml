evidence = ["test:durable/harness/harness_telemetry_admission_test.go#TestDurableTelemetryStartsEachQueuedInputsRunInItsAdmissionTraceAndLinksInputRootsToTheirCaller", "test:durable/harness/harness_telemetry_admission_test.go#TestDurableTelemetryLinksTheOtherQueuedInputsToTheFirstInvocationOfTheirSharedRun", "test:durable/harness/harness_telemetry_admission_test.go#TestDurableTelemetryLinksASteerAdmissionToTheCurrentRunWithoutMovingItsWorkIntoTheSteersTrace", "test:durable/harness/harness_telemetry_admission_test.go#TestDurableTelemetryRecordsCheckpointsOnlyWhenTheRunningPhaseChanges", "test:durable/harness/harness_telemetry_admission_test.go#TestDurableTelemetryMarksOnlyTheFirstInvocationAfterReopenResumedRetainingItsStoredParent", "test:durable/harness/harness_read_only_test.go#TestReadOnlyHarness"]
rationale = "Pi 2ec55d80 wraps each phase in a pi.durable.phase span (parents from the stored task trace, links for shared runs and steers, outcome aborted, waiting or sleeping at a wait, restart or close, a resumed mark on the first invocation after reopen) and adds the checkpoint event after the runtime commit. durable/harness/scheduler.go ports it: the phase span covers the handler plus its decision commit and settles before the next phase starts. Go runs each invocation on its own goroutine (D181), so the tests match phases to tasks by task.id. Pi be14d9732 (HarnessOptions.readOnly): TaskSchedulerOptions.ReadOnly makes Open only load live tasks (a running task stays as committed, no restart counted, no reconcile, no wake), Resume fail with ReadOnlySession (Resume panics as resume() throws; TryResume returns it for the callers that are async upstream), Wake always inactive, and scheduleReconcile and scheduleWake do nothing; TestReadOnlyHarness drives each of these from a viewer of a session whose generation runs in another Harness."

