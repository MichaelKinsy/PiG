evidence = ["test:codemode/inline_test.go#TestInlineSandboxFailsAScriptThatComputesPastItsInterruptBudgetAsATimeout", "test:codemode/inline_test.go#TestInlineSandboxCountsTheBudgetAcrossWaitsOnTools", "test:codemode/inline_test.go#TestInlineSandboxChecksTheDeadlineBetweenTurnsLikePi", "test:codemode/inline_test.go#TestInlineSandboxUsesItsWasmLoader", "test:codemode/inline_consts_test.go#TestInlineConstantsArePis", "test:codemode/inlinechannel_test.go", "test:durable/core/host/cf/test/codemode-portable.test.ts#InlineCodemodeSandbox fails a script that computes past its interrupt budget as a timeout", "test:codemode/deterministic_test.go#TestDeterministicRunsReportTheFingerprintBeforeAnyCallAndTheCallsIssuedAfterEachResult"]
rationale = "The ea448f45 file runs a VM on the calling thread: InlineCodemodeSandbox, inlineLauncher, DEFAULT_INTERRUPT_BUDGET (100,000 polls) and INLINE_MAX_STACK_SIZE, with a poll counter that fails the execution with kind timeout and 'Execution exceeded its interrupt budget of N', and messages delivered in a microtask so host code never re-enters the VM. codemode/inline.go, inlinechannel.go and inline_consts.go carry them. The tests port Pi's portable.test.ts InlineCodemodeSandbox cases (the budget message for `while (true) {}` and `while (true) await null`, the budget counted across waits on tools), the deadline checked between turns, and that the wasm option is the loader the sandbox calls. The Worker host runs the same cases on the codemode module. Pi 1.2.0 passes the launcher's interruptBudget to startVm, where it is part of a deterministic run's fingerprint (`budget N`); codemode/inlinechannel.go passes it the same way."

