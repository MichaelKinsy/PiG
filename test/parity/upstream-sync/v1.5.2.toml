[[files]]
path = "packages/coding-agent/src/core/agent-session-runtime.ts"
change = "modified"
disposition = "ported"
evidence = ["test:coding/session_import_test.go#TestImportFromJsonlMissingCwdNeedsOverride"]
rationale = "Pi 4ea883792 (#11975): importFromJsonl removes the copy it made when the session cwd check fails (a source already in the session directory is kept), so a retry with a cwd override or a fork leaves no stray s.jsonl/s-1.jsonl pair (coding/session_import.go). The ported suite case \"leaves no copy behind when an import fails on a missing session cwd\" is TestImportFromJsonlMissingCwdNeedsOverride (the failed import leaves no file; the retry opens s.jsonl, not s-1.jsonl)."

[[files]]
path = "packages/coding-agent/src/core/session-cwd.ts"
change = "modified"
disposition = "ported"
evidence = ["test:internal/codingagent/session_cwd_pi_test.go#TestMissingSessionCwdMessagesMatchPi", "test:internal/codingagent/session_cwd_resume_upstream_test.go#TestMissingSessionCwdOptionsNameTheCurrentCwd"]
rationale = "Pi 4ea883792 (#11975): formatMissingSessionCwdPrompt is `Session cwd does not exist: <cwd>` and getMissingSessionCwdOptions offers Continue in <cwd> (asks again next time), Fork into <cwd> (new session ID, original kept) and Cancel (undefined); internal/codingagent/session_cwd.go FormatMissingSessionCwdPrompt, MissingSessionCwdChoice and GetMissingSessionCwdOptions, pinned by the two tests."

[[files]]
path = "packages/coding-agent/src/main.ts"
change = "modified"
disposition = "ported"
evidence = ["test:coding/cli/startup_session_test.go#TestApplyMissingCWDChoiceContinuesOrForks"]
rationale = "Pi 4ea883792 (#11975): the interactive startup prompt for a session whose cwd is gone offers Continue, Fork and Cancel; Continue opens the Session with the current cwd, Fork is forkSessionOrExit into the current cwd (coding/cli/main.go, startup_session.go applyMissingCWDChoice: new id, parentSession the original, copy stored in the current session dir, original unchanged), Cancel exits 0. TestApplyMissingCWDChoiceContinuesOrForks pins both choices; the old promptForMissingSessionCwd helper is gone."

[[files]]
path = "packages/coding-agent/src/modes/interactive/interactive-mode.ts"
change = "modified"
disposition = "ported"
evidence = ["test:internal/codingagent/session_cwd_resume_upstream_test.go#TestResumeWithAMissingCwdForksIntoTheCurrentCwdAndLeavesTheOriginalUnchanged", "test:internal/codingagent/session_cwd_resume_upstream_test.go#TestResumeWithAMissingCwdContinuesTheOriginalInTheCurrentCwdWithoutWritingAFile", "test:internal/codingagent/session_cwd_resume_upstream_test.go#TestResumeWithAMissingCwdRemovesTheForkWhenAnExtensionCancelsTheSwitch", "test:internal/codingagent/session_cwd_resume_upstream_test.go#TestResumeWithAMissingCwdCreatesNoForkWhenTheUserCancels", "test:internal/codingagent/slash_session_handlers_test.go#TestImportHandlerForksIntoTheCurrentCwd"]
rationale = "Pi 4ea883792 (#11975): promptForMissingSessionCwd is a Continue/Fork/Cancel selector and switchToForkedSession forks into the current cwd, switches, and drops the fork when an extension vetoes the switch; /resume, ctx.switchSession (resumeThroughRuntime in internal/codingagent/extension_session_replacement.go) and /import (importHandler, SlashContext.ForkSession) use it, with the statuses `Resumed session in <cwd>` and `Forked into new session <id> in <cwd>`. The four cases of interactive-mode-resume-missing-cwd.test.ts are ported with the same inputs (fork leaves the original unchanged, continue writes no file, a vetoed switch removes the fork, cancel creates none); the import-command test's type-only change needs no port."
