change = "modified"
disposition = "ported"
evidence = ["test:tui/markdown_image_hard_break_port_test.go#TestMarkdownKeepsHardBreaksAfterInlineImageAsSeparateRows"]
rationale = "5b4d7d3df (#12045): an image line skips wrapping, so rows joined to it by hard breaks drew over the image; the line is split at \"\\n\" before layout and each piece is laid out as its own row. markdown_resume.go layoutRows does the same, and Pi's test is ported."

[[files]]
path = "packages/tui/src/tui-alt-screen.ts"
change = "modified"
disposition = "ported"
evidence = ["test:tui/kitty_full_redraw_port_test.go#TestAltScreenKeepsUploadedKittyImagesAcrossFullRedraw"]
rationale = "be2744d95 (#12047): Kitty frees image data without placements on ED 2, so a full redraw that deleted placements and then cleared the screen broke placement-only reuse; with uploaded Kitty images the redraw now deletes the placements and skips the screen clear. TuiAltScreen.doRender does the same, and Pi's test is ported. Oracle-vs-next gap: the vendored alt-screen fixture is Pi 1.5.2, which predates #12047 and still clears the screen with ESC[2J, so checkAltScreenOracleIn (alt_screen_oracle_test.go) ends the byte comparison of a Kitty scenario at the first step that differs only by that clear, and skips the later Kitty scenarios, whose image registry no longer matches the fixture's; recordings for the term corpus still replay every scenario. The comparison returns in full when the oracle pin passes #12047."

[[files]]
path = "packages/coding-agent/src/core/export-html/ansi-to-html.ts"
change = "modified"
disposition = "ported"
evidence = ["test:internal/codingagent/export/ansi_links_port_test.go#TestAnsiToHTMLConvertsOSC8HyperlinksToAnchors", "test:internal/codingagent/export/ansi_links_port_test.go#TestAnsiToHTMLKeepsStyledTextNestedInAnchorAndClosesUnterminatedLink", "test:internal/codingagent/export/ansi_links_port_test.go#TestAnsiToHTMLDropsUnsafeSchemesAndOtherEscapeSequences"]
rationale = "0e1e3fc81 (#12052): the converter matches SGR, other CSI, OSC and APC sequences; OSC 8 links with http, https or mailto URLs (C0 controls stripped before the scheme check) become anchors around the current span and other sequences and stray ESC are dropped. ansiToHTML in ansi_html.go does the same, and Pi's three tests are ported. Oracle-vs-next gap: the vendored oracle is Pi 1.5.2, which predates #12052, so TestAnsiToHTMLMatchesPiOracle skips the inputs with an ESC outside a complete SGR sequence and TestToolHTMLRendererMatchesPi no longer feeds the OSC 8 line; ansi_links_port_test.go and the ported tests cover those inputs, and the oracle comparison returns in full when the oracle pin passes #12052."

