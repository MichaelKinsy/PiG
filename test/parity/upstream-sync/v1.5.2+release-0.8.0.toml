[[files]]
path = "packages/coding-agent/src/core/agent-session.ts"
change = "modified"
disposition = "ported"
evidence = ["test:coding/mcp_restore_own_tool_port_test.go#TestAgentSessionMCPToolsAfterResumeAndReloadKeepsRestoredToolsWhenAnExtensionDeactivatesOnlyItsOwnToolBeforeTheyRegister", "test:coding/mcp_restore_own_tool_port_test.go#TestAgentSessionMCPToolsAfterResumeAndReloadKeepsToolsToolSearchLoadedAfterReloadWhenAnExtensionDeactivatesOnlyItsOwnTool"]
rationale = "3345c2925 (#12054): a loadout change dropped the pending restored tools when it deactivated any active tool, so an extension hiding its own loader tool at session_start lost the MCP tools tool_search had loaded. Session.restoredToolNames (set by applyTranscriptTools and refreshTools after a reload) holds the restored loadout, and SetActiveToolsByName drops the pending tools only when a tool of it is deactivated. Pi's two dropLoader tests are ported."

[[files]]
path = "packages/durable/src/env/node.ts"
change = "modified"
disposition = "ported"
evidence = ["test:durable/env/node/list_race_port_test.go#TestListDirLeavesOutAnEntryRemovedBetweenEnumerationAndLstat", "test:durable/env/node/list_race_port_test.go#TestListDirLeavesOutANonUTF8Name"]
rationale = "75ca6e7d0 (#12055): NodeExecutionEnv.listDir leaves out an entry whose lstat reports ENOENT instead of failing. NodeExecutionEnv.ListDir does the same, and Pi's test is ported with a hook that runs the rename before the lstat. Node decodes a non-UTF-8 name with replacement characters, so its lstat finds nothing and the entry is left out; the local ListDir now skips such names too (TestListDirLeavesOutANonUTF8Name), as the remote env already did."

