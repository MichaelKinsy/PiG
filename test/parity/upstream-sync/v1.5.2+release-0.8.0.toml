rationale = "64c96d00d (#11961): beforeClose joins the task invocations, then releases the pi-ai resources of every provider session the Harness's tasks used (cleanupSessionResources per session id, a failure reported as host_error for models), so none close while in use and none outlive the Harness. harness.go BeforeClose runs Join, then ai.CleanupSessionResources for each recorded id and reports a failure the same way; the three Pi cases (after running tasks join, when the Harness fails, not another Harness's) are ported."

