[[files]]
path = "packages/coding-agent/src/core/tools/find.ts"
change = "modified"
disposition = "ported"
evidence = ["test:internal/codingagent/tools/find_leading_dot_slash_port_test.go#TestFindIgnoresLeadingDotSlashInPattern"]
rationale = "bbfc6c7ce (#12044): fd's full paths never contain \"/./\", so a pattern starting with \"./\" found nothing; the tool drops every leading \"./\" after the Windows separator normalisation and before choosing --full-path. newFindFdInvocation does the same, and Pi's three patterns and the \"./*.json\" case are ported."

