rationale = "75ca6e7d0 (#12055): RemoteExecutionEnv.listDir leaves out an entry the daemon reports as ENOENT and fails on any other entry error. RemoteExecutionEnv.ListDir does the same, tested through a scripted daemon; the differential non-UTF-8 case now expects those names left out."

[[files]]
path = "packages/durable/src/harness/scheduler.ts"
change = "modified"
disposition = "ported"
evidence = ["test:durable/harness/scheduler_scope_above_test.go#TestAddScopesAboveCostDoesNotGrowWithTheChain", "test:durable/harness/scheduler_scope_above_test.go#TestAddScopesAboveMatchesAWalkUp"]
rationale = "628d8ab52ce2: #addScopesAbove starts at record.conversationId, because a child task lives in its owner's conversation, and walks conversation by conversation through the owner edge and the owner task's node, so a change deep in an owner chain costs the conversations above it, not the chain's depth. addScopesAboveLocked (scheduler_idle.go) does the same; it replaces this line's earlier walked-set variant: nothing is kept, and an unknown owner task in the middle of a chain no longer makes the walk fail, as in Pi. scheduler_scope_above_test.go (from next) gates the walk's allocations at depth 10 and 5,000 and compares it with a walk up. Pi's commit carries no test. The Rust daemon change of b48c675a912f (packages/env/daemon/src/{exec,output,process,pty}.rs, test/process.test.ts) is outside the tracked source files; env/daemon/{output,process,pty}.go port it. 64c96d00d (#11961, Harness close): the scheduler owns the Harness's providerSessionIds and associates every task runtime it builds with that set; scheduler.go holds the set and attaches it to the context every invocation's Signal derives from."

