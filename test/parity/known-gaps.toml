#
# Known parity gaps against the pinned Pi version.
#
# Each gate downgrades exactly the keys listed for its scope from failures to
# logged notes (test/parity/knowngaps). Any gap NOT listed here fails its gate, and
# any key listed here that the gate no longer observes (because the gap was
# fixed) also fails, so this file can only shrink. Remove an entry in the same
# change that closes it. pi_version must equal coding.UpstreamVersion.
#
# Scopes: "upstream-parity" (test/upstream-parity), "correspondence"
# (test/parity/cmd/correspondence compare; keys are report finding IDs), and
# "tui-keybindings" and "app-keybindings" (the keybinding inventory tests).
#
# Each entry needs: scope, key (what the gate reports), tracking (issue URL once
# the repository is public; until then the delivery/unresolved.tsv row), and why.

pi_version = "0.87.1"

[[gap]]
scope = "upstream-parity"
key = "api:OnCacheWarmingDecision"
tracking = "unresolved.tsv: Extension boundary events"
why = "Generic cache_warming_decision handlers are dispatched by coding.Session.decideCacheWarming across the subprocess SDKs and fused Go. The typed ExtensionAPI.OnCacheWarmingDecision registration overload is not declared."

[[gap]]
scope = "upstream-parity"
key = "api-count"
tracking = "unresolved.tsv: Extension boundary events"
why = "Total extension.API method count trails upstream by the api:* entries above."
