#
# Symbol map for docs/extension-sdk-surface.md (go run ./test/parity/cmd/sdksurface).
#
# The generator enumerates every extension-facing surface from Pi's types.ts.
# A row needs an entry here only where a runtime spells the surface
# differently from the default naming rule (pi.x -> Extension.X / Context.X,
# ctx.ui.x -> Context.X, snake_case in Rust and Python, the Node runtime's
# `pi` object and classes), or where its realization is a stand-in.
#
# An entry never decides a status by itself: the generator looks each named
# symbol up in the runtime's source, and a symbol that does not exist is
# `missing`. Symbol notation per runtime:
#   node:   api.key, Class.member, read:obj.prop (a property the runtime reads)
#   go:     Name, Type.Method, Type.Field
#   rust:   name, Type::method, Type.field
#   python: name, Class.member, Class.method(param)
# "a|b" lists alternatives. `wire` names the host decoding the value crosses
# (extension.Type.field or subprocess.Type.field, JSON names; literal:name for
# a string the host reads; none), and a field the host drops is `missing`.
# `partial`/`<runtime>_partial` make a cell a stand-in with that reason.

