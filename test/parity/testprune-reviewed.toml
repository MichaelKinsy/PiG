# Reviewed per-file ledger for testprune lint: each entry satisfies the expected-value finding of exactly one commit+path.

[[entry]]
path = "coding/extension/host/subprocess/report_error_extension_tag_test.go"
commit = "447a4edc2103a0899bf453bd9b706a4248a67f55"
class = "NOBEHAVIOR"
cite = ""
reason = "The extension tag of a report_error notification (ReportErrorPayload.Extension) is PiG's own wire field between the Node runtime and the Host: Pi has no process boundary and no counterpart, so no Pi line governs it. The commit bounds the tag to the extensions of the connection's own process, so the test's expected values change from attributing a foreign name's report to that extension to the connection's own extension; the order of the errors, which is Pi's (loader.ts runtime.reportError is synchronous), is not touched."

[[entry]]
path = "coding/extension/host/subprocess/report_error_extension_tag_test.go"
commit = "95a798f82a3974bbbc085c399bba3fadfcae89a9"
class = "NOBEHAVIOR"
cite = ""
reason = "The refusal of a foreign report_error tag is PiG's own wire diagnostic: Pi has no process boundary and no tag, so no Pi line governs it. The commit sends the diagnostic through the runner's error listeners (the path of every extension error, which is Pi's runtime.reportError to emitError) instead of the Host's raw stderr line, so the test's expected values change from a stderr line to an extension error followed by the report, in order, and an empty stderr."

[[entry]]
path = "coding/cli/rpc_shutdown_test.go"
commit = "5b8189f98ae763aca14843a8feefe94bc5752c59"
class = "CITE"
cite = "packages/coding-agent/src/modes/rpc/rpc-mode.ts:383"
reason = "The pin contains Pi main ace560c30. Pi keeps the signal handlers until exit and counts signals (rpc-mode.ts signalCount, shutdown() returns when shuttingDown): once a shutdown has started, a stdin end, a ctx.shutdown() request or a single SIGTERM does nothing and the dispose finishes, and only a repeated signal exits at once with 128+signum. TestRPCShutdownTriggers therefore expects a single signal and a stdin end during a started dispose not to interrupt it (the dispose then exits with the first trigger's status), a shutdown request during a stdin-end dispose to do nothing, and a repeated signal to exit 143 at once. Pi 1.5.0 takes the default signal action and exits 0 at once. Pi's own cases are rpc-prompt-response-semantics.test.ts:594, 613 and 631 at ace560c30."

