class = "CITE"
cite = "packages/chord/src/node/http/upgrades.ts:157"
reason = "Pi's error listener (upgrades.ts:156-157) leaves a socket that is already CLOSING alone, because ws has sent the protocol close code (1009 for an oversized frame); the Go test therefore expects the peer to see 1009 and, as its comment says, the server's own close event to report 1006. That 1006 is ws's behaviour, not a Pi line: Pi's pinned ws 8.21.0 (packages/chord/package.json:169; archive integrity as in the Pi package-lock.json entry node_modules/ws, sha512-Vsp28b7D...zCH+g==, checked against the registry tarball) starts every WebSocket with _closeCode = 1006 (lib/websocket.js:58), receiverOnError (lib/websocket.js:1201-1212) removes the socket's 'data' listener and calls websocket.close(1009), so the peer's close frame is never read, and only receiverOnConclude copies a received close frame's code into _closeCode (lib/websocket.js:1173); the 'close' event then emits 1006 (lib/websocket.js:269, 279). The commit's other expected value, the test and symbol rename, tracks the same behaviour. Pi's own test asserts only the client's 1009 (test/node/http/upgrades.test.ts:206)."

