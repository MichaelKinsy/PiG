[[entry]]
path = "coding/extension/host/subprocess/generation_supersede_test.go"
commit = "6f9fe4304ad1246a6358e2b265183bc0fcb5ad3b"
class = "NOBEHAVIOR"
cite = ""
reason = "No Pi behavior changed. PiG-additive behavior changed: a Node runtime that misses the deadline of the reload acknowledgement was ended through the crash path (a crash report holding extension_unresponsive, a crash notice, a counted crash) -> the reload ends that extension instance itself, answers each request in flight once with an ExtensionUnresponsiveError that carries the deadline, returns the unacknowledged generations, names each in one line of the reload report, and records no crash; record: docs/additive-features.md D19 \"Reload acknowledgement\" and D21 (the line of the reload report), changed in the same commit. The ledger has no class for a PiG-additive behavior change; the row is NOBEHAVIOR on the precedent of the rows of 7feee9716200: Pi's runner.invalidate() is synchronous (agent-session.ts:3825-3826) and Pi has no runtime that can fail to acknowledge, so no Pi line governs the test. Old expected values: the connection's failure is an ExtensionUnresponsiveError whose Operation contains `acknowledge`, and the crash handler is told a reason that contains `extension_unresponsive`. New expected values: the error's ReloadDeadline is 1s (the pong deadline of the connection), supersedeGenerations returns exactly the one generation that did not acknowledge with that deadline (and none where the runtime acknowledged), the request in flight is answered once with `did not acknowledge a reload within 1s` and a request id, and the crash handler is told nothing. The new assertion is not weaker: two substring checks become exact values of the error and of the returned generation, the read loop must have ended before the crash handler is checked, and a crash report, which the old test required, now fails the test; the comments name the mutations that turn each check red."

[[entry]]
path = "coding/extension/host/subprocess/retention_dead_share_reload_test.go"
commit = "7c24a924a9f3b784e3748673bb1982fc9bdb7b62"
class = "NOBEHAVIOR"
cite = ""
reason = "No Pi behavior changed. PiG-additive behavior changed: the connection loop of a member of a killed Node cell reported that member at once as disabled until /reload, and the watcher of the process then reported it again as restarting (four notices for a cell of two in 86 of 100 kills) -> the connection loop waits for the process and leaves the report to the watcher, one notice for each member, and a cell whose process ends just before a /reload is restarted by that reload with no notice; record: docs/additive-features.md D19 (the paragraph on retained processes, which names this test; changed in the same commit) and docs/runtime-cell-reload.md (`restarted by that reload without a notice of the exit`), whose sentence was written after the commit, in dcbd8560aa91 on the same line. The ledger has no class for a PiG-additive behavior change; the row is NOBEHAVIOR on the precedent of the rows of 7feee9716200: Pi runs an extension in its own process and has no runtime cell, so no Pi line governs the test. Old expected value: one crash notice for each member after the kill (`crash notices after killing the Node cell = %v, want %d`), which was how the test reached its window. New expected value: one handled closed connection for each member, counted through Host.deathGate (`members whose closed connection the host handled after the Node cell was killed = %v, want %d`), and after the reload no crash notice for any member. The new assertion is not weaker: the count of members is the same and is taken at the event that withdraws the process from retention claims, the refusal of the unreaped process is unchanged, and the test adds the requirement that the end of the replaced process is reported for no member, which the old test did not check."

