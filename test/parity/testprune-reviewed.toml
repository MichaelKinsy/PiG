reason = "The pin contains Pi main ace560c30. Pi keeps the signal handlers until exit and counts signals (rpc-mode.ts signalCount, shutdown() returns when shuttingDown): once a shutdown has started, a stdin end, a ctx.shutdown() request or a single SIGTERM does nothing and the dispose finishes, and only a repeated signal exits at once with 128+signum. TestRPCShutdownTriggers therefore expects a single signal and a stdin end during a started dispose not to interrupt it (the dispose then exits with the first trigger's status), a shutdown request during a stdin-end dispose to do nothing, and a repeated signal to exit 143 at once. Pi 1.5.0 takes the default signal action and exits 0 at once. Pi's own cases are rpc-prompt-response-semantics.test.ts:594, 613 and 631 at ace560c30."

