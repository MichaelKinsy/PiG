reason = "The commit changes one expected value, the message of TestCodexWebSocketReadErrorAfterLeadingRateLimitsEndsTheMessage's result: result.ErrorMessage 'WebSocket closed 1006' became 'WebSocket error' (the Fatalf format only gained the events). Pi's onError handler (openai-codex-responses.ts, `failed = extractWebSocketError(event)`) ends the message with extractWebSocketError's text, and that function returns `new Error(\"WebSocket error\")` (line 1289 of the pinned file, 1291 with the bb1a2b3542b5 mirror block, which adds two lines above it) when the error event carries no message and no nested error; extractWebSocketCloseError (`WebSocket closed<code>`, 1302 of the pinned file) is reached only through a close event with no earlier error. The oracle's fake socket dispatches a close event with code 1006, so Pi with bb1a2b3542b5 ends 'WebSocket closed 1006' there; the test's hermetic peer drops the TCP connection, which Node reports as an error event without a message, so the same Pi code ends 'WebSocket error'. The commit's message and the comment on the changed line say the same. Observed on the oracle (Pi 1.5.2 with the backport blocks, bb1a2b3542b5 included; probe: its openai-codex-responses stream, transport auto, against a local peer that completes the upgrade, reads the request frame, sends the codex.rate_limits event and then destroys the TCP socket with no close frame, the sequence of the Go test peer): stopReason error, errorMessage 'WebSocket error', events start then error, one upgrade, no fetch, one provider_transport_failure diagnostic with the Error 'WebSocket error' raised in extractWebSocketError from onError; the same peer ending with a close frame of code 1000 gives 'WebSocket closed 1000' (extractWebSocketCloseError). No Pi behavior changed: the expectation follows the transport the test drives."

