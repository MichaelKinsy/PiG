reason = "The changed literal is the failure message of an allocation ceiling, not an expectation: the ceiling (6.0 allocated bytes per source byte of the branch) and the assertion are unchanged. Pi holds every entry decoded and has no such test. The commit makes SessionManager.Clone stream each record from the source to the clone's file and open that file as a resume does, instead of rewriting every record member by member, canonicalizing it and decoding it again, so the message no longer names the cost that exceeded the ceiling."

