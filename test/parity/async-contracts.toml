[[files]]
path = "packages/env/src/connection.ts"
disposition = "translated"
contracts = ["awaited", "cancellable", "detached-owned"]
evidence = ["test:env/connection_start_sharing_test.go#TestConnectionSharesOneStartForgetsAFailedOneAndStartsAgainAfterALoss", "test:env/connection_cancelled_request_test.go#TestRequestWithACancelledContextIsStillSentOnAStartedConnection", "test:env/connection_cancelled_request_test.go#TestRequestCancelledWhileTheDaemonStartsWaitsForTheStart", "test:env/connection_request_test.go#TestConnectionKillEndsAnExecStartedWithOnStart", "test:env/connection_session_test.go#TestConnectionSessionReportsAStartFailure", "test:env/connection_session_test.go#TestRequestOptionsSessionFailsWithTheLostMessageForAStaleOrDeadSession", "test:env/regressions_test.go#TestConnectionReportsADaemonThatExitsBeforeItIsReady", "test:env/regressions_test.go#TestConnectionCountsBytesOfAFrameInProgressAsLife", "test:env/connection_teardown_signal_test.go#TestConnectionTeardownEndsTheDaemonWithSIGTERM"]
rationale = "Connection.info, session and request await #connect, whose one #ready promise is shared by concurrent callers, forgotten when the start fails and cleared by #teardown (:216-227, :307-314); Go's Info, Session and Request block on one shared readyStart that runStart fills on a goroutine owned by the Connection (Close cancels the command function's context, tears the session down and joins it). #connect takes no signal, so a cancelled Go context does not end the wait; the start ends at its 60 s timeout, a daemon exit or Close. #send (:230-251) registers the request, calls onStart, writes it and then sends cancel for an aborted signal, and the request still settles with the daemon's answer; Go's send does the same in that order and registers context.AfterFunc after the write, so a done context sends its cancel at once. Start returns the pending Call without waiting, and Request is Start plus Wait. #start races the hello against the start timer, the spawn error and the child's exit (:255-305); Go races the hello's Wait against the timer and makes the hello pending before the exit, output and ping goroutines run, so the first teardown decides the start failure as upstream's listener order does. The daemon's stdout, stderr, exit and the five-second ping run on goroutines owned by the session; each delivers through the same teardown that rejects every pending request with one error. Pi writes a ping before checking for silence, Go checks first: the daemon is killed at that tick either way. Delta at Pi 479d6e5e: the start fails on `close` (all stdio ended) instead of `exit` before `hello`, and a ready session still fails on `exit`; Go's reaper goroutine mirrors it by waiting for the stdout and stderr goroutines (stdoutDone, stderrDone, or the session's teardown) before the pre-ready failure and tearing down at once when ready; the captured stderr is added to the start's error in start(), after the select that waits for the hello, the reaper's failure or the start timeout."

