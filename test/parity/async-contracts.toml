rationale = "Session-replacing commands and export_html await off the input loop: a later command of their batch answers first, and replacements and compactions of one batch run in request order after the previous settled, with a fork resolving its entry in the Session that requested it (D146, D147). Pipelined set_model continuations resume in input order after the responses that synchronous handlers queued: auth checks run concurrently, but each settles from an executor event-loop task queued after the previous one's (rpcAwaitInOrder, jsloop.Loop.Macrotask). All 33 upstream command branches and their conditional await boundaries are inventoried in the dispatch report. Prompt/input/preflight and nested queue completions now resume through the same FIFO await executor as synchronous replies. Handler invocation is admitted in order through its first suspension; completion remains independently awaited. Preflight is idle, rechecks streaming after input, accepts before claiming the Agent, and drains on EOF. Model-cycle prefixes and notifications retain their ordering. Shell completion never waits for a pending Provider. Retry reactions share the input executor, and abort joins settlement off the input loop so later synchronous commands retain pre-settlement state. set_model suspends on its auth check before it applies the model, so a later command in the same input batch runs first. Full-file async closure remains deferred for the other command implementations. Delta at Pi c23b9ec1: shutdown handling changed (:373-395, :738-760, :796-812). The SIGTERM/SIGHUP handlers are registered once and stay until exit (the cleanup list is gone) so a signal during shutdown cannot kill the process before dispose() finishes (for example a pending MCP token refresh); each signal increments signalCount and kills tracked detached children, the first starts `void shutdown(exitCode, signal)`, a repeated one during shutdown calls process.exit at once (one signal during shutdown only means a