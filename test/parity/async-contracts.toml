o) has the same order: Configure reads TxDoc first and then applyChange returns the compactionSettings/compactionFields error (`%s.%s must be an integer 0 or more`, agent.go:632-661) with durable/compaction_overrides_test.go; this branch's base predates that port, so the validation is carried by the durable-7 merge and not by this row's evidence."

