rationale = "The scheduler is the executor of every task: each invocation is its own detached async IIFE (`void (async () => {...})()` at :2180) with an AbortController and a `done` promise; the scheduler owns it (the #background set, invocation.controller, join()). open (:439) awaits one commitWith that scans task records by status and marks cut-off work. #drain (:1880) is queued with queueMicrotask(() => void this.#drain()) after a publication, awaits #reserve (one commitInternal that marks restarts and plans reservations under #region), then starts each reservation without awaiting it; a failure is reported, never thrown at the caller. #run steps awaited commits (#step -> commitInternal) around each phase: erased(task).phases[checkpoint.phase](task, runtime, invocation.context) with the phase's result committed as the next checkpoint, so an invocation's state advances only through awaited commits. abort (:599) marks the record in one commitWith (terminating orphaned work) and then awaits Promise.race([run.done, session.failed]) through awaitWithContext, so the caller leaves on its own context without cancelling the task; abortConversation awaits the marking commit, then waitForTask for every reached task (background) and waitForIdle; waitForTask/waitForIdle register on the line (readOnLine) so no settling publication falls between the check and the registration. queueMicrotask(() => invocation.controller.abort()) (:809) aborts a running invocation after the mark commit published, not inside it; join() aborts every running invocation and awaits Promise.allSettled of their done promises before the close-time writes. The task runtime handed to a phase (:2610-2960) rejects with endedError once the invocation ended, links every abortOwned/waitForTask/readOnLine call to the invocation signal (withAbortSignal) and awaits awaitWithContext so an already-aborted caller rejects even if the value resolved. Go durable/harness/scheduler.go implements the same on goroutines: the run loop and one goroutine per invocation (TaskScheduler.background WaitGroup), context.AfterFunc/linkedChild for withAbortSignal, the microtask-ordered drain (TestTaskScheduling, TestWakeRecomputed...), Close/Join aborting and waiting for every invocation, and waiters registered on the Session line (waiter_cancel). Evidence covers phase order and checkpointing, abort marks and cascades below a cancelled owner, owned-task abort joined before the caller proceeds, the already-cancelled caller rule, idle waiter scoping, wake timers after sleep, scheduler faults ending the Session, delivery order of waiters, and that no goroutine outlives Close. Delta at Pi c23b9ec1: the only changed async-skeleton lines are the new withAbortSignal and withoutAbortSignal imports (used at :2166 and :2406, already ported); the invocation context and the abortion-free step commit are unchanged."

