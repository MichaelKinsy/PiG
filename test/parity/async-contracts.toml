rationale = "The Harness and Conversation methods are thin awaited wrappers: each calls tasks.resume() and then returns the scheduler/submissions/views Promise (waitForTask, waitForIdle(conversationId?), abortConversation, submit, watch, observe*), so the caller waits for exactly what the delegate waits for and gets its rejection unchanged. Harness.open (:589-610) throws if the context is already aborted or the registry lacks a built-in task, builds the HarnessImpl and awaits openTasks(context); if that fails it closes the harness with withoutAbortSignal(context) (the open error may be the caller's cancellation) and rethrows the open error, swallowing only a failing close. createConversation/#create (:429-460) run in one commitWith that creates the record, configures the agent and runs options.init(tx, id) before the commit settles; conversationCreated awaits the live, inbox, usage and provider document creations in order, then createAgent and the options.conversationCreated hook. The handle given to a task's phase (:545-580) binds every call to the invocation: binding.check() first, then the caller's context is merged with the invocation signal (withAbortSignal), a tx-form submit checks binding.signal.throwIfAborted() because the caller's commit carries its own context, and the submission handle's status/wait/abort are bound the same way. Go durable/harness/harness.go keeps the structure with blocking methods: OpenHarness (ctx.Err first, missing built-ins, tasks.Open, Close(context.WithoutCancel(ctx)) on failure), create (one commit), boundConversation.{Submit,SubmitIn,Abort,WaitForIdle} and boundSubmission with withSignal(ctx, binding.Signal) and binding.Check. The cited tests cover open (and a failing open that still closes), the lifecycle handles and their invocation binding, the abort/boundary ordering, a cancelled context ending a wait at once, task recovery on open, waits behind a blocking listener (D224: wait_deliveries_test.go), and that no goroutine outlives Close."

