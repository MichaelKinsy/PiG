rationale = "Pi runs an image resize in a worker thread: resizeImage (:86-110) awaits resizeImageInWorker, first by Bun's string path under Bun, then by the worker URL, and falls back to resizeImageInProcess when the worker cannot be created or fails; resizeImageInWorker posts the transferable bytes, settles once from the first valid message, error or exit event (`Image resize worker exited with code N` if it died unanswered), and in finally awaits worker.terminate() so a serial resize never starts a worker while the previous one is still shutting down (that overlap aborted the process on macOS with Node 24, #10695). Delta at Pi c23b9ec1: terminate is now awaited (`await worker.terminate().catch(() => undefined)`) instead of fire-and-forget. All of this is the worker-thread mechanism, which Go does not have: internal/imageprocessing/images.go ResizeImage/ResizeImageForLLM resize on the caller's goroutine and return (result, error) with no worker, no fallback path and nothing to terminate, so resizes are serial by construction and the #10695 overlap cannot occur. The resize results themselves are held to Pi in TestResizeImageUpstream, TestResizeImageDimensionStrategyMatchesPi and the input-limit tests."

