rationale = "The OAuth engine moved out of this file into the MCP package (auth provider, sign-in flow and loopback listener); what remains is the credential store and one orchestration function. withRefreshLock(key, fn) (:101-130) takes a per-server lock file (proper-lockfile with stale takeover, retry for a bounded wait), converts a lock held by another process for the whole wait into McpRefreshLockBusyError, awaits fn under the lock and releases it in finally (release errors swallowed); without a lock directory it just runs fn. signInMcpServer (:207-240) awaits listenForLoopbackSignIn, then inside try: startMcpSignIn (an `authorized` result from the stored refresh token returns at once), shows the authorization URL, awaits waitForLoopbackSignIn (the loopback callback and the pasted-URL prompt race, the prompt receiving its own signal) and completeMcpSignIn, and awaits callback.close() in finally. The caller's AbortSignal is forwarded into every step so an abort ends the sign-in with McpSignInCancelledError; requests to the authorization server are time-limited by the engine. Delta at Pi c23b9ec1: the removed code (the in-process `refreshing` promise, authorizeMcp, waitForAuthorizationResponse with Promise.race, listenForCallback, the fetch timeout wrapper) now lives in packages/mcp. Go coding/mcpext/oauth.go keeps the same orchestration: withRefreshLock (pilock.AcquireWithOptions with ctx, ErrLocked mapped to the busy error, Release deferred; an in-process mutex without a lock dir), and SignInMcpServer(ctx, options) calling oauth.ListenForLoopbackSignIn, StartMcpSignIn, WaitForLoopbackSignIn and CompleteMcpSignIn with ctx and closing the callback with defer. The tests pin the already-ended context, an aborted authorization-server request reported as a cancellation, waiting for the browser, other failures staying failures, cancelling while another process holds the lock, the refresh happening once across processes, waiting for a running refresh, and the request timeout."

