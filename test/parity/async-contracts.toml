rationale = "Storage adoption (Pi 92ab5360): #runCommit passes Storage.commit an adopt callback and Storage calls it once, synchronously, when the batch is durable and before its next commit; the Session adopts the staged documents inside it, so the adopted state is visible to any read that Storage starts from inside adopt. Go's runCommit does the same through a callback that keeps its own error or panic (a panic must not reach Storage), then publishes the commit synchronously before the Session's call returns, which is the microtask order of the upstream promise. A Storage that rejects after adopting fails the Session without discarding the adopted changes; one that rejects before adopting discards them and fails the Session; one that resolves without adopting fails it with 'Storage committed without adopting the batch'; a failed adoption fails the Session with its own error, which never reaches Storage. The Session's close, task, checkpoint and watch-acquisition async obligations outside the commit path remain deferred, as the per-file contract has not been reviewed for this pin. Pi 42cb822f1 builds each document watch with Chord's Watch instead of Durable's CommittedWatch (session.NewSessionWatch gives it the Session's delivery scheduler and report); the watch lifecycle is the one reviewed on packages/chord/src/watch.ts. The rest of the file's async obligations remain deferred as reviewed. Deferred commits (Pi 6c2fd73b0): a held commit is adopted by pointer swap on the line and returns without a Storage call; its operations are stored later, always as a job on the mutation line: by the next commit that acquires the document (in front of its own operations, in its one storage transaction, taken only after every fallible step so a failed commit keeps them: TestStoringHeldChanges keeps them through a failing callback and a failing checkpoint predicate), by the hold timer (the foreground timer fires, queues one line job that stores every held document in one transaction, and does nothing once the Session is closing or failed), by close (after BeforeClose and the commits admitted before the seal, before the trackers are dropped; a failing store fails the Session, the backend still closes and the close returns the store's error), by UnloadDocuments and before a reload under another definition version. A store never inherits the caller's cancellation (context.WithoutCancel), as every admitted storage call does. Go models the timer callback as a detached line job (enqueueDetached takes its place on the line when the timer fires and runs on its own goroutine once the earlier jobs settled), the Go counterpart of upstream's enqueue from the timer callback; the Session's own observers see a held commit synchronously on the line when it is adopted, host listeners only when it is stored (TestPublicationsOfDeferredCommits). The Session failure after a crash stores nothing (TestACrashLeavesStorageAtTheLastStoredState). Pi 8b0caefc: commits are published inside Storage adoption; the subscribeCommits dispatch, the waits a commit resolves and the abort of a newly marked task keep their order after it (TestPublicationAtAdoption)."

