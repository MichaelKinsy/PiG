rationale = "A Transaction is the object a commit callback uses; its table operations return Promises the callback awaits, in the callback's order. Reads (#read, :1140-1148) reject with ReadAfterWrite once a table write happened; writes (#write, :1150-1158) are staged and reject after the transaction settled (`Transaction has settled`); every operation is tracked in #pendingOperations (#track, :1131-1137). When the callback threw, settleFailure (:766-772) aborts the open changes and observes the pending set with Promise.allSettled. When the callback returned, settleSuccess (:777-795) first checks the set: if an operation is still pending it aborts every change, awaits Promise.allSettled (so none is left running or unhandled) and rejects the commit with `Session commit callback settled before its pending Tx operations`, so an operation a callback left unawaited is drained and the commit fails; otherwise it prepares the changes synchronously and awaits #assemble. doc()/retireDoc() memoize the draft Promise (`draftPromise`) so concurrent calls for one document share one load (:611-636); fork copies are awaited from storage (#acquireForkCopy). The context is the commit's, released when the transaction ends. Go durable/session/transaction.go makes each operation a blocking call returning (value, error); an operation still in flight when the callback returns is tracked (pendingOps, drained on settle) and the commit is rejected, as upstream, and the same ReadAfterWrite rule applies to every table read, and the Tx is refused after settling. The tests pin the table, document and task/submission operations, the read-after-write names, ordering of settleSubmission checks, and the context release. Delta at Pi 473515f9c: signal() is a read (ReadAfterWrite after a table write) that awaits the committed task, then reads the latest candidate, decides the delivery and stages the record without yielding, so deliveries started together in Promise.all decide against each other; a commit that settles a submission with notify awaits the committed record of the notified task and stages the delivery during assembly. transaction.go does the stretch after the await under the transaction lock."

