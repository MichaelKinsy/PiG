rationale = "credentials.ts tokenOf(credentials, url, say, signal): `token` returns at once, `file` awaits readFile, `pairing` awaits pair(): a POST /_chord/pair (fetch with the signal; a non-2xx status rejects `the server refused to pair`), the answer's code and poll validated (a malformed code is refused before anything is shown), then `say(code line)` and a loop of: sleep POLL_MS (2000 ms, a bare setTimeout that the signal does not cut short), `signal.throwIfAborted()`, a poll POST (signal passed), a non-2xx ends it with `ended without approval`, anything but `approved` with a token goes on, an approved answer is saved with writeSecret(save, token, 'create') when asked (awaited, a failure rejects: the token is not returned unsaved) and returned. Strictly sequential, one request in flight, no timeout of its own: the caller's signal is the only end (startTerminal's controller is never aborted, so Pi's pairing waits until approval, refusal or a transport error). Go TokenOf(ctx, ...) is the same loop on the caller's goroutine: http requests take ctx, the wait is one timer of pollInterval started after each poll was answered and waited out whole (Pi's `await sleep(POLL_MS)` in the loop, a bare setTimeout the signal does not cut short, credentials.ts:52-53: two polls start the interval plus the first one's own time apart, TestPairingWaitsTheWholeIntervalAfterEachPollWasAnswered; an abort during the wait settles when the interval ends, at most POLL_MS later, TestAnAbortDuringThePairingWaitSettlesWhenTheIntervalEnds), then ctx is checked before the poll as `throwIfAborted()`: an abort sends no poll and ends with the cause (TestAnAbortedPairingSendsNoMorePollsAndEndsWithTheCause). The wait is the timer alone, no goroutine; the poll's request takes ctx, so an abort during it ends it at once, as Pi's fetch takes the signal. pollInterval and the refusals as Pi's. Evidence: the malformed-code refusal test; the whole pairing flow (code shown, owner approval, polling, token) is