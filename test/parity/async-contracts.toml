rationale = "startVm awaits QuickJS.create, then runs synchronously: deliver() settles a call in the VM and drains the job queue in batches of fifty between interrupt polls (so `while (true) await null` reaches a poll), and a job that fails is a crash. Go creates the engine and runs the same steps on the caller's goroutine, with the job batches and polls tested. In Pi 1.2.0's deterministic mode (start()) deliver() buffers results that arrive before their `seq` and applies them strictly in `seq` order, posting `idle` after each, and `started` is posted before the script runs; the Go VM session buffers and applies results the same way."

