[[files]]
path = "packages/env/src/remote-env.ts"
disposition = "translated"
contracts = ["awaited", "concurrent-joined", "cancellable", "detached-owned"]
evidence = ["test:env/remote_write_abort_test.go#TestRemoteWriteFileAbortedBetweenChunksSettlesTheChunksInFlightAndStops", "test:env/remote_write_abort_test.go#TestRemoteAppendFileAbortedDuringTheTransferAppendsEverythingThenFails", "test:env/remote_write_abort_test.go#TestRemoteExecThrowingOnOutputCancelsTheCommandAndFailsWithTheCallbackError", "test:env/remote_test.go#TestRemoteExecutionEnv", "test:env/conformance_test.go#TestRemoteExecutionEnvOverAPipeConformance", "test:env/differential_test.go#TestRemoteExecutionEnvAgainstNodeExecutionEnv", "test:env/remote_shell_options_test.go#TestShellCleanupKillsRunningCommands", "test:env/remote_env_temp_join_test.go#TestRemoteExecutionEnvCreateTempDirAbortsBeforeTouchingTheDaemon", "test:env/regressions_test.go#TestRemoteWatcherOutlivesTheContextThatOpenedIt"]
rationale = "Every RemoteExecutionEnv method awaits its daemon requests in order and settles with a Result; Go's methods block on Connection calls and return (value, error). #fileOp checks the signal after resolving the path and, for appendFile, again after the transfer (:401-425); Go's fileOp does the same with the context. readRange (:96-127), readFile's decoding loop (:496-516) and #write (:587-626) keep up to READ_DEPTH or WRITE_DEPTH requests in flight: Go starts them with Connection.Start and waits on the oldest Call, so replies are consumed in request order and an abandoned Call settles without a reader, as Pi's `.catch(() => {})` promises do. readRange and readFile check the signal after each awaited read. #write checks writeFile's signal before each chunk after the first, then settles every chunk in flight (Promise.allSettled) and fails with the first rejection or aborted; appendFile ignores the signal during the transfer; the handle is closed in a finally after the chunks settle. Go's write keeps that order with settleAll and a deferred close. watch resolves its targets with Promise.all; #resolve only awaits the shared connection info, so Go resolves them in order with the same results and first error. exec forwards the caller's signal to its own AbortController and aborts it when onOutput throws (:866-906); Go derives the request context from context.Background, cancels it from the caller's context with context.AfterFunc and from a failing callback, and onOutput runs on the connection's reader goroutine, so every call finishes before the reply that settles Exec. cleanup kills the running commands without awaiting them, as Go's Cleanup does. Pi sends requests other than exec, scanLines and watch without a signal; Go passes the operation's context to them, so a cancelled context also sends a cancel frame for those requests. The daemon (Pi's daemon/src/main.rs and Go's env/daemon) honours a cancel only for exec, watch and scanLines, so the extra frame changes no result."

[[files]]
path = "packages/env/src/ssh.ts"
disposition = "translated"
contracts = ["awaited", "cancellable", "detached-owned"]
evidence = ["test:env/ssh_timeout_test.go#TestRunSshTimeoutTerminatesTheChildAndFailsWithoutWaitingForItsOutputToClose", "test:env/ssh_known_hosts_semantics_test.go#TestConcurrentHostKeyChangesToOneFileAreAppliedOneAtATime", "test:env/ssh_error_test.go#TestSshErrorReportsExitCodeMessageAndStderr", "test:env/ssh_known_hosts_semantics_test.go#TestScanHostKeyReturnsTheRecordedKeyEvenWhenAuthenticationFails", "test:env/ssh_known_hosts_semantics_test.go#TestConnectSshHandsItsVerifiedDaemonToTheFirstStart", "test:env/ssh_fake_test.go#TestDetectPlatformOnScriptedHosts", "test:env/ssh_fake_test.go#TestDeployDaemonOnScriptedHosts"]
rationale = "Every exported operation awaits its steps in order, and Go runs them as blocking calls that take a context. runSsh (:127-176) resolves on the child's close and rejects on a spawn error, a failed exit or its timer; the timer sends child.kill(), Node's SIGTERM, and rejects at once with the stderr read so far, without waiting for the close. Go's runSsh sends SIGTERM through the command's Cancel (a plain kill on Windows, as Node does) and returns at the timer with the stderr read so far; a goroutine reaps the child, and WaitDelay bounds that reaping when a descendant keeps the output open. The caller's context is Go's own cancellation: it stops the run the same way and returns the context's error. scanHostKey removes its temporary directory when it settles, after the scan connection and ssh-keygen have finished. changeKnownHosts chains the changes to one file (:224-250) so each reads what the previous one wrote, and a failed change does not stop the next; Go holds a mutex per file for the whole change, and keeps that mutex after the change where Pi drops its map entry, which only retains one mutex per known-hosts path. sshConnection's async command (:480-499) runs when the Connection starts the daemon, one start at a time; Go's CommandFunc runs on the Connection's start with its context, and a mutex guards the detected system that remote() reads meanwhile."

[[files]]
path = "packages/env/src/terminal.ts"
disposition = "translated"
contracts = ["awaited", "cancellable", "detached-owned", "microtask-ordering"]
evidence = ["test:env/terminal_test.go#TestOpenTerminalRunsAProgramInATerminalWithInputResizingAndItsExitCode", "test:env/terminal_test.go#TestOpenTerminalFailsToOpenInAMissingDirectory", "test:env/terminal_test.go#TestOpenTerminalKillsTheProgramOnClose", "test:env/terminal_test.go#TestOpenTerminalKeepsInputInOrder", "test:env/terminal_test.go#TestOpenTerminalWriteOfMoreThanAFrameArrivesWholeAndInOrder", "test:env/terminal_test.go#TestOpenTerminalReportsTheJobInTheForegroundNotTheShellAtItsPrompt", "test:env/terminal_test.go#TestOpenTerminalKillsEverythingInTheSessionOnCloseAndOnALostConnection", "test:env/terminal_test.go#TestNewRemoteTerminalKeepsWhatItIsGivenAndWriteTakesBytesOrText", "test:env/terminal_test.go#TestOpenTerminalCancelledBeforeItStartedAbandonsTheOpenAndKillsTheProgram", "test:env/terminal_test.go#TestOpenTerminalFailsWhenTheRequestEndsWithoutStarting"]
rationale = "openTerminal starts the pty request with its own AbortController and returns a promise that the started event resolves and a failure of the request before it rejects (:94-127); exited is the request's promise, settling with the exit code or the daemon's error (aborted after close, lost on a lost connection). Go's OpenTerminal starts the request on a context from context.Background that Close cancels, blocks until the started event or the call's end, and a goroutine waits for the call and delivers how it ended on a channel; it ends when the call settles, which the reply, Close or the loss of the connection causes. RemoteTerminal.Exited latches that result with sync.Once, so it can be awaited many times as the promise can. write and resize send requests without awaiting them and swallow their errors, which exited reports (:85-90); in Pi each request runs until its await of the shared, already resolved connection promise, so requests in a row are sent in call order. Go's request starts the call with Connection.Start, which writes the frame before returning, and never waits for it; the Connection owns the pending call until its reply. foreground awaits its request; Go's Foreground blocks on it with the caller's context. onData runs on the connection's reader in output order. Go adds a context to OpenTerminal that only abandons the open: cancelling it before the started event returns the context's error and cancels the pty request, so the daemon kills a program that was starting (TestOpenTerminalCancelledBeforeItStartedAbandonsTheOpenAndKillsTheProgram). Go also returns `The terminal ended before it started` when the request ends without a started event, where Pi's open promise stays pending because started settles only from the started event (:116) or a rejected request (:125) (TestOpenTerminalFailsWhenTheRequestEndsWithoutStarting)."

