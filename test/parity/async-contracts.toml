rationale = "process.ts openProcess(connection, options): awaited. It awaits connection.info() for the `process` feature (not_supported when the daemon predates it; no signal: it takes none), then makes the `process` request with the program's own AbortController (the program's lifetime, aborted by close()) and returns a promise that resolves with the RemoteProcess at the daemon's `started` event or rejects with the request's failure before that; the request promise is `exited` (exit code, or the daemon's error, aborted after close), which afterwards carries the end: a failure after started never rejects the open. write(data) and closeStdin() are fire-and-forget: processWrite requests in WRITE_CHUNK pieces, each `.catch(() => {})`, left in order on the connection (stdin already closed, the program ended or a lost connection are reported by `exited`); close() only aborts the controller (the daemon kills the program and its process group). Go OpenProcess(ctx, connection, options) is a blocking call returning (*RemoteProcess, error): the open waits for started, the call's end or ctx (a Go-only cancel of the open: cancelling ctx abandons the open and kills a program that was starting; the started program outlives ctx, as in Pi where openProcess takes no signal); the exited promise is a channel filled by one goroutine owned by the call (ends when the call settles, the reply or the loss of the connection) that Exited() reads any number of times; Write/CloseStdin start requests on Background without waiting, in order, and Close cancels the request context (TestOpenProcessKeepsInputInOrderAcrossManyWritesAndWritesLargerThanOneFrameChunk, TestOpenProcessKillsTheProgramAndWhatItStartedOnClose, TestOpenProcessKillsTheProgramWhenTheConnectionCloses, TestOpenProcessFailsInAMissingDirectory, TestOpenProcessReportsDaemonsReleasedBeforeTheOperationAsNotSupported)."

