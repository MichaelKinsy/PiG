evidence = ["test:durable/harness/harness_compaction_test.go#TestManualCompaction", "test:durable/harness/harness_compaction_test.go#TestManualCompactionConcurrency", "test:durable/harness/harness_compaction_test.go#TestBackgroundThresholdCompaction", "test:durable/harness/harness_compaction_test.go#TestBlockingThresholdCompaction", "test:durable/harness/harness_compaction_test.go#TestCompactionOutcomes", "test:durable/harness/harness_compaction_test.go#TestCompactionRecovery", "test:durable/core/driver/compaction_failure_core_test.go#TestCoreACompactionFailureIsVisibleUntilASummaryIsProduced"]
rationale = "The compaction task is a checkpointed phase machine (select, summarize, retry, abort): each phase awaits its reads (agent, context at the immutable tail, beforeCompact hooks one after another, the completeSimple call with runtime.signal) and ends in one awaited commit; after the model call it throws if the signal was aborted so the abort invocation or the reopened task owns the committed state; a retryable error is re-queued with a durable backoff; the abort phase removes the live status and ends terminal. Compactions run as ordinary background work and several may be in flight, the one that cuts furthest wins whatever finishes first. Go durable/harness/compaction.go keeps the phases and checkpoints. The cited tests pin the manual and concurrent cases (a compaction that cuts furthest wins, an older-selected summary that cuts later is placed, abort by Conversation.abort with an already queued summary surviving), the background and blocking threshold paths (stops through abortTask, aborted with its generation by Esc), hook decisions (first wins, a throw is reported), retry with the pinned request, and recovery after reopen. Delta at Pi b3a29f11: failCutOff(runtime, task, context) is one awaited runtime.commit that records the compaction failure in pi.live (failCompactionStatus) and ends the task terminal instead of parking it at restartLimit; the phases and checkpoints are unchanged. Go durable/harness/compaction.go failCompactionCutOff and the core's durable/core/turn/compaction.go failCutOff commit the same failure; TestCoreOtherTasksCutOffRestartLimitTimesInARow pins it on both engines. Re-confirmed at Pi e7a0df27: the delta since b3a29f11 changes no line that mentions async, await, Promise, then/catch/finally, timers, signals or AbortSignal, so the contract stands. Re-audited at Pi c23b9ec1: the async skeleton of packages/durable/src/harness/compaction.ts (every async, await, Promise, then/catch/finally, signal, abort, throw, timer and yield line, imports excluded) is identical to this file at v1.5.0, so the contract above carries unchanged."

[[files]]
path = "packages/durable/src/harness/context.ts"
disposition = "translated"
contracts = ["awaited"]
evidence = ["test:durable/harness/harness_context_test.go#TestConversationContext", "test:durable/harness/harness_context_at_test.go#TestConversationContextAtReadsTheContextAsAForkAtThatEntryStarts", "test:durable/harness/context_range_test.go#TestContextRangeMatchesDeriveContextWhileAConversationGrows", "test:durable/harness/context_range_test.go#TestContextRangeViewsAreNotWrittenAfterTheyAreHandedOut", "test:durable/harness/context_detach_test.go#TestContextViewReturnedToACallerIsDetachedFromWhatLaterReadsSee", "test:durable/harness/harness_context_ranges_test.go#TestTaskContextRanges", "test:durable/session/session_line_admission_test.go#TestReadOnLineCtxReportsLineAdmissionBeforeEarlierCommitsFinish"]
rationale = "Every async function here is a read chain whose callers wait: captureContextBounds (:25-45) awaits session.latestEntryId or, for an explicit `at`, storage.entry (throwing `Entry N is not visible from conversation M` when absent) and then session.latestHeadMarker; readContext/readContextFrom (:84-140) run that capture on the Session line through session.readOnLine, then deriveContext/scanRange (:150-160, :323-340) page the visible entries through storage.scanEntries one page after another at SCAN_PAGE_SIZE, each page awaited before the next cursor is asked for, off the line (entries at or below the captured tail are immutable). There is no Promise.all, no timer and no detached work; the first rejection (a storage error, the visibility error) is the caller's rejection and nothing after it runs. The `context` argument only carries the caller's abort signal into the storage and session reads; this file never checks it itself, so cancellation is whatever the awaited read does. Go durable/harness/context.go CaptureContextBounds, ReadContext/readContext, readContextFrom, DeriveContext and scanEntries are blocking calls taking ctx and returning (view, error): the capture runs through lineReader.ReadOnLine(ctx, ...), scanEntries loops ScanAll pages in order (or one VisibleEntryRange for storages that retain decoded entries) and returns the first error. Evidence: TestConversationContext and the At test pin the capture order and the not-visible error against a fork started at the same entry; the ContextRange tests pin that a view handed to a caller is detached from later reads while a conversation grows (the Go-only incremental range does not change which reads happen first); TestReadOnLineCtx... pins that a read on the line reports the caller's ctx admission before earlier commits finish."

[[files]]
path = "packages/durable/src/harness/generation.ts"
disposition = "translated"
contracts = ["awaited", "cancellable", "microtask-ordering"]
evidence = ["test:durable/harness/harness_generation_test.go", "test:durable/harness/harness_generation_recovery_test.go#TestGenerationRecovery", "test:durable/harness/harness_deferred_progress_upstream_test.go#TestDeferredGenerationPartials", "test:durable/harness/harness_deferred_progress_upstream_test.go#TestAHeldDeferredPollIsResumedAfterACrash", "test:durable/harness/scheduler_wake_clock_test.go#TestGenerationRetryWaitSettlesWhenWakeRecomputedAfterBackoffCameDue", "test:durable/harness/hook_runner_test.go#TestHookRunnerEachPropagatesTheErrorOnceTheInvocationIsSignalled", "test:durable/harness/harness_run_failure_test.go", "test:durable/harness/harness_telemetry_events_test.go#TestDurableTelemetryReportsHookFailuresOnThePhaseAndClockFailuresWithoutAPhaseContext"]
rationale = "The generation task is a checkpointed phase machine (prepare, request, retry, poll, tools, finish, drain, abort; :182-421), each phase a Promise-returning function the scheduler awaits as one invocation. Within a phase every read is awaited in order (runtime.agent, runtime.context at the cutoff entry, the beforeRequest hooks one after another through runtime.hooks.each, the model call streamResponse(…, runtime.signal) and classify) and the phase ends in exactly one awaited runtime.commit whose callback returns the next checkpoint, so a crash replays the last committed phase rather than a half-run one. Divergence D181: a conversation-owned generation task that nothing waits for commits in goroutine-scheduling order in Go, not in the order Pi's microtask hops fix; the commits inside one phase keep their awaited order. Cancellation is the invocation signal: runtime.signal goes to the model call and to fetchDeferred, an error thrown while the signal is aborted is rethrown rather than reported or classified (the env resolution at :213-217 reports a failing env callback unless the context was aborted, and the beforeTool guard in tool.ts does the same), and abort/interrupted phases settle the open tool calls and live status in one commit. Provider errors are classified into retry (durable backoff wait the scheduler wakes), model_error (failModelError commit), or interrupted; hook errors are reported and the next hook still runs (hook_runner). Go durable/harness/generation.go has the same phases as step functions taking ctx and returning the next checkpoint or error; the scheduler owns the invocation context. The tests drive whole runs through the phases (generation, recovery after a crash at each checkpoint, deferred poll resume, retry wake after the backoff came due, run failure endings) and the hook runner pins that an error after the invocation was signalled propagates instead of being swallowed. Delta at Pi c23b9ec1: the one changed async line is in the error classification that follows a failed request (:805-818, the overflow-and-answer path): when the failure is a context overflow and no compaction ran yet, the compaction policy is now `compactionPolicy(settings, ref, (await runtime.agent(context)).compaction)` (:812), an awaited runtime.agent read issued only for overflow without a prior compaction and before the awaited runtime.context read that follows; this adds one await boundary on that path. prepare's own threshold change (:238) passes the already resolved `agent.compaction` and adds no await. Go in follow/durable-7 (generation.go:1171-1178) makes the same read (runtime.Agent(ctx) only when overflow and compacted is nil, then PolicyFor(ref, agent.Compaction)) before runtime.Context; this branch's base still uses the Harness-wide policy, so that delta is carried by the durable-7 merge, not by this row's evidence. Delta at Pi 473515f9c: finishToolRound asks the afterTools hooks (awaited one after another through runtime.hooks.each) and, when they ask for tasks, one commit creates them and parks the generation waiting on them (phase afterTools, policy allSettled), as the afterRun path does; answer() likewise parks in phase yield, with live.run.yield, while onYield tasks decide. The new phases are scheduler-awaited like the others: the handlers read the tasks' outcomes (runtime.outcomes) and end the round or the run in one awaited commit. generation.go keeps each as a blocking call; the tasks are owned children of the generation, joined by the scheduler and aborted by its abort cascade."

