end(false)`; Go's ticker drops no tick differently from a timer: a tick that arrives while a send runs is delivered after it (the ticker channel holds one), Pi's setInterval callbacks run as the loop allows, each send chaining behind the last. Tests: app_workers_test.go (start with kit data and the worker's own directory, restart keeps store and files, host-data module private)."

