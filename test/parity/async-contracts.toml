disposition = "translated"
contracts = ["cancellable"]
evidence = ["test:chord/context/chordctx_upstream_test.go#TestContextStopsWaitingWhenTheInvocationIsCancelled", "test:chord/context/chordctx_upstream_test.go#TestContextWithAnAlreadyCancelledSignalIsCancelledOnReturn", "test:chord/context/chordctx_upstream_test.go#TestContextInheritsParentCancellationAndIsolatesChildCancellation", "test:chord/context/chordctx_upstream_test.go#TestContextMasksCallerCancellationForMandatoryCleanup", "test:chord/context/chordctx_upstream_test.go#TestContextDerivesTelemetryIndependentlyFromValuesAndCancellation", "test:chord/context/chordctx_upstream_test.go#TestContextIsolatesConcurrentTraceInBranchesAndPreservesCallbackResultsAndErrors"]
rationale = "A chord Context's abort signal is Go context cancellation, with the abort reason as the cancellation cause. withAbortSignal (:71-75) combines the parent and the signal with AbortSignal.any, which takes the first aborted input's reason and is already aborted when an input is; chordctx.WithAbortSignal derives a context cancelled with the first cause, before it returns when the signal is already cancelled. withoutAbortSignal and withCancel are chordctx.WithoutAbortSignal over context.WithoutCancel and chordctx.WithCancel over context.WithCancelCause (package chord/context). awaitWithContext (:98-115) returns the promise itself without a signal, rejects at once when the signal is already aborted, and otherwise rejects only this waiter on abort, leaving the work running; chordctx.Await blocks on the work's settlement or the context, checks an already cancelled context first, returns the cause on cancellation and leaves the work's channel unread so it can still settle. abortError's DOMException for a non-Error reason has no Go form, since a Go cause is an error and a nil cause is context.Canceled. traceIn (:105-125) runs a child span of context.telemetry through startSpan and returns the callback's result as a Promise, rejecting with the callback's own error. chordctx.TraceIn calls telemetry.StartSpan on the caller's goroutine, passes the callback the derived context and span, and returns the result, or the error as the identical value, after the span settles, the awaited form of the Promise; concurrent branches each derive their own context, so branches are isolated by the context they receive, not by the goroutine (TestContextIsolatesConcurrentTraceInBranchesAndPreservesCallbackResultsAndErrors). withTelemetry and Context.telemetry are synchronous and cancellation-independent (TestContextDerivesTelemetryIndependentlyFromValuesAndCancellation)."

