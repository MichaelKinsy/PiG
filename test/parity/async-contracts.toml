[[files]]
path = "packages/codemode/src/wasm.ts"
disposition = "translated"
contracts = ["awaited", "concurrent-joined"]
evidence = ["test:codemode/sandbox_test.go#TestReportsAFailingWasmModuleAsASandboxError", "test:codemode/sandbox_test.go#TestCorruptWasmModuleIsASandboxError", "test:codemode/lifetime_test.go#TestCompilingTheModuleDoesNotCountAgainstTheDeadline"]
rationale = "loadQuickJSWasm compiles once per path, concurrent callers share one Promise, and a failed load is dropped from the cache so the next call retries. Sandbox.engine (codemode/sandbox.go) compiles once per cache key under a mutex so concurrent executions wait for and share one engine, a failed load is not cached, and the load runs on a context detached from the first caller as the shared promise is."

