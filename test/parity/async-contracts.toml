or it and a provider-scoped caller does not, since Pi launches the refresh unawaited and scoped calls select only their own providers, or when an extension host registration returns after startup, without waiting (startup registrations stay queued until the startup refresh, which runs after every extension factory; an interactive /reload holds the queue until the host has loaded every extension); a registration queued while a pass runs gets its own concurrent pass that supersedes the running one. Startup awaits createAgentSessionServices' local refresh after flushing extension registrations (agent-session-services.ts:182), which yields to that pass before model resolution. No provider request and no free goroutine runs it. The pass has no signal: the yielding caller's cancellation stops only its wait, Services.Close cancels and drains it, its failure reaches GetError only, and listener notification runs on listener-owned goroutines. A full refresh reloads models.json and recomposes every provider, even with an aborted signal (ModelConfig.load takes no signal), so it supersedes in-flight provider refreshes. Legacy facade contracts remain under the model-registry test obligation; this file is not claimed async-closed. Delta at Pi bd3c9b82: 04a93bad builds the request headers with the OpenCode session headers; no added or removed line contains async, await, Promise or .then, so the reviewed contract is unchanged. Delta at Pi c23b9ec1: settleCredentialWrites() (:643-650) returns credentials.settled(), the Promise.all of the credential modifications in flight (Go ModelRegistry.SettleCredentialWrites and ModelRuntime.SettleCredentialWrites, which fail only with their ctx's cancellation cause: TestRuntimeCredentialsSettledWaitsUntilPendingModificationsAreWritten, ...ResolvesAfterAPendingModificationFails, ...IgnoresLaterModificationsAndHonoursCancellation). The four lazyStream wrappers (stream, streamSimple, the virtual-model router, fetchDeferred; :721-804) now pass the r