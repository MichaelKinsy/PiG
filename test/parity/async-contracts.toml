rationale = "submit (:65-72) awaits one commitWith that runs admitSubmission inside a `pi.durable.submit` span (#traced awaits the admission, records the status, and rethrows after setting an error status), so the submission exists (or the call rejects) before the handle returns; admit(tx, …) (:79-92) runs the same admission inside the caller's commit and throws ReadAfterWrite after a table write, the admission being stored or lost with that commit. admitSubmission (:223-320) awaits its transaction reads and writes strictly one after another (request-ID lookup before the busy check, boundary preparation before the createSubmission, applyBoundary/startRun last), so ordering is the source order. wait (:133-146) checks and registers on the Session line in one readOnLine job (a settled record resolves at once, otherwise a waiter is added; close rejects registered waiters with the closed error), so no settling publication falls between check and registration; the waiter observes the caller's context. abort (:148-160) is one commit that settles a queued submission and removes its inbox item and reports already_placed/settled otherwise. Go durable/harness/submissions.go Submit/Admit/Get/Status/Wait/Abort are blocking methods with ctx returning errors; AdmitSubmission performs the same reads/writes in order inside the Tx; Wait registers on the line and returns on the settled record, ctx end or close. Cancellation of a Go Submit applies only until its commit job starts (SubmitUnlessCancelled), as session.ts checks the signal when the job begins. Divergence D224: a Go watch listener is a blocking call with no await point, so Wait/WaitForTask/WaitForIdle (and the hop between two parts) wait until each earlier delivery's current call returned or went on to a wait the host provides (Session.AwaitDeliveriesEntered); a listener that blocks on something the host cannot see must call chord.DeliveryEntered() first or the waits behind it do not return (TestAListenerThatBlocksOnAChanne