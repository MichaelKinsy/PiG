rationale = "readiness.ts Readiness (what a restart's successor waits for before the old attempt may end). start() opens a `started` PromiseWithResolvers once every fate of the reload started (the requests bind only then); each request is a Binding followed under an abort signal of the readiness, a failing one reported to onShown (the cause the successor shows) and a request failed on this host counts as ready. ready(due) = Promise.race([timer(due - now), #allReady()]): #allReady awaits `started`, then Promise.all of binding.until(isReady, context).catch(() => {}) for every binding: concurrent-joined waits that never reject (a binding that ends counts as done), bounded by the deadline the reload took (cancellation by timer, the `due` is the same one drainCalls(due) later uses), and ended early by release(), which aborts the readiness's signal and resolves the race. The caller (endOld) awaits ready(due) before the drain. No work is left running after release: bindings are released with it and the timer cleared. Go host_readiness.go: ready(due) is a keyedPromise settled in a section by the loop's timer or the joined binding.until promises; release stops both and releases the bindings (TestReadinessWaitsForARequestStillLoadingAndResolvesOnceItIsLive, TestReadinessResolvesAtItsBoundWhenARequestNeverGetsReady, TestReadinessReleaseEndsAWaitStillRunningReadyResolvesAtOnce, TestReadinessReleaseLetsGoOfItsBindingsAnObjectHeldOnlyByThemEnds)."

