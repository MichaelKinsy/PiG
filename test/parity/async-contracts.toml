rationale = "Factory-owned Go Runtime replacement awaits before events, active-response settlement, shutdown, construction and host rebinding. A before-event cancellation leaves the current Session unchanged; construction/rebind errors return on the operation. The outgoing runner is invalidated after shutdown and before new construction. In-memory fork mutates the retained manager only after teardown. Compiling mutation probes cover settlement, installation, cancellation, destination CWD, import collisions, persistence mode and manager identity. Native setup, rebind and withSession callbacks are awaited in that order; cancellation or rebind failure prevents the callback, and its message methods await the Session operation. CLI/extension factory wiring, subprocess callback transport and overlapping UI binds remain incomplete; D30/D61 still apply to those production mode paths. See docs/parity/session-runtime-helper.md. Delta at Pi 2c8d1feb: no added or removed line contains async, await, Promise or .then, so the reviewed contract is unchanged. Delta at Pi c23b9ec1: teardownCurrent (:167-178) is the shared teardown of /new, /resume, /fork and import: it awaits session.abort() first (so the aborted turn and its tool results are persisted to the outgoing session), then the session_shutdown emit, then beforeSessionInvalidate and session.dispose(); dispose() (:409-418) does the same for quit and additionally awaits services.modelRuntime.settleCredentialWrites() after session.dispose(), because an OAuth refresh may already have spent the single-use refresh token and exiting before its write lands would lose the login. Go coding/runtime.go Runtime.Close settles credential writes (with a background context, as Pi's call has no signal) before it retires the factory resources, and Runtime.SettleCredentialWrites returns only the cancellation cause of its own ctx. Pi v1.5.2 delta (4ea883792): importFromJsonl wraps the synchronous assertSessionCwdExists in try/catch and removes the copy it made before rethrowing; the awaited teardownCurrent/apply sequence is unchanged, no await is added, and the rejection still reaches the caller of the same operation (ImportFromJsonl returns the MissingSessionCwdError after removing the copy: TestImportFromJsonlMissingCwdNeedsOverride)."

