ame setup-error path (test:ai/models_provider_setup_abort_pi_test.go, test:coding/model_runtime_abort_upstream_test.go). Delta at Pi dd30101c (1.5.1): the network phase of refreshModels now takes its credential from the new private async resolveNetworkRefresh (:643-653), after Provider.refreshModelsAuth (:204, \"credential\" by default or \"configured\"): for \"configured\" it awaits checkProviderAuth with the phase's signal and returns an empty result (no credential, no OAuth refresh) when the provider is configured and undefined when it is not; otherwise it awaits resolveRefreshCredential as before. The call is one sequential await inside the phase's async function (:602), after the `!allowNetwork || signal.aborted` check, so ordering, cancellation and error propagation are those of the reviewed phase. Go ai/models_runtime_refresh.go resolveNetworkRefresh makes the same blocking calls under the phase's context, and the 'refreshes catalogs that need only configured auth without refreshing OAuth' case of TestModelsRuntimeRefreshUpstream proves a configured provider's network phase runs with no credential and no OAuth refresh and that an unconfigured one's does not run. The file stays deferred for the 0.99.1 members above."

