path = "packages/agent/src/agent-loop.ts"
disposition = "deferred"
contracts = ["concurrent-joined", "microtask-ordering"]
evidence = ["test:test/extension-conformance/tool_dispatch_test.go", "test:coding/extension/host/subprocess/tool_dispatch_wire_test.go", "test:coding/cli/audit_992_subprocess_tool_dispatch_test.go", "test:extensions/sdk/tool_prepare_arguments_test.go", "test:extensions/sdk-py/tests/test_tool_dispatch.py", "test:extensions/sdk-rs/tests/tool_dispatch_wire.rs", "test:agent/tool_settle_test.go", "test:coding/extension/host/subprocess/dialog_reply_order_test.go", "test:coding/cli/parallel_tool_end_order_test.go", "scenario:test/parity/scenarios/rpc/62-rpc-parallel-tool-dialog-order.toml", "test:test/extension-conformance/tool_dialog_order_test.go", "test:extensions/sdk/tool_dialog_order_test.go", "test:extensions/sdk-py/tests/test_tool_dialog_order.py", "test:extensions/sdk-rs/src/tool_start_order.rs"]
rationale = "Extension tool dispatch: prepareToolCall (:707-716) runs the tool's prepareArguments, then validates the result, so a subprocess tool is asked for its prepared arguments (tool_prepare_arguments, awaited by the source-order loop) before the host validates. executeToolCallsParallel (:619-647, 820-837) invokes every prepared call through Promise.all(map) in source order and each reaches tool.execute synchronously: the host writes a batch's tool_call requests in source order (one call lane per connection, each call releasing its place once its request is written) and every SDK runtime starts handlers in arrival order. Completion is joined. A call's tool_execution_end follows its own execute promise: calls whose answers arrive back to back from the runtime (a timer, or a dialog answered on one stdin chunk) end in the order the answers arrived, because the one JS thread runs their continuations in settle order, while the results keep source order. The host records the order where the answers are read (the connection read loop for a tool_call response, the RPC stdin line for a dialog answer) and keeps it where the calls continue (agent.SettleGate: the batch's ends, and the replies to a connection's dialog calls); goroutines that wait for the answers wake in no order, so without it the ends came out in a different order on most runs. Existing full-file async obligations outside extension tool dispatch remain deferred. Delta at Pi bd3c9b82: adc5fa9f/04a93bad add DEFAULT_AGENT_IDENTITY and pass a merged identity in the stream options; no added or removed line contains async, await, Promise or .then, so the reviewed contract is unchanged."

