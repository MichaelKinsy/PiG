[[files]]
path = "packages/durable/src/images/index.ts"
disposition = "translated"
contracts = ["awaited"]
evidence = ["test:durable/images/images_test.go#TestAnImageThatNeedsNoChangeIsReturnedAsItIs", "test:durable/images/images_test.go#TestAPNGTooLargeForTheByteLimitBecomesAJPEGAtItsSizeThenShrinks", "test:durable/images/images_test.go#TestBytesThatCannotBeDecodedAreNotAnImage", "test:durable/images/images_test.go#TestPrepareGivesUpWhenNotEvenOnePixelFitsTheByteLimit", "test:durable/images/images_test.go#TestPrepareStopsWhenItsContextIsCancelled", "test:durable/images/sequential_test.go#TestCreatePhotonImagesPreparesOneImageAtATime", "test:durable/images/sequential_test.go#TestCreatePhotonImagesPreparesImagesInCallOrder"]
rationale = "createPhotonImages initializes Photon synchronously and returns a processor whose prepare is an async wrapper around synchronous work: its Promise settles once the decode, orientation, resize and encoding have all run on the calling thread, with the prepared image, or with undefined when Photon cannot decode the bytes or no encoding fits. On the one thread, each call's work runs to its end before the next call can start, so images are prepared one at a time in call order. It takes no AbortSignal and starts no other task. Go's CreatePhotonImages (durable/images/images.go over internal/photonimage's byte-exact ports of Photon's decoders and encoders) returns a processor whose Prepare is a blocking call on the caller's goroutine that returns the image, or nil with a nil error for the same two cases. Calls to one processor take turns in call order (durable/images/sequential.go): each waits for every earlier call to finish before it prepares, so they run one at a time as on Pi's thread. Go adds a context: a caller whose context is cancelled while it waits for its turn returns its error without preparing, and the calls after it keep their order; once preparing, Prepare checks it before each size and each encoding and returns its error once it is cancelled, where Pi's prepare runs to its end."

[[files]]
path = "packages/durable/src/images/node-worker.ts"
disposition = "translated"
contracts = ["detached-owned"]
evidence = ["test:durable/images/node/worker_test.go#TestTheWorkersFailuresReachTheirCallerAndTheWorkerGoesOn", "test:durable/images/node/worker_test.go#TestTheWorkerPreparesOneImageAtATime", "test:durable/images/node/worker_test.go#TestTheWorkerPreparesOnItsOwnGoroutine", "test:durable/images/node/worker_test.go#TestTheWorkerKeepsTheCallersBytes"]
rationale = "The worker's message handler starts images.prepare for each request without awaiting it (`void ... .then`) and posts the reply when it settles: the result, or the error's message, under the request's id. Because prepare's work is synchronous, the worker prepares one image at a time in the order the requests arrive, and a failure answers only its own request. Go's worker goroutine (durable/images/node/node.go workerImages.run and prepare) takes one job at a time from its channel, runs the processor and sends the reply on the job's channel; a panic in the processor is recovered into that reply and raised again on the caller's goroutine, and the worker goes on with the next job. The worker's start-up read of Photon's WebAssembly has no Go counterpart (the codecs are native Go ports of Photon's); the node.ts row records what a worker that cannot start does in Pi."

[[files]]
path = "packages/durable/src/images/node.ts"
disposition = "translated"
contracts = ["awaited", "detached-owned"]
evidence = ["test:durable/images/node/worker_test.go#TestTheWorkerExitsWhenIdleAndTheNextImageStartsAnother", "test:durable/images/node/worker_test.go#TestTheWorkerPreparesOneImageAtATime", "test:durable/images/node/worker_test.go#TestTheWorkerPreparesImagesInCallOrder", "test:durable/images/node/worker_test.go#TestWorkerFalsePreparesWithThePlainProcessor", "test:durable/images/node/worker_test.go#TestTheWorkerHonoursACancelledContext", "test:durable/images/node/worker_test.go#TestTheWorkerGivesTheSameResultAsTheCallingGoroutine", "test:durable/images/node/node_test.go#TestTheNodeProcessorPreparesConcurrentImagesEachOnItsOwn", "test:durable/images/node/node_test.go#TestTheNodeProcessorKeepsTheCallersBytes"]
rationale = "createNodePhotonImages resolves with a processor; with worker: false it first awaits reading Photon's WebAssembly and returns createPhotonImages, which prepares on the calling thread one image at a time in call order (index.ts row). Otherwise prepare starts one PhotonThread on first use and awaits its reply: requests are numbered, sent to the worker with a copy of the bytes and settled by the reply with the same id. The worker is referenced, keeping the process alive, while a request is pending, and exits idleMs (default 30 s) after the last reply; the next image starts a new one. A worker that fails before its first reply is unavailable, and every later image falls back to the calling thread; an error or exit after that rejects every pending request. No AbortSignal is taken. Go's CreateNodePhotonImages (durable/images/node/node.go) returns the processor at once: there is no WebAssembly to read and a goroutine always starts, so the fallback and the worker's crash path have no counterpart. A goroutine never keeps the process alive; the caller of Prepare blocks until its reply instead. Prepare clones the bytes, hands the job to the one worker goroutine, started on demand and gone after IdleMs without a job, and waits for the reply; jobs are taken in the order they were handed over. With Worker false it returns images.CreatePhotonImages, whose calls take turns in call order on the callers' goroutines (index.ts row). Go adds a context: a caller whose context is cancelled returns its error, whether it waits for the busy worker (the job is never taken up and the jobs after it keep their order) or for its own image (the processor stops at its next step)."

