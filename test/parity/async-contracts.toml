rationale = "connection.ts keepConnected: an event-driven loop on one thread: connect() opens a link (a 20 s connect timeout timer), and every event (opened, frame, link closed, wake, retry timer) runs to completion one at a time. When a link closes the loop reports `waiting`, resets the failures when the link stayed open STABLE_MS, sets `deciding`, and calls `canRetry().then(decided, () => decided(true))`: the answer arrives later in a microtask and, when true, schedules the next attempt (now when a wake came meanwhile, else after min(RETRY_MAX, RETRY_INITIAL * 2^failures), the longest pause while offline); a stop in the meantime makes the late answer schedule nothing (`#stopped` is checked in #schedule); a canRetry rejection retries. stop() sets stopped, removes the wake listener, cancels the retry and closes the current link. A wake runs the pending retry now, or replaces a silent socket once its overdue ping check says so. Go (loop): the events are closures run through the follower's outbox (one at a time, in order, no lock held while client code runs), CanRetry is asked in a goroutine of the loop's WaitGroup (`asking`) with the loop's context, and its answer re-enters the outbox as one more event (`deciding=false`, schedule), so the ordering of the answer against a wake, a stop or a close is the same; stop cancels the context (a pending CanRetry ends) and an answer landing after stop schedules nothing. Tests above, in Pi's order (growing pause, stable reset, offline longest pause and wake, 20 s connect, stop on a no, wake while deciding, error retries, stop closing the link, an open landing as the loop stops, stop cancelling a pending canRetry)."

