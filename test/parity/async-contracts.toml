rationale = "A tool call is a task with three phases the scheduler awaits (call :149-200, execute :202-228, abort :229-250): reads are awaited in order (readCall, resolveTool, then the beforeTool hooks one after another through runtime.hooks.each; a hook error blocks the call unless the signal is already aborted, which rethrows), the call's slot status and arguments are stored with one awaited progress-style commit and the durable intent (phase execute, arguments, replay mode) with a second awaited commit, and then run() executes the tool. run (:415-670) gives the tool an API whose commit/createTask/executeTool/details are awaited commits or awaited waits tied to the invocation, serializes the slot progress writer, and tracks nested admissions in `admissions`; after tool.execute returns or throws it awaits Promise.allSettled(admissions), stops the progress writer (waiters rejected with the error when the signal aborted), computes the final result through the afterTool hooks, and settles in one commit. A nested executeTool (:520-545) admits the child once under a memoized MADE_NESTED_CALLS flag, awaits runtime.waitForTask(id, callContext), and reads the child's result document: cancelling the call's own context stops only that wait, not the child. settle (:810-870) aborts every still-running nested task the caller owns with Promise.all(nestedIds.map(abortOwned)) before it commits the result (all aborts are started together; Promise.all rejects at the first rejection without waiting for the others), so children end before the caller's result entry, and a nested caller that settles aborted rejects later nested calls. Go durable/harness/tool.go and tool_nested.go keep the three phases as step functions with ctx, run the tool body synchronously on the invocation goroutine, sync.WaitGroup-join the nested admissions before the result commit, and abort owned nested children concurrently (abortAll, tool_nested.go:82: it starts every abort, waits for all of them and returns the error of the lowest task ID, where Promise.all rejects at the first rejection) before the result commit (settle); the two differ only in which error is reported when several aborts fail and in waiting for the rest. The nested tests pin the abort-with-caller, child-before-parent ordering, the cancelled wait not aborting the child, one admission per concurrent key, the commit-in-flight admission that is aborted, and restart reconciliation; the hook tests pin before/after hook order and error handling; the progress/deferred tests pin the streamed output writer's lifetime. Delta at Pi 473515f9c: execute() may return a park, which run() awaits like a result: one awaited commit stores the parked checkpoint with the sleep or wait, the call then holds no invocation, and a later reservation runs the parked phase, which awaits the same commits as call. cancel() is awaited in the abort handler (after a park or a woken run), in the recovery phase, and in run() when the park commit finds the call abort-marked, in a context only the Harness close cancels (withoutAbortSignal plus closeSignal); its failure is reported, rethrown only when that context is cancelled. executeTool with wait false returns a handle after the awaited admission, its result(context) awaits the nested task and reads its stored result, and admissions are still joined at the end of the attempt. tool.go keeps each as a blocking call; a park is the returned *ToolPark."

