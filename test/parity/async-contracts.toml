rationale = "The extension owns one AbortController per session (aborted on session_shutdown and before the first session_start); work captures its signal when it starts and drops late results once it aborted. startConnection waits for its `after` promise, starts only while its attempt token, the server's enabled state and the session still apply, and publishes server.ready; waitForServers loops until the latest attempts settle or the tool call aborts; reconnect chains behind server.ready and replaces it; disabling clears the attempt token and records a closing promise that a replacement awaits before opening a transport. `/mcp` opens the manager without awaiting the startup connections, and runInBackground runs connection actions off the menu, dropping a result whose attempt was replaced; sign-ins stop on Esc and on the session signal and are registered with track so session_shutdown awaits their cleanup. PiG maps the controller to a context owned by the Extension, the promises to channels closed by goroutines registered in backgroundTasks (drained by SessionShutdown, which also admits tasks started while it waits), the attempt token to a pointer compared under the extension mutex, and runInBackground to a goroutine whose synchronous part (config save, detaching the connection, installing the ready channel) runs before it starts, as the Promise's synchronous prefix does. Re-audited at Pi c23b9ec1: the async skeleton of packages/coding-agent/src/extensions/mcp/index.ts (every async, await, Promise, then/catch/finally, signal, abort, throw, timer and yield line, imports excluded) is identical to this file at v1.5.0, so the contract above carries unchanged."

