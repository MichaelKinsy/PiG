rationale = "createPhotonImages initializes Photon synchronously and returns a processor whose prepare is an async wrapper around synchronous work: its Promise settles once the decode, orientation, resize and encoding have all run on the calling thread, with the prepared image, or with undefined when Photon cannot decode the bytes or no encoding fits. On the one thread, each call's work runs to its end before the next call can start, so images are prepared one at a time in call order. It takes no AbortSignal and starts no other task. Go's CreatePhotonImages (durable/images/images.go; D165 for the native decoders and encoders) returns a processor whose Prepare is a blocking call on the caller's goroutine that returns the image, or nil with a nil error for the same two cases. Calls to one processor take turns in call order (durable/images/sequential.go): each waits for every earlier call to finish before it prepares, so they run one at a time as on Pi's thread. Go adds a context: a caller whose context is cancelled while it waits for its turn returns its error without preparing, and the calls after it keep their order; once preparing, Prepare checks it before each size and each encoding and returns its error once it is cancelled, where Pi's prepare runs to its end."

