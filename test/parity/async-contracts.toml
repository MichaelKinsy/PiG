rationale = "`hold` (`await awaitWithContext(#pin(entry), context)`): a blocking Go call outside a section, the caller's ctx ends only its own wait, a failed wait releases the hold once; `#pin` is a goroutine settling `loading` in a loop section. | `hold`, the pin it awaited left its instance (the object failed and went live again: `follow` pinned the key on the new instance, `entry.loading`): Pi's `hold` returns the source at once after the first pin. Its test (reference-keys.test.ts, 'the object fails and re-binds meanwhile') relies on the new pin, whose load has finished when the old pin settles, having landed by then. Goroutines have no such order, so `hold` waits for `entry.loading` to settle when the load of a pin of the key has finished (`KeyedSlot.InMemory` on the member's ultimate slot: Pi's has landed by then) and returns its source whichever way that pin settled; it does not wait for a new pin whose load has not finished when the old pin settles (Pi's `hold` has returned by then, and a read of the key is `not_ready`). The caller's context still ends the wait. Residual: the load's end and the key's loaded mark are a few steps apart; within that window PiG can fail where Pi succeeds (the load ended before the old pin settled, not yet marked) or succeed where Pi fails (the load ended after Pi's old pin settled, marked before the check). Re-audited at Pi c23b9ec1: the async skeleton of packages/chord/src/host/reference-keys.ts (every async, await, Promise, then/catch/finally, signal, abort, throw, timer and yield line, imports excluded) is identical to packages/chord/src/next/host/reference-keys.ts at v1.5.0, so the contract above carries unchanged."

