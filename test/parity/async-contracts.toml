path = "packages/codemode/src/runtime/inline.ts"
disposition = "translated"
contracts = ["awaited", "cancellable", "microtask-ordering"]
evidence = ["test:codemode/inline_test.go#TestInlineSandboxChecksTheDeadlineBetweenTurnsLikePi", "test:codemode/inlinechannel_test.go", "test:codemode/inline_test.go#TestInlineSandboxUsesItsWasmLoader"]
rationale = "inlineLauncher awaits the module and startVm, then delivers each VM message in a microtask, after the VM has returned, so host code (tool calls, finish, disposal) never runs inside a VM callback; stop() disposes the session once. The interrupt callback ends the VM once the channel is stopped, settled or its budget is used up. Go's inline channel queues the messages on the execution's loop for the same ordering, checks the deadline between turns, and stops the VM once."

