rationale = "native.ts open (await this.#opened(await this.#open(context))): `nativeHandle.open(ctx) error` blocks in the opener (called off the loop, as an `await` yields it); a returned error or panic is the rejection and leaves the state `opening` as Pi does. A value arriving after an abandon is closed at once, its failure reported through `loop.Run(report)`. | native.ts close / #closeValue (IIFE promise started synchronously, within(closing, closeTimeout), abort at timeout): The closer runs as an owned task (`sectionLoop.Go`, joined by `Loop.Wait`), settling a `nativeWork`; `close` blocks in `within`. At the timeout the task is not stopped (Pi's promise runs on): its ctx, derived from the object's context with `chordctx.WithCancel` (synchronous abort, as `AbortSignal.any`), is cancelled with an `aborted` ChordError `<name>: close timed out`, and the timeout is reported. A closer must return when its ctx is aborted (the Go form of Pi's abortable promise; one that never returns would hold `Loop.Wait`). A throw/panic is `close_failed`, returned. | native.ts within (Promise.race([promise.then(settled), timeout]), clearTimeout): select over the work's done channel and a timer job closing a channel; a work settled before the timer ran wins; the work's error is returned when it rejects first; the timer is stopped on return. | native.ts drained (Promise.allSettled): the same race over every piece of work; empty drain is `settled` without a timer; a rejected piece counts as settled. | Delta v1.5.0+c23b9ec1: A native opens in its own chord.open span and closes in a chord.close root. Open: chordSpans(parent)('chord.open', ..., async span => value = await #open(withTelemetry(span, context))), 'open_failed' rethrown, then await #opened(value) (a late value, after the attempt ended, is closed once and reported). The opener's wait is the attempt's opening context: an abandoned attempt aborts it, the span ends ok (cancelled), and the open that settles later is closed by the late-value path. Close: chordSpans(telemetry)('chord.close', ...) awaits #closeWithin(value, reason, withTelemetry(span, owner.context)); a close that throws or outlives its closeTimeout is reported and the span marked 'close_failed'. Go: Open runs on an owned awaitTask under the opening ctx; the close in reverse order on the teardown task (host_native.go); TestNativeSpansOpenEachNativeInAChordOpenSpanOfItsAttemptsAndCloseItInAChordCloseRoot, TestNativeSpansKeepAnOpenItsAttemptAbandonedCancelledOk, TestNativeSpansMarkACloseThatFailedFailed, TestHostNativesAbortTheOpenersContextWhenTheObjectEndsWhileOpeningALateValueIsClosedOnce."

