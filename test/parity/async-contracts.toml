rationale = "Declarations of the callbacks the agent loop awaits, which is where the file's Promise contract lives: streamFn may return a stream or a Promise of one (:37); getApiKey may return a value or a Promise (:254); convertToLlm, transformContext(messages, signal) (:222, :244), the turn hooks (prepareNextTurn / finishTurn, :157, :188, :280), getSteeringMessages and getFollowUpMessages (:293, :306), beforeToolCall and afterToolCall (`(context, signal) => Promise<... | undefined>`, :326, :341) and a tool's execute(toolCallId, params, signal, onUpdate) (:498-500) are all awaited by the loop in source order at their call sites in agent-loop.ts: tool calls prepared in source order, executed concurrently with Promise.all, each hook awaited before the tool it guards, results emitted in the order the tools settle; the AbortSignal passed to each is the run's and an abort ends the run with terminal events. The file itself runs no async code; the loop's behaviour is the agent-loop.ts and agent.ts rows. Go agent/types.go declares these as blocking functions taking ctx (the signal) and returning (value, error), and the loop in agent/ calls them in the same order. The cited tests pin tool end and hook order by settle order, steering and follow-up queues, the abort signal reaching subscribers and handlers, a prepare-next-turn rejection finishing the assistant as failed, hook function validation and failure reporting, transformContext changes taking effect on the next run, and the terminal events of an aborted run."

