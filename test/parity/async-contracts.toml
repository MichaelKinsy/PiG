evidence = ["test:codemode/remote_test.go#TestAnImmediateToolAnswerReachesTheRemote", "test:codemode/remote_test.go#TestASynchronousToolAnswerReachesTheRemote", "test:codemode/remote_test.go#TestMessagesAreDeliveredInTheOrderTheRemoteSentThem", "test:codemode/remote_test.go#TestAbortAnswersThePendingExchangeWithStop", "test:codemode/remote_test.go#TestAFailureAfterTheClientFinishedIsNotReported", "test:codemode/remote_test.go#TestCloseWaitsForTheRemoteToReturn", "test:codemode/remote_serve_test.go#TestAServedCallCarriesTheBufferedOutputAndItsResultIsPosted", "test:codemode/remote_serve_test.go#TestTheServerReturnsAfterTheTerminalReply", "test:codemode/remote_serve_test.go#TestARejectedExchangeEndsTheServer", "test:codemode/remote_serve_test.go#TestAStopReplyEndsTheServerWithoutATerminalMessage", "test:durable/core/host/cf/test/codemode-serve.test.ts#concurrent tool calls are concurrent exchanges whose replies may arrive in any order", "test:codemode/deterministic_test.go#TestDeterministicRunsApplyResultsInSeqOrderWhenTheTransportReordersRepliesSentInOrder"]
rationale = "The client's exchange registers the waiter for a call before it delivers the batch, because the host may answer synchronously, and answers a batch without a call with null at once; execute is called in a microtask (Promise.resolve().then) and its settlement is reported as a sandbox failure when the script has not settled ('Remote sandbox returned before the script settled') or the remote rejected ('Remote sandbox failed: ...'). A pending exchange is answered with stop when the caller aborts, which is how the remote's VM is disposed. serveCodemodeRemote forwards output in batches and does not await the exchange of a call or flush (it reacts to the reply), so several exchanges are in flight and replies may come in any order; end() delivers the terminal message with the buffered output, stops the channel and then resolves, and the exchange's rejection counts as a null reply. Go keeps the order of calls and the single reply with a callback exchange, serves on one loop goroutine (the Worker module as a step machine, with the host owning the awaits; the host holds the printed output and the module counts it), and the client joins the remote's return before Execute returns. Pi 1.2.0's server buffers `started` with the output and sends `idle` at once, like a call, because a host replaying a script waits for it; replies that arrive out of order are applied by `seq` in the VM. The Go server does the same."

