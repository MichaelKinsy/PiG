evidence = ["test:ai/auth_storage_memory_queue_test.go#TestResolveProviderAuthCancelledMemoryRefresh", "test:ai/oauth_registry_lock_upstream_test.go#TestRegistryOAuthRefreshCancelledDuringTheRefreshPersistsTheCredentialUpstream", "test:ai/auth_refresh_signal_test.go#TestOAuthRefreshSignalIgnoresCallerDeadline", "test:ai/models_runtime_auth_upstream_test.go#TestModelsRuntimeAuthUpstream"]
rationale = "refreshStoredOAuthCredential awaits the credential store's lock-held Modify. The caller's signal cancels only the wait for the lock; once the callback starts, the provider refresh and its persistence ignore it and are bounded by the 15 s timeout alone, so a cancelled caller cannot discard a rotated refresh token. Upstream's callers race the Promise with their signal; the Go function does that itself, returning the cancellation cause while the refresh finishes in a background task counted by oauthRefreshWork, which ends at the timeout. A refresh that failed after the caller left is dropped, as the raced rejection is upstream. Other resolve.ts promises (resolveApiKey, readCredential) stay awaited calls that return their error."

