rationale = "WatchLifecycle (the base of Watch and NativeWatch). start installs the sole listener and queues one drain microtask when frames are already pending; advance and retire queue frames and, once started, a drain: #schedule queues at most one microtask, #drain runs one frame at a time, awaits the listener's promise, sets value to the frame's value before the call and hands it a context without the frame's abort signal. A listener that rejects reports the error, ends the watch listener_error (a non-Error wrapped in an Error) and stops delivery; the retirement frame ends it retired once delivered; stop ends it stopped at once without aborting or awaiting the callback in flight, and drops the pending frames and every reference into the source. observeCancellation ends it cancelled when the signal aborts, also when already aborted, and is installed once. Go chord/watch_impl.go keeps the sequence: Start installs the listener, a frame is taken into delivery under the lock in publish order and its listener runs on a delivery goroutine of the DeliveryScheduler (never inline, one at a time, joined by DeliveryScheduler.Wait), a returned error or panic is reported and ends the watch listener_error, Stop closes the watch without joining the running callback, ObserveCancellation uses context.AfterFunc, and the end drops detach, report, replace, listener, scheduler and pending frames. A started watch with no callback in flight takes a committed frame into delivery before Advance returns, as the drain microtask enters the listener before the publishing commit's caller resumes. The tests assert in-order awaited delivery with buffering, the goroutine hop, stop with a callback in flight, the cancelled and listener_error ends and the overflow that never folds the in-flight frame; the NativeWatch end reasons are covered the same way. Pi a2fd25f56 adds the Watchable interface, whose watch(context) returns Promise<WatchHandle<T>>: Go's Watch(ctx) is a blocking call that returns the handle or an error; the lifecycle contract of the file is unchanged. Re-reviewed for Pi 5e106ab1c: NativeWatchable declares watch(context): Promise<NativeWatchHandle<T>> beside Watchable's, with no implementation, so no new async behavior; Go declares Watch(ctx) (NativeWatchHandle[T], error) as it does for Watchable, and the test shows the acquired watch holds the current value, delivers one frame per new value in order and ends with the context's cancellation. Delta at Pi d0aa218c: d8d99950a replaces the pending frame list with a PendingOps queue and a record of the newest frame. #drain takes next() (the newest value, the folded ops and the newest frame's context) for each listener call instead of shifting one frame, invoke receives that delivery, and #terminate calls release() to drop the queue; the awaited listener call with the abort-free delivery context, the running flag that serializes calls, the microtask-deferred start and advance scheduling, the retirement ending the watch after its delivery, and the listener error ending the watch are unchanged. NativeWatch keeps its own queue of values and collapses past 100 to replace(). Go: watchLifecycle takes next, hasPending and release from the handle; frames advanced while a call is in flight fold into the next call and the in-flight call is never folded into an overflow. Pi 8b0caefc: a retirement is a flag of the next call and the watch goes on; endAfterDelivery() ends it `ended` after the pending call returned (the EndAfterDelivery tests of chord/watch_upstream_test.go). Pi 5f312dac: a failure call drops pending frames and waits as one call; a value after it replaces it ([[\"r\", value]]); Value() keeps the last value; the watch stays open; a failure after the end is ignored. An aborted context ends the watch aborted; installing the abort twice panics 'Watch abort is already installed'."

