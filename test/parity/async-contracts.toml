rationale = "Every exported operation awaits its steps in order, and Go runs them as blocking calls that take a context. runSsh (:127-176) resolves on the child's close and rejects on a spawn error, a failed exit or its timer; the timer sends child.kill(), Node's SIGTERM, and rejects at once with the stderr read so far, without waiting for the close. Go's runSsh sends SIGTERM through the command's Cancel (a plain kill on Windows, as Node does) and returns at the timer with the stderr read so far; a goroutine reaps the child, and WaitDelay bounds that reaping when a descendant keeps the output open. The caller's context is Go's own cancellation: it stops the run the same way and returns the context's error. scanHostKey removes its temporary directory when it settles, after the scan connection and ssh-keygen have finished. changeKnownHosts chains the changes to one file (:224-250) so each reads what the previous one wrote, and a failed change does not stop the next; Go holds a mutex per file for the whole change, and keeps that mutex after the change where Pi drops its map entry, which only retains one mutex per known-hosts path. sshConnection's async command (:480-499) runs when the Connection starts the daemon, one start at a time; Go's CommandFunc runs on the Connection's start with its context, and a mutex guards the detected system that remote() reads meanwhile. Re-audited at Pi c23b9ec1: the async skeleton of packages/env/src/ssh.ts (every async, await, Promise, then/catch/finally, signal, abort, throw, timer and yield line, imports excluded) is identical to this file at v1.5.0, so the contract above carries unchanged."

