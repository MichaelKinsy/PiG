ivergence outcome and then aborts the VM with an error the script cannot catch, and a failing store fails the call: the divergence subtests of TestDurableCodeMode (a different number of calls, waits without making a call, other arguments, admits no call of a diverging replay). release (:744-775) waits for the gate, then checks every held call of a rerun against earlier attempts before launching any: checks every call a rerun holds before launching any of them. launch (:790-815) runs one live call, journals its result unless the call stopped, and a failure while the abort signal is set fails the call, otherwise diverges. callTool/callGlobal reach the nested tool through api.executeTool; the model slots (modelSlot/releaseModelSlot :897-910) admit at most four concurrent model calls and a call that waited for a slot starts nothing after the script ended: TestCodeModeModels (runs at most four model calls at once; does not start a model call that waited for a slot after the script ended). Calls still running when the script ends are aborted (TestDurableCodeMode: aborts a call still running when the script ends; drops a global result that arrives after the script finished). Go runs these continuations on the call's owned goroutines and its serialized event loop, which the call joins before returning. Delta at Pi d0aa218c: f715a15c1 copies the call preview's cut with ownedSlice; no added or removed line contains async, await, Promise or .then, so the reviewed contract is unchanged."

