[[files]]
path = "packages/env/src/terminal.ts"
disposition = "translated"
contracts = ["awaited", "cancellable", "detached-owned", "microtask-ordering"]
evidence = ["test:env/terminal_test.go#TestOpenTerminalRunsAProgramInATerminalWithInputResizingAndItsExitCode", "test:env/terminal_test.go#TestOpenTerminalFailsToOpenInAMissingDirectory", "test:env/terminal_test.go#TestOpenTerminalKillsTheProgramOnClose", "test:env/terminal_test.go#TestOpenTerminalKeepsInputInOrder", "test:env/terminal_test.go#TestOpenTerminalWriteOfMoreThanAFrameArrivesWholeAndInOrder", "test:env/terminal_test.go#TestOpenTerminalReportsTheJobInTheForegroundNotTheShellAtItsPrompt", "test:env/terminal_test.go#TestOpenTerminalKillsEverythingInTheSessionOnCloseAndOnALostConnection", "test:env/terminal_test.go#TestNewRemoteTerminalKeepsWhatItIsGivenAndWriteTakesBytesOrText", "test:env/terminal_test.go#TestOpenTerminalCancelledBeforeItStartedAbandonsTheOpenAndKillsTheProgram", "test:env/terminal_test.go#TestOpenTerminalFailsWhenTheRequestEndsWithoutStarting"]
rationale = "openTerminal starts the pty request with its own AbortController and returns a promise that the started event resolves and a failure of the request before it rejects (:94-127); exited is the request's promise, settling with the exit code or the daemon's error (aborted after close, lost on a lost connection). Go's OpenTerminal starts the request on a context from context.Background that Close cancels, blocks until the started event or the call's end, and a goroutine waits for the call and delivers how it ended on a channel; it ends when the call settles, which the reply, Close or the loss of the connection causes. RemoteTerminal.Exited latches that result with sync.Once, so it can be awaited many times as the promise can. write and resize send requests without awaiting them and swallow their errors, which exited reports (:85-90); in Pi each request runs until its await of the shared, already resolved connection promise, so requests in a row are sent in call order. Go's request starts the call with Connection.Start, which writes the frame before returning, and never waits for it; the Connection owns the pending call until its reply. foreground awaits its request; Go's Foreground blocks on it with the caller's context. onData runs on the connection's reader in output order. Go adds a context to OpenTerminal that only abandons the open: cancelling it before the started event returns the context's error and cancels the pty request, so the daemon kills a program that was starting (TestOpenTerminalCancelledBeforeItStartedAbandonsTheOpenAndKillsTheProgram). Go also returns `The terminal ended before it started` when the request ends without a started event, where Pi's open promise stays pending because started settles only from the started event (:116) or a rejected request (:125) (TestOpenTerminalFailsWhenTheRequestEndsWithoutStarting)."

