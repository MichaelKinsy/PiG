evidence = ["test:internal/evals/harness_run_test.go#TestRunPiCodingAgentFailures", "test:internal/evals/harness_run_test.go#TestRunPiCodingAgentAnswersAndRecordsTheRun", "test:internal/evals/harness_run_test.go#TestRunPiCodingAgentReloadContinuesTheSession", "test:internal/evals/harness_run_test.go#TestRunPiCodingAgentSandbox", "test:internal/evals/harness_upstream_test.go#TestHarnessUpstream", "test:internal/evals/harness_session_read_error_test.go#TestRunPiCodingAgentReportsAnUnreadableSessionFileByItsReadError", "test:internal/evals/combine_failures_test.go#TestCombineFailuresAggregatesAsPiRunPiCodingAgent"]
rationale = "runPiCodingAgent (:272-469) runs the agent in-process; internal/evals/harness_run.go RunPiCodingAgent drives a pig RPC subprocess (agent_process.go) as one blocking call. Every await maps to a blocking step in the same order: workspace/agent-dir setup and seeding, model/auth resolution, session creation, extension verification, the sandbox entry, then each input step (reload, or prompt through promptAgent's settled-response checks, settledResponse). The AbortSignal maps to ctx: it is checked before work starts (:279) and before each step (Pi checks in promptAgent, :239); an abort during a prompt sends the session an abort and waits for the run to settle within processStopGrace, as the abort listener's session.abort() is awaited in the finally (:368-384), so the error is the aborted turn's ('cancelled during a prompt aborts the agent'; returning ctx.Err() without the abort fails it). The finally (:419-446) keeps Pi's order: session snapshot artifact, session dispose (process close), rm root, restore environment, restore the hidden credential; failures combine as Pi's AggregateErrors (:448-466), with the partial run attached only when diagnostics exist. A session path that does not exist is 'Pi eval produced no session file.', while an existing file that cannot be read reports its read error (:422-428). chownTree's and protectTransformedModules' Promise.all (:122-152) reject on the first error while the other operations still finish; Go walks in order and stops at the first error. The difference shows only on a failed sandbox entry, whose root the cleanup then removes. options.output additionally receives ctx (Go API)."

