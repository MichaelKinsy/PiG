rationale = "queueMicrotask(flush) is Loop.Queue: the first entry of a turn queues one flush, run after the section that emitted (host_events.go push/flush); listeners run inside it, what they emit goes into the next flush. EventMember.on returns Promise.resolve(subscription) or Promise.reject(abort reason): an already settled Promise, a blocking (subscription, error) that enters the loop once. A context's abort stops its subscription (context.AfterFunc enters the loop later, so a call due after the abort is also skipped by checking the context at delivery). Emit and On are sections of the loop (inline inside one) because the continuation of a suspended handler runs outside the section that admitted its call."

