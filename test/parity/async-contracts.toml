rationale = "Pi 885a564b (#11184): executeCodemode awaits reserveCodemodeWorker before it builds the sandbox. A script that finds every worker taken joins a FIFO of waiters (admitCodemodeWorkers grants free slots in arrival order whenever a slot is released or the limit is read), waits at most min(timeout_ms, 60 s), and settles as aborted (the signal's reason), timed out (while waiting for a free codemode worker) or no-worker-in-60-s without starting; the wait is subtracted from the script's own deadline. The reservation covers the one worker the script starts: acquireWorker hands it to the sandbox, which releases it when the worker actually exits, and a launch that resumes after the result settled finds it released and starts nothing; a script that never reached the sandbox releases it in finally, exactly once. PI_CODEMODE_MAX_WORKERS is read on every grant. Go keeps this in coding/extension/builtin/codemode/execute.go (reserve, admit, release, workerReserved) and codemode/workerlauncher.go (settled launches skip AcquireWorker). Re-audited at Pi c23b9ec1: the async skeleton of packages/coding-agent/src/extensions/codemode/execute.ts (every async, await, Promise, then/catch/finally, signal, abort, throw, timer and yield line, imports excluded) is identical to this file at v1.5.0, so the contract above carries unchanged."

