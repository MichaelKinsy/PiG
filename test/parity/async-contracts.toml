disposition = "translated"
contracts = ["awaited"]
evidence = ["test:telemetry/telemetry_upstream_test.go#TestTelemetryUpstream", "test:telemetry/telemetry_upstream_test.go#TestTypedSpanStarterRecordsStartAttributesAndNestsByCallbackSpan", "test:telemetry/conformance_upstream_test.go#TestConformanceUpstream", "test:telemetry/propagation_upstream_test.go#TestPropagationUpstream", "test:telemetry/metrics_upstream_test.go#TestMetricsUpstream"]
rationale = "TelemetryContext.startSpan and the typed starter (bindTypedSpanStarter, :325-340) admit the callback synchronously and return a Promise of its result. Go's TelemetryContext.StartSpan and the generic telemetry.StartSpan call the callback on the caller's goroutine and return its result or error when it settles, the awaited form; a callback that would await before settling blocks until it is done. The typed starter binds the child starter to the callback's span, so nesting follows the span the callback receives, not the goroutine. An unawaited startSpan has no Go form: a Go caller that wants spans to run concurrently calls StartSpan from its own goroutines, and each span then settles when its callback returns, as each Promise settles when its callback's Promise does. The Pi 1402973a additions (TelemetryPropagation.inject/extract, SpanLink, addLink, TelemetryMetrics) are synchronous and add no Promise; startSpan keeps its Promise, so the awaited form above also carries a span started under an extracted remote parent or with links (TestPropagationUpstream)."

