rationale = "New in Pi c23b9ec1. runAuthLogin (:36-100) is a sequential awaited command that returns the exit code: it validates the arguments and provider synchronously, then awaits modelRuntime.login with a login interaction whose prompts are awaited one at a time (a select prompt re-asks until the answer is valid, :205-220; text and secret prompts await terminal.question/secret with AbortSignal.any([command signal, the prompt's own signal]), so a prompt cancelled by the browser callback winning does not cancel the login). A rejection becomes exit 1 with a message chosen in order: a CredentialSynchronizationError (the login was saved), `Login cancelled` when the command signal aborted or the message says so, otherwise the failure text. Only after the login resolved does it await refreshProviderCatalog (:224-262), whose request signal is AbortSignal.any([command signal, 15 s timeout]): once the login is saved Ctrl+C or a timeout only skips the refresh and says so; then the Radius MCP config is written synchronously. The command signal is the controller main.ts aborts on SIGINT. Go coding/cli/auth_login.go RunAuthLogin(ctx, args, options) blocks through the same steps with the prompts answered in order on the calling goroutine, the same message order, the 15 s catalog-refresh context joined with the command context, and the same skip-not-fail rule after a committed login. The tests pin the no-method browser sign-in, the interactive-terminal requirement after argument checks, a pending prompt cancelled without cancelling the login, a committed login reported separately from a failed one, Ctrl+C during the catalog refresh keeping the login, cancellation reporting, and a provider's own cancelled error while the context is live."

