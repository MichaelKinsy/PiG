rationale = "Every client call is awaited by its caller. request (:189-204) builds a signal from AbortSignal.timeout(15 s) combined with the caller's (AbortSignal.any), awaits fetchServer and then response.json() (a body that is not JSON is tolerated, an HTTP error becomes an Error with the server's message). Delta at Pi c23b9ec1: fetchServer (:178-188) wraps fetch: a connection failure becomes `Could not reach llama.cpp server at <url>: <detail>` with the cause attached, except when the request's own signal aborted, in which case the abort error is rethrown unchanged (so a cancelled caller is never reported as an unreachable server); request and the SSE watch both go through it. The wait helpers are sequential loops: unloadAndWait awaits unload, then polls list every 100 ms; loadAndWait (:282-320) and downloadAndWait (:323-365) create a `watcher` AbortController linked to the caller's signal (linkSignal), start `watch(onEvent, watcher.signal).catch(() => {})` intentionally unawaited to stream progress and failures, await the load/download request, then poll list on a signal-aware sleep (250 ms / 500 ms) until the model is loaded, failed (`Model exited with code N` or the event text) or the signal aborted (`signal.reason ?? Cancelled`), and in finally unlink the signal and abort the watcher, so the background watch never outlives the call. watch (:248-280) reads the SSE body chunk by chunk and ends when the signal aborts. Go internal/codingagent/llama/client.go and fetch.go keep the loops with ctx (time-limited requests, sleeps that end on ctx), start the SSE watch in startWatcher (a goroutine the call owns, returning once the SSE request is written so the watch precedes the load as upstream's does, with a stop function that cancels it and waits for it to exit, deferred by LoadAndWait/DownloadAndWait), and wrap connection errors with the same text unless ctx ended. The tests pin the exact `Could not reach` text with the failure type, that a cancelled call is not reported that way, the SSE progress and loaded-state wait, the exit-code and cancellation paths, the download wait with byte progress, framing of split and malformed events, the watch naming the server and cause, and the command's retry offer and the provider refresh reporting network errors and aborted callers."

