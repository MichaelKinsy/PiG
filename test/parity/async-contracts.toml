disposition = "deferred"
contracts = ["awaited", "concurrent-joined", "cancellable", "microtask-ordering"]
evidence = ["test:tui/editor_async_provider_test.go", "test:tui/editor_autocomplete_flush_test.go", "test:tui/editor_completion_owner_test.go", "test:tui/editor_completion_upstream_test.go", "test:tui/editor_completion_boundary_external_test.go", "test:internal/codingagent/autocomplete_wrappers_test.go", "test:internal/codingagent/autocomplete_read_checkpoint_test.go", "test:internal/codingagent/autocomplete_extension_read_test.go", "test:tui/editor_autocomplete_hold_test.go", "test:test/extension-conformance/autocomplete_settle_test.go", "scenario:test/parity/scenarios/autocomplete/12-editor-completion-lifecycle.toml", "scenario:test/parity/scenarios/autocomplete/12-extension-wrapper-error.toml", "probe:docs/findings/fix-rigidity-b.md", "test:tui/editor_sticky_paste_upstream_test.go#TestUpstreamEditorPasteMarkerAtomicBehavior"]
rationale = "Native and extension autocomplete share one serial request worker. A native request that needs no I/O (command names, a command's synchronous argument completions, a directory read) is not started by the key that makes it: requestAutocomplete only schedules startAutocompleteRequest, a Promise job that runs after the terminal read's last sequence and before the next read, and only the newest request of a read reaches the provider. Go starts it in Editor.FlushAutocomplete, which the owner loop calls once after each read, and publishes the menu on the owner loop in the same turn, so the next read's Enter accepts the menu (a `/model provider/id` typed and entered at once completes in Pi and in Go, and a second Enter submits); an owner that never flushes still starts the request from the task each key posts. Captured filesystem work and awaited argument completers run on the worker. The extension provider chain starts at the same point, once per read, on its worker, and holds the host's next read until its menu is published, its runtime announces real I/O (ui.autocomplete.pending: only the async Node runtime, at the end of its macrotask), the request is cancelled or the runtime's connection ends (D213); a blocking provider of another SDK settles when it returns, as a synchronous Pi provider does, so the Enter after text typed over an extension provider accepts the menu as in Pi. Natural symbol requests debounce for 20ms from a timer, a later task than any read; cancelled queued requests join predecessors, a request made behind an unfinished one joins it instead of answering at the end of its read, and completion joins owner publication before releasing the successor. Forced queries leave input live; synchronous application holds subsequent input until the owner applies its result. Cancellation is quiet, while real rejection reaches the crash owner. The remaining editor Promise and input surfaces stay deferred. Delta at Pi a77207d9c: one synchronous string callback of the paste-marker renumbering reads `suffixGroup ?? \"\"`; no added or removed line contains async, await, Promise or .then, so the reviewed contract is unchanged."

