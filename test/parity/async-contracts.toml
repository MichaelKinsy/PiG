rationale = "observeModelRequest starts its span with `void start(...)`: nobody awaits the span callback, and the observer returns once the callback has set the span (Pi's synchronous adapters guarantee that). Go launches the callback on a goroutine through Models.operations.Go, which makes it an owned background task that Models.Close drains, and the observer waits only until the callback has set the span. Events and the result are observed on the forwarding turn, after the outer stream's push and end; the span ends after the result, on the launched goroutine. If StartSpan fails, the no-op span stays in place and nothing is recorded. The observer has no cancellation of its own: it ends with the stream's terminal result. A nil or no-op parent installs no observer. Delta at Pi d0aa218c: f715a15c1 copies the 500-character span error message with ownedSlice; no added or removed line contains async, await, Promise or .then, so the reviewed contract is unchanged."

