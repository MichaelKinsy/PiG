call to the invocation signal (withAbortSignal) and awaits awaitWithContext so an already-aborted caller rejects even if the value resolved. Go durable/harness/scheduler.go implements the same on goroutines: the run loop and one goroutine per invocation (TaskScheduler.background WaitGroup), context.AfterFunc/linkedChild for withAbortSignal, the microtask-ordered drain (TestTaskScheduling, TestWakeRecomputed...), Close/Join aborting and waiting for every invocation, and waiters registered on the Session line (waiter_cancel). Waiters (waitForTask, waitForIdle) are subject to D224 as above (Session.AwaitDeliveriesEntered). Evidence covers phase order and checkpointing, abort marks and cascades below a cancelled owner, owned-task abort joined before the caller proceeds, the already-cancelled caller rule, idle waiter scoping, wake timers after sleep, scheduler faults ending the Session, delivery order of waiters, and that no goroutine outlives Close. Divergence D181: a job that nothing waits for (a conversation-owned task) commits in goroutine-scheduling order in Go, not in the order Pi's microtask hops fix, so the commit order of two unawaited jobs is not Pi's; the awaited paths above keep Pi's order. Delta at Pi c23b9ec1: the only changed async-skeleton lines are the new withAbortSignal and withoutAbortSignal imports (used at :2166 and :2406, already ported); the invocation context and the abortion-free step commit are unchanged. Delta at Pi e50dc7af9: #planCandidates (e50dc7af9) takes `#runnable` before the awaited reservation region and merges the undropped candidates back in front of whatever a publication queued meanwhile; #finalize takes `#finalizeChecks` before its first awaited round. Caller waits: the pass (reserve/finalize) awaits its region; ordering: a publication observed in the microtask gap after the decision and before the continuation is kept for the next pass (a waiter whose last dependency ended becomes a candidate again, a holder whose child ended stays checked); cancellation: none, a region's gate wait ignores the caller's signal as before; errors: a failed plan restores the taken candidates (finally), a Session failure propagates as before; concurrency: one pass at a time on the Session line, publications run concurrently. Go: no gap exists, a pass decides and applies under one hold of TaskScheduler.mu (scheduler_region.go regionLocked) and publication observers take that mutex, so a notification either precedes the whole pass (seen by the decision) or follows it (kept in the sets); the core's passes are synchronous steps. Delta at Pi 473515f9c: a reservation in run mode computes the wake (#woke) synchronously inside the decision region and writes it with the consumed or expired signal memos in the same commit that marks the task running; registry publications and opens mark gate-parked sleepers runnable synchronously (#wakeGate), a phase that finishes under a replaced registry snapshot wakes its gate after the run returns (the publication counter), and the close AbortController (#closed, closeSignal) is aborted synchronously at the seal, so a tool's cancel cleanup outlives an abort mark. No new awaits; scheduler.go keeps the single scheduler lock, so each decision Pi makes between two awaits is made under it, and closeSignal is cancelled in seal."

