evidence = ["test:chord/next/store/store_test.go", "test:chord/next/store/group_commit_test.go", "test:chord/next/store/outbox_test.go"]
rationale = "Pi's commit queue is the `#tail` promise chain: commit, commitSeries, replay and take take their place synchronously at the call and run once the entry before them settled, a settled entry never blocking the next whatever it rejected with. Go keeps that with a ticket taken under the store's mutex at the call (a channel the previous entry closes), and Commit, CommitSeries, Replay and Read block until their promise would settle. Group commit (S18) lets the commits queued behind a running step share the next step's backend transaction: enlist takes a commit's place at the call, behind the open group or as the first of a new one, and Wait runs the group's turn on the goroutine of its first commit once the entry before it settled, settling every commit of the group (no goroutine of its own; a panic out of a callback of the turn rejects the unsettled commits storage_failed, stops the store and goes on in that caller). The context counts the step and aborts nothing once queued, as Pi's."

