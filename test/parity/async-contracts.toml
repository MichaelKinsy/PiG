[[files]]
path = "packages/codemode/src/runtime/host.ts"
disposition = "translated"
contracts = ["awaited", "concurrent-joined", "detached-owned", "cancellable"]
evidence = ["test:codemode/lifetime_test.go#TestExecuteReturnsOnlyAfterTheVMIsClosedForEveryTerminalKind", "test:codemode/lifetime_test.go#TestCloseAbortsEveryRunningExecutionAndWaitsForTheirVMs", "test:codemode/lifetime_test.go#TestExecuteWaitsForANestedCallThatFinishesAfterTheScriptEnded", "test:codemode/sandbox_test.go#TestAbortsViaContextAndCancelsInFlightCalls", "test:codemode/sandbox_test.go#TestAbortsUnawaitedCallsWhenTheScriptReturns", "test:codemode/sandbox_test.go#TestRunsConcurrentCallsAndListsToolNames", "test:codemode/sandbox_test.go#TestRejectsExecuteAfterClose"]
rationale = "execute() returns a Promise that resolves once the worker is terminated; Execute blocks until the VM is closed and every goroutine it started has exited. The void handleCall of each tool call maps to a call goroutine owned by the execution: finish() aborts the pending calls' contexts (AbortController) and the execution waits for them. Timeout, AbortSignal and close() all finish with kind timeout/aborted exactly once, after which later results are dropped. close() is Promise.all over the running executions, and Close aborts each and waits for all. execute() on a closed sandbox rejects; Execute returns the same error. There is no worker, so worker.terminate() and the SharedArrayBuffer interrupt are replaced by the wazero halt global and context close."

[[files]]
path = "packages/codemode/src/runtime/prelude-source.ts"
disposition = "translated"
contracts = ["awaited", "microtask-ordering"]
evidence = ["test:codemode/sandbox_test.go#TestEmbeddedSourcesMatchTheirRecordedHashes", "test:codemode/sandbox_test.go#TestExposesToolsAsAsyncFunctionsAndRecordsCalls", "test:codemode/sandbox_test.go#TestRunsConcurrentCallsAndListsToolNames", "test:codemode/sandbox_test.go#TestAbortsUnawaitedCallsWhenTheScriptReturns"]
rationale = "The prelude runs inside the guest VM: it captures Promise.prototype.then and builds one guest Promise per tool call that the host settles. PiG executes the same bytes (codemode/assets/prelude.js, hash-pinned), so the guest-side ordering is the engine's; the host side of each call is recorded under host.ts."

[[files]]
path = "packages/codemode/src/runtime/worker.ts"
disposition = "translated"
contracts = ["awaited", "cancellable", "microtask-ordering"]
evidence = ["test:codemode/sandbox_test.go#TestSupportsTopLevelAwait", "test:codemode/sandbox_test.go#TestTerminatesAMicrotaskSpinningLoopOnTimeout", "test:codemode/sandbox_test.go#TestFailsAScriptThatWaitsOnAPromiseNothingCanSettle", "test:codemode/lifetime_test.go#TestAScriptThatNeverReachesTheInterruptCheckIsStoppedByClosingTheInstance"]
rationale = "The worker creates the VM, evaluates the script as an async function body, awaits its promise while draining pending jobs, and posts done/crash. PiG drives the same QuickJS instance in process (codemode/execution.go worker.start/drain/settle), settling tool results on the driver goroutine in arrival order, so guest-side microtask ordering is that of the shared engine. A script that spins the microtask queue is stopped by the halt check, as terminate() stops it upstream."

