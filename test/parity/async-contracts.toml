evidence = ["test:internal/codingagent/autocomplete_wrappers_test.go", "test:test/extension-conformance/autocomplete_test.go", "scenario:test/parity/scenarios/autocomplete/09-extension-wrapper-state.toml", "scenario:test/parity/scenarios/autocomplete/10-custom-editor-wrapper-state.toml", "probe:docs/findings/fix-rigidity-b.md", "test:internal/codingagent/interactive_user_bash_async_test.go", "test:internal/codingagent/interactive_user_bash_lifetime_test.go", "test:internal/codingagent/interactive_user_bash_subprocess_test.go", "scenario:test/parity/scenarios/extensions-runtime/41-user-bash-input-owner.toml", "test:internal/codingagent/interactive_reload_test.go", "test:internal/codingagent/reload_ui_upstream_test.go", "scenario:test/parity/scenarios/session/28-session-reload-ui.toml", "test:internal/codingagent/rebind_ui_upstream_test.go", "scenario:test/parity/scenarios/session/29-session-rebind-ui.toml", "test:internal/codingagent/shutdown_input_owner_test.go", "test:internal/codingagent/upstream_signal_shutdown_test.go", "scenario:test/parity/scenarios/extensions-runtime/33-shutdown-order.toml", "test:internal/codingagent/interactive_startup_input_upstream_test.go", "test:internal/codingagent/startup_await_input_test.go", "test:internal/codingagent/startup_input_order_test.go", "test:internal/codingagent/startup_queue_lifecycle_test.go", "scenario:test/parity/scenarios/startup/10-startup-input-before-session-start-completes.toml"]
rationale = "Partial review: autocomplete factories rebuild synchronously at their API boundary; callbacks execute off the owner loop and publish before input resumes. Both editors share the chain. Startup/reload waits preserve UI callback progress, and factory ownership ends with its connection. The async submit callback awaits user_bash without blocking terminal input. PiG owns one task for dispatch, execution, persistence and acknowledged owner-loop completion. It retains the active cancellation context and mode lifetime, joins outgoing tasks before replacement/reload, and invalidates queued UI changes after shutdown. Failed or cancelled hooks never execute locally. Streaming state is read after hook completion, and persistence targets the captured Session. Native and actual isolated/packed Node guards cover input progress, cancellation, replacement, shutdown and retained state; scenario41 compares the complete release trace with real Pi. Reload retains its focus-owning blocker through awaited extension work, forwards the operation context, pumps UI callbacks and joins cancellation before restoring the editor. It preserves user-bash settlement and remote-editor/autocomplete teardown. Rebinding captures the actual Session across awaited handlers; replacement renders and subscribes before session_start, while stale startup completion cannot subscribe or update the title. Original reload/rebind cases and compiling mutations are recorded in docs/parity/session-runtime-helper.md. Terminal input has one owner shared by startup and final interaction; temporary UI loops do not replace it. Final loop exit and Run cleanup cancel and join the pausable file reader, fallback reader and decoder before releasing terminal/output resources. Non-file ReadClosers are closed only while cancellation still owns an active read, and close failures return after cleanup; terminal files stay open. The original shutdown order/hint assertions and deterministic held-reader guard prove completion ordering. Ordinary editor input stays live after managed-tool setup. Idle submissions queue until the main input consumer starts, after positional prompts finish. A one-shot callback clears on resolution or owner-loop exit; exit also releases queued strings, and an already-cancelled owner admits no queued prompt. The resolved prompt runs after the current terminal read's synchronous sequences and before the next read. Default, alternate-submit, and remote-editor paths share that handler. Queued prompt delivery, retained draft text, one-shot ownership, initial-message ordering, and current-read/next-read ordering have deterministic regressions and a real Node startup barrier scenario. Other interactive async paths remain unreviewed, so whole-file closure stays deferred."

