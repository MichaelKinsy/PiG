[[files]]
path = "packages/durable/src/codemode/codemode.ts"
disposition = "translated"
contracts = ["awaited", "cancellable", "detached-owned", "microtask-ordering"]
evidence = ["test:durable/codemode/codemode_test.go#TestDurableCodeMode", "test:durable/codemode/call_test.go#TestAScriptsTimeoutLimitsItsRun", "test:durable/codemode/call_test.go#TestACallLaunchesOnlyOnceItsIssuedCountIsCommitted", "test:durable/codemode/call_test.go#TestTheFirstRunRecordsTheVMsFingerprint", "test:durable/codemode/call_test.go#TestALaunchedCallEntersBeforeTheNextOneIsLaunched", "test:durable/codemode/call_test.go#TestAReplayedCallEntersBeforeTheNextOneIsStarted", "test:durable/codemode/call_test.go#TestOnlyTheFirstDivergenceOrFailureOfACallDecidesItsEnd", "test:durable/codemode/call_test.go#TestAScriptsEndWaitsForTheReplayedCallsItIssued", "test:durable/codemode/call_replay_pi_test.go#TestResumeAtTheDeadlineEndsTheCallAndOneMillisecondBeforeDoesNot", "test:durable/codemode/call_restart_scenarios_pi_test.go#TestAResumedScriptThatEndsInItsFirstRunDivergesOnlyWhereTheLiveRunWentOn", "test:durable/codemode/call_restart_scenarios_pi_test.go#TestAResumedScriptThatEndsAfterAResultDivergesOnlyWhereALaterEntryAnswersACallItNeverMade", "test:durable/codemode/call_restart_scenarios_pi_test.go#TestANestedCallThatFailsBecauseTheHostClosedLeavesTheScriptToALaterAttempt"]
rationale = "CodemodeCall.execute (:372-520) is one awaited tool call: it awaits api.agent(context), then one api.commit that either returns the stored result of a finished run (`done`) or records the run start (version, seed, deadline, tools, namespaces, globals, the conversation store) and reads the journal, so a restart resumes the same run; it ends the call early with decide() (a committed error result, then the sandbox aborted) for a version mismatch or a deadline that passed while interrupted. It then starts the sandbox and awaits `run.result`, with the call's abort signal forwarded to the sandbox controller (`onAbort`, removed in finally) and the sandbox's own callbacks owned by the call: onCall launches each tool call the script makes (executeTool, awaited by the script, with the journal entry committed before the next call is launched, a replayed call entering before the next is started), onIdle commits the issued-count watermark (a call is launched only once its issued count is committed), onStarted checks the VM fingerprint (`void this.checkFingerprint`, intentionally unawaited, a failure ends the call through `this.failure`/decide). A sandbox that ends aborted without the call being aborted (the host closed it while shutting down) stores nothing, waits for the invocation's own abort and throws, so a later attempt replays the script; a replay that ends where the live run went on is a divergence reported as an error result. complete() commits the formatted result and the store in one commit. Go durable/codemode/tool.go (createCodemodeTool), call.go (CodemodeCall) and docs.go keep this structure: the call blocks on the sandbox run, the call's ctx is linked to the sandbox's controller, onCall/onIdle run on the sandbox's goroutines with the same entry-before-launch ordering, and each commit is the same one api.Commit. The tests pin the whole run, the timeout limit, issued-count commit before launch, the fingerprint record, call launch/replay entry order, which divergence decides a call's end, that the script's end waits for the replayed calls it issued, deadline resume at the boundary, divergence only where the live run went on, and a host close leaving the script to a later attempt."

