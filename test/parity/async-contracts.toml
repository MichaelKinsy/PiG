path = "packages/codemode/src/runtime/execution.ts"
disposition = "translated"
contracts = ["awaited", "cancellable", "detached-owned", "microtask-ordering"]
evidence = ["test:codemode/seam_test.go#TestTheChannelIsStoppedOnceAfterTheFirstTerminalEvent", "test:codemode/seam_test.go#TestRepliesProducedBeforeTheChannelArrivesAreSentWhenItDoes", "test:codemode/seam_test.go#TestAChannelThatArrivesAfterTheExecutionEndedIsStoppedWithoutReplies", "test:codemode/remote_test.go#TestCloseWaitsForTheRemoteToReturn", "test:codemode/lifetime_test.go", "test:codemode/host_finish_deadline_test.go", "test:codemode/start_test.go#TestStartForwardsTheStartDataAndTheCallsOfTheScript", "test:codemode/start_test.go#TestDeliverPostsTheAnswerWithItsSequenceNumberAndClock", "test:codemode/start_test.go#TestStartEndsAsAbortedWhenTheCallerCancels", "test:codemode/deterministic_test.go#TestDeterministicRunsAreFinishedOnceTheyHaveTheirOutcome"]
rationale = "execute() returns the result promise, which resolves once the first terminal event (done, crash, a launcher failure, the deadline or an abort) has stopped the channel; Go's Execute blocks for the same result and returns it. The deadline and the caller's abort signal cancel the run (the context in Go), and pending tool calls are aborted through their own signals. Tool calls run without the VM waiting on them (handleCall is not awaited by the message handler): Go runs each on its own owned goroutine that the execution joins before it returns. close() awaits every running execution's abort. Replies produced before the launcher returned its channel are queued and flushed in order when it arrives, and a channel that arrives after the run ended is stopped without replies; the launcher is entered through a promise, so a synchronous launcher failure is reported the same way as an asynchronous one. Pi 1.2.0 adds start(): it returns a CodemodeRun at once whose `result` settles like execute()'s, `finished` is set when the outcome is decided, before `result` settles, and the control callbacks (onStarted, onCall, onIdle) run synchronously as each VM message is handled, so a call reaches the caller before a later `done` finishes the run; deliver() is synchronous (it validates, records and posts the reply). Go's Start returns a *Run whose Result blocks for the same result and whose Finished reads the same flag; the callbacks run on the goroutine that delivers the VM's messages, in arrival order, and Deliver validates and posts before it returns. Pi 3daa2028 changes comments only (stop requests shutdown)."

