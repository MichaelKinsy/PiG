rationale = "launcher.ts Launcher. startTerminal awaits tokenOf, then `launcher.start()`: #startSandbox = await GET `start` (JSON), `Promise.all` of the script and the combined file (downloads in parallel; one failure rejects the start), then `await Sandbox.start(...)`, then raw mode and the input/resize/exit/SIGUSR1 listeners; it resolves with `{exited, stop}`. After that everything is Node's single event loop: sandbox messages arrive through onMessage synchronously and a throwing handler ends the client (finish(1)); a bridge request `#answer` is an async function per request (fetch/base: a GET with no timeout and no signal, so only the 8 MiB bound ends a download; attach/copy/open: `await #confirm(...)`, one prompt at a time, a second refused with `a prompt is open`; the claim `#confirming = true` is made at the request's turn, before the first await, so frames the sandbox writes after a request are held in order, not drawn before the prompt); at most MAX_REQUESTS outstanding, the reply goes to the sandbox that asked (never to a restarted one); `#confirm` in finally writes the held frames and posts a resize. Prompts are promises resolved by the key handler (`#answered`) or by finish (answers false). Sockets (`#openSocket`) are event-driven WebSockets: open/message/close are posted to the sandbox in event order, a send before open is dropped, more than 16 MiB buffered terminates the socket, more than MAX_SOCKETS refuses. #outdated awaits GET `base` (a failure counts as unchanged) and #restart: close the sockets, await terminate, await #startSandbox, resize; a failure ends the client (finish(1)). finish(code) is idempotent: it removes the listeners, restores the terminal, answers an open prompt false, writes RESET_MODES, closes the sockets, awaits the sandbox's termination, then resolves `exited`. Go (D602, draft) keeps the observable order with one event-loop goroutine: handlers are closures posted to `events` (`post`/`sync`, a bounded queue of 256) and run one at a time, so the claim of the prompt (`confirming = true`), the request count and the held frames happen on the loop in the order the sandbox sent them; downloads, prompts and the reply run in a goroutine per request (at most maxRequests, `l.get` takes l.ctx, so finish cancels them: Pi's cannot be cancelled), `confirm` re-enters the loop with `sync` to release the held frames and post the resize; the prompt's Ask waits on its answer channel or loopDone (finish answers false); sockets are a dial goroutine plus a write loop per link, their open/message/close events re-posted to the loop with a generation check so a socket ended before the loop saw it stays closed and a send on it is dropped (the four socket tests); outdated/restart run off the loop (they download) and take it only to read the running hash and swap the sandbox (generation++), a restart failure finishes with 1 (TestATerminalIsNotLeftRawWhenTheSandboxEndsWhileTheLauncherStarts for the start path). Two differences from Pi: cancelling StartTerminal's ctx ends the client (Pi has no cancellation: its controller is never aborted), and finish joins the loop before reporting exit (Pi awaits only the sandbox's termination). Executor: Node's loop; one launcher goroutine plus per-request, per-link and per-sandbox goroutines for Go, each ended by finish (portlint:allow golifetime comments in tui_launcher.go)."

