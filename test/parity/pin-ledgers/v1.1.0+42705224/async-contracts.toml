evidence = ["test:internal/chord/observation_prefix_test.go#TestKeyedObserverRunsBeforeSnapshotReadiness", "test:internal/chord/observation_prefix_test.go#TestKeyedObservationPrefixFailureReportsDuringSpawn", "test:internal/chord/observation_prefix_test.go#TestContinueObservationReportsOnlyLiveRejection", "test:internal/chord/keyed_reentrant_pi_differential_test.go#TestKeyedObservationHandlersReenteringTheBindingMatchPi", "test:internal/chord/keyed_update_pi_differential_test.go#TestKeyedBindingUpdatesMatchPiOnRandomSequences"]
rationale = "InstanceDirectory is synchronous except #start (:127-138). #start calls the observer's handler inline, so its synchronous prefix runs inside the replace, ready or observe that admitted the instance, in entry-then-observer order over the live sets, and a synchronous throw is reported before that call returns. Go admits the starts under the keyed mutex and runs them on the admitting goroutine before the operation returns (keyed.go runObservationStarts), so a handler that observes, stops another observation or itself, or reads its view re-enters the directory in Pi's order (live Pi oracle with re-entrant handlers). The handler's returned Promise is left unawaited and its rejection is reported only while the observation context is not aborted; Go's handler returns its synchronous result, and a continuation runs through ContinueObservation, which reports a failure only while ctx is live. The context is cancelled when the instance is removed, the observer stops, or the directory is disposed, and a start cancelled between admission and invocation never runs, as a closed observer or removed task is skipped. Like Pi, dispose does not await a continuation; the continuation must stop when ctx is done."

