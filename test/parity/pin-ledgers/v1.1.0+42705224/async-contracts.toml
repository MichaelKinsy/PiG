disposition = "deferred"
contracts = ["awaited", "concurrent-joined", "cancellable", "microtask-ordering"]
evidence = ["test:tui/editor_async_provider_test.go", "test:tui/editor_completion_owner_test.go", "test:tui/editor_completion_upstream_test.go", "test:tui/editor_completion_boundary_external_test.go", "test:internal/codingagent/autocomplete_wrappers_test.go", "scenario:test/parity/scenarios/autocomplete/12-editor-completion-lifecycle.toml", "scenario:test/parity/scenarios/autocomplete/12-extension-wrapper-error.toml", "probe:docs/findings/fix-rigidity-b.md"]
rationale = "Native and extension autocomplete share one serial request worker. Native synchronous callbacks are prepared on the owner loop; captured filesystem and awaited callbacks run on the worker. Natural symbol requests debounce for20ms, cancelled queued requests join predecessors, and completion joins owner publication before releasing the successor. Forced queries leave input live; synchronous application holds subsequent input until the owner applies its result. Cancellation is quiet, while real rejection reaches the crash owner. The remaining editor Promise and input surfaces stay deferred. 42a3497d changes only the synchronous cursor drawing (renderFakeCursor); the autocomplete worker contract is unchanged (reviewed)."

