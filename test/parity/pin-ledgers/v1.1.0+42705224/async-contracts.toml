evidence = ["test:internal/chord/facet_dispose_overlap_pi_differential_test.go#TestCombinedLoaderBeginsEveryReleaseBeforeWaitingAsPi", "test:internal/chord/facets_test.go#TestCombineFacetLoadersReleasesInReverseOnce", "test:internal/chord/reentrant_cleanup_test.go#TestCombinedLoaderDisposeIsReentrant", "test:internal/chord/facet_reload_pi_differential_test.go#TestFacetHostReloadsMatchPiOnRandomSequences", "test:internal/chord/facet_source_pi_differential_test.go#TestFacetHostExternalSourceMatchesPiOnRandomSequences"]
rationale = "createFacetHost (:22-30) awaits kernel.activate before it returns the host; Go's CreateFacetHost blocks on facetKernel.activate and returns its error (the activation's own Promise contract is facets/host.ts's). createStaticFacetLoader (:32-39) loads and disposes without awaiting anything; Go's static loader returns at once. combineFacetLoaders (:41-67) awaits each loader in order; on a load failure it awaits disposeLoadedFacets over the loaded sets in reverse and throws the load error, or an AggregateError with the cleanup failures. Its dispose sets disposed before the first await, so a reentrant or later call resolves at once, then awaits disposeLoadedFacets over the sets in reverse: one failure is rethrown as is and several become an AggregateError. Go's CombineFacetLoaders does the same with safeCall and beginDisposeLoaded; its result has both BeginDispose (the flag swap and the begun releases) and Dispose, so a combined set nested in another one also overlaps its releases with its siblings'. The production node facet loader (internal/experimental/node_facets.go) supplies BeginDispose too: the flag swap precedes its first await in Pi, and the bridge release runs as the rest. Load and the loaders take a context that Pi's load() does not, which is additive cancellation."

