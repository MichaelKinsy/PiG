[[files]]
path = "packages/coding-agent/src/extensions/mcp/cli.ts"
disposition = "translated"
contracts = ["awaited", "cancellable"]
evidence = ["test:coding/mcp_oauth_session_upstream_test.go#TestAgentSessionMCPOAuthGivesUpOnPigMcpLoginAfterTimeoutAlsoWhileTheAuthorizationServerHangs", "test:coding/mcpext/oauth_cancel_test.go#TestSignInMcpServerReportsAnAbortedAuthorizationServerRequestAsACancellation"]
rationale = "login() awaits signInMcpServer with AbortSignal.timeout(timeoutMs), so --timeout (1.1.0, #10565) bounds the whole sign-in, including requests to the authorization server, and the aborted sign-in is reported as the cancelled-or-timed-out message. waitForRedirectUrl resolves undefined when that signal aborts (the callback arrived or the sign-in timed out). PiG runs SignInMcpServer under context.WithTimeout of the command context and the redirect prompt returns when that context ends; the timeout covers the sign-in only, not the reconnect after it."

[[files]]
path = "packages/coding-agent/src/extensions/mcp/index.ts"
disposition = "translated"
contracts = ["awaited", "cancellable", "detached-owned", "ui-handoff"]
evidence = ["test:coding/mcpext/responsive_test.go#TestMcpCommandOpensTheManagerBeforeTheStartupConnectionsFinish", "test:coding/mcpext/responsive_test.go#TestMcpManagerEnablesAServerInTheBackground", "test:coding/mcpext/responsive_test.go#TestMcpDirectToolCallWaitsForItsServersReconnect", "test:coding/mcpext/responsive_test.go#TestMcpPreparedToolCallResolvesTheConnectionWhenItExecutes", "test:coding/mcpext/manager_test.go#TestMcpManagerReconnectRunsInTheBackgroundWithoutAStatusScreen", "test:coding/mcp_oauth_session_upstream_test.go#TestAgentSessionMCPOAuthCancelsASignInWaitingOnTheAuthorizationServerWhenTheSessionShutsDown", "test:coding/mcp_oauth_session_upstream_test.go#TestAgentSessionMCPOAuthClosesTheSessionWithoutRefreshingAnExpiringToken", "test:coding/mcpext/extension_test.go#TestAgentSessionMCPCodemodeScriptWaitsForTheServersItNames"]
rationale = "The extension owns one AbortController per session (aborted on session_shutdown and before the first session_start); work captures its signal when it starts and drops late results once it aborted. startConnection waits for its `after` promise, starts only while its attempt token, the server's enabled state and the session still apply, and publishes server.ready; waitForServers loops until the latest attempts settle or the tool call aborts; reconnect chains behind server.ready and replaces it; disabling clears the attempt token and records a closing promise that a replacement awaits before opening a transport. `/mcp` opens the manager without awaiting the startup connections, and runInBackground runs connection actions off the menu, dropping a result whose attempt was replaced; sign-ins stop on Esc and on the session signal and are registered with track so session_shutdown awaits their cleanup. PiG maps the controller to a context owned by the Extension, the promises to channels closed by goroutines registered in backgroundTasks (drained by SessionShutdown, which also admits tasks started while it waits), the attempt token to a pointer compared under the extension mutex, and runInBackground to a goroutine whose synchronous part (config save, detaching the connection, installing the ready channel) runs before it starts, as the Promise's synchronous prefix does."

[[files]]
path = "packages/coding-agent/src/extensions/mcp/oauth.ts"
disposition = "translated"
contracts = ["awaited", "cancellable"]
evidence = ["test:coding/mcpext/oauth_cancel_test.go#TestSignInMcpServerStopsWhileWaitingForTheBrowser", "test:coding/mcpext/oauth_cancel_test.go#TestSignInMcpServerReportsAnAbortedAuthorizationServerRequestAsACancellation", "test:coding/mcpext/oauth_cancel_test.go#TestSignInMcpServerStopsWithoutRequestsWhenItsContextAlreadyEnded", "test:coding/mcpext/oauth_request_timeout_internal_test.go#TestSignInMcpServerGivesEveryAuthorizationServerRequestTheOAuthRequestTimeout", "test:coding/mcpext/oauth_request_timeout_internal_test.go#TestTimedFetchGivesEveryRequestTheOAuthRequestTimeout", "test:coding/mcpext/oauth_refresh_test.go#TestMCPOAuthRefreshRefreshesOnceWhenSeveralProcessesFindTheSameTokenRejected", "test:coding/mcp_oauth_session_upstream_test.go#TestAgentSessionMCPOAuthCancelsASignInWaitingOnTheAuthorizationServerWhenTheSessionShutsDown"]
rationale = "signInMcpServer awaits the flow and takes an AbortSignal that stops it at any step with McpSignInCancelledError (an aborted request is reported as the cancellation it is); waitForAuthorizationResponse races the callback and the pasted-URL prompt, whose signal also aborts with the sign-in; timedFetch gives each authorization-server request OAUTH_REQUEST_TIMEOUT_MS (15 s) on top of the request's own signal (1.1.0, #10565). The refresh the auth provider runs is deliberately not cancellable, because an answered refresh may have rotated the refresh token. PiG maps the signal to the context.Context of SignInMcpServer, the 15 s bound to timeoutFetch, and the detached refresh to a context without cancellation; the refresh single-flight is joined on the flight's done channel."

