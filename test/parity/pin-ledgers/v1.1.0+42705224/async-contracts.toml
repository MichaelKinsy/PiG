evidence = ["test:coding/extension/host/inproc/upstream_subscriptions_test.go", "test:coding/extension/host/inproc/ui_prompt_snapshot_test.go", "scenario:test/parity/scenarios/extensions-runtime/39-event-subscription-snapshots.toml", "test:coding/extension/host/inproc/upstream_user_bash_test.go", "test:test/extension-conformance/user_bash_test.go", "scenario:test/parity/scenarios/extensions-runtime/40-user-bash-result-validation.toml", "test:extensions/sdk/request_lifetime_race_test.go", "test:extensions/sdk-rs/src/request_lifetime_tests.rs", "test:extensions/sdk-py/tests/test_request_lifetime.py", "test:coding/extension/host/subprocess/retained_context_node_test.go", "scenario:test/parity/scenarios/extensions-runtime/48-retained-context-host-calls.toml"]
