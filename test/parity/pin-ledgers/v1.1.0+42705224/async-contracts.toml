rationale = "Input actions enter their service call in input order (client-tui.ts:522-607): an implementation with an admission boundary is admitted by the serialized invocation queue, and a blocking call without one runs as the whole synchronous prefix. #close (client-tui.ts:334-366) awaits only recovery, the lane, the facet reload tail and facet disposal. The Promises of controller.prompt/steer/followUp, requestAbort (`void`) and command.run run on BACKGROUND_CONTEXT and are neither joined nor cancelled, so Close abandons the wait for a stalled call and does not enter inputs queued behind it; admitted transport operations are still joined. Results and errors reach the UI through the owner executor. The remaining file-wide async obligations (recovery, reload, selection) stay deferred to the harness slice."

