rationale = "formatResult awaits truncate, which writes the full text to output.txt when it is cut, then saveImages, which starts one write per distinct image in item order (an image shown twice shares one pending label) and joins them with Promise.all, keeping the item order; a failed write becomes the label instead of failing the result. Go's formatResult (durable/codemode/output.go) writes the files one after another in the same order with the same names (image-<n> in first-seen order) and the same labels, which is what the joined Promise.all yields, through the call's outputFiles (the recorded output directory, so a rerun writes the same paths)."

