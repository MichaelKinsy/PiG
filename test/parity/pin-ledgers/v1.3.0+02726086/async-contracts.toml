path = "packages/chord/src/loader.ts"
disposition = "translated"
contracts = ["awaited", "cancellable", "detached-owned"]
evidence = ["test:chord/host/loader_upstream_test.go#TestNodeLoaderLoadsFacetModulesAndReloadsThemWithFreshCopiesOfTheirRelativeImports", "test:chord/host/loader_upstream_test.go#TestNodeLoaderRejectsAModuleWhoseDefaultExportIsNotAFacet", "test:chord/host/loader_upstream_test.go#TestNodeLoaderNamesFacetsByTheirModuleURLInModuleOrder", "test:chord/host/loader_upstream_test.go#TestNodeLoaderCarriesErrorsAndAbortsAcrossTheProcessBoundary", "test:chord/host/loader_upstream_test.go#TestNodeLoaderStopsItsChildrenAtCloseAndWhenTheirFacetsAreUnreferenced"]
rationale = "The one async function in loader.ts is nodeLoader (:36-62): it registers every facet's directory (the registerHooks resolve hook carries the reload query to the modules under those directories), then awaits `import()` of each module in module order and throws a TypeError for the first default export that is not a facet, so a load either returns every facet or rejects with that error. Go's NodeLoaderImpl.Load keeps the awaited sequence in a Node child (the isolated-Node loader of owner decision C1(b), over ForkDriver and a HostManager): the child awaits the imports in module order, installs the facets, and reports ready or fatal; Load blocks until then and returns the child's error (a TypeError for the default-export case, with Pi's message). The reload query, the root set and the hook are replaced by process isolation: every Load is a fresh process, so a reload's copies are fresh and the facets of one Load share one module graph whatever their order (the 7d75a0e3 ordering case holds by construction, and its test cannot fail for that reason). Ordering: replies are matched to requests by id, so concurrent calls complete in any order as concurrent promises do. Cancellation: loader.ts has no signal; Go adds the Chord call's own: a root aborted while a call is in flight aborts the child's root (its method sees ctx.signal), returns aborted at once, and drops the late reply. Error shape: a ChordError thrown by a method keeps its code, reason and message across the boundary (details, cause and retryable are not carried; Go recomputes retryable from the code); any other throw becomes a plain error with its message. Lifetime: Pi's loader leaks every replaced module copy until the process exits (TODO(loader)); Go owns one child per Load, stopped by Close, or by a runtime cleanup once no facet or behavior of that load is referenced (a reload replaced it and the epochs that used it ended), so the facet table, the pending requests and the child do not outlive their owners. Not carried: the principal a record is made for, and a facet's access to the Go host (its contracts, ctx and principal); state, opaque members, several variants, accepts adapters and state migrations need the served object on the Go host, so a facet that serves them is refused at Load with a TypeError."

