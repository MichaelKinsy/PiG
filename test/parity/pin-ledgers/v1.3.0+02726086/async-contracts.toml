path = "packages/coding-agent/src/modes/interactive/components/easter-egg-3d.lazy.ts"
disposition = "translated"
contracts = ["detached-owned", "ui-handoff"]
evidence = ["test:internal/codingagent/pig_logo_animation_test.go#TestClickingTheHeaderPigPlaysTheAnimation", "test:internal/codingagent/pig_logo_animation_test.go#TestHeaderPigClickIgnoredWhileAnOverlayOrTheAnimationIsOpen", "scenario:test/parity/scenarios/fullscreen/11-logo-click-animation.toml"]
rationale = "D87: PiG plays its pig version of the Pi-logo egg; /arminsayshi keeps the inline pig head, so playArmin3d has no counterpart. playPiLogo3d (playEasterEgg3d) returns synchronously after the fullscreen and overlay checks and the screen capture; the unawaited import().then() then starts easter-egg-3d.ts and swallows only a failed import. Go links the module, so the click handler calls playPigLogoAnimation on the owner loop in the same order: fullscreen check, overlay check, screen capture, then the playing flag. Its color wait is the easter-egg-3d.ts row."

[[files]]
path = "packages/coding-agent/src/modes/interactive/components/easter-egg-3d.ts"
disposition = "translated"
contracts = ["awaited", "detached-owned", "ui-handoff", "cancellable"]
evidence = ["test:internal/codingagent/pig_logo_animation_test.go#TestHeaderPigClickIgnoredWhileAnOverlayOrTheAnimationIsOpen", "test:internal/codingagent/pig_logo_animation_test.go#TestPigLogoAnimationColors", "test:internal/codingagent/pig_logo_animation_test.go#TestPigLogoAnimationTimer", "test:internal/codingagent/pig_logo_animation_test.go#TestClickingTheHeaderPigPlaysTheAnimation", "scenario:test/parity/scenarios/fullscreen/11-logo-click-animation.toml"]
rationale = "D87: the Pi-logo kind as Pi 1.0.0 pi-logo-animation.ts drew it. playEasterEgg3d sets playing, awaits queryTerminalColors (100 ms timeout) and then, on the event loop, falls back to the theme's colors, returns if an overlay opened meanwhile, and shows the overlay. Go waits for the query on a background task owned by the mode's lifetime (cancelled and joined at exit) and posts the rest to the owner loop; a query that fails to write shows nothing and clears playing. The setInterval frame timer maps to a worker owned by the same lifetime that posts each tick to the owner loop and stops after finish, after a second without a render, or on Dispose, which cancels and joins it; a tick queued before Dispose runs nothing."

