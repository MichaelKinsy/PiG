[[files]]
path = "packages/coding-agent/src/modes/rpc/rpc-mode.ts"
disposition = "deferred"
contracts = ["awaited", "concurrent-joined", "cancellable", "microtask-ordering"]
evidence = ["test:coding/cli/rpc_replacement_order_test.go", "scenario:test/parity/scenarios/rpc/55-rpc-replacement-concurrent-get-state.toml", "test:coding/cli/rpc_set_model_pipeline_test.go", "test:coding/cli/rpc_retry_reactions_test.go", "scenario:test/parity/scenarios/rpc/17-rpc-abort-retry.toml", "test:coding/cli/rpc_dispatch_test.go", "test:coding/cli/rpc_queue_await_test.go", "scenario:test/parity/scenarios/rpc/07-rpc-model-thinking-commands.toml", "scenario:test/parity/scenarios/rpc/20-rpc-runtime-boundary-values.toml", "scenario:test/parity/scenarios/rpc/35-rpc-queue-prompt-await.toml", "scenario:test/parity/scenarios/rpc/31-rpc-cycle-await-interleaving.toml", "scenario:test/parity/scenarios/rpc/32-rpc-cycle-prefix-and-completion.toml", "probe:docs/findings/rpc-command-dispatch.md", "probe:docs/findings/rpc-h1-continuations.md", "test:coding/cli/rpc_admission_test.go", "test:coding/cli/rpc_preflight_admission_test.go", "scenario:test/parity/scenarios/rpc/36-rpc-preflight-admission.toml", "probe:docs/findings/rpc-preflight-admission.md", "test:coding/cli/rpc_prompt_admission_test.go", "scenario:test/parity/scenarios/rpc/13-rpc-steering-queue.toml", "probe:docs/findings/pr70-steering-admission.md", "test:coding/cli/rpc_set_model_await_test.go"]
rationale = "Session-replacing commands and export_html await off the input loop: a later command of their batch answers first, and replacements and compactions of one batch run in request order after the previous settled, with a fork resolving its entry in the Session that requested it (D146, D147). Pipelined set_model continuations resume in input order after the responses that synchronous handlers queued: auth checks run concurrently, but each settles from an executor event-loop task queued after the previous one's (rpcAwaitInOrder, rpcResponseTurn.enqueueTasks). All 33 upstream command branches and their conditional await boundaries are inventoried in the dispatch report. Prompt/input/preflight and nested queue completions now resume through the same FIFO await executor as synchronous replies. Handler invocation is admitted in order through its first suspension; completion remains independently awaited. Preflight is idle, rechecks streaming after input, accepts before claiming the Agent, and drains on EOF. Model-cycle prefixes and notifications retain their ordering. Shell completion never waits for a pending Provider. Retry reactions share the input executor, and abort joins settlement off the input loop so later synchronous commands retain pre-settlement state. set_model suspends on its auth check before it applies the model, so a later command in the same input batch runs first. Full-file async closure remains deferred for the other command implementations."

