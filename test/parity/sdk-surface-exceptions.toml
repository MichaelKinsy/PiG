#
# Reviewed missing cells in the 0.3.0 member inventory. These reasons describe
# current limitations, not behavioral closure or approval of a new divergence.
# Exact entries fail when implemented; prefixes fail when no missing cell remains.

[[exception]]
key = "tool render context.lastComponent"
sdks = ["go", "rust", "python", "lisp"]
reason = "Native renderers return lines rather than Components (D56), so no previous component is returned. Card state persists separately in context.state/State."

[[exception]]
key = "ctx.ui.setTheme → error"
sdks = ["node"]
reason = "Node returns synchronously before host theme validation, so it cannot report host errors. Requires synchronous validation/state acknowledgement rather than optimistic success."

# The interface inventory describes both type and value exports. Pi's root
# re-exports KeybindingsManager with `export type`, so it has no runtime value.
[[exception]]
key = "pi-coding-agent: KeybindingsManager"
sdks = ["node"]
reason = "Pi's published root index.d.ts re-exports KeybindingsManager as a type only. Both actual runtime namespaces omit it (TestNodeCodingAgentTypeOnlyExportsMatchPi)."

[[exception]]
prefix = "pi-coding-agent: KeybindingsManager."
sdks = ["node"]
reason = "Members of the type-only root re-export have no runtime receiver. Both Pi and PiG omit the value; the actual class remains in the private core/keybindings module."

# Optional platform/library hooks are absent in the exact Pi runtime too.
[[exception]]
key = "pi-tui: StdinBuffer.[Symbol.captureRejectionSymbol]"
sdks = ["node"]
reason = "Inherited optional Node EventEmitter rejection hook. Pi's StdinBuffer does not install it; this declaration is not an implemented method in the Pi oracle either."

[[exception]]
key = "tool render context.durationMs"
sdks = ["node"]
reason = "New in Pi 1.1.0: the tool render context carries this member. Go, Rust and Python publish it; the Node runtime does not yet. Closed by porting the member through the Node runtime with a conformance row."


# The component kit (D107): Node has no kit event object: Pi's callbacks are
# its events.

[[exception]]
key = "kit view events"
sdks = ["node"]
reason = "Node frames carry the lines Pi's components rendered, so every key reaches the runtime as ui.custom.input and Pi's SelectList and SettingsList handle it there: their onSelectionChange, onSelect and onChange callbacks are a Node author's events, as in Pi. The host never sends ui.view.event to Node."

[[exception]]
key = "kit event"
sdks = ["node"]
reason = "Node authors receive Pi's own SelectList and SettingsList callbacks (see kit view events); there is no event object to declare."
