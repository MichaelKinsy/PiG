rationale = "runWithLifecycle (:517-540) creates the active run (a promise and an AbortController) before it awaits the executor, a failure goes to handleRunFailure with whether the signal had aborted, and finally resolves the run so waitForIdle() (:359) - which returns activeRun.promise or an already-resolved promise - settles only after the listeners of agent_end have settled; prompt and continue reject while a run is active (:380-420). processEvents (:575-620) reduces state and then awaits every listener in subscription order with the run's signal (listeners are called with (event, signal), :196, :275); a listener rejection rejects the emit and with it the run. handleRunFailure (:542-560) builds the failure message ('aborted' if the signal aborted, else 'error') and awaits message_start, message_end, turn_end and agent_end in that order; a failure there propagates to the caller. abort() aborts the active controller and the caller awaits waitForIdle. Go: agent/lifecycle.go and agent/agent.go keep the same sequence on the caller's goroutine: the claimed run drains (done closed) after listeners settle even when Start fails, the run context is cancelled by abort, subscribers get that context, and a failing subscriber's error is the run's error. Mutations that each turned cited tests red: ignoring a subscriber's error turned TestAgentPromptMessages_ReturnsTheErrorOfAFailingSubscriber and TestAgentClassMatchesPi red; not waiting for the run's done channel turned TestAgent_WaitForIdleWaitsForAsyncSubscribers red; not cancelling the run context turned TestAbortBeforeTheFirstRequestSendsNoProviderRequest, TestAgentE2E_HandlesAbortDuringStreaming and TestAgent_PassesActiveAbortSignalToSubscribers red. Delta at Pi bd3c9b82: adc5fa9f/04a93bad add AgentOptions.identity and forward it to the loop; no added or removed line contains async, await, Promise or .then, so the reviewed contract is unchanged. An extension provider whose streamSimple or stream fails after the abort gives handleRunFailure's message (no content, stopReason aborted, errorMessage the thrown text) through the host in every SDK: the author-throws rows of TestRPCAbortedExtensionProviderTurnKeepsWhatTheAuthorGives and TestAbortedProviderTurnKeepsWhatTheAuthorsStreamGives."

