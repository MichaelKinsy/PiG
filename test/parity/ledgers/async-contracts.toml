rationale = "sender.ts sender(recorder, limit, waiting, release, call): send(partial) chains onto the previous send (`(sending ?? Promise.resolve()).then(() => once(partial))`), so sends run one after another in call order; once takes a batch only when something waits, calls the hold's ingest (`call` answers undefined when the reference is not live or not the worker variant: the batch goes back to the recorder at the back and the recorder's count is released), and otherwise awaits the call best effort (`await sent.catch(() => {})`: a refused or lost batch is given up, the count released). Nobody waits on the timer's sends (`void sender.send(false)` in page.ts and the worker's interval): detached tasks owned by the sender, errors swallowed by design, never rejecting. The worker's close awaits `Promise.race([send(true), sleep(WORKER_SEND_MS)])`, i.e. the final partial send is bounded by one second and then stop() releases the hold. Go Sender.Send is a blocking call under a mutex (one send at a time, in lock order), the final send in nextnode/app/worker.go runs on its own goroutine bounded by the same one second with the ticker goroutine stopped and joined first; Stop releases the hold. A Go tick that finds the previous send still running is dropped by the ticker rather than queued behind it (a batch waits in the recorder until the next tick, the same bound). The page sender is the vendored browser client (D601), not ported to Go (TestPageSenderSendsItsSpansWithoutMetricsOnceBoundUntilThenTheyWaitInTheRecorder, TestPageSenderGivesARefusedBatchUp, TestWorkerSenderSendsSpansAndMetricsToTheWorkerVariant). | Close bound (review RevAsync): the worker's close races the final send, which chains behind any periodic send in flight (Go Sender.Send holds the sender mutex for a whole send), against one second; Go closeTelemetry in chord/nextnode/app/worker.go now joins the ticker goroutine inside that bound (it used to join it before the bound) and the two worker_close tests pin the bound and the order; the send chaining itself is the mutex in Sender.Send."

