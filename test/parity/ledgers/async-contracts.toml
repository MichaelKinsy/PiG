rationale = "SessionManager.list/listAll (:1916-2060) and listSessionsFromDir (:942-975) are awaited and cancellable: each starts with `signal?.throwIfAborted()`, awaits readdir (listAll also reads the project directories and stats every candidate through mapWithConcurrency, ordering candidates by mtime descending then basename), and builds the SessionInfo of each file through mapWithConcurrency (:902-920), a pool of min(MAX_CONCURRENT_SESSION_INFO_LOADS, files) workers that share one `nextIndex`, check the signal before taking each item and write results by index, joined with Promise.all, so results are in candidate order whatever the completion order. Only an abort rejects the listing: buildSessionInfo (:800-882) streams the file with createReadStream(filePath, { signal }) through readline and its catch rethrows only an abort (`signal?.throwIfAborted()`) and otherwise returns null, so an unreadable or invalid file is dropped; a readdir or other failure in listSessionsFromDir or listAll returns [] unless the signal aborted (:971-973, :2054-2057). onProgress fires as each file finishes; partial lists are published sorted newest first (sortSessionInfos) at the publish interval, listSessionsFromDir itself returns its sessions in filename-descending order, and list and listAll sort the final list newest first (:1930, :2042). The remaining async code is not in session persistence: appends and branch operations are synchronous (their throws are validation errors). Go internal/codingagent/session_listing.go lists with a context and a bounded pool of goroutines (WaitGroup, joined before return), results placed by index, the context checked before each item, an invalid file skipped, a cancelled context returned as the error, and the result ordered by modified time (stable, newest first); the candidate order by mtime then locale-compared basename is the listAll order. The tests pin cancellation and progress, a race-free concurrent listing and sort, tie order, and the runtime's ListSessions."

