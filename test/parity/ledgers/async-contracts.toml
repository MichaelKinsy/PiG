rationale = "The async functions are the transactional document updates: configure and addTools await tx.doc(AgentDoc, conversationId) and then edit the draft in place, and createAgent returns for a forked conversation, otherwise awaits the new conversation's own agent document, then (for a task-owned conversation) the owner conversation's document and copies it over; they are part of the creating commit, so the reads happen in that order inside the transaction. Go durable/harness/agent.go Configure, AddTools and CreateAgent (called from the creating commit, harness.go:400) take the same Tx and perform the same reads and writes in order. The cited tests pin the stored tool filters after addTools, the array and object forms of configure, the three document outcomes of a created conversation (empty, owner copy, fork as-of copy) in TestHarnessAgent, and Pi's resolveAgent against the oracle. Delta at Pi 38ff9917: 6c2fd73b0 adds persistWithinMs to the progress policy and its resolver; no added or removed line contains async, await, Promise or .then, so the reviewed contract is unchanged. Re-confirmed at Pi e7a0df27: the delta since b3a29f11 changes no line that mentions async, await, Promise, then/catch/finally, timers, signals or AbortSignal, so the contract stands. Delta at Pi c23b9ec1: compactionFields (:183-190, called from compactionSettings when a change carries compaction settings) throws a synchronous RangeError (`compaction.<field> must be an integer 0 or more, got ...`) for a token count in a compaction policy or model override that is not an integer 0 or more. configure (:90-93) still awaits tx.doc(AgentDoc, conversationId) first and only then runs applyChange, so the RangeError surfaces after the document read (and after any earlier field of the same change was applied to the draft) and rejects configure's Promise inside the commit callback, which rolls the commit back with nothing stored; there is no new await. Go in follow/durable-7 (durable/harness/agent.go) has the same order: Configure reads TxDoc first and then applyChange returns the compactionSettings/compactionFields error (`%s.%s must be an integer 0 or more`, agent.go:632-661) with durable/compaction_overrides_test.go; this branch's base predates that port, so the validation is carried by the durable-7 merge and not by this row's evidence."

