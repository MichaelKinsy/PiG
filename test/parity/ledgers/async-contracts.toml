rationale = "runPrintMode (:33-185) is one awaited command returning the exit code. It sends the initial message and then each further message strictly one after another (`await session.prompt(...)`, :139, :143), so a later prompt starts only after the previous run, including its agent_settled extension handlers, finished; in JSON mode it subscribes a listener that awaits waitForRawStdoutBackpressure before the next event is written (so the writer never outruns stdout). rebindSession subscribes the event writer and that backpressure listener BEFORE `await session.bindExtensions(...)` (Pi 6aab551a79ba, #12232; they were subscribed after it before), so the events the awaited session_start handlers emit (entry_appended, session_info_changed, a custom message's message_start and message_end) have a listener and are written, at startup and, through setRebindSession, for a session an extension replaces; the session header is written before the first bind. The Go `bind` closure of print_mode.go subscribes before the awaited session_start emission and keeps no flag that waits for it (TestSessionOriginWritersObeyTheWriterSubscribedGate pins the order and the absence of the flag; the two JSON tests assert the written events in every SDK). In text mode the final assistant message decides the output: stopReason error or aborted is reported on stderr (its errorMessage or `Request <reason>`) and makes the exit code 1, otherwise its text blocks are printed and a `length` stop is reported as truncated with exit 1; in JSON mode the session header and every event are written as JSONL instead; any thrown error is reported and exits 1. Signals: SIGTERM (and SIGHUP where available) handlers are registered up front; the first signal runs `void disposeRuntime().finally(...)` and exits with 143/129 afterwards, the second (`signalCount > 1`) exits at once; `disposeRuntime` is memoized in `disposing ??= (async () => { unsubscribe; unsubscribeBackpressure; await runtimeHost.dispose(); })()`, so every caller (the signal path and the normal end) shares one disposal and a signal arriving during the final disposal waits for it rather than starting another or killing it. Delta at Pi c23b9ec1: that memoized shared disposal, the signal count and the repeated-signal force-exit are new (disposeRuntime was a plain async function before and a signal exited without waiting for disposal). After disposal the finally block removes the signal handlers and awaits flushRawStdout. Go coding/cli/print_mode.go runs the same sequence on the main goroutine, installs the signal handlers with a goroutine owned by the run and removed at the end, shares one disposal behind a sync.Once-style guard, waits for it on the first signal and exits at once on a repeated one. The tests pin the exit codes, that disposal runs to completion before the signal exit (and the JSON output and persistence stop), that a signal during the final disposal waits for it and a repeated signal after a stdout failure exits at once, error and aborted endings reported verbatim, the final-message-only text output, every positional message being sent in order, waiting for an extension prompt started from agent_settled, and run-signal changes reaching the extension host."

