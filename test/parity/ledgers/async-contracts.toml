ion (managedExt.makeEventHandler acknowledges before a frame is written: a registration never waits on extension IPC; Pi runs that handler inside the call, an open row). An invalidated runner starts no emission (Go cancellation addition); coding/session.go EmitSessionShutdownTransition (:1521) is the Go emitSessionShutdownEvent: HasHandlers gate then awaited Emit. Proof (synctest, no sleeps): TestRunnerEmitsAwaitEachHandlerBeforeStartingTheNext, per event (tool_call, tool_result, message_end, context, before_provider_request, before_provider_headers, user_bash, input, session_start via Emit) blocks the first extension's handler and asserts the second has not started until it is released; TestRunnerMessageEndChains... and ...BeforeProviderHeadersChains... assert each handler sees the predecessor's output and an erroring middle handler is reported once without ending the chain; TestUpstreamRunnerToolResult / TestUpstreamRunnerBoundary assert chained content/preview; TestEmitToolCall_HandlerErrorStopsDispatch asserts the error rejects and later handlers do not run; the mcp drain tests assert a burst of three registrations (first handler blocked) returns at once, is delivered as events with 1,2,3 servers one at a time, and that nothing is delivered after InvalidateKeepingRuntime; TestSessionEmitSessionShutdownAwaitsTheHandlerBeforeReturning asserts the call does not return until the blocked handler finishes. Mutations (red, restored, green): callHandler running the handler in a goroutine -> the await table red; EmitToolResult not feeding withToolResultFields -> TestUpstreamRunnerToolResult red; EmitBoundary `preview = projected` dropped -> TestUpstreamRunnerBoundary red; EmitMessageEnd feeding event.Message -> message_end chain red; headers handed maps.Clone -> headers chain red; EmitToolCall error `return nil, err` -> `continue` -> TestEmitToolCall_HandlerErrorStopsDispatch red; mcp_servers.go `if true || start` (a drain goroutine per event) -> burst test red; background Err check removed -> invalidation test red; session.go `go runner.Emit(` -> shutdown test red. Further mutations (each red, restored, green): emitContext (runner.go:1920) not adopting a handler's returned list turned TestEmitContext_ChainCompounds, ...HandlerCanRewriteMessages red, and its error path changed to return turned TestEmitContext_HandlerErrorRoutesViaEmitErrorAndContinues red; EmitContextWithSystem not adopting returned messages / returning on error turned TestRunnerContextWithSystemChainsMessagesPastAFailingHandler red (assertions on final messages and the per-handler message counts); EmitBeforeAgentStart keeping only the last message, returning on a handler error turned TestRunnerBeforeAgentStartCollectsMessagesInOrderPastAFailingHandler red, and dropping the ForceSystemPrompt update turned TestUpstreamRunnerBeforeAgentStart red; EmitResourcesDiscover losing attribution or returning on error turned TestRunnerResourcesDiscoverAggregatesInOrderPastAFailingHandler red; EmitProjectTrust (runner.go:1371) not skipping undecided results, or returning instead of continuing past an erroring handler, turned TestEmitProjectTrustFirstDecisiveResultWinsAfterErrorsAndUndecided red; callHandler on a goroutine turned TestEmitProjectTrustAwaitsHandlerCompletion and TestCacheWarmingDecisionAwaitsAndReportsHandlers red; EmitCacheWarmingDecision (cache_warming.go:12) returning on a handler error, or ignoring the returned action, turned TestCacheWarmingDecisionAwaitsAndReportsHandlers red."

