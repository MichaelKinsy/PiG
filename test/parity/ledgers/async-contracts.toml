rationale = "active-language.ts followActiveLanguage(host, preferred, changed, report, context): sets the language at once (`update()` before any await), then `await host.registry(Translations, ctx)` (the caller waits for the registry; an abort rejects), updates again, `(await registry.watch(ctx)).start(...)` (each registry change updates), and holds LocaleChoice: `choice.pick.watch(ctx).then(start, () => {})`, NOT awaited: the pick follows once the hold binds, and a hold that ends (the follower stopped) before its first value is no error. update() recomputes the locale from the pick, the device and the catalogs and, only when the locale or catalogs changed, sets the host's language and calls `changed` synchronously on the thread, so a callback that calls setDevice or stop runs after the current update finished, in order. stop() aborts the controller and releases the hold. Go FollowActiveLanguage: the same sequence on the caller's goroutine (the registry call takes ctx; a failure stops what already started), the pick follows from `ReferenceMember.WatchThen`, called right after the hold: Pi's unawaited `.then(start, () => {})` with no goroutine, its continuation a microtask of the host's loop that runs in the turn that binds the hold (under `gate` it starts the watch unless the follower was stopped, ignoring a bind error). Pi's ordering is microtask-ordering: a pick the server changes after the bind is a frame of the watch, because no link frame runs between the bind and the `.then`, and the watch's value (the pick at the bind, which the follower never reads) is not the pick of a frame. The Go goroutine that bound the watch and started it later opened it after whatever section came first, so a `choose(\"fr\")` landing there was folded into the watch's value and lost for good (the flake of TestFollowsTheDevicesLanguagesThePrincipalsPickAndTheCatalogsKeptAsThePageState: the pick watch opened after choose returned, 5 of 32 stress processes of 500 runs each under CPU contention on the old code, none of 16 with the fix). TestAMemberWatchOfAReferenceNotBoundYetIsOpenInTheTurnThatBindsIt proves the host side by queueing a turn behind the watch's own and requiring the watch open when it runs. update() delivers through an outbox so changes are delivered one at a time in order with no lock held while `changed` runs, a callback may call SetDevice or Stop and its own change is queued behind it (TestAFollowersCallbackMayStopItAndChangeTheDevice); a delivery that panics leaves the outbox usable (TestAnOutboxDeliversAgainAfterADeliveryPanicked). Stop marks the follower stopped under gate before it ends the watches and runs the stops; the pick watch's start is a microtask of the host's loop and must not block, so a follower stopped before it ran starts nothing and leaves the watch to Stop's cancel and the hold's release (Pi's `.then(start)` has no such branch; calling the watch's Stop there deadlocks the loop: TestStoppingAFollowerBeforeItsPickWatchBindsEndsQuietly stops the follower at varying moments of the bind with every Stop bounded, TestCancellingAFollowersContextBeforeItsPickWatchBindsEndsQuietly cancels it)."

