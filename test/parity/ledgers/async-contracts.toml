rationale = "worker.ts startWorker: the worker's start function is one awaited chain in the worker process on the start message's context: private directory, private store, `openStore`, `createHost`, `host.connect(parent, {principal: server, trusted: true}, context)` first (the server sees the worker started), then `await plugins.load(host, {kind, core}, context)`; each resource registers a closer with `onClose` (store, host) and closers run in reverse. When telemetry is on, the sender is created after the load, `setInterval(() => void sender.send(false), WORKER_SEND_MS)` (unref'd, fire-and-forget: one batch each second, errors are swallowed by the sender) and its closer clears the timer, then awaits `Promise.race([sender.send(true), sleep(WORKER_SEND_MS)])` (the last spans and metrics are sent while the link is up, for at most a second) and stops the sender; because closers run in reverse this runs before the host closes. Go workers/start function: the same sequence with ctx; the telemetry sender runs on a ticker goroutine owned by the worker (stopped and joined by the closer, `<-done`), and the final send runs in a goroutine bounded by `select { case <-sent: case <-time.After(workerSend) }`, then sender.Stop() (worker.go; the //portlint:allow golifetime marks the two goroutines). Final send: Go closeTelemetry(sender, ticked, workerSend) joins the ticker goroutine INSIDE the one bound: the final Send(true) waits for the ticker goroutine (a periodic Send(false) possibly in flight; the telemetryingest sender serialises sends under its mutex, as Pi chains send behind send) and `select` with time.After(workerSend) covers both, so a periodic send that does not end cannot hold the close past the second (fixed at the source: the close used to join the ticker before the bound; TestWorkerCloseBoundCoversAPeriodicSendStillInFlight is the bound, TestWorkerCloseSendsTheFinalPartialSendOnceThePeriodicOneEnded the order and the partial flag). Pi's periodic tick is `void sender.send(false)`; Go's ticker drops no tick differently from a timer: a tick that arrives while a send runs is delivered after it (the ticker channel holds one), Pi's setInterval callbacks run as the loop allows, each send chaining behind the last. Tests: app_workers_test.go (start with kit data and the worker's own directory, restart keeps store and files, host-data module private)."

