rationale = "Autocomplete requests form a chain: startAutocompleteRequest (:2328-2348) installs autocompleteRequestTask = (async () => { await previousTask; abort the previous controller, make a new AbortController, await runAutocompleteRequest }) and returns it, so a request starts only after every earlier one has finished, and a cancelled earlier request is joined, not abandoned. The debounce timer (:2318) only starts a request; runAutocompleteRequest (:2374-2420) awaits provider.getSuggestions with the controller's signal and applies the result on the UI loop only when it is still the current request and the text and cursor it asked about are unchanged; a provider rejection is reported on the loop. Cancelling (typing, escape, programmatic cancel, shutdown) aborts the controller and drops the answer. Go: tui/editor_async_provider.go runs each request on a worker owned by the editor, joins its predecessor (<-previous) before starting, hands the snapshot, the result and the error to the owner loop through scheduleAsyncApply, and rejects queries after shutdown. Mutation removing the predecessor join turned TestFlushAutocompleteJoinsARequestStillOnTheWorker, TestOwnedAutocompleteJoinsCancelledPredecessors and TestEditorTypedKeysThatTriggerNothingLeaveAPendingRequestAloneLikePi red. Mutations of this lane, each compiled and each red: the predecessor join removed (TestAutocompleteAnswerOfASupersededRequestIsNeverShown: the request for the newer text started while the one before it was unfinished), the start check of a request that waited (`ctx.Err() != nil || request != e.autocompleteRequestID` before the snapshot, Pi's startToken test at :2335) removed (TestAutocompleteRequestCancelledBeforeItsStartAsksTheProviderNothing), and the currency check of an answer removed (TestAutocompleteAnswerOfASupersededRequestIsNeverShown and TestAutocompleteAnswerOfACancelledRequestIsNeverShown: the stale answer became the menu). That currency check is made twice in Go, by the worker when the provider returns and by the owner loop before it publishes, as Pi's isAutocompleteRequestCurrent is called after the await; removing either one alone kept both tests green, so the tests prove that a stale answer is refused, not which of the two checks refuses it. tui/editor_completion_boundary_external_test.go is no longer cited: it asserts a sequential request whose answer is awaited, not an ordering or cancellation clause. Delta at Pi a77207d9c: one synchronous string callback of the paste-marker renumbering reads `suffixGroup ?? \"\"`; no added or removed line contains async, await, Promise or .then, so the reviewed contract is unchanged."

