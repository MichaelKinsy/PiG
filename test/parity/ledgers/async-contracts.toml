rationale = "No Promise runs in this file: its async surface is the AbortController behind loader.signal (:13-33). handleInput on a key bound to tui.select.cancel calls abortController.abort() and then onAbort?.() synchronously on the input loop, on every press (abort() is idempotent, onAbort is not guarded); any other key does nothing. Whoever awaits work with loader.signal therefore sees it aborted before onAbort runs; dispose() only stops the animation. Errors: none, nothing rejects. Go: CancellableLoader.HandleInput cancels its context and then calls OnAbort, on the caller's input goroutine; Signal() is that context. Mutation (swap: OnAbort before the cancel) turned TestCancellableLoaderAbortsTheSignalBeforeOnAbortRuns red."

