rationale = "surface-build.ts SurfaceBuild (Pi 1.5.1, 284e63d9c). #ready starts #run(BACKGROUND_CONTEXT) once and stores the promise: every waiter (build, file, parts, a rollout step) awaits the same outcome, so no caller's abort ends it, and the outcome (built or failed) is kept for good: a failed build answers 503 and fails its step's host for every later request, nothing rebuilds (TestAFailedBuildStaysFailed...). The server's close ends the build by failing it: its publishTo on the closed host rejects, the outcome is the failure and waiters answer 503; esbuild itself is not cancelled (TestTheServersCloseFailsTheBuildInFlight...). Go: surfaceBuild.start (once, under its mutex) starts one goroutine and `done` is a channel closed once the outcome is set; a waiter's context ends only its own wait (Pi's awaits take none; a request's abort and a rollout's are Go's contexts). #run never rejects: esbuild's failure or the first set's becomes the failed outcome, which answers 503 for file() and fails the rollout step's one host (`name`). step() awaits the build with the rollout's context (awaitWithContext): the abort rejects the step and the rollout stops there, the build goes on (TestARolloutStepDuringTheBuild...). A build in esbuild cannot be cancelled and, as in Pi, what it finishes after the close is dropped. Pi's `#close` leaves the build's Promise unawaited (app.ts:955-967 at Pi 1.5.2: `#close` does not wait for it) and so does Go (PiG ea821d524): surfaceBuild.close, called first by the app's Close, only marks the build closed and returns, the build in flight goes on and its result is dropped (TestClosingASurfaceDoesNotWaitForItsBuildInFlightWaitJoinsIt), and a build not started by then never starts, its waiters answered 503 (TestASurfaceClosedBeforeItsBuildStartedNeverStartsOneItsWaitersAnswer503). Forced Go lifetime difference, not a numbered divergence: the goroutine is owned, and surfaceBuild.wait (reached through App.Wait, no Pi counterpart, see the app.ts row) joins it: it returns once the build ended, or the context's error with the goroutine left to finish on its own (TestWaitingForASurfaceBuildReturnsTheContextsErrorWhenItEndsFirst). Forced Go mechanics, not divergences: Build() blocks where Pi's build() returns a Promise, Built() is the getter `built`."

