laceAndCommit): the NodeHost's commit is undone (rollbackNode, run whatever became of ctx: a refused import deletes what it put, a replace puts the old part back) and the import ends as Pi's undo flow leaves a refused one, the old directory back and the new one gone, with the commit's error as the cause (TestAppUndoesTheNodeHostsCommitWhenTheGoHostsFailsDefinitely); when that rollback fails too both errors are reported and the directories stay as after an unknown outcome (TestAppReportsBothErrorsWhenTheNodeHostsRollbackFailsToo); a `storage_failed` of either is the unknown outcome, which undoes nothing (TestAppKeepsTheNewDirectoryWhenTheGoHostsCommitHasAnUnknownOutcome). The worker lock is taken (workerLock bounded by addressLock, nil when held) for import and delete and held until the work ends. Proven by the host-part cases: records and rows of the address copied, refused, replaced and deleted with it; the import's order around the server's commits (undone before them, kept after an unknown outcome, the NodeHost's commit undone when the Go host's fails definitely); an existing directory refused before anything is unpacked; the commit's rejection kept as the cause; the export under the worker's lock with a hold arriving meanwhile. The NodeHost's part is reached through three control requests (plugins.NodeHost.ExportHostData, ImportHostData, DeleteHostData): each sends one request and blocks the caller until the process answers, returning the host's rejection as a *NodeError (the ChordError inside: invalid/args for a refused archive or existing data, unavailable/storage_failed for an unknown outcome); requests reach the process in call order; a ctx abort sends `abort` (the process aborts the host operation through the request's AbortSignal context) while the Go call still waits for the reply, so the outcome it returns is the host's; like Revoke they are refused inside a synchronous callback (ErrSyncCallback). In the process (host.mjs) each op awaits Pi's host call: export writes the JSONL file at mode 0600 through `encodeJsonl` and the host's commit queue is given back when the pipeline ends; import decodes the file and awaits importHostData with the address and `existing`; delete awaits deleteHostData. The two-store design (D462) means the cases that touch a plugin's records and rows run against the NodeHost; the Go host's part is exercised beside it in the same cases."

