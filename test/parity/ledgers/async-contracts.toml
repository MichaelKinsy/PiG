rationale = "sandbox.ts Sandbox: `static async start(source, start, onMessage, onEnd)` checks the Node version and the bundle size, awaits mkdtemp and writeFile of the bootstrap, spawns the child (`spawn(process.execPath, flags)`, three pipes, stderr drained and dropped, stdin errors swallowed) and writes the start frame; it resolves as soon as the child is spawned (not when it is ready). The child's stdout is read in `data` events on Node's loop, frames parsed in order, each message handed to `onMessage` synchronously (a malformed frame kills the child and ends the sandbox: the messages of that chunk are dropped, as push throws before returning any); the first output removes the bootstrap file. `post(message)` is fire-and-forget: it writes a frame to the child's stdin, and a child that is not reading (more than MAX_UNREAD + MAX_PIPE_FRAME buffered) is killed and ended. `onEnd` runs once (a close, an error event, a failure), `terminate()` sets ended (so onEnd is NOT reported for it), SIGKILLs and awaits the `close` event, which also removes the directory in the background. Go StartSandbox/Post/Terminate: Post queues the frame under a mutex with the same bound (the sandbox is ended when it is exceeded) and a writer goroutine writes the queue to stdin in order; a reader goroutine reads stdout, calls onMessage in order on its own goroutine (the launcher turns each into a post to its single event loop: one handler runs at a time), reaps the child with cmd.Wait, reports the end once, closes the writer and removes the directory; Terminate marks ended, kills and waits for the reader's exit (`<-s.exited`). A chunk holding valid frames before a malformed one delivers none of them and fails the sandbox, as Pi's (FrameReader.Push returns no message with its error, as `push` throws before it returns any; TestReadingTheSandboxsFramesHandsOutNoMessageOfAChunkWithAMalformedFrame, TestASandboxChunkWithAMalformedFrameDeliversNoMessageAndEndsTheSandbox); Go's Post never blocks the loop (TestASandboxEndingOnAPostTheLoopMakesWithTheQueueFullDoesNotBlockTheLoop). Executor: Node's loop for Pi; the sandbox's own two goroutines plus the child process for Go (language mechanics: the Go launcher replaces Pi's TS launcher; the sandbox child is Pi's Node bootstrap). Delta at Pi dd30101c (1.5.1): static start (:157-165) awaits realpath around mkdtemp (`await realpath(await mkdtemp(...))`, :161) before the bootstrap's writeFile, so Node's entry path has no symlinked ancestor and the file grant stays the one script. It is one more sequential awaited step before the child is spawned, with the failure mode of the steps around it (start rejects before any child exists). Go chord/nextnode/tui/tui_sandbox.go calls filepath.EvalSymlinks on the MkdirTemp result in the same position (removing the directory and returning the error on failure), and TestTheSandboxStartsWithASymlinkedTemporaryDirectoryWithoutExpandingFilePermissions starts the sandbox with TMPDIR, TMP and TEMP pointing at a link, receives its exit message and asserts the grant is the resolved directory."

