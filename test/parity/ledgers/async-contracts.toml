rationale = "Async sites: queryTerminalColors (:1534-1560, a Promise settled by the reply or a timer; ownership is described above), requestRender's process.nextTick(scheduleRender) (:1041), requestImmediateRender's nextTick (:1049) and scheduleRender's setTimeout (:1073). requestRender coalesces: one pending request, one nextTick, one timer; the timer fires after max(0, 16 ms - elapsed since the last frame), clears itself, renders once and re-arms if a request arrived during the render; a forced render cancels the timer, resets the render state and renders at the next tick on the loop, preempting a throttled frame; Stop cancels the timer and stops the callbacks. All of it runs on the one loop that owns the renderer; no render runs concurrently with input handling. Go: tui/tui.go requestRender/armFrame/runImmediateRender with the renderGeneration counter and the minRenderInterval throttle, callbacks marshalled to the owner loop through renderOnMain. Mutation (minRenderInterval check removed) turned TestTUIRequestRender_RespectsMinInterval, TestRequestRenderForceRendersAtOnceAsFullRepaint, TestAltScreenRenderStampsThrottleTimestamp and TestRenderNowRecordsTheRenderTime red. The generation counter is Go's form of Pi's cancelled timer and coalesced tick: a callback already handed to a timer goroutine or to the owner loop cannot be unqueued, so it carries the generation it was armed with and does nothing when a later request, a forced render, a cancel or Stop has moved the counter on. Mutations, each compiled and each red: the comparison removed in runScheduledRender (TestTUIThrottledFrameRetiredByAForcedRenderNeitherDrawsNorConsumesTheNewRequest), in runImmediateRender (TestTUIImmediateRenderOfASupersededGenerationDrawsNothing) and in renderScheduled (TestTUIRenderNowCancelsPendingRequestedFrame, TestTUICancelPendingRenderInvalidatesDispatchedFrame). The `!t.stopped` test beside the comparison in renderScheduled duplicates it, since Stop also moves the counter; removing it kept every test green, TestTUIStopRetiresARenderAlreadyHandedToTheOwnerLoop included, so no claim rests on it and that test is not cited. Re-confirmed at Pi e7a0df27: the delta since b3a29f11 changes no line that mentions async, await, Promise, then/catch/finally, timers, signals or AbortSignal, so the contract stands. Re-audited at Pi c23b9ec1: the async skeleton of packages/tui/src/tui.ts (every async, await, Promise, then/catch/finally, signal, abort, throw, timer and yield line, imports excluded) is identical to this file at v1.5.0, so the contract above carries unchanged."
