rationale = "A credential store overlay with runtime API-key overrides. read, list and delete check the operation signal (`throwIfAborted`) before the store call, and list also after it, so a cancelled caller gets the abort reason and delete leaves the override when it was cancelled; delete awaits store.delete and only then drops the override. modify(providerId, fn, options) (:42-55) returns the store's own Promise to the caller unchanged and also tracks it: `pending` is the modification with both outcomes mapped to undefined, added to pendingModifications and removed by an intentionally unawaited `void pending.finally(...)`, so a rejected modification never becomes an unhandled rejection of the tracker. Delta at Pi c23b9ec1 (b2cb62923): settled() (:61-63) awaits Promise.all of the pending set, resolving once every modification started so far is written or failed (later ones are not waited for), so an exit does not lose an OAuth refresh that already spent the single-use refresh token. Go ai/runtime_credentials.go keeps `pending` as a channel per Modify that has not returned, closed on completion whatever the outcome, Settled(ctx) waits for the channels present when it was called and fails only with ctx's cancellation cause, and the operation contexts are checked at the same points. The tests pin the forwarded signals, the cancellation cause, the override kept when a delete is cancelled, and that Settled waits for pending writes, ignores later ones, survives a failed modification and honours cancellation."

