rationale = "The writer batches the parts the line admitted: admit() returns a Part immediately (its `outcome` promise, with a `.catch(() => {})` so an unobserved rejection is not unhandled, :98-99, and a `gate` per key), and one flush loop (#flush :150-160, an intentionally unawaited async chain owned by the writer) sends the queued parts to storage in one awaited host.commit with the abort signal of the first part's context removed (withoutAbortSignal, :173-178, so a caller's cancellation cannot half-cancel a stored batch), then #publish (:201-260) publishes the parts in line order, awaiting the storage's publishing scope and, between two parts, a macrotask hop (`hop()`, :351-358, setImmediate) so the continuations of the commits one part resolved start before the next part is published. A refusal, a rejection or a failed adoption fails the Session: the parts before the failing one stay published, the failing part rejects with its own error and the later parts with SessionFailed (or the rejected call's error); a part admitted after another failure is not sent. drained() resolves when nothing is queued or in flight. Go durable/session/writer.go runs the flush as one goroutine the writer owns (Wait joins it at close), Part.Wait/OnSettled are the outcome promise, Gate a channel closed at publication or failure, and WriterHost.Hop returns once the goroutines the earlier publication woke have resumed, the Go form of the macrotask hop (file header). The hop is subject to D224 (it waits for the earlier delivery's synchronous part). The tests pin batching, per-part failures and a failure between two publications, backpressure bounds, that the hop waits for a listener's synchronous part and not for one that closes the Session, and that a failed adoption leaves later parts unpublished."

