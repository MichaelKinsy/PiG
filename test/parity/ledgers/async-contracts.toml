rationale = "startSpan awaits the callback: Go's StartSpan blocks and returns the callback's error, the span settles on return, error or panic, and a panic is re-raised. flush and close await the commit: both block until it settles and return its error; a mutex serializes writes so at most one transaction runs at a time, and close is idempotent (every call returns the first call's result; flush after close returns close's result). The one-second `setInterval(...).catch(() => {})` flush is a concurrent task joined by close: Go starts one owned goroutine in CreateSqliteTelemetry, a tick is skipped while a write is in flight, a write failure or close stops it, and close joins it. The failure is not lost: it is remembered and flush and close return the same error value, with no retry. Upstream has no AbortSignal here, so close is the only shutdown and it drains partial metric intervals; close does not wait for active business callbacks. | Delta v1.5.0+c23b9ec1: (1) The recorder moved out: startSpan is no longer an async method of the store but `readonly startSpan = (options, callback) => this.#recorder.startSpan(options, callback)`, delegated to the shared TelemetryRecorder (telemetry-ingest/recorder.ts, row there): the callback is awaited by the span's caller, the span settles when it returns or throws, and the store adds nothing of its own. Go SqliteTelemetry.StartSpan delegates to the recorder (index.go). (2) The write is a batch from the recorder: #drain(partial) waits for the write in flight (`while (#writing) await #writing`), throws the remembered failure, takes the batch, and runs ONE transaction (spans via writeSpan with INSERT OR IGNORE so an ingested span never replaces a stored one, metrics via writeMetric, then the retention deletes on the microsecond column); a failure sets #failed, stops the recorder discarding and clears the timer, and the same error is thrown by every later flush/close; the interval flush is still `void this.flush().catch(() => {})`, a detached task owned by the store that close stops and joins through #closing. Go: writeMu serializes drainLocked, the one-second ticker goroutine is stopped by haltTimer and skips a tick while a write runs, flush and close return the first failure (TestSerializesConcurrentFlushAndCloseWithoutLosingMeasurements, TestStopsPermanentlyAfterAWriteFailureAndReportsTheIdenticalError, TestRemembersABackgroundWriteFailureAndStopsItsTimer, TestRollsBackSpansAndMetricAggregatesTogetherOnSQLFailure, TestFlushesOncePerSecondAndRetainsOnlyRowsInsideTheRetentionWindow). (3) ingest(batch) is synchronous, returns how many spans were queued (the rest dropped and counted past the bound), and the rows go out with the next flush: no await, no ordering beyond the queue (TestWritesIngestedSpansAndMetricRowsWithItsOwnNeverReplacingAStoredSpan). (4) createSqliteTelemetry awaits migrateTelemetryStore(db) (schema.ts, version 1 to 2 microseconds) before constructing the store; a migration failure rejects the creation and nothing is started. Go CreateSqliteTelemetry migrates and returns (store, error) before it starts the ticker (TestMigratesAStoreOfVersion1ToMicrosecondsItsRowsKept)."

