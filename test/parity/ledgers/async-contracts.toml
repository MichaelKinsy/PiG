evidence = ["test:chord/context/chordctx_upstream_test.go#TestContextStopsWaitingWhenTheInvocationIsCancelled", "test:chord/context/chordctx_upstream_test.go#TestContextWithAnAlreadyCancelledSignalIsCancelledOnReturn", "test:chord/context/chordctx_upstream_test.go#TestContextInheritsParentCancellationAndIsolatesChildCancellation", "test:chord/context/chordctx_upstream_test.go#TestContextMasksCallerCancellationForMandatoryCleanup", "test:chord/context/chordctx_upstream_test.go#TestContextDerivesTelemetryIndependentlyFromValuesAndCancellation", "test:chord/context/chordctx_upstream_test.go#TestContextIsolatesConcurrentTraceInBranchesAndPreservesCallbackResultsAndErrors", "test:chord/context/abort_listener_test.go#TestOnAbortRunsInsideTheCancelFunctionOnce", "test:chord/context/abort_listener_test.go#TestOnAbortOnAnAbortedContextRunsAtOnce", "test:chord/context/abort_listener_test.go#TestOnAbortListensToEverySourceOfADerivedContext", "test:chord/next/host/host_promise_order_test.go#TestThenWithContextOrdersAbortAgainstSettlement", "test:chord/next/host/host_promise_order_test.go#TestThenWithContextLeavesNoListenerBehindWhenTheResultComesFirst"]
rationale = "A chord Context's abort signal is Go context cancellation, with the abort reason as the cancellation cause. withAbortSignal (:71-75) combines the parent and the signal with AbortSignal.any, which takes the first aborted input's reason and is already aborted when an input is; chordctx.WithAbortSignal derives a context cancelled with the first cause, before it returns when the signal is already cancelled. withoutAbortSignal and withCancel are chordctx.WithoutAbortSignal over context.WithoutCancel and chordctx.WithCancel over context.WithCancelCause (package chord/context). awaitWithContext (:98-115) returns the promise itself without a signal, rejects at once when the signal is already aborted, and otherwise rejects only this waiter on abort, leaving the work running. It orders the abort against the settlement by what happens first: its abort listener (addEventListener, run inside `abort()`) rejects the wait at once, and the settlement reaches the wait through a reaction, a microtask, so an abort in the section of a settlement wins whichever came first in it, while a reaction that already ran leaves the value. Go: chordctx.OnAbort is that listener, run inside the cancel function of chordctx.WithCancel (and of the sources of a WithAbortSignal context), after the context is cancelled; the host's thenWithContext (host_promise.go) decides the wait there when the cancel is inside a section of its loop (the continuation is queued at the abort) and queues an abort from another goroutine as an event of its own, at the time it is observed, as an external abort signal fires in a task of its own (TestThenWithContextOrdersAbortAgainstSettlement); a source OnAbort cannot listen to (a deadline, a context.WithCancel of the standard library) is observed by context.AfterFunc as before. chordctx.Await blocks on the work's settlement or the context, checks an already cancelled context first, returns the cause on cancellation and leaves the work's channel unread so it can still settle. abortError's DOMException for a non-Error reason has no Go form, since a Go cause is an error and a nil cause is context.Canceled. traceIn (:105-125) runs a child span of context.telemetry through startSpan and returns the callback's result as a Promise, rejecting with the callback's own error. chordctx.TraceIn calls telemetry.StartSpan on the caller's goroutine, passes the callback the derived context and span, and returns the result, or the error as the identical value, after the span settles, the awaited form of the Promise; concurrent branches each derive their own context, so branches are isolated by the context they receive, not by the goroutine (TestContextIsolatesConcurrentTraceInBranchesAndPreservesCallbackResultsAndErrors). withTelemetry and Context.telemetry are synchronous and cancellation-independent (TestContextDerivesTelemetryIndependentlyFromValuesAndCancellation)."

