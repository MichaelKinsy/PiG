`post`/`sync`, a bounded queue of 256) and run one at a time, so the claim of the prompt (`confirming = true`), the request count and the held frames happen on the loop in the order the sandbox sent them; downloads, prompts and the reply run in a goroutine per request (at most maxRequests, `l.get` takes l.ctx, so finish cancels them: Pi's cannot be cancelled), `confirm` re-enters the loop with `sync` to release the held frames and post the resize; the prompt's Ask waits on its answer channel or loopDone (finish answers false); sockets are a dial goroutine plus a write loop per link, their open/message/close events re-posted to the loop with a generation check so a socket ended before the loop saw it stays closed and a send on it is dropped (the four socket tests); outdated/restart run off the loop (they download) and take it only to read the running hash and swap the sandbox (generation++), a restart failure finishes with 1 (TestATerminalIsNotLeftRawWhenTheSandboxEndsWhileTheLauncherStarts for the start path). Two differences from Pi: cancelling StartTerminal's ctx ends the client (Pi has no cancellation: its controller is never aborted), and finish joins the loop before reporting exit (Pi awaits only the sandbox's termination). Executor: Node's loop; one launcher goroutine plus per-request, per-link and per-sandbox goroutines for Go, each ended by finish (portlint:allow golifetime comments in tui_launcher.go)."

