rationale = "Every await in the loop is a sequential step of one run: agent_start and turn_start, then per turn getSteeringMessages, prepareNextTurn, prepareRequest, the assistant response (transformContext, convertToLlm, getApiKey, the stream function, then each streamed event emitted in order), finishTurn, tool execution, and turn_end/agent_end; each emit(...) is awaited before the next event, so a slow listener holds the loop (agent-loop.ts:126-329, :400-477). A rejection of any of them (listener, stream function, hook, key resolver, conversion) rejects runLoop and the run; Agent.handleRunFailure owns it (agent.ts row). Tool batches (:480-700): sequential mode awaits prepare, execute, finalize and the tool_execution_end/result message per call; parallel mode prepares every call in source order on the loop, starts the executions together, emits tool_execution_end in completion order and awaits Promise.all(finalizedCalls) before the result messages, which are emitted and persisted in source order; after the signal aborts, the pinned source skips the calls that have not started (signal?.aborted checks :585-651, :748-767); Pi main answers them instead (the delta at Pi 4438c58ba below), and that is what the Go loop does. executePreparedToolCall (:820-860) awaits each pending update emission after execute settles and rethrows the first rejection (the result is dropped); an update that arrives after the tool settled is ignored. Cancellation is the AbortSignal; there is no detached work, so the loop returns only once every started tool and update emission has settled. Go: agent/agent_loop.go runLoop, agent/tool_execution.go (executeToolCalls, executePreparedToolCall), agent/run_tool_call.go: the run is one goroutine, emissions are blocking sink calls, parallel executions are joined before the batch returns, and after a context cancel every call of the batch is still started and answered: a call that had not run gets the error result 'Operation aborted' without its hooks or its tool (prepareToolCall, agent/tool_execution.go:362-365; a prepared parallel call, runPreparedToolCall :226-244). Mutations that each turned a cited test red: removing the update-join (inflight.Wait) turned TestExecutePreparedToolCallJoinsAnUpdateStillBeingDeliveredWhenTheToolReturns red; accepting=false removed turned TestAgent_IgnoresToolUpdatesAfterToolExecutionSettles red; removing the abort check at the top of prepareToolCall (agent/tool_execution.go:363-365) turned 12 tests of the agent package red, among them TestExecuteSequentialAnswersEveryCallAfterContextAbort, TestExecuteParallelAnswersUnstartedCallsAfterContextAbort, the two TestAgentLoop_AnswersEveryToolCallOf... cases and TestAgentLoopMatchesPi; ignoring the sink rejection turned TestRunToolCall_RejectsWithTheFirstUpdateSinkErrorAndSkipsAfterToolCall red; swallowing the getApiKey error and the convertToLlm error turned TestGetAPIKeyFailureFailsTheRun and TestConvertToLlmWaitsAndReportsFailureWithoutCallingProvider red. Delta at Pi bd3c9b82: adc5fa9f/04a93bad add DEFAULT_AGENT_IDENTITY and pass a merged identity in the stream options; no added or removed line contains async, await, Promise or .then, so the reviewed contract is unchanged. Delta at Pi 4438c58ba (#9986, past the pin; ported by 2653e6283): executeToolCallsSequential (:540-590) loses the `if (signal?.aborted) break` after each call, executeToolCallsParallel (:592-646) loses both of its breaks, and prepareToolCall (:716-725) returns the immediate error result 'Operation aborted' before the tool lookup and the hooks once the signal is aborted, so every call of an aborted batch gets tool_execution_start, tool_execution_end and a result message in source order. No await, Promise or .then is added or removed: the contract kinds are unchanged, and the outcome of a cancellation changes from skipped calls to answered calls. The pinned mirror (agent-loop.ts:585-587, :624-626, :649-651) still has the three breaks. TestAgentLoop_AnswersEveryToolCallOfASequentialBatchAbortedMidBatch and TestAgentLoop_AnswersEveryToolCallOfAParallelBatchAbortedWhileCallsArePrepared are Pi's two cases (packages/agent/test/agent-loop.test.ts:1003, :1034 at Pi 4438c58ba). Response consumption (:424-478): streamAssistantResponse awaits the events of the response with no check of the abort signal and then awaits response.result() (:470-478), so what a provider's stream gives after the abort is the turn: its later events, its terminal event, its result or its error. The host's cancel of an extension's streamSimple request at the abort is therefore signal-only in every SDK (Go, Node, Python, Rust, Lisp; isolated, packed, fused): the author's signal aborts, the request goes on, its later events are forwarded and its own end is the answer, awaited without a bound, as a native Provider's stream is. The consumer takes a settled result under a done context (agent consumeStream, ai SettledResult). An ordinary cancel, a request the host ends, forwards nothing more and is answered with the abort."

