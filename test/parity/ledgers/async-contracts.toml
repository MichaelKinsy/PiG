evidence = ["test:chord/next/host/host_host_data_test.go#TestHostDataTheGateKeepsLoadPhasesOutWhileAnOperationIsExclusiveAndAnOperationWaitsForLoadPhasesUnderWay", "test:chord/next/host/host_host_data_test.go#TestHostDataTheGateAnOperationGivenUpWhileWaitingForItsTurnPassesTheTurnOn", "test:chord/next/host/host_host_data_test.go#TestHostDataLifecycleAnAbortBeforeTheCommitWasAdmittedWritesNothing", "test:chord/next/host/host_host_data_test.go#TestHostDataReviewRound3ACancellationAfterTheCommitWasAdmittedChangesNothingItCommitsAndIsAdopted", "test:chord/next/host/host_host_data_test.go#TestHostDataLiveOwnersAdoptEverySourceInOneBatchADeriveOverADocumentAndAQuerySeesOneFrameNeverATornState", "test:chord/next/host/host_host_data_test.go#TestHostDataLiveOwnersWaitForATransactionOfATablesOwnerWithoutSlotsOrQueriesItsTwoReadsSeeTheSameRow", "test:chord/next/host/host_host_data_test.go#TestHostDataLifecycleAnOwnerThatCannotReadAnImportedDocumentFailsAloneTheOtherOwnersAdopt", "test:chord/next/host/host_host_data_test.go#TestHostDataReviewRound3AnActivationDuringAnImportAViewPinningTheBoardsKeyWaitsAndReadsWhatTheImportCommitted", "test:chord/next/host/host_host_data_test.go#TestHostDataReviewRound3AReloadDuringAnImportTheSuccessorLoadsAfterItAQueuedImportSeesTheTableItsSuccessorMigrated", "test:chord/next/host/host_host_data_test.go#TestHostDataReviewRound3ReleasesTheOwnersItActivatedHoweverTheImportEndsHereRefusedTheOwnerDeclaresNoSuchTable", "test:chord/next/host/host_host_data_test.go#TestHostDataLifecycleAHostWithoutAStoreRefusesEveryHostDataCall"]
rationale = "New file at Pi 8a5da3ce6 (v1.5.2, host-keyed data): the host data gate and the coordination of one import or delete with the live objects. Gate (HostDataGate): operations are writers, one at a time in call order (`turn` chains each behind the `#tail` promise taken at the call, so the order of the turns is the order of the calls); activations' load phases are readers (`enter`/`leave` counters). `turn` is async and awaited: it waits for the earlier turn and runs `work`, whose `exclusive(section)` sets the exclusive flag, waits for the load phases under way (`awaitWithContext(drained)`) and runs the section, then lets the waiting readers in. Every wait ends with the caller's context; an operation given up while waiting hands the turn on once the earlier ones ended (`void previous.then(turn.resolve)`), so a cancelled caller never blocks the next. Go: `turn`, `exclusive`, `importInto`, `deleteFrom` and Host.ImportHostData/DeleteHostData are blocking calls returning (value, error) on the calling goroutine, never on one of the host's sections: the caller's handler context is parked (parking.Park) while it waits. The turn is a channel chain taken under the gate's mutex at the call (queue), so operations still run one at a time in call order; the waits for the turn, for the load phases and for each object's line end with ctx; a turn given up while waiting closes its channel when the earlier one ended, on the gate, not on a naked goroutine. ExportHostData returns the iterator at once (nothing awaited). Readers: `enter`/`leave` are called in the activation's section; when an operation is exclusive, `enter` returns a keyedPromise whose waiting reader is resumed when the operation ends through Loop.Queue, so it looks again in a later turn exactly as the Promise-based reader resumes in a microtask, and resolves once no operation is exclusive (Go returns nil where Pi returns undefined on the common path, so no extra turn is added). Coordination (`coordinated`, awaited): the objects holding data of the address (the owners of the touched tables, and the objects with persisted documents keyed by the key's kind) are sorted by identity and their lines acquired in that order with the caller's ctx; an abandoned wait for a line releases it when it arrives (`void acquiring.then(release)`): in Go the wait is cancelled and the line released by an owned task of the host's loop when it comes, never leaked. The commit is admitted only while ctx has not aborted (`fence.admit`; `released` otherwise, nothing written): after admission nothing is cancelled, the reads inside the commit step and the adoption use a context without the abort signal (`withoutAbortSignal`; Go's WithoutAbortSignal), so an abort after admission changes nothing and the commit is adopted. The reads (`readChanged` of each resident or pinned key, `rerun` of each live query) run in the commit step after its writes, on the committing goroutine outside any section; after COMMIT, `adopt` applies them all in one host batch (batch.Commit, one frame: no torn state between a derive over a document and a query) and, outside the batch, fails the objects whose document could not be read (their attempts end and publish on their own); the others adopt. The lines are released in a finally on every end. Import (`importInto`, awaited): readHostArchive, then, in the turn and exclusively, the tables to migrate and the live objects' histories; an owner not live for one is activated (between exclusive sections, so its own load phase can enter) and the section runs again; an owner activated once and still without the table's declaration is refused invalid/args; the owners activated are released when the operation ends, however it ends. Errors are the rejection of the one operation (Go: the returned error), never reported elsewhere. Delete (`deleteFrom`) is one exclusive section of the same coordination. Proven by the gate cases (load phases out while an operation is exclusive, an operation waiting for load phases under way, an operation given up passing its turn on), an abort before admission writing nothing and a cancellation after it changing nothing and adopting, the one-batch adoption, the wait for a transaction of an owner without slots or queries, an owner that cannot read a document failing alone, the activation and reload during an import, the owners an import activated being released however it ends, and a host without a store refusing."

