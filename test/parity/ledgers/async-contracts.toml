rationale = "app.ts startServer/App. startServer(options, context) is one awaited chain, in order: openServer (open the data dir, then `processLock('chord-app:<dir>', ...)` bounded by AbortSignal.timeout(SERVER_LOCK_MS) joined with the caller's signal: a timeout becomes `another server runs on <dir>`, a caller abort stays the abort; layout, cookie secret, private store, store open; a failure after the lock releases it), the node base inputs, the host, workers per kind, surfaces and plugins in order, the owner token file, then `app.started(link.renew(), await http.listening(context))`; any failure in that chain awaits `app.close(context)` and rethrows the original error (the app is never returned half open). Go startServer is the same order on the caller's goroutine with ctx: workers.ProcessLock(…, waited) with context.WithTimeout(ctx, serverLock) and the same message, Close on every failing path (TestAppFailsWhenAPluginOfTheAppsRootFailsWithEverythingClosed, TestAppRefusesASecondServerOnTheSameDataDirectoryWhileTheFirstRuns). applyChanges(context) is serialised: `#applying.then(() => #applyChanges(context))`, the chain is advanced by `applied.then(noop, noop)`, so a later call always waits for the earlier one whatever its outcome and the earlier failure reaches only its own caller; the waiting call's own context is not consulted while it waits (the signal reaches the build and the rollout once its turn comes). Go ApplyChanges takes applyMu (not cancellable while waiting: the same), runs build, then the server step, every worker kind's step in options order, every surface step, then rollout (TestAppAppliesChangesOneAfterAnotherSoTheNewestBuildStaysDeployed; an aborted apply stops at the step it waits at and the build goes on: TestAppAnAbortedApplyWaitingAtTheWebStepForTheInitialBuildStopsThereTheBuildGoesOn). exportData/importData: a running worker packs its own store through the HostData `exportTo` call under the caller's context (nothing stopped); otherwise the ser