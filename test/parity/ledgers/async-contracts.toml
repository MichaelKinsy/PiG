he handle or an error; the lifecycle contract of the file is unchanged. Re-reviewed for Pi 5e106ab1c: NativeWatchable declares watch(context): Promise<NativeWatchHandle<T>> beside Watchable's, with no implementation, so no new async behavior; Go declares Watch(ctx) (NativeWatchHandle[T], error) as it does for Watchable, and the test shows the acquired watch holds the current value, delivers one frame per new value in order and ends with the context's cancellation. Delta at Pi d0aa218c: d8d99950a replaces the pending frame list with a PendingOps queue and a record of the newest frame. #drain takes next() (the newest value, the folded ops and the newest frame's context) for each listener call instead of shifting one frame, invoke receives that delivery, and #terminate calls release() to drop the queue; the awaited listener call with the abort-free delivery context, the running flag that serializes calls, the microtask-deferred start and advance scheduling, the retirement ending the watch after its delivery, and the listener error ending the watch are unchanged. NativeWatch keeps its own queue of values and collapses past 100 to replace(). Go: watchLifecycle takes next, hasPending and release from the handle; frames advanced while a call is in flight fold into the next call and the in-flight call is never folded into an overflow. Pi 8b0caefc: a retirement is a flag of the next call and the watch goes on; endAfterDelivery() ends it `ended` after the pending call returned (the EndAfterDelivery tests of chord/watch_upstream_test.go). Pi 5f312dac: a failure call drops pending frames and waits as one call; a value after it replaces it ([[\"r\", value]]); Value() keeps the last value; the watch stays open; a failure after the end is ignored. An aborted context ends the watch aborted; installing the abort twice panics 'Watch abort is already installed'."

