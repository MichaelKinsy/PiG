ction (`#resolve` :265-273) are one chain of microtasks with no turn for an observer's timer or I/O callback: a `retry()` before the chain finds the resolve running (`#resolveIfHeld` :237 starts none) and is gone with the rejection, and one after it finds none running (it resolves). A Go `Resolve` returns to a section of its own that a `retry` can precede. The Chord node workers' rejection of a failure their `Retry` or rollout has just ended (the failure `#start` :486-487 and `resolve` :370 read) therefore says so (an unexported `supersedable`: `Unwrap`, and `Superseded`, asked in the section that handles the rejection and only when `route.retry` found `routed.resolving`): the rejection is handled as usual (reported, holders failed) and the address then resolves once more, unless it was suspended again or released meanwhile. Any other rejection, the app's own start failure included, takes the retry with it as Pi's guard does, so the counts equal Pi's (one resolve, one `resolve_failed`, one start). A resolve that succeeds takes the retry with it and nothing restarts."

