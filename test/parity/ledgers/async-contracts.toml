rationale = "`socket` (`void host.root(...)`): an owned background task ending when the socket closes; `close(deadline)` awaited and bounded by a once-closed deadline channel. Re-audited at Pi c23b9ec1: the async skeleton of packages/chord/src/node/http/upgrades.ts (every async, await, Promise, then/catch/finally, signal, abort, throw, timer and yield line, imports excluded) is identical to packages/chord/src/next-node/http/upgrades.ts at v1.5.0, so the contract above carries unchanged. Delta at Pi dd30101c (1.5.1): #keep's socket `error` listener (:153-158) terminates the socket only when its readyState is not CLOSING, because ws has already sent the protocol close code (1009 for an oversized frame) and terminating could discard that frame. No async construct is added or removed and the socket's own task (`void host.root(...)`) is unchanged; what changes is which side ends the socket at a protocol error. Go chord/nextnode/http/websocket.go keeps the socket CLOSING while its error listeners run: TestPluginSocketsAnOversizedFrameLeavesTheSocketClosingTheServerReports1006AndThePeer1009 asserts the ready state at the error is CLOSING, the peer's close code is 1009 and the server's own close event reports 1006 (ws never reads the peer's close frame after a receiver error), and TestPluginSocketsAnOversizedFrameClosesOnlyThatSocket1009NeverTheServer asserts the other socket and the server stay up. Delta at Pi 5f89cc0a7df6: link() gives `opened` a `close` that is `end(upgraded)` (terminate the socket, then seal the link); no async construct is added or removed. Ordering and loop ownership of that close in Go: it may be called from any goroutine and more than once (Terminate is idempotent and a closed socket accepts no frame; frames queued for the link are dropped with their done callbacks told the socket is not open, as for any terminated socket); the peer sees 1006 with no close frame; it ends only its own link. Node emits a terminated socket's `close` on a later turn, so