rationale = "The Session is the executor of every durable mutation: one serialized line (`#tail`, `#enqueue`, `#maintain`, :1596-1685) onto which commit, commitInternal, readOnLine, snapshot, snapshotAsOf, watchDoc/observeDoc and the close/maintenance jobs queue in call order; each job runs after the previous one ended, a commit's change callback is awaited, its writes are handed to the writer (a Part with `outcome`), and the commit resolves only after the part is stored and published (`result.after`), with a fence so jobs behind a poisoned commit reject with SessionFailed without reading storage. Cancellation is checked when a job starts, not while it runs (:1087 `context.abortSignal?.throwIfAborted()`; #attachDocument re-checks `cancelled` after each await, :1421-1437); close(context) detaches its cleanup from the abort (withoutAbortSignal) and awaits beforeClose, the drain, the held-document stores and the storage close in order. Background work is intentionally unawaited and owned by the Session: the idle-hold flush (:1024, :1314-1319 `#maintain(...).catch(() => {})`), the close after a failure (:456 `this.close(BACKGROUND_CONTEXT).catch(() => {})`), `queueMicrotask(run)` (:1032) and `SETTLED.then` (:1403) dispatches; listener results that return a Promise are caught and reported (:1753, :1805). Go durable/session/session.go keeps the line as a slot queue (takeSlotLocked, onLine, runFenced, enqueue/maintain) with the same order and fences, SessionImpl.Commit/CommitWith/CommitInternal/ReadOnLine(Ctx)/Snapshot/WatchDoc/Close as blocking calls taking ctx, a LineTicket for the reserved place of a call that must keep its position, goroutines (deliverLoop, the writer's flush goroutine, the idle store) owned by the Session and joined by Close, and the resumption mechanism (resumption.go) that models the order in which JavaScript continuations of resolved Promises resume. The tests pin batching and publication order, gates, outcomes and per-part failures with randomized interleavings, FIFO ordering above 128 goroutines, line admission reporting before earlier commits finish, close racing admission and a cancelled close context, failure poisoning without reading storage, a cancelled queued watch rejecting before reading storage, and held deferred commits being stored."

