rationale = "The only Promise is options.copySelection (:199, :254). copyTextToClipboard (:1483-1500) awaits it, flashes 'Copied!' for a true result, the returned string for a string result and 'Copy failed' otherwise, and returns whether it copied; copyActiveSelectionToClipboard (:311) and the mouse path await that. Nothing is held while it is in flight: the host loop keeps serving input and rendering, and the flash follows the settlement. The callback is not cancellable in Pi either, and a rejection is the flash message, not an error out of the screen. Go: TuiAltScreen.copyTextToClipboard runs CopySelection without t.mu (a returned error carries the string result) and flashes after it returns. The test holds the callback open, proves the screen lock is free and no flash is up, then releases it and checks the flash for a success and a failure; it went red with the callback called under t.mu. Re-confirmed at Pi e7a0df27: the delta since b3a29f11 changes no line that mentions async, await, Promise, then/catch/finally, timers, signals or AbortSignal, so the contract stands. Re-audited at Pi c23b9ec1: the async skeleton of packages/tui/src/tui-alt-screen.ts (every async, await, Promise, then/catch/finally, signal, abort, throw, timer and yield line, imports excluded) is identical to this file at v1.5.0, so the contract above carries unchanged."

