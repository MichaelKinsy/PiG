rationale = "attempt.ts #activate and its steps: each `await` is a `Queue` or the `then` of a `keyedPromise` settled in a section; a blocking step (`documents.load`, `prepareTables`, `job.load`, `native.open`, `follow.attach`) is an `awaitTask` that settles in a section, cancelled with the attempt's opening context. | attempt.ts call (handler, awaitWithContext): admitted to the drain in the caller's section; the handler runs on an owned task started after the previous call's handler entered; the caller's wait ends at the abort of the call's linked context (`AfterFunc`), an abort that came before the handler returned wins. | attempt.ts drain and closes (close): blocks outside a section on an owned task (the object's teardown); the drain's timer is a loop timer; work stuck past it stops counting. | attempt.ts ready-timeout deadline: `deadline` on the host's loop; paused while parked, resumed with the budget left. | attempt.ts opener and AbortSignals (opening, linked call contexts): the opening `context.Context` is aborted by the seal; `withLinkedAbortSignal` links a caller's context to it. Update (Pi 6d4b7443): `drainCalls`/`handOverRoutines` take their work list in a section, `drained` runs on an owned task and a timeout reports `drain_timeout`; `checked` is the lazily made promise of the first dependency check settled once by `settleCheck`; `pinKey` blocks outside a section. | Delta v1.5.0+c23b9ec1: (1) #opening is now withContextValue(OPENING, object, withAbortSignal(abort, context)): it still aborts with the attempt (cancellable unchanged) and also names the object whose opener runs, which waitAsOldWork reads to tell an opener waiting at a gate from other work; Go attempt.opener is opening carrying openingKey, natives open under it. (2) handOverRoutines is gone: a restart stops the old attempt's routines at once and their running calls join drainCalls(due) with every other call, so the successor's routines start only after endOld's drain (ordering; no detached then chain, no second drain); Go drainCalls reads a.running plus a.routineRun.calls each round (TestReloadARestartStopsItsRoutinesAtOnceTheirCallsDrainBeforeTheNewOnesStart). (3) drainCalls(due) is one absolute deadline (the reload timeout taken at the restart) shared by readiness and the drain, not a fresh close timeout: each round computes left = due - now, left <= 0 or a timed-out drained reports drain_timeout and resolves, never rejects, so the caller always goes on to seal; Go drainCalls(due int64) on the loop clock, drainedWithin an owned awaitTask (TestReloadDrainBoundCutsACallStillRunningAtReloadDrainTimeoutReleasedReportsDrainTimeoutThenTheNewCodeServes, TestReloadDrainBoundIsAtMostCloseTimeout). (4) The call's chord.method span is span.endWhen(running.promise, 'method_failed', callContext.abortSignal): it ends with the handler's own promise, not the caller's abort-bounded wait and not the provider's result mapping. Go ended it with the caller's result, so an abort closed the span early as aborted while the handler ran on, and a handler returning ok after the abort was recorded aborted: fixed (host_attempt.go ends the span in the handler's section with the handler's error) and pinned by TestMethodSpanEndsWithTheHandlerNotWithACallerThatLeftAtAnAbortAHandlerReturningAfterItEndsItOk, red on the old Go. (5) writeAtClose runs for every job once the handedOver guard is gone: an awaited step of the close on the owned teardown task after the drain. (6) A live query's first run is an awaited activation step, await query.load(opening), cancelled with the attempt's opening context; a failing run fails the activation (Go loadQueries; TestLiveQueryActivationARunThatFailsAtActivationFailsTheActivationBroken). Delta at Pi 8a5da3ce6 (v1.5.2, host-keyed data): the activation's load phase is now bracketed by the host data gate: `host.hostData.enter()` is awaited first when a host data operation is exclusive (it returns undefined, with no extra turn, otherwise), then documents.load, prepareTables and every live query's load run as before, and `leave()` runs in a finally so a failed load leaves the phase too (a throwing load never strands the gate). Go keeps the continuation-passing activation: it calls `enter()` in the activation's section and, when that returns a keyedPromise, continues from its `then` in a later turn (`loadPhase`); `loaded` and `failedLoading` call `leave()` on the two ends of the phase. The attempt's other steps, their sections and the opening context's cancellation are unchanged. Proven by the gate cases (load phases kept out while an operation is exclusive, an operation waiting for load phases under way), by an activation during an import waiting and reading what the import committed, and by a reload during an import."

