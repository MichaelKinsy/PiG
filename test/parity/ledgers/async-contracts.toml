rationale = "commit (:288-336) applies each batch to the in-memory MemoryStorage first (prepareCommit/apply, synchronously, receipts remembered) and only then awaits append(encoded): sidecar files are appended (the path resolutions run concurrently under Promise.all and are joined, :343-350), flushed when fsync is on, and the main-file commit markers appended last, so a crash recovers a shorter complete prefix. `this.writing` is a promise the commit resolves in `finally`; every read goes through `readable()` (`while (this.writing !== undefined) await this.writing`, :894), so a read issued while an append is in flight waits for the append and never returns what is not stored; once any batch has applied, any failure poisons the storage with one JsonlStoragePoisonedError before those reads resume, and every later call rejects with it (a closed storage reports the closed error first). The receipts run after the markers are durable, then reclaimSidecars is awaited, and the CommitResult says how many batches were stored and the first refusal. open and recover await the file-system capability one call after another with the caller's context. Go durable/storage/jsonl/storage.go is a blocking Commit under commitMu that does the same order (memory first, append, markers, receipts, reclaim) with `writing` a channel closed in the commit's defer that reads wait on, poison keeping the first failure, and open/recover calling the env.FileSystem synchronously. The tests pin publication then recovery, the poison-on-append-failure rule for reads waiting on an append, the single poisoned error for every later call, closed-before-poison, the named failing step of each publication failure and of open, and that recovery truncates from the first unconfirmed sidecar record. Delta at Pi f5f4a71af: open with readOnly (f5f4a71af) retries `recover` up to five times (READ_ONLY_OPEN_ATTEMPTS) when it fails with JsonlCorruptionError and `mainChanged()` (an awaited fileInfo of main.jsonl, size diff