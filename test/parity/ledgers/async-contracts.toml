rationale = "Extensions load one after another: loadExtensionsInternal (:688-725) awaits loadExtension for each path in order, collecting an error string per failed extension instead of throwing, so one failing extension never stops the next and the result order is the path order. loadExtension (:646-672) awaits loadExtensionModule (the jiti loader and virtual-module promises are cached so concurrent loads share one import, :50-63, then `jiti.import(canonicalizePath(extensionPath), { default: true })`, :593) and initializeExtension (:625-645), which awaits the extension factory(load.api) with the runtime stubs installed: action methods called during loading throw `Extension runtime not initialized...`, and when the factory throws (or rejects) `load.discard()` rolls its registrations back (on success `load.commit()` makes them live), its API becomes inactive (`Extension \"path\" failed to load and its API is no longer active.`) and the error is returned as that extension's load error. loadExtensionsCached is loadExtensionsInternal with the module cache enabled. Delta at Pi c23b9ec1: the module path is canonicalized (symlinks resolved) before jiti.import, a synchronous change with no new await. Go coding/extension/factoryload.LoadExtensionFromFactory loads one factory per call, blocking until the factory returns (a failed or panicking factory discards its runtime changes, disables its API and is reported as that extension's error, while a provider loaded concurrently is kept) and the Node-side loader in coding/extension/host/subprocess (runtime-node/jiti-loader.mjs and runtime.mjs): action stubs throw during the factory, a factory failure outranks the process exit, and reload diagnostics keep the factory error. The cited tests pin those behaviours."

