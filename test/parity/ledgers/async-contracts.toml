rationale = "Async sites. (1) The stream IIFE (:254-508) is detached and owned by the returned stream: every path ends in a `done` or an `error` event and stream.end(), and the catch (:503-507) makes the stop reason `aborted` when the request signal is aborted and `error` otherwise. Go: the goroutine of the provider's Stream ends the builder the same way. (2) onPayload is awaited before any transport is tried (:287) and onResponse before the status is read (:433). (3) The WebSocket loop (:321-383) awaits processWebSocketStream; its catch reads options.signal.aborted when it handles the failure (:361): an aborted request rethrows with no diagnostic, a missing previous response and a connection limit before the stream started are retried once each, a non-transport error (an API error, an observer rejection) rethrows, and any other failure appends the provider_transport_failure diagnostic and records the session failure, then ends the message if events were emitted and falls back to SSE if not. (4) The SSE loop (:404-485) checks the signal before each attempt, awaits fetch under the caller's signal joined with the header timeout, awaits the error body, and sleeps the backoff in sleep (:182-198), a Promise the timer resolves and the abort listener rejects with `Request was aborted`; the listener is removed when the timer fires. (5) mapCodexEvents (:764-808) awaits onProviderStreamEvent for each event in arrival order before it interprets the event; a rejection becomes ProviderStreamEventCallbackError, which is kept out of the retry and fallback paths. (6) parseSSE (:820-880) cancels the body reader from an abort listener, checks the signal before and after every read and cancels the reader in `finally`. (7) connectWebSocket (:1096-1172) is a Promise settled once by open, error, close, abort (`Request was aborted`, the socket closed) or the connect timeout. (8) acquireWebSocket (:1174-1260) keeps one cached socket per session and account, marks it busy for the request that holds it and gives a concurrent request a socket of its own; release closes it or re-arms the idle timer (scheduleSessionWebSocketExpiry, :1083-1094, a timer that does nothing while the entry is busy). (9) parseWebSocket (:1328-1445) queues each decoded frame from a detached per-message async function, waits on a Promise the listeners wake and the idle timer rejects, and ends with `Request was aborted` on abort. (10) processWebSocketStream (:1514-1610) releases the socket in `finally`, keeping it only after a completed, unaborted response. (11) parseErrorResponse (:1617) awaits the body text. Go: ai/openai_codex_responses.go, openai_codex_http.go (retry loop and backoff under the request context), openai_codex_sse_stream.go (the body worker, joined) and openai_codex_websocket.go (the feed goroutine that reads the socket and the parser that consumes it; the feed marks a read failure as a transport failure while the request is live, and the parser, codexTransportFailureReader, records the diagnostic only if the request is still live when it handles the failure, which is Pi's :361 read of the signal). Mutation (compiled): dropping that `r.ctx.Err() == nil` turned TestCodexTransportFailureHandledAfterTheAbortRecordsNoDiagnostic red; TestCodexAbort* and TestCodexWebSocketAbortAfterTheStreamStartedAddsNoTransportDiagnostic stay green under it, because in them the feed already sees the abort and marks nothing. The `!r.recorded` half of the same condition is not a contract clause and no claim rests on it: the only caller reads through a bufio.Scanner, which does not read again after an error, so the reader sees one failure per request; dropping it kept every TestCodex* and TestOpenAICodex* test green. The other tests cited are the ports of Pi's own tests for these sites and comparisons with the pinned Pi (TestCodexResponsesMatchPi, TestCodexWebSocketFramesAreParsedLikePi, TestCodexSSEFramingMatchesPiParseSSE); no mutation of this lane stands behind them. Delta at Pi bd3c9b82: adc5fa9f/04a93bad send the identity headers on the SSE request and the WebSocket handshake; no added or removed line contains async, await, Promise or .then, so the reviewed contract is unchanged. Delta at Pi d0aa218c: f715a15c1 changes only the code named in the upstream-sync row of this file; no added or removed line contains async, await, Promise or .then, so the reviewed contract is unchanged. Delta at Pi c23b9ec1: 90b42bca6 removes the abort listener after the SSE retry backoff; Go releases the context watcher with the backoff (ai/openai_codex_retry_backoff_release_test.go#TestCodexSSERetryBackoffReleasesTheCallerContext)."

