rationale = "The local shell operation exec (:112-195) is awaited by the tool: it rejects at once with `aborted` if the signal is already aborted, checks the working directory (fsAccess) before spawning, tracks the detached child pid, arms a timeout timer and an abort listener that kill the process tree, awaits waitForChildProcess (which does not hang on inherited stdio held by detached descendants), and in finally untracks the pid, clears the timer and removes the listener; after the wait an aborted signal throws `aborted`, a timeout throws ShellTimeoutError, otherwise the exit code is returned, a signal-killed shell mapped to 128+signal. The tool's execute (:289-430) streams output through an accumulator with a throttled update timer (a setTimeout, cleared in finish), awaits ops.exec, then awaits finishOutput (closing the temp file) in every path, so the output captured before an abort or timeout is part of the error: `Command aborted`, `Command timed out after N seconds` and `Command terminated without an exit code` are appended to the text; the caller waits for the process and the cancellation is the signal into exec. Delta at Pi c23b9ec1: ShellTimeoutError (:100-107) now carries the shell's real exit code and the seconds after which it exited when the shell exited before the deadline but background processes kept writing until the timeout (#11613), and the status text appends `The shell exited with code N after S seconds, but background processes it started kept writing output until the timeout.`; the timeout path still ends the call with the same awaited finishOutput. Go internal/codingagent/tools/bash.go and bash_operations.go run the shell on a goroutine the call owns, kill the process group on context cancel or timeout, return the buffered output with the status line, track detached children for kill at exit, and the output holder stops retaining late chunks after the shell finished. The tests pin kill-on-cancel of the process group, buffered output returned on abort and kept across a timeout kill, the timeout message including the shell-exit-before-deadline case, live streaming, the timeout bound, background children, late output, and tracked detached children."

