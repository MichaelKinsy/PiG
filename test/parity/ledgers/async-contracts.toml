rationale = "archive.ts packData/packStore/unpackData: each is one awaited chain whose caller waits for the whole archive. packStore creates a staging directory (mkdtemp beside the target), streams `encodeJsonl(store.export(context))` to a staging file through stream.pipeline, then pipelines `writeTar(entries())` (manifest.json, store.archive, then every file under files/ in sorted order, skipping `.uploads`) to a staging file and renames it onto `path`, removing the staging directory in finally: a failure at any step rejects with that step's error and leaves no staging directory and no half-written target (the rename is last). packData wraps it with a store opened for the call and closes the store in finally. unpackData refuses an existing target before anything is written, unpacks into a staging directory (`for await (readTar(createReadStream(archive)))`, `context.abortSignal?.throwIfAborted()` at every entry, entry and byte limits counted before writing, the manifest first, `accept` consulted on it, a foreign entry refused), imports the store archive, removes it, and renames the directory into place; any failure removes the staging directory and rethrows. Cancellation is the abort checked at each entry and inside store.export/importStore (which take the same context); a file copy under way is not interrupted mid-stream. Go: PackData/PackRunning/UnpackData are blocking calls on the caller's goroutine with a context: ReadTar's visit callback checks ctx.Err() per entry (archive.go unpackEntries), fileBytes.Next checks ctx.Err() before each chunk of the store export, the staging directory is removed by a deferred join on error, and the target is renamed last (TestRefusesAnArchivePastItsLimits…, TestRefusesWhatAcceptRefuses… 'leaving nothing'); the abort tests are TestUnpackDataStopsAtTheEntryAfterTheContextEndsLeavingNothing and TestPackDataWithAnEndedContextLeavesNeitherATargetNorAStagingDirectory in archive_cancel_test.go. Streams and pipeline back-pressure have no