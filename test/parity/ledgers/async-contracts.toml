rationale = "reload-cycle.ts ReloadCycles.wait(waiting, target, contract, chain): returns a new promise that follows `waiting` (resolve/reject forwarded, the wait deleted from the set either way) but is rejected at once with unavailable/reload_cycle when the wait closes a cycle through the drain of the old work it belongs to: checked synchronously when the wait is made and again by recheck() whenever an attempt parks or an opener starts waiting at a gate (the only moments a cycle can close; a wait whose target's open old attempt serves the contract's version does not wait at all, so it never cycles). The caller awaits the returned promise (a getter or a gate); the cut error is the wait's rejection, not a reported background error; there is no timer and no cancellation of its own (the wrapped wait's context does that) and nothing is detached. Go reloadCycles (host_reload_cycle.go) does the same in a section: wait registers an oldWait and chains the returned keyedPromise to waiting; recheck re-walks the wait edges (host_object.go gateWaits, the object's wait edges) after each park or gate start, and a cycle settles the returned promise with the reload_cycle error (TestReloadCycleAWaitOfOldWorkFailsAtOnceWhenOldWorkCreatesAnObjectWhoseNewCodeNeedsTheProvidersRaisedContract, TestReloadCycleFailsOnceALaterWaitClosesTheCycleTheNewAttemptsOpenerCallsTheProviderOldWorkWaitsOn, TestReloadCycleDoesNotFailAWaitWhoseTargetWaitsOnAnotherObjectsDrainOnlyNoCycleThroughThisWork)."

