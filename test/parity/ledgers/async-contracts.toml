rationale = "agent-session.ts, 14 method groups, each asserted by the named test: prompt path (:1943-2330) claims/abandons the run and passes the abort signal; steer/followUp queue (:2325-2430); sendCustomMessage returns at once (:2460-2600); abort awaits idle and drops deferred work (:1139,2601-2623); event boundaries use a live context (:719-760,907); nested tool call parent id (:791-830); model/thinking select emits (:2788 unawaited) and setSessionName's session_info_changed emit (`void this._extensionRunner.emit`): the call returns after the first handler's synchronous prefix, except on the interactive owner loop, where it starts the emission and returns at once (Go addition: the prefix of a subprocess handler ends with a report from another process, and the input and render loop waits for no extension; off the loop Pi's order stays); compact/abortCompaction (:837,2878-3400); abortRetry (:3924-3975); abortBash (:4003-4075); navigateTree/abortBranchSummary (:4126-4320); reload and bindExtensions ordering (:3413-3440,3815-3850); extension bridges (:3544-3550,3598-3603 abort without waiting, errors reported); summarizeForBugReport signal (:4489-4503) and summarization request signal (:565-605). Go: coding/session*.go symbols named in each clause. Not claimed: the pre-aborted-prompt handled branch (1d), before-settle abort check (5b), nested wait (6b, covered by nested-tool-calls row), auth ctx (14b) stayed green under their mutations. The four obligations those groups left without a test: (1) the handled branch of the prompt path (:2172-2177 an extension command, :2213-2216 an input handler, :2341 steer and followUp): TestPromptReportsHandledForCommandsAndInputHandlers and TestQueuedInputDispositions, red when coding/session_prompt.go preparePromptInvocation skips the handled input (dispositions [started]), keeps running after a handled command (the model is called) or drops the notification, and when queueUserInput skips its handled return. (2) The abort check after the agent_before_settle handlers (:2099 with :2608): TestAbortDuringAgentBeforeSettleDropsTheContinuationWithoutReportingIt, red when session_boundaries.go runBeforeSettleBoundary ignores abortRequested after the handlers (the continuation is reported as invalid); its control TestAgentBeforeSettleReportsAContinuationThatCannotRun is red when the report is dropped. (3) The nested-call wait: _executeNestedToolCall (:791-824) sends every ctx.executeTool() of a Session through its one NestedToolCallRunner; TestSessionNestedCallToASequentialToolWaitsForTheExclusiveCallBeforeIt drives it through Session.Prompt and is red when nested_tool_calls.go Execute does not wait for the previous exclusive call and when session_loadout.go builds a runner per call; under the first mutation the nested-tool-calls.ts row tests are red too. (4) The signal of _getSummarizationRequestAuth (:605-646, getAuth(model, { signal }) at :576 and :631, called at :2886, :4224 and :4495): TestSummaryAbortEndsARequestAuthStillBeingResolved aborts a compaction, a branch summary and a bug-report summary while an OAuth refresh of a registry-built provider is in flight; each ends with the abort reason and sends no request; red (5 s bound) when session_summarization_auth.go passes a detached context to modelRuntime.prepare, when each of the three callers detaches its own, and when the abort reason after the resolution is dropped. Sample of the 30 older entries, 2026-11-13 (go1.27.4), each mutation compiled and red in two runs against those 30 tests, which are green without it: the abort signal not passed to the Agent -> TestAbortWaitsForRunToEnd never returns (2 min bound); Abort not waiting for idle -> TestAbortWaitsForRunToEnd; compact not aborting the active run -> TestCompactAbortsActiveRun never returns (2 min bound); resource discovery moved before session_start on reload -> TestSessionReloadAwaitsBeforeSessionStartThenSessionStartThenResourceDiscovery; an extension abort that waits for the run -> TestExtensionAbortWithoutAHandlerRequestsAbortWithoutWaitingForTheRun; AbortRetry not aborting the wait -> TestSessionAbortRetryCancelsDelay. The other mutations of the older entries were proven in a tree with uncommitted changes and were not run again."

