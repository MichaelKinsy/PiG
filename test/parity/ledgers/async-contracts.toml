evidence = ["test:tui/terminal_input_reader_test.go#TestForwardTerminalNormalizesNativeShiftEnterAfterFraming", "test:tui/terminal_input_reader_test.go#TestForwardTerminalFramesAndHoldsNegotiationPrefix", "test:tui/terminal_input_reader_test.go#TestForwardTerminalNegotiationRespectsBatchOrder", "test:tui/terminal_input_regression_test.go#TestTerminalNegotiationFragmentTransitions", "test:tui/terminal_input_regression_test.go#TestTerminalNegotiationPrefixDeadlineBoundaries", "test:tui/terminal_input_regression_test.go#TestTerminalNegotiationPrivateCSIPrefixWaitsForItsFinalByte", "test:tui/terminal_input_regression_test.go#TestTerminalNegotiationPasteBypassesPrefixAndCloseCancelsTimer", "test:tui/terminal_input_regression_test.go#TestTerminalProgressCancellationJoinsKeepalive", "test:internal/codingagent/terminal_negotiation_upstream_test.go#TestInteractiveInputPumpHoldsNegotiationPrefixAfterFraming", "test:internal/codingagent/terminal_negotiation_upstream_test.go#TestInteractiveInputPumpSettlesListenersBeforeLaterNegotiation", "test:internal/codingagent/terminal_negotiation_upstream_test.go#TestInteractiveInputPumpRetainsFinalBytesBeforeEOF", "test:coding/cli/config_selector_reader_test.go#TestConfigSelectorHoldsLateNegotiationBeforeFocusDispatch", "test:coding/cli/config_selector_reader_test.go#TestConfigEscapeCancelsAndJoinsPendingRead", "scenario:test/parity/scenarios/tui-components/14-terminal-negotiation-framing.toml", "test:tui/terminal_drain_bound_unix_test.go#TestProcessTerminalDrainInputEndsAtTheMaximumWhileInputKeepsArriving", "test:tui/terminal_drain_bound_unix_test.go#TestProcessTerminalDrainInputEndsOnceInputIsIdle", "test:tui/terminal_drain_unix_test.go#TestProcessTerminalDrainInput_ConsumesPendingBytes", "test:tui/terminal_drain_unix_test.go#TestProcessTerminalDrainInputReportsAFailedRead", "test:tui/keyboard_protocol_teardown_test.go#TestDrainInputDisablesProtocolBeforeDraining"]
rationale = "Three async sites. The keyboard-protocol buffer flush timer (:392) and the progress interval are bounded timers whose callbacks only write to the terminal; they are covered by the rows' existing fragment-deadline evidence. drainInput (:443-479) first disables the extended-key protocols, then awaits a loop that sleeps min(idleMs, timeLeft) until maxMs have passed or no byte has arrived for idleMs, and its caller awaits it before the terminal is released; the stdin listener and input handler are restored in finally and a failed read (EOF of a hung-up terminal) rejects. Go: ProcessTerminal.DrainInput disables the protocol first, blocks its caller, returns at the maximum while input keeps arriving, at the idle window once it stops, consumes pending bytes and returns a failed read. Mutations: dropping the maximum check turned TestProcessTerminalDrainInputEndsAtTheMaximumWhileInputKeepsArriving red; dropping the idle check (and continuing on a zero poll) turned TestProcessTerminalDrainInputEndsOnceInputIsIdle red. Delta at Pi 2c8d1feb: no added or removed line contains async, await, Promise or .then, so the reviewed contract is unchanged."

