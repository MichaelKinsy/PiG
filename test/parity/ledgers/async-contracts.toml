came first, whose frame the watch then held as its value instead of delivering it. `ReferenceMember.WatchThen` is the unawaited `.then(then, then)` (Go-only helper, no Pi file): `then` runs as a microtask of the loop with the watch or the error, and must not block: it does not call the watch's Stop, which waits for the watch to close, and a watch whose ctx was cancelled closes only after its abort entered the loop that the callback holds (a callback ends the watch by cancelling its ctx or releasing the reference). TestAMemberWatchOfAReferenceNotBoundYetIsOpenInTheTurnThatBindsIt queues a microtask after the watch's own wait and requires the watch to be followed when it runs (fails 20 of 20 on the old Watch), TestAMemberWatchThenOfAReferenceEndedBeforeItsFirstValueGetsTheError covers the release and abort rejections. | reference.ts follow void watch.closed.then(() => this.#watches.delete(watch)): `Loop.Go` task waits on `watch.Closed()` and removes the watch in a section; `binding.end` clears the list so a retained released reference keeps nothing. | reference.ts pinKeys / KeyedMemberAt.pin / ReferenceKeyed.get/watch (await of pinKey, hydrated, slot.get): `pinKeys` runs the pins one after the other on one `Loop.Go` task and settles a `keyedPromise` in a section; each `pin Update (Pi 6d4b7443): `retry(walk)` with hop budget; the binding released while it binds is tested with the forced difference noted in the lane rows. | Delta v1.5.0+c23b9ec1: Binding.until(done, context) is new: a Promise that resolves once done(state) holds for the reference's state, checked now and at every change; it rejects when the reference ends (its error, released when already released) or when context aborts, and removes its waiter on every path. Only readiness uses it (the old attempt's ending waits on its successor's requests); the waiter is a state observer on the loop, no timer and no thread of its own. Go binding.until returns a keyedPromise settled in a section, the abort through cont