s the same (re-read at Pi 1.5.2, app.ts:955-967: `#close` awaits http, each workers, host and store, closes the plugins' watcher and releases the lock, and its comment says the bases' builds and the recording of the base code are not waited for; the builds are started unawaited at app.ts:419-421; PiG ea821d524 and 5b7ccd1dc): Close does not wait for the bases' builds, the surfaces' builds or the scan of the server's own code, it returns with them still running and releases the data directory's lock then (they write nothing under it), so a second server starts right after (TestAppCloseDoesNotWaitForABaseBuildStalledOnARead..., TestAppCloseReleasesTheDataDirectorysLockAtOnceWhileABuildIsStalled, TestAppClosesWithoutWaitingForAScanOfItsOwnCodeStalledOnARead...); a repeated Close returns the first call's result at once, as Pi's one memoised promise (TestAppARepeatedCloseWhileABuildIsStalledReturnsTheFirstResultAtOnce); the record arriving after the watcher closed watches nothing (TestAppARecordOfTheServersCodeArrivingAfterTheClosedWatcher...). Forced Go lifetime difference, not a numbered divergence: the goroutine startBases starts and each surface's build goroutine are owned, and App.Wait (no Pi counterpart, not called by Close) joins them: nil once they ended and at once when none started, ctx.Err() when ctx ends first with the goroutines left to finish (TestAppWaitReturnsTheContextsErrorWhileAStalledBuildOutlivesItAndNilOnceItEnded, TestAppWaitWithoutAnyBuildStartedReturnsNilAtOnce). Executor: Node's event loop for Pi; Go's callers' goroutines, plus the one goroutine startBases starts, which Wait joins. Delta at Pi 8a5da3ce6 (v1.5.2, host-keyed data): exportData, importData and deleteData gain the host's server part. All three are async and awaited by the caller (Go App.ExportData, ImportData, DeleteData block until done and return the first error); the context is passed to every step. exportData: stages beside the target (mkdtemp `.chord-server-`, removed in finally