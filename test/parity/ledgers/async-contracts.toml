rationale = "agent-session-runtime.ts: new/switch/fork/import replacement awaits the outgoing session (abort + settle), the rebind callback and withSession (their errors propagate), and Close awaits credential write settlement. Go: coding/runtime_replacement.go (Abort, rebind, withSession) and coding/runtime.go Runtime.Close (SettleCredentialWrites). Mutations that turned the tests red: Abort skipped, rebind skipped, withSession run in a goroutine, SettleCredentialWrites replaced by nil. Drain skipped, Invalidate dropped and shutdown error swallowed stayed green and are not claimed. dispose (415-424) awaits session.abort() = agent.abort() + waitForIdle, so a quit and an abort await the aborted run, which awaits its handlers. Ordering: the run ends after the tool_call, tool_result and context handler's reply (runner.ts:1256-1274 emitToolCall, no race against the abort; agent-loop.ts:738), which the subprocess host sends without the run's cancel (host.go runAwaitsEvent; the mechanism of session_before_compact). Cancellation: the abort reaches the handler as a signal-only cancel (its signal), cancels no host call of the handler, and the reply is kept. Error: a handler's own error after the abort surfaces as before, and an extension process that ends while it is awaited ends the request with the connection's error. Node: a turn_end, agent_end, message_end, tool_call, tool_result or context handler, or a tool execute, that has not answered at stdin's end and holds no timer or I/O lets the process's event loop drain, which the runtime reports (runtime.mjs quitDrainState) once the run's abort has reached it: Pi aborts in the tick stdin ends (rpc-mode.ts:744-751, session.abort() first in dispose), pig sends the abort after runtime_input_end, and a handler that waits for nothing but its signal is woken by it, so a report before the abort exits with no session_shutdown, where Pi's process exits (15 ms over RPC) only for a handler that ignores the abort. Interactive quit: settleRunAtQuit returns when the Session is idle (agent-session.ts:1139-1161 clears _isAgentRunActive before it emits agent_settled), so the settle tail's agent_settled handlers are not awaited; a run still active at the quit keeps the join. Mutations of the Node drain report that turned the drain tests red: the gate on the abort removed, the transports' keep-alive removed, the run_signal re-evaluation removed, the held report removed (the abort-deaf drain exit); the other claims' mutations not run."

