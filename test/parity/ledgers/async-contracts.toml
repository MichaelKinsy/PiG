rationale = "settings-manager.ts: a setter changes the value in memory and chains its write on writeQueue (:576-588 enqueueWrite, :635-642 save, :644-660 saveProjectSettings). Each queued write is a microtask that writes the file synchronously; a write that throws is recorded and the queue goes on (:585-587); the fields a setter marked stay marked until a write of their scope succeeds (:578-584), so the next write also saves them, in marking order; a project write repeats assertProjectTrustedForWrite when it runs (:579-581); reload() (:500-501) and flush() (:670-672) await the queue; reload and a trust change forget the marks (:481, :511-514). Go: internal/codingagent/settings_writer.go settingsWriter with settings.go changeGlobal, changeProject and carryUnsaved. The write is queued under the manager lock, in the order of the changes, and performed before the setter returns: on the caller, or on the goroutine that is performing writes, for which the caller waits. Pi's microtask has run before the caller resumes from its next await on I/O or a timer, so done before the call returns is its Go form; a writer goroutine of its own would let a reader find a stale file where Pi cannot (the predecessor's port did, in 77 tests). Difference left, not observable upstream: code in the same synchronous block as the setter finds the old file in Pi, and a trust withdrawal or a lock release in that block is what Pi's write finds, where PiG has written; 197 setter call sites of packages/coding-agent src and test were searched for a read of the settings file, a new SettingsManager, a trust change or a lock change before the next await and none exists (the oracle test records what Pi does for a trust withdrawal in the setter's block). The setter also returns the failure of its write (D633); a setter called from inside a write of the same manager returns nil at once, its write follows the one in progress as Pi's later microtask does, and its failure is only recorded. Before this change