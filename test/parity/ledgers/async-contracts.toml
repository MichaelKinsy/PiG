e clock advances. Tests above, in Pi's order (growing pause, stable reset, offline longest pause and wake, 20 s connect, stop on a no, the next attempt beside the question and a late no, one question at a time, a drop soon after a wake, error retries, the replacement of a silent socket at once, stop closing the link, an open landing as the loop stops, stop cancelling a pending canRetry) and PiG's own (a late no while connecting, a late error, stop's one `waiting` after the close, the 26 000 ms bound); a mutant that asks per close turns `one question at a time` red."

