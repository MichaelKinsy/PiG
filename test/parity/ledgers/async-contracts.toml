rationale = "Session-replacing commands and export_html await off the input loop: a later command of their batch answers first, and replacements and compactions of one batch run in request order after the previous settled, with a fork resolving its entry in the Session that requested it (D146, D147). Pipelined set_model continuations resume in input order after the responses that synchronous handlers queued: auth checks run concurrently, but each settles from an executor event-loop task queued after the previous one's (rpcAwaitInOrder, jsloop.Loop.Macrotask). All 33 upstream command branches and their conditional await boundaries are inventoried in the dispatch report. Prompt/input/preflight and nested queue completions now resume through the same FIFO await executor as synchronous replies. Handler invocation is admitted in order through its first suspension; completion remains independently awaited. Preflight is idle, rechecks streaming after input, accepts before claiming the Agent, and drains on EOF. Model-cycle prefixes and notifications retain their ordering. Shell completion never waits for a pending Provider. Retry reactions share the input executor, and abort joins settlement off the input loop so later synchronous commands retain pre-settlement state. set_model suspends on its auth check before it applies the model, so a later command in the same input batch runs first. Delta at Pi c23b9ec1: shutdown handling changed (:373-395, :738-760, :796-812). The SIGTERM/SIGHUP handlers are registered once and stay until exit (the cleanup list is gone) so a signal during shutdown cannot kill the process before dispose() finishes (for example a pending MCP token refresh); each signal increments signalCount and kills tracked detached children, the first starts `void shutdown(exitCode, signal)`, a repeated one during shutdown calls process.exit at once (one signal during shutdown only means a process manager closed stdin and signalled together). shutdown now returns Promise<void> and runs once (`shuttingDown` guard, later calls such as stdin EOF after a signal do nothing): it unsubscribes, awaits runtimeHost.dispose() (which now also awaits settleCredentialWrites, see the agent-session-runtime.ts row), detaches input, pauses stdin, awaits flushRawStdout unless the signal is SIGTERM, and exits. An extension-requested shutdown is deferred through setImmediate(checkShutdownRequested) and runs only when input is attached, no command is active and the session is idle; every command ending calls it again, which is why handleCommand's result is now taken inside try/finally that decrements activeCommands before the response is written (:801-812). Go coding/cli/rpc_mode.go keeps the same single shutdown (rpcShutdown / exitRPC), leaves the handlers until exit, takes the first signal on the main handler and repeated ones on watchRepeatedTermination (which exits at once and interrupts the credential-write wait), flushes stdout before exit unless SIGTERM, and defers an extension-requested shutdown to the idle check. Closure of the remaining obligations (rpc-mode.ts :95-135 createDialogPromise, :258 ui.editor, :361-363 agent subscriber, :401 bash/abort_bash, :763-811 handleInputLine). Dialogs: a signal already aborted resolves the default before any extension_ui_request is written (:101); Go rpcUIContext.request (coding/cli/rpc_ui.go:127) returns ctx.Err() before writing (fixed in this change: it used to write the request first); a timeout arms a timer and resolves the default (:115-120); ui.editor takes neither signal nor timeout, its request has no timeout member and it resolves only on the response (rpc_ui.go Editor). The agent subscriber `await waitForRawStdoutBackpressure()` runs once per event after the writer and before later subscribers and the next event: subscribeStdoutBackpressure (coding/cli/rpc_events.go:40). Input lines are not serialised on handler completion: bash runs in an owned goroutine (rpc_mode.go bash case, bashWG/shutdownGate) while abort_bash is read and answered, then bash answers with cancelled=true. A non-JSON line answers an id-less parse error, a handler rejection answers error(id, type, message) (rpcJSAdapt failure path) and the loop continues with later lines in order. Proof, 2026-11-13 (go1.27.4): every test named below ran alone against a binary built with one mutation, and each red was seen again in two runs of a second build; with no mutation every test is green (two runs). Mutation -> red tests. A response written at once instead of on the turn's microtask -> ...ResponseTurnDefersAlreadyFulfilledAwait, ...ResponseTurnProtectsLaterInputAndDoesNotStrandCompletions, ...QueueRepliesYieldToInputBatch, ...PromptPreflightAdmitsQueueBatch, ...RetryCancellationReactionBatches. abort_retry answered at once -> ...CycleAndAbortRetrySameInputCallback, ...QueueRepliesYieldToInputBatch, ...RetryCancellationReactionBatches. startPrompt on a macrotask -> ...PromptPreflightAdmitsQueueBatch. Replacement gates that do not wait for the previous replacement -> ...CloneAfterNewSessionOfOneBatchUsesTheRequestingSession, ...FailedSwitchSessionAnswersBeforeTheReplacementAheadOfIt, ...EarlyReplacementErrorFollowsTheCompactionStart; with the await chain removed as well -> TestRPCReplacementsOfOneBatchRunInRequestOrder; a replacement that does not wait for its batch to be dispatched -> TestRPCReplacementStartsAfterItsBatchWasDispatched; a replacement that does not cancel the compactions, or the decision wait skipped -> TestRPCReplacementAbortsTheCompactionOfItsBatch (and ...EarlyReplacementError... for the first); compactions of one batch unchained -> TestRPCCompactsOfOneBatchDoNotCancelEachOther. set_model chain broken -> ...PipelinedSetModelsApplyInInputOrder; rpcAwaitInOrder not awaiting -> the same and TestRPCAwaitInOrderResolvesInArrivalOrder; the awaited work resumed on a microtask -> TestRPCAwaitWorkResumesAfterTheBatchsMicrotasks; set_model applied synchronously -> TestRPCSetModelAppliesAfterTheBatchesLaterCommands. Parse error dropped or deferred -> ...ParseErrorAndRejectedHandlerAnswerInOrderAndTheLoopContinues. AbortBash dropped, or bash run on the input loop -> TestRPCAbortBashAnswersWhileTheBashCommandIsInFlight; bash waiting for the Session to be idle -> TestRPCBashCompletesWhileProviderIsPending. Backpressure wait skipped (plain path, tick path, both) -> TestRPCAgentSubscriberWaitsForStdoutBackpressureOnEveryEvent. Dialog pre-check removed -> TestRPCUIDialogWithAnAbortedSignalWritesNoRequest; dialog timer set to an hour -> TestRPCUICancelAndTimeout. Shutdown gate ignoring active commands, a started shutdown, idleness or attached input -> TestRPCShutdownGate. SIGTERM flushing stdout, a signal running a started shutdown again, a later trigger running it again -> TestRPCShutdownTriggers; a repeated signal that waits for stdout -> the same, TestRPCShutdownRepeatedSignalKeepsItsExitStatus and TestRPCShutdownRepeatedSignalExitsWhileAnotherExitFlushes. Left the evidence: TestRPCSessionReplacementsOfOneBatchSettleInDispatchOrder stayed green under every replacement mutation, the unchained one included. TestRPCUIEditorDialogHasNoTimeoutAndResolvesOnTheResponse pins the request shape of ui.editor and is not mutation-proven. No test distinguishes these (the mutation compiled, every test stayed green): rpcAwaitInOrder settling on a microtask instead of a macrotask; the queue reply, the queue error, the prompt's input, preflight and chain steps moved between microtask and macrotask or made direct (nine mutations); the replacement and compact replies written at once; the replacement gates alone, the compaction gates alone and the chain arguments alone, which cover for each other. The scenario and probe entries this row had. Covered only by a scenario: 55 (a later command of the batch answers first, from the old Session, while a replacement or export_html awaits); 31 and 32 (a blocked model_select listener does not serialize later cycles; cycle prefixes run in input order and the response state is sampled after the await); 13, 20, 35 and 36 compare with Pi, record by record, the order of the prompt, steer, follow_up and get_state replies of one batch and of a suspended preflight, the order the green mutations above move, while admission itself is proven by ...PromptPreflightAdmitsQueueBatch and ...QueueRepliesYieldToInputBatch. Proven by a test and off the list: 17 (abort_retry: ...RetryCancellationReactionBatches, ...CycleAndAbortRetrySameInputCallback). Off the list because it names no await: 07 (the wire shape of the model and thinking queries). The four probe documents (docs/findings/rpc-command-dispatch.md, rpc-h1-continuations.md, rpc-preflight-admission.md, pr70-steering-admission.md) record the command inventory and earlier reds; they are references, not evidence. No scenario was run under a mutation. Delta at Pi beffcde92dea (#12230, issue #10470): rebindSession subscribes to the Session (the writer, then the backpressure subscriber on session.agent) BEFORE `await session.bindExtensions(...)` (:323-338), and new_session, switch_session, fork and clone no longer call rebindSession after the runtimeHost call (:459-465, :623-641): the callback registered with setRebindSession is the only rebind of a replacement, so session_start runs once. Order: the subscription precedes the bind, so what a session_start handler emits (entry_appended, session_info_changed, the message_start/message_end of a message it sends, the extension_ui_request of a notify) is written in emission order, after the previous Session session_shutdown output (the runtime tears the old Session down before it calls the callback) and ahead of the command response (the response is written after `await runtimeHost.newSession()` returns, which awaits the callback and with it the bind); at startup the same events precede the first response. Go: rpcHost.bind subscribes (forward and the name listener) before the first announce and no flag holds the writer back, rpcHost.rebindAgain is deleted and awaitReplacement does not rebind a second time (coding/cli/rpc_mode_runtime.go, rpc_mode.go). Proof, 2026-11-16: TestRPCNewSessionRunsSessionStartOnceUpstream and its switch_session, fork and clone siblings (two session_start calls each), TestRPCStreamsEntriesAppendedByTheStartupSessionStartUpstream (no startup entry_appended) and TestRPCWritesSessionStartEmissionsOnceInEverySDK (all five SDKs) were red on the code before the change; scenarios 70, 73, 83 and 84 were red against the oracle with the backport, with the old binary; TestRPCWritersSubscribeBeforeSessionStart fails when the subscription is moved after the first announce."

