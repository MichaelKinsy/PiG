rationale = "lazyStream (:48-61) returns the outer stream at once and runs the setup promise behind it: forwardStream's .then forwards each inner event in order, resolves the outer result from the independent inner result() (an end-only inner stream is not given a fabricated terminal event), and a setup rejection becomes one error event ending as 'aborted' when the request signal is aborted and 'error' otherwise (:83); the result and the observer fire once. lazyApi (:67-100) wraps fetchDeferred/cancelDeferred in the same way. Nobody awaits the outer stream's producer: its owner is the stream. Pi 2ec55d80 adds the observer: ai.LazyStreamObserver{OnEvent, OnResult} is synchronous and read-only, runs inside the forwarding turn, calls OnEvent after each push and OnResult once after the outer stream ends, and observes a setup failure as the error event and then the result; it adds no cancellation and no tick. Go: ai/provider_streams.go LazyStream, LazyStreamSync, forwardLazySetup and LazyAPI; the request context is the signal. Dynamic module loading is static linking in Go. Mutation: lazySetupStopReason ignoring the context (always 'error') turned TestLazySetupRejectionIsAbortedWhenTheRequestSignalIsAborted and TestModelsDispatchSetupErrorsAreAbortedWhenTheRequestSignalIsAborted red. Delta at Pi c23b9ec1: f3a64af07 (#8635) adds the signal parameter of lazyStream; a setup that rejects ends with stopReason \"aborted\" instead of \"error\" when the signal is aborted (lazy.ts:83), whatever the cause. In Go the request context is that signal (ai.LazyStream, pushModelsSetupError); the cancellable contract now includes the reason of a setup failure under a cancelled context, covered by test:ai/models_provider_setup_abort_pi_test.go and test:ai/api_streams_aliases_pi_test.go. lazyStream (lazy.ts:48-90) returns its outer stream before setup settles; in Go ai.LazyStream and LazyStreamSync (ai/provider_streams.go) return the outer stream immediately and run setup on the shared continuation queue, so setup starts in the first reaction after the call (await-first) or inside the caller prefix (sync), reproducing Pi's microtask order, checked against the Node-measured golden by TestLazyStreamMatchesPiMicrotaskOrder. forwardLazySetup/forwardEvents (provider_streams.go:200, stream_forward.go:8) push each inner event to the outer stream in order, then await the inner stream result and end the outer stream with it, including an end-only result with no terminal event (lazy.ts:31-46; TestModelsLazyStreamForwardsResultWithoutEvents). A rejected setup never throws: it becomes one error event plus the matching result, with reason aborted when the request context is cancelled and error otherwise (lazy.ts:77-88, lazySetupStopReason; TestLazySetupRejectionIsAbortedWhenTheRequestSignalIsAborted, TestLazyAPISetupOrderingCancellationAndLoadFailure). lazyStream does not itself cancel the inner stream: cancellation reaches it through the request context handed to setup, and forwarding runs on context.WithoutCancel so the producer's own aborted terminal is forwarded (TestLazyStreamCancellationReachesTheInnerProducerAndItsAbortedTerminalIsForwarded). Models.lazyStream (ai/models_runtime_stream.go:113) runs the same forwarding on the Models operation owner, joined by operations.Wait. lazyApi's dynamic import is static linking in Go; LazyAPI calls its loader per operation and the loader caches. Deferred operations: lazyApi and its Go counterpart LazyAPI run the module load inside each deferred operation, so a cancelDeferred issued while the load is pending stays suspended at lazy.ts:133 until the load settles, then forwards (:135) and settles with the loaded implementation's result, and a load failure rejects that one call with the load error (fetchDeferred ends its stream with a single error event, lazy.ts:77-88); TestLazyAPICancelDeferredCapabilityForwardsAfterLoading, TestLazyAPICancelDeferredIssuedDuringLoadWaitsForTheLoadThenForwardsAndReportsItsError and TestLazyAPISetupOrderingCancellationAndLoadFailure assert these. Pi 2ec55d80 adds the observer: ai.LazyStreamObserver{OnEvent, OnResult} is synchronous and read-only, runs inside the forwarding turn, calls OnEvent after each push and OnResult once after the outer stream ends, and observes a setup failure as the error event and then the result; it adds no cancellation and no tick (tick positions are unchanged). Delta at Pi c23b9ec1: f3a64af07 (#8635) adds the signal parameter of lazyStream; a setup that rejects ends with stopReason \"aborted\" instead of \"error\" when the signal is aborted (lazy.ts:83), whatever the cause. In Go the request context is that signal (ai.LazyStream, pushModelsSetupError); the cancellable contract now includes the reason of a setup failure under a cancelled context, covered by test:ai/models_provider_setup_abort_pi_test.go and test:ai/api_streams_aliases_pi_test.go."

