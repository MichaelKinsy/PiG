# Disposition of every runtime export (and public class member) of the modules Pi
# serves to extensions (pi-coding-agent, pi-tui, pi-ai, pi-ai/compat,
# pi-agent-core) in each PiG extension runtime. Type-only exports (interfaces,
# type aliases) have no runtime and are identity by kind: they take no row.
#
# The generator (go run ./test/parity/cmd/sdksurface) writes this file in one
# canonical layout, keeps every cell you set, adds a row for each new Pi export
# with every cell "unclassified" and drops rows Pi no longer exports. The check
# fails until each cell is one of:
#
#   native:<symbol>      a symbol of the SDK (Go Name, Rust snake_case, Python snake_case)
#                        a public subpackage's symbol carries its qualifier: tui.VisibleWidth (Go), tui::visible_width (Rust), tui.visible_width (Python)
#   kit:<view>           a declarative component-kit view
#   host:<symbol>        the same behavior through a context call
#   identity             a pure type or alias (only for listed policy identity_runtime helpers)
#   divergence:D<n>      an owner-approved divergence in docs/parity/DIVERGENCES.md
#   gap:<lane>           not realized; [lane.<lane>] names the owner and the closing row
#
# There is no n/a, deferred or pending. A "node" cell appears only where the
# Node runtime does not serve the export. Every native, kit and host cell must be
# reached by a conformance fixture (test/extension-conformance) or by a vector
# test generated from Pi's own implementation (a test file under the SDK that
# reads test/parity/sdk-vectors/); a cell that is not yet reached is listed in
# [[unreached]], which only shrinks. A gap on an export that
# test/parity/extension-import-usage.json shows high_use or more scanned packages
# importing blocks the release gate (make sdk-exports-release), and so does a lane
# older than max_gap_trains.

[policy]
release_train = "0.5.2"
trains = ["0.5.2"]
max_gap_trains = 1
high_use = 5
identity_runtime = ["pi-coding-agent: KeybindingsManager", "pi-coding-agent: KeybindingsManager.getConflicts", "pi-coding-agent: KeybindingsManager.getDefinition", "pi-coding-agent: KeybindingsManager.getEffectiveConfig", "pi-coding-agent: KeybindingsManager.getKeys", "pi-coding-agent: KeybindingsManager.getResolvedBindings", "pi-coding-agent: KeybindingsManager.getUserBindings", "pi-coding-agent: KeybindingsManager.matches", "pi-coding-agent: KeybindingsManager.reload", "pi-coding-agent: KeybindingsManager.setUserBindings", "pi-coding-agent: defineTool", "pi-tui: StdinBuffer.[Symbol.captureRejectionSymbol]"]

[lane.C2Sessions]
owner = "C2Sessions lane (createAgentSession family, E1/E6)"
opened = "0.5.2"
closing = "Conformance rows for createAgentSession, createAgentSessionRuntime and the pi-agent-core Agent loop in all four SDKs (branch feat/sdk-child-agent-sessions)"

[lane.SdkBuiltinToolDelegate]
owner = "SdkBuiltinToolDelegate lane (built-in tool delegation, E7)"
opened = "0.5.2"
closing = "TestConformance_BuiltinToolDelegationAcrossSDKs"

[lane.SdkExportsLedger]
owner = "SdkExportsLedger lane (Pi application internals no extension scan imports)"
opened = "0.5.2"
closing = "Owner decision per export, listed with usage counts in handoffs/0.5.2/sdk-exports-internals.md: a numbered divergence in docs/parity/DIVERGENCES.md (cells become divergence:D<n>), or a real lane with a port and a conformance row"

[lane.SdkPiAiHelpers]
owner = "SdkPiAiHelpers lane (pi-ai pure helpers, StringEnum, host getters, E17-E22)"
opened = "0.5.2"
closing = "Pure helpers with vector tests from Pi at the pin; host getters and the pi-ai compat calls with a conformance row per SDK"

[lane.SdkSessionGraph]
owner = "SdkSessionGraph lane (SessionManager/SettingsManager/ModelRuntime/resource loader, E2-E5)"
opened = "0.5.2"
closing = "Host calls for session open/list/inMemory, scoped settings, standalone model runtime, resource loader and package manager, with a conformance row per SDK"

[lane.SdkTuiHelpers]
owner = "SdkTuiHelpers lane (pi-tui helpers, keys, keybindings, theme and rendering helpers, E8-E16)"
opened = "0.5.2"
closing = "Pure helpers ported per SDK with vector tests from Pi at the pin (test/parity/sdk-vectors), keybinding and theme helpers with a conformance row per SDK"

