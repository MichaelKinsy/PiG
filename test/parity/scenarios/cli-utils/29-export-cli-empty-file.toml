# Behavior family: cli-utils
# Surface: pi --export <input> on an empty file.
#
# Pi 1.1.0 main.ts:638-648 runs exportFromFile (core/export-html/index.ts:288-318): resolvePath(input), existsSync, SessionManager.open (session-manager.ts:1766,
# _setSessionFile 1029-1055), generateHtml, writeFileSync; a failure prints "Error: <message>" in red to stderr and exits 1, success prints
# "Exported to: <path>" to stdout and exits 0. Pi treats an empty file as a new session (_setSessionFile 1036-1043) and exports it, exit 0, where Pig failed with "empty session file". The output path is explicit because the default name carries the app name.
name = "29-export-cli-empty-file"
description = "--export on an empty file answers like Pi"
covers = ["packages/coding-agent/src/main.ts", "packages/coding-agent/src/core/export-html/index.ts"]
tags = ["fast", "hermetic"]
driver = "cli-mode"

[env]
pig = ["PIG_HOME=testdata/empty-home"]
pig_args = ["--export", "testdata/export-inputs/empty.jsonl", "{{TEMP}}/out.html"]
pi_args = ["--export", "testdata/export-inputs/empty.jsonl", "{{TEMP}}/out.html"]

[cli]
timeout_seconds = 15
cwd = "."

[assert]
exit_code = 0
both_contain = ["Exported to: "]
output_equal = true
stderr_equal = true
runs = 3

# normalize-rationale: Pig and Pi receive independent temporary roots; only that root differs.
[[assert.normalize_replace]]
pattern = 'parity-cli-[0-9a-z-]+-(pig|pi)-[0-9]+'
with = 'parity-cli-run'
reason = "D2: replace only this scenario's allocated temporary root."
