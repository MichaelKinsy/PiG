# Behavior family: cli-utils
# Pi 0.87.1 probe: `pi install --unknown` exits 1 with exactly:
# Unknown option --unknown for "install".\nUse "pi --help" or "pi install <source> [-l] [--approve|--no-approve]".\n
# Source: packages/coding-agent/src/package-manager-cli.ts:265-269,879-883;
# test: packages/coding-agent/test/package-command-paths.test.ts:528-541.
name = "12-install-unknown-option"
description = "Unknown install options show Pi's exact ordinary-install diagnostic"
covers = ["packages/coding-agent/src/package-manager-cli.ts"]
tags = ["fast", "hermetic"]
driver = "cli-mode"

[env]
override_base_args = true

[cli]
args = ["install", "--unknown"]
timeout_seconds = 10

[assert]
exit_code = 1
both_contain = ['Unknown option --unknown for "install".', 'install <source> [-l] [--approve|--no-approve]']
both_not_contain = ["--validate-only", "<source>..."]
output_equal = true
runs = 3

# normalize-rationale: D2 changes only the command identity. Keep every other diagnostic byte.
[[assert.normalize_replace]]
pattern = '\bpig\b'
with = 'pi'
reason = "D2: PiG uses the pig executable name instead of pi."
