# Behavior family: cli-utils
# Pi 6d4b7443 probe (packages/coding-agent/dist/cli.js, scratch agent dir): exit 1: server "x": oauth.clientRegistration must be "auto", "dcr", or "cimd"
# Source: packages/coding-agent/src/extensions/mcp/cli.ts (--oauth-client-registration, Pi 908aa7b7), core/mcp-servers.ts:205.
# Pi's pinned release (e7a0df27) predates the flag, so this scenario compares against Pi only after the pin bump to 6d4b7443.
name = "34-mcp-add-oauth-client-registration-invalid"
description = "An unknown --oauth-client-registration mode is rejected with the three-mode message."
covers = ["packages/coding-agent/src/extensions/mcp/cli.ts", "packages/coding-agent/src/core/mcp-servers.ts"]
tags = ["fast", "hermetic"]
driver = "cli-mode"

[env]
override_base_args = true

[cli]
args = ["mcp", "add", "x", "--url", "https://example.com", "--oauth-client-registration", "maybe"]
timeout_seconds = 25

[assert]
exit_code = 1
both_contain = ['must be "auto", "dcr", or "cimd"']
output_equal = true
runs = 3

# normalize-rationale: D2 changes only the command identity. Keep every other diagnostic byte.
[[assert.normalize_replace]]
pattern = '\bpig\b'
with = 'pi'
reason = "D2: PiG uses the pig executable name instead of pi."
