# Pi 0.87.1 main.ts:619-622 returns --version before validating Session flags.
# Probe: pi --name '   ' --session-id invalid/id --version prints 0.87.1 and exits 0.
name = "13-cli-version-before-session-validation"
description = "Version routing precedes invalid Session name and ID validation"
covers = ["packages/coding-agent/src/main.ts"]
tags = ["hermetic", "fast"]
driver = "cli-mode"

[cli]
args = ["--name", "   ", "--session-id", "invalid/id", "--version"]
timeout_seconds = 10

[assert]
exit_code = 0
output_equal = true
runs = 3
