# Behavior family: clipboard-images
# Surface: Settings menu Kitty-image-gated entries visible under Ghostty env.
#
# Under tmux, getCapabilities().images returns null, hiding the
# "Show images", "Image width", "Auto-resize images", and "Block images"
# settings. Under a Kitty-capable terminal (Ghostty, Kitty, WezTerm),
# these entries appear because getCapabilities().images === "kitty".
#
# This scenario uses the headless-terminal driver (ht, backed by
# libghostty-vt) with TERM_PROGRAM=ghostty env overrides so both
# binaries detect Kitty image capability. It then opens /settings
# and asserts the image-related entries are present.
#
# Upstream evidence (Pi 1.5.2, settings-selector.ts; run through ht/libghostty-vt in tern-ci:v11, 2026-11-13):
# with image capability Pi lists 35 rows: 24 in the items array (:485-768, among them share-destination at
# :516, added by Pi cea25743, first released in 1.3.0), the 2 image rows (:771-787) and 9 rows spliced in
# unconditionally (:790-876). PiG omits the share-destination row by divergence D64 (/share always uploads
# to pi-in-go.dev) and adds exactly one row by divergence D80 (Mask secret input), so both counters read
# (1/35) and the first window, which holds neither row, is the same text and the same styling on both
# sides. No count normalization: the two raw counts and the equality of the complete crop reject any other
# row difference. The rows where the rosters differ are compared in settings/15-settings-roster-d64-d80,
# and internal/codingagent TestSettingsRosterDiffersFromPiOnlyByD64AndD80 derives the whole roster from the
# pinned source, as settings/02 and settings/09 state for a terminal without images.

name = "05-kitty-settings-visible"
description = "Image-related settings appear when terminal reports Kitty image capability."
covers = [
  "packages/coding-agent/src/modes/interactive/components/settings-selector.ts",
]
tags = ["hermetic", "tui"]
driver = "headless-terminal"

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
# Pi starts typing after its startup rebind, which sets the autocomplete provider and then prints this warning
# (interactive-mode.ts:1085-1099; settings/02 waits the same way). The footer paints before the rebind, and
# "/settings" sent then is submitted as a prompt: the list never opens (seen once in three family runs).
ready_pattern_pi = "Warning: No models available."
ready_timeout_seconds = 25
keys = ["/settings<CR>"]
settle_seconds = 1
capture_start = "Show images"
capture_end = "Type to search"
cwd = "testdata"

[env]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]
pig = ["PIG_TEST_FAUX=1", "TERM_PROGRAM=ghostty", "TERM=xterm-ghostty", "COLORTERM=truecolor"]
pi = ["TERM_PROGRAM=ghostty", "TERM=xterm-ghostty", "COLORTERM=truecolor"]

[assert]
runs = 3
output_equal = true
escaped_output_equal = true
pig_contains = ["(1/35)"]
pi_contains = ["(1/35)"]
