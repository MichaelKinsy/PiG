# Upstream evidence: Pi 0.87.1 armin.ts chooses one of seven effects. Compare the settled bitmap,
# not nondeterministic intermediate frame timing; armin-oracle.mjs compares every
# intermediate frame under the same random stream, including non-terminating rain.
# Completion barrier: every bitmap row visible together (wait_visible_contains searches only the
# current pane, so rows from different frames cannot satisfy it) and the pane unchanged for 500 ms.
# armin.ts tickRain has no completion signal: after a column's last pixel settles, its drop still
# falls through the whole column drawing "▓" over settled cells, starting up to 5 frames (167 ms at
# 30 fps) after it settles. A quiet window longer than that entry gap means no drop remains.
# Cumulative history (wait_contains) matched rows from earlier frames and let a slow Pi capture "▓".
# The crop retains the spacer, all 18 image rows and the label, excluding startup/footer identity.
name = "13-armin-bitmap"
description = "Hidden Armin command converges to Pi's complete accent-colored 31 by 36 half-block bitmap"
covers = ["packages/coding-agent/src/modes/interactive/components/armin.ts"]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 80
height = 50
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 20
capture_start = "Session name set: armin-anchor"
capture_end = "Session name set: armin-end"

[[tmux.steps]]
keys = ["/name armin-anchor", "Enter"]
wait_contains = ["Session name set: armin-anchor"]

[[tmux.steps]]
keys = ["/arminsayshi", "Enter"]
wait_visible_contains = [
 "         ▄▄▄▄", "          ▀▄ ▀▄", "            █  ▀▄▄",
 "      ▄▀▀▀▀▀     █", "      █▄   ▄▄▄▄▀▀▀▀▄", "    ▄▀  ▀▀▀  ▄▄▄▄▀▀ █",
 "    █              ▄█▄", "    ▀▄   ▄▄▄▀▀▀▀▀▀▀▀▄█  ▄▄▄▄▄",
 "  ▄▄▄▀▀▀▀▄▄▄▄▄▄▄▄▄▄█▄ ▄▀   ▄ ▀▄", "  █▄▄▄▄        ▀▀▀▀  █     ▀█ █",
 "      ██ ▄█      █   █ ▄      █", "      ▀█████▄▄▄▄███▄▄▀▄▀▄▄▄  ▄▀",
 "        ▀██████▀▀▀▀   ▀▄▄▄▄▄▀", "          ▀████████▀  ▄▄ ▄▄▄",
 "            ▀█████▀  ██▀ ██▄", "                     ██  ▄▄▄",
 "                      █  ▀█▀", "                       ▀▀▀", " ARMIN SAYS HI",
]
wait_stable_milliseconds = 500
wait_timeout_seconds = 30

[[tmux.steps]]
keys = ["/name armin-end", "Enter"]
wait_contains = ["Session name set: armin-end"]

[env]
pig = ["PIG_CODING_AGENT_DIR=../model-resolver-selector/testdata/model-picker-defaults"]
pi = ["PI_CODING_AGENT_DIR=../model-resolver-selector/testdata/model-picker-defaults"]
pig_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_contain = ["ARMIN SAYS HI"]
output_equal = true
escaped_output_equal = true
runs = 3
