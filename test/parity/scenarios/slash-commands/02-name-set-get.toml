# Upstream evidence: Pi 0.87.1 interactive-mode.ts:6408-6430 appends a spacer and padded,
# theme-dim Text for both name confirmation and lookup, not Markdown.
# Capture both commands including the intervening blank row. Offline mode
# prevents an update notice from interrupting this deterministic surface.

name = "02-name-set-get"
description = "Both binaries show matching /name set confirmation and bare /name display."
covers = [
  "packages/coding-agent/src/core/slash-commands.ts",
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 35
# Both sides start typing after their startup rebind, which sets the autocomplete provider and then prints this
# warning; "(auto)" paints before PiG's rebind, and a key sent then is cancelled by it (interactive-mode.ts:1085-1099).
ready_pattern_pig = "Warning: No models available."
ready_pattern_pi = "Warning: No models available."
ready_timeout_seconds = 25
capture_start = "Session name set: test-session"
capture_end = "Session name: test-session"
capture_start_last = true

[[tmux.steps]]
keys = ["/name test-session", "Enter"]
wait_contains = ["Session name set: test-session"]
wait_timeout_seconds = 5
settle_seconds = 1

[[tmux.steps]]
keys = ["/name", "Enter"]
wait_contains = ["Session name: test-session"]
wait_timeout_seconds = 5
settle_seconds = 1

[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent"]
pig_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_not_contain = ["unknown command", "panic:", "goroutine "]
output_equal = true
escaped_output_equal = true
runs = 3
