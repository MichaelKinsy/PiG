# Upstream evidence: Pi 1.5.0 interactive-mode.ts handleHotkeysCommand (6955-7023) appends an "Extensions" table after the
# built-in tables when extensionRunner.getShortcuts() is not empty: one row per shortcut in registration order, the key
# capitalized (formatKeyText) and the description or, without one, the extension path.
name = "26-hotkeys-extension-shortcuts"
description = "Hotkeys lists extension-registered shortcuts in an Extensions table"
covers = [
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
  "packages/coding-agent/src/core/extensions/runner.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 150
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 20
capture_start = "Session name set: hotkeys-ext-anchor"
capture_end = "Session name set: hotkeys-ext-end"

[[tmux.steps]]
keys = ["/name hotkeys-ext-anchor", "Enter"]
wait_contains = ["Session name set: hotkeys-ext-anchor"]
wait_timeout_seconds = 5

[[tmux.steps]]
keys = ["/hotkeys", "Enter"]
wait_contains = ["Parity third shortcut"]
wait_timeout_seconds = 5
settle_seconds = 1

[[tmux.steps]]
keys = ["/name hotkeys-ext-end", "Enter"]
wait_contains = ["Session name set: hotkeys-ext-end"]
wait_timeout_seconds = 5
settle_seconds = 1

[env]
pig = ["PIG_CODING_AGENT_DIR=../model-resolver-selector/testdata/model-picker-defaults"]
pi = ["PI_CODING_AGENT_DIR=../model-resolver-selector/testdata/model-picker-defaults"]
pig_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]
pig_extensions = ["testdata/ext/hotkeys-shortcuts.mjs"]
pi_extensions = ["testdata/ext/hotkeys-shortcuts.mjs"]

[assert]
both_reach_ready = true
both_contain = ["Keyboard Shortcuts", "Extensions", "Parity first shortcut", "Parity third shortcut", "Ctrl+Shift+X", "F5"]
output_equal = true
escaped_output_equal = true
runs = 3
