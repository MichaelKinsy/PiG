# Pi 0.87.1 google-vertex.ts:356-458 selects ADC for placeholder keys and
# API-key express mode otherwise, applies collection-scope custom URLs and
# avoids appending a second API version. Pi uses a stubbed ADC token source;
# Go uses the official ADC library with a hermetic refresh client and scoped
# credential file. Both use the real model HTTP encoder and capture routing/auth.
name = "20-vertex-auth-routing"
description = "Vertex placeholder keys select ADC and custom endpoints retain version/publisher routing and explicit headers."
covers = ["packages/ai/src/api/google-vertex.ts"]
tags = ["fast", "hermetic"]
driver = "cli-mode"

[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
pig_args = ["go", "run", "./test/parity/testdata/vertex-auth-routing-pig"]
pi_args = ["node", "./test/parity/testdata/vertex-auth-routing-pi.mjs"]

[cli]
cwd = "../../../.."
timeout_seconds = 60

[assert]
exit_code = 0
output_equal = true
both_contain = ['"key":"","auth":"Bearer adc-fixture"', '"key":"AIzaSyExampleRealisticLookingApiKey123456","auth":""', '"userAgent":"custom-agent","api":"google-vertex"', '/v1/projects/test-project/locations/global/publishers/google/models/']
runs = 3
