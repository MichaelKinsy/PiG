# Pi 0.87.1 http-dispatcher.ts enables proxyTunnel for HTTP, and main.ts applies global httpProxy without overriding env.
# Each real CLI prints through both native OpenAI API paths. A hermetic TCP proxy records the actual CONNECT request before forwarding to an SSE origin.
# Only the assigned origin's ephemeral address is represented as targetIsOrigin; method, HTTP version, request count and exact print stdout remain in the equality comparison.
name = "19-http-proxy-connect"
description = "Global proxy settings reach native provider requests through CONNECT, including loopback HTTP origins."
covers = ["packages/coding-agent/src/core/http-dispatcher.ts"]
tags = ["hermetic", "fast"]
driver = "cli-mode"
[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
pig_args = ["python3", "./test/parity/testdata/http-proxy-print.py", "pig"]
pi_args = ["python3", "./test/parity/testdata/http-proxy-print.py", "pi"]
[cli]
cwd = "../../../.."
timeout_seconds = 80
[assert]
exit_code = 0
output_equal = true
runs = 3
