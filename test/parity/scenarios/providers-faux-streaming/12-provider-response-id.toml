# Pi 0.87.1 openai-completions.ts:558-560 retains the first chunk ID and the first model differing from the request.
# Responses finalization uses the authoritative terminal ID without publishing response.model (openai-responses-shared.ts:551-558,599-600).
# The fixture sends distinct IDs/models through actual HTTP SSE requests, including the Responses cross-family path.
# Upstream responseid.test.ts:61 asserts a nonempty responseId; the initial Go Completions result was empty.
name = "12-provider-response-id"
description = "OpenAI-compatible streams preserve provider response identity and concrete model metadata."
covers = ["packages/ai/src/api/openai-completions.ts", "packages/ai/src/api/openai-responses-shared.ts"]
tags = ["fast", "hermetic"]
driver = "cli-mode"

[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
pig_args = ["go", "run", "./test/parity/testdata/responseid/pig"]
pi_args = ["node", "./test/parity/testdata/responseid/pi.mjs"]

[cli]
cwd = "../../../.."
timeout_seconds = 60

[assert]
exit_code = 0
output_equal = true
both_contain = ['"responseId":"first"', '"responseId":"final"', '"responseModel":"resolved"', '"responseModel":""']
runs = 3
