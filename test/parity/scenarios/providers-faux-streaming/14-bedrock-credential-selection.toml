# Pi 0.87.1 bedrock-credentials.test.ts:72-113 and bedrock-endpoint-resolution.test.ts:200.
# Both probes isolate AWS config files and send real signed requests to local HTTP servers.
# The empty eventstream deliberately ends in a parsing error after the auth header is observed.
# Competing keys are scoped during profile requests to avoid Node's SDK-only process-env warning.
# The exact upstream ambient-key conflict remains asserted in TestBedrockUpstreamCredentials.
# Assert selected identity/region and exact bearer auth, never volatile SigV4 dates or signatures.
name = "14-bedrock-credential-selection"
description = "Bedrock explicit/scoped profiles beat ambient keys, ambient profiles do not, and API keys select bearer auth."
covers = ["packages/ai/src/api/bedrock-converse-stream.ts"]
tags = ["fast", "hermetic"]
driver = "cli-mode"

[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
pig_args = ["go", "run", "./test/parity/testdata/bedrock-config-pig"]
pi_args = ["node", "./test/parity/testdata/bedrock-config-pi.mjs"]

[cli]
cwd = "../../../.."
timeout_seconds = 60

[assert]
exit_code = 0
output_equal = true
both_contain = ["explicit auth=explicit-profile region=eu-west-1", "scoped auth=scoped-profile region=us-east-2", "ambient auth=AKIAEXAMPLE region=us-east-2", "bearer auth=Bearer bedrock-api-key"]
runs = 3
