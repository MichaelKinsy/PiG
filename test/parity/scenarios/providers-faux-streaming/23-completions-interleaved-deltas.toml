# Pi 0.87.1 openai-completions.ts keeps independent text/thinking/tool blocks and initial IDs.
# Both adapters consume identical HTTP chunks and print the complete event discriminator sequence
# and final content. Tool argument objects use deterministic key enumeration, not value normalization.
name = "23-completions-interleaved-deltas"
description = "Parallel tool calls keep first identity while text and thinking deltas interleave."
covers = ["packages/ai/src/api/openai-completions.ts"]
tags = ["fast", "hermetic"]
driver = "cli-mode"
[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
pig_args = ["go", "run", "./test/parity/testdata/completions-interleaved-pig"]
pi_args = ["node", "./test/parity/testdata/completions-interleaved-pi.mjs"]
[cli]
cwd = "../../../.."
timeout_seconds = 60
[assert]
exit_code = 0
output_equal = true
both_contain = ['toolCall:functions.read:0:read:', 'text:answer 1 answer 2', 'toolCall:tc_grep_initial:grep:']
runs = 3
