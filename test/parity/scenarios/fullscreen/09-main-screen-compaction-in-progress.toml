# Behavior family: fullscreen
# Surface: Pi 0.87.1 main-screen compaction transition before replacement settles.
# Upstream evidence: paired 0.87.1 probes resume the same compactable
# conversation and retain its settled tail above the editor-border compaction
# spinner. Animation frames vary at capture; border spacing, conversation rows,
# and the viewport remain exact.

name = "09-main-screen-compaction-in-progress"
description = "In-progress compaction retains the same settled conversation tail as Pi."
covers = [
  "packages/tui/src/tui-main-screen.ts",
]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
# TEST_FAUX_HOLD_COMPACTION keeps the summary pending until teardown, so the
# in-progress screen is a steady state on both sides rather than a window the
# capture has to race.
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=../compaction/testdata/pig-agent", "TUI_LIVE_PROBE=1", "TEST_FAUX_HOLD_COMPACTION=1"]
pi = ["PI_CODING_AGENT_DIR=../compaction/testdata/pi-agent", "PI_SKIP_VERSION_CHECK=1", "TUI_LIVE_PROBE=1", "TEST_FAUX_HOLD_COMPACTION=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
# Fullscreen is the default TUI mode since Pi 1.0.0; this scenario covers the main-screen renderer.
pig_args = ["--no-extensions", "--session-dir", "sessions", "--session", "sessions/2025-01-01T00-00-00-000Z_parity-compact.jsonl", "--tui-mode", "regular"]
pi_args = ["--session-dir", "sessions", "--session", "sessions/2025-01-01T00-00-00-000Z_parity-compact.jsonl", "--tui-mode", "regular"]

[tmux]
width = 80
height = 20
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
cwd = "../compaction/testdata/compact-session"
capture_start = "How do goroutines work internally?"
capture_end = "faux-1"

[[tmux.steps]]
keys = ["/compact", "Enter"]
wait_contains = ["Compacting context... (escape to cancel)"]
wait_timeout_seconds = 15
# wait_contains also matches scrollback and the raw output transcript, which
# can run ahead of the painted screen; the capture reads the visible screen.
wait_visible_contains = ["How do goroutines work internally?", "Compacting context... (escape to cancel)"]

[assert]
both_reach_ready = true
both_contain = ["Compacting context... (escape to cancel)"]
both_not_contain = ["[compaction]", "panic:", "goroutine "]
output_normalized_equal = true
runtime_ratio_max = 2.0
runs = 3

# normalize-rationale: Only the spinner phase varies with capture timing. All conversation rows, footer counters and border cells remain compared.

[[assert.normalize_replace]]
pattern = '(?m)^(── )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]( Compacting context\.\.\. \(escape to cancel\) ─*)$'
with = '${1}<SPINNER>${2}'
reason = "Pi renders an animated spinner in the editor border; preserve its label, spacing and full border width."
