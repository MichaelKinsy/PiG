# Behavior family: fullscreen
# Surface: TuiAltScreen.doRender search highlights (applySearchHighlights over the primary scroll view)
#
# After one conversation turn, Ctrl+Shift+F opens the transcript search and "expr" is typed; the matches in the
# user message and the tool call are highlighted, the selected one in the current-match colors. Enter selects the
# next match, so the highlight moves. The crop starts at the tool call, below the startup header whose text
# differs between pig and pi, and ends at the footer, so the highlighted transcript rows are compared byte for byte.
#
# Upstream evidence (pi 1.5.0 at the pin, bi-c5 probe): the scenario drives the pinned Pi and Pig with the same keys; the comparator below is the recorded expectation.
#

name = "18-alt-screen-search-highlights"
description = "Fullscreen transcript search highlights the matches and the selected match in the transcript rows identically in pig and pi."
covers = [
  "packages/tui/src/alt-screen-search.ts",
  "packages/tui/src/tui-alt-screen.ts",
]
tags = ["fast", "hermetic", "tui", "fullscreen"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent", "PI_SKIP_VERSION_CHECK=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]

[tmux]
width = 100
height = 24
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "$ "
capture_end_regex = "faux-1\\s*$"

[[tmux.steps]]
keys = ["Run: expr 20 + 22", "Enter"]
settle_seconds = 6
wait_contains = ["Took"]
wait_timeout_seconds = 15

[[tmux.steps]]
keys = ["hex:1b 5b 31 30 32 3b 36 75"]
settle_seconds = 2

[[tmux.steps]]
keys = ["expr"]
settle_seconds = 2

[[tmux.steps]]
keys = ["Enter"]
settle_seconds = 2

[assert]
both_reach_ready = true
both_not_contain = ["unknown command", "panic:", "goroutine "]
escaped_output_equal = true
runtime_ratio_max = 2.0
runs = 3

# normalize-rationale: only the sub-second tool duration varies with scheduling.
[[assert.normalize_replace]]
pattern = "Took \\d+\\.\\ds"
with = "Took Ns"
reason = "The measured sub-second tool duration varies with scheduling; retain the label, units and surrounding cells."
