# Behavior family: fullscreen
# Surface: Pi 0.84.0 main-screen editor shrink after a multi-row edit.
# Upstream evidence: the isolated Pi 0.84.0 live probe removed all long editor
# rows and restored the settled LIVE-TOOL-DONE viewport after Ctrl-U.

name = "08-main-screen-editor-shrink"
description = "Shrinking a multi-row editor removes stale rows and restores Pi's transcript viewport."
covers = [
  "packages/tui/src/tui-main-screen.ts",
]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=../compaction/testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=../compaction/testdata/pi-agent", "PI_SKIP_VERSION_CHECK=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
# Fullscreen is the default TUI mode since Pi 1.0.0; this scenario covers the main-screen renderer.
pig_args = ["--no-extensions", "--session-dir", "sessions", "-c", "--tui-mode", "regular"]
pi_args = ["--session-dir", "sessions", "-c", "--tui-mode", "regular"]

[tmux]
width = 80
height = 12
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
cwd = "../compaction/testdata/compact-session"
capture_start = "LIVE-TOOL-DONE"
capture_end = "faux-1"

[[tmux.steps]]
keys = ["Run: tui live tool", "Enter"]
wait_contains = ["LIVE-TOOL-DONE"]
wait_timeout_seconds = 15

[[tmux.steps]]
keys = ["EDITOR-0001-"]
settle_seconds = 1

[[tmux.steps]]
keys = ["hex:15", "EDITOR-SHRUNK"]
settle_seconds = 1

[assert]
both_reach_ready = true
both_contain = ["LIVE-TOOL-DONE", "EDITOR-SHRUNK"]
both_not_contain = ["EDITOR-0001-", "Working...", "panic:", "goroutine "]
output_normalized_equal = true
runtime_ratio_max = 2.0
runs = 3

# The full footer remains compared; only the driver's length-preserving cwd identity substitution applies.
