# Behavior family: fullscreen
# Surface: alternate-screen viewport keyboard scrolling to the top (handleViewportInput, tui.altScreen.top = Ctrl+Home)
#
# After a short exchange and two 24-line streamed replies, Ctrl+Home scrolls the transcript to its start. The first
# exchange is only on screen at the top, so the crop from its question to a later stream line exists only if the
# binary scrolled up. The startup header above the question differs between pig and pi and is outside the crop; the
# 40-row terminal shows the question, its answer and the first stream lines below the longer header.
#
# Upstream evidence (pi 1.5.0 at the pin, bi-c5 probe): the scenario drives the pinned Pi and Pig with the same keys; the comparator below is the recorded expectation.
#

name = "17-keyboard-scroll-top-fullscreen"
description = "Fullscreen Ctrl+Home shows the start of the transcript, with the same rows below the startup header, in pig and pi."
covers = [
  "packages/tui/src/tui-alt-screen.ts",
]
tags = ["fast", "hermetic", "tui", "fullscreen"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent", "PI_SKIP_VERSION_CHECK=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]

[tmux]
width = 100
height = 40
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "What is 20+22?"
capture_end = "LIVE-STREAM-03"

[[tmux.steps]]
keys = ["What is 20+22?", "Enter"]
settle_seconds = 4
wait_contains = ["42"]
wait_timeout_seconds = 15

[[tmux.steps]]
keys = ["TUI_LIVE_STREAM", "Enter"]
settle_seconds = 3
wait_contains = ["LIVE-STREAM-24"]
wait_timeout_seconds = 15

[[tmux.steps]]
keys = ["TUI_LIVE_STREAM", "Enter"]
settle_seconds = 3
wait_timeout_seconds = 15

[[tmux.steps]]
keys = ["hex:1b 5b 31 3b 35 48"]
settle_seconds = 2

[assert]
both_reach_ready = true
both_not_contain = ["unknown command", "panic:", "goroutine "]
escaped_output_equal = true
runtime_ratio_max = 2.0
runs = 3
