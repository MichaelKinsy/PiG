# Pi print-mode.ts:50-63: SIGTERM/SIGHUP kill tracked children and run disposeRuntime (unsubscribe the JSON writer, then
# runtimeHost.dispose: session.abort(), session_shutdown and AgentSession.dispose; agent-session-runtime.ts:409-417, Pi
# main 7a53c310a), then process.exit(128+signum). dispose awaits the abort first, so the event loop turns while the Session
# is still connected: a bash tool that is running when the signal lands leaves stdout ending at its tool_execution_update
# (the writer is gone) and the session file at the toolUse assistant message, the tool result and the aborted assistant
# message; no second provider request starts. PiG used to stop the run at the tool.
# The probe compares event types, session record roles/stop reasons, request count, exit status and stderr.
# The *-shutdown cases add an extension whose session_shutdown handler throws at once or waits 1.5 s on a timer, in JSON
# and text mode, and compare exit status, stdout (events or text), stderr, session records and the provider request
# count. The run settles before the handler runs, so both handlers leave the same records and one request; a throwing
# handler reports its error before text mode prints the aborted result, a timer lets the result print while it waits.
name = "09-print-json-signal-during-tool"
description = "SIGTERM and SIGHUP during a tool stop output, persistence and the run where Pi does, with and without a session_shutdown handler"
covers = ["packages/coding-agent/src/modes/print-mode.ts"]
tags = ["hermetic", "fast"]
driver = "cli-mode"

[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
# The probe defaults to PIG_PARITY_PIG_BIN so it uses the verified harness build.
pig_args = ["python3", "test/parity/testdata/session-wire.py", "--case", "json-tool-term", "--case", "json-tool-hup", "--case", "json-tool-throwing-shutdown", "--case", "json-tool-slow-shutdown", "--case", "text-tool-throwing-shutdown", "--case", "text-tool-slow-shutdown"]
pi_args = ["python3", "test/parity/testdata/session-wire.py", "--bin", "extensions/sdk-ts/node_modules/.bin/pi", "--case", "json-tool-term", "--case", "json-tool-hup", "--case", "json-tool-throwing-shutdown", "--case", "json-tool-slow-shutdown", "--case", "text-tool-throwing-shutdown", "--case", "text-tool-slow-shutdown"]

[cli]
cwd = "../../../.."
timeout_seconds = 90

[assert]
exit_code = 0
output_equal = true
runs = 3
