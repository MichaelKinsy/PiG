# Behavior family: model-resolver-selector
# Surface: keys without a model-selector action reach the search input and reapply the query.
#
# Upstream evidence (Pi 0.87.1 model-selector.ts handleInput and filterModels):
# handleInput matches only tui.input.tab, tui.select.up, tui.select.down,
# tui.select.confirm, tui.select.cancel and app.models.save. Every other key,
# including PageDown and Left, goes to searchInput.handleInput and then
# filterModels(searchInput.getValue()). filterModels sets selectedIndex to 0
# whenever the query is non-empty, even when the key left the query unchanged.
# Exact Pi 0.87.1 re-probe (2026-09-29) with the local two-model fixture:
#   /model Enter, "model", Down  -> "Model Name: Model One"
#   PageDown                     -> "Model Name: Model Two" (query stays "model")
#   Down, Left                   -> "Model Name: Model Two"
# Pig previously moved the cursor ten rows on PageDown and skipped the refilter
# when the query did not change, so both waits below timed out on Pig.
# Pi 1.0.0 draws fullscreen by default (re-probed 2026-10-02, 100x35): the alternate screen
# binds PageDown to the viewport (tui.altScreen.pageDown, tui-alt-screen.ts:747) and consumes
# it before the model selector, so PageDown is no longer an unbound picker key. Right is
# unbound in both modes (it reaches searchInput as cursorRight and leaves the query unchanged),
# so it carries the same refilter contract: the selection returns to the first match.
# The last step pins the fullscreen PageDown contract itself. From "Model Name: Model One",
# PageDown then Down must wrap to model-two on Pi (the viewport took PageDown, already at the
# end, so the frame is unchanged). PiG previously handed PageDown to the selector, which
# refiltered to model-two, and Down then left model-one selected on the final frame.
# The first step waits for the background refresh, the settled state that
# re-anchors the selection on both sides (see 11-model-picker-arrow-wrap).

name = "22-model-picker-unbound-keys-refilter"
description = "Unbound picker keys reapply the query and select the first match."
covers = [
  "packages/coding-agent/src/modes/interactive/components/model-selector.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "$0.000"
ready_timeout_seconds = 15
capture_start = "Only showing models"
capture_end = "Model Name: Model Two"

[[tmux.steps]]
keys = ["/model", "Enter"]
wait_contains = ["Model Name: Model Two", "Model catalogs refreshed."]
wait_timeout_seconds = 10

[[tmux.steps]]
keys = ["model"]
wait_visible_contains = ["> model"]
wait_timeout_seconds = 5

[[tmux.steps]]
keys = ["Down"]
wait_visible_contains = ["Model Name: Model One"]
wait_timeout_seconds = 5

[[tmux.steps]]
keys = ["Right"]
wait_visible_contains = ["→ ✓ model-two [fixture]", "Model Name: Model Two"]
wait_timeout_seconds = 5

[[tmux.steps]]
keys = ["Down"]
wait_visible_contains = ["Model Name: Model One"]
wait_timeout_seconds = 5

[[tmux.steps]]
keys = ["Left"]
wait_visible_contains = ["→ ✓ model-two [fixture]", "Model Name: Model Two"]
wait_timeout_seconds = 5

[[tmux.steps]]
keys = ["Down"]
wait_visible_contains = ["Model Name: Model One"]
wait_timeout_seconds = 5

[[tmux.steps]]
keys = ["PgDn", "Down"]
wait_visible_contains = ["→ ✓ model-two [fixture]", "Model Name: Model Two"]
wait_stable_milliseconds = 500
wait_timeout_seconds = 5
settle_seconds = 1

[env]
pig = ["PIG_CODING_AGENT_DIR=../model-resolver-selector/testdata/pig-agent-local"]
pi = ["PI_CODING_AGENT_DIR=../model-resolver-selector/testdata/pi-agent-local"]
pig_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_contain = [
  "> model",
  "→ ✓ model-two [fixture]",
  "Model Name: Model Two",
]
both_not_contain = ["panic:", "goroutine ", "Could not refresh", "→   model-one"]
output_equal = true
escaped_output_equal = true
runs = 3
