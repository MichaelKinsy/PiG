# Behavior family: model-resolver-selector
# Surface: keys without a model-selector action reach the search input; a key that leaves the query unchanged keeps the selection.
# File name kept as 22-model-picker-unbound-keys-refilter.toml for ledger/coverage stability; behavior now verifies unchanged-query keys keep selection (Pi 5bcf370a5).
#
# Upstream evidence (Pi 5bcf370a5, #12334, carried by the oracle: automation/gen/pi-post-release-backports.mjs): handleInput matches only
# tui.input.tab, tui.select.up, tui.select.down, the selection page keys, tui.select.confirm, tui.select.cancel and app.models.save in that
# order. Every other key, including Left and Right, goes to searchInput.handleInput, and filterModels runs only when the query text changed.
# The pinned release (cead615b) ran filterModels after every such key and set selectedIndex to 0 for a non-empty query.
# With the local two-model fixture:
#   /model Enter, "model", Down  -> "Model Name: Model One"
#   Right, Left                  -> still "Model Name: Model One" (frame_watch forbids "Model Name: Model Two" on both steps)
# Pi e7a0df27 (#7629) handles tui.select.pageUp and tui.select.pageDown in the model selector, so PageDown
# is no longer an unbound picker key: it moves the selection one page, clamped to the last row, and the
# fullscreen viewport leaves it to the focused picker (24-fullscreen-model-picker-page-keys-reach-selector).
# The last step pins the page key contract: from "Model Name: Model One", the last of two rows, PageDown
# stays on the last row and Down then wraps to model-two.
# The first step waits for the background refresh, the settled state that
# re-anchors the selection on both sides (see 11-model-picker-arrow-wrap).

name = "22-model-picker-unbound-keys-refilter"
description = "Unbound picker keys that leave the query unchanged keep the selection."
covers = [
  "packages/coding-agent/src/modes/interactive/components/model-selector.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "$0.000"
ready_timeout_seconds = 15
capture_start = "Only showing models"
capture_end = "Model Name: Model Two"

[[tmux.steps]]
keys = ["/model", "Enter"]
wait_contains = ["Model Name: Model Two", "Model catalogs refreshed."]
wait_timeout_seconds = 10

[[tmux.steps]]
keys = ["model"]
wait_visible_contains = ["> model"]
wait_timeout_seconds = 5

[[tmux.steps]]
keys = ["Down"]
wait_visible_contains = ["Model Name: Model One"]
wait_timeout_seconds = 5

[[tmux.steps]]
keys = ["Right"]
wait_stable_milliseconds = 500
wait_timeout_seconds = 5
[tmux.steps.frame_watch]
stale_contains = ["Model Name: Model Two"]
min_samples = 10

[[tmux.steps]]
keys = ["Left"]
wait_stable_milliseconds = 500
wait_timeout_seconds = 5
[tmux.steps.frame_watch]
stale_contains = ["Model Name: Model Two"]
min_samples = 10

[[tmux.steps]]
keys = ["PgDn", "Down"]
wait_visible_contains = ["→ ✓ model-two [fixture]", "Model Name: Model Two"]
wait_stable_milliseconds = 500
wait_timeout_seconds = 5
settle_seconds = 1

[env]
pig = ["PIG_CODING_AGENT_DIR=../model-resolver-selector/testdata/pig-agent-local"]
pi = ["PI_CODING_AGENT_DIR=../model-resolver-selector/testdata/pi-agent-local"]
pig_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_contain = [
  "> model",
  "→ ✓ model-two [fixture]",
  "Model Name: Model Two",
]
both_not_contain = ["panic:", "goroutine ", "Could not refresh", "→   model-one"]
output_equal = true
escaped_output_equal = true
pig_no_stale_frames = true
runs = 3
