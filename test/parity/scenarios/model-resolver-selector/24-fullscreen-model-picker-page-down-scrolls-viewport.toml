# Behavior family: model-resolver-selector
# Surface: in fullscreen, PageDown reaches the open model picker and pages its selection, not the transcript viewport.
#
# Upstream evidence (Pi e7a0df27, "fix(tui,coding-agent): handle selection page keys in all scrolling lists",
# #7629): ModelSelectorComponent sets capturesViewportInput, and tui-alt-screen.ts shouldDeferViewportInput
# leaves the viewport keys to a focused component that sets it. model-selector.ts handleInput matches
# tui.select.pageUp/pageDown through getSelectPageIndex and moves the selection by one page, clamped to the
# list, without reapplying the query.
# With the local two-model fixture:
#   /model Enter, "model", Down -> "Model Name: Model One" (the last of two rows)
#   PageDown                    -> still "Model Name: Model One" (clamped to the last row)
# The first step waits for the background refresh, the settled state that
# re-anchors the selection on both sides (see 11-model-picker-arrow-wrap).

name = "24-fullscreen-model-picker-page-down-scrolls-viewport"
description = "Fullscreen PageDown pages the model picker selection, clamped to the last row."
covers = [
  "packages/coding-agent/src/modes/interactive/components/model-selector.ts",
  "packages/tui/src/tui-alt-screen.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "$0.000"
ready_timeout_seconds = 15
capture_start = "Only showing models"
capture_end = "Model Name: Model One"

[[tmux.steps]]
keys = ["/model", "Enter"]
wait_visible_contains = ["Model Name: Model Two", "Model catalogs refreshed."]
wait_timeout_seconds = 10

[[tmux.steps]]
keys = ["model"]
wait_visible_contains = ["> model"]
wait_timeout_seconds = 5

[[tmux.steps]]
keys = ["Down"]
wait_visible_contains = ["Model Name: Model One"]
wait_timeout_seconds = 5

[[tmux.steps]]
keys = ["PgDn"]
wait_visible_contains = ["→   model-one [fixture]", "Model Name: Model One"]
wait_timeout_seconds = 5
settle_seconds = 1

[env]
pig = ["PIG_CODING_AGENT_DIR=../model-resolver-selector/testdata/pig-agent-local"]
pi = ["PI_CODING_AGENT_DIR=../model-resolver-selector/testdata/pi-agent-local"]
pig_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_contain = [
  "> model",
  "→   model-one [fixture]",
  "Model Name: Model One",
]
both_not_contain = ["panic:", "goroutine ", "Could not refresh", "→ ✓ model-two"]
output_equal = true
escaped_output_equal = true
runs = 3
