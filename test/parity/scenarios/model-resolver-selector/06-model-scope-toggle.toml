# Behavior family: model-resolver-selector
# Surface: Tab toggles /model from a one-model scoped view to all models.
#
# Upstream evidence: exact Pi 0.87.1 re-probe (2026-09-23, tmux 100×35):
#   PI_CODING_AGENT_DIR=testdata/pi-agent-local pi --no-extensions --offline
#     --models fixture/model-two
#   keys: /model Enter, Tab
#   crop: "Scope:" through "Model Name: Model Two"
#
#   Scope: all | scoped
#   tab scope (all/scoped)
#
#   >
#
#   → ✓ model-two [fixture]
#       model-one [fixture]
#
#     Model Name: Model Two
#
# The final all view must add model-one while retaining model-two as the current
# first row. Equality covers the key hint, scope transition, order, and marker.

name = "06-model-scope-toggle"
description = "Tab toggles both binaries from the scoped model to the full local catalog."
covers = [
  "packages/coding-agent/src/cli/args.ts",
  "packages/coding-agent/src/core/model-resolver.ts",
  "packages/coding-agent/src/modes/interactive/components/model-selector.ts",
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "$0.000"
ready_timeout_seconds = 20
capture_start = "Scope:"
capture_end = "Model Name: Model Two"

[[tmux.steps]]
keys = ["/model", "Enter"]
wait_contains = ["Scope:"]
wait_timeout_seconds = 5
settle_seconds = 1

[[tmux.steps]]
keys = ["\t"]
settle_seconds = 1

[env]
pig = ["PIG_CODING_AGENT_DIR=../model-resolver-selector/testdata/pig-agent-local"]
pi = ["PI_CODING_AGENT_DIR=../model-resolver-selector/testdata/pi-agent-local"]
pig_args = ["--no-extensions", "--offline", "--models", "fixture/model-two", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--no-extensions", "--offline", "--models", "fixture/model-two", "--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_contain = [
  "Scope:",
  "tab scope (all/scoped)",
  "→ ✓ model-two [fixture]",
  "model-one [fixture]",
  "Model Name: Model Two",
]
both_not_contain = ["panic:", "goroutine ", "No matching models"]
output_equal = true
runtime_ratio_max = 1.30
runs = 3
