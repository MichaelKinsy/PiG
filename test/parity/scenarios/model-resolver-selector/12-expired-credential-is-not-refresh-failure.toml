# Behavior family: model-resolver-selector
# Surface: picker refresh status is based on the refresh result, never OAuth
# credential expiry alone.
#
# Upstream evidence (Pi 0.83.0): with an expired cached github-copilot OAuth
# credential and --offline, opening /model uses the cached model snapshot and
# renders the unmatched query without `Could not refresh github-copilot`.
# GitHub Copilot has no refreshModels callback in 0.83.0, and OAuth expiry alone
# is not a model-catalog error. Pig previously fabricated that warning solely
# from `expires`, even though its registry refresh only reloaded local config.

name = "12-expired-credential-is-not-refresh-failure"
description = "Expired OAuth alone does not fabricate a model catalog refresh warning"
covers = [
  "packages/coding-agent/src/modes/interactive/components/model-selector.ts",
  "packages/coding-agent/src/core/model-runtime.ts",
  "packages/ai/src/models.ts",
]
tags = ["fast", "hermetic", "tui", "fixture-auth"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 20
keys = ["/model nonexistent/fake-model-xyz", "Enter"]
settle_seconds = 2
capture_start = "Only showing models"
capture_end = "No matching models"

[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/pig-agent-expired", "PI_OFFLINE=1"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent-expired", "PI_SKIP_VERSION_CHECK=1", "PI_OFFLINE=1"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_contain = ["Only showing models", "No matching models"]
both_not_contain = ["Could not refresh github-copilot", "panic:", "goroutine "]
output_equal = true
runs = 3
