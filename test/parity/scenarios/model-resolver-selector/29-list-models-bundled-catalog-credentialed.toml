# Behavior family: model-resolver-selector
# Surface: --list-models prints the complete bundled catalog of every credentialed built-in provider (issue #260).
#
# Upstream rule: cli/list-models.ts lists modelRuntime.getAvailable(); a built-in provider is available when it
# has a credential, and its models are the bundled catalog (packages/ai generated model data) plus the remote
# catalog overlay (remote-catalog-provider.ts). --offline skips the overlay, so this scenario pins the bundled
# catalog only: a drifted generated catalog, a missing or extra model, a changed context window, max-output,
# thinking or image column, or a changed sort order fails the byte comparison of the whole listing.
#
# The credential is an env API key for each non-OpenRouter built-in provider with an API-key env var, so
# nothing is read from a real account. OpenRouter is left without a key: Pig lists the :nitro and :floor
# routing variants beside every OpenRouter model (D199, docs/parity/DIVERGENCES.md), which Pi never lists.
#
# What this scenario cannot pin: models that Pi's remote catalog at https://pi.dev adds after
# `pi update --models`. Pig reads the same route from https://pi-in-go.dev (D64), which must serve
# /api/models/providers/<provider> for the refresh to add them; that is a hosted-service contract, not an
# offline CLI behavior.
name = "29-list-models-bundled-catalog-credentialed"
description = "Both binaries list the same full bundled catalog for every credentialed non-OpenRouter built-in provider."
covers = [
  "packages/coding-agent/src/cli/list-models.ts",
  "packages/coding-agent/src/core/model-runtime.ts",
  "packages/coding-agent/src/core/remote-catalog-provider.ts",
]
tags = ["fast", "hermetic"]
driver = "cli-mode"

[cli]
args = ["--list-models"]
timeout_seconds = 30

[env]
pig = [
  "PIG_CODING_AGENT_DIR=../model-resolver-selector/testdata/pig-agent",
  "ANTHROPIC_API_KEY=fixture-key", "OPENAI_API_KEY=fixture-key", "GEMINI_API_KEY=fixture-key",
  "MISTRAL_API_KEY=fixture-key", "GROQ_API_KEY=fixture-key", "XAI_API_KEY=fixture-key",
  "DEEPSEEK_API_KEY=fixture-key", "CEREBRAS_API_KEY=fixture-key", "FIREWORKS_API_KEY=fixture-key",
  "TOGETHER_API_KEY=fixture-key",
]
pi = [
  "PI_CODING_AGENT_DIR=../model-resolver-selector/testdata/pi-agent",
  "ANTHROPIC_API_KEY=fixture-key", "OPENAI_API_KEY=fixture-key", "GEMINI_API_KEY=fixture-key",
  "MISTRAL_API_KEY=fixture-key", "GROQ_API_KEY=fixture-key", "XAI_API_KEY=fixture-key",
  "DEEPSEEK_API_KEY=fixture-key", "CEREBRAS_API_KEY=fixture-key", "FIREWORKS_API_KEY=fixture-key",
  "TOGETHER_API_KEY=fixture-key",
]
pig_args = ["--no-extensions", "--offline"]
pi_args = ["--no-extensions", "--offline"]

[assert]
output_equal = true
both_contain = ["anthropic", "openai", "google", "mistral", "fireworks"]
both_not_contain = ["openrouter", "panic:", "goroutine ", "Warning:"]
runtime_ratio_max = 2.0
runs = 3

# normalize-rationale: Pi 2e0f175b (D217) is carried past the pin, so PiG's catalog has no realtime or image chat models. The pinned Pi still lists these rows; every other row is still compared.
[[assert.normalize_replace]]
pattern = '(?m)^(?:azure|openai) +gpt-realtime-2\.1 .*\n'
with = ""
reason = "D217: Pi 2e0f175b is carried past the pin; gpt-realtime-2.1 is no longer a chat model."

[[assert.normalize_replace]]
pattern = '(?m)^(?:google|google-vertex) +gemini-3\.1-flash-(?:lite-image|live-preview) .*\n'
with = ""
reason = "D217: Pi 2e0f175b is carried past the pin; gemini-3.1-flash-lite-image and gemini-3.1-flash-live-preview are no longer chat models."
