# Upstream evidence: Pi 0.87.1 theme.ts:634-642 parses decimal prefixes in COLORFGBG.
# With no tmux window-style background, OSC 11 has no answer and the env wins.
# Probe: real Pi, screen-256color, no COLORTERM, COLORFGBG=0;15suffix.
# The rightmost decimal prefix selects light, not the preceding black index.
# Crop includes persisted user backgrounds, thinking and assistant foregrounds.
name = "35-stock-colorfgbg-prefix"
description = "COLORFGBG decimal-prefix fallback selects the same light theme as Pi."
covers = [
  "packages/coding-agent/src/modes/interactive/theme/theme-controller.ts",
  "packages/coding-agent/src/modes/interactive/theme/theme.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=testdata/stock-color-agent", "TERM=screen-256color", "COLORTERM=", "COLORFGBG=0;15suffix"]
pi = ["PI_CODING_AGENT_DIR=testdata/stock-color-agent", "PI_SKIP_VERSION_CHECK=1", "TERM=screen-256color", "COLORTERM=", "COLORFGBG=0;15suffix"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions", "--session-dir", "sessions", "-c"]
pi_args = ["--session-dir", "sessions", "-c"]

[tmux]
width = 100
height = 35
ready_pattern_pig = "Resume marker end"
ready_pattern_pi = "Resume marker end"
ready_timeout_seconds = 30
cwd = "testdata/thinking-cwd"
capture_start = "Pick a color"
capture_end = "Resume marker end"

[assert]
both_reach_ready = true
both_contain = ["Resumed reasoning alpha", "Resumed answer charlie", "Resume marker end"]
escaped_output_equal = true
runs = 3
