# Behavior family: interactive-rendering
# Surface: Mermaid diagrams in assistant markdown (mermaid.ts transformer +
# markdown-transform.ts application + grok-mermaid render engine). The faux
# provider returns a ```mermaid flowchart block; pi and pig both replace it with
# the same Unicode box-drawing diagram in the interactive TUI.
#
# Upstream evidence (pi v0.84.0):
#   createMermaidMarkdownTransformer (mermaid.ts) lexes the assistant markdown,
#   finds the ```mermaid code token, calls grok-mermaid render(), and rewrites it
#   into codeSpan lines. The asserted crop contains the rendered node labels
#   ("Start"/"End") and box-drawing glyphs, exercising the transformer, the
#   markdown-transform application seam, and the render engine: not just startup.
#
#   ANSI is stripped by output_normalized_equal, so pig's theme colours and pi's
#   differ harmlessly; the plain box-drawing art is byte-identical because pig's
#   engine is a faithful port of the same grok-mermaid@0.2.2 pi bundles. The
#   internal/mermaid engine differential (71 sources) and the internal/codingagent
#   transformer differential (29 cases vs pi's real transformer) prove the
#   byte-faithfulness broadly; this scenario proves the same rendering fires in a
#   live interactive session identically to pi.

name = "19-mermaid-diagram-rendering"
description = "Assistant message renders a ```mermaid flowchart as Unicode box-drawing, matching upstream."
covers = [
  "packages/coding-agent/src/modes/interactive/components/mermaid.ts",
  "packages/coding-agent/src/modes/interactive/components/markdown-transform.ts",
  "packages/coding-agent/src/modes/interactive/components/assistant-message.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent", "PI_SKIP_VERSION_CHECK=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "show mermaid flowchart"
capture_end = "End"

[[tmux.steps]]
keys = ["show mermaid flowchart", "Enter"]
settle_seconds = 4
wait_contains = ["Start", "End"]
wait_timeout_seconds = 10

[assert]
both_reach_ready = true
both_not_contain = ["unknown command", "panic:", "goroutine ", "```mermaid", "graph TD"]
output_normalized_equal = true
runtime_ratio_max = 2.0
runs = 1
