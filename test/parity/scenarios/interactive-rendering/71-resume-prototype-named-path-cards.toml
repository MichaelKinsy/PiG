# Behavior family: interactive-rendering
# Surface: the same fallbacks as 70-prototype-named-path-cards, drawn from stored entries when a session is reopened.
#
# The session file holds one assistant message that wrote out.constructor and Constructor.CONSTRUCTOR, read notes.constructor and x.__proto__ (through
# file_path), and wrote and read control.ts. Reopened with -c and expanded with ctrl+o, Pi draws the write calls of the first two paths as the call fallback
# and the reads of the next two as the result fallback, and the control cards as themselves (pi 1.5.2 at b4afdddf, `--continue` twice after the live turns of
# scenario 70's probe: the same cards at every open, the session continues, exports and compacts).

name = "71-resume-prototype-named-path-cards"
description = "Reopened write and read cards of paths whose extension is `constructor` or `__proto__` draw Pi's fallbacks from the stored entries."
covers = [
  "packages/coding-agent/src/modes/interactive/components/tool-execution.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent", "PI_SKIP_VERSION_CHECK=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions", "--session-dir", "sessions", "-c"]
pi_args = ["--session-dir", "sessions", "-c"]

[tmux]
width = 100
height = 60
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
cwd = "testdata/prototype-path-resume-cwd"
capture_start = "Prototype path redraw start"
capture_end = "Prototype path redraw end"

[[tmux.steps]]
keys = ["C-o"]
settle_seconds = 1
wait_contains = ["path: out.constructor", "path: Constructor.CONSTRUCTOR", "write control.ts"]
wait_timeout_seconds = 15

[assert]
both_reach_ready = true
escaped_output_equal = true
both_contain = ["path: out.constructor", "path: Constructor.CONSTRUCTOR", "read notes.constructor", "read x.__proto__", "proto line", "write control.ts", "read control.ts"]
both_not_contain = ["panic:", "goroutine ", "TypeError", "write out.constructor", "Successfully wrote"]
runs = 3
