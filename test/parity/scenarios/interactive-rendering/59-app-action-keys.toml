# Behavior family: interactive-rendering
# Surface: InteractiveMode.setupKeyHandlers (interactive-mode.ts:3047-3115): the app actions no other scenario presses.
#
# Upstream (Pi 1.5.0): setupKeyHandlers registers app.thinking.toggle, app.thinking.cycle, app.tools.expand, app.model.select and the four
# app.session.* actions on the default editor, and onEscape arms the double-Escape action on an empty editor. keybindings.json remaps the session
# actions (which have no default key) to F5-F8. Each step waits for the action's own effect, so a binary that does not run the handler never
# reaches the final frame; the comparator then compares the complete final frame of the session tree both binaries show.

name = "59-app-action-keys"
description = "Remapped session keys, thinking and tool toggles, the model selector key and the double Escape reach the same handlers in both binaries."
covers = [
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=testdata/pig-agent-app-keys"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent-app-keys", "PI_SKIP_VERSION_CHECK=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions", "--tui-mode", "regular"]
pi_args = ["--session-dir", "{{TEMP}}/sessions", "--tui-mode", "regular"]

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "Session Tree"
capture_end = ""

[[tmux.steps]]
keys = ["reply with exactly: alpha", "Enter"]
wait_contains = ["alpha"]
wait_timeout_seconds = 15

[[tmux.steps]]
keys = ["C-t"]
wait_contains = ["Thinking blocks: hidden"]
wait_timeout_seconds = 10

[[tmux.steps]]
keys = ["C-t"]
wait_contains = ["Thinking blocks: visible"]
wait_timeout_seconds = 10

[[tmux.steps]]
keys = ["C-o"]
wait_contains = ["Tool output: expanded"]
wait_timeout_seconds = 10

[[tmux.steps]]
keys = ["F7"]
wait_contains = ["Fork from Message"]
wait_timeout_seconds = 10

[[tmux.steps]]
keys = ["Escape"]
wait_not_contains = ["Fork from Message"]
wait_timeout_seconds = 10

[[tmux.steps]]
keys = ["F8"]
wait_contains = ["Resume Session"]
wait_timeout_seconds = 10

[[tmux.steps]]
keys = ["Escape"]
wait_not_contains = ["Resume Session"]
wait_timeout_seconds = 10

[[tmux.steps]]
keys = ["F6"]
wait_contains = ["Session Tree"]
wait_timeout_seconds = 10

[[tmux.steps]]
keys = ["Escape"]
wait_not_contains = ["Session Tree"]
wait_timeout_seconds = 10

[[tmux.steps]]
keys = ["Escape", "Escape"]
wait_contains = ["Session Tree"]
wait_timeout_seconds = 10

[assert]
both_reach_ready = true
both_contain = ["Session Tree"]
both_not_contain = ["panic:", "goroutine "]
escaped_output_equal = true
runs = 3
