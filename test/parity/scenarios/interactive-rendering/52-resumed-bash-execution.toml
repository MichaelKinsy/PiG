# Behavior family: interactive-rendering
# Surface: a resumed session draws each persisted bashExecution message as a completed BashExecutionComponent.
#
# Upstream evidence (pinned Pi 1.0.3, 2026-10-07, parity-runner tmux probe with the dark theme, --session on testdata/resumed-bash-cwd/sessions/resumed-bash.jsonl):
# Rows below are the escaped crop, ESC shown as \e, a run of ─ as <border>.
#
#   $ echo ok\e[0m
#
#    \e[38;2;157;165;169mok\e[39m
#
#   \e[38;2;94;178;134m<border>
#   …
#    \e[38;2;205;154;34mOutput truncated. Full output: /tmp/pi-bash-0123456789abcdef.log\e[39m
#   \e[38;2;94;178;134m<border>
#
#   \e[38;2;126;136;142m<border>
#   \e[39m \e[1m\e[38;2;94;178;134m$ echo hidden\e[0m
#
# Upstream rule: renderSessionEntries (interactive-mode.ts:4053) passes every bashExecution message, a `!!` one included, to addMessageToChat, whose case "bashExecution" (:3847-3859) builds BashExecutionComponent(command, ui, excludeFromContext), appends a non-empty output, and calls setComplete(exitCode, cancelled, truncated ? {truncated} : undefined, fullOutputPath). A `!!` block keeps its dim borders and, after setComplete's updateDisplay, a bashMode header.
# The fixture covers success, a non-zero exit, a cancelled command, truncated output with its full-output path, and two `!!` commands (one non-zero).
# Red: PiG at main 50e81255d and with only the block port drew no block, only the trailing user message. Green with the shared renderSessionEntryList case.

name = "52-resumed-bash-execution"
description = "A resumed session draws each persisted ! and !! command as Pi's bash block: success, non-zero exit, cancelled, truncated with its full-output path, and excluded from context."
covers = [
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
  "packages/coding-agent/src/modes/interactive/components/bash-execution.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent", "PI_SKIP_VERSION_CHECK=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions", "--session", "sessions/resumed-bash.jsonl"]
pi_args = ["--session-dir", "{{TEMP}}/sessions", "--session", "sessions/resumed-bash.jsonl"]

[tmux]
width = 100
height = 60
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
cwd = "testdata/resumed-bash-cwd"
capture_start = "$ "
capture_end = "resume-end"
settle_seconds = 1

[assert]
both_reach_ready = true
both_contain = ["$ echo ok", "(exit 3)", "(cancelled)", "Output truncated. Full output: /tmp/pi-bash-0123456789abcdef.log", "$ cat missing", "(exit 1)", "resume-end"]
both_not_contain = ["panic:", "goroutine "]
escaped_output_equal = true
runs = 3
