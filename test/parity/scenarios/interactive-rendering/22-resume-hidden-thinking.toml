# Behavior family: interactive-rendering
# Surface: AssistantMessageComponent thinking blocks rendered from persisted
#          session content when resuming with hideThinkingBlock=true.
#
# Upstream evidence (pi v0.87.1, tmux 100x35 probe):
#   Session fixture: testdata/thinking-cwd/sessions/...jsonl (shared with 21)
#   Agent dirs: testdata/p{i,ig}-agent-hide-thinking (hideThinkingBlock: true)
#   (user + assistant[thinking "  alpha  ", thinking "bravo\n", text charlie,
#    thinking delta, thinking "   "] + user end marker)
#   pi -e test-faux-provider.ts --model test-faux/faux-1 --session-dir sessions -c
#   crop: capture_start="Pick a color", capture_end="Resume marker end"
#   raw cropped upstream block (normalized; pi 0.87.1, 2026-09-25):
#
#     Pick a color
#
#
#      Thinking...
#
#      Resumed answer charlie
#      Thinking...
#
#
#      Resume marker end
#
# Pre-fix pig (main 2056d20ef) rendered no "Thinking..." label at all: the
# hidden thinking runs vanished along with their content.
#
# Root cause: the resume/rebuild renderer read the runtime-only
# AssistantMessage.Thinking accumulator, which is not serialized, so every
# thinking block vanished from a resumed, /tree-navigated, forked, or
# compacted chat. It now renders the persisted content blocks in order.

name = "22-resume-hidden-thinking"
description = "Resumed assistant thinking honors hideThinkingBlock: one hidden label per thinking run, answer text intact."
covers = [
  "packages/coding-agent/src/modes/interactive/components/assistant-message.ts",
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=testdata/pig-agent-hide-thinking"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent-hide-thinking", "PI_SKIP_VERSION_CHECK=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions", "--session-dir", "sessions", "-c"]
pi_args = ["--session-dir", "sessions", "-c"]

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
cwd = "testdata/thinking-cwd"
capture_start = "Pick a color"
capture_end = "Resume marker end"

[assert]
both_reach_ready = true
both_not_contain = ["panic:", "goroutine ", "unknown command", "Resumed reasoning"]
both_contain = ["Thinking...", "Resumed answer charlie"]
escaped_output_equal = true
runtime_ratio_max = 2.0
runs = 3
