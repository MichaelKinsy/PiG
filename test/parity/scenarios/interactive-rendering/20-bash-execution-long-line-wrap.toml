# Behavior family: interactive-rendering
# Surface: BashExecutionComponent wraps one long logical line and applies its collapsed limit to visual rows.
#
# Upstream evidence (pinned Pi v0.84.0, manual 40x35 tmux probe):
#
#     $ printf '%0900dTAIL\n' 0
#     00000000000000000000000000000000000000
#     ...
#     00000000000000000000000000TAIL
#
# The 901-column output is one logical line. Pi wraps it through Text, keeps the final 20 visual rows in collapsed mode, and retains the right-side TAIL marker. Horizontal clipping would show an ellipsis and lose that marker from the body.

name = "20-bash-execution-long-line-wrap"
description = "A long Bash output line wraps, and the collapsed preview retains its last 20 visual rows."
covers = [
  "packages/coding-agent/src/modes/interactive/components/bash-execution.ts",
  "packages/coding-agent/src/modes/interactive/components/visual-truncate.ts",
  "packages/tui/src/components/text.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent", "PI_SKIP_VERSION_CHECK=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]

[tmux]
width = 40
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
cwd = "testdata/bash-wrap-cwd"
capture_start = "$ printf '%0900dTAIL\\n' 0"
capture_end_regex = '─{35,}'

[[tmux.steps]]
keys = ["!printf '%0900dTAIL\\n' 0", "Enter"]
wait_contains = ["$ printf '%0900dTAIL\\n' 0", "TAIL"]
wait_timeout_seconds = 10
settle_seconds = 1

[assert]
both_reach_ready = true
both_not_contain = ["…", "panic:", "goroutine "]
both_match_regex = ['0{10,}TAIL']
output_normalized_equal = true
runtime_ratio_max = 2.0
runs = 3
