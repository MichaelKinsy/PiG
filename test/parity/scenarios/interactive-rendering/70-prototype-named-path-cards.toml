# Behavior family: interactive-rendering
# Surface: the built-in write and read cards of a path whose extension is a member name of Object.prototype.
#
# theme.ts getLanguageFromPath (:993-1062) looks the lowercased extension up in a plain object, so `constructor` (and `__proto__`) finds a member inherited
# from Object.prototype. The value is truthy: write.ts renderCall (:123-127) and read.ts formatReadResult (:124-125) pass it to highlightCode, whose
# supportsLanguage check (:937) throws a TypeError before the try at :949. updateDisplay (tool-execution.ts:303-312, :324-341) catches it and draws the call
# fallback (formatToolCallWithArgs) for write and the result fallback for read.
#
# pig divergence (D645): PiG's extension table is a Go map with no inherited members, so such a path is a file with no known language, and PiG draws the
# write card and the read card themselves, with plain text.
#
# Upstream evidence (pi 1.5.2 at b4afdddf, the bundle, Node 24.22.2, 100x50 tmux, three runs, 2026-11-13):
#   cwd holds notes.constructor = "alpha line\n\tbeta tabbed\ngamma line\n\n"
#   send: Run: ext tool write {"path":"out.constructor","content":"const x = 1;\n\tlet y = 2;\n"}
#   send: Run: ext tool read {"path":"notes.constructor"}
#   send: ctrl+o
#   plain text of the two cards:
#
#     write
#       path: out.constructor
#       content: const x = 1;
#            let y = 2;
#
#     read notes.constructor
#     alpha line
#        beta tabbed
#     gamma line
#
# PiG draws `write out.constructor`, a blank row and the two content rows, and a blank row between the read header and the output. That is what both sides
# draw for `out.unknownext` and `notes.unknownext`, which scenario 74-unknown-extension-path-cards requires to be equal byte for byte. Both turns end, the
# result reaches the model (the faux provider echoes it as `ext-tool-done: ...`) and the interface stays usable on both sides.
#
# The tools are expanded (ctrl+o) before the turns, so each card is drawn expanded when its turn ends and every wait is on text that both sides print.
#
# Crop: the capture runs from the first prompt (`Run: ext tool write`) to the faux provider's echo of the read result (`ext-tool-done: alpha line`). It holds
# both prompts, both expanded cards and both echoes. The startup header above it and the editor and footer below it belong to other scenarios and are not
# claimed here.
#
# lint-known-gap: no equality comparator, because the two captures differ by design under divergence D645 (Pi draws its fallbacks, PiG draws the cards);
# the assertions state each side's rows. The Go oracle test TestCardsOfAPathNamedLikeAnObjectPrototypeMemberAgainstPi compares every row of both sides.

name = "70-prototype-named-path-cards"
description = "A write and a read of a path whose extension is `constructor`: PiG draws the write and read cards, Pi draws its call and result fallbacks."
covers = [
  "packages/coding-agent/src/modes/interactive/components/tool-execution.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent", "PI_SKIP_VERSION_CHECK=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]

[tmux]
width = 100
height = 45
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
# Each binary writes out.constructor into its own copy of the directory.
cwd = "testdata/prototype-path-cwd"
capture_start = "Run: ext tool write"
capture_end = "ext-tool-done: alpha line"

[[tmux.steps]]
keys = ["C-o"]
settle_seconds = 1

[[tmux.steps]]
keys = ['Run: ext tool write {"path":"out.constructor","content":"const x = 1;\n\tlet y = 2;\n"}', "Enter"]
settle_seconds = 1
wait_contains = ["ext-tool-done: Successfully wrote to out.constructor"]
wait_timeout_seconds = 20

[[tmux.steps]]
keys = ['Run: ext tool read {"path":"notes.constructor"}', "Enter"]
settle_seconds = 1
wait_contains = ["ext-tool-done: alpha line"]
wait_timeout_seconds = 20

[assert]
both_reach_ready = true
both_contain = ["read notes.constructor", "beta tabbed", "ext-tool-done: Successfully wrote to out.constructor"]
both_not_contain = ["panic:", "goroutine ", "TypeError"]
pig_contains = ["write out.constructor"]
pig_not_contain = ["path: out.constructor", "content: const x = 1;"]
pi_contains = ["path: out.constructor", "content: const x = 1;"]
pi_not_contain = ["write out.constructor"]
runs = 3

[diverge]
pig_contains = ["write out.constructor"]
pi_contains = ["path: out.constructor"]
reason = "D645 SCRUTINIZED:approved. Pi looks the file extension up in a plain object, finds a member inherited from Object.prototype for `constructor` and `__proto__`, its highlighter throws and the card falls back to the generic call and result rows; PiG's Go map has no such entry, so the path is a file with no known language and PiG draws the write and read cards themselves."
