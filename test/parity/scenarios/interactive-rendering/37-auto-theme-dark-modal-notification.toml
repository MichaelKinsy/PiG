# Upstream evidence: Pi 0.87.1 theme-controller.ts:159-173 follows CSI ? 997 reports only for a theme pair.
# tui.ts:1006-1012 consumes reports before listeners and focused settings components.
# Probe: real Pi under tmux, white background, light/dark setting, resumed transcript.
# Send a dark notification while /settings owns focus, then close settings and compare
# the escaped conversation, including user backgrounds and thinking foregrounds.
name = "37-auto-theme-dark-modal-notification"
description = "An automatic theme follows a dark-scheme report while settings owns focus."
covers = [
  "packages/coding-agent/src/modes/interactive/theme/theme-controller.ts",
  "packages/tui/src/terminal-colors.ts",
]
# Serial: the initial detection uses Pi's fixed 100 ms terminal deadline.
tags = ["fast", "hermetic", "tui", "serial"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=testdata/auto-color-agent", "TERM=tmux-256color", "COLORTERM=truecolor", "COLORFGBG=0;15"]
pi = ["PI_CODING_AGENT_DIR=testdata/auto-color-agent", "PI_SKIP_VERSION_CHECK=1", "TERM=tmux-256color", "COLORTERM=truecolor", "COLORFGBG=0;15"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions", "--session-dir", "sessions", "-c"]
pi_args = ["--session-dir", "sessions", "-c"]

[tmux]
width = 100
height = 35
# Settings grows beyond the viewport; Pi's main screen retains the user row in scrollback after it closes.
# Capture the complete retained conversation, not a viewport tail missing the opening user background.
capture_history = true
window_style = "bg=white"
ready_pattern_pig = "Resume marker end"
ready_pattern_pi = "Resume marker end"
ready_timeout_seconds = 30
cwd = "testdata/thinking-cwd"
capture_start = "Pick a color"
capture_end = "Resume marker end"

[[tmux.steps]]
keys = ["/settings", "Enter"]
wait_visible_contains = ["Type to search · Enter/Space to change · Esc to cancel"]

[[tmux.steps]]
keys = ["hex:1b 5b 3f 39 39 37 3b 31 6e"]
settle_seconds = 1

[[tmux.steps]]
keys = ["Escape"]
settle_seconds = 1

[assert]
both_reach_ready = true
both_contain = ["Resumed reasoning alpha", "Resumed answer charlie", "Resume marker end"]
escaped_output_equal = true
runs = 3
