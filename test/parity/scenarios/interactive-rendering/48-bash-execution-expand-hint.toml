# Behavior family: interactive-rendering
# Surface: BashExecutionComponent: the collapsed preview's hidden-line count and the app.tools.expand key hint.
#
# Upstream evidence (pinned Pi 1.0.3, 2026-10-07, parity-runner tmux probe with COLORTERM=truecolor and the dark theme):
# Rows below are the escaped crop, ESC shown as \e, a run of ─ as <border>.
#
#   $ seq 1 30\e[0m
#    \e[38;2;157;165;169m12\e[39m
#   … rows 13 to 30, then the empty last line …
#
#
#    \e[38;2;157;165;169m... 11 more lines (\e[38;2;126;136;142mctrl+o\e[38;2;157;165;169m to expand)\e[39m
#   \e[38;2;94;178;134m<border>
#
# Upstream rule: the hint is theme.fg("muted", "... N more lines (") + keyHint("app.tools.expand", "to expand") + theme.fg("muted", ")"); keyHint draws the key in "dim" and the description in "muted".
# Red: PiG at main 50e81255d drew "\e[2m... 11 more lines\e[0m (ctrl+o to expand)". Green with the block port.

name = "48-bash-execution-expand-hint"
description = "`!seq 1 30` has 31 output lines (the last is the empty line after the final newline); the block shows the last 20 visual rows and `... 11 more lines (ctrl+o to expand)` drawn by keyHint."
covers = [
  "packages/coding-agent/src/modes/interactive/components/bash-execution.ts",
  "packages/coding-agent/src/modes/interactive/components/keybinding-hints.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent", "PI_SKIP_VERSION_CHECK=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]

[tmux]
width = 100
height = 40
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
cwd = "testdata/bash-wrap-cwd"
capture_start = "$ seq 1 30"
capture_end_regex = '─{100}'

[[tmux.steps]]
keys = ["!seq 1 30", "Enter"]
wait_visible_contains = ["more lines ("]
wait_timeout_seconds = 10

[assert]
both_reach_ready = true
both_contain = ["... 11 more lines (", "to expand)"]
both_not_contain = ["panic:", "goroutine "]
escaped_output_equal = true
runs = 3
