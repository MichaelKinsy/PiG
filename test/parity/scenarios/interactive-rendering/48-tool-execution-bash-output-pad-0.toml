# Behavior family: interactive-rendering
# Upstream evidence: real Pi 1.1.0 (extensions/sdk-ts/node_modules) run side by side with PiG in tmux at 100x35; no number was copied from the
# 1.0.4 sources. Pi 1.0.4 ignored outputPad here (#10557 added it).
# Surface: outputPad 0 reaches tool output (Pi 1.1.0 #10557, tool-execution.ts outputPad, edit.ts renderers). With "outputPad": 0 in settings.json
# the tool card's rows start in column 0 instead of column 1. Pi 1.0.4 padded tool cards by one cell whatever the setting. The crop starts at the
# user message so the card's first row is inside it.

name = "48-tool-execution-bash-output-pad-0"
description = "Bash tool card rows have no horizontal padding when outputPad is 0."
covers = [
  "packages/coding-agent/src/modes/interactive/components/tool-execution.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=testdata/pig-agent-output-pad-0"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent-output-pad-0", "PI_SKIP_VERSION_CHECK=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "Run: expr 20 + 22"
capture_end_regex = 'Took \d+\.\d+s'

[[tmux.steps]]
keys = ["Run: expr 20 + 22", "Enter"]
settle_seconds = 6
wait_contains = ["42", "Took"]
wait_timeout_seconds = 15

[assert]
both_reach_ready = true
both_not_contain = ["unknown command", "panic:", "goroutine "]
# lint-known-gap: bg-paint SGR encoding differs between pig (paintBgWith with
# reset re-application) and upstream (Box delegation with theme.bg). The visible
# content, spacing, and structure are identical.
output_normalized_equal = true
runtime_ratio_max = 2.0
# runs=3 because tool-execution timing has shown ~12% flake (1/8) at runs=1.
# Repeating + normalize_replace nail the durability.
runs = 3

# Mask sub-second timing in "Took Xs" footer: pi and pig can finish a
# trivial bash tool call in 0.0s vs 0.1s due to scheduling jitter.
# normalize_replace applies after ANSI strip, before equality compare.
# normalize-rationale: only the sub-second tool duration varies with scheduling.
[[assert.normalize_replace]]
pattern = 'Took \d+\.\d+s'
with = "Took Ns"
reason = "Tool duration varies with process scheduling; only the numeric seconds in the Took label are replaced."
