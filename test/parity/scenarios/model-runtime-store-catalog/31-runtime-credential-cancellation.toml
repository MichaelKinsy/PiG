# Pi 0.87.1 runtime-credentials.ts:25,33,48 throws the caller's AbortSignal reason. Read/Delete check before the store; List checks after awaiting the store.
# Fixtures assert the original error object locally, retained override state, and exact error text/base-call counts. No values are normalized.
name = "31-runtime-credential-cancellation"
description = "Runtime credential abort checks preserve the caller's reason and store-call ordering."
covers = ["packages/coding-agent/src/core/runtime-credentials.ts"]
tags = ["fast", "hermetic"]
driver = "cli-mode"

[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
pig_args = ["node", "./test/parity/testdata/runtime-credential-cancellation.mjs", "pig"]
pi_args = ["node", "./test/parity/testdata/runtime-credential-cancellation.mjs", "pi"]

[cli]
cwd = "../../../.."
timeout_seconds = 90

[assert]
exit_code = 0
output_equal = true
runs = 3
