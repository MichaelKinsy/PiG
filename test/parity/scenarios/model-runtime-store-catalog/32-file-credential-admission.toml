# Pi auth-storage.ts:118-195 cancels a queued file-lock acquisition independently of another active callback on the same AuthStorage.
# Both fixtures withhold the active callback's release until the queued caller rejects, then verify callback non-execution, committed/retained credentials, and lock cleanup.
name = "32-file-credential-admission"
description = "Queued file-backed credential mutations cancel without waiting for or releasing another operation's active callback."
covers = ["packages/coding-agent/src/core/auth-storage.ts"]
tags = ["fast", "hermetic"]
driver = "cli-mode"

[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
pig_args = ["node", "./test/parity/testdata/auth-file-admission.mjs", "pig", "{{TEMP}}"]
pi_args = ["node", "./test/parity/testdata/auth-file-admission.mjs", "pi", "{{TEMP}}"]

[cli]
cwd = "../../../.."
timeout_seconds = 90

[assert]
exit_code = 0
output_equal = true
runs = 3
