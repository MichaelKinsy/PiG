# Behavior family: json
# Surface: which events a session_start handler puts on the --mode json stream.
#
# Upstream evidence (Pi 1.3.0+1402973a): print-mode.ts:76-122 rebindSession awaits `session.bindExtensions(...)` (every session_start handler) and only then calls `session.subscribe(...)`, the JSON writer. The stream is the session header, then the events from the prompt on. The entry_appended, session_info_changed and custom message_start/message_end events a session_start handler emits during startup have no listener and are not written. The command the prompt runs appends after the writer subscribed, so its events are written.
# PiG subscribed the JSON writer before session_start and wrote the handler's whole startup output between the header and the command's events.
# Entry IDs and clocks are masked; member order and every other byte compare.
name = "13-json-session-start-writer-order"
description = "--mode json starts its stream at the prompt: nothing a session_start handler emits is written, a command's appends are"
covers = ["packages/coding-agent/src/modes/print-mode.ts", "packages/coding-agent/src/core/agent-session.ts"]
tags = ["hermetic", "fast"]
driver = "cli-mode"

[cli]
args = ["--mode", "json", "--model", "test-faux/faux-1", "--system-prompt", "JSON event probe.", "--no-context-files", "--no-skills", "/writer-after"]
timeout_seconds = 30

[env]
pig = ["PIG_TEST_FAUX=1"]
pig_args = ["--no-extensions", "--no-session"]
pig_extensions = ["../../scenarios/json/testdata/ext/writer-session-start.mjs"]
pi_extensions = ["../../testdata/test-faux-provider.ts", "../../scenarios/json/testdata/ext/writer-session-start.mjs"]
pi_args = ["--no-extensions", "--no-session"]

[assert]
exit_code = 0
runs = 10
output_normalized_equal = true
stderr_equal = true
both_contain = ['"customType":"probe-after"', '"name":"after-name"', '"text":"after-message"']
both_not_contain = ['probe-start', 'start-name', 'start-message', 'extension_error']

# normalize-rationale: Only entry IDs, independent clocks and the header's UUID and cwd vary; every member name, order and value stays byte-compared.
[[assert.normalize_replace]]
pattern = '"(id|parentId)":"[0-9a-f-]{8,36}"'
with = '"$1":"<ID>"'
reason = "Generated entry keys and the session header id are random per run; keep each member's name and position."
[[assert.normalize_replace]]
pattern = '"timestamp":[0-9]+'
with = '"timestamp":0'
reason = "Independent numeric wall clocks vary; retain field placement, type and every other byte."
[[assert.normalize_replace]]
pattern = '"timestamp":"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z"'
with = '"timestamp":"2000-01-01T00:00:00.000Z"'
reason = "Independent ISO wall clocks vary; preserve the string type and exact timestamp syntax."
[[assert.normalize_replace]]
pattern = '"cwd":"[^"]*"'
with = '"cwd":"<CWD>"'
reason = "D2: each binary runs in its own isolated cwd."
