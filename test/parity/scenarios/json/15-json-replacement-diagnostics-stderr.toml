# Behavior family: json
# Surface: a diagnostic that first appears when an extension command replaces the session is written to stderr once, never to the JSON event stream.
#
# Upstream evidence (Pi c47ad0432bb8, #12115, related to #11264): print-mode.ts runPrintMode setRebindSession awaits rebindSession() and then calls
# writeDiagnosticsToStderr(runtimeHost.takeUnreportedDiagnostics()) (modes/diagnostics-stderr.ts: `Warning: <message>`, yellow on a terminal). The runtime factory
# runs again on every ctx.newSession(); before the commit the settings that changed after startup produced no line at all. The command writes settings.json with an
# enabledModels pattern that matches no model and replaces the session twice: the warning is on stderr once (the second replacement's diagnostic is the same
# type and message), and stdout, the event stream, never carries it. stderr_equal compares the whole stream.
name = "15-json-replacement-diagnostics-stderr"
description = "--mode json: the diagnostic of a replacement is on stderr once and not in the event stream"
covers = [
  "packages/coding-agent/src/modes/print-mode.ts",
  "packages/coding-agent/src/core/agent-session-runtime.ts",
]
tags = ["hermetic", "fast"]
driver = "cli-mode"

[cli]
args = ["--mode", "json", "--model", "test-faux/faux-1", "--system-prompt", "JSON event probe.", "--no-context-files", "--no-skills", "/replace-after-settings-change"]
timeout_seconds = 30

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=testdata/replacement-diagnostics-agent"]
pig_args = ["--no-extensions", "--no-session"]
pig_extensions = ["../../scenarios/json/testdata/ext/replace-after-settings-change.mjs"]
pi = ["PI_CODING_AGENT_DIR=testdata/replacement-diagnostics-agent"]
pi_extensions = ["../../testdata/test-faux-provider.ts", "../../scenarios/json/testdata/ext/replace-after-settings-change.mjs"]
pi_args = ["--no-extensions", "--no-session"]

[assert]
exit_code = 0
runs = 3
output_normalized_equal = true
stderr_equal = true
both_not_contain = ['extension_error', 'No models match pattern']

# normalize-rationale: Only entry IDs, independent clocks and the header's UUID and cwd vary; every member name, order and value stays byte-compared.
[[assert.normalize_replace]]
pattern = '"(id|parentId)":"[0-9a-f-]{8,36}"'
with = '"$1":"<ID>"'
reason = "Generated entry keys and the session header id are random per run; keep each member's name and position."
[[assert.normalize_replace]]
pattern = '"timestamp":[0-9]+'
with = '"timestamp":0'
reason = "Independent numeric wall clocks vary; retain field placement, type and every other byte."
[[assert.normalize_replace]]
pattern = '"timestamp":"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z"'
with = '"timestamp":"2000-01-01T00:00:00.000Z"'
reason = "Independent ISO wall clocks vary; preserve the string type and exact timestamp syntax."
[[assert.normalize_replace]]
pattern = '"cwd":"[^"]*"'
with = '"cwd":"<CWD>"'
reason = "D2: each binary runs in its own isolated cwd."
