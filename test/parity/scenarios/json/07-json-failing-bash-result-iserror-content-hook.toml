# Behavior family: json
# Surface: a bash call that exits non-zero RETURNS an error result, so `isError` stays inside tool_execution_end.result.
#
# Upstream evidence (Pi 0.99.1, dist/cli.js, probed 2026-09-30; test-faux twin, prompt "Run: bash failing exit", command `echo out; exit 3`):
#   {"type":"tool_execution_end","toolCallId":...,"toolName":"bash","result":{"content":[{"type":"text","text":"out\n\n\nCommand exited with code 3"}],"structuredContent":{"output":"out\n","truncated":false,"exit_code":3,"wall_time_seconds":0},"isError":true},"isError":true}
# bash.ts:403-409 returns {content, details, structuredContent, isError: true}; agent-loop.ts:912-919 emits the finalized result as `result` and the call's flag as `isError`.
# A tool_result handler that replaces only the content (parity-result-modifier.mjs) drops structuredContent, which may no longer match it
# (runner.ts:1187, agent-loop.ts:877-889). Pi 0.99.1 gives {"content":[...],"isError":true}; the returned isError survives the rebuilt result.
# A thrown error would give createErrorToolResult (agent-loop.ts:906-910), which has no isError. Pig omitted result.isError for every failing bash call.

name = "07-json-failing-bash-result-iserror-content-hook"
description = "--mode json keeps bash's returned isError inside tool_execution_end.result and drops structuredContent when a tool_result handler replaced the content"

covers = [
  "packages/coding-agent/src/core/tools/bash.ts",
  "packages/agent/src/agent-loop.ts",
  "packages/coding-agent/src/modes/json-event.ts",
]

tags = ["hermetic", "fast"]
driver = "cli-mode"

[cli]
args = ["--mode", "json", "--model", "test-faux/faux-1", "--system-prompt", "JSON event probe.", "--no-context-files", "--no-skills", "Run: bash failing exit"]

timeout_seconds = 30

[env]
pig = ["PIG_TEST_FAUX=1"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pig_extensions = ["../../scenarios/extensions-runtime/testdata/ext/parity-result-modifier.mjs"]
pi_extensions = ["../../testdata/test-faux-provider.ts", "../../scenarios/extensions-runtime/testdata/ext/parity-result-modifier.mjs"]
pi_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]

[assert]
exit_code = 0
runs = 3
output_equal = true
stderr_equal = true
both_contain = [
  '"type":"tool_execution_end"',
  'Command exited with code 3\n[parity-modified]"}],"isError":true},"isError":true,"durationMs":',
  '"text":"failed-bash-done"',
]

# normalize-rationale: Only independent clocks, the header UUID, the isolated cwd identity and bash's rounded wall clock vary; retain every other byte and property order.
[[assert.normalize_replace]]
pattern = 'parity-snap-cwd-[0-9]{10}'
with = 'parity-snap-cwd-0000000000'
reason = "Alias the isolated working-directory identity while preserving path suffixes and content."
[[assert.normalize_replace]]
pattern = '"timestamp":[0-9]+'
with = '"timestamp":0'
reason = "Independent numeric wall clocks vary; retain field placement, type and every other byte."
[[assert.normalize_replace]]
pattern = '"durationMs":[0-9]+'
with = '"durationMs":0'
reason = "Pi 1.1.0 times each response and tool run with a monotonic clock, so the whole-millisecond value differs between runs; retain the field's presence, placement and number spelling."
[[assert.normalize_replace]]
pattern = '"timestamp":"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z"'
with = '"timestamp":"2000-01-01T00:00:00.000Z"'
reason = "Independent ISO wall clocks vary; preserve the string type and exact timestamp syntax."
[[assert.normalize_replace]]
pattern = '"id":"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"'
with = '"id":"SESSION"'
reason = "The header UUID is independently generated; no message content or property order is replaced."
[[assert.normalize_replace]]
pattern = '"wall_time_seconds":[0-9.]+'
with = '"wall_time_seconds":0'
reason = "bash rounds wall time to 0.1 s (bash.ts:392), so a slow runner can differ by one step; the key, its type and its position stay."

[[assert.normalize_replace]]
pattern = '"durationMs":[0-9]+'
with = '"durationMs":0'
reason = "Pi 1.1.0 measures each response and tool execution (#10549) with a monotonic clock; the value varies per run. Retain field placement, type and every other byte."
