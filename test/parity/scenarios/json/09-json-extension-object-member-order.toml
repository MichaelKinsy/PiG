# Behavior family: json
# Surface: a JSON object an extension supplies keeps the member order it was written in: a tool's partial result and details, a tool_result handler's replacement details, and the content and details that handler received.
#
# Upstream evidence (Pi 0.99.1, dist/cli.js, probed 2026-09-30; test-faux twin, prompt "Run: extension echo hello"): details {"zeta":1,"alpha":{"yy":2,"bb":3},"mid":[{"qq":1,"aa":2}]} stay in that order in tool_execution_update and in the tool_result event the handler received, and the handler's {"omega":1,"beta":{"zz":2,"cc":3}} in tool_execution_end and the toolResult message.
# agent-loop.ts:778-786, 912-919; runner.ts:707-755; agent-session.ts:649-660 (the tool_result event's members). PiG decoded these values into Go maps, which sort members.

name = "09-json-extension-object-member-order"
description = "--mode json keeps the member order of details an extension tool and a tool_result handler supplied"

covers = [
  "packages/agent/src/agent-loop.ts",
  "packages/coding-agent/src/core/agent-session.ts",
  "packages/coding-agent/src/core/extensions/runner.ts",
  "packages/coding-agent/src/modes/json-event.ts",
]

tags = ["hermetic", "fast"]
driver = "cli-mode"

[cli]
args = ["--mode", "json", "--model", "test-faux/faux-1", "--system-prompt", "JSON event probe.", "--no-context-files", "--no-skills", "Run: extension echo hello"]
timeout_seconds = 30

[env]
pig = ["PIG_TEST_FAUX=1"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pig_extensions = ["../../scenarios/json/testdata/ext/parity-ordered-details.mjs"]
pi_extensions = ["../../testdata/test-faux-provider.ts", "../../scenarios/json/testdata/ext/parity-ordered-details.mjs"]
pi_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]

[assert]
exit_code = 0
runs = 3
output_equal = true
stderr_equal = true
both_contain = [
  '"partialResult":{"content":[{"type":"text","text":"partial"}],"details":{"zeta":1,"alpha":{"yy":2,"bb":3},"mid":[{"qq":1,"aa":2}]}}',
  # The handler's replacement details, in tool_execution_end and in the toolResult message.
  '"details":{"omega":1,"beta":{"zz":2,"cc":3}}',
  # The content and details the handler received, as the tool_result event carried them.
  '[{\"type\":\"text\",\"text\":\"echo-bridge: hello\"}] {\"zeta\":1,\"alpha\":{\"yy\":2,\"bb\":3},\"mid\":[{\"qq\":1,\"aa\":2}]}',
]

# normalize-rationale: Only independent clocks, the header UUID, the isolated cwd identity and bash's rounded wall clock vary; retain every other byte and property order.
[[assert.normalize_replace]]
pattern = 'parity-snap-cwd-[0-9]{10}'
with = 'parity-snap-cwd-0000000000'
reason = "Alias the isolated working-directory identity while preserving path suffixes and content."
[[assert.normalize_replace]]
pattern = '"timestamp":[0-9]+'
with = '"timestamp":0'
reason = "Independent numeric wall clocks vary; retain field placement, type and every other byte."
[[assert.normalize_replace]]
pattern = '"durationMs":[0-9]+'
with = '"durationMs":0'
reason = "Pi 1.1.0 times each response and tool run with a monotonic clock, so the whole-millisecond value differs between runs; retain the field's presence, placement and number spelling."
[[assert.normalize_replace]]
pattern = '"timestamp":"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z"'
with = '"timestamp":"2000-01-01T00:00:00.000Z"'
reason = "Independent ISO wall clocks vary; preserve the string type and exact timestamp syntax."
[[assert.normalize_replace]]
pattern = '"id":"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"'
with = '"id":"SESSION"'
reason = "The header UUID is independently generated; no message content or property order is replaced."
[[assert.normalize_replace]]
pattern = '"wall_time_seconds":[0-9.]+'
with = '"wall_time_seconds":0'
reason = "bash rounds wall time to 0.1 s (bash.ts:392), so a slow runner can differ by one step; the key, its type and its position stay."

[[assert.normalize_replace]]
pattern = '"durationMs":[0-9]+'
with = '"durationMs":0'
reason = "Pi 1.1.0 measures each response and tool execution (#10549) with a monotonic clock; the value varies per run. Retain field placement, type and every other byte."
