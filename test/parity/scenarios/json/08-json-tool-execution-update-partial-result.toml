# Behavior family: json
# Surface: tool_execution_update's partialResult is the AgentToolResult the tool passed to onUpdate, on the JSON stream and for a Node extension handler.
#
# Upstream evidence (Pi 0.99.1, dist/cli.js, probed 2026-09-30; test-faux twin, prompt "Run: expr 20 + 22"; agent-loop.ts:778-786 emits `partialResult` as given):
#   {"type":"tool_execution_update",...,"partialResult":{"content":[]}}
#   {"type":"tool_execution_update",...,"partialResult":{"content":[{"type":"text","text":"42\n"}],"details":{}}}
# bash.ts:321-323 passes {content: [], details: undefined} first and bash.ts:290-296 the output snapshot. PiG flattened `content` to a string for extension handlers ({"content":""}, {"content":"42\n","details":{}}).
# parity-partial-observer.mjs stringifies what its tool_execution_update handler received into the bash result (tool_result handler), so tool_execution_end carries the shape the Node handler observed.

name = "08-json-tool-execution-update-partial-result"
description = "--mode json and a Node handler see tool_execution_update partialResult as an array of content blocks"

covers = [
  "packages/agent/src/agent-loop.ts",
  "packages/coding-agent/src/core/tools/bash.ts",
  "packages/coding-agent/src/modes/json-event.ts",
]

tags = ["hermetic", "fast"]
driver = "cli-mode"

[cli]
args = ["--mode", "json", "--model", "test-faux/faux-1", "--system-prompt", "JSON event probe.", "--no-context-files", "--no-skills", "Run: expr 20 + 22"]
timeout_seconds = 30

[env]
pig = ["PIG_TEST_FAUX=1"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pig_extensions = ["../../scenarios/json/testdata/ext/parity-partial-observer.mjs"]
pi_extensions = ["../../testdata/test-faux-provider.ts", "../../scenarios/json/testdata/ext/parity-partial-observer.mjs"]
pi_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]

[assert]
exit_code = 0
runs = 3
output_equal = true
stderr_equal = true
both_contain = [
  '"partialResult":{"content":[]}',
  '"partialResult":{"content":[{"type":"text","text":"42\n"}],"details":{}}',
  # The handler saw both partial results, content as an array of blocks.
  '"text":"[{\"content\":[]},{\"content\":[{\"type\":\"text\",\"text\":\"42\\n\"}],\"details\":{}}]"',
]
both_not_contain = [
  '"partialResult":{"content":"',
]

# normalize-rationale: Only independent clocks, the header UUID, the isolated cwd identity and bash's rounded wall clock vary; retain every other byte and property order.
[[assert.normalize_replace]]
pattern = 'parity-snap-cwd-[0-9]{10}'
with = 'parity-snap-cwd-0000000000'
reason = "Alias the isolated working-directory identity while preserving path suffixes and content."
[[assert.normalize_replace]]
pattern = '"timestamp":[0-9]+'
with = '"timestamp":0'
reason = "Independent numeric wall clocks vary; retain field placement, type and every other byte."
[[assert.normalize_replace]]
pattern = '"timestamp":"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z"'
with = '"timestamp":"2000-01-01T00:00:00.000Z"'
reason = "Independent ISO wall clocks vary; preserve the string type and exact timestamp syntax."
[[assert.normalize_replace]]
pattern = '"id":"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"'
with = '"id":"SESSION"'
reason = "The header UUID is independently generated; no message content or property order is replaced."
[[assert.normalize_replace]]
pattern = '"wall_time_seconds":[0-9.]+'
with = '"wall_time_seconds":0'
reason = "bash rounds wall time to 0.1 s (bash.ts:392), so a slow runner can differ by one step; the key, its type and its position stay."
