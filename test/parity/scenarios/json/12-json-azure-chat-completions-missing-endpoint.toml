# Behavior family: json
# Scenario: an azure deepseek-v4-pro request with AZURE_OPENAI_API_KEY but no endpoint fails with Pi's message and key order.
#
# Upstream evidence (Pi 1.1.0, probed 2026-10-10 with a stack trace at the throw): azure.ts:44-55 wraps only the provider's
# Chat Completions API in azureStreams. For deepseek-v4-pro, the Chat Completions model goes through azureStreams (azure.ts:30-41), which resolves the endpoint in lazyStream's setup, so lazy.ts createSetupErrorMessage lists errorMessage before timestamp.
# normalize-rationale: only clock values, the random session id and the isolated cwd are masked; member names and their order
# stay byte-compared, which is what this scenario checks.
# PiG listed errorMessage first for every lazy setup error (comb-audit row 78) and then timestamp first for all of them
# (f64e79858f); each variant had one of these two scenarios red.
name = "12-json-azure-chat-completions-missing-endpoint"
description = "JSON mode reports an azure deepseek-v4-pro request without an endpoint with Pi's message, stop reason and key order"
covers = ["packages/coding-agent/src/modes/print-mode.ts", "packages/ai/src/providers/azure.ts", "packages/ai/src/api/lazy.ts"]
tags = ["hermetic", "fast"]
driver = "cli-mode"

[cli]
args = ["--mode", "json", "hello"]
timeout_seconds = 30

[env]
pig = ["PIG_HOME=../rpc/testdata/pig-home", "AZURE_OPENAI_API_KEY=parity-key", "AZURE_OPENAI_BASE_URL=", "AZURE_OPENAI_RESOURCE_NAME="]
pi = ["PI_CODING_AGENT_DIR=../rpc/testdata/pi-home/agent", "PI_SKIP_VERSION_CHECK=1", "AZURE_OPENAI_API_KEY=parity-key", "AZURE_OPENAI_BASE_URL=", "AZURE_OPENAI_RESOURCE_NAME="]
pig_args = ["--offline", "--no-extensions", "--model", "azure/deepseek-v4-pro", "--system-prompt", "Strict wire probe.", "--no-context-files", "--no-skills", "--no-session"]
pi_args = ["--offline", "--no-extensions", "--model", "azure/deepseek-v4-pro", "--system-prompt", "Strict wire probe.", "--no-context-files", "--no-skills", "--no-session"]

[assert]
exit_code = 0
output_normalized_equal = true
stderr_equal = true
runs = 3
both_contain = ['"stopReason":"error"', 'Azure OpenAI base URL is required.']
normalize_replace = [
  { pattern = '"(timestamp|durationMs)":[0-9]+', with = '"$1":<N>', reason = "Message clocks and monotonic durations vary per run; keep each member's name and position, so key order still compares." },
  { pattern = '"id":"[0-9a-f-]{36}"', with = '"id":"<SESSION>"', reason = "The session header id is random per run." },
  { pattern = '"timestamp":"[0-9T:.Z-]+"', with = '"timestamp":"<ISO>"', reason = "The session header carries the wall-clock start time." },
  { pattern = '"cwd":"[^"]*"', with = '"cwd":"<CWD>"', reason = "D2: each binary runs in its own isolated cwd." },
]
