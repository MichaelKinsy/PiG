# Upstream evidence: Pi 1.5.2 interactive-mode.ts setupAutocompleteProvider ends with `this.editor.setAutocompleteProvider?.(provider)`, so an
# installed editor that throws there fails whichever caller rebuilt the provider. The extension (testdata/editor-sync-error.ts) arms its editor to
# throw from setAutocompleteProvider once /arm has run (issue: an extension editor that fails to take the provider ended pig's session).
name = "16-editor-sync-error-install-editor"
description = "An extension installing an editor that refuses the provider it is handed shows the extension's error and the session goes on."
covers = ["packages/coding-agent/src/modes/interactive/interactive-mode.ts"]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 110
height = 40
ready_pattern_pig = "No models available"
ready_pattern_pi = "No models available"
ready_timeout_seconds = 30
capture_start = "armed"
capture_end = "pong"

[[tmux.steps]]
keys = ["/arm", "Escape", "Enter"]
wait_contains = ["armed"]
wait_timeout_seconds = 15

[[tmux.steps]]
keys = ["/install-editor", "Escape", "Enter"]
settle_seconds = 2

[[tmux.steps]]
keys = ["/ping", "Escape", "Enter"]
wait_contains = ["pong"]
wait_timeout_seconds = 15

[env]
pig = ["PIG_CODING_AGENT_DIR=../selectors/testdata/dialogs-default", "EDITOR_SYNC_FLAG={{TEMP}}/flag", "EDITOR_SYNC_LOG={{TEMP}}/log"]
pi = ["PI_CODING_AGENT_DIR=../selectors/testdata/dialogs-default", "EDITOR_SYNC_FLAG={{TEMP}}/flag", "EDITOR_SYNC_LOG={{TEMP}}/log"]
pig_extensions = ["testdata/editor-sync-error.ts"]
pi_extensions = ["testdata/editor-sync-error.ts"]
pig_args = ["--no-extensions", "--no-skills", "--no-prompt-templates", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--no-extensions", "--no-skills", "--no-prompt-templates", "--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_contain = ["Extension \"command:install-editor\" error: EDITOR_SYNC_REFUSED", "pong"]
both_not_contain = ["panic:", "goroutine ", "uncaughtException"]
output_equal = true
runs = 3
