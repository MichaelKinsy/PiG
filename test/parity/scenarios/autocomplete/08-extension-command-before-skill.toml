# Upstream evidence: Pi 0.87.1 interactive-mode.ts:747-776 assembles extensions before skills.
# autocomplete.ts:335-341 removes skill: for fuzzy scoring; ties keep that order.
# The installed Pi CombinedAutocompleteProvider probe returns [btw, skill:btw]
# for Pi's order, and [skill:btw, btw] for PiG's old order. This drives the real
# editor and asserts the selected command executes, not merely that it is listed.
# --no-skills excludes ambient discovery; the explicit CLI skill still loads.
name = "08-extension-command-before-skill"
description = "An exact extension command match wins over a same-name skill on Enter"
covers = ["packages/coding-agent/src/modes/interactive/interactive-mode.ts"]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1"]
pig_args = ["--no-extensions", "--no-skills", "--skill", "SKILL.md"]
pi_args = ["--no-extensions", "--no-skills", "--skill", "SKILL.md"]
pig_extensions = ["testdata/command-skill-order/command.mjs"]
pi_extensions = ["../../testdata/test-faux-provider.ts", "testdata/command-skill-order/command.mjs"]

[tmux]
cwd = "testdata/command-skill-order"
width = 100
height = 40
# Resource listings are rendered after the final startup provider rebuild. The
# early (auto) footer is not readiness for a command/skill completion request.
ready_pattern_pig = "[Extensions]"
ready_pattern_pi = "[Extensions]"
ready_timeout_seconds = 30
capture_start = "AUTOCOMPLETE COMMAND SELECTED"
capture_end = "AUTOCOMPLETE COMMAND SELECTED"

[[tmux.steps]]
keys = ["/btw"]
wait_contains = ["skill:btw", "Side-question command"]
wait_timeout_seconds = 10

[[tmux.steps]]
keys = ["Enter"]
wait_contains = ["AUTOCOMPLETE COMMAND SELECTED"]
wait_timeout_seconds = 10

[assert]
both_reach_ready = true
both_contain = ["AUTOCOMPLETE COMMAND SELECTED"]
escaped_output_equal = true
runs = 3
