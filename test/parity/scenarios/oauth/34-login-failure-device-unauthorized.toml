# Upstream evidence: Pi 1.5.2 showLoginDialog (interactive-mode.ts:6543-6576) restores the editor when the login rejects (:6552-6556, :6564) and, for any message except "Login cancelled", reports it with showError (:4809-4813) as `Error: Failed to login to <provider name>: <message>` in the transcript (:6573). The dialog is gone and the editor has focus again, so the next keypress types into the editor.
# The device-code request answers 401 from the process-local stub (PIG/PI_PARITY_LOGIN_DIALOG=unauthorized); each binary's own text for the rejected request follows the provider's message, which is compared byte for byte.
name = "34-login-failure-device-unauthorized"
description = "A GitHub Copilot device login rejected with 401 closes the dialog and reports Error: Failed to login to GitHub Copilot in the transcript"
covers = ["packages/coding-agent/src/modes/interactive/interactive-mode.ts"]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 160
height = 40
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "Error: Failed to login to GitHub Copilot"
capture_end = "typed-after-failure"
settle_seconds = 1
cwd = "../selectors/testdata/login-empty-project"

[[tmux.steps]]
keys = ["/login", "Enter"]
wait_contains = ["Select authentication method"]

[[tmux.steps]]
keys = ["Enter"]
wait_contains = ["Select provider"]

[[tmux.steps]]
keys = ["github-copilot", "Enter"]
wait_contains = ["GitHub Enterprise URL/domain"]

[[tmux.steps]]
keys = ["Enter"]
wait_contains = ["401"]

[[tmux.steps]]
keys = ["typed-after-failure"]
wait_visible_contains = ["typed-after-failure"]

[env]
pig = ["PIG_CODING_AGENT_DIR=../selectors/testdata/pi-agent-noauth", "PI_CODING_AGENT_DIR=", "PIG_HOME=../selectors/testdata/pig-home-noauth", "PIG_PARITY_HARNESS=1", "PIG_PARITY_LOGIN_DIALOG=unauthorized", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]  # gitleaks:allow -- synthetic parity fixture
pi = ["PIG_CODING_AGENT_DIR=", "PIG_HOME=", "PI_CODING_AGENT_DIR=../selectors/testdata/pi-agent-noauth", "PI_PARITY_LOGIN_DIALOG=unauthorized", "PATH={{FAKE_BIN}}:{{PATH}}"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]
pi_extensions = ["../../testdata/oauth-harness.ts"]

[assert]
both_reach_ready = true
both_contain = ["Error: Failed to login to GitHub Copilot", "401"]
escaped_output_equal = true
runs = 3

# normalize-rationale: The rows between the error line and the editor's top border are screen filler: the editor sits at the bottom of the 40-row screen, so the count depends on how tall each binary's startup header is, not on the login. Only the run of line breaks before the border is collapsed; the error text, its colour escapes, the border and the typed text stay compared.
[[assert.normalize_replace]]
pattern = '\n+(\x1b\[[0-9;]*m─)'
with = "\n${1}"
reason = "Filler rows between the transcript and the bottom-anchored editor depend on the startup header height of each binary."
