# Pi auth/oauth/openai-codex.ts:403-415 derives accountId from a successful
# token, and readTokenResponse (:126-149) labels refresh failures explicitly.
# Both probes run selection -> device code -> pending poll -> token exchange
# with a hermetic fetch client, then a failing refresh. Expiry is checked
# against the operation's wall-clock bounds; exact fake-clock timing is unit-tested.
name = "10-codex-device-credential-metadata"
description = "Codex device login preserves account metadata, selection order and token lifetime; refresh failures retain the provider error."
covers = ["packages/ai/src/auth/oauth/openai-codex.ts"]
tags = ["fast", "hermetic"]
driver = "cli-mode"

[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
pig_args = ["go", "run", "./test/parity/testdata/codex-oauth-metadata-pig"]
pi_args = ["node", "./test/parity/testdata/codex-oauth-metadata-pi.mjs"]

[cli]
cwd = "../../../.."
timeout_seconds = 60

[assert]
exit_code = 0
output_equal = true
both_contain = ['"account":"account-parity","tokens":true,"expiry":true', 'OpenAI Codex token refresh failed (401)', '"polls":2']
runs = 3
