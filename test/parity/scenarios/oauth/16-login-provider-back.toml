# Upstream evidence: Pi 0.87.1 interactive-mode.ts:5799-5805 returns from either typed provider list to the authentication method selector on Escape.
name = "16-login-provider-back"
description = "Escape in the API-key provider list returns to the method selector"
covers = ["packages/coding-agent/src/modes/interactive/interactive-mode.ts"]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"
[tmux]
width = 120
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "Select authentication method:"
capture_end = "cancel"
settle_seconds = 1
cwd = "../selectors/testdata/login-empty-project"
[[tmux.steps]]
keys = ["/login", "Enter"]
wait_contains = ["Select authentication method:"]
[[tmux.steps]]
keys = ["Down", "Enter"]
wait_contains = ["Select provider to configure:"]
[[tmux.steps]]
keys = ["Escape"]
wait_contains = ["Select authentication method:"]
[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/privacy-pi-compatible", "PI_CODING_AGENT_DIR=", "PIG_HOME=../selectors/testdata/pig-home-noauth", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]
pi = ["PI_CODING_AGENT_DIR=testdata/privacy-pi-compatible", "PIG_CODING_AGENT_DIR=", "PIG_HOME=", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
[assert]
both_reach_ready = true
both_contain = ["Select authentication method:", "Sign in with an account", "Sign in with an API key"]
escaped_output_equal = true
runs = 3
