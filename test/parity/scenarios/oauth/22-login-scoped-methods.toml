# Upstream evidence: Pi 0.87.1 interactive-mode.ts:5689-5755 scopes an exact provider argument to its declared methods and uses oauth.loginLabel for the subscription option.
# Pi 1.0.0 interactive-mode.ts:405-417 and oauth-selector.ts:27-33 label a non-subscription OAuth sign-in "account": OpenRouter's oauth method sets no isSubscription (ai/src/providers/openrouter.ts), so the completion reads "OpenRouter · account/API key".
# Wait for the argument-completion menu, then dismiss it before submitting the command. No OAuth network flow is started.
name = "22-login-scoped-methods"
description = "An exact multi-method provider argument opens the provider-scoped method selector"
covers = ["packages/coding-agent/src/modes/interactive/interactive-mode.ts"]
tags = ["hermetic", "tui", "fixture-auth"]
driver = "interactive-tmux"
model = "openai/gpt-5.5"
[tmux]
width = 200
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "Select authentication method for OpenRouter:"
capture_end = "cancel"
settle_seconds = 1
cwd = "../selectors/testdata/login-empty-project"
[[tmux.steps]]
keys = ["/login openrouter"]
wait_contains = ["OpenRouter · account/API key"]
[[tmux.steps]]
keys = ["Escape", "Enter"]
wait_contains = ["Select authentication method for OpenRouter:", "Sign in with OpenRouter"]
[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/w3-stored-key", "PI_CODING_AGENT_DIR=", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]
pi = ["PI_CODING_AGENT_DIR=testdata/w3-stored-key", "PIG_CODING_AGENT_DIR=", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]
pig_args = ["--offline", "--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--offline", "--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
[assert]
both_reach_ready = true
both_contain = ["Select authentication method for OpenRouter:", "Sign in with OpenRouter", "Sign in with an API key"]
escaped_output_equal = true
runs = 3
