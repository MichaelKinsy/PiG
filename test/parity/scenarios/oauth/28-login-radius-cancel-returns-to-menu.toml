# Upstream evidence: Pi 1.0.0 interactive-mode.ts:5850-5854 starts the top-level Radius login with onBack = showLoginAuthTypeSelector(); Escape at the method prompt rejects with "Login cancelled" (interactive-mode.ts:6168-6200) and showLoginDialog calls onBack (interactive-mode.ts:6283-6286).
# Probe (Pi 1.0.0, this fixture): /login, Down, Down, Enter, Escape reopens "Select authentication method:" with "Sign in with an account" selected, so the Radius row is static.
name = "28-login-radius-cancel-returns-to-menu"
description = "Cancelling the top-level Radius sign-in reopens the authentication method menu"
covers = ["packages/coding-agent/src/modes/interactive/interactive-mode.ts"]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 120
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "Select authentication method:"
capture_end = "cancel"
settle_seconds = 1
cwd = "../selectors/testdata/login-empty-project"

[[tmux.steps]]
keys = ["/login", "Enter"]
wait_contains = ["Select authentication method:", "Sign in with Radius • not configured"]

[[tmux.steps]]
keys = ["Down", "Down", "Enter"]
wait_contains = ["Sign in to Radius:"]

[[tmux.steps]]
keys = ["Escape"]
wait_visible_contains = ["Select authentication method:", "Sign in with Radius • not configured"]

[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/privacy-pi-compatible", "PI_CODING_AGENT_DIR=", "PIG_HOME=../selectors/testdata/pig-home-noauth", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]
pi = ["PI_CODING_AGENT_DIR=testdata/privacy-pi-compatible", "PIG_CODING_AGENT_DIR=", "PIG_HOME=", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_contain = ["Select authentication method:", "Sign in with an account", "Sign in with an API key", "Sign in with Radius • not configured"]
escaped_output_equal = true
runs = 3
