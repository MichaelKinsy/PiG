# Pi 0.87.1 auth-storage.ts:208-270 and :441-470 validate only required OAuth fields, retain provider-owned JSON and persist a modifier's complete object.
# The same source-derived inputs include absent, empty, null, false, zero, nested values, and OAuth metadata whose names overlap API-key fields.
# Both probes use the production auth stores; every read and persisted rewrite is compared as complete JSON, without normalization.
name = "24-oauth-credential-presence"
description = "Mutable and read-only auth stores preserve optional and provider-owned credential fields"
covers = ["packages/coding-agent/src/core/auth-storage.ts"]
tags = ["hermetic", "fast"]
driver = "cli-mode"

[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
pig_args = ["go", "run", "./test/parity/testdata/oauth-presence-pig"]
pi_args = ["node", "./test/parity/testdata/oauth-presence-pi.mjs"]

[cli]
cwd = "../../../.."
timeout_seconds = 60

[assert]
exit_code = 0
json_output_equal = true
runs = 3
