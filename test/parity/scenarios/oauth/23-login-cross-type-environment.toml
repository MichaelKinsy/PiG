# Upstream evidence: Pi 0.87.1 interactive-mode.ts:5628-5662 projects the effective auth type; oauth-selector.ts:165-168 shows API key configured in an OAuth list when the credential comes from an environment key.
name = "23-login-cross-type-environment"
description = "The account login list reports a configured environment API key"
covers = ["packages/coding-agent/src/modes/interactive/interactive-mode.ts", "packages/coding-agent/src/modes/interactive/components/oauth-selector.ts"]
tags = ["hermetic", "tui", "fixture-auth"]
driver = "interactive-tmux"
model = "openai/gpt-5.5"
[tmux]
width = 200
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "Select provider to configure:"
capture_end = "API key configured"
settle_seconds = 1
cwd = "../selectors/testdata/login-empty-project"
[[tmux.steps]]
keys = ["/login", "Enter"]
wait_contains = ["Select authentication method:"]
[[tmux.steps]]
keys = ["Enter"]
wait_contains = ["Select provider to configure:"]
[[tmux.steps]]
keys = ["openrouter"]
wait_visible_contains = ["> openrouter", "OpenRouter • API key configured"]
[env]
pig = ["OPENROUTER_API_KEY=w3-not-a-real-key", "PIG_CODING_AGENT_DIR=testdata/w3-stored-key", "PI_CODING_AGENT_DIR=", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]
pi = ["OPENROUTER_API_KEY=w3-not-a-real-key", "PI_CODING_AGENT_DIR=testdata/w3-stored-key", "PIG_CODING_AGENT_DIR=", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]
pig_args = ["--offline", "--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--offline", "--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
[assert]
both_reach_ready = true
both_contain = ["> openrouter", "OpenRouter • API key configured"]
escaped_output_equal = true
runs = 3
