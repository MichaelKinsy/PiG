# Upstream evidence: Pi 1.0.0 interactive-mode.ts:5809-5831 adds "Sign in with Radius" with its status as the last top-level /login option; selecting it starts the Radius login (interactive-mode.ts:5850-5854). showAuthSelect (interactive-mode.ts:6168-6200) gives the Radius method prompt the description RADIUS_LOGIN_INTRO (interactive-mode.ts:367).
# Probe (Pi 1.0.0, this fixture): /login, Down, Down, Enter shows "Sign in to Radius:", the line "Radius is a service crafted for Pi by the builders of Pi, Earendil Works", and the browser and device code methods. No gateway request runs before a method is chosen.
# The top-level Radius row shimmers while it is selected (radius-login-selector.ts), so the capture starts at the method prompt, which does not animate.
name = "27-login-radius-method-intro"
description = "/login offers Radius at the top level and introduces Radius in its method prompt"
covers = ["packages/coding-agent/src/modes/interactive/interactive-mode.ts", "packages/coding-agent/src/modes/interactive/components/radius-login-selector.ts"]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 120
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "Sign in to Radius:"
capture_end = "cancel"
settle_seconds = 1
cwd = "../selectors/testdata/login-empty-project"

[[tmux.steps]]
keys = ["/login", "Enter"]
wait_contains = ["Select authentication method:", "Sign in with Radius • not configured"]

[[tmux.steps]]
keys = ["Down", "Down", "Enter"]
wait_contains = ["Sign in to Radius:", "Radius is a service crafted for Pi by the builders of Pi, Earendil Works"]

[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/privacy-pi-compatible", "PI_CODING_AGENT_DIR=", "PIG_HOME=../selectors/testdata/pig-home-noauth", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]
pi = ["PI_CODING_AGENT_DIR=testdata/privacy-pi-compatible", "PIG_CODING_AGENT_DIR=", "PIG_HOME=", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_contain = ["Sign in to Radius:", "Radius is a service crafted for Pi by the builders of Pi, Earendil Works", "Sign in with browser (recommended)", "Sign in with device code (when signing in from another device)"]
escaped_output_equal = true
runs = 3
