# Upstream evidence: Pi 0.87.1 interactive-mode.ts:5832-5868 removes the selected stored credential; the next logout reads an empty store.
# Consecutive status notices replace one another in both hosts. Scenario 20 compares the removal notice; this scenario compares the subsequent empty state, proving deletion rather than just a success message.
# Both hosts use the same synthetic API-key fixture, and --offline prevents catalog/network activity.
name = "21-logout-api-key-state"
description = "A second logout observes the API key removed from credential storage"
covers = ["packages/coding-agent/src/modes/interactive/interactive-mode.ts", "packages/coding-agent/src/core/auth-storage.ts"]
tags = ["hermetic", "tui", "fixture-auth"]
driver = "interactive-tmux"
model = "openai/gpt-5.5"
[tmux]
width = 200
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "No stored credentials to remove."
capture_end = "unchanged."
settle_seconds = 1
cwd = "../selectors/testdata/login-empty-project"
[[tmux.steps]]
keys = ["/logout", "Enter"]
wait_contains = ["Select provider to logout:", "OpenAI ✓ configured"]
[[tmux.steps]]
keys = ["Enter"]
wait_contains = ["Removed stored API key for OpenAI. Environment variables and models.json config are unchanged."]
[[tmux.steps]]
keys = ["/logout", "Enter"]
wait_contains = ["No stored credentials to remove."]
[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/w3-stored-key", "PI_CODING_AGENT_DIR=", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]
pi = ["PI_CODING_AGENT_DIR=testdata/w3-stored-key", "PIG_CODING_AGENT_DIR=", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]
pig_args = ["--offline", "--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--offline", "--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
[assert]
both_reach_ready = true
both_contain = ["No stored credentials to remove. /logout only removes credentials saved by /login; environment variables and models.json config are unchanged."]
escaped_output_equal = true
runs = 3
