# Behavior family: startup
# PORT_MAP linkage is explicit in the covers table below.
# Scenario: startup banner reaches ready
#
# Both binaries must display their startup banner within the timeout
# when launched directly via tmux (no shell). This is the most basic
# parity gate: does the binary boot at all, and within a reasonable
# wall clock?
#
# Acts as the canonical hermetic scenario: no real LLM call, only
# binary+runtime+TUI initialization.

name = "00-startup-banner"
description = "boot-only: Both pig and pi reach their ready prompt within the timeout"

covers = [
  "packages/coding-agent/src/main.ts",
]

tags = ["fast", "tui", "hermetic"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 35
# Upstream 0.99.2 mounts the footer ("(auto)") before it awaits the terminal
# colors and builds the header (interactive-mode.ts:951-1015), so the footer can
# match while the header is still absent. The ready patterns wait for the
# header's last line, which both binaries print only once the header exists.
ready_pattern_pig = "PiG can explain"
ready_pattern_pi = "Pi can explain"
ready_timeout_seconds = 15

[assert]
runs = 3
both_reach_ready = true
# D2: PiG never draws Pi's logo (the "▀▀█" of its first line).
pig_not_contain = ["▀▀█"]
# pig should boot within 1.5x pi's wall clock. Generous tolerance for
# the first scenario; we'll tighten as we baseline real numbers.
runtime_ratio_max = 1.50

# The start-up escape sequences, in order, up to the first frame (CSI ? 2026 h): the terminal mode setup both binaries write before they draw.
# floating-evidence: Pi, 20 runs of this scenario on xd6702, 2026-11-16, the terminal transcript attached before the program ran (tmux wait-for gate;
# complete from byte 0; token positions counted from 0 in the whole transcript). CSI > 4 ; 2 m is first seen at token 35 in 9 runs (before the first
# frame, token 37) and at token 204 in 11 (after it, the first frame at token 35); the OSC 0 window title follows it, at token 36 or 205. Pi writes both
# when the terminal's reply to its Kitty keyboard query arrives, which the host's load moves across the first frame. Every other sequence before the
# first frame was the same 35 tokens, in the same order, in all 20 runs.
[[assert.transcript_sequences_equal]]
window = "startup"

[[assert.transcript_sequences_equal.floating]]
sequence = "\u001b[>4;2m"
reason = "Pi writes it when the terminal answers its Kitty keyboard query; the answer's time moves it across the first frame."
evidence_runs = 20
evidence_positions = [35, 204]

[[assert.transcript_sequences_equal.floating]]
osc = 0
reason = "Pi sets the window title in the same step as the CSI > 4 ; 2 m above, and the title ends in the run's random working directory name."
evidence_runs = 20
evidence_positions = [36, 205]

[diverge]
# Upstream 1.0.0 prints its 4-cell, 2-line logo with "v<version>" beside the
# first line and the first hints beside the second (" ▀▀█  v1.0.0"). PiG draws
# its 16-cell, 7-line pig head in that slot instead (D2, owner decisions
# 2026-10-01): the composite version beside the head's first line, the
# hints, the "Press" line, the blank line and the onboarding beside the next
# ones. The head's lines with what Pi draws beside or below its logo are
# asserted verbatim; Pi's logo must not appear. The hints are compared with Pi
# in 02 and 03, and the head's pixels and colors by
# TestEveryHeadIsTheSpritesPig in coding/piglogin.
pig_contains = [
  "    ▄▄▄▄  ▄▄▄▄    v{{VERSION}}\n",
  "   ▄▀▀▀▀▄▄▀▀▀▀▄   escape interrupt",
  "  ▀▀▀▀▀▀▀▀▀▀▀▀▀▀  Press ctrl+o",
  "  ▀▀▀▀▀▀▀▀▀▀▀▀▀▀  PiG can explain",
]
pi_contains = ["▀▀█  v{{UPSTREAM_VERSION}}", "Pi can explain"]
reason = "D2 replaces Pi's logo with PiG's pig head, which carries the composite version; the onboarding names the product. Locked here so any future banner drift trips this assertion."
