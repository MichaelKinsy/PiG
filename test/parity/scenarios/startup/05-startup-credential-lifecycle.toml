# Pi 0.87.1 probe: python3 test/parity/testdata/startup-credential-lifecycle.py pi drives the real CLI in RPC mode against a loopback server.
# core/model-resolver.ts:419 selects without resolving auth; ai/src/models.ts:657 awaits getAuth on the request; auth/resolve.ts:87-109 gives stored credentials priority and consults ambient auth only when none is stored.
# Radius owns a gateway-specific OAuth handler (ai/src/providers/radius.ts:36-38). With --offline, startup must not refresh. The first prompt fails at the local token endpoint without using RADIUS_API_KEY.
# Two more running CLIs exercise OpenAI Completions and Responses: each sends a stored key, then the env key after credential deletion (the effect of logout, ai/src/models.ts:628-637), without restarting or selecting a different model.
# The wrapper asserts RPC result/error state, request order, endpoint and credential, then prints only those stable observations. No output normalization or external network is used.
name = "05-startup-credential-lifecycle"
description = "Startup defers OAuth to the first request and preserves environment fallback after logout."
covers = [
  "packages/coding-agent/src/core/model-resolver.ts",
  "packages/ai/src/auth/resolve.ts",
  "packages/ai/src/providers/radius.ts",
]
tags = ["hermetic"]
driver = "cli-mode"

[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
pig_args = ["python3", "./test/parity/testdata/startup-credential-lifecycle.py", "pig"]
pi_args = ["python3", "./test/parity/testdata/startup-credential-lifecycle.py", "pi"]

[cli]
cwd = "../../../.."
timeout_seconds = 90

[assert]
exit_code = 0
output_equal = true
both_contain = [
  "radius-dev/pi-messages: startup model=auto requests=0",
  "radius-dev: first request refresh=failed ambient-fallback=false",
  "openai/openai-completions: startup model=gpt-4o-mini requests=0",
  "openai/openai-completions: request keys=stored-key,env-key after credential deletion",
  "openai/openai-responses: startup model=gpt-4o-mini requests=0",
  "openai/openai-responses: request keys=stored-key,env-key after credential deletion",
]
runs = 3
