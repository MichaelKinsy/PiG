# Behavior family: startup
# Upstream evidence: Ctrl+O expands the startup listing of
# 07-startup-package-entry-shapes into formatScopeGroups, each resource
# relative to its Package root. Probed on Pi 0.87.1 at 220x60:
#   [Skills]
#     user
#       git:github.com/pig-parity/entry-shapes
#         skills/planner/SKILL.md
#         suite/listed.md
#         suite/nested/SKILL.md
#   [Extensions]
#     user
#       git:github.com/pig-parity/entry-shapes
#         entry-shapes
#   [Themes]
#     user
#       git:github.com/pig-parity/entry-shapes
#         .shapes/themes/shapes-theme.json
# A file skill keeps its own path, a Package theme loaded from its file lists
# that file, and the "./" extension is the package directory. PiG failed the
# Package before listing anything.
name = "08-startup-package-entry-shapes-expanded"
description = "Ctrl+O lists a Package's file skills, root Markdown skills and dot-directory theme at Pi's package-relative paths."
covers = [
  "packages/coding-agent/src/core/package-manager.ts",
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[env]
pig = ["PIG_OFFLINE=1", "PIG_CODING_AGENT_DIR=testdata/entry-shapes/pig-agent"]
pi = ["PI_OFFLINE=1", "PI_SKIP_VERSION_CHECK=1", "PI_CODING_AGENT_DIR=testdata/entry-shapes/pi-agent"]
override_base_args = true

[tmux]
# Wide enough that no listed absolute snapshot path wraps.
width = 220
height = 60
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "[Skills]"
capture_end = "shapes-theme.json"

[[tmux.steps]]
wait_visible_contains = ["shapes-theme"]

[[tmux.steps]]
keys = ["C-o"]
wait_contains = ["drop files to attach"]

[assert]
both_reach_ready = true
both_contain = ["git:github.com/pig-parity/entry-shapes", "skills/planner/SKILL.md", "suite/listed.md", "suite/nested/SKILL.md", ".shapes/themes/shapes-theme.json"]
both_not_contain = ["claude-only", "SUITE.md", "Failed to load"]
output_normalized_equal = true
runs = 3
