[env]
pig = ["PIG_HOME=testdata/model-thinking"]
pi = ["PI_CODING_AGENT_DIR=testdata/model-thinking/agent"]
pig_args = ["--offline", "--no-session", "--model", "fixture/plain"]
pi_args = ["--offline", "--no-session", "--model", "fixture/plain"]

[assert]
exit_code = 0
output_normalized_equal = true
runs = 3

# normalize-rationale: sessionId is a random UUID each process draws; the rule masks only that value inside its "sessionId" field, so the
# surrounding JSON, every other field and the field order stay compared byte for byte.
[[assert.normalize_replace]]
pattern = '"sessionId":"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"'
with = '"sessionId":"00000000-0000-0000-0000-000000000000"'
reason = "Each process draws its own random UUID session id; retain the field placement and the UUID syntax."
