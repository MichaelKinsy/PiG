# Behavior family: rpc
# Surface: commands whose fields are missing or have another JSON type.
#
# Pi 1.1.0 rpc-mode.ts handleCommand never checks field types: set_model builds "Model not found: ${provider}/${modelId}" from whatever arrived
# (undefined, null, numbers, arrays, objects), session.prompt/steer/followUp call text.startsWith on the message, set_session_name calls
# command.name.trim(), switch_session calls startsWith on its path, bash runs `${command}`, fork rejects a non-string entry id, get_entries looks the
# `since` value up by id, set_thinking_level treats a non-string as an unavailable level, and set_auto_compaction/set_auto_retry read truthiness.
# Pig decoded these into typed structs and answered with a Go decoder message, or started a run with an empty prompt. Not probed because Pig differs
# and the cause is Pi storing the raw JSON value: non-string steering and follow-up modes, and non-boolean enabled flags echoed by get_state (the
# scenario restores booleans before each get_state); compact with a non-string customInstructions (Pi's TypeError depends on session state).

name = "49-rpc-malformed-command-fields"
description = "RPC model and thinking commands across plain, reasoning and xhigh models."
covers = [
  "packages/coding-agent/src/modes/rpc/rpc-mode.ts",
  "packages/coding-agent/src/core/agent-session.ts",
]
tags = ["hermetic", "fast"]
driver = "rpc-mode"

[rpc]
canonical_json = true
timeout_seconds = 60
[[rpc.steps]]
line = '''{"id":"p00","type":"set_model"}'''
wait_contains = ['"id":"p00","type":"response"']
wait_timeout_seconds = 15

