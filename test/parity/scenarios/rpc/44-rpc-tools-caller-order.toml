# Behavior family: rpc
#
# Upstream rule (Pi 1.0.4): createAgentSession passes --tools both as the allowlist and as initialActiveToolNames (sdk.ts:271-276), and
# _refreshToolRegistry activates the initial names in the caller's order before the registered tools the allowlist matches
# (agent-session.ts:3552-3562, _applyToolLoadout 1561-1565). `--tools bash,ls,read` therefore declares bash, ls, read in that order: the
# initial system message's toolsAdded and the prompt's tool list follow it. PiG activated them in registry order (read, bash, ls).
#
# Full JSON records are compared (canonical_json sorts keys only). An explicit system prompt removes the pig/pi naming difference.

name = "44-rpc-tools-caller-order"
description = "RPC --tools bash,ls,read declares the tools in the --tools order"
covers = [
  "packages/coding-agent/src/main.ts",
  "packages/coding-agent/src/core/sdk.ts",
  "packages/coding-agent/src/core/agent-session.ts",
  "packages/coding-agent/src/modes/rpc/rpc-mode.ts",
]
tags = ["hermetic", "fast"]
driver = "rpc-mode"

[rpc]
canonical_json = true
timeout_seconds = 20

[[rpc.steps]]
line = '{"id":"p1","type":"prompt","message":"Run: expr 20 + 22"}'
wait_contains = ['"type":"agent_settled"']
wait_timeout_seconds = 10
[[rpc.steps]]
line = '{"id":"messages","type":"get_messages"}'
wait_contains = ['"command":"get_messages","success":true']
wait_timeout_seconds = 10

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_HOME=testdata/pig-home"]
pig_args = ["--offline", "--model", "test-faux/faux-1", "--tools", "bash,ls,read", "--system-prompt", "RPC tool flag probe.", "--no-context-files", "--no-skills", "--session-dir", "{{TEMP}}/sessions"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pi_args = ["--offline", "--model", "test-faux/faux-1", "--tools", "bash,ls,read", "--system-prompt", "RPC tool flag probe.", "--no-context-files", "--no-skills", "--session-dir", "{{TEMP}}/sessions"]

[assert]
exit_code = 0
json_output_equal = true
stderr_equal = true
runs = 3
both_contain = [
  '"text":"42\n"',
  '"isError":false',
]
[[assert.json_aliases]]
paths = ["/**/sections/cwd"]
kind = "path"
reason = "D2: alias only the exact isolated cwd embedded in the system section; retain its tags, whitespace and suffix."
[[assert.json_aliases]]
paths = ["/**/timestamp"]
kind = "timestamp"
reason = "Independent message wall clocks vary; retain field presence, timestamp type and valid syntax."
[[assert.json_aliases]]
paths = ["/**/wall_time_seconds", "/**/durationMs"]
kind = "duration"
reason = "bash.ts:392 measures the command's wall clock and rounds it to 0.1 s, so a loaded host reports 0 or 0.1 for the same command; retain the field's presence, its position and Pi's one-decimal number spelling."

[[assert.json_aliases]]
paths = ["/**/durationMs"]
kind = "duration_ms"
reason = "Pi 1.1.0 (#10549) stamps durationMs from a monotonic clock, so two runs differ by whole milliseconds; retain the field's presence, placement and non-negative integer spelling."
