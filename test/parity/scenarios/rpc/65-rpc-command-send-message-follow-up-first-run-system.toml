# Pi 1.3.0 sendCustomMessage starts an idle session's run with _startRun({ messageType: "custom", message }) whatever deliverAs says: deliverAs "followUp" only chooses between agent.followUp and agent.steer while the session streams (agent-session.ts:2246-2282). The run's system patch lists the extension's tool snippet.
# A websearch extension's /google-account sends its result with triggerTurn and deliverAs "followUp"; its first run must reach the provider with the system prompt.
name = "65-rpc-command-send-message-follow-up-first-run-system"
description = "An extension command's triggerTurn followUp sendMessage starts the session's first run with the system prompt"
covers = ["packages/coding-agent/src/core/agent-session.ts", "packages/coding-agent/src/modes/rpc/rpc-mode.ts"]
tags = ["hermetic", "fast"]
driver = "rpc-mode"

[rpc]
timeout_seconds = 20

[[rpc.steps]]
line = '{"id":"cmd","type":"prompt","message":"/report"}'
wait_event = '{"type":"agent_settled","aborted":false}'
wait_timeout_seconds = 10

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_HOME=testdata/pig-home"]
pig_extensions = ["testdata/command-send-message-follow-up-first-run.mjs"]
pig_args = ["--model", "test-faux/faux-1", "--no-session", "--no-extensions", "--no-context-files", "--no-skills"]
pi_extensions = ["../../testdata/test-faux-provider.ts", "testdata/command-send-message-follow-up-first-run.mjs"]
pi_args = ["--model", "test-faux/faux-1", "--no-session", "--no-extensions", "--no-context-files", "--no-skills"]

[assert]
json_output_equal = true
stderr_equal = true
exit_code = 0
runs = 5
both_contain = ['"id":"cmd","type":"response","command":"prompt","success":true', '"customType":"report"', '"sections"', '- snippet_tool: Use snippet_tool for the snippet work.', '"type":"agent_settled"']
both_not_contain = ['"success":false', 'extension_error']

[[assert.json_aliases]]
paths = ["/*/id", "/**/sessionId"]
kind = "id"
group = "runtime"
pattern = '^[0-9a-f-]{36}$'
reason = "Session and UI request UUIDs vary. A bijection preserves distinct identities; the literal command ID remains unchanged."

[[assert.json_aliases]]
paths = ["/**/sections/cwd"]
kind = "path"
reason = "Only the exact isolated cwd varies in the system prompt sections; retain every other byte."

[[assert.json_aliases]]
paths = ["/**/timestamp"]
kind = "timestamp"
reason = "Independent message clocks vary; retain presence, numeric/string type and valid syntax."

[[assert.json_aliases]]
paths = ["/**/durationMs"]
kind = "duration"
reason = "Pi 1.1.0 measures each response and tool execution (#10549) with a monotonic clock; the value varies per run. Retain presence, type and position."

[[assert.json_aliases]]
paths = ["/**/sections/docs"]
kind = "path"
roots = ["readme", "docs", "examples"]
reason = "D2/D22: compare Pi's package README/docs/examples destinations with PiG's materialized README/docs and hosted examples root. Alias only those exact runtime destinations; retain filenames, URL/path suffixes, all surrounding wording and whitespace."

[[assert.json_aliases]]
paths = ["/**/sections/preamble"]
kind = "literal"
pig = "operating inside pig,"
pi = "operating inside pi,"
reason = "D2: only the host command identity differs in the preamble; retain the rest of the complete sentence."

[[assert.json_aliases]]
paths = ["/**/sections/docs"]
kind = "literal"
pig = "PiG documentation ("
pi = "Pi documentation ("
reason = "D2/D22: the documentation heading names the product; all usage conditions and topic wording remain compared."

[[assert.json_aliases]]
paths = ["/**/sections/docs"]
kind = "literal"
pig = "asks about pig itself,"
pi = "asks about pi itself,"
reason = "D2: this exact heading clause names the host command; no other words in the read-only condition are aliased."

[[assert.json_aliases]]
paths = ["/**/sections/docs"]
kind = "literal"
pig = "When reading pig docs or examples,"
pi = "When reading pi docs or examples,"
reason = "D2/D22: the path-resolution instruction names its product; retain its complete resolution rule and relative paths."

[[assert.json_aliases]]
paths = ["/**/sections/docs"]
kind = "literal"
pig = "pig packages (docs/packages.md)"
pi = "pi packages (docs/packages.md)"
reason = "D2: only the product name in the Package topic differs; the packages.md destination and every other topic remain literal."

[[assert.json_aliases]]
paths = ["/**/sections/docs"]
kind = "literal"
pig = "When working on pig topics,"
pi = "When working on pi topics,"
reason = "D2: this exact instruction prefix names the host product; retain its complete-read and cross-reference requirements."

[[assert.json_aliases]]
paths = ["/**/sections/docs"]
kind = "literal"
pig = "Always read pig .md files"
pi = "Always read pi .md files"
reason = "D2/D22: this exact instruction prefix names the product documentation; retain completely, link-following instructions, and the TUI example."
