# Behavior family: rpc
# Surface: 71-rpc-deferred-ui-after-response with a second extension whose model_select listener the host dispatches after the first one's, so the first one's timer can fire in the gap. PiG packs both into one Node runtime process.
#
# Pi awaits the listener inside the command, and every await after it is a microtask, so rpc-mode.ts writes the command's response before the timer's macrotask runs: the toast follows the response.
# PiG ran the extension in a Node subprocess and the timer fired while the listener's result crossed the process boundary, so the toast came first (found with @liyu1981/pi-tweaks' remember-model on Pi 1402973a).

name = "72-rpc-deferred-ui-packed-extensions"
description = "A toast an extension defers with setTimeout(0) from model_select reaches the RPC output after the command's response when a second packed extension listens too"
covers = [
  "packages/coding-agent/src/modes/rpc/rpc-mode.ts",
  "packages/coding-agent/src/core/agent-session-runtime.ts",
  "packages/coding-agent/src/core/extensions/runner.ts",
]
tags = ["hermetic", "fast"]
driver = "rpc-mode"

[rpc]
canonical_json = true
timeout_seconds = 20

[[rpc.steps]]
line = '{"id":"new","type":"new_session"}'
wait_contains = ['"id":"new","type":"response","command":"new_session"', '"message":"deferred:model-two"']
wait_timeout_seconds = 10
[[rpc.steps]]
line = '{"id":"set","type":"set_model","provider":"fixture","modelId":"model-three"}'
wait_contains = ['"id":"set","type":"response","command":"set_model"', '"message":"deferred:model-three"']
wait_timeout_seconds = 10
[[rpc.steps]]
line = '{"id":"cycle","type":"cycle_model"}'
wait_contains = ['"id":"cycle","type":"response","command":"cycle_model"', '"message":"deferred:model-one"']
wait_timeout_seconds = 10

[env]
pig = ["PIG_HOME=testdata/multi-model"]
pi = ["PI_CODING_AGENT_DIR=testdata/multi-model/agent"]
pig_extensions = ["testdata/deferred-model-toast.ts", "testdata/deferred-model-toast-b.ts"]
pi_extensions = ["testdata/deferred-model-toast.ts", "testdata/deferred-model-toast-b.ts"]
pig_args = ["--offline", "--no-session", "--model", "fixture/model-one"]
pi_args = ["--offline", "--no-session", "--model", "fixture/model-one"]

[assert]
exit_code = 0
json_output_equal = true
stderr_equal = true
both_contain = ['"message":"deferred:model-two"', '"message":"deferred:model-three"', '"message":"deferred:model-one"']
runs = 3
[[assert.json_aliases]]
paths = ["/*/id"]
kind = "id"
group = "ui"
pattern = '^[0-9a-f-]{36}$'
reason = "Notify request UUIDs vary per process. The comparator preserves one-to-one identity correspondence."
