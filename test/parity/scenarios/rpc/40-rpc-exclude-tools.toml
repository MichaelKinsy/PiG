# Behavior family: rpc
#
# Upstream evidence (Pi 0.87.1, probed with the exact published comparator): main.ts:541-543 copies
# parsed.excludeTools into the session options for every mode and main.ts:822-830 passes them to
# createAgentSessionFromServices; sdk.ts:261-265 removes them from the initial active tools and
# agent-session.ts:3147-3150 (isAllowedTool) removes them from the registry. In `--mode rpc` the faux
# "Run: expr 20 + 22" bash call therefore ends with the unknown-tool error "Tool bash not found" and
# the declared tools are read, edit and write. PiG 0.3.0 ignored the flag in RPC mode and ran the command (42).
#
# Full JSON records are compared (canonical_json sorts keys only): the initial system message's toolsAdded, the tool_execution_end
# result and the persisted messages must equal Pi's. An explicit system prompt removes the pig/pi naming difference.

name = "40-rpc-exclude-tools"
description = "RPC --exclude-tools makes an excluded tool undeclared and uncallable as in every other mode"
covers = [
  "packages/coding-agent/src/main.ts",
  "packages/coding-agent/src/core/sdk.ts",
  "packages/coding-agent/src/core/agent-session.ts",
  "packages/coding-agent/src/modes/rpc/rpc-mode.ts",
]
tags = ["hermetic", "fast"]
driver = "rpc-mode"

[rpc]
canonical_json = true
timeout_seconds = 20

[[rpc.steps]]
line = '{"id":"p1","type":"prompt","message":"Run: expr 20 + 22"}'
wait_contains = ['"type":"agent_settled"']
wait_timeout_seconds = 10
[[rpc.steps]]
line = '{"id":"messages","type":"get_messages"}'
wait_contains = ['"command":"get_messages","success":true']
wait_timeout_seconds = 10

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_HOME=testdata/pig-home"]
pig_args = ["--offline", "--model", "test-faux/faux-1", "--exclude-tools", "bash", "--system-prompt", "RPC tool flag probe.", "--no-context-files", "--no-skills", "--session-dir", "{{TEMP}}/sessions"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pi_args = ["--offline", "--model", "test-faux/faux-1", "--exclude-tools", "bash", "--system-prompt", "RPC tool flag probe.", "--no-context-files", "--no-skills", "--session-dir", "{{TEMP}}/sessions"]

[assert]
exit_code = 0
json_output_equal = true
stderr_equal = true
runs = 3
both_contain = [
  '"text":"Tool bash not found"',
  '"isError":true',
]
both_not_contain = ['"text":"42\n"']
[[assert.json_aliases]]
paths = ["/**/sections/cwd"]
kind = "path"
reason = "D2: alias only the exact isolated cwd embedded in the system section; retain its tags, whitespace and suffix."
[[assert.json_aliases]]
paths = ["/**/timestamp"]
kind = "timestamp"
reason = "Independent message wall clocks vary; retain field presence, timestamp type and valid syntax."

[[assert.json_aliases]]
paths = ["/**/durationMs"]
kind = "duration"
reason = "Pi 1.1.0 measures each response and tool execution (#10549) with a monotonic clock; the value varies per run. Retain presence, type and position."
