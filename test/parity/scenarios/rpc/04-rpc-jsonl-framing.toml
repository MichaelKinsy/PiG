# Pi 0.87.1 jsonl.ts splits on LF, strips CR, and delivers empty lines to JSON.parse.
# The exact empty-line diagnostic is compared, not replaced with an envelope placeholder.
name = "04-rpc-jsonl-framing"
description = "CRLF, empty lines and pipelined requests preserve complete JSON records"
covers = ["packages/coding-agent/src/modes/rpc/jsonl.ts"]
tags = ["hermetic", "fast"]
driver = "rpc-mode"

[rpc]
timeout_seconds = 15
[[rpc.steps]]
line = "\r\n{\"type\":\"set_session_name\",\"name\":\"framing-test\"}\r\n{\"type\":\"set_auto_retry\",\"enabled\":true}\n{\"id\":\"z\",\"type\":\"hello\"}"
wait_event = '{"type":"response","id":"z","command":"hello"}'
wait_timeout_seconds = 10

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_HOME=testdata/pig-home"]
pig_args = ["--offline", "--model", "test-faux/echo", "--session-dir", "{{TEMP}}/sessions"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pi_args = ["--offline", "--session-dir", "{{TEMP}}/sessions"]

[assert]
exit_code = 0
json_output_equal = true
stderr_equal = true
runs = 3
