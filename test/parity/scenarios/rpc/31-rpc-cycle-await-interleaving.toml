# Pi 0.87.1 agent-session.ts:2178-2238 applies each cycle's model synchronously, then awaits model_select. rpc-mode.ts:810-811 starts later commands without waiting for that listener.
# The first listener is held by an RPC select request. The second cycle must finish before it is released; no delay guesses are involved.
name = "31-rpc-cycle-await-interleaving"
description = "A blocked model_select listener does not serialize later model cycles or immediate responses"
covers = ["packages/coding-agent/src/modes/rpc/rpc-mode.ts", "packages/coding-agent/src/core/agent-session.ts"]
tags = ["hermetic", "fast"]
driver = "rpc-mode"

[rpc]
canonical_json = true
timeout_seconds = 20
[[rpc.steps]]
line = '{"id":"arm","type":"prompt","message":"/block-model-select"}'
wait_contains = ['"id":"arm","type":"response","command":"prompt","success":true']
wait_timeout_seconds = 10
[[rpc.steps]]
line = '{"id":"one","type":"cycle_model"}'
wait_contains = ['"title":"Model selected"']
wait_timeout_seconds = 10
[[rpc.steps]]
line = '''{"id":"two","type":"cycle_model"}
{"id":"abort-retry","type":"abort_retry"}'''
wait_contains = ['"id":"two","type":"response","command":"cycle_model","success":true']
wait_timeout_seconds = 10
[[rpc.steps]]
line = '''{"type":"extension_ui_response","id":"{{RPC_REQUEST_ID}}","value":"continue"}
{"id":"after-release","type":"abort_retry"}'''
wait_contains = ['"id":"one","type":"response","command":"cycle_model","success":true', '"id":"after-release","type":"response","command":"abort_retry","success":true']
wait_timeout_seconds = 10

[env]
pig = ["PIG_HOME=testdata/multi-model"]
pi = ["PI_CODING_AGENT_DIR=testdata/multi-model/agent"]
pig_extensions = ["../../../../coding/cli/testdata/rpc-ui.mjs"]
pi_extensions = ["../../../../coding/cli/testdata/rpc-ui.mjs"]
pig_args = ["--offline", "--no-session", "--model", "fixture/model-one"]
pi_args = ["--offline", "--no-session", "--model", "fixture/model-one"]

[assert]
exit_code = 0
json_output_equal = true
stderr_equal = true
both_contain = ['"id":"model-two"', '"id":"model-three"']
runs = 3
[[assert.json_aliases]]
paths = ["/*/id"]
kind = "id"
group = "ui"
pattern = '^[0-9a-f-]{36}$'
reason = "Select request UUIDs vary per process. The driver replies with the actual ID and the comparator preserves one-to-one identity correspondence."
