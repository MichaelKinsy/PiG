# Pi 0.87.1 rpc-mode.ts:366-378,728-744: SIGTERM disposes the runtime, detaches input and exits 143.
# The driver keeps stdin open until the child exits. Closing stdin first would hide the idle-RPC leak.
name = "29-rpc-sigterm-open-stdin"
description = "SIGTERM ends idle RPC with status 143 while its client keeps stdin open"
covers = ["packages/coding-agent/src/modes/rpc/rpc-mode.ts"]
tags = ["hermetic", "fast", "posix-signals"]
driver = "rpc-mode"

[rpc]
terminate = true
timeout_seconds = 15
[[rpc.steps]]
line = '{"id":"ready","type":"foobar"}'
wait_event = '{"type":"response","id":"ready","command":"foobar","success":false}'
wait_timeout_seconds = 10

[env]
pig_args = ["--offline", "--no-extensions", "--no-session"]
pi_args = ["--offline", "--no-extensions", "--no-session"]

[assert]
exit_code = 143
output_equal = true
stderr_equal = true
runs = 3
