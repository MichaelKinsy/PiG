# Behavior family: rpc
#
# Upstream evidence (Pi 0.87.1, probed with the exact published comparator): main.ts:532-540 sets
# noTools "all" and tools together; sdk.ts:258-265 computes allowedToolNames = tools ?? (noTools === "all"
# ? [] : undefined) and initialActiveToolNames = tools ?? (noTools ? [] : defaults), so `--no-tools
# --tools bash` leaves bash active. In `--mode rpc` the faux "Run: expr 20 + 22" call prints 42.
# PiG let --no-tools win in every mode and answered "Tool bash not found".
#
# Full JSON records are compared (canonical_json sorts keys only): the initial system message's toolsAdded, the tool_execution_end
# result and the persisted messages must equal Pi's. An explicit system prompt removes the pig/pi naming difference.

name = "41-rpc-tools-allowlist-overrides-no-tools"
description = "RPC --no-tools --tools bash keeps bash declared and callable"
covers = [
  "packages/coding-agent/src/main.ts",
  "packages/coding-agent/src/core/sdk.ts",
  "packages/coding-agent/src/core/agent-session.ts",
  "packages/coding-agent/src/modes/rpc/rpc-mode.ts",
]
tags = ["hermetic", "fast"]
driver = "rpc-mode"

[rpc]
canonical_json = true
timeout_seconds = 20

[[rpc.steps]]
line = '{"id":"p1","type":"prompt","message":"Run: expr 20 + 22"}'
wait_contains = ['"type":"agent_settled"']
wait_timeout_seconds = 10
[[rpc.steps]]
line = '{"id":"messages","type":"get_messages"}'
wait_contains = ['"command":"get_messages","success":true']
wait_timeout_seconds = 10

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_HOME=testdata/pig-home"]
pig_args = ["--offline", "--model", "test-faux/faux-1", "--no-tools", "--tools", "bash", "--system-prompt", "RPC tool flag probe.", "--no-context-files", "--no-skills", "--session-dir", "{{TEMP}}/sessions"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pi_args = ["--offline", "--model", "test-faux/faux-1", "--no-tools", "--tools", "bash", "--system-prompt", "RPC tool flag probe.", "--no-context-files", "--no-skills", "--session-dir", "{{TEMP}}/sessions"]

[assert]
exit_code = 0
json_output_equal = true
stderr_equal = true
runs = 3
both_contain = [
  '"text":"42\n"',
  '"isError":false',
]
both_not_contain = ['Tool bash not found']
[[assert.json_aliases]]
paths = ["/**/sections/cwd"]
kind = "path"
reason = "D2: alias only the exact isolated cwd embedded in the system section; retain its tags, whitespace and suffix."
[[assert.json_aliases]]
paths = ["/**/timestamp"]
kind = "timestamp"
reason = "Independent message wall clocks vary; retain field presence, timestamp type and valid syntax."
