# Behavior family: rpc
# Surface: runtime handling of syntactically valid JSON values outside the
# compile-time TypeScript unions. Pi passes these values to Session methods and
# reports their actual command outcomes instead of adding RPC-only validation.

name = "20-rpc-runtime-boundary-values"
description = "RPC command values follow Pi runtime handling after JSON parsing."
covers = [
  "packages/coding-agent/src/modes/rpc/rpc-mode.ts",
  "packages/coding-agent/src/core/agent-session.ts",
]
tags = ["hermetic", "fast"]
driver = "rpc-mode"

[rpc]
timeout_seconds = 15
# One pipe write defines the queue/prompt input batch. Pi rpc-mode.ts:393-424 awaits input and preflight before marking the run active; the prompt preflight reply precedes the nested queue replies.
# Shell exit and provider completion are independent external operations (rpc-mode.ts:563-583). The shell step uses an explicit completion boundary; a separate held-Provider regression proves shell replies never wait for agent settlement.
[[rpc.steps]]
line = '''{"id":"model","type":"set_model","provider":"","modelId":""}
{"id":"steering-mode","type":"set_steering_mode","mode":"bogus"}
{"id":"follow-mode","type":"set_follow_up_mode","mode":"bogus"}
{"id":"steer","type":"steer","message":""}
{"id":"follow","type":"follow_up","message":""}
{"id":"switch","type":"switch_session","sessionPath":""}
{"id":"fork","type":"fork","entryId":""}
{"id":"prompt","type":"prompt","message":""}'''
wait_event = '{"type":"agent_settled"}'
wait_timeout_seconds = 10

[[rpc.steps]]
line = '''{"id":"reject-steer","type":"steer","message":"/queue-target"}
{"id":"reject-follow","type":"follow_up","message":"/queue-target"}
{"id":"after-rejections","type":"abort_retry"}'''
wait_event = '{"type":"response","id":"reject-follow","command":"follow_up"}'
wait_timeout_seconds = 10

[[rpc.steps]]
line = '''{"id":"bash","type":"bash","command":""}
{"id":"after-bash","type":"abort_retry"}'''
wait_event = '{"type":"response","id":"bash","command":"bash"}'
wait_timeout_seconds = 10

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_HOME=testdata/pig-home"]
# Use the same explicit prompt to isolate runtime values from D2/D22's documented built-in prompt differences. No output section is removed.
pig_args = ["--model", "test-faux/faux-1", "--session-dir", "{{TEMP}}/sessions", "--system-prompt", "RPC runtime values.", "--no-context-files", "--no-skills"]
pig_extensions = ["testdata/queue-target.mjs"]
pi_extensions = ["../../testdata/test-faux-provider.ts", "testdata/queue-target.mjs"]
pi_args = ["--model", "test-faux/faux-1", "--session-dir", "{{TEMP}}/sessions", "--system-prompt", "RPC runtime values.", "--no-context-files", "--no-skills"]

[assert]
json_output_equal = true
stderr_equal = true
exit_code = 0
both_contain = [
  '"id":"model","type":"response","command":"set_model","success":false,"error":"Model not found: /"',
  '"id":"steering-mode","type":"response","command":"set_steering_mode","success":true',
  '"id":"follow-mode","type":"response","command":"set_follow_up_mode","success":true',
  '"id":"steer","type":"response","command":"steer","success":true,"data":{"disposition":"queued"}',
  '"id":"follow","type":"response","command":"follow_up","success":true,"data":{"disposition":"queued"}',
  '"id":"switch","type":"response","command":"switch_session","success":false,"error":"EISDIR: illegal operation on a directory, read"',
  '"id":"fork","type":"response","command":"fork","success":false,"error":"Invalid entry ID for forking"',
  '"id":"bash","type":"response","command":"bash","success":true',
  '"output":""',
  '"id":"prompt","type":"response","command":"prompt","success":true,"data":{"disposition":"started"}',
]
both_not_contain = [
  'message is required',
  'provider and modelId are required',
  'invalid steering mode',
  'invalid follow-up mode',
]
runs = 3

[[assert.json_aliases]]
paths = ["/**/sections/cwd"]
kind = "path"
reason = "Only the exact isolated cwd varies in the explicit system prompt; retain section structure and all text outside that root."
[[assert.json_aliases]]
paths = ["/**/timestamp"]
kind = "timestamp"
reason = "Independent entry and message clocks vary; preserve field presence, timestamp type and syntax."
