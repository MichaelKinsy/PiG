# Behavior family: rpc
# Surface: rpc-mode.ts:808-810 dispatches every stdin line at once (`void handleInputLine(line)`), so a command that awaits a Session replacement or an export does not delay the next command of its batch.
# Probed on Pi 1.1.0 (comb-audit row 58: a probe that sends each command and a get_state in one write): with stdin held open, `new_session`, `fork`, `clone`, `switch_session` and `export_html` followed by `get_state` answer `get_state` first, and it still reports the OLD sessionFile; the replacement answers afterwards. Before the fix pig answered the replacement first and get_state reported the new file.
# The export step runs first so the active Session is still the fixture when new_session replaces it; the steps wait for both responses of a batch.

name = "55-rpc-replacement-concurrent-get-state"
description = "RPC get_state after a Session-replacing command or export_html in one batch answers first from the old Session"
covers = [
  "packages/coding-agent/src/modes/rpc/rpc-mode.ts",
  "packages/coding-agent/src/core/agent-session-runtime.ts",
]
tags = ["hermetic", "fast"]
driver = "rpc-mode"

[rpc]
cwd = "testdata/session"
timeout_seconds = 20

[[rpc.steps]]
line = '''{"id":"export","type":"export_html","outputPath":"{{TEMP}}/session.html"}
{"id":"state-1","type":"get_state"}'''
wait_contains = ['"id":"export","type":"response","command":"export_html"', '"id":"state-1","type":"response","command":"get_state"']
wait_timeout_seconds = 10
[[rpc.steps]]
line = '''{"id":"new","type":"new_session"}
{"id":"state-2","type":"get_state"}'''
wait_contains = ['"id":"new","type":"response","command":"new_session"', '"id":"state-2","type":"response","command":"get_state"']
wait_timeout_seconds = 10

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_HOME=testdata/pig-home"]
pig_args = ["--model", "test-faux/faux-1", "--session", "sessions/source.jsonl", "--session-dir", "{{TEMP}}/sessions"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pi_args = ["--model", "test-faux/faux-1", "--session", "sessions/source.jsonl", "--session-dir", "{{TEMP}}/sessions"]

[assert]
exit_code = 0
json_output_equal = true
stderr_equal = true
runs = 3

[[assert.json_aliases]]
paths = ["/*/data/path"]
kind = "path"
roots = ["temp"]
reason = "D2: each process owns a separate exact temporary root for the export. Compare the complete suffix under it."
[[assert.json_aliases]]
paths = ["/*/data/sessionFile"]
kind = "path"
roots = ["cwd"]
reason = "The runner copies the fixture into one cwd snapshot per process; --session names sessions/source.jsonl inside it. Compare the complete suffix, so a get_state that reports the replacement's file fails."
