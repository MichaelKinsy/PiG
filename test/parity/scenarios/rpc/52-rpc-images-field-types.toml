# Behavior family: rpc
# Surface: the images field of prompt, steer and follow_up when its value or its elements are not what the typed protocol names.
#
# Pi 1.1.0 rpc-mode.ts hands command.images to session.prompt/steer/followUp unchecked. prompt converts each image (Buffer.from(data, "base64") then
# mimeType.split) and answers the first failure with Node's or V8's message; a truthy non-array answers "images is not iterable"; steer and follow_up
# spread the array ("Spread syntax requires ...iterable[Symbol.iterator] to be a function" for a truthy non-iterable) and queue malformed images.
# Pig answered with Go decoder messages and started a run for a malformed image. Known differences kept out of the probes: Pi queues malformed
# images in steer and follow_up, Pig drops them; and when steer/follow_up fail on the spread, Pi has already put the text in its queue display state (the
# next clear_queue returns it), Pig fails before queueing. clear_queue after each probe keeps both queues empty. A valid image that starts a run is not probed
# here (scenario 06 covers prompt through the faux provider). A falsy images value (false, 0, an empty array) is no image, so its prompt
# does start a run; those steps wait for agent_settled, because the next clear_queue otherwise races the run's streamed events and Pig and Pi
# interleave them differently by timing.

name = "52-rpc-images-field-types"
description = "Malformed images in prompt, steer and follow_up answer with Pi's messages"
covers = [
  "packages/coding-agent/src/modes/rpc/rpc-mode.ts",
  "packages/coding-agent/src/core/agent-session.ts",
]
tags = ["hermetic", "fast"]
driver = "rpc-mode"

[rpc]
canonical_json = false
timeout_seconds = 120
[[rpc.steps]]
line = '{"id":"i01","type":"prompt","message":"What is 20+22?","images":"x"}'
wait_contains = ['"id":"i01","type":"response"']
wait_timeout_seconds = 15

[[rpc.steps]]
