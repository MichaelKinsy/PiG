# Pi 0.87.1 agent-session.ts:1634-1767 awaits input, before_agent_start and image normalization before accepting a prompt. Queue input in the same JSONL batch advances during those awaits.
# rpc-mode.ts:393-424,786-811 and agent-session.ts:1823-1903 place both queue_update records before prompt acceptance, then agent_start, then the steer/follow_up replies, then turn_start (agent-loop.ts:116-117).
# One pipe write defines the input batch. agent_settled, not a delay, ends capture. Compare every record through settlement, including both consumed messages and replies. The explicit system prompt controls the D2/D22 configuration inputs without masking any output.
name = "13-rpc-steering-queue"
description = "RPC prompt preflight admits both queues before accepting and consuming them in order."
covers = [
  "packages/coding-agent/src/modes/rpc/rpc-mode.ts",
  "packages/coding-agent/src/core/agent-session.ts",
  # Agent.prompt claims the run and dispatches its first event before the queued replies; the complete stream checks its queued-message execution as well.
  "packages/agent/src/agent.ts",
]
tags = ["hermetic", "fast"]
driver = "rpc-mode"

[rpc]
canonical_json = true
timeout_seconds = 15
[[rpc.steps]]
line = '''{"id":"prompt","type":"prompt","message":"TUI_LIVE_STREAM"}
{"id":"steer","type":"steer","message":"What is 20+22?"}
{"id":"follow","type":"follow_up","message":"Remember this exact code: letters A L P H A and digits 7 7 4 9"}'''
wait_contains = ['"type":"agent_settled"']
wait_timeout_seconds = 10

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_HOME=testdata/pig-home"]
pig_args = ["--model", "test-faux/faux-1", "--system-prompt", "RPC queue probe.", "--no-context-files", "--no-skills", "--session-dir", "{{TEMP}}/sessions"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pi_args = ["--model", "test-faux/faux-1", "--system-prompt", "RPC queue probe.", "--no-context-files", "--no-skills", "--session-dir", "{{TEMP}}/sessions"]

[assert]
exit_code = 0
json_output_equal = true
stderr_equal = true
both_contain = [
  '"command":"prompt","data":{"disposition":"started"},"id":"prompt","success":true,"type":"response"',
  '"command":"steer","data":{"disposition":"queued"},"id":"steer","success":true,"type":"response"',
  '"command":"follow_up","data":{"disposition":"queued"},"id":"follow","success":true,"type":"response"',
  '"steering":["What is 20+22?"]',
  '"followUp":["Remember this exact code: letters A L P H A and digits 7 7 4 9"]',
  '"followUp":[],"steering":[],"type":"queue_update"',
  '"delta":"42"',
  '"delta":"Alpha"',
]
both_not_contain = ['"success":false', 'Agent is already processing']
runs = 3

[[assert.json_aliases]]
paths = ["/**/timestamp"]
kind = "timestamp"
reason = "Independent message wall clocks vary; retain field presence, type, string whitespace and every event."
[[assert.json_aliases]]
paths = ["/**/sections/cwd"]
kind = "path"
reason = "D2: alias only the exact isolated cwd embedded in the system section; retain its tags, whitespace and suffix."
