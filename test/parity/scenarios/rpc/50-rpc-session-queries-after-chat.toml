# Behavior family: rpc
# Surface: read-only and session commands after one faux conversation: get_messages, get_session_stats, get_last_assistant_text, get_fork_messages,
# get_entries, get_tree, get_commands, set_session_name, get_state, export_html, clone and new_session.
#
# Measured against Pi 1.1.0 with no difference; the scenario guards those answers (entry ids, session ids, clocks and temp paths are normalized).

name = "50-rpc-session-queries-after-chat"
description = "Session query commands after a faux conversation answer like Pi 1.1.0."
covers = [
  "packages/coding-agent/src/modes/rpc/rpc-mode.ts",
  "packages/coding-agent/src/core/agent-session.ts",
]
tags = ["hermetic", "fast"]
driver = "rpc-mode"

[rpc]
canonical_json = false
timeout_seconds = 40
[[rpc.steps]]
line = '{"id":"p1","type":"prompt","message":"What is 20+22?"}'
wait_contains = ['"type":"agent_settled"']
wait_timeout_seconds = 10

[[rpc.steps]]
line = '{"id":"c00","type":"get_messages"}'
wait_contains = ['"id":"c00","type":"response"']
wait_timeout_seconds = 15

[[rpc.steps]]
line = '{"id":"c01","type":"get_session_stats"}'
wait_contains = ['"id":"c01","type":"response"']
wait_timeout_seconds = 15

[[rpc.steps]]
line = '{"id":"c02","type":"get_last_assistant_text"}'
wait_contains = ['"id":"c02","type":"response"']
wait_timeout_seconds = 15

[[rpc.steps]]
line = '{"id":"c03","type":"get_fork_messages"}'
wait_contains = ['"id":"c03","type":"response"']
wait_timeout_seconds = 15

[[rpc.steps]]
line = '{"id":"c04","type":"get_entries"}'
wait_contains = ['"id":"c04","type":"response"']
wait_timeout_seconds = 15

[[rpc.steps]]
line = '{"id":"c05","type":"get_tree"}'
wait_contains = ['"id":"c05","type":"response"']
wait_timeout_seconds = 15

[[rpc.steps]]
line = '{"id":"c06","type":"get_commands"}'
wait_contains = ['"id":"c06","type":"response"']
wait_timeout_seconds = 15

[[rpc.steps]]
line = '{"id":"c07","type":"set_session_name","name":"  probe name  "}'
wait_contains = ['"id":"c07","type":"response"']
wait_timeout_seconds = 15

[[rpc.steps]]
line = '{"id":"c08","type":"get_state"}'
wait_contains = ['"id":"c08","type":"response"']
wait_timeout_seconds = 15

[[rpc.steps]]
line = '{"id":"c09","type":"get_session_stats"}'
wait_contains = ['"id":"c09","type":"response"']
wait_timeout_seconds = 15

[[rpc.steps]]
line = '{"id":"c10","type":"get_tree"}'
wait_contains = ['"id":"c10","type":"response"']
wait_timeout_seconds = 15

[[rpc.steps]]
line = '{"id":"c11","type":"get_commands"}'
wait_contains = ['"id":"c11","type":"response"']
