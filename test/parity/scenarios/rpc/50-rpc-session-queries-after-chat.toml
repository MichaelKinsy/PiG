[[rpc.steps]]
line = '{"id":"e00","type":"get_messages"}'
wait_contains = ['"id":"e00","type":"response"']
wait_timeout_seconds = 15

[[rpc.steps]]
line = '{"id":"e01","type":"get_entries"}'
wait_contains = ['"id":"e01","type":"response"']
wait_timeout_seconds = 15

[[rpc.steps]]
line = '{"id":"e02","type":"get_last_assistant_text"}'
wait_contains = ['"id":"e02","type":"response"']
wait_timeout_seconds = 15

[[rpc.steps]]
line = '{"id":"e03","type":"get_session_stats"}'
wait_contains = ['"id":"e03","type":"response"']
wait_timeout_seconds = 15

