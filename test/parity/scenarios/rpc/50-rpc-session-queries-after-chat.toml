[env]
pig = ["PIG_TEST_FAUX=1", "PIG_HOME=testdata/pig-home"]
pig_args = ["--model", "test-faux/faux-1", "--system-prompt", "RPC chat probe.", "--no-context-files", "--no-skills", "--session-dir", "{{TEMP}}/sessions"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pi_args = ["--model", "test-faux/faux-1", "--system-prompt", "RPC chat probe.", "--no-context-files", "--no-skills", "--session-dir", "{{TEMP}}/sessions"]

[assert]
exit_code = 0
output_normalized_equal = true
runs = 3

# normalize-rationale: Only independent clocks and the isolated cwd identity vary; retain every other byte and property order.
# Snapshot cwd roots differ only by their isolated random suffix.
[[assert.normalize_replace]]
pattern = 'parity-snap-cwd-[0-9]{10}'
with = 'parity-snap-cwd-0000000000'
reason = "Alias the isolated working-directory identity while preserving path suffixes and content."

[[assert.normalize_replace]]
pattern = '"timestamp":[0-9]+'
with = '"timestamp":0'
reason = "Independent numeric wall clocks vary; retain field placement, type and every other byte."
[[assert.normalize_replace]]
pattern = '"timestamp":"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z"'
with = '"timestamp":"2000-01-01T00:00:00.000Z"'
reason = "Independent ISO wall clocks vary; preserve the string type and exact timestamp syntax."

[[assert.normalize_replace]]
pattern = '"durationMs":[0-9]+'
with = '"durationMs":0'
reason = "Pi 1.1.0 measures each response and tool execution (#10549) with a monotonic clock; the value varies per run. Retain field placement, type and every other byte."

[[assert.normalize_replace]]
pattern = '"(id|parentId|leafId|entryId|targetId)":"[0-9a-f]{8}"'
with = '"$1":"00000000"'
reason = "Session entry ids are random 8-hex strings per process; retain the field and the id syntax."

[[assert.normalize_replace]]
pattern = '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
with = '00000000-0000-0000-0000-000000000000'
reason = "Each process draws its own random UUID session id; the session file name carries it too."

[[assert.normalize_replace]]
pattern = 'parity-rpc-[0-9a-z-]+-(pi|pig)-[0-9]+'
with = 'parity-rpc-run'
reason = "Each run's isolated temp directory is named for its binary and a random suffix; keep the path suffix and every other byte."

[[assert.normalize_replace]]
pattern = '2[0-9]{3}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{3}Z'
with = '2000-01-01T00-00-00-000Z'
reason = "The session file name starts with its creation time, which differs per process."
