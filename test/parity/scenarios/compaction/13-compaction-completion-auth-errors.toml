# Derived from Pi 0.99.2 suite/agent-session-compaction.test.ts:238-439.
# Compare exact preflight diagnostics, completion/listener ordering, native
# bearer-auth resolution, a caller-owned stream without registry credentials,
# and a thrown custom stream error without normalization.
# Node's resolution flag binds upstream test helpers to unchanged installed Pi.
# Error fixtures point Pi's package dir and Pig's materialized-docs root at the
# same read-only repository root after constructing isolated Services. PiG names
# its docs under <root>/docs/bundle-<hash> (D22: one bundle directory per build)
# where Pi names <root>/docs, so the bundle segment is the one normalized token.
name = "13-compaction-completion-auth-errors"
description = "Manual compaction preflight and completion boundaries match Pi"
covers = ["packages/coding-agent/src/core/agent-session.ts", "packages/coding-agent/src/core/compaction/compaction.ts"]
tags = ["hermetic", "fast"]
driver = "cli-mode"

[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
pig_args = ["bash", "./test/parity/testdata/compaction-boundaries-pig.sh"]
pig_go_tests = ["./coding"]
pi_args = ["node", "--experimental-import-meta-resolve", "./test/parity/testdata/compaction-boundaries-pi.mjs"]

[cli]
cwd = "../../../.."
timeout_seconds = 60

[assert]
exit_code = 0
output_equal = true
both_contain = ["beforeReturn=true idle=true", "bearer requests=1 resolved=1", "Auto-compaction failed: summary generator blew up", "custom requests=1"]
runs = 3

# normalize-rationale: D22 puts each PiG build's documentation in docs/bundle-<16 hex>; Pi's package docs directory has no such segment. Only that segment is removed; the root, file names and every other byte stay compared.
[[assert.normalize_replace]]
pattern = '/docs/bundle-[0-9a-f]{16}/'
with = '/docs/'
reason = "D22: PiG's per-build docs bundle directory sits where Pi's package docs directory does; retain the root and the page names."
