# Behavior family: compaction
# Surface: /compact of a transcript of 4 pairs that fits the pane with room for the slash popup: the summary and the kept pair are shorter and the rows below them must be erased
#
# Upstream evidence (Pi 1.5.2, probed on the comparator with the harness of this scenario family): /compact of a transcript of 4 pairs that fits the pane with room for the slash popup: the summary and the kept pair are shorter and the rows below them must be erased, with compaction.keepRecentTokens = 10 so that something is summarized.
# Pi (interactive-mode.ts) clears its chat container and re-adds the new transcript, then requests an ordinary render; packages/tui/src/tui-main-screen.ts repaints from the first changed row, below the terminal's scrollback, unless that row is above the viewport.
# The launch shell prints five numbered lines before the TUI starts (pre_tui_lines), as a package install or a wrapper script does. Both binaries run in the regular
# TUI mode (--tui-mode regular), where the terminal's own scrollback exists: fullscreen is the alternate screen and has none. quietStartup is set in both agent
# directories, so neither draws its startup header (the two headers differ: the version line and the logo) and the capture of the
# retained history and the screen, from its first line to its last, is compared as it stands: escaped_output_equal over the whole capture, no crop, no normalization. A command that erased the
# scrollback, or left a row of the old transcript below the new one, differs from Pi's capture.
# PiG's replacement of the transcript was a forced full redraw (ESC[2J ESC[H ESC[3J) that erased the scrollback; it is now the differential repaint of Pi.
# Both programs start from the resumed transcript (the ready pattern is its last row) and the command is typed and seen before Enter, so the echo that opens the raw-stream window is in both streams.
# Typing /compact opens the slash autocomplete popup (3 rows) in a frame of its own about 16 ms after the echo, so the step waits for the popup too: Enter then reaches both programs after it.
# Measured on Pi (the raw stream of the unloaded run): pane 35 rows; one pair is 6 rows, so the 4 resumed pairs are 24 rows, and with the editor (3 rows) and the footer (2 rows) the screen holds 29 rows: 6 spare rows, and the popup (3 rows) leaves 3, so it cannot scroll the pre-TUI lines out (the fixture of 5 pairs filled the pane exactly: see scenario 22). After /compact the transcript is 15 rows (the kept pair and the summary box) against 24: the 9 rows below the new content are erased.

name = "20-compact-shorter"
description = "After /compact of a transcript of 4 pairs that fits the pane with room for the slash popup: the summary and the kept pair are shorter and the rows below them must be erased the capture of the scrollback and the screen equals Pi's."
covers = ["packages/coding-agent/src/modes/interactive/interactive-mode.ts", "packages/tui/src/tui-main-screen.ts"]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=testdata/scrollback-pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/scrollback-pi-agent", "PI_SKIP_VERSION_CHECK=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions", "--session-dir", "sessions", "--session", "sessions/cur.jsonl", "--tui-mode", "regular"]
pi_args = ["--session-dir", "sessions", "--session", "sessions/cur.jsonl", "--tui-mode", "regular"]

[tmux]
width = 100
height = 35
cwd = "testdata/scrollback-compact-shorter"
pre_tui_lines = 5
capture_history = true
ready_pattern_pig = "CUR-R4 answer 4"
ready_pattern_pi = "CUR-R4 answer 4"
ready_timeout_seconds = 30

[[tmux.steps]]
keys = ["/compact"]
wait_visible_contains = ["/compact", "Manually compact"]
wait_timeout_seconds = 25

[[tmux.steps]]
keys = ["Enter"]
wait_contains = ["[compaction]"]
wait_timeout_seconds = 25
settle_seconds = 3

[assert]
runs = 3
both_reach_ready = true
both_contain = ["PRE-TUI-LINE-1", "PRE-TUI-LINE-5", "[compaction]"]
both_not_contain = ["unknown command", "panic:", "goroutine "]
escaped_output_equal = true

# The raw stream: the erase-in-display sequences (ESC[2J clears the screen, ESC[3J the terminal's scrollback) both binaries wrote from the command's first echo
# to the end of the stream are the same list. The other bytes of the stream are not compared here: the footer holds each run's random directory and PiG sets a window title.
[[assert.transcript_sequences_equal]]
from = "/compact"
erasures_only = true
