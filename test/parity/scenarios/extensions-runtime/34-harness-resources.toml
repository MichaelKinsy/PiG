# Pi 0.87.1 agent/test/harness/{prompt-templates,skills}.test.ts exercises
# the ExecutionEnv resource APIs, which differ from coding-agent's loaders.
# Both programs call their actual library APIs. Only temporary path prefixes
# are removed by projecting relative paths; order and values remain exact.
name = "34-harness-resources"
description = "Execution-environment prompt and skill loaders preserve content, source and diagnostics"
covers = ["packages/agent/src/harness/prompt-templates.ts", "packages/agent/src/harness/skills.ts"]
tags = ["fast", "hermetic"]
driver = "cli-mode"

[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
pig_args = ["go", "run", "./test/parity/testdata/harness-resources", "{{TEMP}}"]
pi_args = ["node", "./test/parity/testdata/harness-resources-pi.mjs", "{{TEMP}}"]

[cli]
cwd = "../../../.."
timeout_seconds = 60

[assert]
exit_code = 0
output_equal = true
both_contain = ['["prompt","one","One","Hello $1","project","Hello world"]', '["warning","warning","invalid_metadata","description is required","broken/SKILL.md","external"]']
runs = 3
