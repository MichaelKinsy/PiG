# Behavior family: extensions-runtime
# Scenario: a Node extension assigns a new object to tool_call event.input, and the call runs the original input.
#
# parity-tool-call-reassign.mjs replaces event.input with a new object whose command is `echo reassigned`
# instead of editing the object it received. Pi runs the tool with the object the event carried when the
# handlers started (agent-loop.ts prepareToolCall passes the same args to beforeToolCall and execute), so the
# call runs `echo parity-base`, and tool_result sees that input. The tool_result handler then answers
# "[parity-modified]", which the faux provider reports as "modified:parity-modified". A host that applies
# the new object runs `echo reassigned` and answers "not-modified" (the first fix for issue #165 did).
#
# Upstream evidence (2026-10-06, Pi 1.0.3):
#   PI_CODING_AGENT_DIR=testdata/pi-agent pi --no-extensions \
#     -e ../../testdata/test-faux-provider.ts -e testdata/ext/parity-tool-call-reassign.mjs \
#     --model test-faux/faux-1 --print "Run: bash modified"
#   output: "modified:parity-modified"
#   exit: 0

name = "72-tool-call-input-reassign"
description = "Extension tool_call handler assigns a new event.input object and the bash call runs the original input"
covers = [
  "packages/coding-agent/src/core/extensions/runner.ts",
]
tags = ["hermetic", "fast"]
driver = "print-mode"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_HOME=testdata/pig-home"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent"]
pig_args = ["--no-extensions"]
pig_extensions = ["testdata/ext/parity-tool-call-reassign.mjs"]
pi_extensions = [
  "../../testdata/test-faux-provider.ts",
  "testdata/ext/parity-tool-call-reassign.mjs",
]

[print]
prompt = "Run: bash modified"
timeout_seconds = 30

[assert]
exit_code = 0
both_contain = ["modified:parity-modified"]
output_equal = true
runs = 3
