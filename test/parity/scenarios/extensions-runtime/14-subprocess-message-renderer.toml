# Behavior family: extensions-runtime
# Surface: registered custom-message renderers execute on the production
# session-message path without blocking the TUI render loop.
#
# Upstream evidence (Pi 0.83.0): /renderer-probe calls pi.sendMessage with
# customType=parity-render. Pi invokes the registered in-process component and
# displays `renderer:hello:expanded=false`. Pig loads the same source through
# its Node subprocess bridge; the first frame may show a compact fallback, then
# the cached async renderer invalidates the TUI to the same final line.

name = "14-subprocess-message-renderer"
description = "Custom messages use the registered renderer through the real Node subprocess bridge"
covers = [
  "packages/coding-agent/src/core/extensions/runner.ts",
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1"]
pig_args = ["--no-extensions"]
pig_extensions = ["testdata/ext/message-renderer.mjs"]
pi_extensions = [
  "../../testdata/test-faux-provider.ts",
  "testdata/ext/message-renderer.mjs",
]

[tmux]
width = 100
height = 32
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "renderer:hello:expanded=false"
capture_end = "renderer:hello:expanded=false"

[[tmux.steps]]
keys = ["/renderer-probe", "Enter"]
wait_contains = ["renderer:hello:expanded=false"]
wait_timeout_seconds = 20

[assert]
both_reach_ready = true
both_contain = ["renderer:hello:expanded=false"]
both_not_contain = ["panic:", "goroutine ", "connection closed"]
output_equal = true
runs = 3
