# Behavior family: extensions-runtime
# Surface: the fallback call header of a registered extension tool without renderCall, and the global expansion toggle.
#
# Upstream evidence, 0.99.1 (tool-execution.ts:155-157, render-utils.ts:71-96): createCallFallback shows
# `echo_bridge text="..."` (cut at 100 characters) while collapsed and one `text: ...` line per argument after Ctrl+O.
# The 0.87.1 fallback showed the tool name only; both sides now draw the same rows.

name = "19-generic-tool-details"
description = "A registered extension tool without renderCall shows its arguments in the fallback call header and expands them with Ctrl+O"
covers = [
  "packages/coding-agent/src/modes/interactive/components/tool-execution.ts",
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
  "packages/coding-agent/src/core/keybindings.ts",
]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1"]
pig_args = ["--no-extensions"]
pig_extensions = ["testdata/ext/parity-echo.mjs"]
pi_extensions = [
  "../../testdata/test-faux-provider.ts",
  "testdata/ext/parity-echo.mjs",
]

[tmux]
width = 72
height = 28
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "echo_bridge"
capture_end = "details-probe-done"

[[tmux.steps]]
keys = ["Run: extension details", "Enter"]
wait_contains = ["details-probe-done"]
wait_timeout_seconds = 20

[[tmux.steps]]
keys = ["C-o"]
settle_seconds = 1

[[tmux.steps]]
keys = ["C-o"]
settle_seconds = 1

[[tmux.steps]]
keys = ["C-o"]
settle_seconds = 1

[assert]
both_reach_ready = true
both_contain = ["DETAILS_ALPHA_BRAVO_CHARLIE", "KILO_LIMA_TAIL", "details-probe-done"]
both_not_contain = ["panic:", "goroutine ", "test-faux:"]
output_equal = true
runs = 3
