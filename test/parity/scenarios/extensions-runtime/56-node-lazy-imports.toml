# Pi 0.99.2 loader.ts:55-59,565-567 serves one shared namespace per virtual module.
# keybindings.ts:311-320 stores one manager; theme.ts:1003-1022,1095-1115 synchronously highlights code.
# Import the graph during a command, not factory registration. Compare the complete namespace inventory, values shared across aliases, mutable keybinding state, text layout, and highlight output.
# The performance guard is TestNodeStartupDefersPresentationDependencies; this scenario preserves observable behavior rather than asserting a machine-dependent timing limit.
# Highlight output depends on the global theme. main.ts:898 runs initTheme(settingsManager.getTheme()) in every mode, so
# print mode uses the system theme (theme.ts:756-770, 611-623), whose palette entries render as 256-colour indexes: "not code" is
# mdCodeBlock, "\u001b[38;5;2m" on the pinned Pi (re-probed 2026-10-01 with COLORTERM=truecolor, PI_TRUE_COLOR=1 and unset: identical).
# Earlier releases printed the dark theme's #b5bd68 (38;2;181;189;104).
name = "56-node-lazy-imports"
description = "Deferred Node imports retain Pi exports, shared state, and synchronous rendering helpers"
covers = [
  "packages/coding-agent/src/core/extensions/loader.ts",
  "packages/tui/src/keybindings.ts",
  "packages/coding-agent/src/modes/interactive/theme/theme.ts",
]
tags = ["hermetic", "fast"]
driver = "print-mode"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1"]
pig_extensions = ["testdata/lazy-imports.ts"]
pi = ["PI_OFFLINE=1", "PI_SKIP_VERSION_CHECK=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts", "testdata/lazy-imports.ts"]

[print]
prompt = "/lazy-imports"
timeout_seconds = 30

[assert]
exit_code = 0
output_equal = true
both_contain = ['"order":["factory","command","tui","theme"]', '"shared":true,"state":true', '"unknownLanguage":["\u001b[38;5;2mnot code\u001b[39m"]']
both_not_contain = ["Failed to load extension", "Command failed"]
runs = 3
