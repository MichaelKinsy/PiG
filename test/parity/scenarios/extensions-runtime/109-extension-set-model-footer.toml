# Behavior family: extensions-runtime
# Scenario: the footer shows the window of the model an extension selects with pi.setModel.
#
# Issue #522 follow-up. An extension's pi.setModel(model) selects through the Session's model runtime as /model does (agent-session.ts setModel), and the footer renders the Session's
# model and its context window (footer.ts: contextUsage?.contextWindow ?? state.model?.contextWindow). The extension's widget is set once, at session start, so nothing but the selection can redraw the footer.
# Neither program redraws the footer when setModel returns: after /pick alone both still show the old window, and both show the new model's window at the next render (a key).

# Upstream evidence (2026-11-16, tmux probe): the runner starts real pi and pig in tmux with the same extension (testdata/ext/set-model-footer.mjs) and the same keys, and
# compares what both show: output_equal, three declared runs, both green.

name = "109-extension-set-model-footer"
description = "After an extension's pi.setModel both programs show the new model's context window in the footer at the next render"
covers = [
  "packages/coding-agent/src/core/agent-session.ts",
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"

[env]
pig = ["PIG_HOME=testdata/quiet-pig-home"]
pi = ["PI_CODING_AGENT_DIR=testdata/quiet-pi-agent", "PI_SKIP_VERSION_CHECK=1"]
pig_args = ["--no-extensions", "--offline", "--model", "metaprov/model-a", "--thinking", "medium", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--no-extensions", "--offline", "--model", "metaprov/model-a", "--thinking", "medium", "--session-dir", "{{TEMP}}/sessions"]
pig_extensions = ["testdata/ext/set-model-footer.mjs"]
pi_extensions = ["testdata/ext/set-model-footer.mjs"]

[tmux]
width = 140
height = 40
ready_pattern_pig = "SET MODEL FOOTER PROBE"
ready_pattern_pi = "SET MODEL FOOTER PROBE"
ready_timeout_seconds = 30
capture_start = "SET MODEL FOOTER PROBE"
capture_end = "(auto)"

[[tmux.steps]]
keys = ["/pick", "Enter"]
settle_seconds = 2

[[tmux.steps]]
keys = ["x"]
wait_visible_contains = ["/555k (auto)"]
wait_timeout_seconds = 20
settle_seconds = 1

[assert]
both_reach_ready = true
both_contain = ["/555k (auto)"]
both_not_contain = ["/777k (auto)", "panic:", "goroutine "]
output_equal = true
runs = 3
