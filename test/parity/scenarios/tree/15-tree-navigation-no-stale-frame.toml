# Upstream evidence: Pi 1.5.0 interactive-mode.ts showTreeSelector (5617-5635): after `await this.session.navigateTree(...)` returns, the handler runs
# `this.chatContainer.clear(); this.renderInitialMessages();` and then shows "Navigated to selected point". The selector's close (showExtensionSelector ->
# hideExtensionSelector) only requests a frame, and Pi's TUI runs a requested frame on a later turn of its one event loop (tui.ts requestRender), so for
# a navigation that does no asynchronous work the first frame after the selection is the fork point.
# PiG runs the navigation on a worker while its owner loop keeps serving frames. Owner bug (0.7.1): after selecting an entry the chat redrew at the old
# position, and about a second later snapped to the fork point. The worker's time was the session's JSON decode of the abandoned context and the repaint's
# second decode; a frame requested by the prompt's close ran inside that window and showed the old transcript with the prompt gone.
# A session_before_tree handler that awaits 600 ms makes the window a known length in both programs. Pi, whose loop is free while the handler awaits, paints
# between (an unavoidable consequence of the await), so only PiG's samples are asserted: no sample of the visible pane, taken every 10 ms from before the
# Enter that chooses "No summary" until "Navigated to selected point" shows, may show the old leaf with the prompt gone. Both programs end on the same pane.
# Mutation: removing the frame hold in InteractiveMode.navigateTree turns the pane at the old position with the prompt gone into the sample every poll finds.
name = "15-tree-navigation-no-stale-frame"
description = "After /tree selection with no summary the first frame is the fork point, never the old transcript with the prompt closed."
covers = ["packages/coding-agent/src/modes/interactive/interactive-mode.ts", "packages/tui/src/tui.ts"]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1"]
pig_args = ["--no-extensions", "--session", "sessions/linear.jsonl"]
pi_args = ["--no-extensions", "--session", "sessions/linear.jsonl"]
pig_extensions = ["testdata/slow-before-tree/slow-before-tree.mjs"]
pi_extensions = ["../../testdata/test-faux-provider.ts", "testdata/slow-before-tree/slow-before-tree.mjs"]

[tmux]
width = 120
height = 40
cwd = "testdata/w4-linear"
ready_pattern_pig = "SLOW HOOK READY"
ready_pattern_pi = "SLOW HOOK READY"
ready_timeout_seconds = 30
capture_start = "ask one"
capture_end = "Navigated to selected point"

[[tmux.steps]]
keys = ["/tree", "Enter"]
wait_visible_contains = ["Type to search:"]

[[tmux.steps]]
keys = ["Up", "Up", "Up", "Up", "Up", "Up"]
settle_seconds = 1

[[tmux.steps]]
keys = ["Enter"]
wait_visible_contains = ["Summarize branch?"]

[[tmux.steps]]
keys = ["Enter"]
wait_visible_contains = ["Navigated to selected point"]
wait_not_contains = ["FINAL LEAF REPLY"]
wait_timeout_seconds = 10
settle_seconds = 1
[tmux.steps.frame_watch]
stale_contains = ["FINAL LEAF REPLY"]
stale_unless_contains = ["Summarize branch?"]
min_samples = 20

[assert]
runs = 3
both_reach_ready = true
both_contain = ["ask two", "reply two", "Navigated to selected point"]
both_not_contain = ["FINAL LEAF REPLY", "ask three", "unknown command", "panic:", "goroutine "]
output_equal = true
pig_no_stale_frames = true
