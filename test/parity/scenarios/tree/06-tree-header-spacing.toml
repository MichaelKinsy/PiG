# Upstream evidence: Pi 0.87.1 tree-selector.ts:1383-1394 adds a leading spacer, a padded bold
# title, muted help/search rows, and a spacer before the bottom border even
# with no visible entries. /name creates a persisted non-message entry, so
# the default tree filter stays open with (0/0), without a provider request.
# Capture through the footer to include the empty-list bottom spacer and border.
name = "06-tree-header-spacing"
description = "Tree header and empty-list frame match Pi's exact spacing and styles"
covers = ["packages/coding-agent/src/modes/interactive/components/tree-selector.ts"]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 40
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 20
capture_start = "Session name set: tree-anchor"
capture_end = "(auto)"

[[tmux.steps]]
keys = ["/name tree-anchor", "Enter"]
wait_contains = ["Session name set: tree-anchor"]
wait_timeout_seconds = 5

[[tmux.steps]]
keys = ["/tree", "Enter"]
wait_contains = ["(0/0)"]
wait_timeout_seconds = 5
settle_seconds = 1

[env]
pig = ["PIG_CODING_AGENT_DIR=../model-resolver-selector/testdata/model-picker-defaults"]
pi = ["PI_CODING_AGENT_DIR=../model-resolver-selector/testdata/model-picker-defaults"]
pig_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_contain = ["Session Tree", "Type to search:", "No entries found"]
output_equal = true
escaped_output_equal = true
runs = 3
