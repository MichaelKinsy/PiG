# Behavior family: tui-components
# Upstream evidence: upstream 0.99.1 terminal-colors.test.ts and tui.ts:1122 (consumeTerminalColorResponse). The probe drives queryTerminalColors with one fixed OSC 10/11/4 palette on both sides (D-D): the exact query write, timeout/FIFO late-reply ownership until DA1, duplicate-target replies, an 18-reply completion with a 16-color palette, a malformed color reply, and OSC color parser target/channel semantics. Verified byte-identical against the installed 0.99.1 package.
# This fixture compares query state and parser output. The original five caller cases in internal/codingagent/terminal_colors_upstream_test.go separately drive the real driver before listeners/focus; this crop does not claim whole input-handler closure.
# Node's ExperimentalWarning is only the diagnostic from the fixture's MockTimers. No output bytes are normalized.
name = "15-terminal-background-query-lifecycle"
description = "Terminal background queries retain FIFO late-reply ownership and use Pi color parsing"
covers = ["packages/tui/src/terminal-colors.ts", "packages/tui/src/tui.ts"]
tags = ["fast", "hermetic", "tui"]
driver = "cli-mode"

[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
pig_args = ["go", "run", "./test/parity/testdata/terminal-colors-pig"]
pi_args = ["node", "--disable-warning=ExperimentalWarning", "./test/parity/testdata/terminal-colors-pi.mjs"]

[cli]
cwd = "../../../.."
timeout_seconds = 30

[assert]
exit_code = 0
runs = 3
output_equal = true
both_contain = ["parsed:background:0,128,255", "parsed:background:NaN,0,0", "parsed:7:255,0,128", "second-pending:true", "second:fg=128,128,128;bg=255,255,255;palette=0,255,0|16,239,1", "malformed:fg=undefined;bg=undefined;palette=undefined", "consumed:false"]
both_not_contain = ["panic:", "ERR_MODULE_NOT_FOUND"]
