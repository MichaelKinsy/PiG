# Behavior family: tui-components (terminal capability detection)
# Pi 1.1.0 probe: terminal-image.ts detectCapabilities over 2072 environments on Linux and Windows: TERM and COLORTERM variants (-direct, tmux, screen, ghostty), named terminals (TERM_PROGRAM herdr, rex, kitty,
# ghostty, wezterm, WarpTerminal, iTerm.app, vscode, alacritty, zed, JetBrains JediTerm), the session variables (KITTY_WINDOW_ID, WEZTERM_PANE, GHOSTTY_RESOURCES_DIR, WARP_SESSION_ID, ITERM_SESSION_ID, WT_SESSION),
# tmux with the hyperlink probe answering both ways, and the PI_IMAGE_PROTOCOL, PI_HYPERLINKS and PI_TRUE_COLOR overrides in every accepted and rejected spelling. Each environment's images, trueColor and
# hyperlinks are compared as one JSON line. The Go test TestColorDetectionMatchesPi runs the same environments against the installed Pi and also compares the theme colors; this scenario compares the two printed streams.
name = "37-terminal-capability-detection"
description = "The detected terminal capabilities (image protocol, truecolor, hyperlinks) are the same as Pi's for every environment."
covers = ["packages/tui/src/terminal-image.ts"]
tags = ["fast", "hermetic"]
driver = "cli-mode"

[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
pig_args = ["node", "./test/parity/testdata/capability-detection-pig.mjs"]
pi_args = ["node", "./test/parity/testdata/capability-detection-pi.mjs"]
pig_go_tests = ["./tui"]
pi_go_tests = ["./tui"]

[cli]
cwd = "../../../.."
timeout_seconds = 240

[assert]
exit_code = 0
output_equal = true
both_contain = ['["kitty",true,true]', '["iterm2",true,true]', '[null,false,false]', '[null,true,false]', '[null,false,true]']
runs = 2
