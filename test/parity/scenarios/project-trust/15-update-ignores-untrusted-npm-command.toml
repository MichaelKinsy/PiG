# Pi 0.87.1 package-manager-cli.ts:750-756,928-944 and core/package-manager.ts:1747-1782.
# Probe: update --extensions in an undecided project with distinct global/project npmCommand recorders.
# Pi invokes only the global recorder. Artifact equality owns the executed command and verb,
# not the separate package-progress presentation. No output bytes are normalized away.
name = "15-update-ignores-untrusted-npm-command"
description = "A user package update cannot execute an undecided project's npmCommand."
covers = ["packages/coding-agent/src/package-manager-cli.ts", "packages/coding-agent/src/core/package-manager.ts", "packages/coding-agent/src/core/settings-manager.ts"]
tags = ["hermetic", "fast"]
driver = "cli-mode"

[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/npm-command/agent", "NPM_TRUST_RECORD={{TEMP}}", "PIG_OFFLINE=", "PI_OFFLINE="]
pi = ["PI_CODING_AGENT_DIR=testdata/npm-command/agent", "NPM_TRUST_RECORD={{TEMP}}", "PI_OFFLINE=", "PI_SKIP_VERSION_CHECK=1"]
# Package commands must precede the runner's normal startup flags.
override_base_args = true

[cli]
args = ["update", "--extensions"]
cwd = "testdata/npm-command/project"
snapshot_cwd = true
artifact_path = "{{TEMP}}/npm-calls.txt"
timeout_seconds = 20

[assert]
exit_code = 0
both_contain = ["Updated packages"]
# The recorder writes the same complete LF-delimited artifact in both hosts; compare it without normalization.
artifact_equal = true
artifact_both_contain = ["global install"]
artifact_both_not_contain = ["project"]
runs = 3
