# Behavior family: export-html
# Pi 0.87.1 core/export-html/index.ts:144-177 embeds the complete page and session data.
# Probe: pi --export <fixture>/tools.jsonl <isolated>/out.html.
# Complete HTML equality is re-probed after refreshing the pinned assets.
# Raw evidence and hashes: docs/findings/fix-export-html.md.
# Coverage limit: bash/read are template-rendered tools, not custom TUI renderers.

name = "03-export-cli-tools"
description = "CLI --export with tool call/result entries produces identical HTML"
covers = [
  "packages/coding-agent/src/core/export-html/index.ts",
]
tags = ["hermetic", "fast"]
driver = "cli-mode"

[env]
pig = ["PIG_HOME=testdata/pig-home"]
pig_args = ["--export", "testdata/sessions/tools.jsonl", "{{TEMP}}/out.html"]
pi_args = ["--export", "testdata/sessions/tools.jsonl", "{{TEMP}}/out.html"]

[cli]
timeout_seconds = 15
cwd = "."
# The command's real output is the file, not the stdout line. Capture it so
# the assertions below can compare what was written.
artifact_path = "{{TEMP}}/out.html"

[assert]
exit_code = 0
both_contain = ["Exported to:"]
output_equal = true
runs = 3

# Compare the complete exported page, including template assets and embedded session data.
artifact_equal = true

artifact_both_contain = ["eyJoZWFkZXIiOnsidHlwZSI6InNlc3Npb24iLCJpZCI6InRlc3QtdG9vbHMi"]

# normalize-rationale: only the status line's isolated root differs under D2; the artifact is untouched.
[[assert.normalize_replace]]
pattern = '(?m)^(Exported to: )/[^\r\n]*/parity-cli-03-export-cli-tools-(pig|pi)-[0-9]+'
with = '${1}<TEMP>'
reason = "D2: replace only this scenario's allocated temporary root, preserving the destination suffix and the full HTML artifact."
