# Only runtime.test.ts:125 and 5943-session-start-notify.test.ts:218 are paired here.
# The Pi adapter executes the original assertion bodies against published 0.99.1 production modules.
# Compare actual assistant roles/costs and unmodified resource/chat containment/order predicates.
# This does not claim runtime replacement, stale contexts, subscriptions, or reload closure.
name = "24-runtime-cost-and-resource-order"
description = "Original assistant replacement persistence and loaded-resource container isolation"
covers = ["packages/coding-agent/src/core/agent-session.ts", "packages/coding-agent/src/modes/interactive/interactive-mode.ts"]
tags = ["hermetic", "fast"]
driver = "cli-mode"

[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
pig_args = ["bash", "./test/parity/testdata/session-runtime-pig.sh"]
pi_args = ["bash", "-c", "node --experimental-import-meta-resolve ./test/parity/testdata/session-runtime-pi.mjs runtime 125 && node --experimental-import-meta-resolve ./test/parity/testdata/session-runtime-pi.mjs notify 218"]

[cli]
cwd = "../../../.."
timeout_seconds = 60

[assert]
exit_code = 0
output_equal = true
runs = 3
