# Behavior family: session
# Surface: /fork of a session of 16 pairs, longer than the pane, forked from its last message
#
# Upstream evidence (Pi 1.5.2, probed on the comparator with the harness of this scenario family): /fork of a session of 16 pairs, longer than the pane, forked from its last message.
# Pi (interactive-mode.ts) clears its chat container and re-adds the new transcript, then requests an ordinary render; packages/tui/src/tui-main-screen.ts repaints from the first changed row, below the terminal's scrollback, unless that row is above the viewport.
# The launch shell prints five numbered lines before the TUI starts (pre_tui_lines), as a package install or a wrapper script does. Both binaries run in the regular
# TUI mode (--tui-mode regular), where the terminal's own scrollback exists: fullscreen is the alternate screen and has none. quietStartup is set in both agent
# directories, so neither draws its startup header (the two headers differ: the version line and the logo) and the capture of the
# retained history and the screen, from its first line to its last, is compared as it stands: escaped_output_equal over the whole capture, no crop, no normalization. A command that erased the
# scrollback, or left a row of the old transcript below the new one, differs from Pi's capture.
# A session_before_fork handler that awaits 400 ms makes the swap a known length in both programs: Pi and PiG both paint the frame the closed picker requested (the old transcript, the picker gone) before the swap starts.
# Both programs are in the same state before the first key. The footer is painted before the extension's session_start handler has returned, and the resumed transcript after it
# (interactive-mode.ts init(): the UI starts, rebindCurrentSession awaits the handlers, renderInitialMessages follows), so the footer alone does not say the transcript is there. On a loaded
# host PiG's bind outlasted the runner's stability gate: with 24 busy loops beside the runner, 12 of 12 PiG runs took /fork before any frame held the transcript and painted it a second time
# after the fork (Pi: 0 of 12; its transcript was on screen first). The ready pattern is therefore the last row of the resumed transcript, in both. The command is typed and seen
# before Enter is pressed, so the echo that opens the raw-stream window is in the stream of both.

name = "50-fork-long-slow-before-fork"
description = "After /fork of a long session whose session_before_fork handler awaits 400 ms the capture of the scrollback and the screen equals Pi's."
covers = ["packages/coding-agent/src/modes/interactive/interactive-mode.ts", "packages/tui/src/tui-main-screen.ts"]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=testdata/scrollback-pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/scrollback-pi-agent", "PI_SKIP_VERSION_CHECK=1"]
pig_extensions = ["testdata/slow-before-fork/slow-before-fork.mjs"]
pi_extensions = ["../../testdata/test-faux-provider.ts", "testdata/slow-before-fork/slow-before-fork.mjs"]
pig_args = ["--no-extensions", "--session-dir", "sessions", "--session", "sessions/cur.jsonl", "--tui-mode", "regular"]
pi_args = ["--session-dir", "sessions", "--session", "sessions/cur.jsonl", "--tui-mode", "regular"]

[tmux]
width = 100
height = 35
cwd = "testdata/scrollback-fork-long"
pre_tui_lines = 5
capture_history = true
ready_pattern_pig = "CUR-R16 answer 16"
ready_pattern_pi = "CUR-R16 answer 16"
ready_timeout_seconds = 30

[[tmux.steps]]
keys = ["/fork"]
wait_visible_contains = ["/fork"]
wait_timeout_seconds = 25

[[tmux.steps]]
keys = ["Enter"]
wait_visible_contains = ["› CUR-Q"]
wait_timeout_seconds = 25
settle_seconds = 1

[[tmux.steps]]
keys = ["Enter"]
wait_contains = ["Forked to new session"]
wait_timeout_seconds = 25
settle_seconds = 2

[assert]
runs = 3
both_reach_ready = true
both_contain = ["Forked to new session"]
both_not_contain = ["unknown command", "panic:", "goroutine ", "PRE-TUI-LINE-1"]
escaped_output_equal = true

# The raw stream: the erase-in-display sequences (ESC[2J clears the screen, ESC[3J the terminal's scrollback) both binaries wrote from the command's first echo
# to the end of the stream are the same list. The other bytes of the stream are not compared here: the footer holds each run's random directory and PiG sets a window title.
[[assert.transcript_sequences_equal]]
from = "/fork"
erasures_only = true
