# Behavior family: selectors
# Surface: /login → Sign in with an account → OAuth provider picker.
#
# Regression intent: manual verification found a scary UX gap where the
# second /login screen appeared to omit GitHub Copilot. That screen was the
# API-key provider picker, but this scenario locks the subscription path so
# Copilot cannot silently disappear from the OAuth provider list again.
#
# Upstream evidence (Pi 0.99.2, re-probed with this fixture): interactive-mode.ts:5668-5694 getLoginProviderOptions
# names every entry with provider.name and sorts by name, so the OAuth list shows the catalog name, not the OAuth flow's name
# (providers/openai.ts:11 "OpenAI", whose flow is "OpenAI (ChatGPT subscription)"; providers/openai-codex.ts:10 "OpenAI Codex (legacy)").
# oauth-selector.ts:164-179 preserves "stored" as a visible source label. Logout instead supplies "stored credential" and renders "configured".
# Pi 1.0.0 (oauth-selector.ts:37 formatAuthSelectorProviderStatus) labels an option without credentials
# " • not configured" instead of " • unconfigured". Re-probed against Pi 1.0.0 with this fixture,
# the stable prefix is:
#   Anthropic • not configured
#   GitHub Copilot ✓ stored
#   Kimi For Coding • not configured
#   Meta • not configured
#   OpenAI • not configured
#   OpenAI Codex (legacy) • not configured
#
# Later entries (OpenRouter, Radius, xAI) sort after OpenAI Codex (legacy). This crop ends after
# OpenAI Codex (legacy) and excludes only those later entries. Kimi's
# appearance verifies provider registration/name wiring; its device-flow and
# refresh behavior require separate caller-path evidence.
#
# Each Enter waits for the previous screen so the next selector owns the key before it is sent.

name = "10-login-subscription-providers"
description = "/login subscription provider picker includes GitHub Copilot and Kimi For Coding with upstream labels."
covers = [
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
  "packages/coding-agent/src/modes/interactive/components/oauth-selector.ts",
  "packages/coding-agent/src/core/model-runtime.ts",
]
tags = ["hermetic", "tui", "fixture-auth"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 25
capture_start = "Select provider to configure"
# Keep the original row boundary when ANSI separates the name and status; the captured ANSI itself is still compared.
capture_end_regex = 'OpenAI Codex \(legacy\)(?:\x1b\[[0-9;]*m)* • not configured'

[[tmux.steps]]
keys = ["/login", "Enter"]
wait_contains = ["Select authentication method:", "Sign in with an account"]
wait_timeout_seconds = 10
settle_seconds = 1

[[tmux.steps]]
keys = ["Enter"]
wait_contains = ["Select provider to configure:", "OpenAI Codex (legacy) • not configured"]
wait_timeout_seconds = 10
settle_seconds = 1

# Both binaries use the same light-theme credential fixture; the former normalized comparison concealed different seeded themes.
[env]
pig = ["PIG_TEST_FAUX=1", "PIG_HOME=testdata/pig-home", "PIG_CODING_AGENT_DIR=testdata/pi-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent", "PI_SKIP_VERSION_CHECK=1"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]

[assert]
both_reach_ready = true
escaped_output_equal = true
both_contain = [
  "Select provider to configure",
  "Anthropic • not configured",
  "GitHub Copilot ✓ stored",
  "Kimi For Coding • not configured",
  "OpenAI • not configured",
  "OpenAI Codex (legacy) • not configured",
]
runs = 3
