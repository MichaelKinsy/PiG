# Behavior family: selectors
# Upstream evidence: Pi 1.5.0 extension-editor.ts:113-116 and the runner's Pi 1.5.0 run of these keys in tmux 100x35, compared byte for byte.
# Surface: ExtensionEditorComponent.handleInput cancel branch through the real TUI (extension-editor.ts:113-116)
#
# Same flow as 10-extension-editor, then text is typed and Escape (tui.select.cancel) is pressed. The cancel branch runs before the
# Editor sees the key, so the typed text is discarded and the tree's "Summarize branch?" selector is shown again with its first
# choice highlighted. Both binaries run the same keys; the selector rows are compared byte for byte.
name = "17-extension-editor-cancel"
description = "Both binaries cancel the extension editor with Escape, discard the typed text and show the summary choice again."
covers = [
  "packages/coding-agent/src/modes/interactive/components/extension-editor.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "Summarize branch?"
capture_end = "cancel"
capture_start_last = true

[[tmux.steps]]
keys = ["What is 20+22?", "Enter"]
settle_seconds = 5

[[tmux.steps]]
keys = ["/tree", "Enter"]
wait_contains = ["Session Tree", "(3/3)"]
wait_timeout_seconds = 5
settle_seconds = 1

[[tmux.steps]]
keys = ["Up"]
settle_seconds = 1

[[tmux.steps]]
keys = ["Enter"]
wait_contains = ["Summarize branch?", "No summary", "Summarize with custom prompt"]
wait_timeout_seconds = 5
settle_seconds = 1

[[tmux.steps]]
keys = ["Down"]
wait_contains = ["→ Summarize"]
wait_timeout_seconds = 3
settle_seconds = 1

[[tmux.steps]]
keys = ["Down"]
wait_contains = ["→ Summarize with custom prompt"]
wait_timeout_seconds = 3
settle_seconds = 1

[[tmux.steps]]
keys = ["Enter"]
# The editor title is new; the cancel hint was already present on the preceding selector.
wait_contains = ["Custom summarization instructions"]
wait_visible_contains = ["escape/ctrl+c cancel"]
wait_timeout_seconds = 5
settle_seconds = 1

[[tmux.steps]]
keys = ["h", "i"]
wait_visible_contains = ["hi"]
wait_timeout_seconds = 5
settle_seconds = 1

[[tmux.steps]]
keys = ["Escape"]
wait_visible_contains = ["Summarize branch?"]
wait_timeout_seconds = 5
settle_seconds = 1

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_HOME=testdata/pig-home"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_not_contain = ["panic:", "goroutine "]
both_contain = ["Summarize branch?", "No summary", "Summarize with custom prompt"]
output_equal = true
runtime_ratio_max = 1.50
runs = 3
