# Behavior family: settings
# Surface: /thinking selector search and navigation (thinking-selector.ts handleInput)
# Upstream evidence: Pi 1.0.4 through the interactive-tmux production path at 100x35 with the credential-complete thinking-model
# fixture: `/thinking`, Enter, then "m", Down, Left, "d". Every key outside up/down/confirm/cancel/save goes to the search Input
# (the cursor moves and "d" inserts at it, "dm" filters to the "medium" row), the list is rebuilt around the highlighted level,
# and Down moves the selection inside the filtered rows.

name = "06-thinking-selector-search-editing"
description = "Both binaries edit the /thinking search like an Input and keep the highlighted level while filtering."
covers = [
  "packages/coding-agent/src/modes/interactive/components/thinking-selector.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"
model = "fixture/thinking-model"

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "$0.000"
ready_timeout_seconds = 25
capture_start = "Thinking Level"
capture_start_last = true
capture_end = "to set as default"

[[tmux.steps]]
keys = ["/thinking", "Enter"]
wait_contains = ["Thinking Level", "to set as default"]
wait_timeout_seconds = 5
settle_seconds = 1

[[tmux.steps]]
keys = ["m", "Down", "Left", "d"]
wait_visible_contains = ["> dm", "to set as default"]
wait_timeout_seconds = 5
settle_seconds = 1

[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/model-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/model-agent"]
pig_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_not_contain = ["unknown command", "panic:", "goroutine "]
output_equal = true
escaped_output_equal = true
runtime_ratio_max = 1.25
runs = 3
