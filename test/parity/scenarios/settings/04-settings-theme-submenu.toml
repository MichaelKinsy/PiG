# Behavior family: settings
# Surface: /settings theme submenu
#
# Upstream evidence (Pi 0.84.0, 2026-08-07, re-probed through the
# interactive-tmux production path at 100×35): `/settings`, filter `theme`,
# Enter. The submenu crop is byte- and escape-equal to Pig.

name = "04-settings-theme-submenu"
description = "Both binaries render the /settings theme submenu exactly."
covers = [
  "packages/coding-agent/src/modes/interactive/components/settings-selector.ts",
  "packages/coding-agent/src/modes/interactive/components/theme-selector.ts",
  "packages/coding-agent/src/modes/interactive/theme/theme.ts",
  "packages/tui/src/components/select-list.ts",
  "packages/tui/src/keybindings.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "Warning: No models available."
ready_timeout_seconds = 25
capture_start = "Theme"
capture_start_last = true
capture_end = "Enter to select · Esc to go back"

[[tmux.steps]]
keys = ["/settings", "Enter"]
wait_contains = [">", "Type to search · Enter/Space to change · Esc to cancel"]
wait_timeout_seconds = 5
settle_seconds = 1

[[tmux.steps]]
keys = ["Space", "t", "h", "e", "m", "e"]
wait_contains = ["> theme", "Type to search · Enter/Space to change · Esc to cancel"]
wait_timeout_seconds = 5
settle_seconds = 1

[[tmux.steps]]
keys = ["Enter"]
wait_contains = ["Theme", "Enter to select · Esc to go back"]
wait_timeout_seconds = 5
settle_seconds = 1

[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_not_contain = ["unknown command", "panic:", "goroutine "]
output_equal = true
escaped_output_equal = true
runtime_ratio_max = 1.25
runs = 1
