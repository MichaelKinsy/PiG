# Behavior family: settings
# Surface: /settings search Input editing and selection reset
#
# Upstream evidence (Pi 1.0.4 pi-tui settings-list.ts handleInput, probed through the interactive-tmux production path at 100x35):
# `/settings`, Enter, then t m e, Left Left, h, Down, Left. Every key the list does not own goes to the search Input, so the
# cursor moves and "h" inserts at it ("thme" filters to the theme row); the list then refilters after any delegated key, which
# returns the selection to the first match after Down moved it.

name = "08-settings-search-editing"
description = "Both binaries edit the /settings search like an Input and reset the selection after a delegated key."
covers = [
  "packages/tui/src/components/settings-list.ts",
  "packages/tui/src/components/input.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "Warning: No models available."
ready_timeout_seconds = 25
capture_start = "> t"
capture_end = "Type to search · Enter/Space to change · Esc to cancel"

[[tmux.steps]]
keys = ["/settings", "Enter"]
wait_visible_contains = [">", "Type to search · Enter/Space to change · Esc to cancel"]
wait_timeout_seconds = 5
settle_seconds = 1

[[tmux.steps]]
keys = ["t", "m", "e", "Left", "Left", "h", "Down", "Left"]
wait_visible_contains = ["> thme", "Type to search · Enter/Space to change · Esc to cancel"]
wait_timeout_seconds = 5
settle_seconds = 1

[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_not_contain = ["unknown command", "panic:", "goroutine "]
output_equal = true
escaped_output_equal = true
runtime_ratio_max = 1.25
runs = 1
