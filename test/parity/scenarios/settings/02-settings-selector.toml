# Behavior family: settings
# Surface: main /settings selector overlay
#
# Upstream evidence (Pi 1.2.0+3daa2028, settings-selector.ts): `/settings`, Enter at 100×35 renders 33 visible rows: the 35-entry upstream roster minus two image-only rows. The pin added the `share-destination` row (settings-selector.ts:516).
# PiG omits that row by approved divergence D64 (/share always uploads to pi-in-go.dev, so there is no destination to choose) and adds exactly one row by D80 (Mask secret input). The counts therefore coincide: both sides show (1/33) and no count normalization is needed. The raw count assertions plus complete-crop and ANSI equality reject any other row difference; the independent setting/menu tests verify the D80 row.

name = "02-settings-selector"
description = "The main /settings block matches Pi; D64's omitted share-destination row and D80's added row cancel in the row count."
covers = [
  "packages/coding-agent/src/core/settings-manager.ts",
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
  "packages/coding-agent/src/modes/interactive/components/settings-selector.ts",
  "packages/tui/src/components/settings-list.ts",
  "packages/tui/src/terminal.ts",
  "packages/tui/src/tui.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 35
# Both sides start typing after their startup rebind, which sets the autocomplete provider and then prints this
# warning; "(auto)" paints before PiG's rebind, and a key sent then is cancelled by it (interactive-mode.ts:1085-1099).
ready_pattern_pig = "Warning: No models available."
ready_pattern_pi = "Warning: No models available."
ready_timeout_seconds = 25
capture_start = "Auto-compact"
capture_end = "Type to search · Enter/Space to change · Esc to cancel"

[[tmux.steps]]
keys = ["/settings", "Enter"]
wait_contains = [">", "Type to search · Enter/Space to change · Esc to cancel"]
wait_timeout_seconds = 5
settle_seconds = 1

[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_not_contain = ["unknown command", "panic:", "goroutine "]
output_equal = true
escaped_output_equal = true
runtime_ratio_max = 1.25
runs = 3
pig_contains = ["(1/33)"]
pi_contains = ["(1/33)"]
