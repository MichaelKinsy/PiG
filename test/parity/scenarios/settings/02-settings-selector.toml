# Behavior family: settings
# Surface: main /settings selector overlay
#
# Upstream evidence (Pi 0.99.1, settings-selector.ts:470-857): `/settings`, Enter at 100×35 renders 32 visible rows: the 34-entry upstream roster (23 base, 2 image, 9 always shown, including fullscreen-wheel-scroll-lines at :733) minus two image-only rows.
# Divergence D80 adds exactly one PiG setting. Assert both raw counts, then map only that approved count difference before comparing the complete crop and ANSI. The independent setting/menu tests verify the added row.

name = "02-settings-selector"
description = "The main /settings block matches Pi except for the explicit D80 additional row count."
covers = [
  "packages/coding-agent/src/core/settings-manager.ts",
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
  "packages/coding-agent/src/modes/interactive/components/settings-selector.ts",
  "packages/tui/src/components/settings-list.ts",
  "packages/tui/src/terminal.ts",
  "packages/tui/src/tui.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "Warning: No models available."
ready_timeout_seconds = 25
capture_start = "Auto-compact"
capture_end = "Type to search · Enter/Space to change · Esc to cancel"

[[tmux.steps]]
keys = ["/settings", "Enter"]
wait_contains = [">", "Type to search · Enter/Space to change · Esc to cancel"]
wait_timeout_seconds = 5
settle_seconds = 1

[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_not_contain = ["unknown command", "panic:", "goroutine "]
output_equal = true
escaped_output_equal = true
runtime_ratio_max = 1.25
runs = 3
pig_contains = ["(1/33)"]
pi_contains = ["(1/32)"]

# normalize-rationale: divergence D80 introduces one visible PiG-only setting; the raw assertions above reject any other count change.
[[assert.normalize_replace]]
pattern = '\(1/33\)'
with = '(1/32)'
reason = "D80 adds exactly one visible PiG-only settings row; raw assertions require 33 PiG rows and 32 Pi rows before this replacement."
