# Behavior family: settings
# Surface: filtered /settings selector (theme)
#
# Upstream evidence (Pi 0.84.0, 2026-08-07, re-probed through the
# interactive-tmux production path at 100×35): `/settings`, Enter, then
# Space+t+h+e+m+e. The filtered crop is byte- and escape-equal to Pig.

name = "03-settings-filter-theme"
description = "Both binaries render the filtered /settings theme block exactly."
covers = [
  "packages/coding-agent/src/modes/interactive/components/settings-selector.ts",
  "packages/tui/src/components/settings-list.ts",
  "packages/tui/src/fuzzy.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 35
# Both sides start typing after their startup rebind, which sets the autocomplete provider and then prints this
# warning; "(auto)" paints before PiG's rebind, and a key sent then is cancelled by it (interactive-mode.ts:1085-1099).
ready_pattern_pig = "Warning: No models available."
ready_pattern_pi = "Warning: No models available."
ready_timeout_seconds = 25
capture_start = "> theme"
capture_end = "Type to search · Enter/Space to change · Esc to cancel"

[[tmux.steps]]
keys = ["/settings", "Enter"]
wait_visible_contains = [">", "Type to search · Enter/Space to change · Esc to cancel"]
wait_timeout_seconds = 5
settle_seconds = 1

[[tmux.steps]]
keys = ["Space", "t", "h", "e", "m", "e"]
wait_visible_contains = ["> theme", "Type to search · Enter/Space to change · Esc to cancel"]
wait_timeout_seconds = 5
settle_seconds = 1

[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_not_contain = ["unknown command", "panic:", "goroutine "]
output_equal = true
escaped_output_equal = true
runtime_ratio_max = 1.25
runs = 1
