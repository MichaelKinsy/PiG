# Behavior family: settings
# Pi 0.87.1 config.ts:528-573 selects .pi and PI_CODING_AGENT_DIR;
# resource-loader.ts:639-646 discovers project prompts, and
# agent-session.ts:1648-1651 expands the prompt before the provider sees it.
# Probe: --approve --print '/shared-check <artifact>' /shared-template.
# The command records selected paths/settings/resources; the second prompt
# returns SHARED-PROJECT, not the conflicting .pig template's PIG-PROJECT.
# D2's explicit opt-in removes the config identity difference, not the command identity.
name = "10-pi-directories-opt-in"
description = "Explicit Pi directories select project settings, resources, and the same extension-visible paths as Pi"
covers = [
  "packages/coding-agent/src/config.ts",
  "packages/coding-agent/src/core/settings-manager.ts",
  "packages/coding-agent/src/core/prompt-templates.ts",
  "packages/coding-agent/src/core/resource-loader.ts",
]
tags = ["hermetic", "fast"]
driver = "cli-mode"

[env]
override_base_args = true
pig = ["PIG_USE_PI_DIRS=1", "PI_CODING_AGENT_DIR=testdata/shared-agent", "PIG_TEST_FAUX=1", "PIG_OFFLINE=1", "PI_OFFLINE=1"]
pi = ["PI_CODING_AGENT_DIR=testdata/shared-agent", "PI_OFFLINE=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]

[cli]
args = ["--approve", "--model", "test-faux/faux-1", "--no-session", "--print", "/shared-check {{TEMP}}/shared.json", "/shared-template"]
cwd = "testdata/shared-project"
snapshot_cwd = true
artifact_path = "{{TEMP}}/shared.json"
timeout_seconds = 30

[assert]
exit_code = 0
runs = 3
output_equal = true
both_contain = ["SHARED-PROJECT"]
both_not_contain = ["PIG-PROJECT", "unhandled request"]
# The fixture writes the same ordered JSON fields on both sides; retain every byte.
artifact_equal = true
artifact_both_contain = ['"configDir":".pi"', '"theme":"light"', '"system":true', '"shared-template"', '"skill:shared-skill"']
