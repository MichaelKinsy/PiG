# Upstream evidence: pinned Pi probe, 2026-09-25: Ctrl+S selects model-one, writes it to settings,
# and reports Default model: fixture/model-one. Reopening and searching default
# finds model-one with both the current checkmark and default badge.
name = "17-model-picker-save-default"
description = "Ctrl+S changes the active model and persists the default explicitly"
covers = [
  "packages/coding-agent/src/modes/interactive/components/model-selector.ts",
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
  "packages/coding-agent/src/core/agent-session.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 40
# Quiet startup has no banner; use the same footer/prompt readiness contract as Pi.
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 20
capture_start = "Only showing models"
capture_start_last = true
capture_end = "to cancel"

[[tmux.steps]]
keys = ["/model", "Enter"]
wait_contains = ["Model Name: Model Two"]
wait_timeout_seconds = 15

[[tmux.steps]]
keys = ["model-one", "hex:13"]
wait_contains = ["Default model: fixture/model-one"]
wait_timeout_seconds = 15

[[tmux.steps]]
keys = ["/model", "Enter", "default"]
# Require the reopened selector's visible status, not the first picker's transcript history.
wait_visible_contains = ["> default", "Model Name: Model One", "Model catalogs refreshed."]
wait_not_contains = ["Refreshing model catalogs…"]
wait_timeout_seconds = 15

[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/model-picker-defaults", "GEMINI_API_KEY=fake-gemini", "GOOGLE_API_KEY=ignored-google"]
pi = ["PI_CODING_AGENT_DIR=testdata/model-picker-defaults", "GEMINI_API_KEY=fake-gemini", "GOOGLE_API_KEY=ignored-google", "PI_SKIP_VERSION_CHECK=1"]
pig_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_contain = ["→ ✓ model-one [fixture] · default", "Model Name: Model One", "Enter to select · Ctrl+S to set as default · Escape/Ctrl+C to cancel"]
both_not_contain = ["model-two"]
output_equal = true
escaped_output_equal = true
runs = 3
