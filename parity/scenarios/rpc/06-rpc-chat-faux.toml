# Behavior family: rpc
# Surface: prompt command through faux provider with upstream-compatible
# AgentSessionEvent stream.
#
# Upstream evidence (Pi 0.84.0, re-probed 2026-08-07): JSON/RPC applies
# toJsonEvent to every message_update, removing cumulative `partial` snapshots;
# message_start supplies the initial message, deltas build it, and message_end is
# authoritative.
#
# Observed event sequence after the prompt response:
#   response(prompt success)
#   agent_start
#   turn_start
#   message_start(user)
#   message_end(user)
#   message_start(assistant)
#   message_update(assistantMessageEvent.type=text_start)
#   message_update(assistantMessageEvent.type=text_delta, delta="42")
#   message_update(assistantMessageEvent.type=text_end)
#   message_end(assistant)
#   turn_end
#   agent_end
#
# pig previously emitted a simplified stream (message_start, text_delta,
# message_end, tool_use, tool_result). That gap has been fixed: rpc_mode.go
# now forwards upstream-shaped AgentSessionEvent JSON objects using
# rpcAgentEvent.
#
# Re-probed against Pi 0.84.0 on 2026-08-16: upstream delimits each streamed
# content run (text_start/text_delta/text_end, toolcall_start/toolcall_delta/
# toolcall_end). pig emitted only the bare deltas, and this scenario asserted
# only text_delta, so the missing delimiters passed unnoticed. rpc_events.go
# now synthesizes the run boundaries and the assertions below pin them.
#
# Pi 0.87.1 rpc-mode.ts forwards every toJsonEvent record. Compare complete records, including nested messages, usage, event order and field presence. Only object-key order and wall-clock timestamps are canonicalized; explicit equivalent system prompts avoid configuration-identity differences.

name = "06-rpc-chat-faux"
description = "Prompt through faux provider emits upstream AgentSessionEvent stream and assistant text '42'"
covers = [
  "packages/coding-agent/src/modes/rpc/rpc-mode.ts",
  # toJsonEvent's observable contract: message_update on the JSON/RPC wire
  # carries deltas only, with the cumulative `partial` snapshot removed. pig
  # realizes this in rpc_events.go by constructing delta-only events directly.
  # The both_not_contain '"partial":' assertion below exercises exactly that.
  "packages/coding-agent/src/modes/json-event.ts",
]
tags = ["hermetic", "fast"]
driver = "rpc-mode"

[rpc]
canonical_json = true
timeout_seconds = 15
[[rpc.steps]]
line = '{"id":"p1","type":"prompt","message":"What is 20+22?"}'
wait_contains = ['"type":"agent_settled"']
wait_timeout_seconds = 10

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_HOME=testdata/pig-home"]
pig_args = ["--model", "test-faux/faux-1", "--system-prompt", "RPC chat probe.", "--no-context-files", "--no-skills", "--session-dir", "{{TEMP}}/sessions"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pi_args = ["--model", "test-faux/faux-1", "--system-prompt", "RPC chat probe.", "--no-context-files", "--no-skills", "--session-dir", "{{TEMP}}/sessions"]

[assert]
exit_code = 0
both_contain = [
  '"command":"prompt","id":"p1","success":true,"type":"response"',
  '"type":"agent_start"',
  '"type":"turn_start"',
  '"type":"message_start"',
  '"type":"message_update"',
  '"type":"message_end"',
  '"type":"turn_end"',
  '"type":"agent_end"',
  '"role":"user"',
  '"role":"assistant"',
  '"type":"text_start"',
  '"type":"text_delta"',
  '"delta":"42"',
  '"type":"text_end"',
]
both_not_contain = ['"partial":']
output_equal = true
runs = 3

# normalize-rationale: Independent processes timestamp their messages with different wall clocks; no other field is replaced.
[[assert.normalize_replace]]
pattern = '"timestamp":[0-9]+'
with = '"timestamp":0'
