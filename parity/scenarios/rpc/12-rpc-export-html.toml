# Behavior family: rpc
# Surface: export_html writes the active persisted Session and returns its path.

name = "12-rpc-export-html"
description = "RPC export_html writes an HTML artifact and returns its path."
covers = [
  "packages/coding-agent/src/modes/rpc/rpc-types.ts",
  "packages/coding-agent/src/modes/rpc/rpc-mode.ts",
]
tags = ["hermetic", "fast"]
driver = "rpc-mode"

[rpc]
cwd = "testdata/session"
timeout_seconds = 15

[[rpc.steps]]
line = '{"id":"export","type":"export_html","outputPath":"{{TEMP}}/session.html"}'
wait_contains = ['"id":"export","type":"response","command":"export_html"']
wait_timeout_seconds = 10

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_HOME=testdata/pig-home"]
pig_args = ["--model", "test-faux/faux-1", "--session", "sessions/source.jsonl", "--session-dir", "{{TEMP}}/sessions"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pi_args = ["--model", "test-faux/faux-1", "--session", "sessions/source.jsonl", "--session-dir", "{{TEMP}}/sessions"]

[assert]
exit_code = 0
output_normalized_equal = true
runs = 3

# normalize-rationale: each binary receives a separate disposable output root.
[[assert.normalize_replace]]
pattern = '"path":"[^"]+/session.html"'
with = '"path":"<temp>/session.html"'
