# Behavior family: fullscreen
# Surface: Pi 0.84.0 main-screen semantic transcript replacement after compaction.
# Upstream evidence: the isolated Pi 0.84.0 live probe removed obsolete
# LIVE-STREAM rows and settled on one [compaction] replacement block.

name = "10-main-screen-compaction-settled"
description = "Settled compaction removes obsolete history and paints the same replacement as Pi."
covers = [
  "packages/tui/src/tui-main-screen.ts",
]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=../compaction/testdata/pig-agent", "TUI_LIVE_PROBE=1"]
pi = ["PI_CODING_AGENT_DIR=../compaction/testdata/pi-agent", "PI_SKIP_VERSION_CHECK=1", "TUI_LIVE_PROBE=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions", "--session-dir", "sessions", "-c"]
pi_args = ["--session-dir", "sessions", "-c"]

[tmux]
width = 80
height = 12
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
cwd = "../compaction/testdata/compact-session"
capture_start = "[compaction]"
capture_end = "faux-1"

[[tmux.steps]]
keys = ["TUI_LIVE_STREAM", "Enter"]
wait_contains = ["LIVE-STREAM-24"]
wait_timeout_seconds = 15

[[tmux.steps]]
keys = ["/compact", "Enter"]
wait_contains = ["[compaction]"]
wait_timeout_seconds = 15
settle_seconds = 1

[assert]
both_reach_ready = true
both_contain = ["[compaction]", "Compacted from"]
both_not_contain = ["LIVE-STREAM-01", "LIVE-STREAM-24", "Compacting context", "panic:", "goroutine "]
output_normalized_equal = true
runtime_ratio_max = 2.0
runs = 3

# normalize-rationale: compaction token totals, temporary working-directory
# identity, and faux footer usage differ outside the replacement-row contract.
# Replacement rows, whitespace, and ordering remain unmasked.
#
# Evidence (launch-dry-run-f2416f71, clone/parity/artifacts/
# 10-main-screen-compaction-settled/20260924T154017Z/diff.txt): pig showed
# "Compacted from 1,890 tokens" and pi showed "Compacted from 1,971 tokens",
# and the run was reported as a normalized-output mismatch even though this
# rule exists to mask exactly that number. The old pattern `[0-9]+` cannot
# span the thousands-separator comma Go's formatter emits for counts >= 1000,
# so it silently failed to match and left the differing token counts in the
# compared strings. Match the comma-grouped form so the normalization does
# what its own rationale already says it should.
[[assert.normalize_replace]]
pattern = 'Compacted from [0-9,]+ tokens'
with = "Compacted from N tokens"

[[assert.normalize_replace]]
pattern = '(?m)^.*[/\\]parity-snap-cwd-[^\n]*$'
with = "<CWD>"

[[assert.normalize_replace]]
pattern = '(?m)^.*?/128k \(auto\)\s+faux-1$'
with = "<STATUS>"
