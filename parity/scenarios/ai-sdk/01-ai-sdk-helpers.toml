# Behavior family: ai-sdk
# Surface: package-level AI SDK helpers added/exposed by upstream v0.75.x.
#
# Upstream evidence (2026-05-21): parity/testdata/ai-sdk-pi.mjs imports the
# installed upstream @earendil-works/pi-ai dist files from the same npm binary
# used as the parity comparator. It exercises the image model registry,
# image API dispatch, OpenRouter image generation payload/response handling,
# OpenAI prompt-cache key clamping, Cloudflare URL placeholder substitution,
# session resource cleanup registration, diagnostic extraction, and proxy URL
# resolution. parity/testdata/ai-sdk-pig/main.go exercises the matching Go
# API and prints the same normalized JSON object.
# Re-probed 2026-09-25 against the pinned installed Pi: cloudflare-stream.ts
# resolveCloudflareModel substitutes only explicit env. With ambient acct/gate
# present, undefined env retains both placeholders; resolved provider env yields
# /acct/gate/compat. Call the Pi resolver directly, not a fixture replacement.
# Three pairs retain the exact JSON comparison across repeated helper dispatch.
# Mutation proof: restoring ambient fallback for nil env in ai/cloudflare.go
# compiles and changes only cloudflareUnresolvedURL to /acct/gate/compat.

name = "01-ai-sdk-helpers"
description = "AI SDK helper surfaces produce the same normalized JSON behavior as upstream."
covers = [
  "packages/ai/src/image-models.generated.ts",
  "packages/ai/src/session-resources.ts",
