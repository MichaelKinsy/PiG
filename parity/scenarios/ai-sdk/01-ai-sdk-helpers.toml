driver = "cli-mode"

[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
pig_args = ["go", "run", "./parity/testdata/ai-sdk-pig"]
pi_args = ["node", "./parity/testdata/ai-sdk-pi.mjs"]

[cli]
cwd = "../../.."
timeout_seconds = 60

[assert]
exit_code = 0
output_equal = true
both_not_contain = ["panic:", "Error:", "UnhandledPromiseRejection"]
runtime_ratio_max = 5.0
runs = 3
