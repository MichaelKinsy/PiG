# Behavior family: tree
# Manual upstream-first tmux probe (2026-05-14):
#   pi --no-extensions -e parity/testdata/test-faux-provider.ts --model test-faux/faux-1
#   send: "reply with exactly: done" Enter
#   wait: 5s (faux is instant)
#   send: "/tree" Enter
#   crop: from "Type to search:" through "(3/3)"
# Raw cropped block observed in upstream pi (faux):
#   Type to search:
#   ────────────────────────────────────────────────────────────────────────────────────────────────────
#
#     • user: reply with exactly: done
#   › • assistant: done
#     (2/2)
#
# Re-probed against pi v0.87.1 (2026-09-24, same commands, isolated cwd):
# the tree now lists the persisted system message, so the block is
#   Type to search:
#   ────────────────────────────────────────────────────────────────────────────────────────────────────
#
#     • [system]
#     • user: reply with exactly: done
#   › • assistant: done
#     (3/3)
# The old capture_end "(2/2)" never matched, so the crop ran to the bottom of
# the pane and compared the footer too.
#
# This scenario uses the deterministic faux provider instead of a live model.
# Both pig (PIG_TEST_FAUX=1) and pi (via extension) register test-faux.
#
# Comparator: output_equal (glyph-level, exact whitespace), tightened from
# output_normalized_equal. pig's /tree overlay now matches pi's visible styling
# byte-for-byte at the glyph level: Border-coloured frame, muted "Type to
# search:" and count, accent path bullet, and a bold full-width selected-row
# highlight (the scoped fg/bg/intensity resets keep the highlight from breaking
# mid-row). The residual escaped_output_equal diff is escape-ordering only
# (pi carries the separator's reset onto the next line; pig closes it in place,
# and chalk's bold reset differs from the scoped SGR 22): not a visible
# difference, so output_equal is the strongest faithful comparator here.

name = "05-tree-nonempty-overlay"
description = "Both binaries render the same cropped non-empty /tree block after a faux-provider turn."
covers = [
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
  "packages/coding-agent/src/modes/interactive/components/tree-selector.ts",
]
tags = [
  "fast",
  "hermetic",
  "tui",
]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "Type to search:"
capture_end = "(3/3)"

[[tmux.steps]]
keys = ["reply with exactly: done", "Enter"]
settle_seconds = 5

[[tmux.steps]]
keys = ["/tree", "Enter"]
settle_seconds = 2

[assert]
both_reach_ready = true
both_not_contain = ["unknown command", "panic:", "goroutine ", "/128k (auto)"]
# The crop must end at the tree count, not fall through to the footer
# ("/128k (auto)" above is the footer context indicator).
both_contain = ["• [system]", "(3/3)"]
output_equal = true
runtime_ratio_max = 1.50
runs = 1
