# Behavior family: tree
# Manual upstream-first tmux probe (Pi 0.87.1, 2026-09-24):
#   pi --no-extensions -e parity/testdata/test-faux-provider.ts --model test-faux/faux-1
#   send: "reply with exactly: done" Enter
#   wait: 5s
#   send: "/tree" Enter
#   send raw bytes: ESC [ 1075 :: 117 ; 5 u
#     (Kitty Ctrl+Г on a Cyrillic layout, whose PC-101 base-layout key is u)
#   crop: from "Type to search:" through "(1/1)"
# Raw cropped block observed in upstream pi (faux):
#   Type to search:
#   ────────────────────────────────────────────────────────────────────────────────────────────────────
#
#   › • user: reply with exactly: done
#     (1/1)
#
# The raw Kitty flag-4 sequence must resolve through ctrl+u to the tree
# user-only filter, hiding assistant entries. A matcher that discards the
# base-layout alternate leaves both entries visible and fails the crop.

name = "09-tree-filter-user-only"
description = "Both binaries use a Kitty base-layout alternate to switch /tree to the upstream user-only filter."
covers = [
  "packages/coding-agent/src/modes/interactive/components/tree-selector.ts",
  "packages/coding-agent/src/core/keybindings.ts",
  "packages/tui/src/keys.ts",
  "packages/tui/src/stdin-buffer.ts",
]
tags = [
  "fast",
  "hermetic",
  "tui",
]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "Type to search:"
capture_end = "(1/1)"

[[tmux.steps]]
keys = ["reply with exactly: done", "Enter"]
settle_seconds = 5

[[tmux.steps]]
keys = ["/tree", "Enter"]
settle_seconds = 2

[[tmux.steps]]
keys = ["hex:1b 5b 31 30 37 35 3a 3a 31 31 37 3b 35 75"]
settle_seconds = 1

[assert]
both_reach_ready = true
both_not_contain = ["unknown command", "panic:", "goroutine "]
output_normalized_equal = true
runtime_ratio_max = 1.50
runs = 3
