# Behavior family: tree
# PORT_MAP linkage is explicit in covers = [...].
# Manual upstream-first tmux probe (2026-05-14):
#   pi --no-extensions
#   send: "/tree" Enter
#   crop: from "Type to search:" through "(0/0)"
# Raw cropped block observed in upstream pi:
#   Type to search:
#   ────────────────────────────────────────────────────────────────────────────────────────────────────
#
#     No entries found
#     (0/0)
#
# ANSI styling differs between pig and pi on this surface, so this case uses
# output_normalized_equal on the cropped block rather than escaped_output_equal.

name = "02-tree-empty-overlay"
description = "Both binaries render the empty /tree overlay with the same cropped text block."
covers = [
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
  "packages/coding-agent/src/modes/interactive/components/tree-selector.ts",
]
tags = [
  "fast",
  "hermetic",
  "tui",
]
driver = "interactive-tmux"

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "$0.000"
ready_timeout_seconds = 15
keys = ["/tree", "Enter"]
settle_seconds = 2
capture_start = "Type to search:"
capture_end = "(0/0)"

[assert]
both_reach_ready = true
both_not_contain = ["unknown command", "panic:", "goroutine "]
output_normalized_equal = true
runtime_ratio_max = 1.20
runs = 1
