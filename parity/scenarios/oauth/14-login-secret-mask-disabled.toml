# Upstream evidence: Pi 0.87.1 showAuthPrompt (interactive-mode.ts:6085-6093) routes secret input to the ordinary dialog. login-dialog.ts:156-182 renders it as plain text.
# maskSecretInput=false restores that surface. The same settings key is present in Pi's isolated settings file; Pi ignores it.
# The complete before/during/after-submit component frames are additionally compared by TestLoginDialogMaskDisabledMatchesPi without ANSI normalization.
name = "14-login-secret-mask-disabled"
description = "Disabling secret masking restores Pi's plain-text API-key dialog"
covers = ["packages/coding-agent/src/modes/interactive/components/login-dialog.ts"]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"
[tmux]
width = 120
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "Login to OpenAI"
capture_end = "> probe-key-tail"
settle_seconds = 1
cwd = "../selectors/testdata/login-empty-project"
[[tmux.steps]]
keys = ["/login", "Enter"]
wait_contains = ["Select authentication method"]
[[tmux.steps]]
keys = ["Down", "Enter"]
wait_contains = ["Select provider"]
[[tmux.steps]]
keys = ["openai", "Enter"]
wait_contains = ["Enter OpenAI API key"]
[[tmux.steps]]
keys = ["probe-key-tail"]
wait_visible_contains = ["> probe-key-tail"]
[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/privacy-pi-compatible", "PI_CODING_AGENT_DIR=", "PIG_HOME=../selectors/testdata/pig-home-noauth", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]
pi = ["PI_CODING_AGENT_DIR=testdata/privacy-pi-compatible", "PIG_CODING_AGENT_DIR=", "PIG_HOME=", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
[assert]
both_reach_ready = true
both_contain = ["Login to OpenAI", "Enter OpenAI API key", "> probe-key-tail"]
both_not_contain = ["Input hidden", "characters"]
escaped_output_equal = true
runs = 3
