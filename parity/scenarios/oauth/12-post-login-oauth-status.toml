# Upstream evidence: Pi 0.87.1 interactive-mode.ts:5928-5945 reports the selection and auth path after OAuth.
# Faux device/token/model responses complete the real login. No model-selection branch is replaced.
# The paired state scenario checks the session and persisted default separately, because consecutive status notices replace one another in Pi.
name = "12-post-login-oauth-status"
description = "OAuth completion reports the selected provider default and credential path"
covers = ["packages/coding-agent/src/modes/interactive/interactive-mode.ts"]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"
[tmux]
width = 200
height = 40
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "Logged in to GitHub Copilot."
capture_end = "/auth.json"
settle_seconds = 1
cwd = "../selectors/testdata/login-empty-project"
[[tmux.steps]]
keys = ["/login", "Enter"]
wait_contains = ["Select authentication method"]
[[tmux.steps]]
keys = ["Enter"]
wait_contains = ["Select provider"]
[[tmux.steps]]
keys = ["github-copilot", "Enter"]
wait_contains = ["GitHub Enterprise URL/domain"]
[[tmux.steps]]
keys = ["Enter"]
wait_visible_contains = ["Logged in to GitHub Copilot. Selected gpt-5.4. Credentials saved to"]
[env]
pig = ["PIG_CODING_AGENT_DIR=../selectors/testdata/pi-agent-noauth", "PI_CODING_AGENT_DIR=", "PIG_HOME=../selectors/testdata/pig-home-noauth", "PIG_PARITY_HARNESS=1", "PIG_PARITY_LOGIN_DIALOG=complete", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]  # gitleaks:allow -- synthetic parity fixture
pi = ["PIG_CODING_AGENT_DIR=", "PIG_HOME=", "PI_CODING_AGENT_DIR=../selectors/testdata/pi-agent-noauth", "PI_PARITY_LOGIN_DIALOG=complete", "PATH={{FAKE_BIN}}:{{PATH}}"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]
pi_extensions = ["../../testdata/oauth-harness.ts"]
[assert]
both_reach_ready = true
both_contain = ["Logged in to GitHub Copilot. Selected gpt-5.4. Credentials saved to"]
output_normalized_equal = true
runs = 3
# normalize-rationale: the two credential files live in isolated agent-directory snapshots.
[[assert.normalize_replace]]
pattern = '/[^\r\n ]+/auth\.json'
with = '<AUTH_PATH>'
