# Upstream evidence: Pi 0.87.1 interactive-mode.ts:5879-5975,6003-6038 uses the same completion for API keys as OAuth.
# Enter a synthetic key with no inherited authentication. No inference request or network key validation occurs.
# The observer replaces the completion status; 13-post-login-api-key-status compares that notice separately.
# Compare the real command-context and persisted-settings report exactly.
name = "11-post-login-api-key-model"
description = "API key login from unknown selects and persists the provider default"
covers = ["packages/coding-agent/src/modes/interactive/interactive-mode.ts", "packages/coding-agent/src/core/model-resolver.ts"]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 200
height = 40
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "post-login-state:"
capture_end = "post-login-state: current=openai/gpt-5.5 default=openai/gpt-5.5"
settle_seconds = 1
cwd = "../selectors/testdata/login-empty-project"

[[tmux.steps]]
keys = ["/login", "Enter"]
wait_contains = ["Select authentication method"]
[[tmux.steps]]
keys = ["Down", "Enter"]
wait_contains = ["Select provider"]
[[tmux.steps]]
keys = ["openai", "Enter"]
wait_contains = ["API key"]
[[tmux.steps]]
keys = ["parity-key", "Enter"]
wait_contains = ["Saved API key for OpenAI. Selected gpt-5.5."]
[[tmux.steps]]
keys = ["/post-login-state", "Enter"]
wait_visible_contains = ["post-login-state: current=openai/gpt-5.5 default=openai/gpt-5.5"]

[env]
pig = ["PIG_CODING_AGENT_DIR=../selectors/testdata/pi-agent-noauth", "PI_CODING_AGENT_DIR=", "PIG_HOME=../selectors/testdata/pig-home-noauth", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]
pi = ["PIG_CODING_AGENT_DIR=", "PIG_HOME=", "PI_CODING_AGENT_DIR=../selectors/testdata/pi-agent-noauth", "PATH={{FAKE_BIN}}:{{PATH}}"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pig_extensions = ["../../testdata/post-login-state.ts"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]
pi_extensions = ["../../testdata/post-login-state.ts"]

[assert]
both_reach_ready = true
both_contain = ["post-login-state: current=openai/gpt-5.5 default=openai/gpt-5.5"]
output_equal = true
runs = 3
