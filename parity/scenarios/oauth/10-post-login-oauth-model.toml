# Upstream evidence: Pi 0.87.1 interactive-mode.ts:5879-5975,6134-6152: an OAuth login from unknown selects and persists the provider default.
# The existing faux device/token setup answers OAuth only; selection uses the real catalog and completeProviderAuthentication.
# The observer uses a status notification, replacing the completion notice as Pi's showStatus specifies. The separate completion scenario compares that notice.
# Compare the real command-context and persisted-settings report exactly.
name = "10-post-login-oauth-model"
description = "OAuth login from unknown selects the catalog default and persists it"
covers = ["packages/coding-agent/src/modes/interactive/interactive-mode.ts", "packages/coding-agent/src/core/model-resolver.ts"]
tags = ["hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 200
height = 40
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "post-login-state:"
capture_end = "post-login-state: current=github-copilot/gpt-5.4 default=github-copilot/gpt-5.4"
settle_seconds = 1
cwd = "../selectors/testdata/login-empty-project"

[[tmux.steps]]
keys = ["/login", "Enter"]
wait_contains = ["Select authentication method"]
[[tmux.steps]]
keys = ["Enter"]
wait_contains = ["Select provider"]
[[tmux.steps]]
keys = ["github-copilot", "Enter"]
wait_contains = ["GitHub Enterprise URL/domain"]
[[tmux.steps]]
keys = ["Enter"]
wait_contains = ["Logged in to GitHub Copilot. Selected gpt-5.4."]
[[tmux.steps]]
keys = ["/post-login-state", "Enter"]
wait_visible_contains = ["post-login-state: current=github-copilot/gpt-5.4 default=github-copilot/gpt-5.4"]

[env]
pig = ["PIG_CODING_AGENT_DIR=../selectors/testdata/pi-agent-noauth", "PI_CODING_AGENT_DIR=", "PIG_HOME=../selectors/testdata/pig-home-noauth", "PIG_PARITY_HARNESS=1", "PIG_PARITY_LOGIN_DIALOG=complete", "HOME={{TEMP}}/home", "PATH={{FAKE_BIN}}:{{PATH}}"]  # gitleaks:allow -- synthetic parity fixture
pi = ["PIG_CODING_AGENT_DIR=", "PIG_HOME=", "PI_CODING_AGENT_DIR=../selectors/testdata/pi-agent-noauth", "PI_PARITY_LOGIN_DIALOG=complete", "PATH={{FAKE_BIN}}:{{PATH}}"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pig_extensions = ["../../testdata/post-login-state.ts"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]
pi_extensions = ["../../testdata/oauth-harness.ts", "../../testdata/post-login-state.ts"]

[assert]
both_reach_ready = true
both_contain = ["post-login-state: current=github-copilot/gpt-5.4 default=github-copilot/gpt-5.4"]
output_equal = true
runs = 3
