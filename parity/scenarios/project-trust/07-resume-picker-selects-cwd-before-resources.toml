# Behavior family: project-trust
# Surface: bare --resume selects a cross-cwd Session before project Resources
# and trust are resolved.
#
# Manual upstream-first tmux probe (exact Pi 0.83.0, 2026-08-04, 100x35):
#   launch from session-target-cwd, whose project extension exposes trust-probe;
#   --session-dir sessions --resume --no-approve --verbose;
#   Tab switches from the empty current-cwd scope to All, Enter selects the
#   target/ Session, and the exact persisted transcript renders with no malicious
#   launch-cwd provider identifier. capture_start_last skips the same first-
#   message text in the selector row and starts at the resumed transcript copy.

name = "07-resume-picker-selects-cwd-before-resources"
description = "Bare resume selection fixes runtime cwd before project Resource loading."
covers = [
  "packages/coding-agent/src/main.ts",
  "packages/coding-agent/src/cli/session-picker.ts",
  "packages/coding-agent/src/cli/startup-ui.ts",
  "packages/coding-agent/src/core/session-cwd.ts",
  "packages/coding-agent/src/core/agent-session-runtime.ts",
  "packages/coding-agent/src/core/resource-loader.ts",
]
tags = ["hermetic", "fast", "security", "tui", "serial"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 35
ready_pattern_pig = "Resume Session (Current Folder)"
ready_pattern_pi = "Resume Session (Current Folder)"
ready_timeout_seconds = 30
capture_start = "remember picker-target-9137"
capture_start_last = true
capture_end = "noted picker-target-9137"
cwd = "testdata/session-target-cwd"

[[tmux.steps]]
keys = ["Tab"]
wait_contains = ["Resume Session (All)"]
wait_timeout_seconds = 10

[[tmux.steps]]
keys = ["Enter"]
wait_contains = ["noted picker-target-9137"]
wait_timeout_seconds = 20
settle_seconds = 1

[env]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent-session", "PI_SKIP_VERSION_CHECK=1"]
pig = ["PIG_CODING_AGENT_DIR=testdata/pig-agent-session"]
override_base_args = true
pi_args = ["--offline", "--session-dir", "sessions", "--resume", "--no-approve", "--verbose"]
pig_args = ["--offline", "--session-dir", "sessions", "--resume", "--no-approve", "--verbose"]

[assert]
both_reach_ready = true
both_contain = ["remember picker-target-9137", "noted picker-target-9137"]
both_not_contain = ["trust-probe", "must-not-load-before-trust", "panic:", "goroutine "]
output_equal = true
runtime_ratio_max = 1.5
runs = 3
