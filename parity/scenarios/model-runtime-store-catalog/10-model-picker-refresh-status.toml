# Behavior family: model-runtime-store-catalog
# Surface: opening /model refreshes models.json and reports completion after the
# immediate selector snapshot.
#
# Upstream evidence: exact Pi 0.87.1 re-probe (2026-09-23, tmux 100×35):
#   PI_CODING_AGENT_DIR=../model-resolver-selector/testdata/pi-agent-local
#     pi --no-extensions --offline
#   keys: /model Enter
#   crop: "Only showing models" through "Model catalogs refreshed."
#
#   Only showing models from configured providers. Use /login to add providers.
#
#   >
#
#   → ✓ model-two [fixture]
#       model-one [fixture]
#
#     Model Name: Model Two
#
#     Model catalogs refreshed.
#
# Static local models have no network work, but the refresh/reload completion,
# status ordering, and UI handoff remain observable async-runtime behavior.

name = "10-model-picker-refresh-status"
description = "Both binaries reload the local model runtime and report picker refresh completion."
covers = [
  "packages/coding-agent/src/core/model-runtime.ts",
  "packages/coding-agent/src/modes/interactive/components/model-selector.ts",
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "$0.000"
ready_timeout_seconds = 20
keys = ["/model", "Enter"]
settle_seconds = 2
capture_start = "Only showing models"
capture_end = "Model catalogs refreshed."

[env]
pig = ["PIG_CODING_AGENT_DIR=../model-resolver-selector/testdata/pig-agent-local"]
pi = ["PI_CODING_AGENT_DIR=../model-resolver-selector/testdata/pi-agent-local"]
pig_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--no-extensions", "--offline", "--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_contain = ["→ ✓ model-two [fixture]", "model-one [fixture]", "Model catalogs refreshed."]
both_not_contain = ["panic:", "goroutine ", "Could not refresh"]
output_equal = true
runtime_ratio_max = 1.30
runs = 3
