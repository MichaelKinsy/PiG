# Behavior family: slash-commands
# Surface: /changelog renders a "What's New" block
#
# Upstream evidence (pi v0.69.0, current loop probe):
#   command: PI_CODING_AGENT_DIR=parity/scenarios/slash-commands/testdata/pi-agent pi --no-extensions --session-dir {{TEMP}}/sessions
#   keys: /changelog Enter
#   ready_pattern: "Warning: No models available."
#   raw upstream observation:
#     Upstream renders DynamicBorder + bold accent "What's New" header + Markdown(entries) + DynamicBorder.
#     PiG renders Markdown("---\n\n**What's New**\n\n<entries>\n\n---").
#     Both render "What's New" in the pane.
#
# Content differs between binaries (different CHANGELOG.md), so output_equal
# is impossible. We assert that:
#   - Both reach the "What's New" header (wait_contains in step)
#   - Neither crashes
# The pi changelog is long enough to scroll "What's New" off a 60-row pane,
# so we cannot use both_contain on the final crop. The wait_contains gate
# proves both binaries render the header.

name = "04-changelog-structure"
description = "boot-only: Both binaries render /changelog with 'What's New' header."
covers = [
  "packages/coding-agent/src/core/slash-commands.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 60
ready_pattern_pig = "(auto)"
ready_pattern_pi = "Warning: No models available."
ready_timeout_seconds = 25

[[tmux.steps]]
keys = ["/changelog", "Enter"]
wait_contains = ["What's New"]
wait_timeout_seconds = 5
settle_seconds = 2

[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]

[assert]
both_reach_ready = true
both_not_contain = ["unknown command", "panic:", "goroutine ", "No changelog entries found"]
runs = 1
