# Behavior family: interactive-rendering
# Surface: AssistantMessageBlock: plain text rendering with left-pad and spacer
#
# Upstream evidence (pi v0.69.0, 2026-05-15):
#   pi --no-extensions -e parity/testdata/test-faux-provider.ts --model test-faux/faux-1
#   send: "reply with exactly: Hello world" Enter
#   wait: 4s
#   crop: start="Hello world" (first assistant line) end="Hello world"
#   raw cropped upstream block:
#     Hello world
#
# This exercises the AssistantMessageBlock rendering path: Spacer(1) for
# the leading blank line, 1-column left-pad, markdown-rendered text.
# The faux provider echoes the input text back verbatim, giving us a
# deterministic two-word response.

name = "01-assistant-message-text"
description = "Assistant message renders with left-pad and leading spacer, matching upstream."
covers = [
  "packages/coding-agent/src/modes/interactive/components/assistant-message.ts",
  "packages/tui/src/components/markdown.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent", "PI_SKIP_VERSION_CHECK=1"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions", "--session-dir", "{{TEMP}}/sessions"]
pi_args = ["--session-dir", "{{TEMP}}/sessions"]

[tmux]
width = 100
height = 35
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "reply with exactly: Hello world"
capture_end = "Hello world"

[[tmux.steps]]
keys = ["reply with exactly: Hello world", "Enter"]
settle_seconds = 4
wait_contains = ["Hello world"]
wait_timeout_seconds = 10

[assert]
both_reach_ready = true
both_not_contain = ["unknown command", "panic:", "goroutine "]
# lint-known-gap: bg-paint SGR encoding differs (pig uses paintBgWith with
# truecolor + reset re-application; upstream uses Box delegation). Visible
# content is identical.
output_normalized_equal = true
runtime_ratio_max = 2.0
runs = 1
