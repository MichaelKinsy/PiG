# Behavior family: session
# Surface: choosing Continue in the missing-cwd startup selector rebuilds the
# runtime against the current cwd instead of the missing stored path.
#
# Manual upstream-first tmux probe (exact Pi 0.83.0, 2026-08-04, 100x35):
#   pi --no-extensions --offline --session sessions/missing.jsonl
#   Enter selects Continue and re-renders the persisted fallback-4821 turns from
#   the selected Session. Exact transcript bytes are the independent oracle.

name = "06-missing-session-cwd-continue"
description = "Continue leaves the missing-cwd selector and starts against the current cwd."
covers = [
  "packages/coding-agent/src/main.ts",
  "packages/coding-agent/src/cli/startup-ui.ts",
  "packages/coding-agent/src/core/session-cwd.ts",
  "packages/coding-agent/src/core/agent-session-runtime.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 35
ready_pattern_pig = "cwd from session file does not exist"
ready_pattern_pi = "cwd from session file does not exist"
ready_timeout_seconds = 25
keys = ["Enter"]
settle_seconds = 2
capture_start = "remember fallback-4821"
capture_end = "noted fallback-4821"
cwd = "testdata/missing-session-cwd"

[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent", "PI_SKIP_VERSION_CHECK=1"]
pig_args = ["--no-extensions", "--offline", "--session", "sessions/missing.jsonl"]
pi_args = ["--no-extensions", "--offline", "--session", "sessions/missing.jsonl"]

[assert]
both_reach_ready = true
both_contain = ["remember fallback-4821", "noted fallback-4821"]
both_not_contain = ["Stored session working directory does not exist:", "panic:", "goroutine "]
output_equal = true
runtime_ratio_max = 1.5
runs = 3
