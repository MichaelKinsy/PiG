# Behavior family: session
# Surface: --session accepts an exact/prefix ID, searches current cwd first and
# then all sessions, and confirms before forking a cross-project match.
#
# Manual upstream-first tmux probe (exact Pi 0.83.0, 2026-08-04, 100x35):
#   launch in global-session-cwd with --session global-sess;
#   Pi reports the other project cwd, prompts "Fork this session into current
#   directory? [y/N]", and y+Enter forks then renders the persisted transcript.

name = "07-global-session-prefix-confirm-fork"
description = "A global session prefix requires confirmation and forks into the launch cwd."
covers = [
  "packages/coding-agent/src/main.ts",
  "packages/coding-agent/src/core/session-manager.ts",
  "packages/coding-agent/src/core/session-cwd.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"

[tmux]
width = 100
height = 35
ready_pattern_pig = "Fork this session into current directory? [y/N]"
ready_pattern_pi = "Fork this session into current directory? [y/N]"
ready_timeout_seconds = 25
capture_start = "remember global-prefix-7702"
capture_end = "noted global-prefix-7702"
cwd = "testdata/global-session-cwd"

[[tmux.steps]]
keys = ["y", "Enter"]
wait_contains = ["noted global-prefix-7702"]
wait_timeout_seconds = 20
settle_seconds = 1

[env]
pig = ["PIG_CODING_AGENT_DIR=testdata/pig-agent"]
pi = ["PI_CODING_AGENT_DIR=testdata/pi-agent", "PI_SKIP_VERSION_CHECK=1"]
pig_args = ["--no-extensions", "--offline", "--session-dir", "sessions", "--session", "global-sess"]
pi_args = ["--no-extensions", "--offline", "--session-dir", "sessions", "--session", "global-sess"]

[assert]
both_reach_ready = true
both_contain = ["remember global-prefix-7702", "noted global-prefix-7702"]
both_not_contain = ["No session found", "panic:", "goroutine "]
output_equal = true
runtime_ratio_max = 1.5
runs = 3
