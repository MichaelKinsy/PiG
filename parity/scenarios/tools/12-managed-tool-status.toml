# The oracle executes the entire pinned tools-manager.ts with only filesystem,
# process lookup and fetch dependencies replaced. No download contacts the network.
# It also calls the pinned InteractiveMode.showManagedToolStatus with real Text,
# Container and themes. The Go probes call EnsureTool and the interactive renderer.
# Compare exact status records and escaped ANSI rows (including spaces and resets).
# Go-only native wrapped-error cases are represented by equivalent Error.cause chains.
# Startup concurrency, live-before-completion progress and cancellation are guarded
# by TestManagedToolsRenderProgressBeforeDownloadsFinish and TestManagedToolsCancellationJoinsDownloads.
name = "12-managed-tool-status"
description = "Managed tool callbacks retain bounded cause chains and render exact warning/info lines without stderr output."
covers = [
  "packages/coding-agent/src/utils/tools-manager.ts",
  "packages/coding-agent/src/modes/interactive/interactive-mode.ts",
]
tags = ["fast", "hermetic", "tui"]
driver = "cli-mode"

[env]
override_base_args = true
pig_bin = "/usr/bin/env"
pi_bin = "/usr/bin/env"
pig_args = ["bash", "./parity/testdata/managed-tool-status-pig.sh"]
pi_args = ["node", "./parity/testdata/managed-tool-status-pi.mjs"]

[cli]
cwd = "../../.."
timeout_seconds = 60

[assert]
exit_code = 0
output_equal = true
both_contain = ["MANAGED_TOOL_CALLBACKS", "MANAGED_TOOL_RENDER", "fetch failed: connect ETIMEDOUT"]
runs = 3
