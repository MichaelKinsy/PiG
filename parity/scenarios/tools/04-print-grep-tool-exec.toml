# Behavior family: tools
# Scenario: print-mode grep tool execution via faux provider.
#
# Faux provider receives "Run: grep hello", emits a grep tool call with
# pattern "hello" and path "parity-read-target.txt". The tool greps the
# file, returns matches. Faux sees the result and replies with "found".
#
# Upstream evidence (2026-05-15):
#   cd parity/scenarios/tools/testdata
#   pi --no-extensions -e <faux> --model test-faux/faux-1 \
#     --print "Run: grep hello"
#   output: "found"
#   exit: 0
#
#   PIG_TEST_FAUX=1 pig --no-extensions --model test-faux/faux-1 \
#     --print "Run: grep hello"
#   output: "found"
#   exit: 0

name = "04-print-grep-tool-exec"
description = "Faux triggers grep(hello, parity-read-target.txt), both produce found in print mode"
covers = [
  "packages/coding-agent/src/core/tools/grep.ts",
]
tags = ["hermetic", "fast"]
driver = "print-mode"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_HOME=testdata/pig-home"]
pig_args = ["--no-extensions"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]

[print]
prompt = "Run: grep hello"
timeout_seconds = 30
cwd = "testdata"

[assert]
exit_code = 0
both_contain = ["found"]
output_equal = true
