# Behavior family: startup
# Upstream evidence: interactive-mode.ts init builds an ExpandableText header
# with compact keybinding hints, an expansion hint and onboarding. Probe the
# pinned Pi with --model test-faux/faux-1 at 100x40; crop from the first hint
# through onboarding. Logo identity/version are covered separately by D2/D63.
name = "02-startup-compact-help"
description = "Default startup header renders Pi's compact help and onboarding, without the former cwd/config/bin report."
covers = ["packages/coding-agent/src/modes/interactive/interactive-mode.ts"]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_OFFLINE=1", "PIG_CODING_AGENT_DIR=../interactive-rendering/testdata/pig-agent"]
pi = ["PI_OFFLINE=1", "PI_SKIP_VERSION_CHECK=1", "PI_CODING_AGENT_DIR=../interactive-rendering/testdata/pi-agent"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions"]

[tmux]
width = 100
height = 40
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "escape"
capture_end_regex = 'extend Pi(G)?\.'

[assert]
both_reach_ready = true
both_contain = ["interrupt", "clear/exit", "commands", "bash", "more", "to show full startup help and loaded resources."]
both_not_contain = ["Ready. Type", "config=", "bin=", "cwd="]
escaped_output_equal = true
runs = 3

# normalize-rationale: D2 substitutes the product name only; key labels,
# descriptions, ANSI styling and all whitespace remain byte-faithful.
[[assert.normalize_replace]]
pattern = 'PiG'
with = "Pi"
