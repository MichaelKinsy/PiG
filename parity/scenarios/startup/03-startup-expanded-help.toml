# Behavior family: startup
# Upstream evidence: interactive-mode.ts init creates expandable startup help;
# app.tools.expand selects every configured keybinding hint and removes the
# compact expansion hint. Probe the pinned Pi at 100x45 and press Ctrl+O.
# Crop includes the whole hint list and onboarding, not the D2/D63 logo.
name = "03-startup-expanded-help"
description = "Ctrl+O expands the built-in startup header to Pi's complete configured keybinding help."
covers = ["packages/coding-agent/src/modes/interactive/interactive-mode.ts"]
tags = ["fast", "hermetic", "tui"]
driver = "interactive-tmux"
model = "test-faux/faux-1"

[env]
pig = ["PIG_TEST_FAUX=1", "PIG_OFFLINE=1", "PIG_CODING_AGENT_DIR=../interactive-rendering/testdata/pig-agent"]
pi = ["PI_OFFLINE=1", "PI_SKIP_VERSION_CHECK=1", "PI_CODING_AGENT_DIR=../interactive-rendering/testdata/pi-agent"]
pi_extensions = ["../../testdata/test-faux-provider.ts"]
pig_args = ["--no-extensions"]

[tmux]
width = 100
height = 45
ready_pattern_pig = "(auto)"
ready_pattern_pi = "(auto)"
ready_timeout_seconds = 30
capture_start = "escape"
capture_end_regex = 'extend Pi(G)?\.'

[[tmux.steps]]
keys = ["C-o"]
wait_contains = ["drop files to attach"]

[assert]
both_reach_ready = true
both_contain = ["to interrupt", "twice to exit", "to delete to end", "to run bash (no context)", "drop files to attach"]
both_not_contain = ["show full startup help", "Ready. Type", "config=", "bin=", "cwd="]
escaped_output_equal = true
runs = 3

# normalize-rationale: D2 substitutes only the product name in onboarding;
# the complete keybinding inventory, layout and ANSI bytes stay visible.
[[assert.normalize_replace]]
pattern = 'PiG'
with = "Pi"
