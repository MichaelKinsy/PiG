# Behavior family scope.
#
# Each family declares the upstream PORT_MAP paths that fall under
# its responsibility. `go run ./parity/cmd/familygaps -family <name>`
# uses this to report which entries in family scope are untested.
#
# Pattern semantics:
#   - exact path:       matches that PORT_MAP entry only
#   - trailing slash:   matches every PORT_MAP entry whose upstream
#                       path starts with this prefix
#
# A PORT_MAP entry may legitimately belong to multiple families
# (e.g., `interactive-mode.ts` shows up under slash-commands AND
# autocomplete AND tree). `familygaps` reports coverage from any
# scenario; cross-family coverage is allowed and visible.
#
# When you start a new family loop, add a row here FIRST. The act of
# declaring scope before producing scenarios prevents silent skipping.

[families.experimental-client]
description = "Experimental client, mini, and micro terminal presentations over replicated or remote Session state."
includes = [
  "packages/coding-agent/src/experimental/client-tui.ts",
  "packages/coding-agent/src/experimental/micro/tui.ts",
  "packages/coding-agent/src/experimental/mini/tui/view.ts",
]

