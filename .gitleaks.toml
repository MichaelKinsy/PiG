# Gitleaks: the default rules, plus an allowlist for the values below. Each
# one matches the generic-api-key rule but is not a credential.
title = "PiG gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and data that are not credentials"
regexes = [
  # Unsigned test JWTs: header {"alg":"none"}, signature "sig".
  '''^eyJhbGciOiJub25lIn0\.[A-Za-z0-9_-]+\.sig$''',
  # Anthropic beta header names (the Anthropic-Beta header is a comma-separated list of them).
  '''^(?:interleaved-thinking|oidc-federation|oauth)-\d{4}-\d{2}-\d{2}$''',
  # Prose in the upstream test mapping.
  '''^SSE-and-UTF-8-chunk-splitting$''',
  # Fake Bedrock bearer token in bedrock_oracle_env_test.go: "ABSK" + base64("BedrockAPIKey-example-token").
  '''^ABSKQmVkcm9ja0FQSUtleS1leGFtcGxlLXRva2Vu$''',
  # WebSocket handshake nonces in chord/nextnode/http/upgrades_test.go: sixteen zero bytes, and the RFC 6455 sample nonce.
  '''^(?:AAAAAAAAAAAAAAAAAAAAAA|dGhlIHNhbXBsZSBub25jZQ)==$''',
  # Fake ed25519 key blobs ("...One", "...Two") in env's known_hosts tests.
  '''^AAAAC3NzaC1lZDI1NTE5AAAAI(?:One|Two)$''',
  # env's fixed test session token, a counting pattern.
  '''^0123456789abcdef0123456789abcdef$''',
  # The SHA-256 of the rendered /hotkeys rows on Linux, the golden hash in internal/codingagent/interactive_whole_markdown_test.go (a digest of output, not a key).
  '''^6c6e446dd091ddae67cc390a41ffa268a9c7418088c7a9c5274abd08eb345e76$''',
  # The documented example Piglet signing key ID in docs/site/docs/cli-examples.md (a public key fingerprint).
  '''^c74cf1a77b670764e896cfbf2800bb28$''',
  # A header-name constant in the vendored AWS SDK (third_party/awssdk stays verbatim; see its FORK.md).
  '''^v4Internal\.AmzSignedHeadersKey$''',
  # Keybinding lists in Pi's SDK helper fixtures (test/parity/sdk-bulk): modifier combos joined by "/", e.g. "Alt+X/Ctrl+Shift+F5/Alt+/".
  '''^(?i)(?:(?:ctrl|shift|alt|meta|super|cmd)\+)*(?:escape|enter|tab|up|down|left|right|f\d{1,2}|[a-z0-9]|/)(?:/(?:(?:ctrl|shift|alt|meta|super|cmd)\+)*(?:escape|enter|tab|up|down|left|right|f\d{1,2}|[a-z0-9]|/))+$''',
  # A malformed owner cookie in apps/p2/plugins/devices/contract/owner_access_test.go ("p2_owner_<port>=bad"; the rejected input of a test).
  '''^p2_owner_8788=bad$''',
  # A fixture secret in apps/p2/plugins/login/tui/tui_test.go (the value the test types into the sign-in form and checks is not echoed).
  '''^sk-fixture-SECRET-42$''',
]
paths = [
  # Stored archive fixture: "key" fields are UUIDv7 document keys, not credentials.
  '''^chord/next/host/testdata/schema-switch/stored/archive\.jsonl$''',
  # Upstream test-file SHA-256 digests. The tables lived at parity/upstream-sync/ before they moved under test/;
  # a full-history scan (the push-event run) still reads them there, e.g. the digest of the upstream test
  # 6324-branch-summary-ambient-auth, which generic-api-key reads as a key.
  '''^(?:test/)?parity/upstream-sync/[^/]+\.tsv$''',
  # Pi's vendored, compiled SDK bundle (upstream code shipped verbatim).
  '''^coding/extension/host/subprocess/runtime-node/shims/pi-dist/pi-ai/sdk-bundle/[^/]+\.js$''',
  # SHA-256 digests of Pi's vendored provider data files.
  '''^coding/extension/host/subprocess/runtime-node/shims/pi-dist/pi-ai/providers/data/\.manifest\.json$''',
  # Generated SHA-256 shape hashes. A gitleaks v8.24.3 directory scan (detect --no-git)
  # reports the first 40 hex digits of one shapeHash as a sourcegraph-access-token;
  # the git-mode scan that CI runs does not.
  '''^test/parity/interfaces/upstream-v0\.87\.1\.json$''',
]
